engineVersion: "0.1"
rules:
  - id: orphan-entities
    severity: warn
    description: Entities that are defined but never referenced by any relation (source or target).
    find:
      all: true
    filter:
      # A fitness function is a statement about the whole model and is complete without an
      # inbound reference, so "never referenced" is the wrong sentence for it. The
      # recommendation it does deserve is `fitness-function-unattached`, which a project can
      # turn off on its own without losing orphan detection everywhere else.
      type_not_in: [Missing, CodeFile, FitnessFunction]
    check:
      has_relation:
        direction: any
        exists: true
    message: '{type} "{displayId}" ({name|''unnamed''}) is never referenced by any other entity.'
