engineVersion: "0.1"
rules:
  - id: exchange-missing-payload
    severity: warn
    description: >-
      An operation that declares an `exchange` (transport binding) should also declare a `payload`
      whose `schema` names the data model carried over that transport. A transport with no payload
      model is an incomplete contract — the wire is known, the message is not. Override per-project
      via .blueprint-lint.yaml.
    # Subjects: every Operation. Healthy = the op has NO exchange, OR it declares a payload model
    # (payload.schema is a model_ref). Emits only when an exchange is present but the model is not.
    find:
      entity_type: Operation
    check:
      any_of:
        - not:
            any_non_empty:
              - data.exchange
        - any_non_empty:
            - data.payload.schema
    message: 'Operation "{displayId}" ({name|''unnamed''}) declares an exchange but no payload model — define `payload.schema` (the data model carried over the transport).'
