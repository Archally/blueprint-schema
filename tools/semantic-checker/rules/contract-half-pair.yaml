engineVersion: "0.1"
# A coupling that crosses no wire has both of its ends inside the model. These rules hold it to
# that, and they are deliberately scoped to the three kinds where the claim is true.
#
# WHY NOT THE WIRE KINDS. An HTTP API can have a caller nobody modelled - a browser, a partner, a
# script - so an `expose:` with no matching `call:` is the normal state of a public surface rather
# than an omission. Applied there, this shape would fire on every externally-facing operation in
# every model. A call inside one process, a store two services share, and a transfer between two
# of them cannot have an end outside the model: something in here writes, and something in here
# reads. So the question "is this pair half-declared?" is decidable for these three and for no
# others.
#
# The one legitimate firing is an entry point that was never modelled as a service - a scheduler, a
# console command, a test harness. The fix is to model it, or to stop declaring the half that is
# there; a contract stating one end of a two-ended fact is a claim the model cannot support.
#
# An in-process operation has a second kind of caller beside a consuming service: the service that
# provides it may start it itself, from a message it hears, on an actor's initiative, or by raising
# it from another operation it provides. The two
# in-process provider rules read that through `inprocess-reach.mjs`, because whether a trigger
# reaches a service is a path through the contracts, and a declarative check tests one relation.
# Warnings, all of them, for the whole line. Override per-project via .blueprint-lint.yaml.
rules:
  - id: inprocess-consume-without-provide
    severity: warn
    description: >-
      An operation consumed in-process that no service provides in-process. The consumer declared a
      dependency on something the model does not say anyone owns, so nothing pairs the two ends and
      no dependency edge is drawn between their contexts. Fix by declaring the owner's
      `contracts.inprocess.provide`, or by removing the `consume:` entry if the call does not exist.
    find:
      entity_type: Operation
    check:
      any_of:
        - has_relation:
            direction: in
            type: contract_consumes
            exists: false
        - has_relation:
            direction: in
            type: contract_provides
            exists: true
    message: 'Operation "{displayId}" ({name|''unnamed''}) is consumed in-process and provided by nobody. Declare the owning service''s `contracts.inprocess.provide`, or drop the `consume:` entry.'

  - id: inprocess-provide-without-consume
    severity: warn
    description: >-
      An operation provided in-process that nothing in the model starts. Four things start one:
      another service consumes it (`contracts.inprocess.consume`); an operation its providing
      service provides under `expose:`, `send:` or `provide:` `produces` it, as a command produces
      the domain event its aggregate raises; it reacts to an operation that reaches its providing
      service, which the service receives in a contract's `receive:` or raises by providing it or
      providing an operation that `produces` it; or an actor initiates it (`initiated_by`). A
      producer that another service provides starts nothing here. A service that lists its own operation under `consume:` states nothing, so
      that entry starts nothing and is never reported. An operation that reacts only to triggers its
      service does not hear is reported once, by `inprocess-reaction-unreached`, which names the
      trigger. Where nothing starts the operation, either a caller exists and is not modelled, or
      the operation is reached some other way and the in-process contract states a coupling that is
      not there. An operation genuinely reachable only from outside belongs under the contract kind
      that names how it is reached.
    find:
      entity_type: Operation
    check:
      custom:
        module: ./inprocess-reach.mjs
        export: inprocessProvideWithoutConsume
    message: 'Operation "{displayId}" ({name|''unnamed''}) is provided in-process and nothing in the model starts it: no other service consumes it, no operation its service provides produces it, it reacts to nothing its service receives or raises, and no actor initiates it. Model the caller, or drop the `provide:` entry.'

  - id: inprocess-reaction-unreached
    severity: warn
    description: >-
      An operation provided in-process that reacts to an operation none of its providing services
      hears. A service hears what it receives in a contract's `receive:` and what it raises: an
      operation it provides under `expose:`, `send:` or `provide:`, or one that such an operation
      `produces`. The reaction is modelled on a service that never learns its trigger happened, so
      either the service's `receive:` list is missing the trigger, or the operation is provided by
      the wrong service. One finding per operation, naming every trigger that does not reach it. A
      trigger that resolves to no declaration is left to the cross-reference error.
    find:
      entity_type: Operation
    check:
      custom:
        module: ./inprocess-reach.mjs
        export: inprocessReactionUnreached
    message: 'Operation "{displayId}" ({name|''unnamed''}) reacts to "{trigger}", which its providing service {service} neither receives nor raises. Add "{trigger}" to that service''s `receive:` list, or provide the operation from the service that hears it.'

  - id: shared-document-read-without-writer
    severity: warn
    description: >-
      A document read out of a shared store or a scheduled transfer that no service writes. The
      reader is bound to a schema the model does not say anyone produces, which is the coupling this
      kind exists to make visible stated with its subject missing. Fix by declaring the producing
      service's `write:`, or by removing the `read:` entry.
    find:
      entity_type: Operation
    check:
      any_of:
        - has_relation:
            direction: in
            type: contract_reads
            exists: false
        - has_relation:
            direction: in
            type: contract_writes
            exists: true
    message: 'Operation "{displayId}" ({name|''unnamed''}) is read from a shared store or a transfer that nobody writes. Declare the producing service''s `write:`, or drop the `read:` entry.'

  - id: shared-document-write-without-reader
    severity: warn
    description: >-
      A document written into a shared store or a scheduled transfer that no service reads. A store
      nobody reads is not an integration, and the contract kind claims one - so either the reader is
      unmodelled, or what is really being described is this service's own persistence, which is not
      a contract at all.
    find:
      entity_type: Operation
    check:
      any_of:
        - has_relation:
            direction: in
            type: contract_writes
            exists: false
        - has_relation:
            direction: in
            type: contract_reads
            exists: true
    message: 'Operation "{displayId}" ({name|''unnamed''}) is written into a shared store or a transfer that nobody reads. Model the reader, or drop the `write:` entry if the store is this service''s own.'
