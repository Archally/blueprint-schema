engineVersion: "0.1"
rules:
  - id: unbound-operation
    severity: warn
    description: >-
      An operation (command / query / event) belongs to exactly the bounded context(s) whose
      services provide it (expose ∪ send ∪ provide ∪ write), with the deprecated domain-file name/scope
      heuristic as a fallback. The model-builder materializes that membership as
      a `handled_by` edge (Operation → BoundedContext). An operation with NO `handled_by` edge is
      UNBOUND: nothing provides it and no context name/scope matches it, so it renders on
      no context's canvas and its transport surface is unspecified. Fix by declaring it under the
      contract kind that matches how the operation is reached: `expose:` or `send:` where there is a
      wire, `contracts.inprocess.provide` where the call is in-process and there is none, and
      `write:` on a `shareddata` or `scheduledtransfer` contract where the service produces the
      document another one reads. Where the service CONSUMES the operation rather than owning it,
      the consumer verb of the same kind is the declaration, and the binding comes from whoever
      provides it - a dependency declared as a provision gives the operation to the wrong context.
      An operation with no channel must never be given one to silence this rule - a
      fabricated transport is drawn by every downstream diagram. Aligning the domain-file
      `name:`/`scope:` also binds, and is deprecated. The rule is ADVISORY, and stays advisory: an
      operation can be unbound because the author has not declared the binding yet, because the
      context it belongs to is named but not modelled, or because the solution side does not exist
      yet. Only the first is a defect, and a rule cannot tell them apart, so the finding is a
      question for the author rather than a verdict. Override per-project via .blueprint-lint.yaml
      (e.g. `unbound-operation: off`).
    find:
      entity_type: Operation
    # handled_by edge points Operation → BoundedContext, so a bound op has an OUTGOING handled_by.
    check:
      has_relation:
        direction: out
        type: handled_by
        exists: true
    message: 'Operation "{displayId}" ({name|''unnamed''}) is unbound - no bounded context provides it via expose/send/provide/write and no name/scope match. Expose or send it from the owning service''s contract when it has a transport; declare it under `contracts.inprocess.provide` when the call is in-process, or under a `shareddata` / `scheduledtransfer` `write:` when the service produces a document another one reads.'
