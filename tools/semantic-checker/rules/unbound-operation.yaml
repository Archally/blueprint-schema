engineVersion: "0.1"
rules:
  - id: unbound-operation
    severity: warn
    description: >-
      An operation (command / query / event) belongs to exactly the bounded context(s) whose
      services provide it (expose ∪ send ∪ handles), with the deprecated domain-file name/scope
      heuristic as a fallback (v2.7.6 D14/D15). The model-builder materializes that membership as
      a `handled_by` edge (Operation → BoundedContext). An operation with NO `handled_by` edge is
      UNBOUND: nothing provides it and no context name/scope matches it, so it renders on
      no context's canvas and its transport surface is unspecified. This is the "silent empty
      canvas" gap (D1): pre-CR the binding was recomputed inside one resolver where no validator
      could see it. Fix by declaring it: `expose:` or `send:` on the owning service's contract when
      there is a transport, `handles:` on the service itself when the call is in-process and there
      is none. An operation with no channel must never be given one to silence this rule - a
      fabricated transport is drawn by every downstream diagram. Aligning the domain-file
      `name:`/`scope:` also binds, and is deprecated. Advisory in v2.7.x; promoted to error in v2.8
      (D5). Override per-project via .blueprint-lint.yaml (e.g. `unbound-operation: off`).
    find:
      entity_type: Operation
    # handled_by edge points Operation → BoundedContext, so a bound op has an OUTGOING handled_by.
    check:
      has_relation:
        direction: out
        type: handled_by
        exists: true
    message: 'Operation "{displayId}" ({name|''unnamed''}) is unbound - no bounded context provides it via expose/send/handles and no name/scope match. Expose or send it from the owning service''s contract when it has a transport; declare `handles:` on the service when the call is in-process.'
