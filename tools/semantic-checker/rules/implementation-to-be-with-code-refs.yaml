engineVersion: "0.1"
rules:
  - id: implementation-to-be-with-code-refs
    severity: info
    description: >-
      An element that says it does not exist yet, but names code, is either partly built or
      mislabelled. A reference can point at the place the element will live, at a predecessor it
      replaces, or at a first landed slice, and only the last of those makes the marker wrong. A
      reference with role `planned` states the first case in data: the file is where the element
      is to be built, and the element is not in it yet. An element that names a planned place is
      not reported, whatever else it names beside it; one whose `code_refs` or `iac_refs` name no
      planned place is reported at info, because the reader decides which case it is. `wip` is the
      value for a partial implementation, `as-is` for a finished one. No rule reports `wip`,
      because both evidence states are legitimate for it. Override per-project via
      .blueprint-lint.yaml (e.g. `implementation-to-be-with-code-refs: off`).
    find:
      all: true
    filter:
      field_eq:
        data.implementation: to-be
    check:
      custom:
        module: ./implementation-to-be-with-code-refs.mjs
        export: toBeWithCodeRefs
    message: 'Element "{displayId}" ({name|''unnamed''}) is marked to-be but names {references} code or iac reference(s), none with role planned. If the code is landing, set implementation to wip; if it is done, as-is; if a reference points where the element is to be built, give it role planned.'
