engineVersion: "0.1"
rules:
  - id: missing-causal-links
    severity: warn
    description: Commands state a nonempty outcome through produces, materializes or side_effects.writes.
    find:
      entity_type: Operation
    check:
      custom:
        module: ./command-outcomes.mjs
        export: commandHasOutcome
    message: 'Command "{displayId}" ({name|''unnamed''}) states no outcome. State produces, materializes or side_effects.writes.'
