engineVersion: "0.1"
rules:
  - id: aggregate-root-signals
    severity: info
    description: >-
      An aggregate root that no command reaches. An aggregate root is the entry point for commands,
      and a command reaches one when it names the root in `materializes`, or names a rule about the
      root in `governed_by`, `preconditions` or `postconditions`; a rule is about a root when its
      `concepts` list or its `concept` names it. Only an operation of `kind: command` counts: a query
      governed by such a rule, or an event that materializes the root, does not reach it. A root no
      command reaches is modelled ahead of the commands that change it, or is not an aggregate root.
      One finding per root. The message also says whether the root declares `states` and whether it
      owns a `contains` relationship; neither is required, and neither raises nor silences the
      finding. INFO by default, because it is a modelling heuristic rather than a defect. Override
      per-project via .blueprint-lint.yaml (e.g. `aggregate-root-signals: warn`, or `off`).
    find:
      entity_type: Concept
    filter:
      field_eq:
        data.stereotype: aggregate-root
    check:
      custom:
        module: ./aggregate-root-signals.mjs
        export: aggregateRootCommandEntry
    message: 'Concept "{displayId}" ({name|''unnamed''}) is an aggregate root that no command reaches. It {states} and {contains}. Name it in the `materializes` of the command that creates or changes it, or name the rule it obeys in that command''s `governed_by`.'
