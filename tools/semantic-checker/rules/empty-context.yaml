engineVersion: "0.1"
rules:
  - id: empty-context
    severity: warn
    description: >-
      A bounded context that declares services and handles no operation. Membership is the
      materialized `handled_by` edge (Operation -> BoundedContext), bound by a service contract's
      `expose`/`send`, by `handles:` on the service, or by the domain-file name/scope fallback; a
      context with services and no incoming `handled_by` renders as a canvas with boxes and nothing
      on them. A context that declares NO services is out of scope: it is a boundary the model names
      rather than builds, and it handles nothing by construction. Advisory rather than an error, for
      the same reason `unbound-operation` is: a context is empty for three reasons and only one is a
      defect - the author has not bound its operations yet, the context is a library or an API client
      that provides nothing, or the operations are not modelled yet - and this check cannot tell
      them apart. An error clearable only by inventing an operation would select for invented
      operations. Override per-project via .blueprint-lint.yaml (e.g. `empty-context: off`).
    find:
      entity_type: Context
    # Satisfied when the context declares no service (no outgoing `contains`), or when at least one
    # operation is bound to it (an incoming `handled_by`). Reported otherwise.
    check:
      any_of:
        - has_relation:
            direction: out
            type: contains
            exists: false
        - has_relation:
            direction: in
            type: handled_by
            exists: true
    message: 'Context "{displayId}" ({name|''unnamed''}) declares services and handles no operation - nothing is bound to it by a contract''s expose/send, by handles:, or by a domain file''s name/scope. If it provides nothing by design (a library, an API client), that is what its services'' contracts should say; otherwise bind the operations it handles.'
