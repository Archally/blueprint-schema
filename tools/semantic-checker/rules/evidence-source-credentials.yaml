engineVersion: "0.1"
rules:
  - id: evidence-source-credentials
    severity: warn
    description: >-
      An evidence source that parses as an absolute URL with a non-empty username or password.
      Checks both flat evidence and provenance.evidence on every entity, including test cases.
      One warning names the entity and all affected zero-based item paths, without repeating the
      URL or its credentials. Plain text, malformed URLs and URLs without userinfo are silent.
      Remove credentials from the source in the model; validation does not rewrite it and the
      renderer continues to show it as written. Override per project via .blueprint-lint.yaml
      (e.g. `evidence-source-credentials: off`).
    find:
      all: true
    check:
      custom:
        module: ./evidence-source-credentials.mjs
        export: evidenceSourceCredentials
    message: 'Entity {subject} has credentials in an evidence source URL at {paths} (zero-based indices). Remove the credentials from the source in the model; outputs show it as written.'
