engineVersion: "0.1"
rules:
  - id: fitness-function-unattached
    severity: warn
    description: >-
      A fitness function (FF###) states a constraint about the architecture as a whole, so unlike
      most entities it is complete on its own: nothing has to point at it for it to mean something.
      What an unattached one loses is its reason. A fitness function that names what it protects in
      `verifies` (the SLOs, KPIs, security, compliance and resilience requirements and goals it
      guards) says why it is enforced, and an impact query from any of them reaches it. One that
      names its `metric` says which measure its assertion is evaluated on. One named by a leverage
      point's `fitness_function_refs` is the guardrail on a change someone decided to make. One
      attached to nothing states a rule whose motive lives outside the model, where it cannot be
      reviewed when the rule stops being worth enforcing.
      So this is a recommendation rather than a defect. Healthy = at least one relation in either
      direction: a `verifies` or `metric` reference, a leverage point's `fitness_function_refs`, or
      a `code_refs` entry. Override per project via .blueprint-lint.yaml (e.g.
      `fitness-function-unattached: off`).
    find:
      entity_type: FitnessFunction
    check:
      has_relation:
        direction: any
        exists: true
    message: 'Fitness function "{displayId}" ({name|''unnamed''}) is attached to nothing. It is legal on its own; consider naming what it protects in `verifies`, the measure its assertion reads in `metric`, or the leverage point whose change it guards, so the model says why the rule is enforced.'
