engineVersion: "0.1"
rules:
  - id: undescribed-event
    severity: warn
    description: >-
      A domain event is the fact the rest of the model reacts to, and its name alone rarely carries
      the fact. The observed failure shape is asymmetric `one_of` pairs — the happy-path half
      (`LoanIssued`) described, the failure counterpart (`LoanRefused`) left bare — which reads as
      complete until a consumer has to decide when the second one fires. Accepts any of
      `description` / `statement` / `summary` (D11): several models carry the prose under `summary`
      and are legitimately complete. Companion to the `domain.event.description` quality-gate
      metric, which additionally rejects filler and name-echoes; this rule only asks whether prose
      exists at all, so a green rule and a red metric are consistent, not contradictory.
    find:
      entity_type: Operation
    filter:
      field_eq:
        data.kind: event
    check:
      any_non_empty:
        - data.description
        - data.statement
        - data.summary
    message: 'Event "{displayId}" ({name|''unnamed''}) has no description — state the fact that has happened, especially for the failure half of a one_of pair.'
