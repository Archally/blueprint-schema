version: "1.0.0"
name: Orders architecture
scope: orders
contexts:
  - id: orders.BC001
    name: Orders
    kind: core
    services:
      - id: orders.SVC001
        name: Order Service
        kind: service
        resource_refs: [IR001, IR002]
        contracts:
          shareddata:
            contract_name: order-ledger
            write: [orders.DOC001]
            store_ref: IR001
            link_provenance:
              store_ref:
                IR001:
                  certainty: confirmed
                  evidence:
                    - kind: codebase-analysis
                      source: orders/ledger-repository.sql
                      date: "2026-11-10"
                      summary: The order service inserts ledger rows into the order database.
      - id: orders.SVC002
        name: Reporting Service
        kind: service
        contracts:
          shareddata:
            contract_name: order-ledger
            read: [orders.DOC001]
            store_ref: IR001
