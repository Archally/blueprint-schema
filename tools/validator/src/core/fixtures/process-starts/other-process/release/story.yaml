version: "1.0.0"
name: Release stories
scope: release
processes:
  - id: release.PRC001
    title: Release a change
    description: A change reaches production, whichever side of the system is ready first.
    triggers:
      - type: manual
        to: release.PA011
    activities:
      - id: release.PA001
        name: Prepare the release
      - id: release.PA002
        name: Verify the release
  - id: release.PRC002
    title: Roll back a change
    description: A change is taken out of production.
    activities:
      - id: release.PA011
        name: Restore the previous version
