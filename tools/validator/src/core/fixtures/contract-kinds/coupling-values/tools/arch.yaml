version: "1.0.0"
name: Tools architecture
scope: tools
parties:
  - id: tools.PRT001
    name: Toolsmith
    kind: system
    contexts:
      - id: tools.BC001
        name: Model Tools
        kind: core
        services:
          - id: tools.SVC001
            name: Model Server
            kind: service
            contracts:
              mcp:
                contract_name: model-tools
                expose: [tools.CMD001]
          - id: tools.SVC002
            name: Project Server
            kind: service
            contracts:
              mcp:
                contract_name: model-tools
                expose: [tools.QRY001]
          - id: tools.SVC003
            name: Tool Command
            kind: cli
            contracts:
              cli:
                contract_name: tool-cli
                expose: [tools.CMD001, "tools:renderModel"]
      - id: tools.BC002
        name: Automation
        kind: support
        # Backed by the mcp and cli contracts below, so it declares no coupling.
        dependencies:
          - name: Model Tools
            bounded_context_ref: tools.BC001
            relationship: customer-supplier
        services:
          - id: tools.SVC004
            name: Assistant
            kind: service
            contracts:
              mcp:
                contract_name: assistant-tools
                call: [tools.CMD001, tools.QRY001]
              cli:
                contract_name: assistant-scripts
                call: [tools.CMD002]
      - id: tools.BC003
        name: Nightly Jobs
        kind: support
        # No contracts: the declared coupling is the only source.
        dependencies:
          - name: Model Tools
            bounded_context_ref: tools.BC001
            relationship: conformist
            coupling: cli
      - id: tools.BC004
        name: Dashboard
        kind: support
        dependencies:
          - name: Model Tools
            bounded_context_ref: tools.BC001
            relationship: customer-supplier
            coupling: graphql
          - name: Model Tools
            bounded_context_ref: tools.BC001
            relationship: customer-supplier
            coupling: mcp
