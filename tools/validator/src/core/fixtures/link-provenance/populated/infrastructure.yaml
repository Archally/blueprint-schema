version: "1.0.0"
name: Shop infrastructure
environments:
  - id: ENV001
    name: Production
    env_class: production
resources:
  - id: IR001
    kind: broker
    name: Order Event Bus
    relations:
      - type: hosted_on
        target: IR003
        provenance:
          certainty: confirmed
          evidence:
            - kind: codebase-analysis
              source: deploy/broker/main.tf
              date: "2026-11-03"
              summary: The broker runs as a workload on the shop cluster.
  - id: IR002
    kind: database
    name: Orders Database
    relations:
      - type: hosted_on
        target: IR003
      - type: attaches_to
        target: IR005
        provenance:
          discovery_stage: validated
  - id: IR003
    kind: cluster
    name: Shop Cluster
  - id: IR004
    kind: gateway
    name: Edge Load Balancer
    hosting_model: network-link
    relations:
      - type: connects_to
        target: IR002
        outputs: [host, port]
        provenance:
          certainty: probable
          evidence: []
      - type: depends_on
        target: IR003
        provenance:
          evidence:
            - kind: assumption
              summary: The load balancer is expected to start after the cluster.
      - type: routes_to
        target: IR003
        provenance:
          certainty: speculative
      - type: routes_to
        target: SVC001
        provenance:
          discovery_stage: committed
          certainty: confirmed
          evidence:
            - kind: stakeholder-signoff
              source: Platform team review
              date: "2026-11-06"
              summary: The platform team confirmed the load balancer forwards to the order API.
  - id: IR005
    kind: volume
    name: Orders Volume
bindings:
  - id: BND001
    type_ref: RT001
    need_ref: orders-db
    environment_ref: ENV001
    resource_ref: IR002
    module:
      ref: modules/postgres
    provenance:
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: deploy/orders/main.tf
          date: "2026-11-03"
          summary: The production stack instantiates the postgres module for the orders database.
  - id: BND002
    type_ref: RT001
    need_ref: orders-cache
