version: "1.0.0"
scope: orders
metrics:
  - id: orders.MT001
    name: Order placement latency
    type: latency
    unit: ms
    measures:
      operations: [orders.CMD001]
  - id: orders.MT002
    name: Orders placed per hour
    type: business
    unit: orders/hour
kpis:
  - id: orders.KPI001
    name: Orders placed per hour
    metric: orders.MT002
    target: "> 1000 orders/hour"
    objective:
      comparator: gt
      value: 1000
      statistic: mean
    window: calendar month
    thresholds:
      warning: "800 orders/hour"
      critical: "500 orders/hour"
