version: "1.0.0"
scope: delivery
goals:
  - id: delivery.GL001
    statement: Every parcel is delivered within a day.
    priority: high
non_goals:
  - id: delivery.NG001
    statement: Same-hour delivery.
    reason: The couriers work one round a day.
risks:
  - id: delivery.RSK001
    statement: The nightly export slows the courier app.
    likelihood: medium
    impact: high
    mitigation: Export from a replica.
assumptions:
  - id: delivery.ASM001
    statement: The replica lags by less than a minute.
    consequence: The export misses the last parcels of the day.
trade_offs:
  - id: delivery.TRO001
    choice: Where the export reads from
    selected: A replica
    rejected: The primary database
    rationale: The primary database serves the courier app.
concerns:
  - id: delivery.CNC001
    statement: Couriers lose time on paper notes.
inquiries:
  # Every family of typed ids, one element each, pinned by one inquiry.
