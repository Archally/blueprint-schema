        notes: "The traceability map names the three new reference positions, and the migration section describes the business case and its totals."
  - version: "2.8.94"
    date: "2026-11-14"
    step: "a capability lists the products it is available in"
    summary: |
      A model can declare the products its capabilities are built into, and a capability can state
      the products it is available in.

      - `products` in `blueprint.yaml`, beside `domains`: the product registry. Each entry has an
        `id`, PDT followed by three or more digits, model-wide and with no context prefix; a `name`
        on one line without surrounding whitespace; and an optional `description` that states
        something. No other property is accepted, and a product contains no other product.
      - `products` on a capability: the products it is available in, a list of product ids, each
        listed once. A capability may be available in several products, so counts per product can
        overlap. Without the field, a capability takes the whole list of the nearest capability
        above it in `children` that states one. A stated list replaces the inherited list instead
        of adding to it, and an empty list is a stated replacement that assigns no product. When
        neither the capability nor any capability above it states a list, its products are not
        stated.
      - `product_ref` in the metamodel: the reference both fields use, `^PDT\d{3,}$`.

      A product id resolves like every other reference: a capability naming an id the registry does
      not declare is a cross-reference error, and an id declared twice is a duplicate. For example:

          # blueprint.yaml
          products:
            - id: PDT001
              name: Storefront
            - id: PDT002
              name: Marketplace
              description: Lets third-party sellers list and ship their own goods.

          # capability.yaml
          capabilities:
            - id: CAP001
              name: Order Management
              level: 1
              products: [PDT001, PDT002]
              children:
                - id: CAP002
                  name: Order Capture
                  level: 2
                - id: CAP003
                  name: Seller Payouts
                  level: 2
                  products: [PDT002]

      Order Capture is available in both products, from Order Management; Seller Payouts replaces
      that list and is available in the Marketplace only.

      BACKWARD: every document valid under 2.8.93 is valid under 2.8.94. Not FORWARD: a 2.8.93
      validator rejects a root `products` registry and a capability carrying `products`. No
      instance migration is needed. Minted rather than folded into 2.8.93 because the set of
      accepted documents changes.
    changes:
      - kind: add
        semver: minor
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/product_ref"
        notes: "Pattern `^PDT\\d{3,}$`: a product declared in the root registry, model-wide with no context prefix."
      - kind: add
        semver: minor
        target: "schema/v2.8/blueprint.schema.yaml#/properties/products"
        notes: "Optional root registry beside `domains`: a list of `$defs/product`."
      - kind: add
        semver: minor
        target: "schema/v2.8/blueprint.schema.yaml#/$defs/product"
        notes: "Closed object with required `id` (`product_ref`) and `name` (one line, no surrounding whitespace) and an optional `description` holding a visible character."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/capability.schema.yaml#/$defs/capability/properties/products"
        notes: |
          Optional unique list of `product_ref`, with no minimum length and no default. The
          description states the inherited list through `children`, its replacement by a stated
          list, and the empty list as a stated replacement.
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "The id pattern registry names the product band, `PDT\\d{3,}`, and the cross-layer reference table names `capability.products`."
  - version: "2.8.93"
    date: "2026-11-14"
    step: "a service states its role and what it routes to"
    summary: |
      A service can state the responsibility it takes in front of other services and the services
      it forwards requests to, and an infrastructure resource can route requests to a service.

      - `role` on a service: `gateway`, an entry point that receives requests from clients and
        forwards them to backend services, or `bff` (backend for frontend), a gateway dedicated to
        one frontend or client experience. The values are the new metamodel vocabulary
        `service_role`. Optional, with no default, and accepted on every `kind`; the role leaves the
        kind as it is, so a gateway can be `kind: api` and an edge function that forwards requests
        is `kind: function` with `role: gateway`. Running at the network edge is a placement,
        stated by the `edge` substrate of an environment or deployment scope, not a role. No role
        is inferred from a name, a kind or a tag.
      - `routes_to` on a service: the services it forwards requests to, a list of exact service
        references, each listed once. It states forwarding and nothing else (not the protocol, the
        operations, authentication or deployment), and contracts written later do not replace it.
        A runtime dependency that is not forwarding, such as a token check against an identity
        service, stays in `uses`. An absent or empty list states only that the model names no
        targets, not that the service forwards nothing.
      - An infrastructure relation of `type: routes_to` may name a service (SVC###) as its
        `target`, as a bought API gateway or load balancer does for the services behind it. Every
        other verb still names a resource, and a `routes_to` to a resource keeps its `outputs`. A
        relation whose target is a service carries no `outputs`, not even an empty list, because a
        service publishes no resource outputs. A resource type (RT###) or a third-party package
        (PKG###) is never a target.

      Architecture and C4 views retain a service's kind while showing its Gateway or BFF role.
      Authored forwarding reaches exact backend service ids and is distinct from runtime dependencies
      and imports. Infrastructure maps show service route endpoints separately from resources;
      placement follows resource intent and remains unknown when the model does not state it.

      Both references resolve like every other reference: an id that names nothing declared is a
      cross-reference error, and a target written without the scope prefix its declaration carries
      resolves to nothing. For example:

          services:
            - id: mobile.SVC001
              name: mobile-bff
              kind: api
              role: bff
              routes_to: [orders.SVC001]
              uses: [identity.SVC002]

          resources:
            - id: IR001
              kind: api-gateway
              name: Public gateway
              relations:
                - type: routes_to
                  target: mobile.SVC001

      The BFF forwards business requests to the orders service and checks tokens with the identity
      service; the bought gateway forwards to the BFF.

      BACKWARD: every document valid under 2.8.92 is valid under 2.8.93. Not FORWARD: a 2.8.92
      validator rejects a service carrying `role` or `routes_to`, and a resource relation routing
      to a service. No instance migration is needed. Minted rather than folded into 2.8.92 because
      the set of accepted documents changes.
      This release also exempts entries with `kind: feature` from the informational
      `capability-nested-deeper-than-two-levels` rule at every depth: a feature sits one level
      below the capability it serves. Capabilities, including entries with omitted `kind`,
      retain the nesting diagnostic. Schema acceptance is unchanged by this exemption.
      Residual risk of the fold: version 2.8.93 describes two checker states with identical
      schema acceptance while the release is untagged and unported.
      Authored forwarding appears as `routes_to` graph edges from services to services and from
      infrastructure resources to services or resources, resolving exact declared ids. Reverse
      impact reaches built and bought gateways. Routing states neither placement nor resource intent.
      Archally Pro's `bp check` reports warning-level advisories: `gateway-without-route` for a
      gateway or BFF naming no targets, `routes-target-is-library` for a resolved route to a declared
      library, and `routes-restates-uses` at each redundant `uses` entry. Unresolved authored routes
      retain their reference errors without an additional missing-route warning.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/service_role"
        notes: "Enum `gateway`, `bff`: the responsibility a service takes in front of other services, independent of `service_kind`."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/service/properties/role"
        notes: "Optional `service_role`, no default, on every service kind."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/service/properties/routes_to"
        notes: "Optional unique list of `service_ref`: the services this one forwards requests to. An empty list is accepted."
      - kind: docs
        semver: none
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/service/properties/uses"
        notes: "The description states that a service this one forwards requests to belongs in `routes_to`."
      - kind: change
        semver: patch
        target: "schema/v2.8/design/infrastructure.schema.yaml#/$defs/infra_relation_edge"
        notes: |
          `target` accepts `infra_resource_ref` or `service_ref`. A conditional keeps every verb
          other than `routes_to` on a resource target, with the error at `target`, and refuses
          `outputs` on a relation whose target is a service, with the error at `outputs`. The edge,
          `target`, `outputs` and resource `relations` descriptions state both.
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "The relationship table names `service.routes_to` and a resource's `routes_to` relation to a service."
  - version: "2.8.92"
    date: "2026-11-14"
    step: "a use case step states its order"
    summary: |
      A step of a use case's main scenario can state which steps must be finished before it
      starts, whether it may be skipped, whether it may happen more than once, and the business
      rule behind a constraint on it. Five optional fields, on main scenario steps only:

      - `id`: UCS followed by 3 or more digits, with no context prefix. Unique within its main
        scenario; another use case may use the same identifier. It names a step, not an entity.
      - `after`: the ids of the steps of the same scenario that must be finished first, each
        listed once; every one is required. When present it replaces the default predecessor, the
        step listed immediately before. An empty list states that the step needs no predecessor.
      - `optional`: true or false; omitted means the step happens. A skipped optional step counts
        as finished for the steps that follow it, is recorded as skipped rather than done, and
        does not perform its operation.
      - `repeat`: true or false; omitted means once. True means one or more times until the actor
        finishes the step, or zero or more together with `optional: true`. The steps that follow
        it start after its last repetition; a repetition is not a return to an earlier step.
      - `rule`: a rule reference, resolved like every other rule reference. It documents the
        reason for a constraint and does not make the scenario enforce the rule.

      A step without `after` follows the step listed immediately before it, as every existing
      scenario reads. The list keeps its order for the reader, and `step` stays the label a reader
      sees and the anchor an alternative flow names; its value does not order the steps. Two steps
      with no required order between them happen in either order, one at a time: freedom of order
      is not concurrency, which a process states. Whether an `after` id names a step of the same
      scenario, and whether the order closes a cycle, are not checked by the schema.

      A user story's `operations` lists each operation once, and its order carries no meaning: a
      story states no order of work.

      BACKWARD for use cases: every use case valid under 2.8.91 is valid under 2.8.92, and older
      closed schemas reject a step carrying any of the five fields. NOT BACKWARD for user stories,
      stated rather than implied: a story listing one operation twice was accepted under 2.8.91
      and is rejected under 2.8.92. Such a story is fixed by removing the repeated entry; the order
      of the remaining list does not matter. No instance migration is provided. The published
      examples list no operation twice and validate unchanged. Minted rather than folded into
      2.8.91 because the set of accepted documents changes.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/use_case/properties/main_scenario/items"
        notes: |
          Optional `id` (use_case_step_id), `after` (a unique list of use_case_step_id, empty
          allowed), `optional` (boolean), `repeat` (boolean) and `rule` (the metamodel's
          rule_ref). The `main_scenario` and `step` descriptions state the default predecessor
          and that the list, not the number, orders the steps.
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/use_case_step_id"
        notes: "Pattern `^UCS\\d{3,}$`: a step identifier local to one main scenario, with no context prefix."
      - kind: change
        semver: major
        target: "schema/v2.8/design/story.schema.yaml#/$defs/user_story/properties/operations"
        notes: "`uniqueItems: true`; the description states that the list is a set and orders nothing."
      - kind: docs
        semver: none
        target: docs/2026-11-14-use-case-step-order.md
        notes: "How the order is read, with five examples: a sequence, two steps in either order, a step that waits for several, optional and repeated steps, and a rule link."
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "The id pattern registry names the use case step band, `UCS\\d{3,}`."
