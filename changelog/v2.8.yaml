    date: "2026-11-25"
    step: "prose fields accept any length in schema validation; length guidance lives in the quality gate"
    summary: |
      Twenty-two authored prose fields across twelve schema files (twenty `summary` fields,
      `concern.title` and `operation.examples[].description`) accept strings of any length without a
      schema `maxLength` constraint. Editorial length limits for text fields are reported as advisory
      warnings by the quality gate (soft limit and 1.5x upper advisory limit) rather than schema
      validation errors. The two integer `maxLength` property declarations in
      `design/models.schema.yaml` (`model_property.maxLength` and `field_definition.maxLength`)
      remain unchanged.

      BACKWARD, PATCH: every document valid under 2.8.107 remains valid under 2.8.108, and no
      instance migration is needed. Not FORWARD: validators predating 2.8.108 reject summaries
      longer than 200 characters or operation example descriptions longer than 255 characters. Minted
      as a new patch because the set of accepted documents grows.
