      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/message_channel/properties/provenance"
        notes: "Optional; a `$ref` to the shared `provenance`. Evidence for the broker stays in `link_provenance.broker_ref`."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/infrastructure.schema.yaml#/$defs/{resource,environment,deployment_scope}/properties/provenance"
        notes: "Optional; a `$ref` to the shared `provenance`. A plain-string environment carries none."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/infrastructure.schema.yaml#/$defs/access_grant/properties/provenance"
        notes: "Optional; a `$ref` to the shared `provenance`, on each grant of `resource.access`."
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "The section on link evidence names the five records that state their own evidence and says that it is not evidence for a link."
  - version: "2.8.99"
