# Blueprint Schema changelog - the 2.8 line.
#
# One file per MINOR version. Newest entry first; several entries may share a `version:`
# when one release landed in more than one step.
#
# The index, with every line and its status, is ../CHANGELOG.md.
entries:
  - version: "2.8.27"
    date: "2026-09-13"
    summary: >
      A service could already say what it publishes over a wire and what it calls over one. Three
      couplings that cross no wire had at most one end, so nothing paired them into a dependency,
      and the picture of a modular monolith came out empty.


      `contracts:` gains three kinds. `inprocess` takes `provide` and `consume` for a call inside one
      process and one deployment unit. `shareddata` takes `write` and `read` for a store one service
      writes and another reads - the Shared Database style, where the reader is bound to a schema it
      does not own. `scheduledtransfer` takes the same pair for a run on a schedule that moves data
      between two services, where the reader sees the writer's data as of the last run. All six verbs
      name `operation_ref`, as every existing contract verb does, so one derivation reads them all.


      On the two data kinds the WRITER is the provider even though it calls nobody: it owns the
      schema, and the derived dependency points from reader to writer.


      `inprocess` is the one kind that names no document. No notation describes a module's published
      interface in a transport-independent, hand-authorable form, so it carries no `file:`, no
      `contract_name` and no placement. The two data kinds keep all three, because the dataset they
      move is what a data contract describes.


      The transport-free provider verb now lives with the others. `service.provides` is withdrawn and
      its operations belong under `contracts.inprocess.provide`; the superseded `service.handles`
      keeps working for the rest of this line and names its new home. `coupling` gains `inprocess`,
      `shareddata` and `scheduledtransfer`, so a declared coupling and a derived one stay in one
      vocabulary. `dispatch` accepts `inprocess` beside `in-process`, spelling one concept as the
      contract kind spells it; both are read for the rest of this line.


      `schema-update` carries both migrations, so a model on either superseded spelling moves without
      a hand edit. Each keeps the author's own list form, comments, key order and line endings, each
      is idempotent, and each reports what it will not touch rather than guessing: a service already
      declaring `contracts.inprocess`, a `contracts:` or a `dispatch:` written in flow form, a
      `provides:` that has no replacement to move to, and a prose sentence naming either spelling.


      The checker gains six rules. Four report a half-declared pair - a consume with no provide, a
      read with no write, and each the other way round - scoped to the three kinds whose two ends are
      both inside the model. One reports an operation whose `dispatch` says in-process and names no
      provider, which is a stronger finding than an unbound operation carrying no `dispatch`. One
      compares a `shareddata` contract against the infrastructure both ends name, where both name
      any, and reports two services that share a contract and no store.


      A document declaring none of the new kinds is valid here exactly as it was under 2.8.26.

  - version: "2.8.26"
    date: "2026-09-13"
    summary: >
      `next[]` arrived in 2.8.23 and `next_activities[]` keeps working for the whole 2.8 line, so a
      model on the older key is correct rather than out of date. Moving between them was a hand edit
      until now.


      `schema-update` carries the migration. Each successor becomes a `to:` entry that can hold the
      condition taking that branch. A lone successor stays on its line, because a condition there
      chooses nothing; a fork expands to block style, because a fork is where a condition belongs
      and adding one to a flow mapping means restructuring it first. An empty list migrates as an
      empty list.


      It invents no condition. The older key carries none, so every entry arrives with `to:` alone
      and the reason is the author's to add. Comments, key order, quoting and line endings survive,
      because the module edits text rather than reparsing the document, and a second run plans
      nothing.


      An activity that would end up declaring `next` twice is left alone and named, since an
      activity declares one key or the other and never both.


      Tooling only. The schema is unchanged and every document valid under 2.8.25 is valid here.

  - version: "2.8.25"
    date: "2026-09-12"
    summary: >
      The metamodel carries `x-gdsm.modeling_guidance`, a ledger of durable lessons about modelling
      with this suite, served on request rather than loaded into a session. It gains three entries.


      A `description:` that names a fallback, an inheritance, a default or a derivation is a claim
      about the builder and holds only while the builder does that; one that names a shape is
      decided by the schema itself.


      Acceptance is not reachability. The schema decides what a document may say and the extractor
      decides what travels on the graph, so a check written over a property the extractor drops
      passes against a fixture and returns nothing on every real model.


      Where a model states one proposition twice, the duplication is the defect rather than the
      disagreement, so it takes one rule id and one severity.


      Annotation only. No validation changes, no value is withdrawn, and every document valid under
      2.8.24 is valid here with the same meaning.

  - version: "2.8.24"
    date: "2026-09-12"
    summary: >
      `exchange-missing-payload` asks an operation that declares a transport to name the data
      model carried over it, and exempts a queue-based one, because a recurring or no-argument
      job legitimately carries no message.


      The exemption is decided by one condition, and the rule now states it as such: an
      `exchange.queue` that is non-empty. The protocol string is never consulted, so a vendor
      extension declaring a queue is exempt on exactly the same terms as a named transport, and
      an author reading the rule learns which key to write.


      Documentation only. No rule changes what it reports, and every document valid under 2.8.23
      is valid here with the same meaning.

  - version: "2.8.23"
    date: "2026-09-12"
    summary: >
      A process activity could name the activities it leads to and nothing else. It could not say
      what chooses between two of them, how several branches converge, or that it runs another
      process at this point. A model with a fork carried the fork and not the reason for it, and a
      process continuing in another document simply stopped.


      `next[]` supersedes `next_activities[]`. Each entry names the activity the branch leads to
      and may carry the `condition` that takes it, stated in the model's own terms rather than in a
      transport's. The older key keeps working for the whole 2.8 line and warns once per activity,
      naming its replacement; a model still using it is correct rather than out of date. Both
      shapes reach every consumer as one derived list, so two drawings of one process cannot
      disagree about where it goes.


      `gateway` says how an activity's outgoing branches relate and `join` says how the arriving
      ones converge - `and` for every branch, `xor` for exactly one, `or` for one or more. Both sit
      on the activity: a split is one fact about a whole set of branches rather than a property of
      any single one, and a merge is a fork read from the other end, which is why one vocabulary
      covers both directions.


      `calls_subprocess` names another process this activity runs. The called process keeps its own
      identity and its own activities, so processes that together describe one flow can be joined
      instead of each ending where its document does. A call naming no process is a cross-reference
      error: it draws no edge and invents no node.


      What the model states reaches what a reader sees. A branch condition labels the arrow on a
      process flowchart, and in a generated Arazzo workflow it becomes the criterion on the
      transition - the one criterion in such a workflow that came from the domain rather than from
      a status code or a response body.


      Additive. Every field is optional, no value is withdrawn, and a document valid under 2.8.22
      is valid here with the same meaning.

  - version: "2.8.22"
    date: "2026-09-12"
    summary: >
      A model records where it has been in one of two documents, and both now reach the graph.
      `migrations.yaml` is the register, an ordered list of entries written for a reader whose
      changes are prose. `<name>.migration.yaml` is a change program, one migration authored for
      execution with a typed target per change. Both were read and validated and then dropped, so
      asking a model about a migration it had itself recorded returned nothing.


      Both now produce a `Migration` node. One type for both, because the reader-facing facts are
      the same facts - an id, a name, when it happened, where it stands and what it touched - and
      `_genre` on the node says which document it came from. That is not decoration: the two
      `status` vocabularies are different vocabularies. `cancelled` means a migration never
      happened and `rolled-back` means it happened and was undone, so the two sets are kept
      verbatim rather than merged into one. `_impact` is the opposite case and is resolved, because
      the register spells the field `impact` and the change program `semver_impact` while both take
      the same values.


      A migration takes no plane. It is neither design nor governance, and its layer says so.


      Three edges, all from declared fields. `migration_depends_on` follows `depends_on`;
      `migration_relates_to_decision` follows `related_decisions`; and `migration_affects` is one
      coarse edge to every entity the migration names, agnostic to what the change does to it. The
      coarse form is deliberate: an edge saying a migration REMOVES an entity points at a node the
      graph expressing it does not contain, and the same objection in reverse applies to one that
      adds.


      An entity a migration names and the model does not hold produces no edge and no placeholder.
      A change program's `add` targets describe the model after the migration, so a target absent
      from the graph is the ordinary case rather than a broken reference.


      One consequence to expect in a report: a migration that names no entity and depends on
      nothing now stands alone in the graph, and `orphan-entities` says so. The register carries an
      `entity` field on every change for exactly this, and naming one connects the record.


      Additive. No property is added, removed or narrowed, no value is withdrawn, and a document
      valid under 2.8.21 is valid here with the same meaning.

  - version: "2.8.21"
    date: "2026-09-12"
    summary: >
      A coupling is stated once. `dependency.coupling` says how two bounded contexts are connected,
      in the three values the contract surface computes from a model's own contract refs. Where the
      contracts reach the pair they have computed it already, and they carry the direction, the
      operations and the broker with it, so a coupling declared there is a second statement of one
      fact - and two statements of one fact drift apart on the first change that touches only one of
      them.


      `restated-coupling` reports that, as a warning, from the context that declared it. The finding
      names both words, what the model declared and what the contracts compute, so a reader sees at
      once whether the two agree. Agreement and contradiction are one finding rather than two,
      because deleting the declaration is the fix for both; the message says which of the two it
      found. Traffic in either direction counts, since the claim is about the pair and not about
      which end calls the other.


      A coupling no contract reaches is silent, and that is the case the field exists for: a shared
      store, a file drop, a scheduled job. The rule is a warning for the whole 2.8 line and becomes
      an error on the next major line.


      A declared coupling now travels on the context dependency edge as well, beside the strategic
      relationship, the direction and the free-text integration type, so a report or a drawing can
      read what the model said. It stays a field of its own rather than folding into the free-text
      one: only the typed value is comparable with what the contracts compute.


      Additive. No property is added, removed or narrowed, no value is withdrawn, and a document
      valid under 2.8.20 is valid here with the same meaning.

  - version: "2.8.20"
    date: "2026-09-12"
    summary: >
      A bounded context serves more than one problem-space domain, and the model now says so without
      losing the one answer a drawing needs. `domain_ref` is the PRIMARY region, the home: one
      reference, because a context belonging to three domains has no box. Which areas a context
      serves at all is a different question, and it is answered separately.


      Coverage is derived rather than declared. A context's services expose and call operations
      through their contracts, and each operation belongs to the domain its document header states,
      so coverage is the join of two things the model already carries. Every coverage edge records
      which source answered: `contract` where a contract carried it, `name` where the operation
      reached its context by the name-and-scope fallback, `declared` where an author wrote it. It
      also carries how many operations stand behind the claim and how many of those a contract
      carried, because those are different numbers and only the second is contract evidence.


      `covers[]` on a context is the exception channel, for coverage no contract can express. `ref`
      is required; `extent` accepts `full` or `partial` and is optional; `reason` is required
      wherever `extent` appears, since a partial claim a reader cannot check is one nobody can act
      on. An ABSENT `extent` means the model has not said, and never `full`.


      `dependency.coupling` states how two contexts are connected in the three values the contract
      surface computes: `http`, `message`, `rpc`. `type` keeps its free-string shape and keeps
      working; `coupling` is its typed form and is the one to prefer in a new model. State it where
      the contracts do not: where they do, they already carry the direction, the operations and the
      broker, which a single word cannot.


      Three checks compare what a model declares against what its contracts prove. A pair the
      contracts carry with no dependency declared either way is a warning, and is the finding worth
      having: the coupling exists and the context map does not show it. A declared pair no contract
      evidences is information rather than a warning, because most are real coupling the contract
      surface cannot describe yet - a shared store, a file drop, a scheduled job. A pair declared one
      way whose operations all flow the other is a warning, and is the one contradiction rather than
      a silence.


      Declaration remains the primary source and is not being replaced. A derivation that finds
      nothing returns the empty set, which is indistinguishable from a model that has nothing there,
      so the two sources are compared and never reconciled automatically.


      Additive. No property is removed or narrowed, no value is withdrawn, and a document valid under
      2.8.19 is valid here with the same meaning.

  - version: "2.8.19"
    date: "2026-09-11"
    summary: >
      A region of the model can say what it is about, on an axis of its own. `modeling_space` takes
      three values: `business-domain`, the business the product serves; `technical-capability`, the
      system's own machinery rather than the business it serves; `endeavour`, producing or running
      the system rather than the system's subject matter. It is declared on an entry of the root
      `domains[]` registry, is optional, and its absence means `business-domain`.


      It is independent of `type`, which grades how important a region is to the business as core,
      supporting or generic. A region about the system's own machinery is still core, supporting or
      generic to the business, and can now state both.


      The registry's description names what it holds. A bounded context reaches its region through
      this registry and has no other way to name one, so a region about the system's machinery or
      about the endeavour is declared here beside the business domains.


      Both definitions state what is unsettled. `technical-capability` is a value of
      `modeling_space` and a value of `subdomain_kind`, answering a different question in each, and
      nothing reconciles a region that carries it on both axes or carries one on each and
      disagrees. Which axis keeps the value is open, so a consumer should not branch on the value
      set without allowing for it to change before the next major line.


      Additive. No property is removed or narrowed, no value is withdrawn, and a document valid
      under 2.8.18 is valid here with the same meaning.
  - version: "2.8.18"
    date: "2026-09-11"
    summary: >
      An operation says which problem-space domain it is part of. `domain_ref` on a domain
      document's header states it once for every operation in the file, accepting a `DMN###`. A
      domain document describes one domain and the file is a free partition, so a model may split a
      domain across several documents and state the same reference in each; an operation declares no
      reference of its own.


      Where the header is absent, the domain is the one whose name matches the document's slice
      folder. Every operation-to-domain edge records which source answered, `file-header` or
      `folder`, so a reader can tell a model's own statement from a default the filesystem
      supplied. A folder matching no declared domain, or matching two, leaves the operation with no
      domain rather than a guessed one.


      The header accepts a domain and not a subdomain, because a subdomain takes no identity of its
      own on the next major line.


      Separately, a service names the operations it provides with `provides:`. The former spelling
      `handles:` said two things at once, who provides the operation and how it is invoked, and the
      second of those is `dispatch:` on the operation. Both keys are accepted with identical meaning
      and identical effect on the graph, and a service declaring both means the union of what it
      wrote. `handles:` is the superseded spelling, removal on the next major line, and a model
      still using it is told so once per service.


      Additive. No field is removed or narrowed, and a document valid under 2.8.17 is valid here.
  - version: "2.8.17"
    date: "2026-09-11"
    summary: >
      A `tags` list describes what it is attached to and nothing else. A document-level `tags`
      describes the document, an entity-level `tags` describes the entity, nothing propagates
      between them, and an entity carries exactly the tags it declares. The definition and the
      schema reference both state that rule.


      Whether a file-level default is wanted is a separate question and is not answered here. No
      document changes validity, and no entity gains or loses a tag.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      A bounded context reaches its domain the way `domain_ref` describes. A context that declares
      the field names its domain; a context that declares nothing reaches the domain whose name
      matches the slice folder its file sits in.


      Every context-to-domain edge records which source it came from, `declared` or `folder`, so a
      reader can tell a model's own statement from a default the filesystem supplied. A folder
      naming no declared domain produces no edge and no placeholder, because a folder is not a
      dangling reference; a folder name matching two domains produces none either, since an
      ambiguous default is not a default.


      Nothing changes for a document: no field is added, removed or narrowed.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      A subdomain takes no identity of its own. It is a partition of one domain and is always
      reached through it, named inside the domain that contains it, and the containing domain is
      what another entity points at. `subdomain.id`, `$defs/subdomain_ref` and the subdomain arm of
      `bounded_context.domain_ref` are soft-deprecated, with removal on the next major line.


      The subdomain itself stays, with its name, its kind, its complexity and its traits. Nothing
      changes for a document today: `id` is still required and still validates, a context that names
      a subdomain keeps validating, and it keeps grouping under that subdomain's domain, which is
      the value the reference resolves to in any case.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      A typed id may carry a qualifier before it, as in `billing.CN001`. The qualifier names the
      scope of the document the id is declared in, so that bare ids do not collide across files.
      Nothing resolves it, and whether it coincides with the name of a bounded context, of a domain
      or of neither is a property of one model rather than of the schema.


      The definition is `$defs/scope_prefix`, with a description that says what the value is, and
      twenty-seven references across nineteen schema files resolve to it. `$defs/context_prefix`
      does not resolve, so a schema of your own that names the definition rather than matching the
      pattern is the one thing to repoint.


      No document changes validity: the qualifier is matched by pattern, and a model never names a
      definition.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      The model says who expects what of it. `Persona` (`PER###`) is an entity in its own right: the
      archetype gains an optional identifier and an `actor_ref`, and a `personas[]` collection at the
      concepts document root declares one where something else has to name it. The inline form is
      unchanged, a persona written under its actor validates exactly as before, and it may now take
      an identifier without moving, which is what makes it referenceable in place.


      `Concern` (`CNC###`) is what a persona expects: a `statement` in their own terms, the
      `persona_ref` who holds it, an optional `priority` and `status`, and an `about_ref` naming the
      part of the model the expectation is about. `about_ref` accepts a user story, a use case, a
      business process, a screen or a concept and nothing else, because an expectation about a
      command or an event is an expectation nobody holds; naming one is an error rather than a
      warning, since a permissive reference would carry the name without the meaning.


      A user story may name the concern it addresses through `concern_ref`. `benefit` says why one
      story is worth doing; the concern is the standing expectation several stories can serve, and it
      is the thing a view is measured against.


      Additive throughout. A model that declares neither entity validates and checks exactly as
      before.
  - version: "2.8.16"
    date: "2026-09-10"
    summary: >
      A slice can reserve numeric ranges of a typed id prefix. Two entities of one family cannot
      share a number, so a model whose slices all allocate into one prefix has to divide the number
      space between them; `layout.slices[].bands[]` states that division. Each band names a
      `prefix`, an inclusive `from` and `to`, and optional `notes`, against the shape
      `metamodel.schema.yaml#/$defs/id_band`.


      A band is declared on the slice that owns it, so ownership is stated by position and a band
      cannot name a slice the model does not have.


      The validator reads the declaration. An id of a banded prefix, declared in a slice's files and
      sitting outside every band that slice reserves, is a warning naming the id, the band it landed
      in and the band it should have used. Two bands of one prefix that overlap are a warning at the
      point of declaration, answerable before any id exists. A band whose `to` is below its `from`
      reserves nothing and says so.


      Additive and opt-in. A model that declares no band validates and is checked exactly as under
      2.8.15, and a prefix nobody bands is unconstrained.
  - version: "2.8.15"
    date: "2026-09-10"
    summary: >
      Documentation and migration only. A root `domains:` map may be declared in an architecture
      document and in a process document. It is a free-string map of name to prose and nothing
      resolves it; both descriptions state that, and both name the registry a domain is declared
      in: the root `domains[]` of `blueprint.yaml`, where a domain carries a `DMN###` id that a
      context names through `domain_ref`.


      `schema-update` promotes the map. Each key becomes a domain in that registry - the key its
      name, the prose beneath it its description - and the key leaves the document, so a domain is
      named in one place. A key seeds a domain even when it matches no slice folder, because
      naming a domain states that it exists where a `domain_ref` only points at one. A key naming
      a domain the registry already declares is left where it is and reported, since two authored
      descriptions are a disagreement to settle by hand.


      The map is accepted in both documents for the rest of the 2.8 line. A document valid under
      2.8.14 is valid here.
  - version: "2.8.14"
    date: "2026-09-10"
    summary: >
      A contract states its name, its placement and its serialization separately. `contract_name`
      names the document an interface contributes to; `slice` names the slice that document belongs
      to, or `cross_cutting: true` says it belongs to no single one; and the contract kind selects
      the format. So the name carries no path separator and no extension.

      Two services declaring the same `contract_name` under the same kind contribute to ONE
      document, merged additively - the same grouping the field it replaces carried, stated as a
      name rather than as a path.

      Every contract kind shares the rules: a document is named once, and placed once. Naming it
      remains mandatory; `contract_name` beside `output` is an error, and so is `slice` beside
      `cross_cutting`.

      `output:` is superseded and accepted for the rest of the 2.8 line. The validator reports each
      surviving declaration and names the keys that replace it, and reports a `slice` naming a slice
      the model does not declare. `schema-update` splits every declaration: the name is the basename
      up to its first dot, a declared slice prefix becomes `slice`, `_global/` becomes
      `cross_cutting: true`, and a build-folder prefix is dropped and reported. A prefix that is
      neither is reported and its declaration left as it was. A test case's `contract.file` moves in
      the same run.

      A document valid under 2.8.13 is valid here.
  - version: "2.8.13"
    date: "2026-09-10"
    summary: >
      Documentation only. The schema reference and the modeling guide state the narrative layer's
      current names: a process carries `PRC###`, an activity `PA###`, the collection key is
      `processes:`, the typed reference is `process_ref`, and a process is named through
      `screen.processes`, `use_case.processes`, `declared_impact.direct.processes` and
      `validates.processes`.

      They also state two properties of a process that are easy to read the other way round:
      `entry_operation` on an activity is optional, so an activity whose operation is not yet
      modelled leaves it out and the gap is reported; and `trigger`, `end_states` and `lanes` are
      direct properties of the process rather than a nested object.

      Every example writes the band it means to teach - `DC###` for a decision, `GL###` for a goal,
      `RSK###` for a risk, `ASC###` for an association - and so do the `id` descriptions in
      `decisions.schema.yaml`, `concepts.schema.yaml` and `story.schema.yaml`. The table of bands
      accepted in two spellings, and the release-history rows, name both, which is their purpose.

      The six `output:` properties on the contract kinds answer to one shared definition, which
      states what the field identifies - two services declaring the same value contribute to one
      artifact, merged additively - and what the extension selects for serialization.
      `bounded_context_ref` states its current severity: a reference to an unknown `BC###` is a
      cross-reference error.

      No pattern, property, enum or requirement changed. A document valid under 2.8.12 is valid
      here, and the reverse holds.
  - version: "2.8.12"
    date: "2026-09-09"
    summary: >
      A watch item's id band becomes `WCH###`. `W###` was the last one-letter band on this line
      and the seventh instance of the hazard 2.8.11 retired six of: it is a prefix of `WI###`,
      work item, and of longer bands in the realm and brandvoice suites, so a reader meeting
      `W001` beside `WI001` has to know which family each belongs to before the number means
      anything.

      The id also gains the optional context prefix every other band allows. Without it two
      scoped leverage maps in one model both declare `W001`, the model reports a duplicate id,
      and no legal spelling exists to resolve the report.

      Additive. Both spellings validate, and the old one is reported by name with its
      replacement. A document carrying `WCH001` or `billing.W001` is rejected by 2.8.11 and
      accepted here.
  - version: "2.8.11"
    date: "2026-09-09"
    summary: >
      Six typed id bands get an unambiguous spelling: `D###` -> `DC###` (Decision), `R###` ->
      `RSK###` (Risk), `G###` -> `GL###` (Goal), `T###` -> `TRO###` (TradeOff), `A###` ->
      `ASM###` (Assumption), `AS###` -> `ASC###` (Association). A one-letter band is a
      prefix-collision hazard against every longer band starting with the same letter, and the
      schema had begun documenting its own ambiguity to work around it; those two sentences are
      deleted rather than reworded.

      `AS###` moves although it is two letters: renaming `A###` to `ASM###` beside an `AS###`
      meaning Association would rebuild the same adjacency one letter along.

      Additive. Every pattern accepts BOTH spellings, so a document valid under 2.8.10 is valid
      here; the old form is reported, naming its replacement, and stops validating in the next
      major. A document carrying `DC001` is rejected by 2.8.10 and accepted here.

      The mapping is data, and it is in the schema: `x-retired-bands` names the retired spelling
      of each widened pattern, so the validator that reports an old band and the update that
      rewrites one read the same table, and a rename cannot come to mean two things.
  - version: "2.8.10"
    date: "2026-09-09"
    summary: >
      The entity the schema has always described as a process is called one. `story` becomes
      `process`: `STR###` becomes `PRC###`, `SA###` becomes `PA###`, and the collection
      `stories:` becomes `processes:`. `user_story` and `use_case` are unchanged, and so is the
      file that declares all three: naming it after the entity that moved would name it after a
      fraction of what it holds. The two names sat in one file for one thing each - a user story
      states what someone intends to deliver, a process describes what the modelled system does
      - and read as synonyms; renaming the odd one out ends that.

      The `process` sub-object is flattened into the entity, so `trigger`, `end_states` and
      `lanes` are direct properties and the `SP###` band is retired with nothing left to give an
      id to. Every field that named the entity follows it: `arch.processes`, `screen.processes`,
      `use_case.processes`, `validates_refs.processes`, `affects.process_refs`, and
      `story.storyUri` becomes `process.processUri`.

      Breaking. A v2.8 document carrying the former names is rejected.

      Only the v2.8 line moves. Every earlier line keeps `story`, and the loader reads both file
      names and both collection keys, so a model on an earlier line is unaffected. A model's own
      narrative file may be named `story.yaml` or `process.yaml` on any line from 2.6; both
      resolve to the same schema and give the same verdict, and the migration moves the content
      without moving the file.
  - version: "2.8.9"
    date: "2026-09-09"
    summary: >
      A use case names the user stories that realise it, and a story no longer names its use
      case back. `user_story.use_case` is SOFT-DEPRECATED (v2.8.9) and still accepted and read;
      `use_case.user_stories[]` is where the link is stated. One link written from both ends is
      two statements that can disagree, and a neighbour query then answers differently depending
      on which end it starts from.

      `user-story-use-case-back-reference` reports each use of the deprecated field and says
      whether the use case already lists the story back. Where it does not, the link exists only
      in the deprecated direction and adding it to `use_case.user_stories[]` comes before
      removing anything.

      The accepted set is unchanged: the property keeps its shape and stays optional, so every
      document valid before is valid after.
  - version: "2.8.9"
    date: "2026-09-09"
    summary: >
      A use case's conditional branches are called `alternative_flows`. `extensions` is
      SOFT-DEPRECATED (v2.8.9) and accepted under its former name until the next major line;
      both spellings hold the same list and every consumer reads either. The rename ends a
      collision with `extends`, which names a relationship to ANOTHER use case rather than a
      branch within this one.

      A use case may declare one spelling or the other, never both. Two lists of branches would
      be two answers to the same question with nothing to say which is current, and a consumer
      reading one would silently drop the other.

      The item shape becomes `$defs/alternative_flow`, referenced by both properties, so the two
      cannot drift.

      Additive: every document valid under 2.8.8 is valid here. A document carrying
      `alternative_flows` is rejected by 2.8.8 and accepted by this.
  - version: "2.8.8"
    date: "2026-09-09"
    summary: >
      A use case states the relationships a use-case diagram is drawn from. `use_case` gains
      three optional properties: `secondary_actors[]` (`ACT###`), the actors a use case involves
      without being initiated by; and `includes[]` and `extends[]` (`UC###`), the two
      relationships between use cases. An inclusion always runs, an extension runs under a
      condition, and both point away from the use case that declares them, so a base use case
      stays readable on its own.

      `main_scenario` is unchanged and stays a flat numbered list. A branch WITHIN a use case
      remains `extensions`, which is a step-level alternative rather than a use case of its own;
      `extends` names a different use case.

      Additive: all three are optional, and a model that declares none validates exactly as
      before. A document carrying `secondary_actors` is rejected by 2.8.7 and accepted here.
  - version: "2.8.7"
    date: "2026-09-09"
    summary: >
      A bounded context may name a subdomain. `context.domain_ref` accepts a `DMN###` or an
      `SDM###`, one reference either way, and naming a subdomain also places the context in the
      domain that contains it. That second membership is DERIVED from the registry rather than
      declared, so nothing states it twice and a context named against a subdomain groups with
      its domain's other contexts wherever domains are drawn, grouped or counted.

      The graph carries both: `context_realizes_subdomain` for what the model declared, and the
      same `context_realizes_domain` edge the domain form produces, so every consumer that
      groups by domain keeps working without knowing which form was used. The domain map
      resolves a subdomain id to its containing domain's name and draws the context there.

      A document declaring `domain_ref: SDM001` is rejected under 2.8.6 and accepted under this.
  - version: "2.8.6"
    date: "2026-09-09"
    summary: >
      The problem space becomes a registry of its own. `blueprint.yaml` gains a root
      `domains[]`: each domain carries a `DMN###` id, a name, an optional DDD `type` and the
      subdomains it divides into, each with an `SDM###` id. Two levels, declared once. A bounded
      context names the domain it realizes with `domain_ref: DMN###`, and which slice folder
      holds a domain's model is derived from where its contexts are declared rather than
      declared.

      A slice is a folder. `layout.slices[].type` and `layout.slices[].subdomains` are
      SOFT-DEPRECATED (v2.8.6): still accepted, still validated, and moved into the registry by
      `blueprint-schema-update`, which seeds one domain per slice that carried them or was named
      by a `domain_ref`, gives each its ids in slice order, and rewrites every `domain_ref` from
      the slice's name to the seeded domain's id. They are removed in the next major line.

      `domain_ref` no longer accepts a slice name. This is a breaking change in a patch version,
      stated rather than implied, on the same grounds as `party.env` in 2.8.2: the property
      becomes a typed reference so the cross-reference layer resolves it, zero documents on the
      2.8 line carry the old form, and the update rewrites the two models on 2.7 that do.

      The set of accepted documents changes in both directions.
  - version: "2.8.5"
    date: "2026-09-08"
    summary: >
      A model's migration REGISTER gets a schema. `migrations.yaml` beside the model root
      records what a model has been through and what is planned for it, one entry per migration
      with its changes described in prose: an `id`, a `name`, a `status`, at least one change,
      and optionally a description, a semantic-versioning impact, a date, `depends_on`, tags,
      and whether the migration is reversible with a summary of how.

      It is a different document from `migration.yaml`, which describes ONE migration authored
      for execution, with typed targets, before and after state, and rollback data. The
      register's two vocabularies say why they are not one. `register_status` runs `planned`,
      `in-progress`, `completed`, `cancelled`, which is where a migration stands as a reader of
      the model's history sees it, and not the authoring lifecycle a single executable migration
      runs from draft to applied. `register_change_kind` labels a change described in prose,
      where naming an entity is optional because a change may be about a whole file, a slice or
      a convention; `entity_change_kind` names an operation performed on a target in a given
      order. Each carries `x-vocabulary-distinct` stating which question it answers.

      A migration document is now addressed the same way by every surface that reads a model: a
      model's own migration is `migration.yaml`, one of several is `<name>.migration.yaml`, and
      the register is `migrations.yaml`.

      The reference example gains both. `examples/prestashop` declares a register of the five
      changes that model has been through, and its slices declare the thirty-three subdomains
      they partition into.
  - version: "2.8.4"
    date: "2026-09-08"
    summary: >
      Two spaces, two vocabularies. DDD strategic importance had been declared three times: on a
      slice (`core-domain`, `supporting-domain`, `generic-domain`, `technical-capability`), on a
      subdomain within a slice (`core`, `supporting`, `generic`), and on a bounded context
      (`core`, `generic-core`, `support`, `generic`). The first two are one classification at
      two granularities and now share `metamodel.schema.yaml` `$defs.subdomain_kind`; the third
      classifies a different subject and becomes `$defs.context_kind`. Each carries
      `x-vocabulary-distinct` naming the space it classifies.

      The surviving spellings are the ones models already use, so nothing migrates. A reader now
      meets `supporting-domain` in the problem space and `support` in the solution space, in two
      definitions that each state which space they are about. The one value that leaves an
      accepted set is the bare `supporting` on a subdomain.

      The two descriptions also stop contradicting each other. A bounded context's
      classification named a problem-space axis while the slice field described the same field
      as solution space. Both are true of different halves: the SUBJECT is a solution-space
      unit, and the classification names the problem-space region it realizes. Each description
      now says so from its own side.

      A change considered and NOT made, recorded so the reason is available: a constitution
      convention's `severity` remains `[warn, info]` while a fitness function's is `[error,
      warning, info]`. A convention is defined here as a soft constraint that validators warn
      about and never reject, so `error` has no meaning there, and the two sets differ for that
      reason rather than by accident.

      Two duplications are resolved by reference rather than by rewriting values. An
      environment's substrate and a deployment scope's substrate declared the same four values,
      one inline and one as a block list; they now share a local definition. A migration's
      `entity_change.kind` had become value-identical to the metamodel's `change_kind`; those
      two stay separate deliberately, one being a narrative impact classification and the other
      an executable operation, so each now says so in an annotation rather than being merged.
  - version: "2.8.3"
    date: "2026-09-08"
    summary: >
      A goal can say where it sticks. `goal` gains `affects`, the block `risk`, `inquiry` and
      `finding` already carry: `operation_refs`, `concept_refs`, `context_refs` and
      `story_refs`, every one optional, with the same sub-shape `risk.affects` declares. A goal
      that declares none validates exactly as it did before.

      The field closes a gap no authoring could reach. An Event Storming wall draws a goal as an
      opportunity, and every opportunity on every board fell under "not on a story path" because
      a goal had nothing to declare a story with.
  - version: "2.8.2"
    date: "2026-09-07"
    summary: >
      `party.env` is REMOVED. This is a breaking change in a patch version, stated rather than
      implied: a document that declares `env` on a party is rejected under 2.8.2 where it was
      accepted under 2.8.1. The field was a required free string naming one deployment
      environment for a whole party, and it predates the infrastructure layer: since v2.7.7 an
      environment is a first-class entity (`ENV###`) carrying its class, substrate, provider and
      target scope, and a binding resolves a need per environment. Nothing derived from the
      string, and being single-valued it could not state a party present in two environments,
      which parties routinely are through their services. `$defs.party.required` is now `[id,
      name]`.
      The schema update tool removes the line and reports each removal with the value it
      carried, so a model reaching 2.8 arrives valid and its author is told what went and where
      it can go instead.

      A controlled vocabulary used by more than one field is now declared once. Seven
      value-lists written out at sixteen sites move into `metamodel.schema.yaml` `$defs` and
      every site references them: `severity_scale`, `importance_scale`, `priority_scale`,
      `likelihood_scale`, `outcome`, `production_mode`, `story_status`, `milestone_status`, plus
      `semver_impact`, which had existed as a shared definition since v2.5 while the migration
      schema declared its own copy beside five references to the same file.

      Three of the new definitions carry BYTE-IDENTICAL value lists and different names, which
      is the point rather than an oversight. A goal's priority, a capability's strategic
      importance and a finding's severity are all four-point ladders answering three different
      questions: how essential it is to act, how differentiating it is to the business, how much
      damage it does. `critical` means "core differentiator" in one and "system failure" in
      another, so a single definition would flatten a distinction the model relies on. Each
      carries `x-vocabulary-distinct` naming the question it answers, so a reader and a checker
      can both tell a deliberate twin from a copy. Declaring a list once also settles its ORDER
      once: graded vocabularies read from least to greatest, except where an external standard
      fixes the order.

      Two additions. A race condition's `likelihood` gains `very-high`, so it spans the same
      five rungs as a risk's; a timing window can be hit under normal load. A declarative
      migration's `changes[].kind` gains `rename`, so a migration document can record that an
      entity kept its identity under a new id.

      A render manifest target can name WHO opens its artifacts. `audience:` on a target is a
      non-empty list of role names as the organization itself uses them - `QA lead`, `platform
      team`, `the client's architect` - free text rather than a reference to a modelled actor,
      because the reader of a delivery is usually outside the system being modelled. Nothing
      narrows, renders or fails differently because of it: the field is the manifest stating who
      a target is for, so a whole set can be asked whether every named reader has an artifact
      and whether every artifact has a reader. The manifest schema and the runtime normalizer
      now also agree about every LIST they both read.

      Two shared semantic rules describe themselves accurately. `unbound-operation` is advisory
      and says why it stays advisory: an operation can be unbound because the binding has not
      been declared yet, because the context it belongs to is named but not modelled, or because
      the solution side does not exist yet, and a rule cannot tell those apart from an author's
      oversight. The finding reads as a question for the author rather than a verdict.
  - version: "2.8.1"
    date: "2026-09-06"
    summary: >
      A bounded context can be declared whole at the document root, and a service names the
      system it is a component of. An arch document declares its contexts nested under the
      parties that provide their services (`parties`), at the document root (`contexts`), or
      both. A root-declared context is declared once in the model; its services name their
      system through `system_ref` (a `PRT###` reference) or inherit the document's `system_ref`
      default, and the systems a context spans are derived from its services. This is the form
      for a context that several systems provide services to, which the nested form could state
      only by declaring the context once per system and the party once per document that
      mentions it. `party.contexts` and the root `parties` list stop being required, so a party
      can be declared whole, once, with its `env` and no contexts.

      `system_ref` is optional. A service nested under a party is a component of that party by
      position; one that names a different party there contradicts its own declaration, and the
      reference walk reports it as a cross-reference error. A root-declared context's service
      that names no system and inherits none is silence rather than contradiction, and the
      semantic checker reports it as a warning. Three rules ship with it -
      `service-without-system`, `service-system-is-an-organization` (a service is a component of
      a technical system, while a business unit or company owns it) and `party-parts-disagree`
      (two declarations of one party that contradict each other; the parts are unioned and the
      disagreement reported, never resolved).

      This release ALSO admits `workshop` as an evidence `kind`: a collaborative modelling
      session (EventStorming, Domain Storytelling, a whiteboard workshop) whose source is the
      board export or photo and whose date is the session's, so an entity harvested from a board
      carries an evidence record pointing back to it and a freshness scan sees the board's age.
      The `kind` description now says what each of the ten values means.

      This release ALSO carries the render manifest's `kind: model` and a working `slices:`
      list, the same change the 2.7.16 entry describes; and it lets a governance concern say
      where it sticks on the domain model - Risk and Inquiry gain `affects` with the shape
      Finding has carried since v2.7 (`operation_refs`, `concept_refs`, `context_refs`), and all
      three gain `story_refs`, for a concern about a flow as a whole rather than one of its
      operations. All three build typed relations, so a risk, an inquiry or a finding reaches
      the graph and the drawings rather than only the reference walk.

      This release ALSO carries the suite's modeling-guidance ledger. `metamodel.schema.yaml`
      gains an `x-gdsm` block holding durable modelling lessons about this schema, served on
      request and read by nothing automatically; the 2.7 line carries the same block minus the
      lesson about root-declared contexts, because the ledger is resolved from the schema
      directory of the project being opened and both lines carry live projects. And the
      `unbound-question` rule stops promising a severity the engine does not hold: it stays a
      warning, and its description now says why - a `bounded_context_ref` naming an unknown
      `BC###` is already a cross-reference error in validation, so what this check reports on
      its own is a question that names no context at all.

      Every v2.8.0 document validates unchanged: the nested form is untouched, and nothing new
      is required. `blueprint-schema-update` rewrites a model that declares one party many times
      into the root form - the party keeps its whole declaration in the file holding most of its
      services, every other occurrence becomes a root-declared context, and each service carries
      or inherits the `system_ref` naming the party it was nested under. No text is invented.
  - version: "2.8.0"
    date: "2026-09-04"
    summary: >
      The enforcement line. What the 2.7 line encouraged and warned about, 2.8 requires: every
      party, context and service carries its typed id (`PRT###`, `BC###`, `SVC###`), every
      infrastructure resource and deployment scope its typed id (`IR###`, `DSC###`), every
      dependency states its DDD `relationship`, a decision carries a `summary` and a model
      schema a `description`, capability and KPI owners are actor references, and a milestone
      deliverable's `ref` is a typed union. A typed reference to an id nothing declares is a
      cross-reference error on every validator surface. Two free-string surfaces of the arch
      document are removed - `service.resources` and the root `infrastructure:` map - and the
      root `domains:` map is marked for removal in v2.9. A story activity may leave
      `entry_operation` out; two advisory rules, `activity-without-entry-operation` and
      `empty-context`, report the gap.

      A model that reached 2.7 with the typed conventions in place validates under 2.8
      unchanged. One that did not gets across with `blueprint-schema-update`: it mints the
      missing context and service ids, retypes free-string resource and scope ids together with
      every reference to them, bumps `schemaVersion` and moves the model to `v2.8/`, and reports
      rather than guesses a removed surface or a party without `PRT###`.
      `schema/v2.8/MIGRATION.md` is the guide. The prestashop example ships at v2.8; the v2.7
      and v2.6 trees stay published for models on those lines.
