  - version: "2.8.102"
    date: "2026-11-16"
    step: "a process activity carries typed stage questions and gates"
    summary: |
      A process activity can state the questions asked every time the work reaches it, in
      `questions`, and the pass or fail conditions the work meets there before it goes on, in
      `gates`. Each item has a `key`, lowercase words joined by hyphens and unique among the
      questions or among the gates of that activity, so a record of one run can cite it as the
      activity id and the key, `PA012/release`. A question is `key` and `statement`, and may name
      who asks it (`asked_by`, an actor), who answers it (`asked_of`, an actor or a team) and where
      the answer is recorded (`answer`, a name and an optional concept). A gate is `key` and
      `criterion`, and may name who judges it (`evaluated_by`, an actor or a team), the declared
      rule that states it (`rule`), what shows the result (`evidence`, a name and an optional
      concept) and the activity the work goes to when it fails (`on_fail`). The shape follows the
      activity's `inputs`, `outputs` and `tools`: an inline value object with optional typed
      references, not a new entity.

      Every reference resolves like every other typed id, so an actor, team, rule, concept or
      activity nothing declares is a cross-reference error. The model graph draws an
      `activity_question` edge from the process to each actor, team or concept a question names and
      an `activity_gate` edge to each actor, team, rule or concept a gate names; each edge carries
      the activity, the item's key and the field it comes from. Two semantic rules check what the
      schema cannot: `activity-item-key-repeated` (error) reports a key repeated within one
      activity's questions or gates, and `gate-on-fail-not-a-successor` (warn) reports an `on_fail`
      that names an activity this activity does not lead to. For example:

          activities:
            - id: website.PA001
              name: Write the brief
              questions:
                - key: audience
                  statement: Who reads this page?
                  asked_of: website.ACT001
            - id: website.PA012
              name: Release the site
              next:
                - to: website.PA013
                - to: website.PA011
              gates:
                - key: accessibility
                  criterion: The page passes the accessibility check
                  evaluated_by: website.ACT003
                  rule: website.VR010
                  evidence: {name: Accessibility report}
                  on_fail: website.PA011

      BACKWARD: every document valid under 2.8.101 is valid under 2.8.102. Not FORWARD: a 2.8.101
      validator rejects an activity that states `questions` or `gates`. No instance migration is
      needed; a model that keeps stage questions and gates as prose keeps its meaning and may move
      them into the typed lists. Minted rather than folded into 2.8.101 because the set of accepted
      documents changes.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_activity/properties/questions"
        notes: "Optional array of `activity_question`, `uniqueItems`; no default."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_activity/properties/gates"
        notes: "Optional array of `activity_gate`, `uniqueItems`; no default."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/activity_question"
        notes: "Closed object: required `key` and `statement`; optional `asked_by` (`actor_ref`), `asked_of` (`owner_ref`) and `answer` (`process_artifact`)."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/activity_gate"
        notes: "Closed object: required `key` and `criterion`; optional `evaluated_by` (`owner_ref`), `rule` (`rule_ref`), `evidence` (`process_artifact`) and `on_fail` (`process_activity_ref`)."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/activity_item_key"
        notes: "Lowercase words joined by hyphens, `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$`."
      - kind: docs
        semver: none
        target: docs/2026-11-11-work-processes.md
        notes: "A section on questions and gates at an activity with an example; the validation table names the new cases and the two semantic rules."
      - kind: docs
        semver: none
        target: schema/v2.8/metamodel.schema.yaml#/x-gdsm/modeling_guidance
        notes: "One lesson: a recurring stage question and an activity gate are neither a competency question nor an inquiry."
  - version: "2.8.101"
    date: "2026-11-14"
    step: "a command sent over messaging is handled by the service that receives it"
    summary: |
      A command sent over messaging is handled by the service whose messaging contract receives
      it, when exactly one service receives it. Several contracts of one service count as one
      receiver; two services in one context count as two. With no receiver or several receivers,
      the command stays with the services that send it, and the `messaging-command-receiver`
      check reports the ambiguity as a warning. An event stays with its senders, and an operation
      a service exposes over an API is unchanged. For example:

          # orders/arch.yaml
          services:
            - id: SVC010
              name: Orders Service
              contracts:
                - kind: channel
                  send: [kitchen.CMD001]
          # kitchen/arch.yaml
          services:
            - id: SVC020
              name: Kitchen Service
              contracts:
                - kind: channel
                  receive: [kitchen.CMD001]

      Here `kitchen.CMD001` is handled by the Kitchen Service, and a sequence diagram draws the
      Kitchen Service as its handler. Before this rule the command was bound to the Orders
      Service, which sends it.
      FULL: the accepted documents are unchanged; only the descriptions state the rule.
    changes:
      - kind: docs
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/context/properties/id"
        notes: "The context membership description states the handler rule for a sent command and the fallback when no single service receives it."
      - kind: docs
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/channel_contract/properties/{send,receive}"
        notes: "`send` and `receive` say how a sent command and an event bind to a service."
  - version: "2.8.100"
    date: "2026-11-14"
    step: "the records at a link's ends state their own evidence"
    summary: |
      Five kinds of record that stand at the ends of architectural links can state their own
      evidence, in the shared `provenance` shape (`discovery_stage`, `certainty` and `evidence`,
      all optional): a message channel, an infrastructure resource, an environment, a deployment
      scope, and each grant in a resource's `access` list. A record's `provenance` is about that
      record; a link it takes part in states its own evidence, and neither is evidence for the
      other. A record without one states no evidence of its own. A grant carries its own, because
      one grant may come from infrastructure code and another from a ticket, and the resource's
      evidence covers neither.
      For example:

          # infrastructure.yaml
          resources:
            - id: IR002
              kind: database
              name: Orders Database
              provenance:
                certainty: confirmed
                evidence:
                  - kind: codebase-analysis
                    source: deploy/orders/main.tf
                    date: "2026-11-03"
                    summary: The orders database is declared in the orders infrastructure code.
              access:
                - identity: order-api
                  target: IR002
                  role: db_datawriter
                  provenance: { certainty: probable }

      BACKWARD: every document valid under 2.8.99 is valid under 2.8.100. Not FORWARD: a 2.8.99
      validator rejects `provenance` on each of the five. No instance migration is needed. Minted
      rather than folded into 2.8.99 because the set of accepted documents changes.
