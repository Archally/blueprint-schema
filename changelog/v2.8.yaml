      Additive: every document that validated under 2.8.62 still validates. Not forward-compatible: a roadmap whose milestone carries `tracker_ref` is rejected by a 2.8.62 tree, because a milestone rejects keys it does not declare.
  - version: "2.8.62"
    date: "2026-10-05"
    step: "a roadmap names itself with a root name and description"
    summary: |
      A roadmap file accepts two new optional root members, beside `scope`. `name` is the roadmap's title, which a rendered roadmap shows as its heading. `description` says in one or two sentences what the roadmap covers and how settled it is, and a rendered roadmap shows it under the heading. A view of the roadmap may name a heading or a subtitle of its own, which then takes the place of the roadmap's. Both are plain strings: neither builds an entity or a graph edge, and the roadmap root still rejects any key it does not declare, so `title` is not accepted as a spelling of `name`.
      Additive: every document that validated under 2.8.61 still validates. Not forward-compatible: a roadmap carrying either member is rejected by a 2.8.61 tree, because the roadmap root rejects keys it does not declare.
  - version: "2.8.61"
    date: "2026-10-04"
    step: "a fitness function names what it verifies and the metric it reads"
    summary: |
      A fitness function accepts four new optional members. `verifies` names what it protects, one typed list per kind: `slos`, `kpis`, `security`, `compliance`, `resilience` and `goals`. It has no `metrics` list, because a fitness function is evaluated on a measure rather than protecting one, and no `slas` list, because an SLA is guarded through its SLOs. `metric` names the one measure the assertion is evaluated on, such as the count a ratchet keeps from rising; the limit stays in `assertion`, and a verdict that depends on two measures is two fitness functions. `quality_characteristic` and `quality_subcharacteristic` take the metamodel's ISO/IEC 25010 vocabularies.
      A fitness function that carries a quality characteristic states a quality constraint in its own right: a requirement that holds or does not, rather than a level on a metric, and its own verification. It may name the goal it serves in `verifies.goals`. The `fitness_function` description now says so, with "the product can be updated for selected customers only" under `maintainability` / `modifiability` as its example.
      Every id under `verifies` and `metric` is a typed reference: an id nobody declares is a cross-reference error on every validator surface. The metamodel's modelling guidance gains a lesson on keeping `verifies` and `metric` apart and on stating a constraint as a check.
      Additive: every document that validated under 2.8.60 still validates. Not forward-compatible: a model using any of the four members is rejected by a 2.8.60 tree, because `fitness_function` rejects keys it does not declare.
      This release also changes the model builder and the semantic checker, with the accepted set unchanged: the references 2.8.59 and 2.8.61 add become graph edges. `fitness_function_verifies` runs from a fitness function to every SLO, KPI, security, compliance and resilience requirement and goal its `verifies` names, one relation type for all six lists, the target's entity type saying which kind is guarded; `fitness_function_metric` runs to its `metric`; `metric_probe` and `metric_work_item` run from a metric to the probe and the work item its `collection` names. An id nobody declares lands on a placeholder. Neighbour and impact queries reach a fitness function from what it protects and from the metric it reads, and a metric from the work that builds its instrument. `fitness-function-unattached` counts these edges, so a fitness function attached only through `verifies` or `metric` is not reported; its description and message name `verifies` first.
  - version: "2.8.60"
    date: "2026-10-04"
    step: "an SLO and a KPI state their target as an objective a reader compares"
    summary: |
      An SLO and a KPI accept an optional `objective`: the level the requirement sets for its metric, in a form a reader compares with a result. It has a required `comparator` (`lt`, `le`, `gt`, `ge` or `eq`), a required numeric `value` and an optional free-text `statistic`, such as `p95`. A result of that statistic for the requirement's metric meets the objective or does not; a result of another statistic is not comparable. The objective has no unit of its own: `value` is in the unit of the requirement's metric, so on a requirement that names no `metric` it cannot be compared. `objective` rejects any key it does not declare, `unit` included.
      `target` stays required and unchanged in type: it is the sentence a person agrees to and what generated documents carry, and its description now says so. On a KPI the objective is the level to reach; `thresholds` remain the alert levels. The results stay outside the model, where the metric's `collection.results_location` points.
      The metamodel's modelling guidance gains a lesson on stating a target twice, and the 2.8.59 lesson now says the target lives in the KPI's or SLO's `target` and `objective`.
      Additive: every document that validated under 2.8.59 still validates. Not forward-compatible: a model using `objective` is rejected by a 2.8.59 tree, because `slo` and `kpi` reject keys they do not declare.
  - version: "2.8.59"
    date: "2026-10-04"
    step: "a metric says whether it is measured, by which instrument and where its results are kept"
    summary: |
      A metric's `collection` accepts four new optional members. `status` says whether the metric is measured: `measured` (results exist), `not-measured` (a measure exists and nobody runs it, a gap in the model) or `no-instrument` (nothing can measure it yet, so an instrument is needed). An absent `status` means not stated, a gap in the model, and is never read as `measured`. `probe_ref` names the probe (PRB###) that measures the metric, which may be one still to be built; `work_item_ref` names the roadmap work item (WI###) that builds or acquires the instrument. `results_location` says where the results are kept: a URL, a repository path, or the tool and query that produce them. It is distinct from `source`, which is where the data comes from. When `status` is `measured`, `results_location` is required; no other member of `collection` is required. Both references are resolved like every other typed reference, so one naming an undeclared probe or work item is a cross-reference error.
      `collection.frequency` accepts `one-off`, for a single measurement that is not repeated, such as a code analysis recorded in a file: `frequency: one-off`, `status: measured`, and the file as the `results_location`.
      The model holds no measured value: `collection` still rejects any key it does not declare, and no member holds a value, a date or a series. A metric names where its results are.
      A metric accepts `quality_characteristic` and `quality_subcharacteristic`, the ISO/IEC 25010 characteristic it serves, from the vocabularies a finding already uses. `quality_subcharacteristic` accepts `scalability`, listed under `portability`. The descriptions of both vocabularies state the ISO/IEC 25010:2023 names of two characteristics: `usability` is interaction capability and `portability` is flexibility, where `scalability` sits. No value is renamed.
      `provenance` is accepted on the metric, the KPI, the SLO, the SLA and the security, compliance and resilience requirements, so a requirement can say whether it is a hypothesis or agreed: an agreed one carries `certainty: confirmed` with its evidence, and `discovery_stage` says where it stands. The metamodel's modelling guidance gains the matching lesson.
      Additive: every document that validated under 2.8.58 still validates. Not forward-compatible: a model using any of the new members, `one-off` or `scalability` is rejected by a 2.8.58 tree, because `collection` and each of these entities reject keys they do not declare.
  - version: "2.8.58"
    date: "2026-10-04"
    step: "a test case whose act invokes an operation it does not validate is reported"
    summary: |
      The semantic checker adds `test-case-act-not-validated` (warn): a test case whose `when.operation` invokes an operation the case does not list under `validates.operations`. The act is not coverage, so such a case exercises the operation while coverage reports it untested by the case. The message names the operation and both fixes: add it to `validates.operations`, or correct `when.operation` if the act is a different operation.
      The two references are compared after resolution, so a typed id and a `domain:key` naming the same operation agree. Only a direct entry counts: an operation reached through the steps of a use case or process the case validates is still reported, because coverage does not count it either. A case without `when.operation` is not reported, nor is an act naming an undeclared operation, which validation reports as a cross-reference error.
      The schema is unchanged: every document valid under 2.8.57 is valid under 2.8.58.
  - version: "2.8.57"
    date: "2026-10-04"
    step: "a test case states the act it performs, and a precondition that carries notes is reported"
    summary: |
      A test case accepts `when`, the act it performs between its `given` and its `expected_result`. `when.operation` names the operation the test invokes, by typed id or by `domain:key`, and is resolved like every other operation reference, so an act naming an operation the model does not declare is a cross-reference error. `when.input` holds the values the act passes, as named values, and `when.description` states the act in a sentence a tester can follow. An act names an operation, a description or both; `input` alone is rejected, and so is any other key. One act per test case: a scenario that needs two actions is two test cases. The model graph draws a `test_case_act` edge from the test case to the operation. It is not a `validates` edge and does not count towards test coverage, which stays with `validates`.
      The descriptions of `given.description` and `note` say where each kind of text belongs: the precondition is the state before the act, and how the implementation behaves, the code a case was checked against and review remarks belong in `note`. The metamodel's modelling guidance carries the same lesson.
      The semantic checker adds `test-case-given-carries-notes` (warn): a test case whose `given.description` names code (a scope operator such as `::`, a file with a source-code extension, a call with empty parentheses, or a CamelCase name ending in a code role such as `Handler` or `Exception`), carries a review remark (a dated correction, a sentence opening with `Note`, a TODO marker), or runs past 250 characters. The message names which and says to move the rest into `note`. 250 is a quarter more than the 200 characters a test case's one-line `summary` may hold. Dates, capitalised configuration keys, typed model ids and CamelCase domain terms are not reported.
      Additive: a test case declaring `when` was rejected under 2.8.56. Nothing that validated under 2.8.56 is rejected.
  - version: "2.8.56"
    date: "2026-10-03"
    step: "a bounded context carries its code and its evidence, and an assumption names what it affects"
    summary: |
      A bounded context accepts `code_refs`, `implementation` and `provenance`, the three properties a service already carries. A context can now name the module directory or integration package that implements it as a whole, say whether it exists yet, and record how the model knows it exists, such as an `interview` evidence entry with its source and date for a context known from a conversation before its services are. The model graph draws a `code_ref` edge from the context to each file or directory it names, so the coverage check traces a changed file beneath a named directory back to the context, and the `implementation-as-is-without-code-refs` and `implementation-to-be-with-code-refs` rules read a context's `implementation` as they read a service's. A code reference may name a directory for an entity larger than one file; its description says so.
      An assumption accepts `affects` and `owned_by`, in the shape a risk carries them. `affects` names the operations, concepts and processes that depend on the assumption holding, and the model graph draws an `assumption_affects` edge to each; `affects.context_refs` is a scope name and builds no edge. `owned_by` names the team, department or party accountable for confirming or retiring the assumption, and an assumption in a motivation file with a file-level `owned_by` inherits that owner. `bp affects-report` (Archally Pro) counts assumptions beside goals, risks, inquiries and findings, and `--kind Assumption` narrows to them.
      The model builder reads a file-level `owned_by` per schema line: it reaches an item only where the line the model declares in `schemaVersion` lets that item name an owner. An assumption in a v2.6 or v2.7 model therefore inherits no owner, since those lines give it no `owned_by`, and the same holds for a v2.6 finding, leverage point or work item and for an item under `stories` in a v2.8 model. A model that declares no `schemaVersion`, or a line newer than v2.8, is read as v2.8; one that declares a line older than v2.6 is read as v2.6.
      The semantic checker adds `assumption-unplaced` (info): an assumption with no `affects` edge, no `risk_refs` and no decision citing it. Ownership does not place an assumption, so an owned assumption that names nothing is reported here although `orphan-entities` no longer reports it.
      Additive: a context declaring any of the three properties, and an assumption declaring `affects` or `owned_by`, were rejected under 2.8.55. Nothing that validated under 2.8.55 is rejected.
  - version: "2.8.55"
    date: "2026-10-02"
    step: "the model server names the ids a missing reference could mean"
    summary: |
      The Blueprint MCP server and the GraphQL API (Archally Pro) carry the same did-you-mean suggestion the validator prints. A missing reference that differs from declared ids only by a slice prefix gains a `suggestions` list of those ids, beside its message. The ids come from the same rule the validator uses, so the surfaces name the same candidates for the same reference. A suggestion is never a match: the reference is still missing, the finding is still an error, and its message is unchanged. A finding with no candidate carries no `suggestions` key. In the model builder, `ValidationResult.errors` items declare the optional `suggestions: string[]`.
      The semantic checker adds `operation-exposed-by-many` (info): an operation that three or more services provide, naming the services. A service provides an operation when a contract it provides lists it under `expose`, `send` or `provide`, in any contract kind, and a service listing it under two kinds counts once.
      The schema reference documents which files form a model: the root `blueprint.yaml` at the model root plus files named `<layer>.yaml` or `<topic>.<layer>.yaml`, the narrative file `story.yaml`, that any other file is not part of the model, and which names validation reports as errors.
      A decision's `decision_scope` is described as a named scope: a slice, a cross-cutting area that spans slices, or the whole system named by the project's name. Unlike a file's `scope:`, it need not name a slice, so a decision in a file at the model root states its subject there. The property's type is unchanged.
      The validator adds a warning: a file at the model root whose `scope:` names none of the model's slices is reported, naming the file and the value. A file at the model root belongs to no slice, so the fix is to remove its `scope:`; a decision states the scope it applies to with `decision_scope`. A nested file, a root file with no `scope:`, a root `scope:` that names a slice, and a single file validated on its own are not reported.
      The accepted set is unchanged: nothing that validated under 2.8.54 is rejected, and nothing rejected is accepted.
  - version: "2.8.54"
    date: "2026-10-02"
    step: "the validator checks exactly the files the model builder loads"
    summary: |
      Breaking for a model that keeps content in a file the model builder does not load, in a file named `process.yaml`, or in more than one root document. The validator now checks exactly the files the model builder loads, decided by the builder's own routing table, and reports three kinds of file as cross-reference errors, which `--compat` does not relax:
      - a file whose name looks like a model file and is not one: `<name>-<layer>.yaml`, `<name>.blueprint.yaml`, `<name>.migrations.yaml`. The message names the spelling that is read (`orders-domain.yaml`: rename it `orders.domain.yaml`);
      - a retired file name: `process.yaml`, `<name>.process.yaml` and their `.yml` forms. The message names the replacement (`story.yaml`, `<name>.story.yaml`);
      - a root document below the model root, or a second root document at the model root. Such a file is still part of the model, and still checked.
      A file the builder loads is schema-checked, including a dot-prefixed shard (`.orders.domain.yaml`) and a shard whose layer is written in upper case (`orders.DOMAIN.yaml`). A file the builder does not load takes no part in validation: its declarations no longer satisfy a reference and its own references are no longer resolved. It is listed as not part of the model.
      The model builder no longer loads `process.yaml`, on any line it serves (2.6 to 2.8). The narrative file is `story.yaml`, still read under both collection keys, `processes:` and `stories:`. The model builder's routing module names each retired file type with its replacement (`RETIRED_FILE_TYPES`, `getRetiredFileName`), so a consumer can name the replacement of a retired file instead of ignoring it. The Blueprint MCP server (Archally Pro) applies the same membership through the same module.
      What to do: rename a reported file as its message says, or move its content into the file it names.
      A model holding any such file validated under 2.8.53 and is rejected now. Across the published examples, no verdict changed. The `shared.process` description, which now names `story.yaml`, is the one schema file change, and it changes no accepted document.
  - version: "2.8.53"
    date: "2026-10-02"
    step: "a service can say which libraries it is built on and which services it uses"
    summary: |
      A service accepts two lists of other services. `imports` names the libraries it is built on: a package it imports, a component it embeds. `uses` names the services it depends on while running, at the level of a container diagram ("orders uses payments"), and is the statement to make before the contracts between the two are written. The model graph draws a `service_imports` or a `service_uses` edge to each named service, so impact analysis reaches the services built on a changed library and the services that depend on a changed service. The contracts still state the operations, direction and transport of a runtime dependency, and a context's `dependencies` still state how two contexts relate. An item names a service by its exact id; one that names no declared service is a cross-reference error.
      The semantic checker reports an `imports` item whose service states a kind other than library (warn), a `uses` item whose service is a library (warn), a `uses` item the contracts already state (info), and a cycle among `imports` edges (warn). Two running services may depend on each other, so a cycle among `uses` edges is not reported.
      Additive: a service declaring `imports` or `uses` was rejected under 2.8.52. Nothing that validated under 2.8.52 is rejected.
  - version: "2.8.52"
    date: "2026-10-01"
    step: "an MCP server, a CLI and a GraphQL API are couplings of their own"
    summary: |
      A context dependency's `coupling` accepts three more values, taking it from six to nine:
      - `mcp` for a tool call to a Model Context Protocol server;
      - `cli` for running a command of a command-line program;
      - `graphql` for a query or mutation against a GraphQL API.
      No existing value changes meaning; `rpc` stays the coupling of a remote procedure call such as JSON-RPC or gRPC.
      The contract traffic the model graph derives between two contexts names the same values: an `mcp` contract's `expose` and another context's `mcp` `call` of one operation yield a `contract_traffic` edge carrying `mcp`, and likewise for `cli`. An `openrpc`, `mcp` or `cli` caller joins only a provider of its own kind, so a command-line caller and an MCP server exposing the same operation are two surfaces, not one exchange. A `graphql` contract lists root field names rather than operation refs, so `graphql` is never derived; a GraphQL link between two contexts is stated with `coupling: graphql`. `arazzo` and `cncfsw` describe workflows over other contracts and derive no coupling.
      What to do: a dependency on an MCP server or a command-line program that has no contracts yet takes `coupling: mcp` or `coupling: cli`, not `rpc`. Where `mcp` or `cli` contracts already reach the pair, declare neither: the contracts carry the coupling, the direction and the operations. A superseded `type: mcp`, `type: cli` or `type: graphql` is now told to write the same value as `coupling`.
      Additive: a dependency declaring any of the three values was rejected under 2.8.51 and is accepted now. Nothing that validated under 2.8.51 is rejected.
      The model builder and the validator also change, with the accepted set unchanged: a `model_ref` written as a typed id matches a model component only when it is the same string as the component's `x-model-id`, prefix included. `billing.MDL013` does not match a component declaring `x-model-id: MDL013`: the model graph draws a placeholder rather than an edge, and the validator's warning that no component answers the reference joins the missing-reference error it already reports for that value.
      The validator's report also gains suggestions, with the accepted set unchanged: when a missing reference differs from declared ids only by a scope prefix, a `Reference Suggestions` section after the errors names them (`'KPI001' at <location>: did you mean orders.KPI001?`). A suggestion is never a match: the reference is still missing, its error line does not carry the suggestion, and a report with no suggestion prints no such section. The model builder exports the rule as `suggestDeclaredIds`, beside the resolution function the validator runs a generated copy of.
  - version: "2.8.51"
    date: "2026-09-30"
    step: "an MCP server and a CLI are contract kinds"
    summary: |
      A service's `contracts` block accepts two more kinds, taking it from ten to twelve, and the exchange protocol accepts `cli`:
      - `mcp` states the tools a Model Context Protocol server exposes to its clients (`expose`) and the tools a service calls on another MCP server (`call`). Each listed operation is one tool; its name and transport come from the operation's `exchange` - over standard input and output, protocol `stdio` with an `endpoint` whose `group` is `tool`, whose `path` is the tool name and whose `method` is `CALL`.
      - `cli` states the commands a command-line program exposes to whoever runs it (`expose`) and the commands of another program a service runs (`call`). Each listed operation is one command.
      - `cli` is a new exchange protocol value. It requires an `endpoint` whose `path` is the command line and whose `method` is `EXEC`. A custom `x-cli` protocol stays valid, as every `x-` value does.
      Both kinds name their document with `contract_name`, which they require, and place it with `slice` or `cross_cutting`. Neither accepts the superseded `output`. Their operation refs take both reference forms and resolve like every other contract's: an unresolved one is a cross-reference error, and the model graph carries a `contract_exposes` or `contract_calls` edge for each resolved one.
      What to do: declare an MCP server's tools under `mcp`, not `openrpc` - an OpenRPC document of an MCP server names the two JSON-RPC methods every MCP server speaks, not its tools. Declare a command-line program's commands under `cli`, not `openrpc` or `inprocess` alone. A program whose commands are also called in-process by a sibling module declares both: `cli` for the command line and `inprocess` for the call.
      The model builder also changes, with the accepted set unchanged: it resolves a process step's operation once, when relations are built, so a step carries `resolved` and `resolvedEntityId` only for a ref naming exactly one operation, and no id otherwise. A department's and a team's party is the party that declares the id, and a `model_ref` by name or pointer that several components satisfy is ambiguous rather than matched to the first.
      Additive: a document declaring either kind, or a `cli` exchange, was rejected under 2.8.50 and is accepted now. Nothing that validated under 2.8.50 is rejected.
  - version: "2.8.50"
    date: "2026-09-30"
    step: "a reference names its id exactly"
    summary: |
      Breaking for a model whose references rely on a scope being added or dropped: a reference resolves only to the declaration whose id is the same string. A scope prefix and its dot are part of the id, so `orders.KPI001` and `KPI001` are two ids and neither resolves to the other:
      - a bare id declared in a document that says `scope: orders` is that bare id, and a reference written `orders.KPI001` no longer reaches it;
      - a bare reference written in a document that says `scope: orders` names the bare id, and no longer reaches a declaration written `orders.KPI001`.
      Either reference is now a missing reference, a cross-reference error. A service nested under a party whose `system_ref` spells that party with a different prefix (`billing.PRT001` under `PRT001`) is a contradiction, because the two are different parties. The keyed `scope:key` form is unchanged: its key is composed from the declaring document's scope, or else its folder.
      What to do: write each reference exactly as its target is declared, or qualify the declaration and every reference to it with the same scope.
      A model whose reference relied on either spelling validated under 2.8.49 and is rejected now. No schema file changes.
  - version: "2.8.49"
    date: "2026-09-30"
    step: "a duplicate id is an error"
    summary: |
      Breaking for a model that declares one id twice: the validator reports a duplicate id as a cross-reference error, so the model fails validation. The message names every place the id is declared, and `--compat` does not relax it.
      An id is unique in the space its schema line resolves it in:
      - a top-level id is unique across the model, compared as written. A scope prefix partitions it (`sales.MDL001` and `catalog.MDL001` are two ids), and a bare id shares one space with every other bare id;
      - a process activity (`PA###`, and `SA###` on the lines before 2.8) is unique within its process or story, so every process may number its activities from `PA001`. Every reference the schema admits to an activity is written on an activity of the same process;
      - a concept attribute (`CAT###`) is unique across the model on this line, whose `attribute_ref` admits a scope prefix. On a line whose `attribute_ref` admits none (2.2 to 2.5) it is unique within its bounded context: the declaring document's `scope:`, or else its folder;
      - every other id, nested or not, is unique across the model.
      What to do: give one of the two declarations a new id, or qualify both with the scope of the document that declares them when they sit in different slices, and point every reference at the declaration it means.
      A model that declares one id twice validated under 2.8.48 and is rejected now. No schema file changes.
      The model builder also resolves a reference by its exact string. An id is the whole string, scope prefix and dot included, so `orders.RSK001` resolves only to a declaration written `orders.RSK001`, and `RSK001` only to one written `RSK001`. The builder no longer matches a qualified reference by its local part, prefers a declaration in the referring folder, or falls back to the first of several candidates. A reference that names no declaration, or a string several declarations share, becomes a Missing placeholder instead of an edge, and the placeholder of a shared string lists every candidate. Parties fold on the exact id: `billing.PRT001` and `PRT001` are two parties. What validates is unchanged by this part.
      What to do: write every reference exactly as its target is declared.
  - version: "2.8.48"
    date: "2026-09-30"
    step: "a leverage edge is stated once, in depends_on"
    summary: |
      Breaking: `enables` is removed from `leverage_point`. A leverage document that still carries it is rejected with `must NOT have additional properties: enables`. This is a removal in a patch version of a published line, made deliberately and stated here so that nobody reads this release as additive.
      `enables` restated, from the prerequisite's side, the edge the dependent already states in `depends_on`: `A.enables: [B]` and `B.depends_on: [A]` were one fact written twice. A model could write one end, the other, or two ends that disagreed, and a card printing the authored list could contradict the dependency drawn beside it. A leverage dependency is now stated once, on the dependent, and what a leverage point unblocks is `depends_on` read backwards.
      What to do: for every `A.enables: [B]`, check that `B.depends_on` lists `A`, then delete the `enables` key. Where `B` declares a `depends_on` that omits `A`, the two ends disagree, so decide before deleting: if B cannot start or finish until A lands, add `A` to `B.depends_on`; if landing A only makes B cheaper, faster or safer, the claim is a benefit and belongs in A's `consequences_if_done`. Nothing else in the document changes.
  - version: "2.8.47"
    date: "2026-09-29"
    step: "a tracked register accepts what an apply records"
    summary: |
      A tracked migration register now declares everything applying and rolling back a migration write into it, so a register the migration tooling (Archally Pro) wrote validates.
      Applying a migration records, on its entry, `edit_sites`: one site per operation per file it changed, each carrying the runs of text replaced (`windows[]` of `start`, `end` and `prior`) and a `sha256:` digest of the whole file before and after. Rolling the migration back restores those sites and removes them. When at least one operation has no faithful inverse, the entry's `inverse_change_set` is empty and `inverse_unavailable` says why, one line per operation; it is kept after a rollback. The register's entry is closed (`additionalProperties: false`), and under 2.8.46 it declared neither field, so a register written by a successful apply was rejected with `must NOT have additional properties: edit_sites`.
      Both fields are optional on `tracked_entry`, and `edit_site` and `edit_window` are closed shapes. `inverse_change_set` keeps its type; its description says it describes a rollback rather than performing one, and when it is empty.
      Additive: a register carrying either field was rejected by 2.8.46 and is accepted now. A register without them validates as it did, and no model file is affected.
      The validator's duplicate-id check reads a change program (`<name>.migration.yaml`) for the one id it declares, its own under `migration:`. The `changes` block describes entities before and after the change and declares none of them, so an id named there is not reported as a duplicate of the entity it describes. Two change programs declaring the same migration id are still reported. An id named in `changes` still resolves a reference, so a program can name the entity its own payload introduces. Only warnings change: a model that carried such a report loses it, and no verdict moves.
      The `x-gdsm.modeling_guidance` ledger on the metamodel gains four entries: a leverage dependency means blocks and is stated once, in the dependent's `depends_on`, and a benefit belongs in `consequences_if_done`; an evidence `source` cites a file relative to the model root, without the version directory; a relayed spoken account and an assumption built on it are two provenances at two certainties; and a user story reaches the concept it shows through its query and its test case. Annotation only.
  - version: "2.8.46"
    date: "2026-09-21"
    step: "a use-case step names the UI action"
    summary: |
      A use-case step can name the UI action it performs, a navigation can name the action that causes it, and a test case can name the use cases and navigations it validates.
      `UseCase.main_scenario[].ui_action` and `Navigation.via_action` are optional `ui_action_ref`s. `TestCase.validates.use_cases[]` takes `use_case_ref`, and `validates.ui.navigation[]` takes `ui_nav_ref` beside the screens and actions it already lists. All four keys are optional, and `alternative_flow` steps are unchanged.
      The model builder extracts them as the `use_case_ui_action` and `nav_via_action` relations and as the test-case axes `use_cases` and `ui.navigation`. The semantic checker reports at warn a main-scenario step that names both a UI action and a domain operation when that action's `triggers_operations` does not include the step's operation (`use-case-step-action-operation-disagrees`). Extra operations on the action are not a finding, and a step without either field is silent. Two warnings check the screens agree: `nav-via-action-screen-disagrees` and `use-case-step-action-screen-disagrees`.
      Additive. A document that declares none of the new keys validates with the verdict and the warning count it had before.
  - version: "2.8.45"
    date: "2026-09-20"
    step: "one field name stops carrying two types"
    summary: |
      Breaking: on a business decision, an assumption and a KPI, `bounded_context_ref` is renamed `domain_scope`. A document declaring `bounded_context_ref` on one of the three is rejected, and one declaring `domain_scope` there was rejected by 2.8.44.
      The name took a typed `BC###` id on an arch context, an inter-context dependency and a competency question, and a kebab-case scope slug on the three constructs above, with nothing at the site to say which applied: `bounded_context_ref: BC006` was correct in one file and rejected in the next. `bounded_context_ref` now means one thing, a reference to a bounded context in the solution space. `domain_scope` names a partition of the problem space: it has the shape a slice name has in `blueprint.schema.yaml` and, wherever a model declares `domains`, corresponds one-to-one with a declared domain.
      The type (`scope_prefix`), the values and the optionality are unchanged, and the key stays required on a business decision. `linked_contexts[]` beside it keeps its name and its type, and `metric` declares neither field. `scope_prefix` now states both roles it serves: the namespace qualifier on a typed id, and `domain_scope` on the three constructs.
      What changes for a model: the schema-update chain performs the rename. It reports, and leaves untouched, a site where the value is not a scope slug, where both keys are declared, and where the collection or the entry is written in flow form; those are rewritten by hand.
  - version: "2.8.44"
    date: "2026-09-17"
    step: "a probe is named, so what it cannot see can be queried"
    summary: |
      An instrument that reads a source reports what it was built to report and omits the rest, and the omission is a property of the instrument rather than of any one reading taken with it. Recorded per reading it is repeated or missing; recorded nowhere it is prose.
      This release reserves the `PRB` band, so a probe can be a referenceable node: `probe_ref` accepts `PRB001` or `integration.PRB001`, alongside every other typed reference in the metamodel. The identifier registry in the schema reference gains its row.
      Additive, and deliberately incomplete on its own. No document declares a probe yet and no field accepts a `probe_ref`, so every existing model validates with the verdict and the warning count it had before. The release that follows gives a probe a place to be declared.
  - version: "2.8.43"
    date: "2026-09-16"
    step: "a race condition's affects is typed, so the reference it names is resolved"
    summary: |
      `race_condition.affects[]` accepted any string and asked for a reference format in its description. Its three siblings on the same layer, `requires`, `enables` and `can_parallel_with`, are each typed, and the difference showed at validation time rather than at authoring time: a scope-qualified id such as `pricing.QRY999` was resolved, because a scope-qualified typed id is read as a reference wherever it appears, while the bare `QRY999` the description's own wording invited was read as free text and resolved against nothing. One field either reported a dangling reference or said nothing, decided by which of the two forms the author had written.
      The items are now an `anyOf` of `operation_ref`, `concept_ref` and `rule_ref`. A rule is in that list because a race condition points at the invariant its interleaving can violate as readily as at the operations that race, and models write all three. The reference walk derives its keys from the schema, so both forms resolve now and a dangling entry is reported either way.
      What changes for a model: an `affects` entry that is not one of those three reference shapes was accepted before and is rejected now. Every entry in the published example models is already one of the three. The three siblings are untouched, and a model that only ever wrote ids sees no change beyond a dangling bare id becoming visible.
  - version: "2.8.42"
    date: "2026-09-16"
    step: "a fitness function's description says what one is"
    summary: |
      A fitness function was described as an automated constraint validated against the blueprint structure. Measured across the models that carry them, more than half are not that and could not be: they state something about the code, about the running system, or about the way a team works, and nothing in a model can settle those.
      The three descriptions now say what a fitness function is. It is one constraint on the architecture, written so a reader can judge it. Some are settled by reading the model; others are not, and whether anything checks a given one is a separate question from whether it is worth stating. `assertion` is prose, not an expression, and nothing evaluates it on its own.
      Description text only. No property is added, removed or retyped, and every document that validated before validates now with the same meaning. The examples were replaced for the same reason: both of the old ones were model-graph, which is the half that made the sentence look true.
  - version: "2.8.41"
    date: "2026-09-16"
    step: "a fitness function becomes something the model can point at"
    summary: |
      A fitness function states a constraint about the architecture as a whole, and the schema has declared them for several versions. Nothing read them. They were not built into the model, so a leverage point naming one pointed at nothing, the reference degraded to a placeholder, and validation passed: a constraint nobody could reach looked exactly like one that was being met.
      A fitness function is now an entity of its own. It is not a test case and never was: a test case exercises one scenario, a fitness function asserts something about the whole graph, and the two happen to live in one document. Where no separate description is written, the required `assertion` becomes the entity's description, so it never reaches a reader as a bare name.
      What changes for a model: references to fitness functions resolve, and each one now appears in the model like any other entity. Two consequences follow, both of them the same fact seen from different sides. A fitness function that nothing references is reported as unreferenced, where before it was reported as nothing at all. On the two published example models that is 8 and 19 such warnings; a model whose fitness functions are all named by a leverage point gains none.
      Nothing stops validating and no document changes meaning. A model that declared fitness functions before declares them now, and they are read.
  - version: "2.8.40"
    date: "2026-09-16"
    step: "the staged changes a model is carrying become a document the validator can read"
    summary: |
      A project that stages its changes instead of applying them one at a time keeps them in a register beside the model, at `.blueprint/migrations.yaml`. That register is a sequence of migrations, each carrying the operations it would replay and, once applied, the ones that would undo it.
      Nothing described it and nothing checked it. A register carrying a status no tool accepts, or an operation the model cannot replay, read exactly like a correct one, because a document no validator is pointed at looks the same as a document that always passes.
      `tracked-migrations.schema.yaml` now describes it. Every operation is checked against its own shape alone, so a fault in a `new` is reported against `new` rather than against the five operations it never claimed to be.
      Reaching it takes a path, because the register sits beside the model rather than inside it and the model walk never arrives there. The validator accepts `--tracked-register <path>`; `bp validate` (Archally Pro) supplies it whenever a project has one, and says so in its report: the register is named and counted whether or not it could be checked, so "checked and clean" and "never looked at" stop sharing one silence.
      A project without a register is told nothing about a document it has not got. A schema line that does not describe one says so by name, as a warning, and the model is not failed for predating a document type.
      Additive: a new document type on the 2.8 line, and a new option. Every document that validated before validates now.
  - version: "2.8.39"
    date: "2026-09-16"
    step: "a file name stops being a claim about which context owns an operation"
    summary: |
      An operation belongs to a bounded context because a service contract names it, or because its domain is realized by exactly one context. Beneath those two there was a third rule: if the domain file's name or its `scope:` matched a context's name, that counted as a binding.
      That rule is removed. It read a filing convention as an assertion, and it bound an operation to EVERY context its slice declared rather than to the one meant, so a slice with two contexts gave one operation two owners and nothing said which was intended.
      What changes for a model: an operation that binds by nothing else is now reported `unbound` by the validator - `bp validate` and `bp check` (Archally Pro), and the open standalone validator alike. This is a warning, not an error, and nothing stops validating. To bind it, name it in a service contract, or give its domain file a `domain_ref` header so the domain hop can reach it.
      Who feels it: models authored on the 2.7 line and earlier, where this fallback was the documented way to bind. Their models are not wrong; the rule changed under them. Models on the 2.8 line that already carry contracts or a `domains[]` registry are unaffected.
      `scope:` itself is untouched. It still qualifies a typed id, so a contract ref naming `catalog.CMD001` resolves exactly as before. What is gone is `scope` read as an ownership claim.
      This is the sunset the v2.7.6 context-ownership change promised, delivered on a measured condition rather than on a date: every operation bound only by the fallback had to be bound by something else first.
  - version: "2.8.38"
    date: "2026-09-14"
    summary: >
      A model of a system that already exists mixes what the system has with what is planned, and a
      reader of any diagram or report generated from it asks the same question of every box: is this
      now, or later? Until now a model could only say it in a free tag or in prose, where nothing
      could draw it and nothing could check it.


      Every design-plane element that can say where in the code it is can now say whether it is
      there. `implementation` takes `as-is` (it exists in the system today), `wip` (it is being
      built; some code exists, the element is not yet what the model describes), `to-be` (planned or
      proposed, and not there yet) or `unclear` (you looked and cannot say).


      Absent means unclear, never `as-is`. A model states implementation; it is not assumed, and it
      is not inferred from the presence of `code_refs` - a reference can name the file an element
      will live in as legitimately as one it already occupies.


      Eighteen definitions carry it, being every design-plane definition that also carries
      `code_refs` apart from `user_story` and `use_case`, which state intent and carry their own
      delivery state. Governance entities do not: an element can claim to be implemented only where
      it can also say where in the code it is.


      Two semantic rules compare the claim with the evidence.
      `implementation-as-is-without-code-refs` reports an `as-is` element that names neither
      `code_refs` nor, for a resource, `iac_refs`. `implementation-to-be-with-code-refs` notes a
      `to-be` element that names one. An element marked `wip` is reported by neither. Both
      severities are yours to set in `.blueprint-lint.yaml`: a model authored from interviews, and a
      greenfield slice inside a model of an existing system, both hold `as-is` elements with nothing
      to point at and no defect, so this is your project's decision rather than a schema constraint.


      Applying a change program does not move the marker. Applying a change to the model does not
      put code in production, so each step from `to-be` through `wip` to `as-is` is a change you
      state.


      Additive: an optional property on eighteen definitions and one vocabulary in the metamodel.
      Every document that validated before validates now, with the same meaning.

  - version: "2.8.37"
    date: "2026-09-14"
    summary: >
      `layout.slices[].bands[]` reserves a numeric range of a typed id prefix to one slice, and its
      description said a band exists because two entities cannot share a number. That is true of one
      kind of id and not of the other, and the difference decides whether declaring a band means
      anything.


      An id that carries a scope - `catalog.CN001` - is already partitioned by it. Every slice can
      start at 001 and none of them collide, so a range reserved around one of them reserves nothing
      that was at risk. An id that carries no scope shares one numbering space with every other
      slice's, and there a range is a reservation.


      The description now says which population a band is for, and that a model whose ids are all
      scoped declares no bands as its finished state rather than as an omission. No field, pattern,
      property or enum moves, and the set of documents the schema accepts is identical before and
      after.

  - version: "2.8.36"
    date: "2026-09-14"
    summary: >
      A bounded context's ubiquitous language had no statement in the assembled model. Nothing on a
      context or on a concept says which concepts a context works with, and the relationship runs
      many-to-many, so no single field could say it.


      Your model already states both halves. An operation names the concepts it creates or changes
      (`materializes[].concept`) and a competency question names the concepts it is about
      (`concepts[]`), and membership already binds each operation and question to its contexts. The
      assembled model now joins them: `context_uses_concept` runs from a bounded context to every
      concept one of its operations materializes or one of its questions is about, carrying which of
      the two routes produced it and how many of each stand behind it.


      Nothing else decides it: not the folder a concept file sits in, not a file's `scope:` and not
      a context's name. A concept no operation or question names belongs to no context, and a
      reference that resolves to no declared concept gives no edge.


      Additive: no property is added, removed or narrowed, and every document that validated before
      validates now, with the same meaning.

  - version: "2.8.35"
    date: "2026-09-14"
    summary: >
      A model keeps its change programs under `.migrations/`, and a change program names model
      entities by their ids. The schema-update chain was rewriting the version stamp in those files
      and nothing else in them, so a change program came out of a migration declaring the new schema
      line while still holding the previous line's ids and vocabulary. Those documents then failed
      validation, and the references in them pointed at nothing.


      A change program is a model document, because its ids are references rather than dates:
      renaming an entity does not change what happened, it changes what the thing is called, and a
      reference nobody can follow is broken rather than archival. Your version control holds the
      literal history either way. So the chain now migrates `.migrations/` like any other part of
      the model.


      Directories beside it that hold tooling rather than documents - reports, scripts, notes - are
      still left alone. The set of dot-directories the chain treats as part of the model is named in
      one place, so a new side-car of your own is skipped without you doing anything.


      The vocabulary a change program uses to classify what it touches moves with the entities:
      `entity_type: story` becomes `process` and `activity` becomes `process-activity`. The rewrite
      is scoped to that field, so the relation names that share those words - `next_activity`,
      `screen_story`, `story_orders_operation` - are untouched.

  - version: "2.8.34"
    date: "2026-09-14"
    summary: >
      A field this line no longer wants is marked where you meet it, in the description that reaches
      the generated reference, the schema atlas and your editor's tooltip. Two fields on the 2.8 line
      were not saying it.


      `next_activities` on a process activity said only what it does. It is superseded by `next`,
      which names the same successors and can also state the condition under which each branch is
      taken. Validation has been warning on it and the schema-update chain rewrites it, while the
      field itself said nothing - so reading the schema and running the validator told you different
      things. The field is unchanged, still accepted and still read until the next major.


      `layout.slices[].subdomains` named a destination whose shape has since moved. It sends its
      subdomains to `domains[].subdomains[]`, where each was described as carrying an id you can
      point a context at - and that id is itself soft-deprecated, because a subdomain is always
      reached through the domain it divides. The advice now says so, so a model migrating today
      points its contexts at the containing domain.

  - version: "2.8.33"
    date: "2026-09-14"
    summary: >
      A bounded context's dependency said how it was connected in free text, under `type:`. Write
      `coupling:` instead. It takes the six values the contract surface computes from a model's own
      contract refs - `http`, `message`, `rpc`, `inprocess`, `shareddata`, `scheduledtransfer` - so
      a coupling you declare and one the contracts derive become comparable, where a free string was
      a second vocabulary for the same fact and could be compared with nothing.


      `type:` is soft-deprecated: accepted for the whole 2.8 line, warned once per declaration, and
      removed at the next major. Its own description had said `coupling` takes three values where
      the enum has six, which would have told anyone holding an `api` declaration that it had no
      successor. It now names all six and how the common spellings map: `api` and `http` become
      `http`, `events` becomes `message`, `grpc` becomes `rpc`, a shared store becomes `shareddata`.


      The schema-update chain rewrites the key and maps the value, one line at a time, preserving
      comments and formatting. It refuses three kinds of site rather than guess, and reports each: a
      value naming a medium rather than a coupling, where which of the six applies is a fact about
      the system and not about the string; an entry that already declares `coupling`, where one of
      the two statements is wrong; and flow form, where splicing means rewriting your line.


      Where the contracts already reach a pair, declare neither key: they carry the direction, the
      operations and the broker as well. `restated-coupling` reports that case and says to delete
      the declaration, so the mechanical half is automated and the judgement stays with you.

  - version: "2.8.32"
    date: "2026-09-14"
    summary: >
      `inprocess`, `shareddata` and `scheduledtransfer` describe three couplings that carry no
      protocol. Each said clearly what it was and none said how to choose between it and its
      neighbours, and they are close enough that one coupling can be argued into any of them. The
      decision is now written where you meet it, as an ordered test.


      Does one service run the other's code? Then it is `inprocess`, whatever data moves with it,
      because the other two exist for couplings where neither service calls the other. Otherwise:
      does the data sit in one place both services address, or does a run copy it from one side to
      the other?


      The case that stays hard is a store read on a schedule. Remove the schedule and ask what the
      reader can still do. If the store is there and still readable, the schedule was the reader's
      own policy and the coupling is `shareddata`. If nothing arrives, the run was the delivery and
      the kind is `scheduledtransfer`. Equivalently: whose clock decides what the reader sees, its
      own read time or the time of the last run.


      Nothing validates this choice and nothing can. No field in either kind records whether a run
      exists, so a check would be guessing in both directions. What makes it worth deciding
      deliberately is that a reader of the model takes the staleness of the data from the kind.

  - version: "2.8.31"
    date: "2026-09-14"
    summary: >
      `unevidenced-dependency` reports a declared dependency between two bounded contexts that no
      contract evidences. It is an `info` rather than a warning, and it now says why in terms you
      can apply to your own model instead of quoting a count taken elsewhere.


      The severity is unchanged and no rule changes what it reports. A declared dependency the
      contracts do not evidence is ordinarily real coupling the contracts have not been written for
      yet - a shared store, a scheduled transfer, a call inside one process - and the derivation
      reads all three of those kinds. So what stands between this report and a warning is adoption
      of the contract surface rather than anything the schema cannot express, and it promotes when a
      model that describes its couplings through contracts no longer lands here in quantity.


      The same explanation appears wherever a derived `contract_traffic` edge is described as
      sitting beside a declared dependency rather than replacing it, and all of those keep the
      argument and drop the figures: derivation reaches far fewer pairs than declaration does, and
      in a model whose contracts wire nothing it reaches none at all, so a derivation that finds
      nothing is indistinguishable from there being nothing there.

  - version: "2.8.30"
    date: "2026-09-14"
    summary: >
      2.8.29 removed `service.handles` from the schema and left the model builder reading it, so a
      document on an earlier line still bound its operations through the key. It does not any more:
      `contracts.inprocess.provide` is the only way to declare a provider that asserts no transport,
      and the pass that read the older spelling is gone with the property.


      The consequence is worth stating rather than discovering. An operation on an earlier line that
      was named ONLY by `handles:` - not by a protocol contract, and not matching a context by name
      or folder - now reports as unbound, and the resolvability warning says so. An operation named
      both ways is unaffected, because the contract already bound it.


      The schema-update chain relocates the key, which is the supported way across the boundary: the
      relocation is part of the chain that brings a model onto this line, where the destination
      exists.

  - version: "2.8.29"
    date: "2026-09-14"
    summary: >
      `service.handles` is removed. A service declares the operations it provides in-process under
      `contracts.inprocess.provide`, which states the same binding and also says which coupling it
      belongs to, and that is now the only place to declare it. `dispatch:` on the operation says
      how it is invoked, which is the second thing the old key named at the same time.


      No document on this line declares the removed key: `provides:`, the other half of the pair,
      was withdrawn in 2.8.27 in favour of the same contract verb, and the relocation module shipped
      alongside it, so a model arriving from an earlier line is moved rather than edited.


      A service that still carries the key is rejected by the schema, and the validator prints the
      replacement beside the rejection so the message says which property to write rather than only
      which rule broke. That guidance is scoped to this line: on the earlier lines `handles` is
      current and `contracts.inprocess.provide` does not exist, so a model there is told nothing.


      A document declaring neither key is unchanged.

  - version: "2.8.28"
    date: "2026-09-14"
    summary: >
      An operation reaches its bounded context in one of three ways, and until now two of them
      existed. A service contract naming the operation binds it, and a domain file whose name or
      folder matches a context binds it as a deprecated default. Between those sits the binding
      this release adds: where a document places an operation in a domain and exactly one bounded
      context realizes that domain, the operation belongs to that context, and the model states it
      without a contract.


      The new binding records `resolution: domain` on the `handled_by` edge and outranks the
      name-and-folder default. Where the two agree, the edge carries the derived one; where they
      name different contexts, the derived one stands. A contract binding is untouched by it: an
      author who names an operation in a contract has stated where it is handled, and nothing
      derived replaces a statement.


      Domain coverage - which problem-space domains a context serves - is derived from the
      operations a context handles and the domains those operations sit in. It now passes over the
      operations the new binding placed, because those were placed BY the domain link: counting
      them as evidence about it would restate what the model already says, once per operation. A
      coverage figure therefore counts the operations a contract wired, which is what it reports.


      Additive: no property is added, removed or narrowed, and every document that validated before
      validates now with the same meaning.

  - version: "2.8.27"
    date: "2026-09-13"
    summary: >
      A service could already say what it publishes over a wire and what it calls over one. Three
      couplings that cross no wire had at most one end, so nothing paired them into a dependency,
      and the picture of a modular monolith came out empty.


      `contracts:` gains three kinds. `inprocess` takes `provide` and `consume` for a call inside one
      process and one deployment unit. `shareddata` takes `write` and `read` for a store one service
      writes and another reads - the Shared Database style, where the reader is bound to a schema it
      does not own. `scheduledtransfer` takes the same pair for a run on a schedule that moves data
      between two services, where the reader sees the writer's data as of the last run. All six verbs
      name `operation_ref`, as every existing contract verb does, so one derivation reads them all.


      On the two data kinds the WRITER is the provider even though it calls nobody: it owns the
      schema, and the derived dependency points from reader to writer.


      `inprocess` is the one kind that names no document. No notation describes a module's published
      interface in a transport-independent, hand-authorable form, so it carries no `file:`, no
      `contract_name` and no placement. The two data kinds keep all three, because the dataset they
      move is what a data contract describes.


      The transport-free provider verb now lives with the others. `service.provides` is withdrawn and
      its operations belong under `contracts.inprocess.provide`; the superseded `service.handles`
      keeps working for the rest of this line and names its new home. `coupling` gains `inprocess`,
      `shareddata` and `scheduledtransfer`, so a declared coupling and a derived one stay in one
      vocabulary. `dispatch` accepts `inprocess` beside `in-process`, spelling one concept as the
      contract kind spells it; both are read for the rest of this line.


      `schema-update` carries both migrations, so a model on either superseded spelling moves without
      a hand edit. Each keeps the author's own list form, comments, key order and line endings, each
      is idempotent, and each reports what it will not touch rather than guessing: a service already
      declaring `contracts.inprocess`, a `contracts:` or a `dispatch:` written in flow form, a
      `provides:` that has no replacement to move to, and a prose sentence naming either spelling.


      The checker gains six rules. Four report a half-declared pair - a consume with no provide, a
      read with no write, and each the other way round - scoped to the three kinds whose two ends are
      both inside the model. One reports an operation whose `dispatch` says in-process and names no
      provider, which is a stronger finding than an unbound operation carrying no `dispatch`. One
      compares a `shareddata` contract against the infrastructure both ends name, where both name
      any, and reports two services that share a contract and no store.


      A document declaring none of the new kinds is valid here exactly as it was under 2.8.26.

  - version: "2.8.26"
    date: "2026-09-13"
    summary: >
      `next[]` arrived in 2.8.23 and `next_activities[]` keeps working for the whole 2.8 line, so a
      model on the older key is correct rather than out of date. Moving between them was a hand edit
      until now.


      `schema-update` carries the migration. Each successor becomes a `to:` entry that can hold the
      condition taking that branch. A lone successor stays on its line, because a condition there
      chooses nothing; a fork expands to block style, because a fork is where a condition belongs
      and adding one to a flow mapping means restructuring it first. An empty list migrates as an
      empty list.


      It invents no condition. The older key carries none, so every entry arrives with `to:` alone
      and the reason is the author's to add. Comments, key order, quoting and line endings survive,
      because the module edits text rather than reparsing the document, and a second run plans
      nothing.


      An activity that would end up declaring `next` twice is left alone and named, since an
      activity declares one key or the other and never both.


      Tooling only. The schema is unchanged and every document valid under 2.8.25 is valid here.

  - version: "2.8.25"
    date: "2026-09-12"
    summary: >
      The metamodel carries `x-gdsm.modeling_guidance`, a ledger of durable lessons about modelling
      with this suite, served on request rather than loaded into a session. It gains three entries.


      A `description:` that names a fallback, an inheritance, a default or a derivation is a claim
      about the builder and holds only while the builder does that; one that names a shape is
      decided by the schema itself.


      Acceptance is not reachability. The schema decides what a document may say and the extractor
      decides what travels on the graph, so a check written over a property the extractor drops
      passes against a fixture and returns nothing on every real model.


      Where a model states one proposition twice, the duplication is the defect rather than the
      disagreement, so it takes one rule id and one severity.


      Annotation only. No validation changes, no value is withdrawn, and every document valid under
      2.8.24 is valid here with the same meaning.

  - version: "2.8.24"
    date: "2026-09-12"
    summary: >
      `exchange-missing-payload` asks an operation that declares a transport to name the data
      model carried over it, and exempts a queue-based one, because a recurring or no-argument
      job legitimately carries no message.


      The exemption is decided by one condition, and the rule now states it as such: an
      `exchange.queue` that is non-empty. The protocol string is never consulted, so a vendor
      extension declaring a queue is exempt on exactly the same terms as a named transport, and
      an author reading the rule learns which key to write.


      Documentation only. No rule changes what it reports, and every document valid under 2.8.23
      is valid here with the same meaning.

  - version: "2.8.23"
    date: "2026-09-12"
    summary: >
      A process activity could name the activities it leads to and nothing else. It could not say
      what chooses between two of them, how several branches converge, or that it runs another
      process at this point. A model with a fork carried the fork and not the reason for it, and a
      process continuing in another document simply stopped.


      `next[]` supersedes `next_activities[]`. Each entry names the activity the branch leads to
      and may carry the `condition` that takes it, stated in the model's own terms rather than in a
      transport's. The older key keeps working for the whole 2.8 line and warns once per activity,
      naming its replacement; a model still using it is correct rather than out of date. Both
      shapes reach every consumer as one derived list, so two drawings of one process cannot
      disagree about where it goes.


      `gateway` says how an activity's outgoing branches relate and `join` says how the arriving
      ones converge - `and` for every branch, `xor` for exactly one, `or` for one or more. Both sit
      on the activity: a split is one fact about a whole set of branches rather than a property of
      any single one, and a merge is a fork read from the other end, which is why one vocabulary
      covers both directions.


      `calls_subprocess` names another process this activity runs. The called process keeps its own
      identity and its own activities, so processes that together describe one flow can be joined
      instead of each ending where its document does. A call naming no process is a cross-reference
      error: it draws no edge and invents no node.


      What the model states reaches what a reader sees. A branch condition labels the arrow on a
      process flowchart, and in a generated Arazzo workflow it becomes the criterion on the
      transition - the one criterion in such a workflow that came from the domain rather than from
      a status code or a response body.


      Additive. Every field is optional, no value is withdrawn, and a document valid under 2.8.22
      is valid here with the same meaning.

  - version: "2.8.22"
    date: "2026-09-12"
    summary: >
      A model records where it has been in one of two documents, and both now reach the graph.
      `migrations.yaml` is the register, an ordered list of entries written for a reader whose
      changes are prose. `<name>.migration.yaml` is a change program, one migration authored for
      execution with a typed target per change. Both were read and validated and then dropped, so
      asking a model about a migration it had itself recorded returned nothing.


      Both now produce a `Migration` node. One type for both, because the reader-facing facts are
      the same facts - an id, a name, when it happened, where it stands and what it touched - and
      `_genre` on the node says which document it came from. That is not decoration: the two
      `status` vocabularies are different vocabularies. `cancelled` means a migration never
      happened and `rolled-back` means it happened and was undone, so the two sets are kept
      verbatim rather than merged into one. `_impact` is the opposite case and is resolved, because
      the register spells the field `impact` and the change program `semver_impact` while both take
      the same values.


      A migration takes no plane. It is neither design nor governance, and its layer says so.


      Three edges, all from declared fields. `migration_depends_on` follows `depends_on`;
      `migration_relates_to_decision` follows `related_decisions`; and `migration_affects` is one
      coarse edge to every entity the migration names, agnostic to what the change does to it. The
      coarse form is deliberate: an edge saying a migration REMOVES an entity points at a node the
      graph expressing it does not contain, and the same objection in reverse applies to one that
      adds.


      An entity a migration names and the model does not hold produces no edge and no placeholder.
      A change program's `add` targets describe the model after the migration, so a target absent
      from the graph is the ordinary case rather than a broken reference.


      One consequence to expect in a report: a migration that names no entity and depends on
      nothing now stands alone in the graph, and `orphan-entities` says so. The register carries an
      `entity` field on every change for exactly this, and naming one connects the record.


      Additive. No property is added, removed or narrowed, no value is withdrawn, and a document
      valid under 2.8.21 is valid here with the same meaning.

  - version: "2.8.21"
    date: "2026-09-12"
    summary: >
      A coupling is stated once. `dependency.coupling` says how two bounded contexts are connected,
      in the three values the contract surface computes from a model's own contract refs. Where the
      contracts reach the pair they have computed it already, and they carry the direction, the
      operations and the broker with it, so a coupling declared there is a second statement of one
      fact - and two statements of one fact drift apart on the first change that touches only one of
      them.


      `restated-coupling` reports that, as a warning, from the context that declared it. The finding
      names both words, what the model declared and what the contracts compute, so a reader sees at
      once whether the two agree. Agreement and contradiction are one finding rather than two,
      because deleting the declaration is the fix for both; the message says which of the two it
      found. Traffic in either direction counts, since the claim is about the pair and not about
      which end calls the other.


      A coupling no contract reaches is silent, and that is the case the field exists for: a shared
      store, a file drop, a scheduled job. The rule is a warning for the whole 2.8 line and becomes
      an error on the next major line.


      A declared coupling now travels on the context dependency edge as well, beside the strategic
      relationship, the direction and the free-text integration type, so a report or a drawing can
      read what the model said. It stays a field of its own rather than folding into the free-text
      one: only the typed value is comparable with what the contracts compute.


      Additive. No property is added, removed or narrowed, no value is withdrawn, and a document
      valid under 2.8.20 is valid here with the same meaning.

  - version: "2.8.20"
    date: "2026-09-12"
    summary: >
      A bounded context serves more than one problem-space domain, and the model now says so without
      losing the one answer a drawing needs. `domain_ref` is the PRIMARY region, the home: one
      reference, because a context belonging to three domains has no box. Which areas a context
      serves at all is a different question, and it is answered separately.


      Coverage is derived rather than declared. A context's services expose and call operations
      through their contracts, and each operation belongs to the domain its document header states,
      so coverage is the join of two things the model already carries. Every coverage edge records
      which source answered: `contract` where a contract carried it, `name` where the operation
      reached its context by the name-and-scope fallback, `declared` where an author wrote it. It
      also carries how many operations stand behind the claim and how many of those a contract
      carried, because those are different numbers and only the second is contract evidence.


      `covers[]` on a context is the exception channel, for coverage no contract can express. `ref`
      is required; `extent` accepts `full` or `partial` and is optional; `reason` is required
      wherever `extent` appears, since a partial claim a reader cannot check is one nobody can act
      on. An ABSENT `extent` means the model has not said, and never `full`.


      `dependency.coupling` states how two contexts are connected in the three values the contract
      surface computes: `http`, `message`, `rpc`. `type` keeps its free-string shape and keeps
      working; `coupling` is its typed form and is the one to prefer in a new model. State it where
      the contracts do not: where they do, they already carry the direction, the operations and the
      broker, which a single word cannot.


      Three checks compare what a model declares against what its contracts prove. A pair the
      contracts carry with no dependency declared either way is a warning, and is the finding worth
      having: the coupling exists and the context map does not show it. A declared pair no contract
      evidences is information rather than a warning, because most are real coupling the contract
      surface cannot describe yet - a shared store, a file drop, a scheduled job. A pair declared one
      way whose operations all flow the other is a warning, and is the one contradiction rather than
      a silence.


      Declaration remains the primary source and is not being replaced. A derivation that finds
      nothing returns the empty set, which is indistinguishable from a model that has nothing there,
      so the two sources are compared and never reconciled automatically.


      Additive. No property is removed or narrowed, no value is withdrawn, and a document valid under
      2.8.19 is valid here with the same meaning.

  - version: "2.8.19"
    date: "2026-09-11"
    summary: >
      A region of the model can say what it is about, on an axis of its own. `modeling_space` takes
      three values: `business-domain`, the business the product serves; `technical-capability`, the
      system's own machinery rather than the business it serves; `endeavour`, producing or running
      the system rather than the system's subject matter. It is declared on an entry of the root
      `domains[]` registry, is optional, and its absence means `business-domain`.


      It is independent of `type`, which grades how important a region is to the business as core,
      supporting or generic. A region about the system's own machinery is still core, supporting or
      generic to the business, and can now state both.


      The registry's description names what it holds. A bounded context reaches its region through
      this registry and has no other way to name one, so a region about the system's machinery or
      about the endeavour is declared here beside the business domains.


      Both definitions state what is unsettled. `technical-capability` is a value of
      `modeling_space` and a value of `subdomain_kind`, answering a different question in each, and
      nothing reconciles a region that carries it on both axes or carries one on each and
      disagrees. Which axis keeps the value is open, so a consumer should not branch on the value
      set without allowing for it to change before the next major line.


      Additive. No property is removed or narrowed, no value is withdrawn, and a document valid
      under 2.8.18 is valid here with the same meaning.
  - version: "2.8.18"
    date: "2026-09-11"
    summary: >
      An operation says which problem-space domain it is part of. `domain_ref` on a domain
      document's header states it once for every operation in the file, accepting a `DMN###`. A
      domain document describes one domain and the file is a free partition, so a model may split a
      domain across several documents and state the same reference in each; an operation declares no
      reference of its own.


      Where the header is absent, the domain is the one whose name matches the document's slice
      folder. Every operation-to-domain edge records which source answered, `file-header` or
      `folder`, so a reader can tell a model's own statement from a default the filesystem
      supplied. A folder matching no declared domain, or matching two, leaves the operation with no
      domain rather than a guessed one.


      The header accepts a domain and not a subdomain, because a subdomain takes no identity of its
      own on the next major line.


      Separately, a service names the operations it provides with `provides:`. The former spelling
      `handles:` said two things at once, who provides the operation and how it is invoked, and the
      second of those is `dispatch:` on the operation. Both keys are accepted with identical meaning
      and identical effect on the graph, and a service declaring both means the union of what it
      wrote. `handles:` is the superseded spelling, removal on the next major line, and a model
      still using it is told so once per service.


      Additive. No field is removed or narrowed, and a document valid under 2.8.17 is valid here.
  - version: "2.8.17"
    date: "2026-09-11"
    summary: >
      A `tags` list describes what it is attached to and nothing else. A document-level `tags`
      describes the document, an entity-level `tags` describes the entity, nothing propagates
      between them, and an entity carries exactly the tags it declares. The definition and the
      schema reference both state that rule.


      Whether a file-level default is wanted is a separate question and is not answered here. No
      document changes validity, and no entity gains or loses a tag.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      A bounded context reaches its domain the way `domain_ref` describes. A context that declares
      the field names its domain; a context that declares nothing reaches the domain whose name
      matches the slice folder its file sits in.


      Every context-to-domain edge records which source it came from, `declared` or `folder`, so a
      reader can tell a model's own statement from a default the filesystem supplied. A folder
      naming no declared domain produces no edge and no placeholder, because a folder is not a
      dangling reference; a folder name matching two domains produces none either, since an
      ambiguous default is not a default.


      Nothing changes for a document: no field is added, removed or narrowed.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      A subdomain takes no identity of its own. It is a partition of one domain and is always
      reached through it, named inside the domain that contains it, and the containing domain is
      what another entity points at. `subdomain.id`, `$defs/subdomain_ref` and the subdomain arm of
      `bounded_context.domain_ref` are soft-deprecated, with removal on the next major line.


      The subdomain itself stays, with its name, its kind, its complexity and its traits. Nothing
      changes for a document today: `id` is still required and still validates, a context that names
      a subdomain keeps validating, and it keeps grouping under that subdomain's domain, which is
      the value the reference resolves to in any case.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      A typed id may carry a qualifier before it, as in `billing.CN001`. The qualifier names the
      scope of the document the id is declared in, so that bare ids do not collide across files.
      Nothing resolves it, and whether it coincides with the name of a bounded context, of a domain
      or of neither is a property of one model rather than of the schema.


      The definition is `$defs/scope_prefix`, with a description that says what the value is, and
      twenty-seven references across nineteen schema files resolve to it. `$defs/context_prefix`
      does not resolve, so a schema of your own that names the definition rather than matching the
      pattern is the one thing to repoint.


      No document changes validity: the qualifier is matched by pattern, and a model never names a
      definition.
  - version: "2.8.17"
    date: "2026-09-10"
    summary: >
      The model says who expects what of it. `Persona` (`PER###`) is an entity in its own right: the
      archetype gains an optional identifier and an `actor_ref`, and a `personas[]` collection at the
      concepts document root declares one where something else has to name it. The inline form is
      unchanged, a persona written under its actor validates exactly as before, and it may now take
      an identifier without moving, which is what makes it referenceable in place.


      `Concern` (`CNC###`) is what a persona expects: a `statement` in their own terms, the
      `persona_ref` who holds it, an optional `priority` and `status`, and an `about_ref` naming the
      part of the model the expectation is about. `about_ref` accepts a user story, a use case, a
      business process, a screen or a concept and nothing else, because an expectation about a
      command or an event is an expectation nobody holds; naming one is an error rather than a
      warning, since a permissive reference would carry the name without the meaning.


      A user story may name the concern it addresses through `concern_ref`. `benefit` says why one
      story is worth doing; the concern is the standing expectation several stories can serve, and it
      is the thing a view is measured against.


      Additive throughout. A model that declares neither entity validates and checks exactly as
      before.
  - version: "2.8.16"
    date: "2026-09-10"
    summary: >
      A slice can reserve numeric ranges of a typed id prefix. Two entities of one family cannot
      share a number, so a model whose slices all allocate into one prefix has to divide the number
      space between them; `layout.slices[].bands[]` states that division. Each band names a
      `prefix`, an inclusive `from` and `to`, and optional `notes`, against the shape
      `metamodel.schema.yaml#/$defs/id_band`.


      A band is declared on the slice that owns it, so ownership is stated by position and a band
      cannot name a slice the model does not have.


      The validator reads the declaration. An id of a banded prefix, declared in a slice's files and
      sitting outside every band that slice reserves, is a warning naming the id, the band it landed
      in and the band it should have used. Two bands of one prefix that overlap are a warning at the
      point of declaration, answerable before any id exists. A band whose `to` is below its `from`
      reserves nothing and says so.


      Additive and opt-in. A model that declares no band validates and is checked exactly as under
      2.8.15, and a prefix nobody bands is unconstrained.
  - version: "2.8.15"
    date: "2026-09-10"
    summary: >
      Documentation and migration only. A root `domains:` map may be declared in an architecture
      document and in a process document. It is a free-string map of name to prose and nothing
      resolves it; both descriptions state that, and both name the registry a domain is declared
      in: the root `domains[]` of `blueprint.yaml`, where a domain carries a `DMN###` id that a
      context names through `domain_ref`.


      `schema-update` promotes the map. Each key becomes a domain in that registry - the key its
      name, the prose beneath it its description - and the key leaves the document, so a domain is
      named in one place. A key seeds a domain even when it matches no slice folder, because
      naming a domain states that it exists where a `domain_ref` only points at one. A key naming
      a domain the registry already declares is left where it is and reported, since two authored
      descriptions are a disagreement to settle by hand.


      The map is accepted in both documents for the rest of the 2.8 line. A document valid under
      2.8.14 is valid here.
  - version: "2.8.14"
    date: "2026-09-10"
    summary: >
      A contract states its name, its placement and its serialization separately. `contract_name`
      names the document an interface contributes to; `slice` names the slice that document belongs
      to, or `cross_cutting: true` says it belongs to no single one; and the contract kind selects
      the format. So the name carries no path separator and no extension.

      Two services declaring the same `contract_name` under the same kind contribute to ONE
      document, merged additively - the same grouping the field it replaces carried, stated as a
      name rather than as a path.

      Every contract kind shares the rules: a document is named once, and placed once. Naming it
      remains mandatory; `contract_name` beside `output` is an error, and so is `slice` beside
      `cross_cutting`.

      `output:` is superseded and accepted for the rest of the 2.8 line. The validator reports each
      surviving declaration and names the keys that replace it, and reports a `slice` naming a slice
      the model does not declare. `schema-update` splits every declaration: the name is the basename
      up to its first dot, a declared slice prefix becomes `slice`, `_global/` becomes
      `cross_cutting: true`, and a build-folder prefix is dropped and reported. A prefix that is
      neither is reported and its declaration left as it was. A test case's `contract.file` moves in
      the same run.

      A document valid under 2.8.13 is valid here.
  - version: "2.8.13"
    date: "2026-09-10"
    summary: >
      Documentation only. The schema reference and the modeling guide state the narrative layer's
      current names: a process carries `PRC###`, an activity `PA###`, the collection key is
      `processes:`, the typed reference is `process_ref`, and a process is named through
      `screen.processes`, `use_case.processes`, `declared_impact.direct.processes` and
      `validates.processes`.

      They also state two properties of a process that are easy to read the other way round:
      `entry_operation` on an activity is optional, so an activity whose operation is not yet
      modelled leaves it out and the gap is reported; and `trigger`, `end_states` and `lanes` are
      direct properties of the process rather than a nested object.

      Every example writes the band it means to teach - `DC###` for a decision, `GL###` for a goal,
      `RSK###` for a risk, `ASC###` for an association - and so do the `id` descriptions in
      `decisions.schema.yaml`, `concepts.schema.yaml` and `story.schema.yaml`. The table of bands
      accepted in two spellings, and the release-history rows, name both, which is their purpose.

      The six `output:` properties on the contract kinds answer to one shared definition, which
      states what the field identifies - two services declaring the same value contribute to one
      artifact, merged additively - and what the extension selects for serialization.
      `bounded_context_ref` states its current severity: a reference to an unknown `BC###` is a
      cross-reference error.

      No pattern, property, enum or requirement changed. A document valid under 2.8.12 is valid
      here, and the reverse holds.
  - version: "2.8.12"
    date: "2026-09-09"
    summary: >
      A watch item's id band becomes `WCH###`. `W###` was the last one-letter band on this line
      and the seventh instance of the hazard 2.8.11 retired six of: it is a prefix of `WI###`,
      work item, and of longer bands in the realm and brandvoice suites, so a reader meeting
      `W001` beside `WI001` has to know which family each belongs to before the number means
      anything.

      The id also gains the optional context prefix every other band allows. Without it two
      scoped leverage maps in one model both declare `W001`, the model reports a duplicate id,
      and no legal spelling exists to resolve the report.

      Additive. Both spellings validate, and the old one is reported by name with its
      replacement. A document carrying `WCH001` or `billing.W001` is rejected by 2.8.11 and
      accepted here.
  - version: "2.8.11"
    date: "2026-09-09"
    summary: >
      Six typed id bands get an unambiguous spelling: `D###` -> `DC###` (Decision), `R###` ->
      `RSK###` (Risk), `G###` -> `GL###` (Goal), `T###` -> `TRO###` (TradeOff), `A###` ->
      `ASM###` (Assumption), `AS###` -> `ASC###` (Association). A one-letter band is a
      prefix-collision hazard against every longer band starting with the same letter, and the
      schema had begun documenting its own ambiguity to work around it; those two sentences are
      deleted rather than reworded.

      `AS###` moves although it is two letters: renaming `A###` to `ASM###` beside an `AS###`
      meaning Association would rebuild the same adjacency one letter along.

      Additive. Every pattern accepts BOTH spellings, so a document valid under 2.8.10 is valid
      here; the old form is reported, naming its replacement, and stops validating in the next
      major. A document carrying `DC001` is rejected by 2.8.10 and accepted here.

      The mapping is data, and it is in the schema: `x-retired-bands` names the retired spelling
      of each widened pattern, so the validator that reports an old band and the update that
      rewrites one read the same table, and a rename cannot come to mean two things.
  - version: "2.8.10"
    date: "2026-09-09"
    summary: >
      The entity the schema has always described as a process is called one. `story` becomes
      `process`: `STR###` becomes `PRC###`, `SA###` becomes `PA###`, and the collection
      `stories:` becomes `processes:`. `user_story` and `use_case` are unchanged, and so is the
      file that declares all three: naming it after the entity that moved would name it after a
      fraction of what it holds. The two names sat in one file for one thing each - a user story
      states what someone intends to deliver, a process describes what the modelled system does
      - and read as synonyms; renaming the odd one out ends that.

      The `process` sub-object is flattened into the entity, so `trigger`, `end_states` and
      `lanes` are direct properties and the `SP###` band is retired with nothing left to give an
      id to. Every field that named the entity follows it: `arch.processes`, `screen.processes`,
      `use_case.processes`, `validates_refs.processes`, `affects.process_refs`, and
      `story.storyUri` becomes `process.processUri`.

      Breaking. A v2.8 document carrying the former names is rejected.

      Only the v2.8 line moves. Every earlier line keeps `story`, and the loader reads both
      collection keys, so a model on an earlier line is unaffected. A model's own narrative file
      is `story.yaml` on every line (2.8.54 retired the second name, `process.yaml`), and the
      migration moves the content without moving the file.
  - version: "2.8.9"
    date: "2026-09-09"
    summary: >
      A use case names the user stories that realise it, and a story no longer names its use
      case back. `user_story.use_case` is SOFT-DEPRECATED (v2.8.9) and still accepted and read;
      `use_case.user_stories[]` is where the link is stated. One link written from both ends is
      two statements that can disagree, and a neighbour query then answers differently depending
      on which end it starts from.

      `user-story-use-case-back-reference` reports each use of the deprecated field and says
      whether the use case already lists the story back. Where it does not, the link exists only
      in the deprecated direction and adding it to `use_case.user_stories[]` comes before
      removing anything.

      The accepted set is unchanged: the property keeps its shape and stays optional, so every
      document valid before is valid after.
  - version: "2.8.9"
    date: "2026-09-09"
    summary: >
      A use case's conditional branches are called `alternative_flows`. `extensions` is
      SOFT-DEPRECATED (v2.8.9) and accepted under its former name until the next major line;
      both spellings hold the same list and every consumer reads either. The rename ends a
      collision with `extends`, which names a relationship to ANOTHER use case rather than a
      branch within this one.

      A use case may declare one spelling or the other, never both. Two lists of branches would
      be two answers to the same question with nothing to say which is current, and a consumer
      reading one would silently drop the other.

      The item shape becomes `$defs/alternative_flow`, referenced by both properties, so the two
      cannot drift.

      Additive: every document valid under 2.8.8 is valid here. A document carrying
      `alternative_flows` is rejected by 2.8.8 and accepted by this.
  - version: "2.8.8"
    date: "2026-09-09"
    summary: >
      A use case states the relationships a use-case diagram is drawn from. `use_case` gains
      three optional properties: `secondary_actors[]` (`ACT###`), the actors a use case involves
      without being initiated by; and `includes[]` and `extends[]` (`UC###`), the two
      relationships between use cases. An inclusion always runs, an extension runs under a
      condition, and both point away from the use case that declares them, so a base use case
      stays readable on its own.

      `main_scenario` is unchanged and stays a flat numbered list. A branch WITHIN a use case
      remains `extensions`, which is a step-level alternative rather than a use case of its own;
      `extends` names a different use case.

      Additive: all three are optional, and a model that declares none validates exactly as
      before. A document carrying `secondary_actors` is rejected by 2.8.7 and accepted here.
  - version: "2.8.7"
    date: "2026-09-09"
    summary: >
      A bounded context may name a subdomain. `context.domain_ref` accepts a `DMN###` or an
      `SDM###`, one reference either way, and naming a subdomain also places the context in the
      domain that contains it. That second membership is DERIVED from the registry rather than
      declared, so nothing states it twice and a context named against a subdomain groups with
      its domain's other contexts wherever domains are drawn, grouped or counted.

      The graph carries both: `context_realizes_subdomain` for what the model declared, and the
      same `context_realizes_domain` edge the domain form produces, so every consumer that
      groups by domain keeps working without knowing which form was used. The domain map
      resolves a subdomain id to its containing domain's name and draws the context there.

      A document declaring `domain_ref: SDM001` is rejected under 2.8.6 and accepted under this.
  - version: "2.8.6"
    date: "2026-09-09"
    summary: >
      The problem space becomes a registry of its own. `blueprint.yaml` gains a root
      `domains[]`: each domain carries a `DMN###` id, a name, an optional DDD `type` and the
      subdomains it divides into, each with an `SDM###` id. Two levels, declared once. A bounded
      context names the domain it realizes with `domain_ref: DMN###`, and which slice folder
      holds a domain's model is derived from where its contexts are declared rather than
      declared.

      A slice is a folder. `layout.slices[].type` and `layout.slices[].subdomains` are
      SOFT-DEPRECATED (v2.8.6): still accepted, still validated, and moved into the registry by
      `blueprint-schema-update`, which seeds one domain per slice that carried them or was named
      by a `domain_ref`, gives each its ids in slice order, and rewrites every `domain_ref` from
      the slice's name to the seeded domain's id. They are removed in the next major line.

      `domain_ref` no longer accepts a slice name. This is a breaking change in a patch version,
      stated rather than implied, on the same grounds as `party.env` in 2.8.2: the property
      becomes a typed reference so the cross-reference layer resolves it, zero documents on the
      2.8 line carry the old form, and the update rewrites the two models on 2.7 that do.

      The set of accepted documents changes in both directions.
  - version: "2.8.5"
    date: "2026-09-08"
    summary: >
      A model's migration REGISTER gets a schema. `migrations.yaml` beside the model root
      records what a model has been through and what is planned for it, one entry per migration
      with its changes described in prose: an `id`, a `name`, a `status`, at least one change,
      and optionally a description, a semantic-versioning impact, a date, `depends_on`, tags,
      and whether the migration is reversible with a summary of how.

      It is a different document from `migration.yaml`, which describes ONE migration authored
      for execution, with typed targets, before and after state, and rollback data. The
      register's two vocabularies say why they are not one. `register_status` runs `planned`,
      `in-progress`, `completed`, `cancelled`, which is where a migration stands as a reader of
      the model's history sees it, and not the authoring lifecycle a single executable migration
      runs from draft to applied. `register_change_kind` labels a change described in prose,
      where naming an entity is optional because a change may be about a whole file, a slice or
      a convention; `entity_change_kind` names an operation performed on a target in a given
      order. Each carries `x-vocabulary-distinct` stating which question it answers.

      A migration document is now addressed the same way by every surface that reads a model: a
      model's own migration is `migration.yaml`, one of several is `<name>.migration.yaml`, and
      the register is `migrations.yaml`.

      The reference example gains both. `examples/prestashop` declares a register of the five
      changes that model has been through, and its slices declare the thirty-three subdomains
      they partition into.
  - version: "2.8.4"
    date: "2026-09-08"
    summary: >
      Two spaces, two vocabularies. DDD strategic importance had been declared three times: on a
      slice (`core-domain`, `supporting-domain`, `generic-domain`, `technical-capability`), on a
      subdomain within a slice (`core`, `supporting`, `generic`), and on a bounded context
      (`core`, `generic-core`, `support`, `generic`). The first two are one classification at
      two granularities and now share `metamodel.schema.yaml` `$defs.subdomain_kind`; the third
      classifies a different subject and becomes `$defs.context_kind`. Each carries
      `x-vocabulary-distinct` naming the space it classifies.

      The surviving spellings are the ones models already use, so nothing migrates. A reader now
      meets `supporting-domain` in the problem space and `support` in the solution space, in two
      definitions that each state which space they are about. The one value that leaves an
      accepted set is the bare `supporting` on a subdomain.

      The two descriptions also stop contradicting each other. A bounded context's
      classification named a problem-space axis while the slice field described the same field
      as solution space. Both are true of different halves: the SUBJECT is a solution-space
      unit, and the classification names the problem-space region it realizes. Each description
      now says so from its own side.

      A change considered and NOT made, recorded so the reason is available: a constitution
      convention's `severity` remains `[warn, info]` while a fitness function's is `[error,
      warning, info]`. A convention is defined here as a soft constraint that validators warn
      about and never reject, so `error` has no meaning there, and the two sets differ for that
      reason rather than by accident.

      Two duplications are resolved by reference rather than by rewriting values. An
      environment's substrate and a deployment scope's substrate declared the same four values,
      one inline and one as a block list; they now share a local definition. A migration's
      `entity_change.kind` had become value-identical to the metamodel's `change_kind`; those
      two stay separate deliberately, one being a narrative impact classification and the other
      an executable operation, so each now says so in an annotation rather than being merged.
  - version: "2.8.3"
    date: "2026-09-08"
    summary: >
      A goal can say where it sticks. `goal` gains `affects`, the block `risk`, `inquiry` and
      `finding` already carry: `operation_refs`, `concept_refs`, `context_refs` and
      `story_refs`, every one optional, with the same sub-shape `risk.affects` declares. A goal
      that declares none validates exactly as it did before.

      The field closes a gap no authoring could reach. An Event Storming wall draws a goal as an
      opportunity, and every opportunity on every board fell under "not on a story path" because
      a goal had nothing to declare a story with.
  - version: "2.8.2"
    date: "2026-09-07"
    summary: >
      `party.env` is REMOVED. This is a breaking change in a patch version, stated rather than
      implied: a document that declares `env` on a party is rejected under 2.8.2 where it was
      accepted under 2.8.1. The field was a required free string naming one deployment
      environment for a whole party, and it predates the infrastructure layer: since v2.7.7 an
      environment is a first-class entity (`ENV###`) carrying its class, substrate, provider and
      target scope, and a binding resolves a need per environment. Nothing derived from the
      string, and being single-valued it could not state a party present in two environments,
      which parties routinely are through their services. `$defs.party.required` is now `[id,
      name]`.
      The schema update tool removes the line and reports each removal with the value it
      carried, so a model reaching 2.8 arrives valid and its author is told what went and where
      it can go instead.

      A controlled vocabulary used by more than one field is now declared once. Seven
      value-lists written out at sixteen sites move into `metamodel.schema.yaml` `$defs` and
      every site references them: `severity_scale`, `importance_scale`, `priority_scale`,
      `likelihood_scale`, `outcome`, `production_mode`, `story_status`, `milestone_status`, plus
      `semver_impact`, which had existed as a shared definition since v2.5 while the migration
      schema declared its own copy beside five references to the same file.

      Three of the new definitions carry BYTE-IDENTICAL value lists and different names, which
      is the point rather than an oversight. A goal's priority, a capability's strategic
      importance and a finding's severity are all four-point ladders answering three different
      questions: how essential it is to act, how differentiating it is to the business, how much
      damage it does. `critical` means "core differentiator" in one and "system failure" in
      another, so a single definition would flatten a distinction the model relies on. Each
      carries `x-vocabulary-distinct` naming the question it answers, so a reader and a checker
      can both tell a deliberate twin from a copy. Declaring a list once also settles its ORDER
      once: graded vocabularies read from least to greatest, except where an external standard
      fixes the order.

      Two additions. A race condition's `likelihood` gains `very-high`, so it spans the same
      five rungs as a risk's; a timing window can be hit under normal load. A declarative
      migration's `changes[].kind` gains `rename`, so a migration document can record that an
      entity kept its identity under a new id.

      A render manifest target can name WHO opens its artifacts. `audience:` on a target is a
      non-empty list of role names as the organization itself uses them - `QA lead`, `platform
      team`, `the client's architect` - free text rather than a reference to a modelled actor,
      because the reader of a delivery is usually outside the system being modelled. Nothing
      narrows, renders or fails differently because of it: the field is the manifest stating who
      a target is for, so a whole set can be asked whether every named reader has an artifact
      and whether every artifact has a reader. The manifest schema and the runtime normalizer
      now also agree about every LIST they both read.

      Two shared semantic rules describe themselves accurately. `unbound-operation` is advisory
      and says why it stays advisory: an operation can be unbound because the binding has not
      been declared yet, because the context it belongs to is named but not modelled, or because
      the solution side does not exist yet, and a rule cannot tell those apart from an author's
      oversight. The finding reads as a question for the author rather than a verdict.
  - version: "2.8.1"
    date: "2026-09-06"
    summary: >
      A bounded context can be declared whole at the document root, and a service names the
      system it is a component of. An arch document declares its contexts nested under the
      parties that provide their services (`parties`), at the document root (`contexts`), or
      both. A root-declared context is declared once in the model; its services name their
      system through `system_ref` (a `PRT###` reference) or inherit the document's `system_ref`
      default, and the systems a context spans are derived from its services. This is the form
      for a context that several systems provide services to, which the nested form could state
      only by declaring the context once per system and the party once per document that
      mentions it. `party.contexts` and the root `parties` list stop being required, so a party
      can be declared whole, once, with its `env` and no contexts.

      `system_ref` is optional. A service nested under a party is a component of that party by
      position; one that names a different party there contradicts its own declaration, and the
      reference walk reports it as a cross-reference error. A root-declared context's service
      that names no system and inherits none is silence rather than contradiction, and the
      semantic checker reports it as a warning. Three rules ship with it -
      `service-without-system`, `service-system-is-an-organization` (a service is a component of
      a technical system, while a business unit or company owns it) and `party-parts-disagree`
      (two declarations of one party that contradict each other; the parts are unioned and the
      disagreement reported, never resolved).

      This release ALSO admits `workshop` as an evidence `kind`: a collaborative modelling
      session (EventStorming, Domain Storytelling, a whiteboard workshop) whose source is the
      board export or photo and whose date is the session's, so an entity harvested from a board
      carries an evidence record pointing back to it and a freshness scan sees the board's age.
      The `kind` description now says what each of the ten values means.

      This release ALSO carries the render manifest's `kind: model` and a working `slices:`
      list, the same change the 2.7.16 entry describes; and it lets a governance concern say
      where it sticks on the domain model - Risk and Inquiry gain `affects` with the shape
      Finding has carried since v2.7 (`operation_refs`, `concept_refs`, `context_refs`), and all
      three gain `story_refs`, for a concern about a flow as a whole rather than one of its
      operations. All three build typed relations, so a risk, an inquiry or a finding reaches
      the graph and the drawings rather than only the reference walk.

      This release ALSO carries the suite's modeling-guidance ledger. `metamodel.schema.yaml`
      gains an `x-gdsm` block holding durable modelling lessons about this schema, served on
      request and read by nothing automatically; the 2.7 line carries the same block minus the
      lesson about root-declared contexts, because the ledger is resolved from the schema
      directory of the project being opened and both lines carry live projects. And the
      `unbound-question` rule stops promising a severity the engine does not hold: it stays a
      warning, and its description now says why - a `bounded_context_ref` naming an unknown
      `BC###` is already a cross-reference error in validation, so what this check reports on
      its own is a question that names no context at all.

      Every v2.8.0 document validates unchanged: the nested form is untouched, and nothing new
      is required. `blueprint-schema-update` rewrites a model that declares one party many times
      into the root form - the party keeps its whole declaration in the file holding most of its
      services, every other occurrence becomes a root-declared context, and each service carries
      or inherits the `system_ref` naming the party it was nested under. No text is invented.
  - version: "2.8.0"
    date: "2026-09-04"
    summary: >
      The enforcement line. What the 2.7 line encouraged and warned about, 2.8 requires: every
      party, context and service carries its typed id (`PRT###`, `BC###`, `SVC###`), every
      infrastructure resource and deployment scope its typed id (`IR###`, `DSC###`), every
      dependency states its DDD `relationship`, a decision carries a `summary` and a model
      schema a `description`, capability and KPI owners are actor references, and a milestone
      deliverable's `ref` is a typed union. A typed reference to an id nothing declares is a
      cross-reference error on every validator surface. Two free-string surfaces of the arch
      document are removed - `service.resources` and the root `infrastructure:` map - and the
      root `domains:` map is marked for removal in v2.9. A story activity may leave
      `entry_operation` out; two advisory rules, `activity-without-entry-operation` and
      `empty-context`, report the gap.

      A model that reached 2.7 with the typed conventions in place validates under 2.8
      unchanged. One that did not gets across with `blueprint-schema-update`: it mints the
      missing context and service ids, retypes free-string resource and scope ids together with
      every reference to them, bumps `schemaVersion` and moves the model to `v2.8/`, and reports
      rather than guesses a removed surface or a party without `PRT###`.
      `schema/v2.8/MIGRATION.md` is the guide. The prestashop example ships at v2.8; the v2.7
      and v2.6 trees stay published for models on those lines.
