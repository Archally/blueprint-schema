  - version: "2.8.97"
    date: "2026-11-14"
    step: "a shared-data contract names the store its data lives in"
    summary: |
      A shared-data contract can name the store its data lives in: `store_ref` on
      `contracts.shareddata`, the infrastructure resource (IR###) that declares the store, usually a
      `database`, a `storage` or a `cache`. One store per contract holds every document the
      contract lists under `write` and `read`, and both ends name the same store, because the data
      sits in one place both services address. A contract without it states that two services
      share data, not where; a service's `resource_refs` name the resources it uses, not which of
      them holds the data.

      The reference resolves like every other typed id, so a store nothing declares is a
      cross-reference error, and a free-string name fails the `infra_resource_ref` pattern.
      Evidence for the store sits beside the evidence for the contract's operations, in
      `link_provenance.store_ref`: one entry at most, keyed by the reference `store_ref` writes.
      An entry for a store the contract does not name is an error, as for every other link. For
      example:

          services:
            - id: orders.SVC001
              contracts:
                shareddata:
                  contract_name: order-ledger
                  write: [orders.DOC001]
                  store_ref: IR001
                  link_provenance:
                    store_ref:
                      IR001:
                        certainty: confirmed
            - id: orders.SVC002
              contracts:
                shareddata:
                  contract_name: order-ledger
                  read: [orders.DOC001]
                  store_ref: IR001

      BACKWARD: every document valid under 2.8.96 is valid under 2.8.97. Not FORWARD: a 2.8.96
      validator rejects `store_ref` and its evidence key. No instance migration is needed. Minted
      rather than folded into 2.8.96 because the set of accepted documents changes.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/shared_data_contract/properties/store_ref"
        notes: "Optional; a `$ref` to `infra_resource_ref`. No default; the contract's other fields are unchanged."
