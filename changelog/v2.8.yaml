  - version: "2.8.90"
    date: "2026-11-12"
    step: "ecommerce v2.8 and eShop are public examples"
    summary: |
      Two v2.8 models join the examples. examples/ecommerce/.blueprint/v2.8 is the complete
      ecommerce teaching model, with its contexts, architecture, governance and nine migration
      files. MIG004 (Add loyalty program) is an intentionally invalid migration that shows how a
      replay reports an error, so a full TO-BE replay stops there; the other migrations replay
      within their own dependency closures. examples/eshop/.blueprint/v2.8 models one order journey
      through dotnet/eShop, the .NET reference application, and keeps its attribution: dotnet/eShop
      is licensed under the MIT licence, (c) .NET Foundation and Contributors.

      The v2.6 ecommerce example is unchanged and independent: validate:examples, check:examples
      and render:ecommerce still read examples/ecommerce/.blueprint/v2.6. Four new commands check
      the v2.8 models, validate:ecommerce:v28, validate:eshop:v28, check:ecommerce:v28 and
      check:eshop:v28, and CI runs all four. docs/2026-11-12-ecommerce-and-eshop-examples.md names
      the validation command of each example.

      A model is not the schema: the set of documents the schema accepts is unchanged from 2.8.89.
      No instance migration is required.
    changes:
      - kind: add
        semver: none
        target: examples/ecommerce/.blueprint/v2.8
        notes: "The complete ecommerce v2.8 model and its nine migration files; MIG004 (Add loyalty program) stays as the replay's negative example."
      - kind: add
        semver: none
        target: examples/eshop/.blueprint/v2.8
        notes: "One order journey through dotnet/eShop, with its MIT licence attribution."
      - kind: docs
        semver: none
        target: docs/2026-11-12-ecommerce-and-eshop-examples.md
        notes: "The three ecommerce and eShop example directories and the validation command of each."
  - version: "2.8.89"
    date: "2026-11-12"
    step: "a render target names its view per slice"
    summary: |
      A render manifest target may state views_by_slice, a non-empty map from a slice name to a
      view reference in the same form as view:, a file relative to the manifest with an optional
      #section. A run narrowed to a listed slice uses that slice's view in place of view:; a slice
      the map does not list, and a run over the whole project, keep view:. One target can so
      deliver a differently configured page per slice without a target per slice.

      Each key is a slice the model declares, written with its canonical name. `bp render`
      refuses a key that names no declared slice, or names one in a different case, and accepts
      the map on the arch-map, strategy-grid, service-surface, infrastructure-map and
      contract-generator targets, refusing it on any other tool before anything renders.

      BACKWARD only: existing valid manifests remain valid and select their views as before.
      Older closed schemas, and a `bp render` that predates this version, reject a manifest
      carrying views_by_slice. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/render.manifest.schema.yaml#/$defs/target/properties/views_by_slice"
        notes: "Optional non-empty map from a canonical slice name to a view reference; a narrowed run on a listed slice uses it in place of view."
  - version: "2.8.89"
    date: "2026-11-12"
    step: "an activity without an operation is human work"
    summary: |
      A process activity that states no entry_operation describes manual or human work, in a
      process that describes the system or one that describes an organization. Leaving
      entry_operation out is a complete statement, not a gap, and no placeholder operation is
      needed. A reference to an operation nothing declares remains a cross-reference error.

      The semantic rule activity-without-entry-operation, which reported every activity without an
      operation, is withdrawn. Four rules read the work facts 2.8.88 added: an activity listed in
      two lanes, a tool whose party is not a system, a lane whose team differs from the team
      that staffs its actor, and an activity of an organization process placed in no lane.

      The schema accepts the same documents as before; only the description of entry_operation
      changes. No instance migration is required.
    changes:
      - kind: change
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_activity/properties/entry_operation"
        notes: "Description only: an activity without an entry operation is manual or human work; acceptance unchanged."
  - version: "2.8.88"
    date: "2026-11-11"
    step: "a process can describe how an organization works"
    summary: |
      A process may state describes, system or organization: whether it is a model of how the
      system runs it or of how the people of an organization do the work. A slice of
      layout.slices may state the same field, and a process that states none takes its slice's
      value, else system. The two values are one shared definition, process_describes. An
      unknown is not a value: it is an open inquiry that affects the element.

      A lane names an actor, a team or both, and may list the activities placed in it; a lane
      names at least one of actor and team. An activity may state its inputs and outputs, each a
      name with an optional concept, the tools it uses, each a name with an optional party, and
      hands_over_to, a non-empty list of receivers, each naming at least one of an activity of
      the same process, another process, a team and a name, and never an activity and a process
      together. A name has a non-space character and is never a typed id. A process and an
      activity may state provenance, the shared definition design entities already use; absent
      provenance states nothing. An inquiry's affects may name process activities in
      process_activity_refs. Every new reference resolves by its exact id, and an id nothing
      declares is a cross-reference error.

      The descriptions of process, process_activity and implementation read correctly for both
      kinds of process. A party's kind moves to the shared definition party_kind; its values and
      its acceptance are unchanged.

      BACKWARD only: existing valid documents remain valid, and a process that states none of
      the new fields keeps its meaning. Older closed schemas reject a process, activity, lane,
      slice or inquiry carrying the new fields. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/process_describes"
        notes: "system or organization: what a process is a model of."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process"
        notes: "Optional describes and provenance; a lane takes an optional team and activities beside an optional actor, at least one of actor and team."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_activity"
        notes: "Optional inputs, outputs, tools, hands_over_to and provenance."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_handover"
        notes: "One receiver: activity, process, team or name, at least one, never activity with process."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_artifact"
        notes: "An input or output: a required name and an optional concept."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_tool"
        notes: "A tool: a required name and an optional party."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/stated_name"
        notes: "A name as the source states it: a non-space character, never a typed id."
      - kind: add
        semver: patch
        target: "schema/v2.8/blueprint.schema.yaml#/$defs/slice"
        notes: "Optional describes, inherited by the slice's processes."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/inquiry"
        notes: "affects.process_activity_refs."
      - kind: change
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/party"
        notes: "kind references the shared definition party_kind; accepted documents unchanged."
  - version: "2.8.87"
    date: "2026-11-09"
    step: "a process has several alternative starts"
    summary: |
      A process may state its alternative starts in an optional triggers list, beside the single
      trigger. Each start carries the fields of a trigger (type, operation, schedule, description)
      and names the activity it leads to in a required to, an activity reference. The list is
      never empty and never repeats a start. Several starts may lead to the same activity. A
      process states triggers or trigger, never both; the refusal is reported at trigger. Each
      to is the exact id the activity declares, and an undeclared activity is a cross-reference
      error. The activity must belong to the same process; schema validation resolves the id
      across the model and does not check that. Starts are not chained to one another by list order: where they
      lead to different activities, those activities state their successors, with join where
      the routes meet. The start type vocabulary is one shared definition,
      process_trigger_type, read by both forms.

      The single trigger keeps its fields, its acceptance and its start routing; its operation
      description no longer reads as a requirement the schema never enforced.

      BACKWARD only: existing valid process documents remain valid. Older closed schemas reject
      a process carrying triggers. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process"
        notes: "Optional non-empty unique triggers list of process_start, each requiring type and an activity reference in to; refused together with trigger."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_start"
        notes: "One alternative start: the trigger fields plus a required to."
      - kind: change
        semver: patch
        target: "schema/v2.8/design/story.schema.yaml#/$defs/process_trigger"
        notes: "The single trigger moves to a reusable definition and its type enum to process_trigger_type; accepted documents unchanged."
  - version: "2.8.86"
    date: "2026-10-30"
    step: "a feature lists its user stories"
    summary: |
      A capability with kind: feature may state the user stories it delivers in an optional
      user_stories list of story references, without duplicates. The list is accepted only on a
      feature: a capability whose kind is omitted or is capability is rejected when it carries
      one. No default is inserted and a story does not name its feature back. Each entry is the
      exact id the story declares, scope prefix included, and an undeclared story is a
      cross-reference error. A present list is complete, an empty one included; an omitted list
      leaves the feature open to an association derived from shared operations, which is never
      written back. The at-most-one-feature rule and the comparison of stated lists with
      operation-derived reach are semantic checks and are not part of schema validation. A use
      case's user_stories list keeps its meaning.

      BACKWARD only: existing valid capability documents remain valid. Older closed schemas
      reject a capability carrying user_stories. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/capability.schema.yaml#/$defs/capability"
        notes: "Optional unique user_stories list of user_story_ref, accepted only when kind is feature."
  - version: "2.8.85"
    date: "2026-10-29"
    step: "render manifests select artifact modes"
    summary: |
      A render manifest can select an ordered, non-empty, duplicate-free list of light, dark and
      blueprint modes in defaults.themes and targets[].themes. A target's list replaces the
      defaults. Omission preserves renderer defaults and single-theme settings; paired artifacts
      and generated page controls default to light and dark. Blueprint is opt-in. Generated pages
      cycle only their selected modes. Conflicting settings and unsupported tool, format and mode
      combinations are refused before rendering.

      BACKWARD only: existing manifests remain valid. Older closed schemas reject themes in
      defaults or targets. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/render.manifest.schema.yaml#/$defs/themes"
        notes: "Optional defaults.themes and target themes reference an ordered, non-empty, unique light/dark/blueprint list."
  - version: "2.8.84"
    date: "2026-10-29"
    step: "a third-party package is its own entity"
    summary: |
      An architecture document can declare the third-party packages its services are built on, in a
      root `packages:` list, without inventing a party, a bounded context and a service to hold
      each one. A package (PKG###) requires an id, a name and a non-empty license; its ecosystem,
      supplier (`vendor_ref`, a party) and version are optional. An unknown license is stated as
      `license: { expression: NOASSERTION }`; unknown optional fields are omitted.
      The version is the text its ecosystem writes, and two versions in use at the same time are two
      entries. The license describes one documented entitlement: an SPDX expression or a
      `LicenseRef-` identifier, the terms in words, and the calendar date the entitlement ends,
      omitted where no single date is established. A document may now declare packages and
      nothing else.

      A service's `imports` list holds a service reference or a package reference in each item, in
      one list, still without duplicates; `uses` stays service-only. A library the organization
      builds itself stays a service of `kind: library`. Goals, risks, assumptions, inquiries and
      findings name packages in `affects.package_refs`, and a decision names the packages it
      changes in `declared_impact.direct.packages`. Every package reference resolves to the
      declaration carrying the same string, scope prefix included; one nobody declares is a
      cross-reference error.

      BACKWARD only: existing valid documents remain valid. Older closed schemas reject a document
      carrying `packages`, a package id in `imports`, `affects.package_refs` or
      `declared_impact.direct.packages`. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/package_ref"
        notes: "PKG### typed reference, optionally scope-prefixed, the shape of service_ref."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/properties/packages"
        notes: "Optional root array of package; the document-level anyOf accepts parties, contexts or packages."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/package"
        notes: "Requires id, name and non-empty license; optional summary, description, ecosystem, vendor_ref, version, code_refs, provenance, owned_by, properties, tags. Closed."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/package_license"
        notes: "Optional expression, terms and expires_on (format date); closed, at least one member. An unknown license uses expression: NOASSERTION."
      - kind: change
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/service/properties/imports"
        notes: "Items widen from service_ref to service_ref or package_ref; uniqueItems kept."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml"
        notes: "affects.package_refs on goal, risk, assumption and inquiry: optional array of package_ref."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/quality.schema.yaml#/$defs/finding/properties/affects/properties/package_refs"
        notes: "Optional array of package_ref."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/decisions.schema.yaml#/$defs/impact_declaration/properties/direct/properties/packages"
        notes: "Optional array of package_ref."
      - kind: docs
        semver: patch
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/service_kind"
        notes: "library is a library the organization builds itself; a third-party library is a package. Description only."
  - version: "2.8.83"
    date: "2026-10-29"
    step: "a risk and an inquiry name the capabilities they affect"
    summary: |
      A risk and an inquiry can name the capabilities and features they bear on, in
      `affects.capability_refs`: a list of CAP ids, each resolved by its exact declared id, so an
      id no capability file declares, or one written without the prefix its declaration carries,
      is a cross-reference error at the field. The item shape is the one vision and decision use
      for the same key. The concern belongs to each capability it names and to no other: a named
      capability's children, its parent and the capabilities that share an operation with it are
      not implied. Goals, assumptions and findings do not take the key.

      BACKWARD only: existing valid documents remain valid. Older closed schemas reject a risk or
      an inquiry carrying affects.capability_refs. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/risk/properties/affects/properties/capability_refs"
        notes: "Optional array of capability_ref, no cardinality or uniqueness constraint."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/inquiry/properties/affects/properties/capability_refs"
        notes: "Optional array of capability_ref, no cardinality or uniqueness constraint."
      - kind: docs
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/risk/properties/affects"
        notes: "The risk and inquiry affects descriptions name a capability among the things a concern is pinned beside. Description only."
  - version: "2.8.82"
    date: "2026-10-29"
    step: "a render target can open without its dashboard"
    summary: |
      A render manifest target can say whether its artifacts open on a dashboard. `dashboard:` is
      a boolean on a target and under `defaults:`, true when omitted; a target's own value wins
      over the default, and false removes the dashboard and its reopen button from every format
      the target produces, the first page of a PDF included. `bp render` passes it to the tool as
      `--no-dashboard`. The key written on a target whose tool has no dashboard switch is refused
      before anything renders, naming the reason; a default never reaches such a target, so one
      manifest can mix the two.

      BACKWARD only: existing valid manifests remain valid and open on a dashboard wherever their
      tools draw one, as before. Older closed schemas, and a `bp render` that predates this
      version, reject a manifest carrying `dashboard`, so a manifest that declares it needs both
      sides at this version. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/render.manifest.schema.yaml#/$defs/target/properties/dashboard"
        notes: "Optional boolean, default true. False opens the target's artifacts directly on the full view."
      - kind: add
        semver: patch
        target: "schema/v2.8/render.manifest.schema.yaml#/properties/defaults/properties/dashboard"
        notes: "Optional boolean, default true, applied to every target whose tool has a dashboard switch unless the target sets its own."
  - version: "2.8.81"
    date: "2026-10-28"
    step: "an owner may be a name until its unit is modelled"
    summary: |
      owned_by names the accountable unit by name, by a reference to one team, department or
      party, or by a name beside one reference. A name alone is a complete owner statement for a
      unit the model does not declare yet and draws no graph edge; beside a reference, the
      reference is the owner and the name is the owner as the source states it. A name contains
      a non-space character and is never shaped like a typed id. At most one reference, as
      before. A modeling_guidance lesson says when to write the name and when to add the
      reference.

      BACKWARD only: existing valid documents remain valid. Older closed schemas reject a
      document carrying owned_by.name. No instance migration is required.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/owned_by"
        notes: "name joins team, department and party; the constraint becomes a name, a reference, or both, with at most one reference."
      - kind: docs
        semver: patch
        target: "schema/v2.8/blueprint.schema.yaml"
        notes: "The owner of the domain, a subdomain and a slice is described as a reference, a name, or both. Description only; the accepted set is unchanged."
      - kind: docs
        semver: patch
        target: "schema/v2.8/governance/roadmap.schema.yaml"
        notes: "A work item's owned_by is described as a reference, a name, or both. Description only; the accepted set is unchanged."
  - version: "2.8.80"
