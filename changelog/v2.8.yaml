      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/service_need/properties/provenance"
        notes: "Optional; a `$ref` to the shared `provenance`."
      - kind: add
        semver: patch
        target: "schema/v2.8/design/arch.schema.yaml#/$defs/{endpoint_contract,http_client_contract,channel_contract,rpc_contract,protobuf_contract,mcp_contract,cli_contract,inprocess_contract,shared_data_contract,scheduled_transfer_contract}/properties/link_provenance"
        notes: |
