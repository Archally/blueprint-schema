  - version: "2.8.95"
    date: "2026-11-14"
    step: "a migration states its business case, a register entry its decisions, and a decision its participants"
    summary: |
      A migration can state what carrying it out costs and is expected to return, a register entry
      can name the decisions behind it, and a decision can name who decides, who is consulted and
      who is informed.

      - `business_case` on a migration document (`migration.business_case`) and on a register entry
        (`migrations[].business_case`): the forecast economics of that one migration, the metamodel
        definition `migration_business_case`. It requires all six inputs, so a business case is
        complete or absent: `horizon_months`, a finite whole number of at least 1; `currency`, an
        ISO 4217 alphabetic code of three uppercase letters; `initial_cost`, `recurring_cost` and
        `recurring_benefit`, each a finite number of zero or more in that currency; and `period`,
        `month` or `year`, the period the two recurring amounts are stated per. Optional
        `assumption_refs` name the assumptions the estimate rests on, each once, and optional
        `evidence` takes the shared evidence shape. No other property is accepted. Over the horizon
        the undiscounted totals are: cost is the initial cost plus the recurring cost multiplied by
        the number of periods, and benefit is the recurring benefit multiplied by the number of
        periods, where the number of periods is `horizon_months` for a month and `horizon_months`
        divided by 12 for a year. An estimate is a forecast, not a measured outcome; no discounting,
        currency conversion or rate of return is implied, and a migration without a business case
        states no estimate rather than zero. The decisions and goals a migration serves carry no
        amounts. A model declares each migration id once, in a document or in a register entry, so
        one migration carries at most one business case.
      - `related_decisions` on a register entry: the decisions that motivated the migration, a list
        of decision references, each listed once, the link a migration document already states in
        `migration.related_decisions`. Without the list, the register records no decision for the
        migration; it does not state that none was taken.
      - `participants` on a decision, the new `decision_participants`: `decision_makers`,
        `consulted` and `informed`, each a non-empty list of actor (ACT###) or team (TM###)
        references, each listed once; at least one role is stated, and an absent role is not
        recorded. The roles state who is meant to decide, advise and be told. They are not an
        approval and leave the decision's `status` as it is; an agreement is recorded as `evidence`
        of kind `stakeholder-signoff`. `owned_by` stays the unit accountable for the decision record.

      Every new reference resolves like every other reference: a decision, assumption, actor or
      team id that nothing declares is a cross-reference error. For example:

          # migrations.yaml
          migrations:
            - id: MIG003
              name: Billing becomes its own context
              status: planned
              related_decisions: [DC004]
              business_case:
                horizon_months: 24
                currency: EUR
                initial_cost: 12000
                recurring_cost: 100
                recurring_benefit: 900
                period: month
                assumption_refs: [ASM002]
              changes:
                - type: add
                  description: A billing context takes over invoicing from ordering.

          # decisions.yaml
          decisions:
            - id: DC004
              participants:
                decision_makers: [ACT001]
                consulted: [TM002]
                informed: [ACT003]

      Over 24 months the estimate costs 12000 + 100 x 24 = 14400 EUR and is expected to return
      900 x 24 = 21600 EUR, undiscounted.

      BACKWARD: every document valid under 2.8.94 is valid under 2.8.95. Not FORWARD: a 2.8.94
      validator rejects a migration document or register entry carrying `business_case`, a register
      entry carrying `related_decisions` and a decision carrying `participants`. No instance
      migration is needed. Minted rather than folded into 2.8.94 because the set of accepted
      documents changes.
    changes:
      - kind: add
        semver: minor
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/migration_business_case"
        notes: |
          Closed object requiring `horizon_months` (integer, minimum 1), `currency` (`^[A-Z]{3}$`),
          `initial_cost`, `recurring_cost`, `recurring_benefit` (numbers, minimum 0) and `period`
          (`month` | `year`), with optional unique `assumption_refs` and shared `evidence`. Each
          number is bounded by the largest finite double, so the YAML values `.inf` and `.nan` are
          rejected; nothing has a default.
      - kind: add
        semver: patch
        target: "schema/v2.8/migration.schema.yaml#/properties/migration/properties/business_case"
        notes: "Optional; a `$ref` to `migration_business_case`."
      - kind: add
        semver: patch
        target: "schema/v2.8/migrations.schema.yaml#/$defs/register_entry/properties/related_decisions"
        notes: "Optional unique list of `decision_ref`, with no minimum length and no default."
      - kind: add
        semver: patch
        target: "schema/v2.8/migrations.schema.yaml#/$defs/register_entry/properties/business_case"
