  - version: "2.8.98"
    date: "2026-11-14"
    step: "text required in one branch states something"
    summary: |
      Text that becomes required in one arm of a choice states something, as every other required
      text field does. 13 such properties accepted an empty string and now carry the constraint
      that fits what they hold:

      - A concept's and an enumeration's `name` and `term`, one of which each requires, are one
        line with no surrounding whitespace (`^\S(?:.*\S)?$`). `term: ""` and `name: "Order "`
        are rejected.
      - A test case's act `description`, required when the act names no `operation`, needs at
        least one visible character (`\S`).
      - A contract's superseded `output`, required in eight contract definitions when the contract
        has no `contract_name`, is one of its documented forms, `<name>`, `<slice>/<name>` or
        `_global/<name>`: one or two segments without whitespace or backslash, joined by one `/`
        (`^(?:[^\s/\\]+/)?[^\s/\\]+$`). An empty value, a value holding a space, a leading or
        trailing `/` and a path of three segments are rejected.

      A tightening in a patch version, stated rather than implied: a document holding an empty,
      blank or padded value in one of these fields, or an `output` outside its documented forms,
      was accepted under 2.8.97 and is rejected under 2.8.98. FORWARD compatible: every document
      valid under 2.8.98 is valid under 2.8.97. The published examples and the schema's own
      examples validate unchanged. A model that fails now is fixed by writing the text the field
      asks for or trimming its surrounding whitespace; an `output` can instead be replaced by
      `contract_name` with `slice` or `cross_cutting`. No instance migration is provided. Minted
      rather than folded into 2.8.97 because the set of accepted documents changes.
