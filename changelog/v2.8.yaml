  - version: "2.8.107"
    date: "2026-11-19"
    step: "migrations name their purpose and operations name what they replace"
    summary: |
      Migration documents, history entries and tracked entries accept optional `leverage_refs`,
      a list of distinct leverage point ids. A link records purpose, not completion. The leverage
      point's `migration_refs` remains valid and readable, soft-deprecated with a warning naming
      the edit needed to move each link to its migration. Both ends contribute to one
      `migration_serves_leverage` edge (Migration -> LeveragePoint), with provenance `migration`,
      `leverage-point` or `both`. The `leverage_migration` relation is retired; chains and its graph
      style use the new direction. Tracked entries resolve against their model without becoming
      graph nodes. BACKWARD, PATCH; validators predating this field reject it. Removal of the old
      field belongs to the next major schema line.
      Operations accept an optional unique `supersedes` list of operation references. References
      resolve against every retained model record, including a removal's before data. The graph
      draws one `operation_supersedes` edge per pair present in the same state, with no placeholder
      for an absent target. Self-replacement and replacement cycles produce warnings, including
      operations retained only in a removal's `before` data. Coexistence
      is valid, and replacement does not imply that callers move. The field is BACKWARD, PATCH;
      older validators reject it.
      Replay applies an entity `rename`: the entity keeps its graph identity, content, file and
      relationships under its new declared id, and children placed in a renamed context follow it.
      A later change in the same migration does not yet address the entity by its new id. Entity
      bodies in a migration's `before` and `after` blocks are checked against their entity schemas;
      an invalid body produces a warning naming the migration, the body and the field. Placement
      fields replay reads (`_written_in`, `_context`) are not checked as entity fields.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/design/domain.schema.yaml#/$defs/operation/properties/supersedes"
        notes: "Optional unique operation references record succession; graph edges join operations in one state and cycles warn."
      - kind: add
        semver: patch
        target: "schema/v2.8/migration.schema.yaml#/properties/migration/properties/leverage_refs"
        notes: "Optional unique leverage refs in all three migration forms; tracked reference checks included."
      - kind: deprecate
        semver: none
        target: "schema/v2.8/governance/leverage.schema.yaml#/$defs/leverage_point/properties/migration_refs"
        notes: "Still accepted and read; warn with the remedy per migration."
  - version: "2.8.106"
    date: "2026-11-18"
    step: "an inquiry pins its question to any element the model declares by a typed id"
    summary: |
      An inquiry can name any element the model declares by a typed id in `affects.element_refs`
      (titled Model elements): an entity of any type, such as an infrastructure resource, an
      environment, a screen, a finding, a migration, a watch item or another inquiry, or a part of an
      entity that carries its own id, a process activity (PA###) or a concept attribute (CAT###). A
      part names that part only, never its process or concept as a whole, and an entity names itself
      only: its children, parent and neighbours are not implied. The nine kind lists beside it keep
      their values and their meaning, and naming an id in `element_refs` means the same as naming it
      in the list for its kind, so each id is named once. For example:

          inquiries:
            - id: INQ002
              statement: Does the nightly export need its own database, or can it read the replica?
              status: open
              affects:
                element_refs: [IR003, ENV001, PA004]   # PA004 is an activity of PRC001
                concept_refs: [CN001]

      The list's items are a new reference type, `model_element_ref`: a typed id, scope prefix
      optional, that is not a resource type (RT###, in the catalog outside the model) and not a use
      case step (UCS###, unique only within its scenario); a scope name and the keyed `scope:key`
      form are not typed ids. The list takes each id once. An id no file declares is a
      cross-reference error, and the scope prefix is part of the id, so `CN001` does not name a
      declared `delivery.CN001`.

      In the model graph an `element_refs` id draws an `inquiry_affects` edge to the entity, and a
      part draws one to the entity that declares it, with `data.part` naming the part
      (`{ id, kind }`, kind `process_activity` or `concept_attribute`); an activity edge also keeps
      `data.activity`, and an activity named in `process_activity_refs` now carries the same
      `data.part`. One question pinned to one target through a kind list and through `element_refs`
      is one edge. An id that several elements declare (in practice two processes that declare one
      activity id) is drawn to an ambiguous placeholder that lists them, and an undeclared id to a
      missing placeholder, never to a declared element. A watch item (WCH###) is a graph entity,
      `WatchItem`, named by its title, and its `risk_refs` and `finding_refs` are `watch_item_risk`
      and `watch_item_finding` edges. Its `decision_refs` draw `watch_item_decision` edges to the named decisions.
      Three semantic rules read the list: `inquiry-pins-itself`
      (error) reports an inquiry that names its own id, `inquiry-pin-named-twice` (warn) an id also
      named in a kind list, and `inquiry-pin-ambiguous` (warn) an id several elements declare. The
      governance ledger projection resolves the list among every entity and part and reports an id
      declared by none or by several as a gap. A part id is found from either end: `bp node` and the
      MCP `get_node` and `get_neighbors` answer an id no entity declares that names a part with the
      part, its container and only the relations that pin that part, an inquiry's own view labels a
      part pin with the part, and `bp impact` refuses a part and names its container.

      BACKWARD: every document valid under 2.8.105 is valid under 2.8.106, and every value of the
      kind lists resolves and draws as before. Not FORWARD: `affects` is closed, so a 2.8.105
      validator rejects an inquiry that states `element_refs`, and a 2.8.105 model builder draws no
      edge for it. No instance migration. Minted rather than folded into 2.8.105 because the set of
      accepted documents grows.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/metamodel.schema.yaml#/$defs/model_element_ref"
        notes: "Typed id, scope prefix optional, `not` RT### and UCS###; one `modeling_guidance` lesson on pinning an inquiry."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/inquiry/properties/affects/properties/element_refs"
        notes: "Optional, unique items of `model_element_ref`; the `affects` description names it beside the kind lists."
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "Two rows in the relations table: an inquiry's model elements and a watch item's risks and findings."
  - version: "2.8.105"
    date: "2026-11-18"
    step: "a migration states where an entity it adds lands and moves an existing entity"
    summary: |
      An entity change can state where the entity it adds, splits off or merges into is declared
      (`placement`), and a new entity change kind, `move`, declares an existing entity in another file
      or slice while it keeps its id and content. A placement names a `slice` (a folder under the model
      root), a `file` (relative to the model directory, its name routing to the entity's layer), or
      both, the file then sitting in the slice. With a slice alone the entity is read from that slice's
      one file for its layer, or from the layer's plain file name in the slice (`billing/infrastructure.yaml`)
      when it holds none; a slice with several such files needs `file`. A move requires `placement` and
      may state `placement_before`, where the entity is declared before the move, which applying the
      move checks. `placement` is allowed on add, split (every new piece) and merge (the result),
      required on move and not allowed on modify, deprecate, remove and rename. For example:

          changes:
            entities:
              - kind: add
                entity_type: resource
                target: IR014
                placement: { slice: billing }
                after: { id: IR014, name: Billing database, kind: database }
              - kind: move
                entity_type: resource
                target: IR009
                placement: { slice: billing }
                placement_before: { slice: orders }

      Replaying a migration reads the entity from the placed file in every model state that includes
      it (TO-BE and point-in-time), so a slice selection holds an unscoped addition that states its
      slice, and a moved entity takes the document defaults of its new file. Without a placement an
      addition is placed as before: beside entities of the same type that share its id's slice prefix,
      else read from the migration document. The meta operations `move-to-slice` and `document-move`
      keep their values and change no entity; their description now says so. Validation reports a file
      outside the stated slice and a file name that routes to no layer as errors, and as warnings a
      file of a layer that does not hold the entity type, a slice the model has neither as a folder nor
      in `layout.slices`, a scoped id moved into another slice (with a rename suggested in the same
      group), an internal `after._written_in` stated without `placement`, and a meta move word aimed at
      an entity id; an `after._written_in` that disagrees with `placement` is an error.

      A tracked change set gains a `move` operation (`target`, `file`, optional `from`): `bp move` on a
      tracked project stages it after the same guards as in direct mode (same layer, same slice, an
      existing destination), `bp migration apply` performs it with the same relocation, and a rollback
      restores both files from the recorded edit sites. `bp split-file` and `bp merge-file` still
      refuse in tracked mode and name `bp move`.

      BACKWARD: every document valid under 2.8.104 is valid under 2.8.105 and replays to the same model;
      no existing document states `placement`. Not FORWARD: `entity_change` and the tracked operations
      are closed, so a 2.8.104 validator rejects a change that states `placement` or `placement_before`,
      a change of kind `move` and a staged `move`. No instance migration. Minted rather than folded into
      2.8.104 because the set of accepted documents grows.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/migration.schema.yaml#/$defs/entity_placement"
        notes: "Closed object, at least one of `slice` (root slice name pattern) and `file` (tracked `new.file` pattern)."
      - kind: add
        semver: patch
        target: "schema/v2.8/migration.schema.yaml#/$defs/entity_change/properties"
        notes: "Optional `placement` and `placement_before` (`entity_placement`); `allOf` requires `placement` on move, refuses it on modify, deprecate, remove and rename, and refuses `placement_before` off a move."
      - kind: add
        semver: patch
        target: "schema/v2.8/migration.schema.yaml#/$defs/entity_change_kind"
        notes: "`move`."
      - kind: docs
        semver: none
        target: "schema/v2.8/migration.schema.yaml#/$defs/meta_change/properties/kind"
        notes: "States that no meta operation changes an entity when the migration applies."
      - kind: add
        semver: patch
        target: "schema/v2.8/tracked-migrations.schema.yaml#/$defs/patch_op_move"
        notes: "Closed object: required `op`, `target` and `file`, optional `from`; `move` added to `patch_op.op`."
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "Placement and move in the migration file structure."
  - version: "2.8.104"
    date: "2026-11-18"
    step: "an inquiry names who is expected to answer it, apart from who drives it"
    summary: |
      An inquiry can state who is expected to answer it now (`asked_of`, titled Addressee) and whom it
      was asked of before (`previously_asked_of`, titled Earlier addressees), apart from who drives it
      to a resolution (`owner`), the unit accountable for it (`owned_by`) and who cares about the
      answer (`stakeholders`). The addressee may work outside the area the inquiry is about: an
      architecture question about a payments screen is driven by the payments team and asked of the
      architecture team.

      An addressee names an actor (`actor`, ACT###: a person or a role) or a team (`team`, TM###), or
      states a `name` for an addressee the model does not declare, or a name beside one reference, the
      reference then being the addressee and the name the addressee as the source states it. A name is
      never a typed id and draws no graph edge; two addressees stated by name are one addressee only
      when the names are written identically. One addressee at a time: a question for two answerers is
      two questions, or one asked of a team both belong to. Absent: the model does not say who is
      asked, and nothing is inferred from `owner`. `previously_asked_of` lists earlier addressees,
      oldest first, each with how the inquiry left them (`redirected`, `partly-answered` or
      `reassigned`) and a `date` and `note` only where a source gives them; the current addressee is
      never listed there, and passing an inquiry on leaves `status` as it is. For example:

          inquiries:
            - id: payments.INQ101
              statement: How long are declined card payments kept?
              status: investigating
              owner: TM001
              asked_of: { team: TM003 }
              previously_asked_of:
                - asked_of: { actor: payments.ACT004 }
                  outcome: partly-answered
                  date: "2026-10-02"
            - id: payments.INQ102
              statement: Is a partial refund a new payment or a change to the old one?
              status: open
              asked_of: { name: Domain expert }

      An actor or team reference nobody declares is a cross-reference error, for the current and for
      each earlier addressee. The model graph gains an `inquiry_asked_of` edge to the addressee, with a
      name stated beside the reference as edge data, and an `inquiry_previously_asked_of` edge per
      earlier addressee, carrying its position, outcome and date; a name alone draws neither. A new
      semantic rule, `inquiry-passed-on-without-addressee` (warn), reports an unsettled inquiry that
      lists earlier addressees and states no `asked_of`: the state is valid, because a source may say
      "ask someone else" without saying whom, and it is made visible. The governance ledger projection
      reads both fields, gives each inquiry exactly one addressee group (a resolved reference, an exact
      name, an unresolved or ambiguous reference, or unassigned) and reports the same case as a gap.

      BACKWARD: every document valid under 2.8.103 is valid under 2.8.104; `owner`, `owned_by`,
      `stakeholders` and `status` keep their meaning, and an inquiry without the new keys draws exactly
      the edges it drew before. Not FORWARD: `inquiry` is closed, so a 2.8.103 validator rejects an
      inquiry that states `asked_of` or `previously_asked_of`. No instance migration: nothing copies
      `owner` into `asked_of`, and an addressee is written only where a source states it. Minted rather
      than folded into 2.8.103 because the set of accepted documents grows.
    changes:
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/inquiry/properties"
        notes: "Optional `asked_of` (`inquiry_addressee`) and `previously_asked_of` (array of `inquiry_earlier_addressee`); `owner` names `asked_of` as distinct."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/inquiry_addressee"
        notes: "Closed object: optional `actor` (`actor_ref`), `team` (`team_ref`) and `name` (non-blank, never a typed id); at least one, at most one reference."
      - kind: add
        semver: patch
        target: "schema/v2.8/governance/motivation.schema.yaml#/$defs/inquiry_earlier_addressee"
        notes: "Closed object: required `asked_of` and `outcome` (`redirected`, `partly-answered`, `reassigned`), optional `date` (ISO date) and `note`."
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "Two rows in the relations table: the addressee and the earlier addressees."
  - version: "2.8.103"
    date: "2026-11-18"
    step: "a migration states its owning team, change stream, tracker item, reach and why it waits"
    summary: |
      A migration can state who carries it out, where it belongs and why it waits, in the same keys on
      all three shapes: a migration document (`migration:`), a register entry and a tracked entry.

      `owned_by` names the one team that carries the migration out, as one release; a change too large
      for one team is several migrations joined by `depends_on`. `change_stream_ref` names the change
      stream the migration belongs to, at most one. Change streams are declared once in
      `blueprint.yaml` `change_streams[]` (`CS###`, `name`, optional `description`): a stream groups
      migrations for a reader and states no team and no scope, because its teams are the owners of its
      migrations and its reach is theirs. `tracker_ref` names the item that stands for the migration in
      an external issue tracker, resolved to a link like every other `tracker_ref`; several migrations
      may share one item. `depends_on_reasons` states why the migration waits for a migration in
      `depends_on`, one entry per dependency with a prose reason; `depends_on` itself is unchanged.
      `reach` states the bounded contexts and domains the migration changes, only where its changes
      cannot show them; otherwise they are derived from the changes. A tracked entry also gains
      `related_decisions`, as the register entry has. `migration.schema.yaml` carries an `x-gdsm`
      block naming the task it serves: a migration map grouped by change stream.

      A change stream, team, decision, context or domain nothing declares is a cross-reference error,
      on every shape; on a tracked entry the entry-level references resolve against the model the
      register sits beside. The model graph gains a `ChangeStream` node per registry entry, a
      `migration_in_change_stream` edge, the stated reason on the `migration_depends_on` edge, and a
      `migration_reach` edge per context or domain with its provenance (`derived`, `declared` or
      `both`); each Migration node carries the derivation with every change it read, the model state
      it read it against and the outcome, and an untraced change is counted rather than read as a
      reach of nothing. Three semantic rules warn where the schema cannot decide:
      `migration-without-team-owner` (no owner, or a department or party instead of a team; a name
      alone is not reported), `migration-reach-disagrees` (a stated reach the changes contradict) and
      `migration-dependency-reason-unlisted` (a reason for a migration `depends_on` does not list, or a
      second reason for one). Validation gives the same warnings for a tracked register, and warns
      when variants of one group belong to different change streams. For example:

          change_streams:
            - id: CS001
              name: Orders modularization

          migration:
            id: MIG005
            name: order-api
            date: "2026-11-18"
            status: draft
            description: The order API moves behind the orders module.
            owned_by: { team: TM001 }
            change_stream_ref: CS001
            tracker_ref: ABC-1200
            depends_on: [MIG002]
            depends_on_reasons:
              - migration: MIG002
                reason: The order API calls the identity module MIG002 extracts.

      BACKWARD: every document valid under 2.8.102 is valid under 2.8.103. Not FORWARD: a 2.8.102
      validator rejects a migration that states any of the new keys, and a root that declares
      `change_streams`. No instance migration is needed; a migration without an owner is reported by
      the new owner rule as a warning. Minted rather than folded into 2.8.102 because the set of
      accepted documents changes.

      This release ALSO states that a command's outcome need not be an event. A command states its
      outcome through `produces`, `materializes` or `side_effects.writes`; creating, updating,
      deleting or archiving a concept, and writing an activity-log record or an external sink, are
      outcomes of their own. `missing-causal-links` (warn) now reports only a command that states
      none of the three: any nonempty `produces.operations` list counts, a document included, while
      `mode` alone or an empty list states nothing. Two new semantic rules, both `info`, give advice
      and never require an event or a deletion. `governed-command-without-event` reports a command
      governed by a rule (`governed_by`, `preconditions`, `postconditions` or a substantive legacy
      `rules` clause) whose `produces` names no event, so its decision can be reviewed.
      `anemic-event-candidate` reports an event whose producers are all commands with no rule
      governance, when no operation reacts to it, it is not published and no `translates` names it
      or is written on it; an event with no producer is not reported, and one reaction is enough to
      make an event meaningful. The finding names the event's derived reach, and `unstated` reach
      there is uncertainty, not proof that the event stays inside its context. The descriptions of
      `operation.kind`, `produces`, `materializes` and `side_effects.writes` say the same. No field
      and no enum value is added: whether an event is anemic is a review hint, not a kind.

      FULL: only descriptions and the semantic rule pack change, so every document valid under the
      earlier 2.8.103 is valid now and the reverse. A model sees fewer `missing-causal-links`
      warnings where a command already stated a materialization, a write or a document, and new
      `info` findings. Folded into this entry rather than minted: 2.8.103 carries no tag, it has not
      been ported, and descriptions and rules leave the set of accepted documents identical in both
