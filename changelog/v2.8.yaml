    step: "queues and topics become message channels placed on a broker, an exchange names its channel and a consuming contract names its subscription"
    summary: |
      An architecture document accepts a new optional root list, `channels:`. Each entry is a message channel with a typed id (MCH###), a `name` and a `kind`: `topic`, where producers publish and every subscriber receives a copy (an AMQP exchange, a Kafka topic), or `queue`, where messages wait for one reader. A channel may state its wire `address` (the `name` otherwise), the broker it lives on (`broker_ref`, an infrastructure resource), a `description`, and protocol bindings keyed by protocol; `bindings.amqp.exchange_type` says which kind of AMQP exchange a topic channel is.
      An operation names the channel it travels on through a new optional `channel_ref` on its inline `exchange.topic` or `exchange.queue`. The inline `name` keeps its meaning: on a topic channel it is the routing key the message is published with. An `asyncapi` contract accepts a new optional `subscription`: the consuming service's own subscription, by `channel_ref` to a queue channel where the broker gives each subscriber a queue (AMQP), or by `name` where it is no channel (a Kafka consumer group). The messages bound to it are the contract's `receive:` list. Every reference resolves like any other typed id, so a channel nothing declares is a cross-reference error.
      The model builder extracts each channel as a `MessageChannel` entity in the architecture layer and draws three edges: `channel_broker` from a channel to its broker, `travels_on` from an operation to its channel (carrying the role, the routing key and the protocol), and `contract_subscription` from a consuming contract to its queue. The semantic checker adds two warnings: `message-queue-unread`, a queue from which no contract receives anything, and `message-channel-mismatch`, a channel named in a way its own declaration contradicts - a queue named as a topic or the reverse, a topic named as a subscription, or an operation travelling over a protocol the channel declares no binding for. `contract-operation-missing-channel-address` accepts a `channel_ref` as the channel's address.
      Contract generators (Archally Pro) place a message published to a declared AMQP topic channel on its routing key, with the AMQP binding naming the exchange and its type, and place the messages a consuming contract receives on its subscription queue, described as an AMQP queue. A model that declares no channel produces the same documents as before.
      Widened: a document carrying `channels`, `channel_ref` or `subscription` was rejected by 2.8.66 and is accepted now, so the version is minted rather than folded into the untagged 2.8.66. Every document 2.8.66 accepted is still accepted, the inline `topic` and `queue` included.
  - version: "2.8.66"
    date: "2026-10-11"
    step: "a messaging contract names its broker by a typed reference to an infrastructure resource"
    summary: |
      An `asyncapi` contract accepts a new optional member, `broker_ref`: the infrastructure resource (IR###) that declares the message broker the contract publishes to and receives from. One broker per contract. The reference resolves like every other typed id, so a broker nothing declares is a cross-reference error; the model builder draws it as a `contract_broker` edge from the contract to the resource, and the context-to-context traffic the contracts compute carries it in `broker_ids`.
      `brokerId`, the free string it supersedes, stays accepted on this line and resolves to nothing. A contract carrying both is rejected, at `brokerId`: two answers to one question leave nothing to say which is current.
      The semantic checker adds two warnings. `contract-broker-id-superseded` names every contract that still writes `brokerId` and the typed field to write instead. `broker-ref-target-not-a-broker` names an infrastructure resource that contracts name as their broker while its `kind` is not `broker`, once per resource, with the contracts that point at it. The description of a resource's `kind` names `broker` for a message broker.
      Contract generators (Archally Pro) resolve the broker the contract names - `broker_ref`, else `brokerId` - against the resources of the typed infrastructure layer, and take the AsyncAPI servers from it: one server per environment that declares a host, with the protocol the host's scheme states. A broker that resolves and declares no host, and a `brokerId` that names no resource, are each reported; the second names `broker_ref` as the field to set. The architecture map (Archally Pro) labels a broker named by `broker_ref` with the resource's name.
      Widened: a document carrying `broker_ref` was rejected by 2.8.65 and is accepted now, so the version is minted rather than folded into the untagged 2.8.65. Every document 2.8.65 accepted is still accepted.
  - version: "2.8.65"
    date: "2026-10-11"
    step: "the checker counts a reaction or an initiating actor as the caller of an in-process operation"
    summary: |
      `inprocess-provide-without-consume` (warn) reports an operation provided in-process only when nothing in the model starts it. Three things start one: another service consumes it under `contracts.inprocess.consume`; it reacts to an operation that reaches its providing service; or an actor initiates it (`initiated_by`). A service hears an operation it receives in a contract's `receive:`, and one it raises: an operation it provides under `expose:`, `send:` or `provide:`, or one that such an operation `produces`. A service listing an operation it provides itself under `consume:` states nothing, so that entry starts nothing and is never reported. An operation its own service's message handler or a timer starts is no longer reported.
      The semantic checker adds `inprocess-reaction-unreached` (warn): an operation provided in-process that reacts to an operation none of its providing services hears. The message names the triggers and the service, and both fixes: add the trigger to that service's `receive:` list, or provide the operation from the service that hears it. An operation whose reactions all miss its service is reported by this rule alone, not by both. A trigger that resolves to no declaration is left to the cross-reference error.
      The descriptions of `inprocess.provide` and `inprocess.consume` say the same: an operation a service starts itself needs no `consume:` entry, and `consume:` names an operation another service owns.
      Nothing validates differently: every document that validated under 2.8.64 validates, and every one it rejected is rejected. Minted rather than folded, because 2.8.64 is tagged.
  - version: "2.8.64"
    date: "2026-10-06"
    step: "a goal names the assumptions it rests on"
    summary: |
      A goal accepts a new optional member, `assumption_refs`: the assumptions the goal rests on, so that if one of them proves wrong the goal is at risk. Each item is an assumption id, a typed reference: an id nobody declares is a cross-reference error on every validator surface, and an id of another kind fails the item's pattern. The link is stated by the goal only, as a decision names the assumptions it depends on in `motivation_refs.assumptions`; an assumption names none of the goals that rest on it, so an assumption several goals rest on is listed on each of them.
      The model builder draws a `goal_assumption` edge from the goal to every assumption it names; an id nobody declares lands on a placeholder. Neighbour and impact queries reach a goal, and through `advances_goals` the roadmap items advancing it, from an assumption. The relation type joins the list a migration's relationship change may name. `assumption-unplaced` counts an incoming `goal_assumption`, so an assumption a goal rests on is no longer reported as placed nowhere.
      Additive: every document that validated under 2.8.63 still validates. Not forward-compatible: a model whose goal carries `assumption_refs` is rejected by a 2.8.63 tree, because a goal rejects keys it does not declare.
  - version: "2.8.63"
    date: "2026-10-05"
    step: "a roadmap milestone names its item in an issue tracker"
    summary: |
      A roadmap milestone accepts a new optional member, `tracker_ref`, the definition a work item and a blocker already use: a key, a `<tracker>:<key>` pair or a full URL, resolved to a link through the blueprint's `trackers` registry. It names the item that stands for the milestone in the tracker, such as an initiative or a release epic, while each work item that rolls up to the milestone keeps its own. It is a plain string: it builds no entity and no graph edge, and a milestone names one tracker item, so a list is rejected.
