        notes: "Optional object: one `infra_resource_ref` key at most (`maxProperties: 1`), the shared `provenance` as its value, as for a messaging contract's `broker_ref`."
      - kind: docs
        semver: none
        target: docs/schema-reference.md
        notes: "The contract kinds section describes the store of a shared-data contract with an example; the traceability map and the link evidence table name `store_ref`."
  - version: "2.8.96"
    date: "2026-11-14"
    step: "an architectural link states the evidence behind it"
    summary: |
      An architectural link can state its own evidence, apart from the evidence of the records at
      its ends, in the shared `provenance` shape: `discovery_stage`, `certainty` and `evidence`, all
      optional. A link without evidence of its own states none; the provenance of a context, a
      service, an operation or a resource is not evidence for a link it takes part in.

      - `provenance` on a declaration that is itself the link: a context's dependency on another
        context or an external system (`dependency.provenance`), an infrastructure relation of every
        verb and either kind of target (`resource.relations[].provenance`), a service's need
        (`service.needs[].provenance`), a server entry (`service.servers[].provenance`), a binding
        (`binding.provenance`, about its stated realization) and an operation's protocol binding
        (`operation.exchange.provenance`, about the binding, not the operation).
      - `provenance` on every contract kind, for the contract as a whole. It is not evidence for
        any one operation the contract lists. A workflow contract's workflow names are names, so it
        has this field and no map.
      - `link_provenance` on a record that writes a link as a reference: a map keyed by the field's
        name, then by the target exactly as written there, whose values are `provenance`. A service
        names `imports`, `uses`, `routes_to` and `resource_refs`; a contract names its operation
        lists (`expose`, `call`, `send`, `receive`, `provide`, `consume`, `write`, `read`, by kind),
        and a messaging contract also `broker_ref`; a GraphQL contract names `queries`, `mutations`
        and `subscriptions`, keyed by field name in the GraphQL name grammar, never by operation
        reference; a message channel names `broker_ref`; a messaging contract's subscription and an
        exchange's topic and queue each name `channel_ref`. A key takes what its field takes,
        including both forms of an operation reference, and a single reference has at most one
        entry. The map describes links its record states and neither adds nor redirects one; one
        entry covers every occurrence of its target in a list.

      A typed key resolves like every other reference, so a key naming nothing declared is a
      cross-reference error. A key naming a declared target that its field does not state is valid
      under the schema. For example:

          services:
            - id: SVC001
              uses: [SVC002]
              link_provenance:
                uses:
                  SVC002:
                    certainty: confirmed
                    evidence:
                      - kind: codebase-analysis
                        source: services/orders/payments-client.ts
                        date: "2026-11-02"
                        summary: The order service builds a payments client at start-up.

      BACKWARD: every document valid under 2.8.95 is valid under 2.8.96. Not FORWARD: a 2.8.95
      validator rejects each new field. No instance migration is needed. Minted rather than folded into 2.8.95 because the set of
      accepted documents changes.
