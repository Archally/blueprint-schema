  - version: "2.8.73"
    date: "2026-10-14"
    step: "a process runs its activities in the order they are listed unless it states otherwise"
    summary: |
      A process whose main-path activities state no link between them now reads as running those
      activities in the order they are listed. Before, the schema said the flow of such a process
      was inferred from domain causal links, and every reader of it drew something different; now
      the listed order is the order, and a renderer draws it as connected flow.

      The rule, in the `activities` description: the main-path activities run in the order they
      are listed unless a main-path activity states a main-path successor (`next` or
      `next_activities`), in which case the stated links are the whole order. An activity whose
      `path_type` is `error` or `compensation` is never placed in the listed order; only a stated
      link reaches it, and a link to one leaves the listed order of the main path standing. An
      activity that states no `path_type` is on the main path. `trigger` says where the process
      starts (the activity holding its operation, else the first listed main-path activity) and
      `end_states` which activity leads to the one `complete` end state where exactly one is
      declared. `next_activities`, `next` and `steps` say the same in their own terms.

      The model builder reads the rule once, for every renderer and the checker, on the v2.8 line
      only: each activity's derived successors (`_next`) carry an `origin`, `stated` or
      `declared-order`, and each process carries `_start` and `_ends`. On v2.6 and v2.7 the
      builder derives the stated successors alone, each `origin: stated`, as their published text
      says.

      Nothing validates differently: every document that validated under 2.8.72 validates, and
      every one it rejected is rejected. The descriptions changed meaning; no field, enum or
      `required` list changed. Minted rather than folded, because 2.8.72 is tagged.

      This release ALSO attaches the one `complete` end state where every main-path activity has
      a successor: the last listed main-path activity leads to it when all of its stated links go
      to `error` or `compensation` activities. A link that leaves the main path says what happens
      when the work goes wrong or is undone, not that the process never ends, and such a process
      had no activity leading to its `complete` end. The `end_states` description says so, and
      the model builder writes the attachment in `_ends`. Where a main-path activity with no
      successor exists, where the last main-path activity also states a main-path successor, or
      where the process declares no `complete` end state or more than one, nothing changes.
      Folded into 2.8.73 because 2.8.73 is untagged and not yet ported and the change is a
      description only, so until it is tagged the same number names the schema with and without
      this sentence.

      Three checks come with it. `activity-fork-without-gateway` warns where an activity names
      two or more successors and states no `gateway`; a list-order successor is not counted.
      `process-listed-order-against-causality` warns where a process that runs in listed order
      reacts to an event before the activity that produces it, or chains two reactions to one
      event. `process-end-state-unattached` reports, as information, each end state that no
      stated link and no convention attaches an activity to. The two process checks read the
      model builder's derived order, so they speak of the v2.8 line only.
