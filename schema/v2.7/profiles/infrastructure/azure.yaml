---
version: "1.0.0"
profile: azure
substrate: cloud
description: >
  Azure realizations of the neutral resource-type catalog (RD7/RD31). Realizes each neutral RT with
  a vetted Azure Verified Module (AVM) — never raw resources (RD8 scaffold-once). AVM is documented
  here as ONE realization vocabulary, not THE vocabulary; the identical outputs contract is what
  makes the type substrate-neutral.
realizations:
  - realizes: RT001
    substrate: cloud
    module: { ref: "br/public:avm/res/db-for-postgre-sql/flexible-server", version_pin: "1.2.0", system: bicep }
    outputs:
      - { name: host, type: hostname }
      - { name: port, type: int }
      - { name: name, type: string }
      - { name: username, type: string }
      - { name: password, type: string, secret: true }
    notes: "Managed PaaS — Azure Database for PostgreSQL Flexible Server."

  - realizes: RT002
    substrate: cloud
    module: { ref: "br/public:avm/res/storage/storage-account", version_pin: "0.14.0", system: bicep }
    notes: "Azure Blob Storage account."

  - realizes: RT003
    substrate: cloud
    module: { ref: "br/public:avm/res/service-bus/namespace", version_pin: "0.9.0", system: bicep }
    notes: "Azure Service Bus queue/topic."

  - realizes: RT004
    substrate: cloud
    module: { ref: "br/public:avm/res/cache/redis", version_pin: "0.7.0", system: bicep }
    notes: "Azure Cache for Redis."

  - realizes: RT005
    substrate: cloud
    module: { ref: "br/public:avm/res/key-vault/vault", version_pin: "0.9.0", system: bicep }
    notes: "Azure Key Vault."
