---
version: "1.0.0"
profile: openstack
substrate: on-prem
description: >
  OpenStack (private-cloud IaaS) realizations of the neutral resource-type catalog. Realizes
  neutral RTs on a self-run OpenStack cloud via the Terraform OpenStack provider — private-cloud is
  a distinct substrate from public cloud and from bare-metal on-prem, yet realizes the same neutral
  RT001 with an identical outputs contract.
realizations:
  - realizes: RT001
    substrate: on-prem
    module: { ref: "terraform-provider-openstack/openstack//db_instance_v1", version_pin: "2.1.0", system: terraform }
    outputs:
      - { name: host, type: hostname }
      - { name: port, type: int }
      - { name: name, type: string }
      - { name: username, type: string }
      - { name: password, type: string, secret: true }
    notes: "OpenStack Trove (DBaaS) database instance on a private cloud."

  - realizes: RT002
    substrate: on-prem
    module: { ref: "terraform-provider-openstack/openstack//objectstorage_container_v1", version_pin: "2.1.0", system: terraform }
    notes: "OpenStack Swift object storage container."
