---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Blueprint Organization
description: "Governance Plane: Organizational hierarchy — Party > Department > Team. Defines who owns what in the blueprint. Teams are first-class entities under a party; departments reference teams by ID."
type: object
additionalProperties: false
required:
  - version
  - parties
properties:
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
    description: "Content version of this organization document."
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
    description: "Schema version this document conforms to. Omit to assume latest."
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
    description: "Bounded context this organization file belongs to."
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  owned_by:
    $ref: "../metamodel.schema.yaml#/$defs/owned_by"
    description: "File-level ownership default."
  parties:
    type: array
    description: "Organizational parties (companies, business units, or system owners)."
    items:
      $ref: "#/$defs/party"

$defs:

  party:
    type: object
    description: "An organizational party owning departments and teams. Top level of the org hierarchy."
    additionalProperties: false
    required:
      - id
      - name
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/party_ref"
        description: "Unique party identifier (e.g. PRT001 or billing.PRT001)."
      name:
        type: string
        description: "Party name (e.g. company or business unit name)."
      description:
        type: string
        description: "What this party represents in the organization."
      responsibilities:
        type: array
        items:
          type: string
        description: >
          What this party is accountable for, one item per responsibility. `description` carries the
          prose summary; this is the enumerated form a reader or a report can walk.

          Accountability is not ownership. Ownership is stated by an `owned_by` on the unit that is
          owned, so a party can be accountable for an outcome delivered by units it owns no part of.
      departments:
        type: array
        description: "Departments within this party."
        items:
          $ref: "#/$defs/department"
      teams:
        type: array
        description: "Teams belonging to this party. Departments reference these by team_ref."
        items:
          $ref: "#/$defs/team"
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  department:
    type: object
    description: "An organizational department grouping teams under a party."
    additionalProperties: false
    required:
      - id
      - name
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/department_ref"
        description: "Unique department identifier (e.g. DPT001 or billing.DPT001)."
      name:
        type: string
        description: "Department name."
      description:
        type: string
        description: >
          What this department does, in prose. Its accountabilities as an enumerated list are
          `responsibilities`.
      responsibilities:
        type: array
        items:
          type: string
        description: >
          What this department is accountable for, one item per responsibility. `description` carries
          the prose summary; this is the enumerated form a reader or a report can walk.

          Accountability is not ownership. Ownership is stated by an `owned_by` on the unit that is
          owned, and a department is accountable for work its teams own rather than owning it itself.
      teams:
        type: array
        description: "References to teams in this department (team_ref IDs)."
        items:
          $ref: "../metamodel.schema.yaml#/$defs/team_ref"
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  team:
    type: object
    description: "A team responsible for blueprint entities. Referenced by owned_by across all schemas."
    additionalProperties: false
    required:
      - id
      - name
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/team_ref"
        description: "Unique team identifier (e.g. TM001 or billing.TM001)."
      name:
        type: string
        description: "Team name."
      kind:
        type: string
        enum:
          - dev-stream-aligned
          - dev-platform
          - dev-enabling
          - dev-complicated-subsystem
          - qa
          - test-automation
          - design
          - product
          - security
          - operations
          - people
          - management
        description: >
          The team's primary function. One flat list at two levels: the `dev-` values refine the
          engineering function by the team's role in the architecture, the rest name other
          organizational functions.

          It carries a fact nothing else in the model states, and without it a team that owns no
          bounded context is unreadable: for a design or people team that is correct, for a
          stream-aligned team it is a gap, and no tool can tell the two apart from ownership alone.

          Choosing a value is a judgement, so the distinctions that decide the hard cases:
          `dev-stream-aligned` builds and runs a slice of the product end to end;
          `dev-platform` builds something other teams consume as a service;
          `dev-enabling` raises other teams' capability and expects to move on;
          `dev-complicated-subsystem` owns a part requiring specialist knowledge to change;
          `operations` runs services rather than building what others consume, which is the line
          that separates it from `dev-platform` for a team doing both;
          `test-automation` builds and maintains the automation, `qa` decides what quality means.

          The value names the PRIMARY function and `tags` carry the rest. A team that builds internal
          tooling and also runs production is one or the other, never both, and the choice states
          what the team is for.
      description:
        type: string
        description: >
          What this team does, in prose. Its accountabilities as an enumerated list are
          `responsibilities`.
      responsibilities:
        type: array
        items:
          type: string
        description: >
          What this team is accountable for, one item per responsibility. `description` carries the
          prose summary; this is the enumerated form a reader or a report can walk.

          Accountability is not ownership. Ownership is stated by an `owned_by` on the unit that is
          owned, and the two come apart: an enabling team raises other teams' capability and owns no
          part of what they build, so a team that nothing points at may still carry a full list here.
      contact:
        type: object
        description: "Team contact information."
        additionalProperties: false
        properties:
          email:
            type: string
            format: email
            description: "Team contact email."
          slack:
            type: string
            description: "Slack channel (e.g. #team-backend)."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
