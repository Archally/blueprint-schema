---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Blueprint Infrastructure Resources
description: "Design Plane: Infrastructure resource definitions and deployment topology. Declares platform resources (databases, queues, storage, services), ownership, per-environment configuration, and service placement across tiers. v2.7.7 adds knowledge-graph participation — typed resource ids (IR###), first-class typed Environments (ENV###), TOSCA inter-resource relations, and IaC traceability — all substrate-neutral (cloud, on-premise, hybrid) and strictly additive."
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
    description: "Content version of this resources document."
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
    description: "Schema version this document conforms to. Omit to assume latest."
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/context_prefix"
    description: "Bounded context this resources file belongs to."
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  owned_by:
    $ref: "../metamodel.schema.yaml#/$defs/owned_by"
    description: "File-level ownership default. Entities inherit unless overridden."
  name:
    type: string
    description: "Name of this resource group or service collection."
  description:
    type: string
    description: "Purpose and ownership context of these infrastructure resources."
  environments:
    type: array
    items:
      oneOf:
        - type: string
        - $ref: "#/$defs/environment"
    description: "Declared environments. Legacy form: a plain name string (e.g. dev, staging, prod). v2.7.7 form: a typed Environment object (id ENV###, substrate, target_scope, …). Both are valid (additive); name strings still validate per-environment resource-config keys. A string branch is a literal env-name; the object branch requires id+name — no overlap (unambiguous oneOf)."
  resources:
    type: array
    description: "Infrastructure resources: databases, queues, caches, storage, external services."
    items:
      $ref: "#/$defs/resource"
  topology:
    $ref: "#/$defs/deployment_topology"
    description: "Deployment topology: how services are placed across tiers, regions, and environments."
  bindings:
    type: array
    description: >
      (resource-type × environment) → implementation bindings (BND###, v2.7.7 CR-2). A binding
      resolves an abstract need / resource-type in a specific environment to a concrete platform
      module + pinned version + params — the intent→implementation bridge that survived across
      Radius recipes ≡ Score ≡ Crossplane v2 ≡ Humanitec (research S3, EVD-B2/C1). Optional/additive.
      Substrate-neutral: the same neutral type binds to a cloud module in a `cloud` ENV and an
      on-prem module in an `on-prem` ENV — hybrid falls out as two bindings (RD31).
    items:
      $ref: "#/$defs/binding"
  deployment_scopes:
    type: array
    description: >
      Deployment scopes (DSC###, v2.7.7) — the management / lifecycle / ownership /
      billing partitions that OWN resources: Azure Resource Groups + Subscriptions,
      AWS Accounts / OUs, GCP Projects / Folders, Kubernetes Clusters / Namespaces,
      on-prem Datacenters / host-pools. Scopes nest via `parent` to form the
      subscription -> resource-group hierarchy; a resource joins a scope via
      `resource.scope_ref`. Distinct from TOSCA `hosted_on` (runtime placement) and
      from the id scope-prefix (authoring grouping). Optional/additive — may live in a
      shared file so several contexts reference one subscription (concat-merge).
    items:
      $ref: "#/$defs/deployment_scope"

$defs:

  resource:
    type: object
    description: "An infrastructure resource with platform identity and per-environment configuration."
    additionalProperties: false
    required:
      - id
      - kind
      - name
    properties:
      id:
        type: string
        description: "Unique resource identifier. SHOULD match IR### (metamodel `infra_resource_ref`); a free-string id (kebab-case) stays valid but the validator WARNs (optional in v2.7.x, REQUIRED from v2.8 — RD25). Used in topology tier references and as a relation target."
      kind:
        type: string
        description: "Resource type (e.g. database, queue, storage, cache, api, function, service)."
      name:
        type: string
        description: "Human-readable resource name."
      summary:
        type: string
        description: "One-line summary for listings."
      description:
        type: string
        description: "Detailed description of this resource's purpose and usage context."
      owner:
        $ref: "#/$defs/resource_owner"
        description: "Ownership and responsibility for this resource."
      platform:
        type: object
        description: "Platform metadata. name=provider (azure, aws, gcp, k8s), type=resource-specific type."
        additionalProperties: true
        properties:
          name:
            type: string
            description: "Platform name (e.g. azure, aws, gcp, k8s)."
          type:
            type: string
            description: "Platform-specific resource type (e.g. cosmosdb, sqs, gcs, postgres)."
      environments:
        type: object
        description: "Per-environment configuration keyed by environment name. Use ALL for config shared across all environments."
        additionalProperties:
          $ref: "#/$defs/environment_config"
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Resource-level ownership override."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
        description: "Open metadata bag for resource-level custom attributes."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
      code_refs:
        $ref: "../metamodel.schema.yaml#/$defs/code_refs"
      type_ref:
        $ref: "../metamodel.schema.yaml#/$defs/resource_type_ref"
        description: "Optional typed reference to a resource type (RT###) in the resource-type catalog (step 04). Resolves to the type's inputs/outputs contract; the concrete platform realization is chosen per environment by a binding (BND###)."
      scope_ref:
        $ref: "../metamodel.schema.yaml#/$defs/deployment_scope_ref"
        description: "Optional management/lifecycle partition (DSC###) this resource is owned in — its resource-group / namespace / host-pool. Distinct from `hosted_on` (runtime placement): a logical DB may be `scope_ref` its own resource-group yet `hosted_on` a shared SQL elastic pool (the RG-vs-pool distinction). Absent => tooling may derive grouping from the id scope-prefix."
      hosting_model:
        type: string
        enum:
          - managed-service
          - vm
          - container
          - bare-metal
          - serverless
          - network-link
          - external-saas
        description: "Substrate-neutral realization classifier (RD31): HOW the resource is hosted — a managed cloud/PaaS service, an IaaS/on-prem VM, a container, bare metal, serverless, a hybrid network interconnect (network-link), or an external SaaS. Drives portability/cost/hybrid-boundary analysis and makes cloud-vs-on-prem legible. Additive to the coarse free-string `kind` (WHAT it is: database/queue/…)."
      relations:
        type: array
        description: "Typed inter-resource relations (TOSCA vocabulary, RD11) — the typed replacement for untyped links in the `properties` bag. `hosted_on` is the canonical placement edge; connects_to/depends_on/attaches_to/routes_to express wiring. For a hybrid interconnect, a network-link resource's connects_to/routes_to targets may sit in a different environment/substrate (RD31)."
        items:
          $ref: "#/$defs/infra_relation_edge"
      iac_refs:
        $ref: "#/$defs/iac_refs"
        description: "Infrastructure-as-Code traceability for this resource — the analogue of code_refs for infra. Spans cloud provisioners AND on-prem config-management (RD31)."
      lifecycle:
        $ref: "#/$defs/lifecycle"
        description: "Optional lifecycle/protection posture (architect-altitude, RD14)."
      exposure:
        type: string
        enum:
          - public
          - internal
          - dmz
          - private
          - air-gapped
          - vpn-only
          - peered
        description: "Neutral network-exposure posture (RD31): reachable from the internet (public), internal-only (internal), perimeter (dmz), isolated (private / air-gapped), reachable only via VPN (vpn-only), or over a peered network (peered). The provider-specific mechanism goes in `exposure_detail`, keeping this enum substrate-neutral."
      exposure_detail:
        type: string
        description: "Optional provider-specific exposure mechanism (free-text): e.g. 'azure-private-endpoint', 'vnet-integrated', 'aws-privatelink', 'on-prem firewall DMZ'. Retains the concrete mechanism while `exposure` stays neutral."
      identity:
        $ref: "#/$defs/resource_identity"
        description: "Optional workload identity this resource runs as (cross-cutting, EVD-B3/B6). Neutral-named — a cloud managed identity OR an on-prem AD / k8s service account (RD31)."
      access:
        type: array
        items:
          $ref: "#/$defs/access_grant"
        description: "Optional RBAC access grants (identity × target × role triples, EVD-B6). Neutral — cloud IAM OR on-prem AD/LDAP. Semantic level only; mechanics live in the module."
      observability:
        $ref: "#/$defs/observability_binding"
        description: "Optional per-resource telemetry wiring — where this resource sends logs/metrics (was AVM 'diagnostics'). Neutral: cloud diagnostics OR on-prem syslog/SNMP/Prometheus (RD31). Distinct from the quality-layer observability STRATEGY."
      redundancy:
        $ref: "#/$defs/redundancy"
        description: "Optional availability-domain spread (was AVM 'zones'). Neutral: cloud AZs/regions OR on-prem sites/racks (RD31)."
      encryption_key:
        $ref: "#/$defs/encryption_key"
        description: "Optional encryption-key posture (was AVM 'customer_managed_key'). Neutral: cloud KMS/Key-Vault OR on-prem HSM/Vault. A key REFERENCE, never key material (RD16, RD31)."
      deployment_unit:
        $ref: "#/$defs/deployment_unit"
        description: "Optional deployment-unit boundary (EVD-A7, RD8 continuous-readiness — carried, no generator consumes it in v2.7.7)."

  resource_owner:
    type: object
    description: "Ownership metadata: vendor, team, and contact information."
    additionalProperties: true
    properties:
      vendor:
        type: string
        description: "Technology vendor or cloud provider name."
      team:
        type: string
        description: "Owning team name."
      email:
        type: string
        format: email
        description: "Team contact email."

  environment_config:
    type: object
    description: "Per-environment resource configuration: connection info, parameters, secrets, and tags."
    additionalProperties: true
    properties:
      resource_name:
        type: string
        description: "Platform-specific resource name in this environment."
      resource_uri:
        type: string
        description: "URI or connection string for the resource in this environment."
      host:
        type: string
        description: "Hostname or endpoint address."
      params:
        type: object
        description: "Environment-specific parameters."
        additionalProperties:
          type: [string, number, boolean]
      secrets:
        type: array
        description: "Secrets required in this environment."
        items:
          $ref: "#/$defs/secret_ref"
      tags:
        type: array
        description: "Resource tags for cost attribution and categorization."
        items:
          $ref: "#/$defs/tag"

  secret_ref:
    description: "A secret reference: a plain name string (resolved from default vault) or an object with explicit vault details."
    oneOf:
      - type: string
      - type: object
        additionalProperties: false
        required:
          - name
        properties:
          name:
            type: string
            description: "Secret name."
          description:
            type: string
            description: "What this secret is used for."
          secret_name:
            type: string
            description: "Name in the vault if different from the logical name."
          vault:
            type: string
            description: "Vault identifier when using a non-default vault."

  tag:
    type: object
    description: "A name-value tag for resource categorization and cost attribution."
    additionalProperties: false
    properties:
      name:
        type: string
        description: "Tag name."
      value:
        type: string
        description: "Tag value."

  deployment_topology:
    type: object
    description: "Deployment topology describing how services are placed across tiers and regions. Enables visualization of runtime architecture and validates placement decisions."
    additionalProperties: false
    properties:
      tiers:
        type: array
        description: "Deployment tiers grouping services by infrastructure function (e.g. web-tier, worker-tier, data-tier)."
        items:
          $ref: "#/$defs/deployment_tier"
      constraints:
        type: array
        items:
          type: string
        description: "Placement constraints expressed as free text (e.g. 'order-api and product-api must be co-located')."

  deployment_tier:
    type: object
    description: "A deployment tier grouping related services for a specific infrastructure function."
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        description: "Tier name (e.g. web-tier, worker-tier, data-tier)."
      description:
        type: string
        description: "Purpose of this deployment tier."
      services:
        type: array
        items:
          type: string
        description: "Resource IDs or service names deployed in this tier (legacy free-string form)."
      resource_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/infra_resource_ref"
        description: "Typed resource references (IR###) deployed in this tier (v2.7.7). Additive alongside the legacy free-string `services`; prefer this for graph participation. A tier is a grouping VIEW (extraction emits `contains`), distinct from the canonical placement edge `hosted_on` — the resolver de-dupes so a resource in both is not double-counted."
      region:
        type: string
        description: "Deployment region (e.g. eu-west-1, us-east-2)."
      replicas:
        type: integer
        description: "Number of replicas for services in this tier."

  # ---------------------------------------------------------------------------
  # v2.7.7 — knowledge-graph participation (typed, substrate-neutral, additive)
  # ---------------------------------------------------------------------------

  environment:
    type: object
    description: "A deployment environment as a first-class, referenceable entity (v2.7.7, ENV###). Environments are a binding dimension (production/staging/dr/…) — each carries its own target scope, credentials, and parameter overlay. Substrate-neutral: cloud, on-premise, and hybrid are equally expressible (RD31)."
    additionalProperties: false
    required:
      - id
      - name
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/environment_ref"
        description: "Typed environment id (ENV###). Referenced by bindings (BND###) and per-environment config."
      name:
        type: string
        description: "Human-readable environment name (e.g. production, staging, dr-site)."
      env_class:
        type: string
        enum: [production, staging, development, test, dr, sandbox, other]
        description: "Environment class. Orthogonal to substrate — a `dr` environment may be cloud OR on-prem."
      substrate:
        type: string
        enum: [cloud, on-prem, hybrid, edge]
        description: "Where this environment physically runs (RD31). `hybrid` federates cloud + on-prem bindings; `edge` = distributed/edge compute. Makes the cloud-vs-on-prem split legible for impact/cost analysis."
      provider:
        type: string
        description: "Optional platform provider — free-text so on-prem/private-cloud fit: azure, aws, gcp, vmware, openstack, bare-metal, k8s, … A hybrid environment may carry a compound value (e.g. 'azure+vmware')."
      target_scope:
        $ref: "#/$defs/target_scope"
        description: "The deployment partition/boundary this environment maps into (substrate-neutral)."
      credential_scope:
        type: string
        description: "Optional logical credential/identity scope (e.g. a subscription, a service account, an AD domain). A reference/label, never a secret value (RD16)."
      param_overlay:
        type: object
        description: "Optional per-environment parameter overlay applied to bindings (RD8 continuous-readiness; carried, unused this round)."
        additionalProperties:
          type: [string, number, boolean]
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  target_scope:
    description: "The deployment partition an environment targets. Two additive forms (v2.7.7): the legacy INLINE `{kind, name}` object OR a REFERENCE `{ ref: DSC### }` to a first-class DeploymentScope. Substrate-neutral (RD31): cloud (account/subscription/project/resource_group/region/availability_zone), kubernetes (cluster/namespace), and on-premise (datacenter/site/rack/host_pool/vlan) all coexist."
    oneOf:
      - $ref: "#/$defs/target_scope_inline"
      - $ref: "#/$defs/target_scope_ref"

  target_scope_inline:
    type: object
    description: "Inline substrate-neutral scope partition ({kind, name}). The v2.7.7 form promotes this to a reference (target_scope_ref -> DSC###) when the scope is modelled as a first-class DeploymentScope."
    additionalProperties: false
    required:
      - kind
    properties:
      kind:
        $ref: "#/$defs/scope_kind"
        description: "Partition type across substrates. Cloud, k8s, and on-prem scopes are all first-class."
      name:
        type: string
        description: "Optional concrete scope name/identifier (e.g. a subscription id, an AWS account, a datacenter code 'dc-1'). A reference/label, not a secret."

  target_scope_ref:
    type: object
    description: "Reference form (v2.7.7): point an environment's target scope at a first-class DeploymentScope (DSC###) instead of inlining {kind, name}. Additive — the inline form stays valid."
    additionalProperties: false
    required:
      - ref
    properties:
      ref:
        $ref: "../metamodel.schema.yaml#/$defs/deployment_scope_ref"
        description: "The DeploymentScope (DSC###) this environment targets."

  scope_kind:
    type: string
    enum:
      - account
      - subscription
      - project
      - resource_group
      - region
      - availability_zone
      - cluster
      - namespace
      - datacenter
      - site
      - rack
      - host_pool
      - vlan
      - other
    description: "Deployment partition type across substrates (substrate-neutral, RD31): cloud (account/subscription/project/resource_group/region/availability_zone), kubernetes (cluster/namespace), on-premise (datacenter/site/rack/host_pool/vlan). The single source shared by `target_scope` (inline) and `deployment_scope.kind`."

  deployment_scope:
    type: object
    description: >
      A deployment scope (DSC###, v2.7.7) — a substrate-neutral management / lifecycle /
      ownership / billing partition. Generalizes an Azure Resource Group or Subscription,
      an AWS Account / OU, a GCP Project / Folder, a Kubernetes Cluster / Namespace, or an
      on-prem Datacenter / host-pool. Scopes nest via `parent` (subscription -> resource-
      group). A resource joins a scope via `resource.scope_ref`. Distinct from TOSCA
      `hosted_on` (runtime placement): a DB may be `scope_ref` its own resource-group yet
      `hosted_on` a shared pool (the RG-vs-pool distinction).
    additionalProperties: false
    required:
      - id
      - name
      - kind
    properties:
      id:
        type: string
        description: "Unique scope identifier. SHOULD match DSC### (metamodel `deployment_scope_ref`); a free-string id (kebab-case) stays schema-valid but the validator WARNs (optional in v2.7.x, REQUIRED from v2.8 — RD25). Mirrors `resource.id`: the entity id is a free string, while the REFERENCE fields (`parent`, `resource.scope_ref`, `environment.target_scope.ref`) are typed `DSC###` refs."
      name:
        type: string
        description: "Human-readable scope name (e.g. the 'prod' subscription, the 'Accounting' resource-group)."
      kind:
        $ref: "#/$defs/scope_kind"
        description: "Partition type (subscription / resource_group / account / project / cluster / namespace / datacenter / host_pool / ...)."
      parent:
        $ref: "../metamodel.schema.yaml#/$defs/deployment_scope_ref"
        description: "Optional parent scope (DSC###) — builds the hierarchy (a resource_group's parent subscription; a namespace's parent cluster). A top-tier scope (subscription/account/project/cluster/datacenter) omits it."
      substrate:
        type: string
        enum:
          - cloud
          - on-prem
          - hybrid
          - edge
        description: "Optional substrate this scope lives on (RD31). When present it is the MOST authoritative substrate signal for member resources — stronger than transitive `hosted_on` walking or the `platform.name` heuristic."
      provider:
        type: string
        description: "Optional platform provider (free-text so on-prem fits): azure, aws, gcp, vmware, openstack, k8s, ..."
      owner:
        $ref: "#/$defs/resource_owner"
        description: "Optional ownership (vendor / team / contact) for this scope."
      region:
        type: string
        description: "Optional default region/location for resources in this scope (e.g. westeurope, eu-west-1)."
      summary:
        type: string
        description: "One-line summary for listings."
      description:
        type: string
        description: "Detailed description of this scope's purpose and what it contains."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
        description: "Open metadata bag for scope-level custom attributes."

  infra_relation_edge:
    type: object
    description: "A typed inter-resource relation (TOSCA vocabulary, RD11/EVD-D2). `hosted_on` is the canonical placement edge; `connects_to`/`depends_on` may carry attribute-level output refs (EVD-A6); `depends_on` is the ordering-only fallback. A `network-link` resource's connects_to/routes_to targets may sit in a different environment/substrate (the hybrid boundary, RD31)."
    additionalProperties: false
    required:
      - type
      - target
    properties:
      type:
        $ref: "../metamodel.schema.yaml#/$defs/infra_relation"
        description: "TOSCA relation verb: hosted_on / connects_to / depends_on / attaches_to / routes_to."
      target:
        $ref: "../metamodel.schema.yaml#/$defs/infra_resource_ref"
        description: "The target resource (IR###). May be in another environment/substrate (hybrid interconnect)."
      outputs:
        type: array
        description: "Optional attribute-level outputs of the target this resource consumes (EVD-A6) — e.g. host, port, connection-string. Makes connects_to/depends_on wiring explicit for `bp impact`."
        items:
          type: string
      description:
        type: string
        description: "Optional human note on this edge (e.g. 'reads via read-replica')."

  iac_refs:
    type: array
    description: "Traceability links from a resource to its Infrastructure-as-Code (RD12, EVD-D4) — the infra analogue of code_refs. Spans cloud provisioners AND on-prem config-management so on-prem IaC is first-class (RD31)."
    items:
      $ref: "#/$defs/iac_ref"

  iac_ref:
    type: object
    description: "A single Infrastructure-as-Code reference: which system defines the resource, and where."
    additionalProperties: false
    required:
      - system
      - locator
    properties:
      system:
        type: string
        enum:
          - terraform
          - opentofu
          - bicep
          - arm
          - cloudformation
          - pulumi
          - crossplane
          - kubernetes
          - helm
          - ansible
          - puppet
          - chef
          - saltstack
          - other
        description: "The IaC system. Cloud provisioners (terraform/opentofu/bicep/arm/cloudformation/pulumi/crossplane) and on-prem config-management (ansible/puppet/chef/saltstack) plus kubernetes/helm are all first-class (RD31)."
      locator:
        type: string
        description: "Where the resource is defined in that system (e.g. module path, `file:resource` address, Ansible role, Helm chart)."
      role:
        type: string
        description: "Optional role of this reference (e.g. 'defines', 'configures', 'deploys')."

  lifecycle:
    type: object
    description: "Optional lifecycle/protection posture for a resource (architect-altitude, RD14, EVD-A8). Substrate-neutral: 'protected' means change-guarded whether cloud or on-prem."
    additionalProperties: false
    properties:
      protected:
        type: boolean
        description: "Resource is change-protected (deletion/replacement guarded)."
      create_before_destroy:
        type: boolean
        description: "Replacements create the new instance before destroying the old."
      retain_on_delete:
        type: boolean
        description: "Retain the underlying resource when the model entity is removed."

  # ---------------------------------------------------------------------------
  # v2.7.7 CR-2 — intent + binding split, and neutral cross-cutting blocks
  # ---------------------------------------------------------------------------

  binding:
    type: object
    description: >
      Resolves (resource-type × environment) → a concrete implementation: which platform module
      realizes the type in that environment, with a pinned version and params. The same neutral
      type binds differently per environment — an azure module in a `cloud` ENV, an on-prem module
      in an `on-prem` ENV (hybrid = two bindings, RD31). Resolution is MOST-SPECIFIC-MATCH: a
      binding with `need_ref` beats one matching by `type_ref` alone; a binding scoped to an
      `environment_ref` beats an environment-agnostic default.
    additionalProperties: false
    required:
      - id
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/binding_ref"
        description: "Typed binding id (BND###)."
      type_ref:
        $ref: "../metamodel.schema.yaml#/$defs/resource_type_ref"
        description: "The resource TYPE (RT###) this binding realizes. Pair with `environment_ref` for a (type × env) rule."
      need_ref:
        type: string
        description: >
          Optional reference to a service `need` id (the free-string need `id`) this binding
          satisfies — more specific than binding-by-type. Most-specific-match: a `need_ref` binding
          wins over a `type_ref`-only binding for the same environment.
      environment_ref:
        $ref: "../metamodel.schema.yaml#/$defs/environment_ref"
        description: "The environment (ENV###) this binding applies to. Omit for an environment-agnostic default (least specific)."
      resource_ref:
        $ref: "../metamodel.schema.yaml#/$defs/infra_resource_ref"
        description: "Optional concrete resource (IR###) this binding produces/targets — closes need → binding → resource."
      module:
        $ref: "#/$defs/binding_module"
        description: "The concrete platform module/recipe that realizes the type in this environment."
      profile:
        type: string
        description: "Optional resource-type profile this binding draws from (neutral/azure/aws/k8s/on-prem/openstack — the step-04 catalog)."
      params:
        type: object
        description: "Binding-time parameters passed to the module (conceptually merged over need `params` + environment `param_overlay`)."
        additionalProperties:
          type: [string, number, boolean]
      outputs:
        type: array
        description: "Outputs this binding exposes (host/port/connection-string/…). A field may be secret-flagged — a reference/flow marker only, never a value (RD16)."
        items:
          $ref: "#/$defs/io_field"
      description:
        type: string
        description: "Optional human note on this binding."

  binding_module:
    type: object
    description: >
      A concrete platform module/recipe reference with a pinned version (RD8 continuous-readiness —
      `version_pin` is carried; no generator consumes it in v2.7.7). Substrate-neutral: AVM is ONE
      realization vocabulary, not THE vocabulary — a Terraform registry module, a Helm chart, or an
      Ansible role are equally valid (RD31).
    additionalProperties: false
    required:
      - ref
    properties:
      ref:
        type: string
        description: "Module/recipe locator — e.g. 'br/public:avm/res/db-for-postgre-sql/flexible-server', a Terraform registry path, a Helm chart, an Ansible role."
      version_pin:
        type: string
        description: "Optional pinned module version (e.g. '1.2.3', '~> 4.0'). The continuous-readiness field (carried, unused this round)."
      system:
        type: string
        description: "Optional provisioner hint (free-text: bicep, terraform, helm, ansible, …). Free-text so on-prem systems fit; the authoritative IaC link is `resource.iac_refs`."

  io_field:
    type: object
    description: >
      A typed input or output field of a resource-type contract or a binding (EVD-C4). An output
      may be secret-flagged — a reference/flow marker only, never a secret VALUE (RD16). Mirrors
      the `io_field` shape in the resource-type profile schema (`profiles/infrastructure/`).
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        description: "Field name (e.g. host, port, name, username, password, connection_string, endpoint)."
      type:
        type: string
        description: "Optional value-type hint (e.g. string, int, hostname, uri)."
      secret:
        type: boolean
        description: "When true this field is a secret — the model carries the reference/flow, never the value (RD16)."
      description:
        type: string
        description: "Optional description of the field."

  resource_identity:
    type: object
    description: >
      The workload identity a resource runs as / authenticates with — named for the CONCERN, not
      the Azure product (RD31): a cloud managed identity (system/user-assigned), a Kubernetes or
      on-prem service account, or an AD service account. Semantic level only (EVD-B6) — mechanics
      live in the module.
    additionalProperties: false
    properties:
      kind:
        type: string
        enum: [system-assigned, user-assigned, service-account, ad-service-account, none]
        description: "Identity kind, substrate-neutral: cloud system/user-assigned managed identity, a k8s service-account, an on-prem AD service account, or none."
      name:
        type: string
        description: "Optional identity name/reference (a label, never a secret)."

  access_grant:
    type: object
    description: >
      An RBAC access triple (EVD-B6): which identity may do what to which target. Substrate-neutral
      — a cloud IAM role assignment OR an on-prem AD/LDAP group grant. Semantic level only.
    additionalProperties: false
    required:
      - role
    properties:
      identity:
        type: string
        description: "The grantee identity (a `resource_identity` name, a group, or a principal label)."
      target:
        type: string
        description: "What the access is over (a resource, a scope, a data store — free-text/label; may be an IR###)."
      role:
        type: string
        description: "The role/permission granted (e.g. reader, contributor, db_datawriter, read-only)."

  observability_binding:
    type: object
    description: >
      Where this resource sends its telemetry — named for the concern (was AVM 'diagnostics'):
      logs and metrics sinks. Substrate-neutral: cloud diagnostic settings OR on-prem
      syslog/SNMP/Prometheus (RD31). Distinct from the quality-layer `observability` STRATEGY
      (product-wide); this is per-resource wiring.
    additionalProperties: false
    properties:
      logs_to:
        type: array
        items:
          type: string
        description: "Log sink targets (e.g. a log-analytics workspace label, 'syslog://…', a Loki endpoint)."
      metrics_to:
        type: array
        items:
          type: string
        description: "Metrics sink targets (e.g. a monitor workspace, a Prometheus endpoint, an SNMP collector)."

  redundancy:
    type: object
    description: >
      Availability-domain spread — named for the concern (was AVM 'zones'): the fault domains this
      resource is replicated across. Substrate-neutral: cloud availability zones/regions OR on-prem
      sites/racks (RD31).
    additionalProperties: false
    properties:
      domains:
        type: array
        items:
          type: string
        description: "The availability/fault domains (e.g. ['zone-1','zone-2'] cloud, or ['dc-1','dc-2'] / ['rack-a','rack-b'] on-prem)."
      strategy:
        type: string
        description: "Optional spread strategy note (e.g. 'zone-redundant', 'active-active across sites')."

  encryption_key:
    type: object
    description: >
      Encryption-key posture — named for the concern (was AVM 'customer_managed_key'): a cloud
      KMS/Key-Vault key OR an on-prem HSM/Vault (RD31). Carries a key REFERENCE, never key
      material (RD16).
    additionalProperties: false
    properties:
      managed_by:
        type: string
        enum: [platform, customer, self-hosted]
        description: "Who manages the key: platform-managed, customer-managed (cloud KMS/Key-Vault), or self-hosted (on-prem HSM/Vault)."
      key_ref:
        type: string
        description: "Optional key reference/label (a vault path or key id — a reference, never the key material)."

  deployment_unit:
    type: object
    description: >
      Optional deployment-unit boundary (EVD-A7, RD8 continuous-readiness — carried, no generator
      consumes it in v2.7.7): groups resources that deploy together and names the outputs the unit
      exports to other units.
    additionalProperties: false
    properties:
      unit_id:
        type: string
        description: "Logical deployment-unit id this resource belongs to (resources sharing a unit_id deploy together)."
      exported_outputs:
        type: array
        items:
          type: string
        description: "Output names this unit exposes to other units (the cross-unit wiring boundary)."
