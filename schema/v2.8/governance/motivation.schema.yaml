---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Blueprint Motivation
description: "Governance Plane: Strategic intent - goals, non-goals, risks, assumptions, and trade-offs. Decisions reference motivation entities (not reverse). Goals link forward to KPIs in quality.schema.yaml."
type: object
additionalProperties: false
required:
  - version
properties:
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
    description: "Content version of this motivation document."
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
    description: "Schema version this document conforms to. Omit to assume latest."
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
    description: "Bounded context this motivation file belongs to."
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  owned_by:
    $ref: "../metamodel.schema.yaml#/$defs/owned_by"
    description: "File-level ownership default. Entities inherit unless overridden."
  vision:
    $ref: "#/$defs/vision"
    description: "The product's singular identity claim / north-star - what it fundamentally IS and aspires to become. Distinct from goals (measurable objectives that operationalize it) and from the root `description` (a summary blurb). At most one per model."
  goals:
    type: array
    description: "What the system aims to achieve. Goals drive decisions and prioritize work. Each goal can be tracked by a KPI in quality.schema.yaml."
    items:
      $ref: "#/$defs/goal"
  non_goals:
    type: array
    description: "Explicit exclusions - what the system intentionally does NOT do. Prevents scope creep and aligns stakeholder expectations."
    items:
      $ref: "#/$defs/non_goal"
  risks:
    type: array
    description: "Identified threats to the system's goals. Each risk has likelihood, impact, and mitigation. Risks drive defensive decisions."
    items:
      $ref: "#/$defs/risk"
  assumptions:
    type: array
    description: "Things believed true but not yet verified. Wrong assumptions invalidate decisions. Each documents the consequence if false."
    items:
      $ref: "#/$defs/assumption"
  trade_offs:
    type: array
    description: "Conscious compromises between competing concerns. Makes implicit architectural tension explicit with rationale."
    items:
      $ref: "#/$defs/trade_off"
  inquiries:
    type: array
    description: "Governance inquiries - unresolved strategic or stakeholder concerns that need investigation or decision before work can proceed."
    items:
      $ref: "#/$defs/inquiry"
  concerns:
    type: array
    description: "What each persona expects of the system, durably enough that a view of the model can be judged against it."
    items:
      $ref: "#/$defs/concern"

$defs:

  vision:
    type: object
    description: "The singular identity claim / north-star: what the product fundamentally IS and aspires to become. Distinct from goals (measurable objectives) and from the root description (a summary blurb) - the vision is the 'why we exist' carrier that goals operationalize and value streams deliver."
    additionalProperties: false
    required:
      - statement
    properties:
      statement:
        type: string
        pattern: "\\S"
        description: "The vision as one or two sentences naming what the product is and aspires to be."
      aspiration:
        type: string
        description: "Optional longer-horizon elaboration or north-star framing beyond the core statement."
      advances_goals:
        type: array
        description: "Goals that operationalize this vision (forward links into `goals`)."
        items:
          $ref: "../metamodel.schema.yaml#/$defs/goal_ref"
      capability_refs:
        type: array
        description: "Core capabilities that embody the vision."
        items:
          $ref: "../metamodel.schema.yaml#/$defs/capability_ref"
      value_stream_refs:
        type: array
        description: "Value streams that carry the vision end-to-end."
        items:
          $ref: "../metamodel.schema.yaml#/$defs/value_stream_ref"
      discovery_stage:
        $ref: "../metamodel.schema.yaml#/$defs/discovery_stage"
        description: "Epistemic maturity of the vision."
      certainty:
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence level of the vision assertion."
      evidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Evidence justifying the vision's discovery_stage and certainty."
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Vision-level ownership override."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  goal:
    type: object
    description: "A strategic objective the system aims to achieve. Measurable goals link to KPIs; all goals drive decisions."
    additionalProperties: false
    required:
      - id
      - statement
      - priority
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/goal_ref"
        description: "Unique goal identifier (G + NNN)."
      description:
        type: string
        description: "Human-readable description."
      statement:
        type: string
        pattern: "\\S"
        description: "The goal as a clear, actionable statement (e.g. 'Reduce order processing time to under 2 seconds')."
      summary:
        type: string
        description: "One-line summary for listings."
      priority:
        $ref: "../metamodel.schema.yaml#/$defs/priority_scale"
        description: "Goal priority: critical=must have at launch, high=must have, medium=should have, low=nice to have."
      measure:
        type: string
        description: "How achievement is measured (e.g. 'p95 latency < 200ms'). Link to kpi for formal tracking."
      kpi:
        $ref: "../metamodel.schema.yaml#/$defs/kpi_ref"
        description: "KPI in quality.schema.yaml that formally tracks this goal. Closes the goal→KPI→metric traceability chain."
      goal_relations:
        title: Goal relations
        type: array
        minItems: 1
        uniqueItems: true
        description: "Claims about achievement of this goal and another goal. Absence makes no independence claim."
        items:
          $ref: "#/$defs/goal_relation"
      assumption_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/assumption_ref"
        description: "Assumptions this goal rests on: if one of them proves wrong, the goal is at risk. The goal names its assumptions and an assumption names none of the goals that rest on it, so an assumption several goals rest on is listed on each of them."
      examples:
        type: array
        description: "Concrete examples illustrating this goal."
        items:
          type: object
          additionalProperties: false
          properties:
            description:
              type: string
              description: "Example description."
      affects:
        type: object
        description: "Blueprint entities this goal touches: where it sticks on the domain model, so a story board or a wall can pin the opportunity beside the operation, concept, bounded context, service, package or story it is about."
        additionalProperties: false
        properties:
          operation_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
            description: "Operations affected."
          concept_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/concept_ref"
            description: "Concepts affected."
          context_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
            description: "Bounded contexts / slices affected, by scope name. A name, not a reference: it builds no edge. Name a bounded context by its arch id in `bounded_context_refs`."
          bounded_context_refs:
            type: array
            title: Bounded contexts
            items:
              $ref: "../metamodel.schema.yaml#/$defs/bounded_context_ref"
            description: "Bounded contexts (BC###) affected as a whole, by arch id. A typed reference: an id no arch file declares is a cross-reference error. A scope name belongs in `context_refs`."
            examples:
              - [BC001, shop.BC002]
          service_refs:
            type: array
            title: Services
            items:
              $ref: "../metamodel.schema.yaml#/$defs/service_ref"
            description: "Architecture services (SVC###) affected as a whole, by arch id. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [SVC001]
          package_refs:
            type: array
            title: Packages
            items:
              $ref: "../metamodel.schema.yaml#/$defs/package_ref"
            description: "Third-party packages (PKG###) affected as a whole, by the id their `packages:` declaration carries. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [PKG001]
          process_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/process_ref"
            description: "Business processes affected, for a goal about a flow as a whole rather than one of its operations."
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
        description: "Goal version for lifecycle tracking."
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Goal-level ownership override."
      discovery_stage:
        $ref: "../metamodel.schema.yaml#/$defs/discovery_stage"
        description: "Epistemic maturity of this goal."
      certainty:
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence level of this goal assertion."
      evidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Evidence justifying this goal's discovery_stage and certainty."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  goal_relation:
    title: Goal relation
    type: object
    additionalProperties: false
    required: [target_goal, kind, rationale]
    description: "A source-owned claim, authored at goals[i].goal_relations[j]. Contribution is partial; requires states necessity without sufficiency or temporal order; conflict is symmetric. No transitive claims follow."
    examples:
      - target_goal: GL001
        kind: contributes_to
        contribution: help
        rationale: Lower checkout waiting removes one cause of abandonment.
        certainty: speculative
    properties:
      target_goal:
        title: Target goal
        $ref: "../metamodel.schema.yaml#/$defs/goal_ref"
        description: "Exactly one declared Goal with this exact id, including any scope prefix. Self-targets are errors."
      kind:
        title: Relation kind
        type: string
        enum: [contributes_to, requires, conflicts_with]
        description: "Source contributes to target, needs target achieved, or conflicts with target. Requires cycles warn; contribution loops are legal and silent."
      contribution:
        title: Contribution effect
        type: string
        enum: [help, hurt]
        description: "Partial positive or negative effect on the target. Required only for contributes_to. Effect is independent of certainty."
      rationale:
        title: Rationale
        type: string
        minLength: 1
        pattern: '\S'
        description: "Why the claim holds and the conditions that bound it."
      certainty:
        title: Assertion certainty
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence in this assertion, independent of goal certainty. Omission is unstated, never confirmed."
      evidence:
        title: Assertion evidence
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Sources supporting this assertion under the common evidence policy. Goal evidence does not confirm its edges."
    allOf:
      - if:
          required: [kind]
          properties:
            kind: {const: contributes_to}
        then:
          required: [contribution]
        else:
          not:
            required: [contribution]

  non_goal:
    type: object
    description: "An explicit exclusion - something the system intentionally does NOT do. Intentional boundary, not an oversight."
    additionalProperties: false
    required:
      - id
      - statement
      - reason
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/non_goal_ref"
        description: "Unique non-goal identifier (NG + NNN)."
      description:
        type: string
        description: "Human-readable description."
      statement:
        type: string
        pattern: "\\S"
        description: "What the system explicitly does NOT do (e.g. 'This system does not handle payment processing')."
      reason:
        type: string
        pattern: "\\S"
        description: "Why this is excluded. Helps future stakeholders understand the boundary was intentional."
      discovery_stage:
        $ref: "../metamodel.schema.yaml#/$defs/discovery_stage"
        description: "Epistemic maturity of this non-goal."
      certainty:
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence level of this non-goal assertion."
      evidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Evidence justifying this non-goal's boundary."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  risk:
    type: object
    description: "An identified threat to the system's goals with probability, severity, and mitigation strategy."
    additionalProperties: false
    required:
      - id
      - statement
      - likelihood
      - impact
      - mitigation
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/risk_ref"
        description: "Unique risk identifier (R + NNN)."
      description:
        type: string
        description: "Human-readable description."
      statement:
        type: string
        pattern: "\\S"
        description: "What could go wrong."
      summary:
        type: string
        description: "One-line summary for listings."
      likelihood:
        $ref: "../metamodel.schema.yaml#/$defs/likelihood_scale"
        description: "Probability of this risk materializing."
      impact:
        $ref: "../metamodel.schema.yaml#/$defs/severity_scale"
        description: "Severity if materialized: critical=system failure, high=major degradation, medium=noticeable impact, low=minor inconvenience."
      mitigation:
        type: string
        pattern: "\\S"
        description: "Strategy to prevent or reduce this risk. Should be actionable and specific."
      contingency:
        type: string
        description: "Fallback plan if the primary mitigation strategy fails."
      owner:
        $ref: "../metamodel.schema.yaml#/$defs/owner_ref"
        description: >
          A person or role (ACT###) or a team (TM###) who drives the risk response. Distinct from
          owned_by (org unit accountability).
        examples: [ACT001, TM002]
      status:
        type: string
        enum: [identified, open, mitigated, accepted, closed]
        description: >
          Risk lifecycle: identified=logged, open=being mitigated,
          mitigated=applied, accepted=tolerated, closed=resolved.
      review_date:
        type: string
        format: date
        description: "When this risk should be reassessed (ISO 8601)."
      goal_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/goal_ref"
        description: "Goals threatened by this risk."
      affects:
        type: object
        description: "Blueprint entities this risk touches: where it sticks on the domain model, so a story board or a wall can pin it beside the operation, concept, bounded context, service, package, capability or story it is about."
        additionalProperties: false
        properties:
          operation_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
            description: "Operations affected."
          concept_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/concept_ref"
            description: "Concepts affected."
          context_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
            description: "Bounded contexts / slices affected, by scope name. A name, not a reference: it builds no edge. Name a bounded context by its arch id in `bounded_context_refs`."
          bounded_context_refs:
            type: array
            title: Bounded contexts
            items:
              $ref: "../metamodel.schema.yaml#/$defs/bounded_context_ref"
            description: "Bounded contexts (BC###) affected as a whole, by arch id. A typed reference: an id no arch file declares is a cross-reference error. A scope name belongs in `context_refs`."
            examples:
              - [BC001, shop.BC002]
          service_refs:
            type: array
            title: Services
            items:
              $ref: "../metamodel.schema.yaml#/$defs/service_ref"
            description: "Architecture services (SVC###) affected as a whole, by arch id. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [SVC001]
          package_refs:
            type: array
            title: Packages
            items:
              $ref: "../metamodel.schema.yaml#/$defs/package_ref"
            description: "Third-party packages (PKG###) affected as a whole, by the id their `packages:` declaration carries. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [PKG001]
          process_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/process_ref"
            description: "Business processes affected, for a concern about a flow as a whole rather than one of its operations."
          capability_refs:
            type: array
            title: Capabilities
            items:
              $ref: "../metamodel.schema.yaml#/$defs/capability_ref"
            description: "Capabilities and features (CAP###) this risk bears on, each named by its declared id. A typed reference: an id no capability file declares is a cross-reference error. The risk belongs to each capability named here and to no other: a named capability's children, its parent and the capabilities that share an operation with it are not implied, so name every capability or feature the risk is about."
            examples:
              - [CAP001, billing.CAP002]
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
        description: "Risk version for lifecycle tracking."
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Risk-level ownership override."
      discovery_stage:
        $ref: "../metamodel.schema.yaml#/$defs/discovery_stage"
        description: "Epistemic maturity of this risk."
      certainty:
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence level of this risk assessment."
      evidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Evidence justifying this risk assessment."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  assumption:
    type: object
    description: "Something believed to be true but not yet verified. Carries risk if wrong; consequence documents the exposure."
    additionalProperties: false
    required:
      - id
      - statement
      - consequence
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/assumption_ref"
        description: "Unique assumption identifier (A + NNN)."
      description:
        type: string
        description: "Human-readable description."
      statement:
        type: string
        pattern: "\\S"
        description: "What is assumed to be true."
      consequence:
        type: string
        pattern: "\\S"
        description: "What happens if this assumption is wrong - the risk carried by the assumption."
      domain_scope:
        $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
        description: >
          Optional problem-space scope this assumption applies to, as a kebab-case scope slug
          (e.g. billing, order-mgmt). Matched by name, not resolved as a typed reference: the
          assumption surfaces in the Bounded Context Canvas node footer (Assumptions section) of a
          context carrying that scope. To point at a bounded context by id, use
          `bounded_context_ref` (BC###) on a construct that declares one.
      risk_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/risk_ref"
        description: "Risks associated with this assumption being wrong."
      affects:
        type: object
        description: "Blueprint entities this assumption bears on: where it sticks on the domain model, so a story board or a wall can pin it beside the operation, concept, process, bounded context, service or package that depends on it holding."
        additionalProperties: false
        properties:
          operation_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
            description: "Operations that depend on this assumption holding."
          concept_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/concept_ref"
            description: "Concepts that depend on this assumption holding."
          context_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
            description: "Bounded contexts / slices this assumption bears on, by scope name. A name, not a reference: it builds no edge. Name a bounded context by its arch id in `bounded_context_refs`."
          bounded_context_refs:
            type: array
            title: Bounded contexts
            items:
              $ref: "../metamodel.schema.yaml#/$defs/bounded_context_ref"
            description: "Bounded contexts (BC###) this assumption bears on as a whole, by arch id. A typed reference: an id no arch file declares is a cross-reference error. A scope name belongs in `context_refs`."
            examples:
              - [BC001, shop.BC002]
          service_refs:
            type: array
            title: Services
            items:
              $ref: "../metamodel.schema.yaml#/$defs/service_ref"
            description: "Architecture services (SVC###) that depend on this assumption holding, by arch id. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [SVC001]
          package_refs:
            type: array
            title: Packages
            items:
              $ref: "../metamodel.schema.yaml#/$defs/package_ref"
            description: "Third-party packages (PKG###) that depend on this assumption holding, by the id their `packages:` declaration carries. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [PKG001]
          process_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/process_ref"
            description: "Business processes that depend on this assumption holding, for an assumption about a flow as a whole rather than one of its operations."
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Assumption-level ownership override: the unit accountable for confirming or retiring this assumption."
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
        description: "Assumption version for lifecycle tracking."
      discovery_stage:
        $ref: "../metamodel.schema.yaml#/$defs/discovery_stage"
        description: "Epistemic maturity of this assumption."
      certainty:
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence level of this assumption."
      evidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Evidence justifying this assumption's confidence."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  trade_off:
    type: object
    description: "A conscious compromise between competing concerns. Documents what was chosen, rejected, and why the choice is acceptable."
    additionalProperties: false
    required:
      - id
      - choice
      - selected
      - rejected
      - rationale
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/trade_off_ref"
        description: "Unique trade-off identifier (T + NNN)."
      description:
        type: string
        description: "Human-readable description."
      choice:
        type: string
        pattern: "\\S"
        description: "The tension or competing concern being resolved."
      selected:
        type: string
        pattern: "\\S"
        description: "What was chosen."
      rejected:
        type: string
        pattern: "\\S"
        description: "What was rejected."
      rationale:
        type: string
        pattern: "\\S"
        description: "Why the selected option is preferable given the context."
      accepted_risk:
        type: string
        description: "Risk accepted by making this trade-off (use risk_ref for traceability)."
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
        description: "Trade-off version for lifecycle tracking."
      discovery_stage:
        $ref: "../metamodel.schema.yaml#/$defs/discovery_stage"
        description: "Epistemic maturity of this trade-off."
      certainty:
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence level of this trade-off."
      evidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Evidence justifying this trade-off decision."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  inquiry:
    type: object
    description: >
      Governance inquiry - an unresolved strategic or stakeholder concern
      that needs investigation or decision before work can proceed.
      Distinct from QN### (domain competency questions that model the
      reason for a domain to exist). Inquiries are temporary governance
      artifacts; questions are permanent domain knowledge requirements.
    additionalProperties: false
    required:
      - id
      - statement
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/inquiry_ref"
        description: "Unique inquiry identifier (INQ + 3+ digits)."
      statement:
        type: string
        pattern: "\\S"
        description: "The unresolved concern or question."
      summary:
        type: string
        description: "One-line summary for listings."
      description:
        type: string
        description: "Additional context, background, or constraints."
      category:
        type: string
        enum: [business, technical, ux, legal, data, dependency, feasibility, strategic, organizational]
        description: >
          Inquiry domain classification. business=revenue/market impact,
          technical=architecture/infrastructure, ux=user experience,
          legal=regulatory/compliance, data=data quality/availability,
          dependency=external blocking factor, feasibility=can we do this,
          strategic=direction/vision, organizational=team/process.
      goal_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/goal_ref"
        description: "Goals affected by this inquiry."
      risk_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/risk_ref"
        description: "Risks related to this inquiry."
      question_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/question_ref"
        description: "Domain competency questions (QN###) that prompted this governance inquiry."
      finding_refs:
        type: array
        title: Findings
        items:
          $ref: "../metamodel.schema.yaml#/$defs/finding_ref"
        description: >
          Quality findings (FN###) this inquiry is about or was prompted by. The inquiry owns the
          link and a finding carries no reference back, so an inquiry that closes leaves nothing
          stale on the finding; the inquiries open on a finding are read in the reverse direction.
          An id no quality file declares is a cross-reference error.
        examples:
          - [FN001, orders.FN002]
      stakeholders:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
        description: "Actors who care about the resolution."
      affects:
        type: object
        description: "Blueprint entities this inquiry touches: where it sticks on the domain model, so a story board, a wall or a map can pin it beside the entity, or the part of one, it is about. `element_refs` takes any typed id; each list beside it takes one kind, with the same meaning."
        additionalProperties: false
        properties:
          element_refs:
            type: array
            title: Model elements
            uniqueItems: true
            items:
              $ref: "../metamodel.schema.yaml#/$defs/model_element_ref"
            description: >
              Model elements this inquiry is about, each by the typed id it is declared with: an
              infrastructure resource, an environment, a finding, a screen, a migration, a watch item
              or any other entity, or one part of an entity that carries its own id, such as a process
              activity or a concept attribute. A part names that part only, never its process or
              concept as a whole, and an entity names itself only: its children, parent and
              neighbours are not implied. Naming an id here means the same as naming it in the list
              for its kind, so name each id once. An id no file declares is a cross-reference error,
              and an inquiry cannot name itself.
            examples:
              - [IR003, ENV001, delivery.PA002, orders.CAT004]
          operation_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
            description: "Operations affected."
          concept_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/concept_ref"
            description: "Concepts affected."
          context_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
            description: "Bounded contexts / slices affected, by scope name. A name, not a reference: it builds no edge. Name a bounded context by its arch id in `bounded_context_refs`."
          bounded_context_refs:
            type: array
            title: Bounded contexts
            items:
              $ref: "../metamodel.schema.yaml#/$defs/bounded_context_ref"
            description: "Bounded contexts (BC###) affected as a whole, by arch id. A typed reference: an id no arch file declares is a cross-reference error. A scope name belongs in `context_refs`."
            examples:
              - [BC001, shop.BC002]
          service_refs:
            type: array
            title: Services
            items:
              $ref: "../metamodel.schema.yaml#/$defs/service_ref"
            description: "Architecture services (SVC###) affected as a whole, by arch id. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [SVC001]
          package_refs:
            type: array
            title: Packages
            items:
              $ref: "../metamodel.schema.yaml#/$defs/package_ref"
            description: "Third-party packages (PKG###) affected as a whole, by the id their `packages:` declaration carries. A typed reference: an id no arch file declares is a cross-reference error."
            examples:
              - [PKG001]
          process_refs:
            type: array
            items:
              $ref: "../metamodel.schema.yaml#/$defs/process_ref"
            description: "Business processes affected, for a concern about a flow as a whole rather than one of its operations."
          process_activity_refs:
            type: array
            title: Process activities
            items:
              $ref: "../metamodel.schema.yaml#/$defs/process_activity_ref"
            description: >
              Process activities (PA###) this inquiry is about, for an open question about one step
              of a flow: who does it, what it takes or produces, whether it happens at all. Each is
              the exact id its process declares, so it names one activity only where no other
              process declares the same id. An id no process declares is a cross-reference error.
            examples:
              - [PA004, delivery.PA002]
          capability_refs:
            type: array
            title: Capabilities
            items:
              $ref: "../metamodel.schema.yaml#/$defs/capability_ref"
            description: "Capabilities and features (CAP###) this inquiry bears on, each named by its declared id. A typed reference: an id no capability file declares is a cross-reference error. The inquiry belongs to each capability named here and to no other: a named capability's children, its parent and the capabilities that share an operation with it are not implied, so name every capability or feature the inquiry is about."
            examples:
              - [CAP001, billing.CAP002]
      owner:
        $ref: "../metamodel.schema.yaml#/$defs/owner_ref"
        description: >
          A person or role (ACT###) or a team (TM###) who drives this inquiry to its resolution.
          Distinct from owned_by (the unit accountable for it), and from `asked_of`, who is
          expected to answer it.
        examples: [ACT001, TM002]
      asked_of:
        $ref: "#/$defs/inquiry_addressee"
        title: Addressee
        description: >
          Who is expected to answer this inquiry now: an actor (ACT###, a person or a role), a
          team (TM###), or a name for an addressee the model does not declare. Distinct from
          `owner`, who drives the inquiry to its resolution, from `owned_by`, the unit accountable
          for it, and from `stakeholders`, who care about the answer; the addressee may work
          outside the area the inquiry is about. One addressee at a time. Absent: the model does
          not say who is asked, and nothing is inferred from `owner`.
        examples:
          - team: TM003
          - name: Domain expert
          - actor: payments.ACT004
            name: The payments developer
      previously_asked_of:
        type: array
        title: Earlier addressees
        description: >
          Whom this inquiry was asked of before `asked_of`, oldest first, each with how the inquiry
          left them. Passing an inquiry on changes who is asked and leaves `status` as it is. An
          entry is recorded only where a source states it, and the current addressee is never
          listed here. An unsettled inquiry that lists earlier addressees and states no `asked_of`
          is reported by a semantic warning: it was passed on, and the model does not say to whom.
        items:
          $ref: "#/$defs/inquiry_earlier_addressee"
        examples:
          - - asked_of: { actor: payments.ACT004 }
              outcome: partly-answered
              date: "2026-10-02"
      blocking:
        type: boolean
        default: false
        description: "True if this inquiry blocks downstream work."
      due_date:
        type: string
        format: date
        description: "Target date for resolution (ISO 8601)."
      resolution:
        type: string
        description: "Answer or decision once the inquiry is resolved."
      resolved:
        type: boolean
        default: false
        deprecated: true
        description: >
          DEPRECATED - derived from `status`, which is the single source of the lifecycle.
          `resolved` is true exactly when `status` is `resolved` or `closed`. Still accepted so
          existing documents keep loading; a consumer should read `status`.
      status:
        type: string
        enum: [open, investigating, resolved, closed, deferred]
        description: >
          Inquiry lifecycle: open=logged, investigating=actively being
          researched, resolved=answer found, closed=resolution accepted,
          deferred=postponed.
      discovery_stage:
        $ref: "../metamodel.schema.yaml#/$defs/discovery_stage"
        description: "Epistemic maturity of this inquiry."
      certainty:
        $ref: "../metamodel.schema.yaml#/$defs/certainty"
        description: "Confidence level of this inquiry."
      evidence:
        $ref: "../metamodel.schema.yaml#/$defs/evidence"
        description: "Evidence gathered during inquiry investigation."
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  inquiry_addressee:
    type: object
    title: Addressee
    description: >
      Who is or was expected to answer an inquiry: a reference to an actor (ACT###) or a team
      (TM###), a `name`, or a name beside one reference. A name alone is a complete statement for
      an addressee the model does not declare, for example a role such as "Domain expert"; it
      draws no graph edge, and two addressees stated by name are the same addressee only when the
      names are written identically. Beside a reference, the reference is the addressee and the
      name is the addressee as the source states it. At most one reference. A reference to an
      actor or team nobody declares is a cross-reference error.
    additionalProperties: false
    properties:
      actor:
        $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
        description: "The addressee as an actor: a person or a role (ACT###)."
        examples: [payments.ACT004]
      team:
        $ref: "../metamodel.schema.yaml#/$defs/team_ref"
        description: "The addressee as a team (TM###)."
        examples: [TM003]
      name:
        type: string
        description: >
          The addressee as written in the source, for example "Domain expert". Alone, it is the
          addressee; beside a reference, it is the addressee as stated. It contains at least one
          non-space character and is never a typed id: write an actor or a team as its reference
          key instead.
        pattern: "\\S"
        not:
          pattern: "^([a-z][a-z0-9-]*\\.)?[A-Z]{1,4}\\d{3,}$"
        examples: [Domain expert]
    anyOf:
      - required: [actor]
      - required: [team]
      - required: [name]
    not:
      required: [actor, team]
    examples:
      - team: TM003
      - name: Domain expert
      - actor: payments.ACT004
        name: The payments developer

  inquiry_earlier_addressee:
    type: object
    title: Earlier addressee
    description: >
      One earlier addressee of an inquiry and how the inquiry left them. `asked_of` and `outcome`
      are a complete statement; `date` and `note` are stated only where a source gives them.
    additionalProperties: false
    required: [asked_of, outcome]
    properties:
      asked_of:
        $ref: "#/$defs/inquiry_addressee"
        description: "The earlier addressee: an actor (ACT###), a team (TM###) or a name."
        examples:
          - actor: payments.ACT004
      outcome:
        type: string
        enum: [redirected, partly-answered, reassigned]
        description: >
          How the inquiry left this addressee. redirected: the addressee passed it on without an
          answer. partly-answered: the addressee answered part of it and passed the rest on.
          reassigned: whoever drives the inquiry moved it to another addressee.
        examples: [partly-answered]
      date:
        type: string
        format: date
        description: "When the inquiry left this addressee (ISO 8601), where a source states it."
        examples: ["2026-10-02"]
      note:
        type: string
        pattern: "\\S"
        description: "What the addressee said or answered when the inquiry left them, as the source states it."
        examples: ["The validation rules are known; the retention period is for the architecture team."]
    examples:
      - asked_of: { actor: payments.ACT004 }
        outcome: partly-answered
        date: "2026-10-02"
        note: "The validation rules are known; the retention period is for the architecture team."

  concern:
    type: object
    description: >
      A stakeholder's durable expectation of the system, held by a persona and about one part of
      the model that persona meets. A view of the model satisfies its concerns or it does not, which
      is the sense in which a concern tests a view the way a test case tests a story.
      Distinct from the two entities it is most easily confused with. An inquiry (INQ###) is a
      question the team has to answer before work proceeds, and it closes; a concern outlives every
      answer. A domain question (QN###) asks whether a bounded context models enough of its subject;
      a concern asks whether what is modelled reaches the person who needs it.
    additionalProperties: false
    required:
      - id
      - statement
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/concern_ref"
        description: "Unique concern identifier (CNC + 3+ digits, optional context prefix)."
      title:
        type: string
        description: "Short name for listings (e.g. 'Knows an order is on its way')."
      statement:
        type: string
        pattern: "\\S"
        description: >
          What the persona expects, in their terms. It may read as a question ('Can I tell when my
          order will arrive?') or as a claim ('I can tell when my order will arrive'); both say the
          same thing and the question form is often the plainer one.
      persona_ref:
        $ref: "../metamodel.schema.yaml#/$defs/persona_ref"
        description: "The persona who holds this concern."
      about_ref:
        $ref: "../metamodel.schema.yaml#/$defs/usage_ref"
        description: >
          The part of the model this concern is about: a user story, a use case, a business process,
          a screen or a concept.
      priority:
        type: string
        enum: [must, should]
        description: >
          How much a view that leaves this concern unsatisfied still counts. must=the view fails
          without it, should=the view is weaker without it.
      status:
        type: string
        enum: [answered, partial, unanswered]
        description: >
          How far the model goes toward satisfying this concern: answered=fully, partial=in part,
          unanswered=not yet. A statement about the model, not about the work.
      description:
        type: string
        description: "Additional context: where the expectation comes from, and what would falsify it."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
