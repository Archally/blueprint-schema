---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Blueprint Metamodel
description: >
  Cross-cutting definitions for all blueprint layers. Provides typed ID refs,
  versioning, SpecPath, and shared vocabulary. Consumed by all design and
  governance schema files. Supersedes schemas/blueprint/v1/definitions/metamodel.schema.json.

$defs:

  # ---------------------------------------------------------------------------
  # Versioning
  # ---------------------------------------------------------------------------

  semver:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: "Semantic version string (MAJOR.MINOR.PATCH). Used at schema, document, and entity levels."

  versioned_header:
    type: object
    description: "Common header for blueprint documents. Only 'version' required; 'schemaVersion' omitted means latest schema assumed."
    properties:
      version:
        $ref: "#/$defs/semver"
        description: "Content version of this document."
      schemaVersion:
        $ref: "#/$defs/semver"
        description: "Schema definition version this document conforms to. Omit to assume latest."
      scope:
        $ref: "#/$defs/scope_prefix"
        description: "Bounded context this file belongs to. Enables scoping in multi-context blueprints."
    required:
      - version

  entity_version:
    $ref: "#/$defs/semver"
    description: "Optional SemVer for individual entity lifecycle tracking."

  schema_version:
    type: string
    enum: ["2.8.0", "2.7.0", "2.6.0", "2.5.0", "2.4.0", "2.3.0", "2.2.0"]
    description: "Blueprint schema version. v2.8 schemas accept v2.7, v2.6, v2.5, v2.4, v2.3, and v2.2 documents for backward compatibility."

  # ---------------------------------------------------------------------------
  # Entity Properties (v2.3)
  # Open metadata bag for entity extensions. Every entity $def includes this.
  # ---------------------------------------------------------------------------

  entity_properties:
    type: object
    additionalProperties: true
    description: >
      Open metadata bag for entity extensions. Authors may add domain-specific
      key-value pairs. Known optional keys: term (DDD formal name),
      definition (formal glossary entry). Custom keys are preserved in the
      model and available to viewers and generators.

  tracker_ref:
    type: string
    description: >
      External issue-tracker or document reference. A bare key (e.g. 'ABC-1234') resolves through
      the blueprint's `trackers` registry using `default_tracker`; a '<tracker>:<key>' pair selects
      a named tracker; a full URL is used verbatim. Rendered as a link where the registry can form
      one, and as plain text otherwise.

  # ---------------------------------------------------------------------------
  # Bounded Context
  # ---------------------------------------------------------------------------

  scope_prefix:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: >
      Namespace qualifier on a typed id, in kebab-case (e.g. billing, order-mgmt). It names the
      scope of the document the id is declared in, so that bare ids do not collide across files.
      A name rather than a reference: nothing resolves it, and it names neither a domain nor a
      bounded context, whatever the two happen to be called in a given model.

  # ---------------------------------------------------------------------------
  # Tags (cross-cutting)
  # ---------------------------------------------------------------------------

  tags:
    type: array
    items:
      type: string
    description: >
      Free-form tags for grouping. A document-level `tags` describes the document; an entity-level
      `tags` describes the entity. Nothing propagates between them: an entity carries exactly the
      tags it declares.

  # ---------------------------------------------------------------------------
  # Id band ownership
  # ---------------------------------------------------------------------------

  id_band:
    type: object
    description: >
      A numeric range of one typed id prefix, reserved to the slice that declares it. This states
      that division, so the allocator can honour it and the validator can report an id that
      ignored it. A band is declared inside the slice that owns it, which is how a band cannot
      name a slice the model does not have. Optional per prefix: a prefix with no band declared is
      unconstrained, and a model declaring no bands is checked exactly as it was before.


      RESERVE A BAND FOR A PREFIX WHOSE IDS CARRY NO SCOPE. Those share one model-wide numbering
      space - two entities cannot both be `CAT0100` - so several slices allocating into the prefix
      have to divide the numbers between them, and the division is worth writing down. An id that
      carries a scope (`catalog.CN001`) is already partitioned by it: every slice can start at 001
      and none of them collide, so a band around one reserves nothing that was at risk. A model
      whose ids are all scoped declares no bands, and that is the finished state rather than an
      omission.


      A slice may reserve SEVERAL ranges of one prefix, by listing an entry per range. A slice
      that has outgrown its first range says so by adding a second rather than by widening the
      first over numbers another slice holds:


      ```

      bands:
        - prefix: CAT
          from: 1000
          to: 1020
        - prefix: CAT
          from: 3000
          to: 3100
      ```


      An id is in band when it falls inside ANY of them, a report names all of them, and two
      ranges of one slice are not an overlap. The allocator fills them in ascending order, so a
      second range is reached only once the first is full.
    additionalProperties: false
    required:
      - prefix
      - from
      - to
    properties:
      prefix:
        type: string
        pattern: "^[A-Z]{1,5}$"
        description: >
          The typed id prefix this band divides, without its digits - `CAT`, `SVC`, `CN`. Must be
          a band the schema line declares; `npm run id-band-check --list` prints every one.
      from:
        type: integer
        minimum: 0
        description: "First number in the band, inclusive."
      to:
        type: integer
        minimum: 0
        description: "Last number in the band, inclusive. Not below `from`."
      notes:
        type: string
        description: "Why this range, or what the slice reserves it for. Free text, read by nobody."

  # ---------------------------------------------------------------------------
  # Typed ID References
  # All patterns support optional context prefix using dot notation.
  # ---------------------------------------------------------------------------

  concept_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CN\\d{3}$"
    description: "Reference to a concept (e.g. CN001 or billing.CN001)."

  rule_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(SR|CR|DR|EQ|VR)\\d{3}$"
    description: "Reference to a rule by type prefix: SR=structural, CR=classification, DR=derivation, EQ=equivalence, VR=validation."

  command_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CMD\\d{3}$"
    description: "Command operation identifier. Commands express intent to change state."

  event_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?EVT\\d{3}$"
    description: "Event operation identifier. Events are facts that happened (past tense, broadcast)."

  query_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?QRY\\d{3}$"
    description: "Query operation identifier. Queries are read-only data requests."

  document_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?DOC\\d{3}$"
    description: "Document operation identifier. Documents represent full state transfers."

  operation_ref:
    description: >
      Any operation reference. Two formats supported:
      (1) ID-based: optional context prefix + kind + digits (e.g., CMD001, orders.CMD001).
      (2) Domain:key: domainRef + camelCase operation key (e.g., orders:submitOrder).
      Format 1 is machine-stable; format 2 is human-readable.
    anyOf:
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?(CMD|EVT|QRY|DOC)\\d{3,}$"
        description: "ID-based reference (e.g., orders.CMD001)."
      - type: string
        pattern: "^[a-z][a-z0-9-]*:[a-z][a-zA-Z0-9]*$"
        description: "Domain:key reference (e.g., orders:submitOrder)."

  decision_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(DC|D)\\d{3}$"
    description: >
      Reference to a decision (e.g. DC001 or billing.DC001). `D###` is the band's retired
      spelling: it still validates on this line and stops validating in the next major.

  business_decision_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?BD\\d{3,}$"
    description: >
      Reference to a Bounded Context Canvas business decision (e.g. BD001 or
      orders.BD001). Distinct from `decision_ref` (DC###, ADR rationale): a
      business_decision is a high-level policy statement scoped to a bounded
      context, not an architectural decision record.

  test_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(TC|EC|ER)\\d{3}$"
    description: "Reference to a test case by suite: TC=happy-path, EC=edge-case, ER=error-case."

  goal_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(GL|G)\\d{3}$"
    description: >
      Reference to a motivation goal (e.g. GL001 or billing.GL001). `G###` is the band's retired
      spelling: it still validates on this line and stops validating in the next major.

  risk_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(RSK|R)\\d{3}$"
    description: >
      Reference to a motivation risk (e.g. RSK001 or billing.RSK001). `R###` is the band's retired
      spelling: it still validates on this line and stops validating in the next major.

  assumption_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(ASM|A)\\d{3}$"
    description: >
      Reference to a motivation assumption (e.g. ASM001 or billing.ASM001). `A###` is the band's
      retired spelling: it still validates on this line and stops validating in the next major.

  trade_off_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(TRO|T)\\d{3}$"
    description: >
      Reference to a motivation trade-off (e.g. TRO001 or billing.TRO001). `T###` is the band's
      retired spelling: it still validates on this line and stops validating in the next major.

  inquiry_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?INQ\\d{3,}$"
    description: "Reference to a governance inquiry (e.g. INQ001 or orders.INQ001)."

  concern_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CNC\\d{3,}$"
    description: >
      Reference to a stakeholder concern (e.g. CNC001 or orders.CNC001). A concern is a durable
      expectation a view of the model has to satisfy, not a task to close.

  usage_ref:
    description: >
      Reference to the part of the model a concern is about. Restricted to the entities a
      stakeholder actually meets: a user story, a use case, a business process, a screen or a
      concept. An aggregate, an event or a command is how the system is built rather than how it is
      used, so it is not a legal target here and naming one is an error.
    anyOf:
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?US\\d{3,}$"
        description: "A user story (e.g. US001)."
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?UC\\d{3,}$"
        description: "A use case (e.g. UC001)."
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?PRC\\d{3}$"
        description: "A business process (e.g. PRC001)."
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?SCR\\d{3}$"
        description: "A screen (e.g. SCR001)."
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?CN\\d{3}$"
        description: "A concept (e.g. CN001)."

  parallelism_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PAR\\d{3}$"
    description: "Reference to a dynamics parallelism opportunity (e.g. PAR001 or billing.PAR001)."

  ordering_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?ORD\\d{3}$"
    description: "Reference to a dynamics ordering constraint (e.g. ORD001 or billing.ORD001)."

  race_condition_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?RC\\d{3}$"
    description: "Reference to a dynamics race condition (e.g. RC001 or billing.RC001)."

  actor_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?ACT\\d{3}$"
    description: "Reference to an actor (e.g. ACT001 or billing.ACT001)."

  persona_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PER\\d{3,}$"
    description: >
      Reference to a persona (e.g. PER001 or shop.PER001). A persona is a named archetype of an
      actor: the same role can be lived very differently by two people, and it is the archetype,
      not the role, that a design is judged against.

  enumeration_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?EN\\d{3}$"
    description: "Reference to an enumeration (e.g. EN001 or billing.EN001)."

  association_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?(ASC|AS)\\d{3}$"
    description: >
      Reference to an association (e.g. ASC001 or billing.ASC001). `AS###` is the band's retired
      spelling: it still validates on this line and stops validating in the next major. It moves
      with the one-letter bands because `AS###` beside `ASM###` would rebuild, one letter along,
      the adjacency they are being retired to remove.

  transition_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?TR\\d{3}$"
    description: "Reference to a state transition rule (e.g. TR001 or billing.TR001)."

  process_activity_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PA\\d{3}$"
    description: "Reference to a process activity (e.g. PA001 or billing.PA001)."

  user_story_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?US\\d{3,}$"
    description: "Reference to a user story (US + 3+ digits, optional context prefix)."

  use_case_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?UC\\d{3,}$"
    description: "Reference to a use case (UC + 3+ digits, optional context prefix)."

  milestone_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MS\\d{3,}$"
    description: "Reference to a roadmap milestone (MS + 3+ digits, optional context prefix)."

  work_item_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?WI\\d{3,}$"
    description: >
      Reference to a roadmap work item / WBS node (WI + 3+ digits, optional context
      prefix). Work items are the execution tier beneath milestones (epic → subscope →
      task) defined in governance/roadmap.schema.yaml. Used for work-item dependencies
      and blocker links.

  error_ref:
    description: >
      Reference to a domain error. Two formats supported:
      (1) ID-based: optional context prefix + ERR + digits (e.g., ERR001, orders.ERR001).
      (2) Domain:key: domainRef + camelCase error key (e.g., orders:orderValidationFailed).
      Format 1 is machine-stable; format 2 is human-readable.
    anyOf:
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?ERR\\d{3,}$"
        description: "ID-based reference (e.g., orders.ERR001)."
      - type: string
        pattern: "^[a-z][a-z0-9-]*:[a-z][a-zA-Z0-9]*$"
        description: "Domain:key reference (e.g., orders:orderValidationFailed)."

  fitness_function_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?FF\\d{3}$"
    description: "Reference to an architectural fitness function (e.g. FF001 or billing.FF001)."

  migration_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MIG\\d{3}$"
    description: "Reference to a blueprint model migration (e.g. MIG001 or billing.MIG001)."

  domain_ref:
    type: string
    pattern: "^DMN\\d{3,}$"
    description: "Reference to a domain declared in blueprint.yaml `domains[]` (e.g. DMN001). Model-wide, so no context prefix."

  subdomain_ref:
    type: string
    pattern: "^SDM\\d{3,}$"
    description: >
      Reference to a subdomain declared under its domain in blueprint.yaml `domains[].subdomains[]`
      (e.g. SDM001). SOFT-DEPRECATED (v2.8.17). A subdomain is a partition of one domain and is always reached through it, so it takes no identity of its own on the next major line: it is named by its own `name` inside the domain that contains it, and the containing domain is what another entity points at. Still accepted here, and `id` stays required while it exists.
      A reference that names a subdomain becomes a reference to the domain containing it.

  model_ref:
    description: >
      Reference to a model component. Four forms supported:
      (1) Typed ID: MDL + digits with optional context prefix (MDL001, billing.MDL003).
      (2) PascalCase name matching a components.schemas key (OrderSchema).
      (3) JSON Pointer to any component (#/components/schemas/OrderSchema).
      (4) File-relative JSON Pointer (./models.yaml#/components/schemas/OrderSchema).
      Form 1 is preferred for new blueprints. Forms 2-4 exist for
      OpenAPI/AsyncAPI interop where models mirror external spec component names.
    anyOf:
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?MDL\\d{3,}$"
        description: "Typed Blueprint model ID (preferred)."
      - type: string
        pattern: "^[A-Z][A-Za-z0-9]+$"
        description: "PascalCase component name (OpenAPI/AsyncAPI interop)."
      - type: string
        pattern: "^#/components/.+$"
        description: "JSON Pointer to component (OpenAPI/AsyncAPI interop)."
      - type: string
        pattern: "^\\.\\/.*#/components/.+$"
        description: "File-relative JSON Pointer (e.g. ./models.yaml#/components/schemas/Order)."

  # ---------------------------------------------------------------------------
  # Typed ID References (v2.2)
  # New refs for concept attributes, UI, org, stories, and model IDs.
  # ---------------------------------------------------------------------------

  attribute_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CAT\\d{3,}$"
    description: "Concept attribute identifier (e.g. CAT001 or catalog.CAT001). Optional context prefix for cross-context disambiguation."

  screen_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?SCR\\d{3}$"
    description: "Reference to a UI screen (e.g. SCR001 or orders.SCR001)."

  ui_action_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?UAC\\d{3}$"
    description: "Reference to a UI action (e.g. UAC001 or orders.UAC001)."

  ui_nav_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?UNV\\d{3}$"
    description: "Reference to a UI navigation element (e.g. UNV001 or orders.UNV001)."

  party_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PRT\\d{3}$"
    description: >
      Reference to a party, system or organizational (e.g. PRT001 or billing.PRT001). A party is
      one node however many documents declare it: declarations fold on the id; a party declared
      without an id folds on its name within its scope and the fold is reported as a guess; a scalar
      two declarations state differently is reported and never resolved.

  department_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?DPT\\d{3}$"
    description: "Reference to an organizational department (e.g. DPT001 or billing.DPT001)."

  team_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?TM\\d{3}$"
    description: "Reference to a team (e.g. TM001 or billing.TM001)."

  # ---------------------------------------------------------------------------
  # Architecture hierarchy (v2.7.6)
  # Bounded contexts and services become first-class, referenceable nodes.
  # `party_ref` (PRT###) already exists above and is reused for arch parties.
  # ---------------------------------------------------------------------------

  bounded_context_ref:
    description: >
      Reference to a bounded context by its arch id (e.g. BC001 or shop.BC001). Used
      as the arch `context.id` (self-identity), by inter-context `dependency` targets
      (id-based context-map edges), and by BCC entities (business decisions /
      assumptions / KPIs). Operation→bounded-context membership is NOT declared with
      this ref - it is derived from arch service contracts (`expose`/`send` = handled
      / produced), so there is no `bounded_context_ref` on domain files. A
      ref to an unknown BC### is a cross-reference error. The legacy kebab-context-name form (e.g.
      `customer-management`) is a deprecated compatibility shim for existing BCC refs;
      BC### is canonical.
    anyOf:
      - type: string
        pattern: "^([a-z][a-z0-9-]*\\.)?BC\\d{3,}$"
        description: "Canonical: arch bounded-context id (BC###), optionally context/party-prefixed."
      - type: string
        pattern: "^[a-z][a-z0-9-]*$"
        description: "Migration shim (deprecated): legacy kebab-context-name."

  service_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?SVC\\d{3,}$"
    description: "Reference to an architecture service (e.g. SVC001 or shop.SVC001)."

  process_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PRC\\d{3}$"
    description: "Reference to a business process (e.g. PRC001 or orders.PRC001)."

  question_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?QN\\d{3,}$"
    description: >
      Reference to a domain competency question (e.g. QN001 or billing.QN001).
      Questions are first-class entities representing knowledge requirements
      of a bounded context. They exist independently of operations and bridge
      strategic goals to operational implementation.

  x_model_id:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MDL\\d{3,}$"
    description: "Model identifier as JSON Schema x-extension (e.g. MDL001 or orders.MDL001)."

  # ---------------------------------------------------------------------------
  # Ownership (v2.2)
  # File-level default with entity-level override. Exactly one owner.
  # ---------------------------------------------------------------------------

  owned_by:
    type: object
    description: "Entity ownership. Exactly one of team, department, or party. File-level default; entity-level overrides."
    additionalProperties: false
    properties:
      team:
        $ref: "#/$defs/team_ref"
        description: "Owning team reference."
      department:
        $ref: "#/$defs/department_ref"
        description: "Owning department reference."
      party:
        $ref: "#/$defs/party_ref"
        description: "Owning organizational party reference."
    oneOf:
      - required: [team]
      - required: [department]
      - required: [party]

  # ---------------------------------------------------------------------------
  # Architecture Vocabulary
  # ---------------------------------------------------------------------------

  service_kind:
    type: string
    enum: [service, worker, api, webapp, cli, library, function]
    description: "Architectural component type: service=backend, worker=job processor, api=endpoint, webapp=frontend, cli=command-line, library=package, function=serverless."

  value_stream_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?VS\\d{3,}$"
    description: "Reference to a value stream (e.g. VS001 or orders.VS001)."

  capability_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CAP\\d{3}$"
    description: "Reference to a business capability (e.g. CAP001 or billing.CAP001)."

  non_goal_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?NG\\d{3}$"
    description: "Reference to a motivation non-goal (e.g. NG001 or billing.NG001)."

  metric_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?MT\\d{3}$"
    description: "Reference to a quality metric (e.g. MT001 or billing.MT001)."

  finding_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?FN\\d{3}$"
    description: "Reference to a quality finding - an AS-IS internal-quality defect (e.g. FN001 or ordering.FN001)."

  leverage_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?LP\\d{3}$"
    description: >
      Reference to a leverage point - a prioritized cross-cutting intervention that bundles findings /
      risks / decisions / fitness-functions and is delivered via migrations / roadmap work-items
      (e.g. LP001 or platform.LP001). Added v2.7.4.

  probe_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?PRB\\d{3,}$"
    description: >
      Reference to a probe - an instrument that reads an artifact the model does not author and
      reports an observation about it (e.g. PRB001 or integration.PRB001). A probe is a referenceable
      node so that what it does not see is recorded once against the instrument, rather than repeated
      on, or missing from, every observation drawn with it.

  quality_characteristic:
    type: string
    enum:
      - functional-suitability
      - performance-efficiency
      - compatibility
      - usability
      - reliability
      - security
      - maintainability
      - portability
      - safety
    description: >
      ISO/IEC 25010:2011 top-level product-quality characteristic - the eight 2011 characteristics
      plus `safety` (the one clearly-useful 2023 addition). Names the top-level quality attribute a
      finding degrades or a requirement targets; finer grain goes in `quality_subcharacteristic`.
      Added v2.7.4 - supersedes the former maintainability-family-only enum (the removed values
      modularity/analysability/reusability/testability are now sub-characteristics; see schema-update
      module 002).

  quality_subcharacteristic:
    type: string
    enum:
      # maintainability
      - modularity
      - reusability
      - analysability
      - modifiability
      - testability
      # security
      - confidentiality
      - integrity
      - non-repudiation
      - accountability
      - authenticity
      # functional-suitability
      - functional-completeness
      - functional-correctness
      - functional-appropriateness
      # performance-efficiency
      - time-behaviour
      - resource-utilization
      - capacity
      # compatibility
      - co-existence
      - interoperability
      # usability
      - appropriateness-recognizability
      - learnability
      - operability
      - user-error-protection
      - user-interface-aesthetics
      - accessibility
      # reliability
      - maturity
      - availability
      - fault-tolerance
      - recoverability
      # portability
      - adaptability
      - installability
      - replaceability
      # safety (ISO/IEC 25010:2023)
      - operational-constraint
      - risk-identification
      - fail-safe
      - hazard-warning
      - safe-integration
    description: >
      ISO/IEC 25010 sub-characteristic - the finer grain under a `quality_characteristic`. The pairing
      of a sub-characteristic to its top-level is a CONVENTION the author keeps, not a schema-enforced
      constraint (a flat enum). Safety sub-characteristics are from the 2023 revision. Added v2.7.4.

  complexity_pattern:
    type: string
    enum: [crud, presentation, transformation, integration, cdc, concurrency, state-management]
    description: >
      Dominant implementation-complexity / problem-type pattern of a context or subdomain:
      crud=record management; presentation=UI-heavy; transformation=translation/ACL between models;
      integration=orchestration/sagas across systems; cdc=change-data-capture; concurrency=contention
      over a finite shared resource; state-management=lifecycle/state-machine. The problem-type axis -
      distinct from `model_traits` (behavioural archetype) and from `kind`/`type` (strategic value).

  model_traits_item:
    type: string
    enum: [analyser, executor, drafter, auditor, controller, service-provider, information-holder, structurer, coordinator, interfacer]
    description: "A behavioural archetype (Wirfs-Brock role stereotype) of a context or subdomain - e.g. controller/coordinator drives a process/state-machine, information-holder is CRUD-ish, interfacer translates."

  kpi_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?KPI\\d{3}$"
    description: "Reference to a quality KPI (e.g. KPI001 or billing.KPI001)."

  slo_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?SLO\\d{3}$"
    description: "Reference to a service level objective (e.g. SLO001 or billing.SLO001)."

  sla_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?SLA\\d{3}$"
    description: "Reference to a service level agreement (e.g. SLA001 or billing.SLA001)."

  security_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?SEC\\d{3}$"
    description: "Reference to a security requirement (e.g. SEC001 or billing.SEC001)."

  compliance_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?CMP\\d{3}$"
    description: "Reference to a compliance requirement (e.g. CMP001 or billing.CMP001)."

  resilience_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?RES\\d{3}$"
    description: "Reference to a resilience requirement (e.g. RES001 or billing.RES001)."

  # ---------------------------------------------------------------------------
  # Infrastructure layer (v2.7.7)
  # Typed IDs + TOSCA relation vocabulary so the infrastructure design layer
  # (ex-`rg`, frozen since v2.0.0) participates in the knowledge graph. The new
  # prefixes IR/ENV/RT/BND are collision-free and pattern-distinct from their
  # visual neighbours (ENV != EN, BND != BD, RT != R / rule refs). RES### stays
  # `resilience_ref` - the infra resource is IR###, not RES###.
  # On this line the typed form is REQUIRED: a free-string id is a schema error, and
  # a reference that resolves to nothing is an error rather than a warning. On the 2.7
  # line the same ids were strongly encouraged but optional, and a free-string id
  # validated with a warning. Defined here, referenced from the infra, arch and
  # governance schemas.
  # ---------------------------------------------------------------------------

  infra_resource_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?IR\\d{3,}$"
    description: >
      Reference to an infrastructure resource by its typed id (e.g. IR001 or
      prod.IR001), optionally context/environment-prefixed - the concrete host /
      store / network / compute node in the infrastructure layer. This is the only
      form this line accepts: a free-string id such as `prod-web-hosting` validated
      on the 2.7 line and was reported as a warning, and is a schema error here.
      Distinct from `resilience_ref` (RES###) - the infra resource is IR###, not
      RES###.

  environment_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?ENV\\d{3,}$"
    description: >
      Reference to a deployment environment by its typed id (e.g. ENV001 or
      azure.ENV001). Environments are a first-class binding dimension (production
      / staging / dr / ...), each carrying its own target scope, credentials and
      param overlay - not a duplicated model fork. A binding names one here, and a
      service's server may name one instead of spelling the environment's name.
      Pattern-distinct from the `EN###` prefix: ENV### != EN###.

  resource_type_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?RT\\d{3,}$"
    description: >
      Reference to a resource type in the neutral resource-type catalog (e.g.
      RT001 or azure.RT001). A resource type carries an inputs/outputs contract
      and is realised per platform by profile data (neutral + azure + k8s/aws).
      The catalog is external to the model, so this reference resolves against the
      catalog and never against the model's own entities. Not a rule prefix: a rule is
      `(SR|CR|DR|EQ|VR)###`.

  binding_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?BND\\d{3,}$"
    description: >
      Reference to a binding by its typed id (e.g. BND001 or prod.BND001). A
      binding resolves (resource-type x environment) -> a concrete platform /
      module + params (the intent->implementation bridge). Pattern-distinct from
      `business_decision_ref` (BD###): BND### != BD###.

  deployment_scope_ref:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?DSC\\d{3,}$"
    description: >
      Reference to a deployment scope by its typed id (e.g. DSC001 or shared.DSC001).
      A DeploymentScope is a substrate-neutral management / lifecycle / ownership /
      billing partition - an Azure Resource Group or Subscription, an AWS Account /
      OU, a GCP Project / Folder, a Kubernetes Cluster / Namespace, or an on-prem
      Datacenter / host-pool. Scopes nest via `parent` (the subscription -> resource-
      group hierarchy); each InfraResource may name its owning scope via `scope_ref`.
      Distinct from TOSCA `hosted_on` (runtime placement, NOT management grouping) and
      from the file-scope prefix (authoring grouping). A deployment scope's id was a
      free string on the 2.7 line; from 2.8 only the typed form validates.

  infra_relation:
    type: string
    enum:
      - hosted_on
      - connects_to
      - depends_on
      - attaches_to
      - routes_to
    description: >
      TOSCA-derived relation vocabulary for typed inter-resource edges in the
      infrastructure layer (snake_case, TOSCA-verbatim). `hosted_on` is the
      canonical placement edge; `connects_to` / `depends_on` may carry
      attribute-level output refs; `depends_on` is the ordering-only fallback.
      Exactly these five verbs - no synonyms (no `manages`, `uses`, ...).

  coupling:
    type: string
    enum: [http, message, rpc, inprocess, shareddata, scheduledtransfer]
    description: >
      How two bounded contexts are connected: `http` for request and response over an API,
      `message` for events across a broker, `rpc` for a procedure call, `inprocess` for a call
      inside one process, `shareddata` for a store one side writes and the other reads, and
      `scheduledtransfer` for a run on a schedule that moves data between them. The same values the
      contract surface computes from a model's own contract refs, so a declared coupling and a
      derived one are comparable rather than two vocabularies for one fact.
      Where the contracts already say it, they are the better source: they carry the direction, the
      operations and the broker as well, which a single word cannot.

  domain_coverage:
    type: object
    description: >
      One entry of a bounded context's `covers[]`: a problem-space domain the context serves that
      its contracts do not reach. The exception channel, not the primary mechanism - coverage is
      normally derived from the contract surface, and an entry here is for what no contract can
      express.
    additionalProperties: false
    required:
      - ref
    properties:
      ref:
        $ref: "#/$defs/domain_ref"
        description: "The domain (`DMN###`) this context serves, by id from `blueprint.yaml`'s `domains[]`."
      extent:
        type: string
        enum: [full, partial]
        description: >
          How much of the domain the context serves. `partial` is the marked value and is the reason
          the field exists; `full` is available for a model that wants to say it. ABSENT MEANS
          UNSTATED, never `full`: a reader that needs the distinction reports the silence as a gap
          rather than assuming an answer nobody wrote.
        examples: [partial]
      reason:
        type: string
        description: >
          Why the contract surface does not show this coverage. Required wherever `extent` is
          stated, because a partial claim a reader cannot check is a claim nobody can act on.
        examples: ["Batch reconciliation runs against the ledger directly, outside any declared contract."]
      description:
        type: string
        description: "Human-readable note."
    allOf:
      - if:
          required: [extent]
        then:
          required: [reason]

  context_relationship:
    type: string
    enum:
      - shared-kernel
      - customer-supplier
      - conformist
      - anticorruption-layer
      - open-host-service
      - published-language
      - separate-ways
      - partnership
    description: "DDD strategic relationship between bounded contexts. Captures architectural intent beyond technical integration."

  # ---------------------------------------------------------------------------
  # SpecPath
  # Addressable path to any blueprint element for Change Impact Analysis (CIA).
  # Layer names are kebab-case; ID segments may contain uppercase (CN001, CMD001).
  # ---------------------------------------------------------------------------

  spec_path:
    type: string
    pattern: "^([a-z][a-z0-9-]*\\.)?[a-z][a-z0-9-]*(\\.[a-zA-Z0-9_-]+)*$"
    description: "Addressable path to any blueprint element. Format: [context.]layer[.category].ID[.field]. Examples: rules.classification.CR003, billing.rules.classification.CR003, concepts.CN005, test-cases.happy-path.TC001."

  # ---------------------------------------------------------------------------
  # Change Tracking
  # ---------------------------------------------------------------------------

  change_kind:
    type: string
    enum: [add, modify, deprecate, remove, rename, split, merge]
    x-vocabulary-distinct: "Classifies a change NARRATIVELY, for change-impact analysis on a decision. Not the executable operation a migration performs."
    description: >
      Change type for change-impact analysis, as a decision records what it did to a spec path.
      Semver impact: add is minor, modify is minor or major, deprecate is minor, and
      remove, rename, split and merge are major.
      A migration document classifies its own changes with `entity_change_kind`, which carries the
      same words for a different job: this one describes an impact, that one names an operation
      with a target and an ordering.

  semver_impact:
    type: string
    enum: [major, minor, patch]
    description: "Semantic versioning impact: major=breaking, minor=backward-compatible addition, patch=docs or clarification."

  gateway_kind:
    type: string
    enum: [and, xor, or]
    x-vocabulary-distinct: "Gateway semantics for process control flow. One vocabulary for both directions: a fork and a merge of the same kind are the same statement read from opposite ends."
    description: >
      How several branches of a process relate to one another: `and` takes every branch, `xor`
      exactly one, `or` one or more. The same three words describe a fork and a merge, because a
      merge is the fork read from the other end.

  # ---------------------------------------------------------------------------
  # Rule Vocabulary (SBVR)
  # ---------------------------------------------------------------------------

  sbvr_modality:
    type: string
    enum: [necessary, obligatory, prohibited, permitted]
    description: "SBVR deontic modality expressing rule strength."

  logic_tuple:
    type: object
    description: "When/then/else structure for rule logic. 'when' omitted for invariants; 'then' always required."
    properties:
      when:
        type: string
        description: "Condition or triggering context."
      then:
        type: string
        description: "Required conclusion or obligation."
      else:
        type: string
        description: "Alternative conclusion when condition is false."
    required:
      - then

  # ---------------------------------------------------------------------------
  # Decision Lifecycle
  # ---------------------------------------------------------------------------

  decision_status:
    type: string
    enum: [proposed, accepted, landed, rejected, deprecated]
    description: "Decision lifecycle: proposed→accepted→landed; rejected or deprecated at any stage."

  # ---------------------------------------------------------------------------
  # Code Traceability (v2.4)
  # Links blueprint entities to source code files for viewer integration.
  # ---------------------------------------------------------------------------

  code_ref_entry:
    type: object
    description: >
      Reference to a source code file implementing or reflecting this entity.
      Path is relative to repository root for same-repo files.
      For cross-repo files, use URI-style prefix: org/repo#path/to/file.
      In the viewer, paths render as clickable links to the file in the
      configured repository provider (GitHub, GitLab, Bitbucket).
    additionalProperties: false
    required:
      - path
    properties:
      path:
        type: string
        description: >
          File path relative to repository root (e.g., src/models/Order.ts).
          For cross-repo: org/repo#src/models/Order.ts.
      role:
        type: string
        description: >
          Purpose of this file relative to the entity.
          Recommended values: model, interface, implementation,
          test, validation, migration, configuration, documentation,
          schema, proto, api-spec, seed-data.
          Custom values are accepted.
      description:
        type: string
        description: "Optional clarification of what this file contributes."

  code_refs:
    type: array
    items:
      $ref: "#/$defs/code_ref_entry"
    description: "Source code files implementing or reflecting this entity."

  implementation:
    type: string
    enum: [as-is, wip, to-be, unclear]
    x-vocabulary-distinct: "Whether the system has this element yet: a status, not a pointer. code_refs say where the implementation is; this says whether it is there. Neither how sure the modeling judgement is (provenance) nor where a change program stands (migration status)."
    description: >
      Whether the element is implemented. Absent means unclear, never as-is: a model states
      implementation, it is not assumed.
      as-is: it exists in the system today; in a model that traces code, code_refs say where.
      wip: it is being built; some code exists, the element is not yet what the model describes.
      to-be: it is planned or proposed and does not exist yet, whether or not a change program names it.
      unclear: the modeler looked and cannot say.
      A reader of any rendered artifact is told which of the four every drawn element is.

  # ---------------------------------------------------------------------------
  # Delivery Planning (v2.5)
  # Cross-cutting definitions for PRD generation and release planning.
  # ---------------------------------------------------------------------------

  delivery_priority:
    type: string
    enum: [must-have, should-have, could-have, wont-have]
    description: >
      MoSCoW delivery priority for release planning and PRD generation.
      must-have: required for target release.
      should-have: important but not critical.
      could-have: desirable if time permits.
      wont-have: explicitly excluded from target release.

  release_target:
    anyOf:
      - $ref: "#/$defs/milestone_ref"
      - type: string
    description: >
      Target release, as either a milestone id (MS###) that resolves to a declared milestone or a
      free-form label ("MVP", "v1.1", "Q3-2026"). The typed branch is listed first so the join is
      visible to tooling; it adds no constraint, since the second branch accepts every string the
      field accepted before. `anyOf` rather than `oneOf` deliberately: an MS###-shaped value
      satisfies BOTH branches, and `oneOf` demands exactly one, so it would reject precisely the
      values this field exists to make traceable.

  # ---------------------------------------------------------------------------
  # Epistemic Metadata (v2.5)
  # Cross-cutting governance assertions: maturity stage and confidence level.
  # Applied to all 7 governance entities: goal, non_goal, risk, assumption,
  # trade_off, inquiry, capability.
  # ---------------------------------------------------------------------------

  discovery_stage:
    type: string
    enum: [hypothesis, exploring, validated, committed, obsolete]
    description: >
      Epistemic maturity of a governance entity.
      hypothesis: initial idea, no evidence yet.
      exploring: actively being investigated or researched.
      validated: evidence supports this entity's claims.
      committed: stakeholders agreed and resources allocated.
      obsolete: superseded by new understanding.

  certainty:
    type: string
    enum: [speculative, probable, confirmed]
    description: >
      Confidence level of a governance assertion or relationship.
      speculative: based on assumption or analogy.
      probable: supported by partial evidence.
      confirmed: validated by research or stakeholder agreement.

  # ---------------------------------------------------------------------------
  # Graded and Categorical Vocabularies (v2.8)
  # A controlled vocabulary used by more than one field is declared once here and
  # referenced by $ref. Fields that share values but answer different questions get
  # separate definitions with distinct names, so they can diverge without a migration;
  # `x-vocabulary-distinct` states which question each one answers. Graded vocabularies
  # are declared from least to greatest, except where an external standard fixes the
  # order (see delivery_priority, which follows MoSCoW).
  # ---------------------------------------------------------------------------

  severity_scale:
    type: string
    enum: [low, medium, high, critical]
    x-vocabulary-distinct: "How much damage something does, for a defect or a materialized risk."
    description: >
      Magnitude of harm, ascending.
      low: minor inconvenience.
      medium: noticeable impact.
      high: major degradation.
      critical: system failure.

  importance_scale:
    type: string
    enum: [low, medium, high, critical]
    x-vocabulary-distinct: "How differentiating something is to the business, which is not how damaging it is."
    description: >
      Business-strategic weight, ascending.
      low: commodity.
      medium: supporting.
      high: essential.
      critical: core differentiator.

  priority_scale:
    type: string
    enum: [low, medium, high, critical]
    x-vocabulary-distinct: "How essential it is to act on something, which is neither how damaging nor how differentiating it is."
    description: >
      Order of attention, ascending.
      low: nice to have.
      medium: should have.
      high: must have.
      critical: without it the thing it belongs to has no justification.

  likelihood_scale:
    type: string
    enum: [very-low, low, medium, high, very-high]
    description: >
      Probability of something occurring, ascending from very-low to very-high.
      Used for a risk materializing and for a concurrency hazard being hit in production.

  outcome:
    type: string
    enum: [success, failure, error]
    description: >
      Outcome category.
      success: the intended completion.
      failure: a rejection the domain expects and models.
      error: an unexpected fault.

  production_mode:
    type: string
    enum: [any, one_of, all]
    description: >
      How many of a declared set are produced.
      any: a subset may be.
      one_of: exactly one (XOR).
      all: every one (AND).

  story_status:
    type: string
    enum: [draft, refined, ready, in-progress, done, deferred]
    description: >
      Authoring and delivery lifecycle of a user story or a use case.

  milestone_status:
    type: string
    enum: [planned, in-progress, achieved, deferred, cancelled]
    description: >
      Delivery lifecycle of a milestone or a work item, which sit on one axis.

  subdomain_kind:
    type: string
    enum: [core-domain, supporting-domain, generic-domain, technical-capability]
    x-vocabulary-distinct: "Classifies a region of the PROBLEM space: a domain, or a subdomain within one."
    description: >
      DDD strategic importance of a domain or subdomain.
      core-domain: the competitive advantage, worth the deepest model.
      supporting-domain: necessary to the core and specific to this business.
      generic-domain: necessary and available off the shelf.
      technical-capability: a region about the system's own machinery rather than about the
      business it serves.
      PROVISIONAL. That fourth value answers a different question from the other three: they grade
      how important a region is to the business, it names what the region is about. `modeling_space`
      carries the same statement on an axis of its own, so the two can be declared together or
      disagree, and nothing reconciles them. Which of the two keeps the value is unsettled and is
      expected to be decided before the next major line.

  modeling_space:
    type: string
    enum: [business-domain, technical-capability, endeavour]
    x-vocabulary-distinct: "Names what a region's subject matter is, which is a different question from how strategically important it is."
    description: >
      What a region of the model is about.
      business-domain: the business the product serves.
      technical-capability: the system's own machinery rather than the business it serves.
      endeavour: producing or running the system rather than the system's subject matter.
      Absent means `business-domain`, so a model that states nothing is read as describing the
      business it serves.
      Distinct from `subdomain_kind`, which grades strategic importance, and from
      `complexity_pattern`, which names the problem type. The three are independent: a region
      about the system's own machinery is still core, supporting or generic to the business.
      PROVISIONAL. `technical-capability` is also a value of `subdomain_kind`, so a region may
      carry the word on both axes, or carry one on each and disagree, and nothing reconciles the
      two. Treat the value set as unsettled - it may gain, lose or rename values before the next
      major line, and a consumer should not branch on it without allowing for that.

  context_kind:
    type: string
    enum: [core, generic-core, support, generic]
    x-vocabulary-distinct: "Classifies a unit of the SOLUTION space by the problem-space domain it realizes."
    description: >
      DDD classification of a bounded context, by the domain it realizes.
      core: realizes the competitive advantage.
      generic-core: a core capability built on a generic foundation.
      support: enables the core.
      generic: commodity.
      The subject is a bounded context, which is solution space; the classification names the
      problem-space region it serves, so it maps to BCC v5 Strategic Classification, Domain
      Importance. Distinct from `subdomain_kind`, which classifies the problem-space region
      itself.

  # ---------------------------------------------------------------------------
  # Evidence Chain (v2.6)
  # Justifies an entity's discovery_stage and certainty with structured
  # evidence records. Used by governance entities via flat fields, and by
  # design entities via the grouped $defs/provenance object (v2.8).
  # ---------------------------------------------------------------------------

  evidence:
    type: array
    description: "Evidence chain justifying this entity's discovery_stage and certainty."
    items:
      type: object
      additionalProperties: false
      required:
        - kind
        - summary
      properties:
        kind:
          type: string
          enum:
            - interview
            - survey
            - analytics
            - stakeholder-signoff
            - competitive-analysis
            - codebase-analysis
            - documentation
            - assumption
            - experiment
            - workshop
          description: >
            The kind of source the evidence comes from.
            interview: a conversation with a user, expert or stakeholder.
            survey: aggregated answers from many respondents.
            analytics: measured usage or operational data.
            stakeholder-signoff: an explicit agreement by the people accountable.
            competitive-analysis: a comparison against other products or approaches.
            codebase-analysis: a reading of the implementation.
            documentation: an existing written source.
            assumption: a belief not yet backed by evidence, named so it can be tested.
            experiment: an outcome observed under a designed test.
            workshop: a collaborative modelling session (EventStorming, Domain Storytelling,
            a whiteboard workshop). The source is the board export or photo and the date is
            the session's, so an element harvested from the board points back to it and the
            board's age stays visible.
        source:
          type: string
          description: "Where this evidence comes from (URL, document name, person/team)."
        date:
          type: string
          format: date
          description: "When this evidence was collected (ISO 8601)."
        summary:
          type: string
          description: "Brief description of what the evidence shows."
        confidence_impact:
          type: string
          enum: [supports, weakens, invalidates]
          description: "How this evidence affects confidence in the entity."

  # ---------------------------------------------------------------------------
  # Provenance (v2.8) - grouped epistemic metadata for DESIGN-plane entities.
  # Governance entities carry discovery_stage/certainty/evidence as flat fields;
  # design entities nest them here to avoid colliding with domain-semantic
  # fields (e.g. rules.certainty = definitive|heuristic). Optional and additive.
  # ---------------------------------------------------------------------------

  provenance:
    type: object
    additionalProperties: false
    description: >
      Epistemic provenance for a design-plane entity discovered or authored with
      varying confidence (e.g. brownfield reverse-engineering). Complements code_refs:
      code_refs say WHERE the entity is implemented; provenance says HOW SURE the
      modeling judgement is and on WHAT evidence.
    properties:
      discovery_stage:
        $ref: "#/$defs/discovery_stage"
        description: "Epistemic maturity of this design entity."
      certainty:
        $ref: "#/$defs/certainty"
        description: "Confidence in this design entity or its modeling judgement."
      evidence:
        $ref: "#/$defs/evidence"
        description: "Evidence chain justifying discovery_stage and certainty."

  # ---------------------------------------------------------------------------
  # Shared Traceability Links (use typed refs)
  # ---------------------------------------------------------------------------

  # NOTE (v2.7.7): validates_links / impacts_links are shared TEMPLATE $defs - the consuming
  # schemas carry their own local copies (test-cases `validates_refs`, decisions
  # `impact_declaration.direct`) which are the authoritative, validated structures. These
  # templates are kept in sync as a reference shape; editing them alone is
  # validation-inert.
  validates_links:
    type: object
    description: "Cross-layer traceability from a test case to what it validates."
    properties:
      rules:
        type: array
        items:
          $ref: "#/$defs/rule_ref"
        description: "Rules validated by this test."
      operations:
        type: array
        items:
          $ref: "#/$defs/operation_ref"
        description: "Operations exercised by this test."
      concepts:
        type: array
        items:
          $ref: "#/$defs/concept_ref"
        description: "Concepts covered by this test."
      infrastructure:
        type: array
        items:
          $ref: "#/$defs/infra_resource_ref"
        description: "Infrastructure resources (IR###) whose placement/behaviour this test validates."

  impacts_links:
    type: object
    description: "Decision impact references across layers."
    properties:
      rules:
        type: array
        items:
          $ref: "#/$defs/rule_ref"
        description: "Rules impacted by this decision."
      operations:
        type: array
        items:
          $ref: "#/$defs/operation_ref"
        description: "Operations impacted by this decision."
      concepts:
        type: array
        items:
          $ref: "#/$defs/concept_ref"
        description: "Concepts impacted by this decision."
      contract:
        type: array
        items:
          $ref: "#/$defs/spec_path"
        description: "Contract elements impacted, as SpecPath references."
      infrastructure:
        type: array
        items:
          $ref: "#/$defs/infra_resource_ref"
        description: "Infrastructure resources (IR###) impacted by this decision."
      environments:
        type: array
        items:
          $ref: "#/$defs/environment_ref"
        description: "Deployment environments (ENV###) impacted by this decision."

# ── Retired id bands ──────────────────────────────────────────────────
# The bands this line accepts in two spellings, and which of the two is retired. Declared as data
# rather than only in the `description:` of each reference above, because two tools read it: the
# validator reports a model still using a retired band, and the update that rewrites a model to
# the new spelling is checked against this list. Version-scoped by construction - a model
# validated against a line carrying no such block is reported nothing, because there the short
# spelling is the current one.
#
# `deprecated_since` is the version that widened the first patterns; a band widened later carries
# its own `since`, so a report names the version that actually accepted the row's new spelling.
x-retired-bands:
  deprecated_since: "2.8.11"
  removed_in: "the next major line"
  bands:
    - old: D
      new: DC
      entity: Decision
    - old: R
      new: RSK
      entity: Risk
    - old: G
      new: GL
      entity: Goal
    - old: T
      new: TRO
      entity: TradeOff
    - old: A
      new: ASM
      entity: Assumption
    - old: AS
      new: ASC
      entity: Association
    - old: W
      new: WCH
      entity: Watch item
      since: "2.8.12"

# ── GDSM self-description + modeling-guidance ledger ─────────────────────────
# `modeling_guidance` is the schema-native home for durable modelling lessons about this
# suite, served on demand by the blueprint MCP `get_analysis_guidance` tool. Entries are
# added deliberately and pruned on curation; nothing writes here automatically, and nothing
# here is loaded into a session unless it is asked for.
x-gdsm:
  version: "1.0.0"
  methodology: "GDSM v1.0 (Goal-Driven Schema Modeling)"
  status: draft
  suite_name: "blueprint"
  purpose: >
    The cross-cutting blueprint metamodel - typed ids, versioning, and the shared reference
    types every layer resolves through. It also carries the suite-level modeling_guidance
    ledger.
  design_notes: >
    A lesson belongs here when it is durable and about the schema itself: what a construct
    means, where an entity belongs, or what a name is already taken by. What a validator or a
    semantic rule can decide belongs in that check instead, and what is true of one model only
    belongs in that model.
  modeling_guidance:
    - lesson: >
        Order is not causality. `produces` and `reacts_to` state what an operation causes, true of
        it wherever it appears; an activity's `steps` state which operations run in that phase of
        that process, in what order, with what commentary - including queries and the commands a
        person issues next, which have no causal edge to live on. The same operation sits in many
        processes with different neighbours, so order cannot live on the operation. Author both:
        causality once, on the operation; sequence per activity, and never a branch inside it - an
        activity that needs an alternative is two activities.
      category: semantics
      date: "2026-09-09"
      evidence: >
        Measured across every model on this line: on the curated example, steps restate the
        command-and-its-event pair in 11 of 13 adjacent pairs; on the largest real model 143 of 279
        adjacent pairs have no causal edge at all and 174 of 279 non-entry step references lie
        outside the story's causal closure, most of them a command a person issued next. Every
        one of the corpus's 624 step rows carries a note.
      schema_version: "2.8.9"
    - lesson: >
        Three narrative entities, and the choice between them is one question: is this something
        someone INTENDS, or something the model already CONTAINS? `user_story` and `use_case`
        state intent - they carry delivery state, need no operation to exist, and can be deferred
        or dropped with the model unchanged. `story` and its activities describe the model, an
        activity naming the operation it begins at. So a use case can be authored before the
        domain model exists and a story cannot say much without it. This is NOT the
        `design` / `governance` plane axis, which is authorship and epistemic maturity: the two
        are independent, and a requirement does not change plane for being a requirement.
      category: semantics
      date: "2026-09-09"
      evidence: >
        `use_case.main_scenario[]` requires only `step` and `action` and leaves `operation`
        optional, while a `story_activity` without `entry_operation` is reported by the
        `activity-without-entry-operation` rule. Across every model on this line, no file has ever
        been authored holding requirements alone: the two tiers are written together, so the
        distinction has to be stated rather than read off the file layout.
      schema_version: "2.8.9"
    - lesson: >
        Two fields share one definition only when all three hold: they answer the same question
        about different subjects, every value transfers with its ANCHORS, and some declared task
        wants a join across both. Identical value lists are not the test. A goal's priority, a
        capability's strategic importance and a finding's severity are all four-point ladders, and
        `critical` means "without it there is no justification", "core differentiator" and "system
        failure" in turn. Same values, three questions, three definitions - each declaring
        `x-vocabulary-distinct` so the twin reads as deliberate rather than as a copy someone
        forgot to consolidate.
      category: structure
      date: "2026-09-08"
      evidence: >
        Applying the test to the five four-point sites in v2.8 split them three ways where a
        reading by value list would have merged them into one. `npm run schema-vocabulary-check`
        enforces the rule and passes a definition that names its own question.
      schema_version: "2.8.4"
    - lesson: >
        A competency question (QN###) is answered by an operation and scopes exactly one bounded
        context; an inquiry (INQ###) is the modeller's own question and resolves. A question whose
        answer is a rendered artifact rather than an operation is neither of them, and belongs
        beside the render manifest rather than inside the model.
      category: semantics
      date: "2026-09-06"
      evidence: >
        `question.answered_by` takes operation references only, and the `unbound-question` check
        binds a question to one bounded context.
      schema_version: "2.8.0"
    - lesson: >
        Widening an existing reference type so it can also denote something else loosens every
        consumer that reads it. Add a sibling reference type instead, and leave the original
        meaning exact.
      category: structure
      date: "2026-09-06"
      evidence: >
        Measured 2026-09-06: `operation_ref` is resolved from 38 places in 12 schema files of this
        line, each of which reads it as "an operation".
      schema_version: "2.8.0"
    - lesson: >
        The `design` / `governance` plane axis is authorship and epistemic maturity - who is
        entitled to state a thing, and how settled it is - not subject matter. A distinction
        between what a model states and what is stated about the model is a different axis, and
        one entity type does not earn a plane of its own.
      category: semantics
      date: "2026-09-06"
      evidence: >
        Every governance layer (decisions, motivation, test cases, capability) is authored by a
        different role from the design layers it describes.
      schema_version: "2.8.0"
    - lesson: >
        A key name that already carries a meaning one key away in the same document is not
        available for a second meaning, however apt. In a render manifest `view:` is the path to a
        renderer's own view-config file, so it cannot also mean the perspective an artifact takes.
      category: gotcha
      date: "2026-09-06"
      evidence: "`render.manifest.schema.yaml`, `$defs/target.view`."
      schema_version: "2.8.0"
    - lesson: >
        An entity is declared whole, exactly once, in exactly one file. Nesting states a relation
        by position and is the right shape where the child has no identity outside its parent - a
        service inside its context - but it costs one re-declaration of the parent in every file a
        child is declared in. A bounded context that several systems provide services to is
        therefore declared at the document root, and each of its services names its system with
        `system_ref` or inherits the document's default.
      category: structure
      date: "2026-09-06"
      evidence: >
        A nine-document model declares ten parties 28 times, and seven of its nine contexts sit
        under several parties each, because the party owning a context has to be re-declared
        wherever the context is.
      schema_version: "2.8.1"
    - lesson: >
        A folder is not a domain. The filesystem never establishes a model fact: a slice is
        where files live, a domain is a region of the problem space, and the two are n-to-n
        (two folders can describe one domain, one folder can hold parts of several). So the
        problem space is a registry of its own (`domains[]`, two levels, ids), a bounded
        context names its domain by id, and which slice holds a domain's model is DERIVED from
        where its contexts are declared. A folder may supply a default for a declarable field,
        never the only source of one, and the graph records which source won.
      category: structure
      date: "2026-09-09"
      evidence: >
        A client model declared 33 typed slices with 97 subdomains inside `layout.slices` and
        31 contexts naming a slice as their domain; nothing could say that two of those slices
        were one domain, and a renderer had to treat the slice vocabulary as the domain
        vocabulary.
      schema_version: "2.8.6"
    - lesson: >
        A relationship a schema states in a `description:` is not a relationship the model has.
        A reference field is checked by the validator (does the id resolve?) and read by an
        extractor (does an edge exist?), and those are different questions with different
        answers: a chain can be stated in prose, resolve at every hop, and produce no edges at
        all. Before relying on a chain the schema describes, ask the graph for its first hop;
        before adding a `_ref` field, name the extractor that will read it.
      category: semantics
      date: "2026-09-09"
      evidence: >
        `design/quality.schema.yaml` and `governance/leverage.schema.yaml` both state the chain
        finding -> risk -> decision -> migration, which three reference fields carry and 651
        authored references across the corpus populate. Whether a reference answers a graph
        query is a separate fact from whether it resolves, and only asking the graph settles it.
      schema_version: "2.8.12"
    - lesson: >
        Folding a stored inverse in extraction protects the GRAPH and nothing else. Where a
        schema carries both directions of one relationship, the extractor can collapse them into
        one edge so the graph answers once, and every consumer that reads the raw field is still
        reading half the relationship. A renderer, an export or a report that takes the authored
        array will contradict the picture drawn beside it. Either both directions are authored
        and something checks that they agree, or one is authored and every consumer reads the
        derived edge.
      category: structure
      date: "2026-09-09"
      evidence: >
        `leverage_point.enables` is the authored inverse of `depends_on`, and 7 of 7 authored
        edges across the readable models are exact mirrors. Extraction folds the two into one
        relation type, so a consumer reading the authored array answers from what that model
        happened to write. `governance/decisions.schema.yaml` carries `supersedes` and
        `superseded_by` as an authored pair, so the suite holds both shapes.
      schema_version: "2.8.12"
    - lesson: >
        Choose a rename's reach from what references the thing being renamed, not from what the
        previous rename did. A band referenced across layers moves everywhere, because a
        reference left behind dangles. A band nothing references moves at its declaration site
        only, because the same three-character shape occurs in ordinary prose and a text sweep
        would rewrite a sentence to fix a reference that does not exist. Whichever is chosen,
        report what was left alone rather than staying silent about it.
      category: gotcha
      date: "2026-09-09"
      evidence: >
        `W###` is declared 13 times across the corpus, every one an `id:` under a `watchlist:`
        key, and referenced zero times. A structural rewrite moved all 13 in 5 files; a textual
        one anchored the same way would also have matched a part number in a title.
      schema_version: "2.8.12"
    - lesson: >
        Two prioritisation vocabularies are declared on this line and they are not
        interchangeable. `priority_scale` (low / medium / high / critical) grades how essential
        it is to ACT on something, and is what a goal, a risk or a finding takes.
        `delivery_priority` (must-have / should-have / could-have / wont-have) follows MoSCoW and
        grades a deliverable's place in a release. Read a field's own `x-vocabulary-distinct`
        before assuming that two ladders of the same arity answer the same question, and never
        map one onto the other by position.
      category: structure
      date: "2026-09-08"
      evidence: >
        `metamodel.schema.yaml` declares `priority_scale` and `delivery_priority` as separate
        `$defs`, each naming the question it answers, and `delivery_priority` is referenced four
        times. Three of the four anchors on `priority_scale` are worded closely enough to MoSCoW
        that a reader who skips the anchors will merge the two.
      schema_version: "2.8.5"
    - lesson: >
        Use `anyOf` for a field admitting several forms, and `oneOf` only where the branches
        share no value by construction. A typed id is also a plain string, so a field admitting
        "a name or an `ACT###`" has two branches that both match a typed value, and `oneOf`
        rejects exactly the form it was written to admit. The values decide, not the shape of
        the field.
      category: structure
      date: "2026-09-07"
      evidence: >
        `service.servers[].environment` uses `oneOf` correctly: a name from a closed enum, an
        `ENV###`, and an `x-` prefixed name share no value. The `propertyNames` on
        `resource.environments` uses `anyOf`, because its last branch admits any string and so
        overlaps the first two.
      schema_version: "2.8.2"
    - lesson: >
        `propertyNames` is the only place a map's KEYS can be declared references. Nothing about
        the text `production` or `ENV001` says which is meant to point at an entity, so a map
        whose keys are references says so there or nowhere. Declared there, a schema-derived
        reference walk resolves the keys with no list anyone maintains, and versioning comes
        free. A `propertyNames` carrying only a `pattern` still says nothing about pointing at an
        entity, which is what keeps the derivation from over-reading maps like `operations` and
        `errors`.
      category: semantics
      date: "2026-09-07"
      evidence: >
        `design/infrastructure.schema.yaml` declares the `propertyNames` of
        `resource.environments` as an `anyOf` over a typed `environment_ref`, the constant `ALL`,
        and any string. The typed branch is the one that resolves; a key naming an environment
        the model does not declare is reported as a dangling reference in the same words as any
        other.
      schema_version: "2.8.2"
    - lesson: >
        `actor.staffed_by` names the team whose members PERFORM a role, and its absence is what
        says the role is performed outside the organization: a customer, a regulator, a
        third-party system. `owned_by` says who maintains the DEFINITION. The two legitimately
        differ, because a product team can own the definition of an end-user role nobody staffs,
        so `owned_by` alone cannot answer whether an actor is internal.
      category: semantics
      date: "2026-09-07"
      evidence: >
        Measured 2026-09-10 across the committed models: 30 `staffed_by` declarations, in 2
        models. Models that mean staffing commonly write `owned_by` instead, which leaves the
        internal-versus-external question unanswered.
      schema_version: "2.8.2"
    - lesson: >
        `discovery_stage` grades how well the MODEL knows a claim - hypothesis, exploring,
        validated, committed, obsolete - not how far the thing itself has progressed. It is not a
        delivery ladder and does not substitute for one. Two of its values are impure and worth
        knowing before reading a rollup: `committed` records a decision fact (stakeholders agreed
        and resources allocated) and `obsolete` records a lifecycle fact, inside an otherwise
        epistemic ladder.
      category: semantics
      date: "2026-09-07"
      evidence: >
        Measured 2026-09-10: 5875 `discovery_stage` declarations across the committed models,
        5334 of them (91%) in one brownfield reverse-engineered model, with 9 of 18 models
        carrying none. In practice the field is used as a reverse-engineering instrument rather
        than as a maturity grade.
      schema_version: "2.8.2"
    - lesson: >
        Three obvious key names for "what this is about" already carry a meaning on this line, so
        check before minting a fourth. `subject` is the source of a triple
        (`design/concepts.schema.yaml`, `migration.schema.yaml`); `about` is what a party
        relation covers (`governance/organization.schema.yaml`); `area` is a leverage point's
        concern area (`governance/leverage.schema.yaml`). A key name that already carries a
        meaning in the same suite is not available for a second one, however apt.
      category: gotcha
      date: "2026-09-07"
      evidence: >
        Verified 2026-09-10 against this tree: `subject` is required on a concept triple and on a
        migration change record, `about` appears twice in the organization layer, and `area` is a
        free-text grouping label on an intervention.
      schema_version: "2.8.2"
    - lesson: >
        The legal values of `evidence[].kind` are the enum in this file, never a list in a skill,
        a guide or an agent prompt. Those lists are glosses, they drift, and nothing about a
        gloss says whether the schema admits what it names. Read the enum from the schema before
        writing an evidence record, and treat a value found only in prose as unproven.
      category: gotcha
      date: "2026-09-05"
      evidence: >
        The enum carries ten values and gained `workshop` on 2026-09-05, which meant editing four
        prose documents by hand. `npm run evidence-kind-docs-check` reads the enum and reports a
        gloss naming a value the enum does not admit.
      schema_version: "2.8.1"
      enforced_by: "npm run evidence-kind-docs-check"
    - lesson: >
        A controlled vocabulary answers exactly one question, and `x-vocabulary-distinct` states
        which. Before adding a value, check that it is an ANSWER to that question rather than a
        different question wearing the same clothes. A value that classifies the subject on a second
        axis, instead of grading it on the declared one, costs the entity the ability to answer
        either: the one slot is spent, and neither reading can be recovered from it. Where a second
        axis is genuinely wanted, it is a second field.
      category: semantics
      date: "2026-09-12"
      evidence: >
        `subdomain_kind` declares that it classifies a region of the problem space by strategic
        importance, and `modeling_space` classifies the same region by what its subject matter is.
        The two are independent by design, so a region about the system's own machinery is still
        core, supporting or generic to the business and can state both.
      schema_version: "2.8.20"
    - lesson: >
        A default declared once in a document header is implemented one way in this suite: annotate
        the parsed document BEFORE extraction, write the inherited value under its own key, and let
        the resulting edge record which source answered. Keeping the inherited value separate is
        what lets a consumer tell what the model SAID from what it INHERITED. Merging it into the
        declared field destroys that distinction permanently, and no later pass can restore it,
        which is why a field whose two levels describe different subjects is given no inheritance
        at all.
      category: structure
      date: "2026-09-12"
      evidence: >
        Three fields inherit from a header this way - `owned_by`, `system_ref` and `domain_ref` -
        each writing `_owned_by_default`, `_system_ref_default` and `_domain_ref_default` in turn.
        `tags` deliberately does not: a document-level `tags` describes the document and an
        entity-level one describes the entity, so an entity carries exactly the tags it declares.
      schema_version: "2.8.20"
    - lesson: >
        Where one concept is reachable at two nesting levels, confirm the property name at each
        before counting occurrences or before adding a sibling. Two spellings of one concept are
        legitimate history; a measurement that assumes one of them is not, and it fails silently -
        a count that reads the wrong key reports zero, which is indistinguishable from a key nobody
        uses.
      category: structure
      date: "2026-09-12"
      evidence: >
        A subdomain nested in the root `domains[]` registry declares `type`; one nested in a slice
        declares `kind`. Both are accepted and both mean the region's strategic importance.
      schema_version: "2.8.20"
    - lesson: >
        A `description:` that names a fallback, an inheritance, a default or a derivation is a claim
        about the builder, and it holds only while the builder does that. One that names a shape -
        what a field holds, what values it admits - is decided by the schema itself and needs no
        second reading. Check the first kind against the code that implements it, because the two
        are compared by nothing else. Such a claim also travels: its wording is copied into the
        modeler prompt and the hand-written reference, so grep the phrasing across both before
        estimating what changing it costs.
      category: gotcha
      date: "2026-09-12"
      evidence: >
        Both kinds sit side by side in this suite. `tags` describes what a tag attaches to and makes
        no promise beyond it. The header-level defaults - `owned_by`, `system_ref` and `domain_ref` -
        each describe an inheritance, and each is carried by an annotation pass the builder runs
        before extraction.
      schema_version: "2.8.25"
    - lesson: >
        Acceptance is not reachability. The schema decides what a document may say; the extractor
        decides what travels on the graph, and the two are separate lists. Before writing a rule, a
        report or a renderer over a property, confirm the extractor puts that property on the entity
        or the edge it will be read from. A check that reads a property the extractor drops passes
        against a hand-built fixture and returns nothing on every real model, which is the one
        failure shape indistinguishable from a clean result. Carry a typed property as its own field
        rather than folding it into a free-text sibling, because only the typed one can be compared
        with anything derived.
      category: structure
      date: "2026-09-12"
      evidence: >
        A context dependency carries `relationship`, `direction`, `integration_type` and
        `language_boundary` onto its edge. A property the schema admits on the same object reaches
        the graph only once the extractor names it.
      schema_version: "2.8.25"
    - lesson: >
        Where a model states one proposition twice, the defect is the duplication rather than the
        disagreement, so it takes ONE rule id whose message names which of the two it found.
        Splitting agreement from contradiction moves the tool while the author is acting on it: a
        model that resolves a contradiction by deleting the duplicate would trip the second id the
        moment it stopped tripping the first. The same test sets the severity - two readings sharing
        one fix share one severity.
      category: semantics
      date: "2026-09-12"
      evidence: >
        `restated-coupling` reports a `coupling` declared on a dependency the contracts already
        compute, whether the declared word agrees with the computed one or not. Deleting the
        declaration is the fix in both readings.
      schema_version: "2.8.25"
    - lesson: >
        A closed enum is a vocabulary, and the value that reads naturally in a sentence is often not
        in it. Read the enum in the schema file before writing the value, not after the validator
        rejects it: the rejections cluster in governance constructs, where the field names a
        judgement and the natural English word for that judgement is the one a modeller reaches for.
        The cost is not the rejection, which is loud and cheap. It is the near miss - a value that IS
        in the enum and means something else, which validates and then quietly misfiles the element.
      category: gotcha
      date: "2026-09-17"
      evidence: >
        Five values were rejected in one modelling pass, each on a different construct and each a
        plausible English word for what the modeller meant: `constrains` as a concept `predicate`
        (the enum offers part-of, contains, owned-by, derived-from, extends, classifies), `read` as a
        `materializes.action` (create, update, delete, archive), `operational` and `measurement` as
        an inquiry `category` (business, technical, ux, legal, data, dependency, feasibility,
        strategic, organizational), `neutral` as a `confidence_impact` (supports, weakens,
        invalidates), and `cancelled` as an `end_states.type`, where the schema spells it `cancel`.
      schema_version: "2.8.43"
    - lesson: >
        A process whose activities have DISJOINT actors and which declares one end state per half is
        two processes. Split it and join the halves with `calls_subprocess` on the activity where the
        second begins: each half then states its own trigger, its own lanes and its own end state,
        and the call records that they are one flow. The alternative - one process with a title
        joined by "and" - hides the second actor's work inside the first actor's flow, and every
        projection that draws one process as one unit draws the two as one.
      category: semantics
      date: "2026-09-17"
      evidence: >
        A process titled "Respond, score, and support" had two activities, one performed by the
        person answering and the service scoring, one by the manager acting on the score, and it
        declared an end state for each. Split into two processes joined by `calls_subprocess`, it
        produced two boards where it had produced one, and the second half gained the trigger and the
        lanes it never had room to state.
      schema_version: "2.8.43"
    - lesson: >
        `activities[]` inside a process are not entities. They carry an id in the same shape as one
        (`PA###`), and nothing else about them is entity-like: the id allocator has no rule for the
        prefix, they change no entity count, no governance `affects` ref can name one, and no
        validator reports one as unreferenced. Mint the id by reading the process's own list, and pin
        governance to the PROCESS rather than to the step inside it.
      category: structure
      date: "2026-09-17"
      evidence: >
        An activity added to an existing process moved no count reported by validation or by the
        semantic checks, and its id had to be read off its sibling activities because the allocator
        declines the prefix.
      schema_version: "2.8.43"
    - lesson: >
        `tracker_ref` is declared on `process`, `user_story` and `use_case` and on nothing else. That
        is the schema saying which constructs correspond to a unit of delivered WORK: a tracker item
        describes something a team agreed to build, and an operation is a piece of the domain that
        several such items may touch. Do not reach for a nested `properties.tracker_ref` on an
        operation to close the gap - a consumer reading the field reads those three places, and a
        fourth spelling is a value nothing will find.
      category: structure
      date: "2026-09-17"
      evidence: >
        Three declarations in `design/story.schema.yaml` and no operation construct carries one. The
        translator that builds an Event Storming artifact reads it from processes only, so a sticky -
        which is an operation - has no tracker to show and never will without a schema change.
      schema_version: "2.8.43"
    - lesson: >
        A goal, risk, inquiry or finding that names no `affects` target is reported as an orphan, and
        the report is right: an element that points at nothing is a note, not a model statement. Fill
        `affects` when the element is written rather than in a later sweep. The ref also decides
        where several projections DRAW the element, so an empty `affects` is not only a warning - it
        is the difference between a concern pinned beside the thing it is about and a concern in an
        unsorted heap at the edge of the board.
      category: workflow
