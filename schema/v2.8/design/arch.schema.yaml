---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Blueprint Architecture
description: "Design Plane - L0: Bounded context topology. Parties, contexts, services with contracts (interfaces), enriched dependencies for context-map inference, and unified component kinds."
type: object
additionalProperties: false
required:
  - name
# A document declares its bounded contexts nested under the parties that provide their services
# (`parties`), at the document root (`contexts`), or both; it must declare at least one list.
anyOf:
  - required: [parties]
  - required: [contexts]
properties:
  name:
    type: string
    description: "Name of this architecture definition (e.g. system name or product name)."
  description:
    type: string
    description: "Human-readable description of this architecture."
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
    description: "Content version of this architecture document."
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
    description: "Schema version this document conforms to. Omit to assume latest."
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
    description: >
      Bounded context this architecture file belongs to. Used only for
      context-scoped arch fragments (future). Root-level arch files describe
      systems and MUST NOT declare scope - the file name identifies the system
      (e.g., eshop.arch.yaml). Validators SHOULD warn when scope is present
      alongside system-level parties.
  stage:
    type: string
    description: "Architecture maturity stage (e.g. draft, review, approved, production)."
  domains:
    type: object
    additionalProperties:
      type: string
    description: >
      SOFT-DEPRECATED (v2.8.0). Free-string map naming the domains this architecture belongs to
      (name to identifier or description). Nothing resolves it. A domain is declared in the root
      `domains[]` registry of `blueprint.yaml`, where it carries a `DMN###` id that a context
      names through `domain_ref`; the schema-update tool promotes each key into that registry,
      the name becoming the domain's name and the prose its description, and removes the key
      here. Accepted so that existing documents keep loading. Removal targeted for v2.9.
  processes:
    type: array
    items:
      type: string
    description: "Process file references providing narrative context for this architecture."
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  owned_by:
    $ref: "../metamodel.schema.yaml#/$defs/owned_by"
    description: "File-level ownership default. Entities inherit unless overridden."
  parties:
    type: array
    items:
      $ref: "#/$defs/party"
    description: >
      System and organizational parties. In the nested form each carries the bounded contexts whose
      services are its components; a party declared whole carries none, and services elsewhere name
      it through `system_ref`.
  contexts:
    type: array
    items:
      $ref: "#/$defs/context"
    description: >
      Bounded contexts declared whole at the document root, each exactly once in the model. A
      service under a root-declared context names the system it is a component of through
      `system_ref`, or inherits this document's `system_ref` default; the systems a context spans
      are derived from its services. This is the form for a context that several systems provide
      services to, which the nested form can state only by declaring the context once per system.
  system_ref:
    $ref: "../metamodel.schema.yaml#/$defs/party_ref"
    description: >
      File-level default for `service.system_ref`: the system party that every service under a
      root-declared context in this document is a component of, unless the service names its own.
      A service nested under a party is a component of that party and does not read this default.

$defs:

  contract_output:
    type: string
    description: >-
      SOFT-DEPRECATED (v2.8.14). Identity of the generated contract artifact, with the document's
      name, its placement and its serialization fused into one string. State the three separately
      instead: `contract_name` names the document, `slice` or `cross_cutting` places it, and the
      contract kind selects the serialization. Still accepted until the next major line, so an
      unmigrated model keeps validating; the schema-update tool splits one into the three.
      The forms are `<name>`, `<slice>/<name>`, or
      `_global/<name>`. Two services declaring the same value contribute to ONE artifact -
      their specs are merged additively - so this names the physical contract, not one
      service's copy of it. A leading slice name places the artifact in that slice;
      `_global/` marks it cross-cutting; a bare name is placed by the declaring file. A
      first segment that names no declared slice is kept as a subdirectory and reported.
      The extension selects the serialization: `.yaml` and `.yml`, the kind-identifying
      `.openapi`, `.asyncapi` and `.arazzo`, and `.openrpc`, which is JSON-only by its
      own specification. Anything else is written verbatim.

  contract_name:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
    description: >-
      Name of the contract document this interface contributes to. Two services declaring the same
      name under the same contract kind contribute to ONE document - their specs are merged
      additively - so this names the physical contract, not one service's copy of it. The kind
      selects the serialization, so the name carries no extension; `slice` and `cross_cutting`
      place the document, so it carries no path separator.

  contract_slice:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: >-
      Slice the contract document belongs to, naming a slice declared at the blueprint root. Absent,
      the document belongs to the slice its declaring file sits in. A document belonging to no single
      slice says so with `cross_cutting` instead.

  contract_cross_cutting:
    const: true
    description: >-
      The contract document spans the model rather than belonging to one slice. Written only as
      `true` - its absence is the negative - and never beside `slice`.

  contract_identity:
    description: >-
      The naming and placement rules every contract kind shares. A document is named once, by
      `contract_name` or by the superseded `output`, and placed once, by `slice` or by
      `cross_cutting`. Two names, or two placements, would be two answers to one question with
      nothing to say which is current.
    anyOf:
      - required: [contract_name]
      - required: [output]
    # Written as `dependentSchemas` rather than `not: {required: [...]}` for the ERROR PATH: the
    # latter reports the whole contract as "must NOT be valid", which does not say which key to
    # remove. This reports at the key the author just added, which is the one to take back out.
    dependentSchemas:
      output:
        properties:
          contract_name: false
      slice:
        properties:
          cross_cutting: false

  party:
    type: object
    description: >
      A system or organizational party. In the nested form it carries the bounded contexts whose
      services are its components; declared whole, it carries no contexts and services name it
      through `system_ref`. One party is one node however many documents declare it (see
      `party_ref` in the metamodel for how declarations fold).
    additionalProperties: false
    required:
      - id
      - name
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/party_ref"
        description: >
          Stable party id (PRT###) - makes the party a first-class, referenceable
          graph node. MUST reconcile with the org-layer PRT### when the party is also
          modelled there (parties are dual-sourced: arch + org).
      name:
        type: string
        description: "Party name (unique within this architecture document)."
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
        description: "Party version for lifecycle tracking."
      kind:
        type: string
        enum: [system, organization]
        description: "Party type: system=technical system, organization=business unit or company."
      contexts:
        type: array
        items:
          $ref: "#/$defs/context"
        description: >
          Bounded contexts whose services are components of this party (nested form). Optional: a
          party declared whole carries none, and its contexts are then derived from the services
          that name it through `system_ref`.
      description:
        type: string
        description: "Human-readable description."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Party-level ownership override."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  context:
    type: object
    description: "A bounded context with its domain model, services, and dependencies."
    additionalProperties: false
    required:
      - id
      - name
      - kind
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/bounded_context_ref"
        description: >
          Stable bounded-context id (BC###) - the target of inter-context
          `dependency.bounded_context_ref` edges, the DERIVED operation to context
          membership (`handled-by`, from a service contract's `expose`/`send`), and a
          competency question's or business-decision `bounded_context_ref`. Operations do
          NOT carry an ownership ref - their membership is contract-derived, not
          declared on the domain file.
      name:
        type: string
        description: "Context name (unique within the party or document that declares it)."
      kind:
        $ref: "../metamodel.schema.yaml#/$defs/context_kind"
        description: >
          DDD classification of this bounded context, by the problem-space domain it realizes.
          The slice vocabulary in blueprint.schema classifies that domain itself; this one
          classifies the solution-space unit serving it.
      domain_ref:
        oneOf:
          - $ref: "../metamodel.schema.yaml#/$defs/domain_ref"
          - $ref: "../metamodel.schema.yaml#/$defs/subdomain_ref"
        description: >
          The PRIMARY region of the problem space this bounded context realizes - its home: a
          domain (`DMN###`) or one of its subdomains (`SDM###`), by id from `blueprint.yaml`'s
          `domains[]`. ONE reference either way, because this is the field a drawing groups by and
          a context in three domains has no box.

          It is not the whole answer to "which problem-space areas does this context serve". That
          question is n-to-n and is answered by coverage, which is derived from the contract
          surface - context to services to contracts to operations to the domain each operation
          belongs to - with `covers[]` beside it for what no contract can express. Naming a home
          here neither states nor limits that coverage. Naming a subdomain also places the context in the domain that
          contains it - that membership is derived from the registry, never declared twice, so a
          context named against a subdomain groups with its domain's other contexts wherever
          domains are drawn or counted. Optional.

          The subdomain arm is SOFT-DEPRECATED (v2.8.17): a subdomain takes no identity of its own
          on the next major line, so a new context names its domain. One already naming a subdomain
          keeps validating and keeps grouping under that subdomain's domain, which is the value the
          reference resolves to anyway.

          Used to draw the domain map - an overview that groups contexts into domains and
          aggregates the dependencies between them, which is the readable view of a model with
          more contexts than one diagram can show.

          Declaring it OVERRIDES the fallback, which is the slice folder the context's file
          sits in, matched against the domain names. State it when a context belongs to a
          domain other than the one its folder is named after. A slice name is not accepted
          here; the schema-update tool rewrites one to the id of the domain seeded from that slice.
      covers:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/domain_coverage"
        description: >
          Problem-space domains this context serves that its contracts do not reach. THE EXCEPTION
          CHANNEL. Coverage is normally derived - a context's services expose and call operations,
          and each operation belongs to a domain - and a derivation costs nothing to author, cannot
          go stale, and is precise to the operation. An entry here is for the coverage that
          derivation cannot see: work done outside any declared contract.

          Declaring one does not replace the derived answer; both are sources over the same
          proposition and each carries where it came from.
      complexity:
        $ref: "../metamodel.schema.yaml#/$defs/complexity_pattern"
        description: "Dominant implementation-complexity / problem-type pattern. Distinct from `model_traits` (behavioural archetype) and `kind` (strategic value)."
      business_model_role:
        type: string
        enum: [revenue-generator, engagement-creator, compliance-enforcer]
        description: >
          BCC v5 Strategic Classification - Business Model Role.
          Captures HOW the context contributes to the business. Distinct from
          `kind` (which captures WHETHER the context is differentiating).
      evolution:
        type: string
        enum: [genesis, custom, product, commodity]
        description: >
          BCC v5 Strategic Classification - Wardley Evolution stage.
          Used in the dedicated Wardley map view (step-10a) and as a third
          badge in the BCC node's strategic header.
      model_traits:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/model_traits_item"
        description: >
          BCC v5 Model Traits - behavioural archetypes for this context. All
          values are role nouns ("a context that does X") for authoring
          consistency. Sources:
            - Plan / Do / Check (Nick Tune workshop recipe):
                drafter · executor · auditor
            - Wirfs-Brock Object Role Stereotypes:
                controller · service-provider · information-holder
                structurer · coordinator · interfacer
            - Domain analysis emphasis:
                analyser
          Multiple traits per context are allowed; the canonical Plan/Do/Check
          pattern is `[drafter, executor, auditor]` across three contexts.
          Domain-specific traits require a schema CR.
      summary:
        type: string
        description: "Brief description of this context's purpose and responsibilities."
      description:
        type: string
        description: "Human-readable description."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Context-level ownership override."
      responsibilities:
        type: array
        items:
          type: string
        description: "What this context is accountable for."
      dependencies:
        type: array
        items:
          $ref: "#/$defs/dependency"
        description: "Other contexts or external systems this context depends on. Enriched for context-map inference."
      entities:
        type: array
        items:
          $ref: "#/$defs/entity"
        description: "Core domain entities in this context."
      services:
        type: array
        items:
          $ref: "#/$defs/service"
        description: "Services implementing this context."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  team:
    type: object
    description: "Team responsible for a bounded context."
    additionalProperties: true
    required:
      - name
    properties:
      name:
        type: string
        description: "Team name."
      contactEmail:
        type: string
        format: email
        description: "Team contact email for escalations and coordination."

  dependency:
    type: object
    description: "Dependency on another bounded context or external system. Technical connections in contracts enable topology inference; the DDD strategic relationship states the architectural intent the connection cannot."
    additionalProperties: false
    required:
      - name
      - relationship
    properties:
      name:
        type: string
        description: "Name of the dependency (context or external system name)."
      bounded_context_ref:
        $ref: "../metamodel.schema.yaml#/$defs/bounded_context_ref"
        description: >
          Optional target bounded-context id (BC###) - the id-based inter-context
          edge, preferred over matching the `name` string (deprecated
          fallback). Use for dependencies on another bounded context in this model.
      type:
        type: string
        description: >
          Technical integration type, as free text (e.g. api, events, shared-db, file, grpc). The
          typed form of the same idea is `coupling`, which takes the three values the contract
          surface computes; prefer it in a new model.
      coupling:
        $ref: "../metamodel.schema.yaml#/$defs/coupling"
        description: >
          How this dependency is connected, in the vocabulary the contract surface computes. State
          it where the contracts do not: where they do, they already carry the direction, the
          operations and the broker as well, and a second statement of one fact is a disagreement
          waiting to happen.
      relationship:
        $ref: "../metamodel.schema.yaml#/$defs/context_relationship"
        description: "DDD strategic relationship pattern. Captures architectural intent beyond technical integration."
      direction:
        type: string
        enum: [upstream, downstream, peer]
        description: "This context's role: upstream=we provide, downstream=we consume, peer=bidirectional."
      language_boundary:
        type: boolean
        description: "Whether this dependency crosses a ubiquitous language boundary. When true, translation may be needed."
      translation:
        type: string
        description: "How the language boundary is handled (e.g. anticorruption-layer, adapter, mapper, shared-types)."
      description:
        type: string
        description: "Human-readable description."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  entity:
    type: object
    description: "A core domain entity in this bounded context."
    additionalProperties: true
    required:
      - name
    properties:
      name:
        type: string
        description: "Entity name."
      description:
        type: string
        description: "What this entity represents in the domain."

  service:
    type: object
    description: "A deployable service or component within a bounded context."
    additionalProperties: false
    required:
      - id
      - name
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/service_ref"
        description: >
          Stable service id (SVC###) - makes the service a first-class, referenceable
          graph node.
      name:
        type: string
        description: "Service name (e.g. order-api, payment-worker)."
      kind:
        $ref: "../metamodel.schema.yaml#/$defs/service_kind"
        description: "Architectural component type. Determines applicable contract patterns."
      system_ref:
        $ref: "../metamodel.schema.yaml#/$defs/party_ref"
        description: >
          The system party (PRT###) this service is a component of. A service nested under a party
          is a component of that party and may omit it; naming a different party there is a
          cross-reference error. A service under a root-declared context names it here or inherits
          the document's `system_ref` default, and one that does neither is reported by the
          semantic checker as a service without a system. Distinct from `owned_by`, which says who
          owns the service rather than what it is part of.
      summary:
        type: string
        description: "Brief description of what this service does."
      description:
        type: string
        description: "Full description of this service's purpose, responsibilities, and domain role."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      vendor:
        type: array
        items:
          $ref: "#/$defs/team"
        description: "Teams or vendors responsible for this service."
      resource_refs:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/infra_resource_ref"
        description: >
          Typed infrastructure resources this service requires (IR### - `infra_resource_ref`),
          resolving to `resource` entities in the infrastructure layer. This is the canonical
          *intent* edge to a CONCRETE resource; the infrastructure layer's `hosted_on` relation
          is the *placement* edge. Optional. Since v2.8 it is the only way a service names its
          resources: the free-string `resources` list is no longer accepted. See `needs` for the
          abstract (type-level) intent.
      needs:
        type: array
        items:
          $ref: "#/$defs/service_need"
        description: >
          Abstract infrastructure NEEDS (Score `type`/`class`/`id`/`params` vocabulary)
          this service declares - TYPE-level intent, resolved to a concrete resource per
          environment by a binding (BND###). The three altitudes: `needs` (type) → binding
          (type × environment) → `resource_refs` / `resource` (IR### instance). A need names WHAT
          the service requires without pinning a platform, so the same need realizes on cloud,
          on-prem, or hybrid. Additive/optional (v2.7.7).
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Service-level ownership override."
      servers:
        type: array
        description: >
          Server instances where this service is deployed.
          Follows OpenAPI server object pattern.
        items:
          type: object
          additionalProperties: false
          required: [url, environment]
          properties:
            url:
              type: string
              description: "Base URL template (e.g., https://api.example.com/v1)."
            environment:
              description: >
                Which deployment environment this server instance serves. A value takes exactly
                one of three forms, and the three cannot overlap: a name from the common
                vocabulary (production, staging, development, test); a typed environment
                reference (ENV###) naming an environment the model declares, so the server points
                at the entity carrying that environment's class, substrate, provider and target
                scope; or an `x-` prefixed name, for an environment outside the common vocabulary.
                Only the typed form resolves - naming an ENV### the model does not declare is a
                cross-reference error, while a name is checked against nothing.
              oneOf:
                - type: string
                  enum: [production, staging, development, test]
                - $ref: "../metamodel.schema.yaml#/$defs/environment_ref"
                - type: string
                  pattern: "^x-[a-z][a-z0-9-]*$"
            protocol:
              type: string
              description: "Protocol if different from service default."
            description:
              type: string
              description: "Server instance description."
            variables:
              type: object
              description: "URL template variables."
              additionalProperties:
                type: object
                additionalProperties: false
                properties:
                  default:
                    type: string
                    description: "Default value for this variable."
                  enum:
                    type: array
                    items:
                      type: string
                    description: "Allowed values for this variable."
      provides:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: >-
          Operations this service provides, with no transport described. Provider-side, like a
          contract's `expose:`/`send:`, and it materializes the same `handled_by` binding - but it
          names no channel, because an in-process call has none. The opposite of a `call:` list,
          which names operations this service DEPENDS ON rather than owns.
          It is the residual, not the first answer: where a contract already names the operation, or
          where the operation's domain is served by exactly one context, the binding is derived and
          writing it here repeats what the model states elsewhere. Reach for it when neither
          derivation can reach the operation.
          Several services in different bounded contexts may each declare the same operation, and
          each declaration is one binding: an operation the domain shares is genuinely provided in
          more than one place. Declared on the service rather than under `contracts:` because every
          key there names a protocol with a generated specification, and this has neither.
      handles:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: >-
          SOFT-DEPRECATED (v2.8.18): the superseded spelling of `provides:`, accepted with identical meaning and identical effect
          on the graph until the next major line. `handles` named two things at once - who provides
          the operation and how it is invoked - and the second of those is `dispatch:`, on the
          operation. A service may declare either key; declaring both merges them.
      contracts:
        $ref: "#/$defs/contracts"
        description: "External contracts exposing and consuming interfaces for this service."
      side_effects:
        $ref: "#/$defs/service_side_effects"
        description: "Observable side effects beyond request/response: filesystem, stdout, stderr."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
      code_refs:
        $ref: "../metamodel.schema.yaml#/$defs/code_refs"
      provenance:
        $ref: "../metamodel.schema.yaml#/$defs/provenance"
        description: "Epistemic provenance for this service (brownfield modeling confidence)."

  service_need:
    type: object
    description: >
      An abstract infrastructure need declared by a service (Score `type`/`class`/`id`/`params`
      vocabulary). Names WHAT the service requires (a resource TYPE) without pinning a
      concrete resource or platform - a binding (BND###) resolves it per environment (type × env →
      module). The type-level altitude above `resource_refs` (concrete instance). Substrate-neutral:
      the same need binds to a cloud module in one environment and an on-prem module in another
      (hybrid).
    additionalProperties: false
    required:
      - type_ref
    properties:
      type_ref:
        $ref: "../metamodel.schema.yaml#/$defs/resource_type_ref"
        description: "The resource TYPE this need requires (RT### in the resource-type catalog profiles)."
      class:
        type: string
        description: >
          Optional variant/tier within the type (Score `class`) - e.g. 'managed' vs 'self-hosted',
          'standard' vs 'premium', 'read-replica'. Free-text; the catalog/profile + binding interpret it.
      id:
        type: string
        description: >
          Optional logical need id distinguishing shared-vs-dedicated instances. The same
          id shared across services ⇒ a shared resource; distinct ids ⇒ dedicated. NOT an IR###
          (this is intent, pre-binding) - a free-string handle a binding's `need_ref` can target.
      params:
        type: object
        description: >
          Optional type-level parameters (Score `params`) - e.g. {version: '16', size: small}. The
          environment `param_overlay` and the binding `params` refine these at resolution time.
        additionalProperties:
          type: [string, number, boolean]
      description:
        type: string
        description: "Optional human note on why this need exists."

  contracts:
    type: object
    description: "Contract interfaces for this service. Each entry specifies what is exposed or consumed per protocol."
    additionalProperties: false
    properties:
      openapi:
        $ref: "#/$defs/endpoint_contract"
        description: "REST/HTTP API contract (OpenAPI specification)."
      httpClient:
        $ref: "#/$defs/http_client_contract"
        description: "Outbound HTTP client contract - what endpoints this service calls."
      asyncapi:
        $ref: "#/$defs/channel_contract"
        description: "Async messaging contract (AsyncAPI specification)."
      openrpc:
        $ref: "#/$defs/rpc_contract"
        description: "JSON-RPC contract (OpenRPC specification)."
      arazzo:
        $ref: "#/$defs/flow_contract"
        description: "Workflow contract (Arazzo specification)."
      cncfsw:
        $ref: "#/$defs/flow_contract"
        description: "Serverless workflow contract (CNCF Serverless Workflow specification)."
      graphql:
        type: object
        additionalProperties: false
        allOf:
          - $ref: "#/$defs/contract_identity"
        description: "GraphQL API contract."
        properties:
          file:
            type: string
            description: "Path to the GraphQL schema definition file (.graphql)."
          contract_name:
            $ref: "#/$defs/contract_name"
          slice:
            $ref: "#/$defs/contract_slice"
          cross_cutting:
            $ref: "#/$defs/contract_cross_cutting"
          output:
            $ref: "#/$defs/contract_output"
          queries:
            type: array
            items:
              type: string
            description: "Root query field names exposed by this contract."
          mutations:
            type: array
            items:
              type: string
            description: "Root mutation field names exposed by this contract."
          subscriptions:
            type: array
            items:
              type: string
            description: "Root subscription field names exposed by this contract."
      security_schemes:
        type: object
        description: "Security scheme definitions for this service's contracts."
        additionalProperties:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [apiKey, http, oauth2, openIdConnect, mutualTLS]
              description: "Security scheme type (OpenAPI-compatible)."
            scheme:
              type: string
              description: "HTTP auth scheme (e.g., bearer, basic). For type=http."
            bearer_format:
              type: string
              description: "Bearer token format hint (e.g., JWT)."
            flows:
              type: object
              additionalProperties: true
              description: "OAuth2 flow definitions."
            scopes:
              type: object
              additionalProperties:
                type: string
              description: "Available OAuth2 scopes with descriptions."

  endpoint_contract:
    type: object
    description: "OpenAPI endpoint contract: what the service exposes over HTTP."
    additionalProperties: false
    allOf:
      - $ref: "#/$defs/contract_identity"
    properties:
      file:
        type: string
        description: "Path to the OpenAPI specification file."
      contract_name:
        $ref: "#/$defs/contract_name"
      slice:
        $ref: "#/$defs/contract_slice"
      cross_cutting:
        $ref: "#/$defs/contract_cross_cutting"
      output:
        $ref: "#/$defs/contract_output"
      expose:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Operations exposed by this HTTP contract."
      input_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named input data structures accepted by this contract."
      output_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named output data structures produced by this contract."

  http_client_contract:
    type: object
    description: "Outbound HTTP client contract: what endpoints this service calls."
    additionalProperties: false
    allOf:
      - $ref: "#/$defs/contract_identity"
    properties:
      file:
        type: string
        description: "Path to the OpenAPI or .http file describing outbound calls."
      contract_name:
        $ref: "#/$defs/contract_name"
      slice:
        $ref: "#/$defs/contract_slice"
      cross_cutting:
        $ref: "#/$defs/contract_cross_cutting"
      output:
        $ref: "#/$defs/contract_output"
      call:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Operations this service calls via HTTP."
      input_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named input structures sent to the dependency."
      output_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named output structures received from the dependency."

  channel_contract:
    type: object
    description: "AsyncAPI messaging contract: topics and channels this service publishes to or consumes from."
    additionalProperties: false
    allOf:
      - $ref: "#/$defs/contract_identity"
    properties:
      file:
        type: string
        description: "Path to the AsyncAPI specification file."
      contract_name:
        $ref: "#/$defs/contract_name"
      slice:
        $ref: "#/$defs/contract_slice"
      cross_cutting:
        $ref: "#/$defs/contract_cross_cutting"
      output:
        $ref: "#/$defs/contract_output"
      send:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Operations this service publishes via messaging."
      receive:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Operations this service consumes via messaging."
      brokerId:
        type: string
        description: "Message broker identifier (e.g. rabbitmq-prod, kafka-main)."
      input_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named message structures received (consumed)."
      output_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named message structures sent (published)."

  rpc_contract:
    type: object
    description: "OpenRPC contract: remote methods exposed or called."
    additionalProperties: false
    allOf:
      - $ref: "#/$defs/contract_identity"
    properties:
      file:
        type: string
        description: "Path to the OpenRPC specification file."
      contract_name:
        $ref: "#/$defs/contract_name"
      slice:
        $ref: "#/$defs/contract_slice"
      cross_cutting:
        $ref: "#/$defs/contract_cross_cutting"
      output:
        $ref: "#/$defs/contract_output"
      expose:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Operations exposed via RPC by this service."
      call:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Operations this service calls via RPC."
      input_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named input structures for RPC calls."
      output_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named output structures from RPC results."

  flow_contract:
    type: object
    description: "Workflow contract (Arazzo or CNCF Serverless Workflow)."
    additionalProperties: false
    allOf:
      - $ref: "#/$defs/contract_identity"
    properties:
      file:
        type: string
        description: "Path to the workflow specification file."
      contract_name:
        $ref: "#/$defs/contract_name"
      slice:
        $ref: "#/$defs/contract_slice"
      cross_cutting:
        $ref: "#/$defs/contract_cross_cutting"
      output:
        $ref: "#/$defs/contract_output"
      workflows:
        type: array
        items:
          type: string
        description: "Workflow names defined in this contract."
      input_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named input structures for workflow triggers."
      output_structures:
        $ref: "#/$defs/contract_structures"
        description: "Named output structures produced by workflows."

  contract_structures:
    type: object
    description: "Named data structures crossing the service boundary (input or output). Each entry describes a payload shape."
    additionalProperties:
      type: object
      additionalProperties: false
      required:
        - description
      properties:
        description:
          type: string
          description: "What this structure represents and when it is used."
        schema:
          type: object
          description: "JSON Schema or $ref to models.schema.yaml for the data shape."
        format:
          type: string
          description: "Content type (e.g. application/json, application/xml)."
        condition:
          type: string
          description: "When this structure is expected or produced."

  service_side_effects:
    type: object
    description: "Observable side effects of this service beyond its direct contracts. Filesystem, stdout, stderr."
    additionalProperties: false
    properties:
      filesystem:
        type: array
        description: "File system changes this service may perform."
        items:
          type: object
          additionalProperties: false
          properties:
            condition:
              type: string
              description: "When this filesystem effect occurs."
            action:
              type: string
              description: "What happens (e.g. create, update, delete)."
            location:
              type: string
              description: "Path or glob pattern affected."
            reversible:
              type: boolean
              description: "Whether this effect can be undone."
      stdout:
        type: array
        description: "Standard output produced (primarily for CLI components)."
        items:
          type: object
          additionalProperties: false
          properties:
            description:
              type: string
              description: "What is written to stdout."
            condition:
              type: string
              description: "When this output is produced."
            format:
              type: string
              description: "Output format (e.g. JSON, plain text, table)."
      stderr:
        type: array
        description: "Standard error output produced (primarily for CLI components)."
        items:
          type: object
          additionalProperties: false
          properties:
            description:
              type: string
              description: "What is written to stderr."
            condition:
              type: string
              description: "When this error output is produced."
            format:
              type: string
              description: "Error format (e.g. plain text, structured JSON)."
