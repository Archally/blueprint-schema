---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Blueprint Process
description: "Design Plane - Layer 4: Business processes expressing logical operation sequences, actor interactions, and side effects. Ordering here is logical; runtime ordering is in dynamics."
type: object
additionalProperties: false
required:
  - name
  - version
  - processes
properties:
  name:
    type: string
    description: "Domain or service name these processes belong to."
  version:
    $ref: "../metamodel.schema.yaml#/$defs/semver"
    description: "Content version of this process document."
  schemaVersion:
    $ref: "../metamodel.schema.yaml#/$defs/schema_version"
    description: "Schema version this document conforms to. Omit to assume latest."
  scope:
    $ref: "../metamodel.schema.yaml#/$defs/scope_prefix"
    description: "Bounded context this process file belongs to."
  stage:
    type: string
    description: "Development stage (e.g. draft, review, approved)."
  domains:
    type: object
    additionalProperties:
      type: string
    description: >
      SOFT-DEPRECATED (v2.8.15). Free-string map naming the domains these processes touch
      (name to identifier or description). Nothing resolves it. A domain is declared in the root
      `domains[]` registry of `blueprint.yaml`, where it carries a `DMN###` id that a context
      names through `domain_ref`; the schema-update tool promotes each key into that registry,
      the name becoming the domain's name and the prose its description, and removes the key
      here. Accepted so that existing documents keep loading. Removal targeted for v2.9.
  tags:
    $ref: "../metamodel.schema.yaml#/$defs/tags"
  owned_by:
    $ref: "../metamodel.schema.yaml#/$defs/owned_by"
    description: "File-level ownership default. Entities inherit unless overridden."
  processes:
    type: array
    description: "Business processes describing how operations flow from trigger to outcome."
    items:
      $ref: "#/$defs/process"
  user_stories:
    type: array
    description: "Agile user stories - user-level goals someone intends to deliver. Statements of intent, not descriptions of the modelled system."
    items:
      $ref: "#/$defs/user_story"
  use_cases:
    type: array
    description: "Use cases - scenario-level requirements stating intended behaviour. Supports functional and journey modes, and needs no domain model to exist."
    items:
      $ref: "#/$defs/use_case"

$defs:

  process:
    type: object
    description: >
      A business process: a named narrative of actor and operation collaboration. A process
      DESCRIBES the modelled system, so its activities point at operations the domain already
      declares. For behaviour someone intends but the model does not yet contain, use `use_case`.
    additionalProperties: false
    required:
      - id
      - title
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/process_ref"
        description: "Typed process identifier (PRC### pattern)."
      title:
        type: string
        description: "Process title in imperative or actor-goal form."
      processUri:
        type: string
        description: "Optional URI to the process source (e.g. Jira, Linear, GitHub issue)."
      status:
        type: string
        description: "Process status (e.g. draft, approved, implemented)."
      description:
        type: string
        description: "Narrative description of this process's context and goal."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tracker_ref:
        $ref: "../metamodel.schema.yaml#/$defs/tracker_ref"
      initiated_by:
        type: array
        description: "Optional list of actor refs that can initiate this process (human, system, or time). Used for Event Storming lane-start actor stickies."
        items:
          $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
      activities:
        type: array
        description: "Process activities composing this process. Each activity is an asynchronous phase containing synchronous steps."
        items:
          $ref: "#/$defs/process_activity"
      trigger:
        type: object
        description: "Process start event."
        required: [type]
        additionalProperties: false
        properties:
          type:
            type: string
            enum: [message, timer, signal, manual, conditional]
            description: "BPMN-compatible start event type."
          operation:
            $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
            description: "Triggering operation (required for message/signal types)."
          schedule:
            type: string
            description: "Cron expression or ISO 8601 duration (for timer type)."
          description:
            type: string
            description: "Human-readable trigger description."
      end_states:
        type: array
        description: "Process terminal states with their types."
        items:
          type: object
          required: [name, type]
          additionalProperties: false
          properties:
            name:
              type: string
              description: "End state name."
            type:
              type: string
              enum: [complete, error, cancel, terminate]
              description: "BPMN-compatible end event type."
            description:
              type: string
              description: "End state description."
      lanes:
        type: array
        description: "Swim lane assignments mapping actors to their operations within this process."
        items:
          type: object
          required: [actor]
          additionalProperties: false
          properties:
            actor:
              $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
              description: "Actor responsible for operations in this lane."
            operations:
              type: array
              items:
                $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
              description: "Operations assigned to this actor's lane."
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
        description: "Process-level ownership override."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
      code_refs:
        $ref: "../metamodel.schema.yaml#/$defs/code_refs"

  process_activity:
    type: object
    description: >
      An activity within a process. Entry point into the domain causal chain
      (produces/reacts_to). An activity names the operation it begins at once that operation is
      modelled, and that anchoring is what makes a process a description of the domain rather
      than a proposal about it.
    additionalProperties: false
    required: [id, name]
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/process_activity_ref"
        description: "Unique activity identifier (PA001, PA002, etc.)."
      name:
        type: string
        description: "Human-readable activity name describing this process phase."
      description:
        type: string
        description: "Detailed description of what this activity accomplishes."
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      entry_operation:
        $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: >
          Domain operation where this activity begins. Generator follows causal chain
          (produces/reacts_to) from here. Optional: an activity whose operation is not yet modelled
          leaves it out, and the `activity-without-entry-operation` rule reports the gap. A
          reference to an operation nothing declares is a cross-reference error, so the absence is
          the honest form of "not yet", never a placeholder id.
      triggered_by:
        type: array
        items:
          oneOf:
            - $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
            - $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "What initiates this activity: an actor (for first activity) or an event operation (for reactive activities)."
      steps:
        type: array
        description: >
          The operations this activity runs, in order, each with an optional note. This list is the
          model's statement of within-activity ORDER and INCLUSION: which operations run in this
          phase and in what sequence, including the queries and the commands a person issues next,
          which no causal link can carry. Domain causal links (`produces` / `reacts_to`) state
          CAUSALITY and are not repeated here; where a step follows a declared causal edge the two
          agree, and `activity-steps-reverse-causal-edge` reports a pair that reverses one. When
          present these are what the model reports as the activity's operation detail; when absent,
          `entry_operation` stands in as the single entry. Branching does not belong in this list:
          an activity that needs an alternative inside it is two activities linked through
          `next_activities`.
        items:
          type: object
          required: [operation_ref]
          additionalProperties: false
          properties:
            operation_ref:
              $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
              description: "Reference to a domain operation."
            note:
              type: string
              description: "Implementation note, human context, or estimated duration for this step."
      next_activities:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/process_activity_ref"
        description: "Optional explicit links to subsequent activities. When absent, flow is inferred from domain causal links."
      gateway:
        $ref: "../metamodel.schema.yaml#/$defs/gateway_kind"
        description: >
          How this activity's outgoing branches relate: `and` takes every branch, `xor` exactly
          one, `or` one or more. Declared once on the activity that forks, because the split is one
          fact about the whole set of branches rather than a property of any single one. An
          activity with one successor needs no gateway.
      join:
        type: object
        additionalProperties: false
        required: [mode]
        description: >
          How the branches arriving at this activity converge. Without it a convergence is only
          inferred from the number of incoming arrows, which cannot tell waiting for every branch
          apart from continuing on the first.
        properties:
          mode:
            $ref: "../metamodel.schema.yaml#/$defs/gateway_kind"
            description: "`and` waits for every incoming branch, `xor` continues on exactly one, `or` on those that were taken."
      next:
        type: array
        description: >
          Where this activity goes next, and why. Each entry names the following activity and may
          state the condition under which that branch is taken. Use it in preference to
          `next_activities`, which names the following activities and can say nothing about what
          chooses between them; an activity declares one or the other, never both.
        items:
          type: object
          additionalProperties: false
          required: [to]
          properties:
            to:
              $ref: "../metamodel.schema.yaml#/$defs/process_activity_ref"
              description: "The activity this branch leads to."
            condition:
              type: string
              description: >
                The business condition under which this branch is taken, in the model's own terms
                rather than in the terms of a transport. It reaches generated Arazzo as a step
                criterion, so it reads as a statement about the domain and not about a response.
              examples:
                - "the order total is above the free-shipping threshold"
                - "credit score >= 600"
      calls_subprocess:
        $ref: "../metamodel.schema.yaml#/$defs/process_ref"
        description: >
          Another process this activity runs as a subprocess. The called process keeps its own
          identity and its own activities; this activity is the point in the calling process where
          it runs. Use it to join processes that together describe one flow, rather than repeating
          the called process's activities here. The call is a property of the activity, beside its
          step sequence rather than inside it.
      path_type:
        type: string
        enum: [happy, error, compensation]
        description: "Process path classification: happy=expected flow, error=exception handling, compensation=rollback/undo."
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ---------------------------------------------------------------------------
  # User Story (v2.5)
  # Agile user story with MoSCoW delivery priority. States what someone intends to deliver.
  # ---------------------------------------------------------------------------

  user_story:
    type: object
    description: >
      Agile user story: a user-level goal someone INTENDS to deliver.
      Format: As a [actor], I want [goal], so that [benefit].
      A user story states intent rather than describing the modelled system. It carries delivery
      state (`delivery_priority`, `release_target`, `status`), needs no operation to exist, and can
      be deferred or dropped without the model changing.
    additionalProperties: false
    required: [id, actor, goal]
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/user_story_ref"
        description: "Unique user story identifier (US + 3+ digits)."
      actor:
        $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
        description: "The actor who wants this - the 'As a...' clause."
      goal:
        type: string
        description: "What the actor wants to do - the 'I want...' clause."
      benefit:
        type: string
        description: "Why this matters - the 'So that...' clause."
      summary:
        type: string
        maxLength: 200
        description: "One-line summary for listings and PRD tables."
      description:
        type: string
        description: "Additional context or acceptance narrative."
      acceptance_criteria:
        type: array
        items:
          type: string
        description: "Gherkin-style or plain-language acceptance criteria."
      delivery_priority:
        $ref: "../metamodel.schema.yaml#/$defs/delivery_priority"
      release_target:
        $ref: "../metamodel.schema.yaml#/$defs/release_target"
      story_points:
        type: integer
        minimum: 1
        description: "Relative effort estimate for sprint planning."
      status:
        $ref: "../metamodel.schema.yaml#/$defs/story_status"
        description: "User story lifecycle status."
      use_case:
        $ref: "../metamodel.schema.yaml#/$defs/use_case_ref"
        description: >
          SOFT-DEPRECATED (v2.8.9). The use case this story belongs to, named from the story. The
          link is stated by the use case instead - `use_case.user_stories[]` - so that one place
          answers "which stories realise this use case" and a reader never has to reconcile two
          lists that can disagree. Still accepted and still read, and removal is on the next major
          line. `user-story-use-case-back-reference` reports each use, and says whether the use case
          already lists the story back: where it does not, add it there before removing this.
      concern_ref:
        $ref: "../metamodel.schema.yaml#/$defs/concern_ref"
        description: >
          The stakeholder concern this story addresses. `benefit` says why the story is worth doing;
          this says whose standing expectation it serves, and a concern may be served by several
          stories. The inverse is `concern.about_ref` naming this story.
      operations:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Domain operations this story exercises."
      test_cases:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/test_ref"
        description: "Test cases validating this story."
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tracker_ref:
        $ref: "../metamodel.schema.yaml#/$defs/tracker_ref"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
      code_refs:
        $ref: "../metamodel.schema.yaml#/$defs/code_refs"

  # ---------------------------------------------------------------------------
  # Use Case (v2.5)
  # Scenario-level requirement with dual-mode steps: functional (operation)
  # and journey (screen + emotion + pain_point). Merged UJ capabilities.
  # ---------------------------------------------------------------------------

  alternative_flow:
    type: object
    description: >
      One conditional branch off a step of a use case's main scenario: when the condition holds,
      this happens instead of, or in addition to, the step it branches from.
    additionalProperties: false
    required: [step, condition, action]
    properties:
      step:
        type: integer
        minimum: 1
        description: "Step number of the main scenario where this branch leaves it."
      condition:
        type: string
        description: "Condition that triggers this branch."
      action:
        type: string
        description: "What happens on this branch."
      operation:
        $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
        description: "Domain operation performed on this branch. Its initiator is the performer."
      actor:
        $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
        description: "Actor who performs this branch, when it is not a modelled operation. Consulted only when `operation` is absent."

  use_case:
    type: object
    description: >
      Use case - a scenario-level requirement describing actor interaction
      with the system. Serves as both functional specification (steps with
      operations) and user journey (steps with screens, emotions, pain
      points). Groups user stories and optionally references the processes
      that implement it (PRC###).
      Like `user_story` and unlike `process`, a use case states INTENDED behaviour: its steps may be
      written in plain language, so it can be authored before the domain model exists.
    additionalProperties: false
    required: [id, name, primary_actor]
    # One spelling or the other, never both. Two lists of branches on one use case would be two
    # answers to "what are this use case's alternatives", and nothing could say which is current.
    #
    # Written as `dependentSchemas` rather than `not: {required: [...]}` for the ERROR PATH: the
    # latter reports the whole use case as "must NOT be valid", which does not say which key to
    # remove. This reports at `/alternative_flows`, and the author is looking at the answer.
    dependentSchemas:
      extensions:
        properties:
          alternative_flows: false
    properties:
      id:
        $ref: "../metamodel.schema.yaml#/$defs/use_case_ref"
        description: "Unique use case identifier (UC + 3+ digits)."
      name:
        type: string
        description: "Use case name (e.g., 'Place Order')."
      summary:
        type: string
        maxLength: 200
        description: "One-line summary for listings."
      description:
        type: string
        description: "Detailed use case narrative."
      primary_actor:
        $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
        description: "The actor who initiates this use case."
      secondary_actors:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
        description: >
          Actors this use case involves without initiating it - a service it calls, a person it
          notifies, a system it reads from. A use case has one initiator and any number of
          participants; `primary_actor` states the initiator.
      goal:
        type: string
        description: "What the actor is trying to accomplish."
      preconditions:
        type: array
        items:
          type: string
        description: "Conditions that must be true before the use case starts."
      postconditions:
        type: array
        items:
          type: string
        description: "Conditions that are true after successful completion."
      main_scenario:
        type: array
        description: "Main success scenario as ordered steps."
        items:
          type: object
          additionalProperties: false
          required: [step, action]
          properties:
            step:
              type: integer
              minimum: 1
              description: "Step number in the scenario."
            action:
              type: string
              description: "What happens at this step (plain language)."
            operation:
              $ref: "../metamodel.schema.yaml#/$defs/operation_ref"
              description: "Domain operation at this step (functional mode). Its initiator is the performer of the step."
            actor:
              $ref: "../metamodel.schema.yaml#/$defs/actor_ref"
              description: >
                Actor who performs this step, when the step is not a modelled operation. Consulted
                only when `operation` is absent, so a step that IS an operation keeps one source of
                truth for its performer. Use it for human acts a domain operation does not describe:
                a sign-off, a go/no-go call, a code freeze.
            screen:
              $ref: "../metamodel.schema.yaml#/$defs/screen_ref"
              description: "UI screen where this step occurs (journey mode)."
            emotion:
              type: string
              enum: [frustrated, confused, neutral, satisfied, delighted]
              description: "User emotion at this step (empathy mapping)."
            pain_point:
              type: string
              description: "UX friction or difficulty at this step."
      alternative_flows:
        type: array
        description: >
          Alternative flows and exception handling: what happens at a step of the main scenario when
          a condition holds. A branch WITHIN this use case; a use case that conditionally adds
          behaviour to another one is `extends`.
        items:
          $ref: "#/$defs/alternative_flow"
      extensions:
        type: array
        description: >
          SOFT-DEPRECATED (v2.8.9). The same list, under its former name. Use `alternative_flows`,
          which is what a use case's conditional branches are called; `extensions` reads as the
          relationship to another use case, which is `extends`. Both spellings are accepted and read
          identically, and a use case may declare only one of them. Removal on the next major line.
        items:
          $ref: "#/$defs/alternative_flow"
      includes:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/use_case_ref"
        description: >
          Use cases this one always performs as part of itself. The included behaviour runs every
          time, which is what separates it from `extends`: behaviour that runs only under a
          condition is an extension, not an inclusion. The reference points from the including use
          case to the included one.
      extends:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/use_case_ref"
        description: >
          Use cases this one conditionally adds behaviour to. The reference points from the
          extending use case to the one extended, so the base use case stays unaware of it and can
          be read on its own. For a branch WITHIN this use case, use `extensions` instead - that is
          a step-level alternative, not a use case of its own.
      user_stories:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/user_story_ref"
        description: >
          The user stories that realise this use case. This is where the link between the two is
          stated: a use case names its stories, and a story does not name its use case back, so the
          question has one answer and one place to change it.
      processes:
        type: array
        items:
          $ref: "../metamodel.schema.yaml#/$defs/process_ref"
        description: "Business processes (PRC###) implementing this use case."
      delivery_priority:
        $ref: "../metamodel.schema.yaml#/$defs/delivery_priority"
      release_target:
        $ref: "../metamodel.schema.yaml#/$defs/release_target"
      status:
        $ref: "../metamodel.schema.yaml#/$defs/story_status"
        description: "Use case lifecycle status."
      version:
        $ref: "../metamodel.schema.yaml#/$defs/entity_version"
      owned_by:
        $ref: "../metamodel.schema.yaml#/$defs/owned_by"
      properties:
        $ref: "../metamodel.schema.yaml#/$defs/entity_properties"
      tracker_ref:
        $ref: "../metamodel.schema.yaml#/$defs/tracker_ref"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
      code_refs:
        $ref: "../metamodel.schema.yaml#/$defs/code_refs"
