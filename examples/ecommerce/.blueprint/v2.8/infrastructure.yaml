topology:
  tiers:
    - name: edge-tier
      description: "Intended (to-be): edge-tier resources."
      resource_refs:
        - IR001
      region: global
      replicas: 1
    - name: api-tier
      description: "Intended (to-be): api-tier resources."
      resource_refs:
        - IR002
        - IR003
        - IR004
        - IR005
        - IR014
      services:
        - ProductQueryService
        - ProductCatalogAdminService
        - OrderService
        - InventoryService
        - CheckoutService
        - CustomerService
      region: eu-west-1
      replicas: 2
    - name: messaging-tier
      description: "Intended (to-be): messaging-tier resources."
      resource_refs:
        - IR006
      region: eu-west-1
    - name: cache-tier
      description: "Intended (to-be): cache-tier resources."
      resource_refs:
        - IR007
      region: eu-west-1
      replicas: 2
    - name: data-tier
      description: "Intended (to-be): data-tier resources."
      resource_refs:
        - IR008
        - IR009
        - IR015
        - IR010
      region: eu-west-1
    - name: observability-tier
      description: "Intended (to-be): observability-tier resources."
      resource_refs:
        - IR011
      region: eu-west-1
    - name: web-tier
      description: "Intended (to-be): web-tier resources."
      resource_refs:
        - IR012
        - IR013
      services:
        - StorefrontWebApp
        - ShopAdminWebApp
    - name: platform-tier
      description: "Intended (to-be): platform-tier resources."
      resource_refs:
        - IR016
  constraints:
    - "Intended (to-be): the edge is the sole public entry; application endpoints are internal and
      broker, cache, databases, vault and cluster are private."
    - "Intended (to-be): all container workloads use the application cluster; private connectivity
      to managed databases and vault is required."
    - "Intended (to-be): each environment provisions its own topology with isolated state and
      credentials."
    - "Intended (to-be): orders and inventory share a PostgreSQL instance but use separate logical
      databases and credentials."
