version: 1.1.0
name: E-Shop Infrastructure
description: "Intended (to-be) e-shop runtime for eight services across seven contexts. All
  resources, placement, traffic, exposure, tiers, environment configurations and bindings describe
  the target only. No deployment or IaC evidence is asserted. Each environment realizes its own
  isolated copy of this logical topology; resource ids identify roles, not shared live instances.
  RT001 is the neutral application-runtime need contract used here: an HTTP-serving process with a
  service endpoint, realized by the named container resource. No module or version is claimed to
  exist."
environments:
  - id: ENV001
    name: development
    env_class: development
    substrate: cloud
    provider: aws
    tags:
      - to-be
      - isolated-target
  - id: ENV002
    name: staging
    env_class: staging
    substrate: cloud
    provider: aws
    tags:
      - to-be
      - isolated-target
  - id: ENV003
    name: production
    env_class: production
    substrate: cloud
    provider: aws
    tags:
      - to-be
      - isolated-target
resources:
  - id: IR001
    kind: cdn
    name: Edge CDN and Gateway
    summary: Intended public HTTPS entry for web assets and uncached API routes
    owner:
      team: TM002
    platform:
      name: aws
      type: cloudfront
    environments:
      ENV001:
        params:
          intent: to-be
      ENV002:
        params:
          intent: to-be
      ENV003:
        params:
          intent: to-be
    tags:
      - edge
      - cdn
    implementation: to-be
    description: Intended (to-be) resource in each isolated environment; no deployed instance is asserted.
    relations:
      - type: routes_to
        target: IR012
        description: "Intended (to-be): serves the storefront through the edge."
      - type: routes_to
        target: IR013
        description: "Intended (to-be): serves the operator web app through the edge."
      - type: routes_to
        target: IR002
        description: "Intended (to-be): forwards catalog and operator product API requests."
      - type: routes_to
        target: IR003
        description: "Intended (to-be): forwards order API requests."
      - type: routes_to
        target: IR004
        description: "Intended (to-be): forwards stock API requests."
      - type: routes_to
        target: IR005
        description: "Intended (to-be): forwards cart API requests."
      - type: routes_to
        target: IR014
        description: "Intended (to-be): forwards account and session API requests."
    hosting_model: managed-service
    exposure: public
    exposure_detail: "Intended (to-be): only public ingress; cache public assets and catalog reads,
      bypass cache for authenticated and mutation traffic. Operator API routes require authorization
      at ingress; this is a target control, not a claim about current code."
  - id: IR002
    kind: api
    name: Catalog API
    summary: Serves product catalog queries
    owner:
      team: TM002
    platform:
      name: k8s
      type: deployment
    environments:
      ENV001:
        params:
          intent: to-be
      ENV002:
        params:
          intent: to-be
      ENV003:
        params:
          intent: to-be
    implementation: to-be
    description: "Intended (to-be): shared product process hosts ProductQueryService and
      ProductCatalogAdminService, with separate public read and operator write routes."
    relations:
      - type: hosted_on
        target: IR016
        description: "Intended (to-be): runs on the managed application cluster."
      - type: connects_to
        target: IR009
        description: "Intended (to-be): uses Catalog Database."
      - type: connects_to
        target: IR007
        description: "Intended (to-be): uses Session Cache."
      - type: connects_to
        target: IR010
        description: "Intended (to-be): uses Secrets Vault."
      - type: connects_to
        target: IR011
        description: "Intended (to-be): uses Observability Stack."
    hosting_model: container
    exposure: internal
