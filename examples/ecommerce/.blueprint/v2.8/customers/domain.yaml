  - id: customers.QN005
    name: Whose record is a shop operator
    statement: "Where does a shop operator's own record belong, and who models it?"
    description: >
      Unanswered, and written down so it is not mistaken for an oversight. The
      service behind this context serves a second collection beside customers,
      /operators, with the same five routes an account has and a record
      carrying a name, an email, an active flag and a role. The Shop Operator
      (ACT002) is one of those records, and this model declares no operation
      over any of them.
      Two of those routes are now modelled and the rest are not, and the split
      is the answer's current shape rather than an inconsistency. Sign In
      Operator (customers.CMD006) and Get Operator Session (customers.QRY005)
      are declared because the back office is closed until the first of them
      succeeds, so they are part of how the shop works and not only part of what
      it exposes. The list, the read, the create, the update and the delete on
      the same collection stay in exactly the state List Customers was in before
      customers.QRY003 was written: implemented, reachable, and in none of the
      shop's own specifications.
      What is still undecided is where an operator record belongs. Naming it
      here rather than modelling it remains deliberate - whether operators are
      this context's concern or a context of their own is a decision about how
      the shop wants to work, and authentication arriving has sharpened it
      rather than settled it: the sessions of both kinds of person are now
      issued by one service, from one token store, keyed by the record they
      belong to.
