  sendOrderConfirmation:
    id: orders.CMD002
    kind: command
    name: Send Order Confirmation
    description: >
      Email the order confirmation to the customer once every line item's stock
      is reserved. Named by the Order Flow story and the Place Order use case as
      the step that follows reservation. It is designed as a job on the order
      service's own work queue, orders.send-confirmation on the shop event bus,
      which no service runs yet (orders.FN004).
    implementation: to-be
    exchange:
      protocol: amqp
      queue:
        name: orders.send-confirmation
        description: >
          The order service's work queue for confirmation emails. When Stock
          Reserved arrives, the service puts one job on this queue and its own
          worker takes it; one message, one email.
        channel_ref: "MCH004"
    initiated_by:
      - ACT003
    reacts_to:
      - operation: inventory.EVT001
        policy: confirm-on-stock-reserved
    delivery_priority: must-have

errors:
  orderValidationFailed:
    id: orders.ERR001
    name: Order Validation Failed
    description: Order does not meet submission requirements
    category: validation
    severity: error
    http_status: 400
    retry_eligible: false
    related_rules:
      - orders.SR001
  orderNotFound:
    id: orders.ERR002
    name: Order Not Found
    description: Requested order does not exist
    category: not-found
    severity: error
    http_status: 404
    retry_eligible: false
  orderStatusRejected:
    id: orders.ERR005
    name: Order Status Rejected
    description: >
      The requested status was absent, or was not one of the five values the
      Order lifecycle declares. A vocabulary failure and nothing more - it says
      the word is not a status, not that the move is wrong, and the two are
      answered separately because a caller can fix one and has to rethink the
      other.
    category: validation
    severity: error
    http_status: 400
    retry_eligible: false
  orderTransitionRejected:
    id: orders.ERR006
    name: Order Transition Rejected
    description: >
      The requested status exists but is not a legal move from the one the
      order is in. The refusal carries the order's current status and the moves
      that would have been legal from it, so a caller is told what it may do
      rather than only that it may not do this. It is the one failure in this
      model that hands back a piece of the domain rule it just enforced, and it
      is how a back office that has gone stale learns that somebody else moved
      the order first.
    category: conflict
    severity: error
    http_status: 400
    retry_eligible: false
  orderAlreadySubmitted:
    id: orders.ERR003
    name: Order Already Submitted
    description: Order has already been submitted and cannot be resubmitted
    category: conflict
    severity: warning
    http_status: 409
    retry_eligible: false

questions:
  - id: orders.QN001
    name: Order state
    statement: "What state is a customer's order in?"
    description: >
      The question the order-tracking page exists to answer, and the one the
      draft-submitted-confirmed lifecycle was drawn to make answerable.
    category: measurement
    priority: critical
    answered_by:
      - orders.QRY001
    concepts:
      - orders.CN001
    motivated_by:
      - orders.GL001
    stakeholders:
      - ACT001
  - id: orders.QN002
    name: Customer order history
    statement: "Which orders has this customer placed, and in what state is each?"
    description: >
      Answered from this context's own records. Filterable by state, which is
      what makes the order list useful rather than merely complete.
    category: enumeration
    priority: high
    answered_by:
      - orders.QRY002
    concepts:
      - orders.CN001
    stakeholders:
      - ACT001
  - id: orders.QN003
    name: Changing a submitted order
    statement: "Can a customer still change an order once it has been submitted?"
    description: >
      Unanswered, and sharper than it was. The lifecycle now has a cancel edge
      out of every state except delivered (orders.TR003, orders.TR005,
      orders.TR007), so cancelling an order is a thing this shop can express -
      and the only operation that reaches those edges is Set Order Status,
      which is the back office's. A customer who wants to cancel has to ask
      somebody to do it for them, and nothing in this model records that they
      asked. Amendment is not expressible at all: there is no edge, no
      operation and no state for an order that changed.
    category: behavioral
    priority: high
    answered_by: []
    concepts:
      - orders.CN001
      - orders.CN002
    stakeholders:
      - ACT001
    blocking: false
  - id: orders.QN004
    name: One status vocabulary
    statement: "Which set of statuses can an order actually be in?"
    description: >
      Decided: pending, confirmed, shipped, delivered, cancelled. This context
      used to answer the question twice - the aggregate declared draft,
      submitted and confirmed, while Set Order Status accepted a different five
      and wrote any of them onto the same field - and the two answers shared
      one value. That is not a divergence a reader can learn anything from; it
      reads as an authoring mistake, and orders.DC002 removed it by taking the
      five the shop's orders actually hold.
      The lifecycle is now stated as six legal moves rather than a list of
      words (orders.TR002 to orders.TR007), and Set Order Status enforces them.
      What the reconciliation exposed rather than settled is on the other side:
      three operations and an error were built around a draft-then-submit stage
      this lifecycle does not contain. orders.FN001 is where that sits.
    bounded_context_ref: BC002
    category: data
    priority: critical
    answered_by:
      - orders.CMD004
    concepts:
      - orders.CN001
    stakeholders:
      - ACT001
      - ACT002
    resolved: true
    resolution: >
      One vocabulary of five, declared on orders.CN001, with the six legal
      moves as orders.TR002 to orders.TR007 and orders.CMD004 enforcing them
      (orders.DC002).
    blocking: false
  - id: orders.QN005
    name: How an order got here
    statement: "What states has this order been through, and who moved it?"
    description: >
      Unanswered. Set Order Status assigns the new value over the old one and
      records neither the previous status nor the operator who chose it, and
      the command publishes no event for anything downstream to keep. An order
      that reads `cancelled` therefore cannot be distinguished from one
      cancelled in error and put back, and a customer asking why their order
      moved can be answered only from whatever the operator remembers.
    bounded_context_ref: BC002
    category: temporal
    priority: high
    answered_by: []
    concepts:
      - orders.CN001
    stakeholders:
      - ACT001
      - ACT002
    blocking: false
