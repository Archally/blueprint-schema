version: "1.0.0"
name: "Orders"
scope: orders
operations:
  submitOrder:
    id: orders.CMD001
    kind: command
    name: Submit Order
    description: >
      Submit an order for confirmation. It is the second half of a two-step
      place-an-order design - create, review, submit - and after the lifecycle
      was reconciled to the five states the shop's orders actually hold
      (orders.DC002) it is the operation with nowhere to move an order to.
      Submitting does not change the status, because the states it used to move
      between, draft and submitted, are not states of an order any more. What
      it still does is publish Order Submitted, which is what makes Inventory
      reserve stock, so the step is load-bearing and its effect on the order
      itself is now unstated. orders.FN001 holds that.
    initiated_by:
      - ACT001
    exchange:
      protocol: http
      endpoint:
        path: /orders/{id}/submit
        method: POST
        group: orders
        parameters:
          - name: id
            schema: "#/components/x-field/OrderId"
            type: path
            required: true
    payload:
      schema: "#/components/schemas/SubmitOrderRequest"
      contentType: application/json
      required: true
    responses:
      - code: "200"
        type: success
        description: Order submitted successfully
        schema: "#/components/schemas/Order"
      - code: "400"
        type: failure
        description: Order validation failed
        error: orders.ERR001
      - code: "404"
        type: failure
        description: Order not found
        error: orders.ERR002
    governed_by:
      - rule: orders.SR001
    produces:
      operations:
        - orders.EVT001
      mode: all
    task_type: automated
    # v2.6 fields
    delivery_priority: must-have
    materializes:
      - concept: orders.CN001
        action: update
        description: >
          Marks the order as submitted in the design this operation belongs to,
          and writes no status the reconciled lifecycle declares. The six
          transition rules on orders.CN001 contain no edge this command takes
          (orders.FN001).
  createDraftOrder:
    id: orders.CMD003
    code_refs:
      - path: services/orders-service/src/server.ts
        role: implementation
        description: >
          `app.post('/orders')` in the order service's route table. The route creates an
          order in `pending`, not in `draft` - see orders.FN001 on the name.
    kind: command
    name: Create Draft Order
    description: >
      Open an order from the customer's cart, so it can be reviewed and then
      submitted. It is the operation that puts an Order into `pending`, the
      lifecycle's initial state and the only state reachable without anybody
      deciding anything. It also reads the customer's standing discounts
      (customers.QRY002) and strikes every line price with them, which is the
      reach across a context boundary the Orders to Customers dependency
      records.
    initiated_by:
      - ACT001
    exchange:
      protocol: http
      endpoint:
        path: /orders
        method: POST
        group: orders
    payload:
      schema: "#/components/schemas/SubmitOrderRequest"
      contentType: application/json
      required: true
    responses:
      - code: "201"
        type: success
        description: Draft order created
        schema: "#/components/schemas/Order"
      - code: "400"
        type: failure
        description: Order has no line items
        error: orders.ERR001
    governed_by:
      - rule: orders.SR001
    task_type: user-decision
    delivery_priority: must-have
    materializes:
      - concept: orders.CN001
        action: create
        description: Creates the Order in its initial state, pending
      - concept: orders.CN002
        action: create
        description: >
          Creates one line per cart item, capturing the quantity and the unit
          price the order is charged at.

  orderSubmitted:
    id: orders.EVT001
    kind: event
    name: Order Submitted
    description: Order was submitted for processing
    exchange:
      protocol: amqp
      topic:
        name: orders.submitted
        description: Published when an order is submitted
        filters:
          - name: routing-key
            ref: orders.submitted.{priority}
        channel_ref: "MCH001"
    payload:
      schema: "#/components/schemas/OrderSubmittedEvent"
      contentType: application/json
    delivery_priority: must-have
  getOrder:
    id: orders.QRY001
    code_refs:
      - path: services/orders-service/src/server.ts
        role: implementation
        description: >
          `app.get('/orders/:id')` in the order service's route table.
    kind: query
    name: Get Order
    description: Retrieve order by ID
    initiated_by:
      - ACT001
    exchange:
      protocol: http
      endpoint:
        path: /orders/{id}
        method: GET
        group: orders
        parameters:
          - name: id
            schema: "#/components/x-field/OrderId"
            type: path
            required: true
    responses:
      - code: "200"
        type: success
        description: Order details
        schema: "#/components/schemas/Order"
      - code: "404"
        type: failure
        description: Order not found
        error: orders.ERR002
    delivery_priority: must-have
  listOrders:
    id: orders.QRY002
    code_refs:
      - path: services/orders-service/src/server.ts
        role: implementation
        description: >
          `app.get('/orders')` in the order service's route table.
    kind: query
    name: List Orders
    description: List orders for current customer
    initiated_by:
      - ACT001
      - ACT002
    exchange:
      protocol: http
      endpoint:
        path: /orders
        method: GET
        group: orders
        parameters:
          - name: status
            schema: "#/components/x-field/OrderStatus"
            type: query
            required: false
          - name: limit
            schema: "#/components/x-field/PageLimit"
            type: query
            required: false
    responses:
      - code: "200"
        type: success
        description: List of orders
        schema: "#/components/schemas/OrderList"

  setOrderStatus:
    id: orders.CMD004
    code_refs:
      - path: services/orders-service/src/server.ts
        role: implementation
        description: >
          `app.put('/orders/:id/status')` in the order service's route table. The six legal
          moves orders.TR002 to orders.TR007 are computed here, per current status.
    kind: command
    name: Set Order Status
    description: >
      Move an order to its next status. It is the one write on an order that
      the shopper does not make - an operator picks the new status in the back
      office - and it is the ONLY operation in this model that moves an order
      through the lifecycle orders.CN001 declares. Everything the order's state
      ever becomes, it becomes here.
      It is a real transition and not an assignment. The requested value is
      checked against the order's current one, and a move the six rules
      orders.TR002 to orders.TR007 do not contain is refused with the moves
      that would have been legal (orders.ERR006). So a delivered order cannot
      be sent back to pending, a step cannot be skipped, and a delivered order
      cannot be cancelled.
      Two things it still does not do. It produces no event, so nothing
      downstream learns that an order was cancelled or shipped - Inventory
      holds stock reserved for an order cancelled after confirmation
      (orders.TR005) and is never told. And it keeps no history: the previous
      status is overwritten and the operator who chose it is not recorded
      (orders.QN005).
    initiated_by:
      - ACT002
    exchange:
      protocol: http
      endpoint:
        path: /orders/{id}/status
        method: PUT
        group: orders
        parameters:
          - name: id
            schema: "#/components/x-field/OrderId"
            type: path
            required: true
    payload:
      schema: "#/components/schemas/SetOrderStatusRequest"
      contentType: application/json
      required: true
    responses:
      - code: "200"
        type: success
        description: Status assigned, and the whole updated order is returned
        schema: "#/components/schemas/Order"
      - code: "400"
        type: failure
        description: The status was missing, or was not one of the five the lifecycle declares
        error: orders.ERR005
      - code: "400"
        type: failure
        description: >
          The status is a real one but not a legal move from the order's current
          status; the refusal names the moves that would have been legal
        error: orders.ERR006
      - code: "404"
        type: failure
        description: Order not found
        error: orders.ERR002
    task_type: user-decision
    delivery_priority: should-have
    governed_by:
      - rule: orders.TR002
      - rule: orders.TR003
      - rule: orders.TR004
      - rule: orders.TR005
      - rule: orders.TR006
      - rule: orders.TR007
    materializes:
      - concept: orders.CN001
        action: update
        description: >
          Moves the order to the requested status when one of the six transition
          rules allows it. The previous value is overwritten and not recorded,
          so the order's own history cannot be reconstructed from this model
          (orders.QN005).
