# yaml-language-server: $schema=../../../../viewers/blueprint/roadmap-gantt/roadmap.gantt.view.schema.yaml
# ============================================================================
#  ROADMAP GANTT — VIEW CONFIG  (PrestaShop demo)
#  Rendering-only. The planned work lives in ./roadmap.yaml (milestones + work_items).
#  Re-render:  node ../../../../viewers/blueprint/roadmap-gantt/gantt.mjs \
#                --view roadmap.gantt.view.yaml \
#                --out ../../../../viewers/blueprint/roadmap-gantt/examples/prestashop
# ============================================================================

roadmap: ./roadmap.yaml   # canonical source of truth (cadence comes from here)

meta:
  title: "PrestaShop — Delivery Roadmap (Epics, WBS)"
  subtitle: "Sprint-timeboxed · epics → lanes, subscopes → child bars"
  frame: "Sprint 1 = 2026-01-07"

# Base URL prepended to a work item's tracker_ref key (none set in this demo model,
# but shown to document the field).
tracker_base_url: "https://example.atlassian.net/browse/"

# Visible sprint window (WI010 ends at S12).
axis:
  first_sprint: 1
  last_sprint: 13

# Grouping shade: everything rolling up to the MVP release (MS001).
bands:
  - label: "MVP — Cart & Checkout (v1)"
    milestone: MS001
    right_sprint: 7
    color_key: mvp

# Vertical reference lines.
markers:
  - { label: "Today · S3", kind: today, at_sprint: 3 }
  - { label: "MVP target", kind: release, at_sprint: 7 }
  - { label: "Catalog v2 target", kind: target, at_sprint: 13 }
