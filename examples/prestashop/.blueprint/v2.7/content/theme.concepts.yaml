---
version: "1.0.0"
scope: content
tags: [theme]

concepts:
  - id: content.CN003
    name: "Theme"
    stereotype: aggregate-root
    description: "A front-office visual theme defining the storefront's appearance. Themes are imported from archives/URLs/FTP, enabled per shop (only one active at a time), and can be adapted for RTL languages. Theme has no CQRS queries - all operations are write-side (import, enable, delete, reset, adapt)."
    tags: [aggregate-root, presentation]
    attributes:
      name:
        id: CAT616
        description: "Theme identifier name (used in all commands as ThemeName value object)"
        example: "classic"
      active:
        id: CAT617
        description: "Whether this theme is currently enabled for the shop"
      directory:
        id: CAT618
        description: "Filesystem directory containing theme files"
        example: "themes/classic"
      version:
        id: CAT619
        description: "Theme version string"
        example: "2.1.0"
      responsive:
        id: CAT620
        description: "Whether the theme supports responsive design"
    code_refs:
      - path: "src/Core/Domain/Theme/Command/EnableThemeCommand.php"
        role: implementation
      - path: "src/Core/Domain/Theme/ValueObject/ThemeName.php"
        role: model

  - id: content.CN004
    name: "ThemeImportSource"
    stereotype: value-object
    description: "Polymorphic value object defining where to import a theme from - file archive upload, web URL download, or FTP path. Has three factory methods (fromArchive, fromWeb, fromFtp)."
    tags: [value-object, within:content.CN003]
    attributes:
      sourceType:
        id: CAT621
        description: "Import source type - archive (file upload), web (URL), or ftp (path)"
        example: "archive"
      sourcePath:
        id: CAT622
        description: "File path, URL, or FTP location of the theme package"
        example: "https://themes.example.com/classic-2.1.zip"
    code_refs:
      - path: "src/Core/Domain/Theme/ValueObject/ThemeImportSource.php"
        role: model
        description: "Polymorphic value object with fromArchive/fromWeb/fromFtp factory methods"

actors:
  - id: content.ACT002
    name: "StoreDesigner"
    type: human
    description: "Back-office operator responsible for managing the storefront's visual appearance - importing themes, enabling them per shop, resetting layouts, and adapting themes for RTL languages."
    personas:
      - name: "Typical StoreDesigner"
        quote: "The storefront must look professional and consistent. Theme changes are high-risk - I need to preview and test before going live."
        goals: ["Maintain consistent brand appearance", "Switch themes safely without downtime", "Support RTL languages when needed"]
        pain_points: ["Theme import failures from incompatible archives", "No preview before enabling a theme", "RTL adaptation quality varies"]
        behaviors: ["Tests themes in staging before production", "Resets layouts after major theme updates"]
        tech_savviness: high
        job_to_be_done: "Ensure the storefront's visual presentation matches brand standards across all shops"
        context: "Back-office design and presentation management"
        demographics:
          role: "Frontend Developer / Store Designer"
          industry: "E-commerce"

enumerations:
  - id: content.EN002
    name: "ThemeImportSourceType"
    description: "Source type for theme import operations."
    values:
      - name: archive
        description: "Import from uploaded file archive (zip)"
      - name: web
        description: "Import from web URL download"
      - name: ftp
        description: "Import from FTP server path"
    code_refs:
      - path: "src/Core/Domain/Theme/ValueObject/ThemeImportSource.php"
        role: model
