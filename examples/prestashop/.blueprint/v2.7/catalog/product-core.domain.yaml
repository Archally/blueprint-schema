---
name: "Product Core"
version: "1.0.0"
scope: catalog
tags: [product-core]

operations:
  addProduct:
    id: catalog.CMD001
    kind: command
    name: "AddProduct"
    description: "Create a new product with basic data (name, type, tax rules group). Product starts in draft status."
    delivery_priority: must-have
    initiated_by: [catalog.ACT001]
    governed_by:
      - rule: catalog.SR001
    produces:
      operations: [catalog.EVT001]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Product/Command/AddProductCommand.php"
        role: implementation
      - path: "src/Core/Domain/Product/CommandHandler/AddProductHandler.php"
        role: implementation

  updateProduct:
    id: catalog.CMD002
    kind: command
    name: "UpdateProduct"
    description: "Update product basic information — name, description, prices, SEO, options."
    delivery_priority: must-have
    produces:
      operations: [catalog.EVT002]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Product/Command/UpdateProductCommand.php"
        role: implementation

  deleteProduct:
    id: catalog.CMD003
    kind: command
    name: "DeleteProduct"
    description: "Permanently delete a product and all its combinations, images, and specific prices."
    delivery_priority: must-have
    governed_by:
      - rule: catalog.VR002
    produces:
      operations: [catalog.EVT003]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Product/Command/DeleteProductCommand.php"
        role: implementation

  bulkDeleteProducts:
    id: catalog.CMD004
    kind: command
    name: "BulkDeleteProducts"
    description: "Delete multiple products in a single operation."
    delivery_priority: should-have
    produces:
      operations: [catalog.EVT003]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Product/Command/BulkDeleteProductCommand.php"
        role: implementation

  duplicateProduct:
    id: catalog.CMD005
    kind: command
    name: "DuplicateProduct"
    description: "Create a copy of an existing product with all its data, combinations, and images."
    delivery_priority: should-have
    produces:
      operations: [catalog.EVT001]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Product/Command/DuplicateProductCommand.php"
        role: implementation

  updateProductStatus:
    id: catalog.CMD006
    kind: command
    name: "UpdateProductStatus"
    description: "Enable or disable a product (toggle active/inactive)."
    delivery_priority: must-have
    governed_by:
      - rule: catalog.CR001
    produces:
      operations: [catalog.EVT002]
      mode: all

  bulkUpdateProductStatus:
    id: catalog.CMD007
    kind: command
    name: "BulkUpdateProductStatus"
    description: "Enable or disable multiple products at once."
    delivery_priority: should-have
    produces:
      operations: [catalog.EVT008]
      mode: all

  updateProductType:
    id: catalog.CMD008
    kind: command
    name: "UpdateProductType"
    description: "Change product type (standard, combinations, pack, virtual). Affects available fields and behavior."
    delivery_priority: should-have
    produces:
      operations: [catalog.EVT002]
      mode: all

  assignProductToCategories:
    id: catalog.CMD009
    kind: command
    name: "AssignProductToCategories"
    description: "Set category assignments for a product. One category is designated as default."
    delivery_priority: must-have
    produces:
      operations: [catalog.EVT002]
      mode: all

  setProductTags:
    id: catalog.CMD010
    kind: command
    name: "SetProductTags"
    description: "Set free-form keyword tags on a product for search enhancement."
    delivery_priority: could-have
    produces:
      operations: [catalog.EVT002]
      mode: all

  searchProducts:
    id: catalog.QRY001
    kind: query
    name: "SearchProducts"
    description: "Full-text search with faceted filtering (category, price range, attributes). Backed by Elasticsearch."
    delivery_priority: must-have
    code_refs:
      - path: "src/Core/Domain/Product/Query/SearchProductsQuery.php"
        role: implementation

  getProductDetail:
    id: catalog.QRY002
    kind: query
    name: "GetProductDetail"
    description: "Retrieve full product detail including all combinations, images, features, and computed fields."
    delivery_priority: must-have
    code_refs:
      - path: "src/Core/Domain/Product/Query/GetProductForEditingQuery.php"
        role: implementation

  getProductsList:
    id: catalog.QRY009
    kind: query
    name: "GetProductsList"
    description: "List products with pagination, filters, and sorting for the back-office catalog page."
    delivery_priority: must-have

  productCreated:
    id: catalog.EVT001
    kind: event
    name: "ProductCreated"
    description: "Emitted when a new product is added. Triggers search index update."

  productUpdated:
    id: catalog.EVT002
    kind: event
    name: "ProductUpdated"
    description: "Emitted on any product detail change. Triggers search re-indexing and cache invalidation."

  productDeleted:
    id: catalog.EVT003
    kind: event
    name: "ProductDeleted"
    description: "Emitted when a product is permanently deleted. Triggers search index removal."

  productBulkUpdated:
    id: catalog.EVT008
    kind: event
    name: "ProductBulkUpdated"
    description: "Emitted after a bulk status or deletion operation completes."

errors:
  productNotFound:
    id: catalog.ERR001
    name: "ProductNotFound"
    description: "No product exists with the given ID."
    category: not-found
    severity: warning
    http_status: 404

  duplicateSku:
    id: catalog.ERR002
    name: "DuplicateSKU"
    description: "A combination with the same attribute values already exists for this product."
    category: conflict
    severity: error
    http_status: 409
    related_rules: [catalog.SR001]

  invalidProductType:
    id: catalog.ERR003
    name: "InvalidProductType"
    description: "Attempted operation is not valid for this product type (e.g. adding combinations to a virtual product)."
    category: validation
    severity: error
    http_status: 422

  imageDimensionsTooSmall:
    id: catalog.ERR006
    name: "ImageDimensionsTooSmall"
    description: "Uploaded image does not meet minimum dimension requirements."
    category: validation
    severity: error
    http_status: 422
    related_rules: [catalog.VR001]
