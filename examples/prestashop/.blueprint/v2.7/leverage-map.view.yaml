# Rendering-only view-config for the leverage-map generator (viewers/blueprint/leverage-map).
# Owns presentation only; the leverage map itself (the invariant) lives in leverage.yaml.
leverage: ./leverage.yaml
# Enables the time-phased view: `leverage_point.realized_by` is hydrated against these work
# items, which is where dates, sprints, confidence and progress come from. Optional — every
# other format renders without it.
roadmap: ./roadmap.yaml
title: "PrestaShop — Leverage Map"
subtitle: "Highest-leverage modernization interventions, ranked; pareto core = the committed vital few."
# theme: optional per-render override (light | dark); the CLI renders both by default.
