---
version: "1.0.0"

# Sprint cadence anchor (v2.7.2) — enables sprint-based placement on work_items below.
cadence:
  anchor_sprint: 1
  anchor_start: "2026-01-07"     # Wed; sprint 1 start
  sprint_length_days: 14         # two-week sprints

milestones:
  - id: MS001
    name: "MVP — Cart & Checkout"
    description: "Minimal viable checkout: cart management, order placement, payment integration."
    target_date: "2026-06-30"
    status: in-progress
    deliverables:
      - kind: capability
        ref: CAP001
        description: "Order Management — place, cancel, refund."
      - kind: capability
        ref: CAP003
        description: "Checkout Flow — cart + payment initiation."
      - kind: user-story
        ref: orders.US001
        description: "Shopper places an order."
      - kind: user-story
        ref: checkout.US001
        description: "Shopper adds product to cart."
      - kind: operation
        ref: orders.CMD001
        description: "PlaceOrder command fully operational."
    success_criteria:
      - "Shopper can complete end-to-end purchase in < 3 minutes"
      - "Order error rate < 0.5% in staging"
      - "At least 2 payment gateways integrated (Stripe + PayPal)"
    owned_by:
      team: TM001

  - id: MS002
    name: "Catalog v2 — Search & Filters"
    description: "Elasticsearch-powered search, faceted filters, and bulk product import."
    target_date: "2026-09-30"
    status: planned
    deliverables:
      - kind: capability
        ref: CAP005
        description: "Catalog Management — full CRUD + search."
      - kind: capability
        ref: CAP018
        description: "Search & Discovery — faceted search with ES."
      - kind: user-story
        ref: catalog.US001
        description: "CategoryManager creates a product."
      - kind: operation
        ref: catalog.CMD001
        description: "CreateProduct command with ES indexing."
    success_criteria:
      - "Search returns results in < 100ms for 100k product catalog"
      - "Faceted filters on category, price range, attributes"
    dependencies: [MS001]
    owned_by:
      team: TM002

  - id: MS003
    name: "Scale — Async Orders & Inventory"
    description: "Event-driven order processing with async stock reservation for flash-sale volumes."
    target_date: "2026-12-31"
    status: planned
    deliverables:
      - kind: capability
        ref: CAP004
        description: "Stock Reservation — pessimistic locking under concurrency."
      - kind: operation
        ref: orders.EVT001
        description: "OrderPlaced event triggers async downstream."
    success_criteria:
      - "Handle 500+ concurrent checkouts without stock over-sell"
      - "Order processing error rate < 0.1%"
    dependencies: [MS001, MS002]
    owned_by:
      team: TM001

  - id: MS004
    name: "International & Multi-Store"
    description: >
      Multi-currency ordering, zone-based tax rules, multi-language storefront,
      and multi-store configuration for EU market expansion.
    target_date: "2027-03-31"
    status: planned
    deliverables:
      - kind: capability
        ref: CAP011
        description: "Multi-Currency & Tax — global compliance."
      - kind: capability
        ref: CAP012
        description: "Localization — multi-language support."
      - kind: capability
        ref: CAP017
        description: "Multi-Store Management — shared/independent configs."
    success_criteria:
      - "Support 10+ currencies with daily exchange rate updates"
      - "Tax calculation compliant with EU VAT rules for 5+ countries"
      - "Multi-store: independent catalog per shop with shared customer base"
    dependencies: [MS001]
    owned_by:
      team: TM006

  - id: MS005
    name: "API-First & Headless"
    description: >
      New Admin API with OAuth2, headless storefront support, and API client management
      for third-party integrations and composable commerce.
    target_date: "2027-06-30"
    status: planned
    deliverables:
      - kind: capability
        ref: CAP016
        description: "API & Integration Platform — OAuth2 Admin API."
      - kind: capability
        ref: CAP014
        description: "Module Ecosystem — API-compatible module hooks."
    success_criteria:
      - "100% of CQRS commands accessible via Admin API"
      - "OAuth2 token issuance < 200ms p95"
      - "OpenAPI spec auto-generated and published"
    dependencies: [MS002, MS003]
    owned_by:
      team: TM009

# ── Execution-tier work breakdown (WBS, v2.7.2) — epics/subscopes rolling up to
#    milestones, placed by sprint, with typed traceability to decisions/value-streams.
work_items:
  - id: WI001
    kind: epic
    name: "Cart & Checkout MVP"
    description: "End-to-end checkout epic delivering the MS001 release."
    milestone: MS001
    status: in-progress
    confidence: committed
    start_sprint: 1
    end_sprint: 6
    buffer_end_sprint: 7
    progress: 60
    owned_by:
      team: TM001
    realizes_decisions: [D001]
    value_streams: [VS001]
    children:
      - id: WI002
        kind: subscope
        name: "Cart management"
        start_sprint: 1
        end_sprint: 3
        confidence: committed
        progress: 90
      - id: WI003
        kind: subscope
        name: "Payment initiation"
        start_sprint: 3.5
        end_sprint: 6
        confidence: estimated
        progress: 30
        depends_on: [WI002]
        blockers:
          - text: "Awaiting PSP sandbox credentials"

  - id: WI010
    kind: epic
    name: "Search & Filters"
    description: "Elasticsearch-backed search epic for the MS002 release."
    milestone: MS002
    status: planned
    confidence: estimated
    start_sprint: 7
    end_sprint: 12
    progress: 0
    owned_by:
      team: TM002
    value_streams: [VS002]
    depends_on: [WI001]

  # Placed by explicit dates rather than by sprint. Carrier integration is bound to contract
  # renewal dates, not to the delivery cadence — which is exactly the case `start_date`/`end_date`
  # exist for, and `start_date` overrides `start_sprint` when both are present.
  - id: WI011
    kind: epic
    name: "Shipping provider seam"
    description: >
      Abstract carrier rate lookups behind a provider interface with an anticorruption layer,
      so a new carrier ships as configuration plus a small adapter instead of an edit inside
      the checkout context.
    milestone: MS004
    status: planned
    confidence: estimated
    start_date: "2027-01-06"
    end_date: "2027-03-26"
    progress: 0
    owned_by:
      team: TM006
    realizes_decisions: [D005]
    value_streams: [VS003]
    depends_on: [WI001]
    children:
      - id: WI012
        kind: subscope
        name: "Carrier rate provider interface"
        start_date: "2027-01-06"
        end_date: "2027-02-12"
        confidence: estimated
        progress: 0
      - id: WI013
        kind: subscope
        name: "Anticorruption layer for carrier APIs"
        start_date: "2027-02-15"
        end_date: "2027-03-26"
        confidence: tentative
        progress: 0
        depends_on: [WI012]
      # Deliberately OVERLAPS WI012 and WI013 and depends on neither — rate caching is
      # independent of the adapter work. This is the corpus's only pair of concurrent work
      # items, so it is the only fixture an interval-packing renderer can be tested against.
      - id: WI014
        kind: subscope
        name: "Carrier rate caching"
        start_date: "2027-01-20"
        end_date: "2027-02-26"
        confidence: estimated
        progress: 0
