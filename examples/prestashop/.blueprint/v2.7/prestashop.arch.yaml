---
version: "1.0.0"
name: "PrestaShop Platform"
description: >
  Architecture of the PrestaShop v9 open-source e-commerce platform.
  10 bounded contexts derived from 62 CQRS domain aggregates across the
  PrestaShop/PrestaShop develop branch.
tags: [prestashop, e-commerce, php, symfony]
parties:
  - name: PrestaShop
    kind: system
    env: production
    description: "PrestaShop v9 monolith with CQRS domain layer and Symfony framework."
    contexts:
      # ── Core Domains ────────────────────────────────────────────────────
      - name: Catalog
        kind: core
        complexity: transformation
        summary: "Product catalog — CRUD, variants, media, categories, attributes, suppliers, search indexing."
        owned_by:
          team: TM002
        responsibilities:
          - "Product lifecycle (create, update, activate, discontinue, archive)"
          - "Category hierarchy and product assignment"
          - "Combination/variant management with own identity"
          - "Product media (images, attachments, virtual files)"
          - "Specific pricing rules and customizations"
          - "Feature and attribute group management"
          - "Supplier and manufacturer associations"
          - "Search index synchronization"
        dependencies:
          - name: International
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Consumes currency, tax, and language data for product pricing and localization."
          - name: Modules
            type: events
            relationship: open-host-service
            direction: upstream
            description: "Exposes hooks for module-driven catalog extensions."
        services:
          - name: CatalogService
            kind: api
            summary: "REST API for product and category management."
            servers:
              - url: "https://api.prestashop.example/v1/catalog"
                environment: production
              - url: "http://localhost:8080/api/catalog"
                environment: development
            contracts:
              openapi:
                output: dist/catalog-api.openapi.yaml
                expose:
                  - catalog:addProduct
                  - catalog:updateProduct
                  - catalog:searchProducts
                  - catalog:getProductDetail
              asyncapi:
                output: dist/catalog-events.asyncapi.yaml
                send:
                  - catalog:productCreated
                  - catalog:productUpdated
                brokerId: prestashop-event-bus

      - name: Orders
        kind: core
        complexity: concurrency
        summary: "Order lifecycle — placement, state management, cancellation, refund, invoice, returns, credit slips."
        owned_by:
          team: TM001
        responsibilities:
          - "Order creation from validated cart"
          - "Order state machine (created → paid → shipped → delivered)"
          - "Cancellation and refund processing"
          - "Invoice and delivery slip generation"
          - "Order return and credit slip management"
          - "Order messaging between merchant and customer"
          - "Payment record tracking"
        dependencies:
          - name: Checkout
            type: events
            relationship: shared-kernel
            direction: downstream
            description: "Receives cart-to-order transition. Shared cart calculation kernel."
            language_boundary: false
          - name: Catalog
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads product data for order line items."
          - name: Customers
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads customer and address data for order placement."
          - name: Shipping
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads carrier and shipping cost data for fulfillment."
          - name: International
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads currency and tax rules for order totals."
        services:
          - name: OrderService
            kind: api
            summary: "REST API for order commands and queries."
            servers:
              - url: "https://api.prestashop.example/v1/orders"
                environment: production
              - url: "http://localhost:8080/api/orders"
                environment: development
            contracts:
              openapi:
                output: dist/orders-api.openapi.yaml
                expose:
                  - orders:placeOrder
                  - orders:cancelOrder
                  - orders:issueStandardRefund
                  - orders:getOrderForViewing
              asyncapi:
                output: dist/orders-events.asyncapi.yaml
                send:
                  - orders:orderPlaced
                  - orders:orderCancelled
                  - orders:orderRefunded
                  - orders:orderShipped
                brokerId: prestashop-event-bus

      - name: Checkout
        kind: core
        complexity: concurrency
        summary: "Cart management, checkout flow, cart rules, promotions, payment orchestration."
        owned_by:
          team: TM003
        responsibilities:
          - "Cart session lifecycle (create, update, checkout, abandon)"
          - "Cart item management (add, remove, update quantity)"
          - "Cart rule and discount evaluation"
          - "Catalog price rule application"
          - "Payment initiation and gateway orchestration"
          - "Cart total calculation (products, discounts, tax, shipping)"
        dependencies:
          - name: Catalog
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads product prices, stock, and availability for cart items."
          - name: Customers
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads customer data for cart rules and guest checkout."
          - name: International
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads currency and tax data for cart totals."
          - name: Orders
            type: events
            relationship: shared-kernel
            direction: upstream
            description: "Publishes cart-to-order transition event."
            language_boundary: false
        services:
          - name: CheckoutService
            kind: api
            summary: "REST API for cart operations and payment initiation."
            servers:
              - url: "https://api.prestashop.example/v1/checkout"
                environment: production
              - url: "http://localhost:8080/api/checkout"
                environment: development
            contracts:
              openapi:
                output: dist/checkout-api.openapi.yaml
                expose:
                  - checkout:addProductToCart
                  - checkout:removeProductFromCart
                  - checkout:getCartForViewing
              asyncapi:
                output: dist/checkout-events.asyncapi.yaml
                send:
                  - checkout:cartProductsUpdated
                receive:
                  - orders:orderPlaced
                brokerId: prestashop-event-bus

      # ── Supporting Domains ──────────────────────────────────────────────
      - name: Customers
        kind: support
        complexity: crud
        summary: "Customer accounts, addresses, customer service messaging, titles."
        owned_by:
          team: TM004
        responsibilities:
          - "Customer registration and account management"
          - "Address CRUD (billing, shipping)"
          - "Customer service thread management"
          - "Customer group and title management"
        dependencies:
          - name: International
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads country and state data for address validation."
        services:
          - name: CustomerService
            kind: api
            summary: "REST API for customer account and address management."
            contracts:
              openapi:
                output: dist/customers-api.openapi.yaml
                expose:
                  - customers:addCustomer
                  - customers:editCustomer
                  - customers:addCustomerAddress
                  - customers:getCustomerForViewing

      - name: Shipping
        kind: support
        complexity: integration
        summary: "Carrier configuration, shipping cost calculation, shipment tracking."
        owned_by:
          team: TM005
        responsibilities:
          - "Carrier CRUD and zone-based shipping rules"
          - "Shipping cost calculation by weight, price, and zone"
          - "Shipment creation and tracking number assignment"
        dependencies:
          - name: International
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads zone and country data for carrier shipping rules."
        services:
          - name: ShippingService
            kind: api
            summary: "REST API for carrier management and shipping cost calculation."
            contracts:
              openapi:
                output: dist/shipping-api.openapi.yaml
                expose:
                  - shipping:getAvailableCarriers

      - name: International
        kind: support
        complexity: transformation
        summary: "Currencies, countries, zones, languages, tax rules — localization backbone."
        owned_by:
          team: TM006
        responsibilities:
          - "Currency management and exchange rates"
          - "Country, state, and zone hierarchies"
          - "Language and translation management"
          - "Tax rule groups and tax rate configuration"
          - "Locale-specific formatting (date, number, address)"
        services:
          - name: InternationalService
            kind: api
            summary: "REST API for currency, tax, country, and language management."
            contracts:
              openapi:
                output: dist/international-api.openapi.yaml
                expose:
                  - international:getCurrencyForEditing
                  - international:getTaxRulesGroupForEditing
                  - international:getCountryForEditing
                  - international:getLanguageForEditing

      - name: Content
        kind: support
        complexity: crud
        summary: "CMS pages, page categories, themes, email templates, SEO meta."
        owned_by:
          team: TM007
        responsibilities:
          - "CMS page and page category management"
          - "Theme selection and configuration"
          - "Email template management (mail themes)"
          - "SEO meta (URL rewriting, page titles, descriptions)"
        dependencies:
          - name: International
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads language data for multilingual CMS content."
        services:
          - name: ContentService
            kind: api
            summary: "REST API for CMS page and theme management."
            contracts:
              openapi:
                output: dist/content-api.openapi.yaml
                expose:
                  - content:addCmsPage
                  - content:editCmsPage

      # ── Generic Domains ─────────────────────────────────────────────────
      - name: Modules
        kind: generic
        complexity: integration
        summary: "Module lifecycle, hook system, module marketplace integration."
        owned_by:
          team: TM008
        responsibilities:
          - "Module install, uninstall, enable, disable, upgrade"
          - "Hook registration and execution pipeline"
          - "Module configuration management"
        dependencies:
          - name: Admin
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads employee permissions for module management authorization."
        services:
          - name: ModuleManager
            kind: service
            summary: "Module lifecycle orchestrator with hook execution pipeline."
            contracts:
              openapi:
                output: dist/modules-api.openapi.yaml
                expose:
                  - modules:installModule
                  - modules:uninstallModule
                  - modules:getModuleInfos

      - name: Admin
        kind: generic
        complexity: crud
        summary: "Employee accounts, profiles, security, API clients, configuration."
        owned_by:
          team: TM009
        responsibilities:
          - "Employee registration and profile/role management"
          - "Access control and permission checking"
          - "API client (OAuth2) management"
          - "Webservice key management"
          - "Security audit logging"
          - "Shop configuration key-value store"
        services:
          - name: AdminService
            kind: api
            summary: "REST API for employee, security, and configuration management."
            servers:
              - url: "https://api.prestashop.example/v1/admin"
                environment: production
              - url: "http://localhost:8080/api/admin"
                environment: development
            contracts:
              openapi:
                output: dist/admin-api.openapi.yaml
                expose:
                  - admin:addEmployee
                  - admin:editProfile
                  - admin:getEmployeeForEditing
                  - admin:addApiClient
              security_schemes:
                bearer:
                  type: http
                  scheme: bearer
                  bearer_format: JWT
                admin_oauth2:
                  type: oauth2
                  scopes:
                    admin:read: "Read admin data"
                    admin:write: "Modify admin data"
                    employees:manage: "Manage employee accounts"

      - name: Shop
        kind: generic
        complexity: crud
        summary: "Multi-store configuration, physical stores, contacts, search, aliases."
        owned_by:
          team: TM010
        responsibilities:
          - "Multi-store (shop group/shop) configuration"
          - "Physical store listing for store locator"
          - "Contact form and department management"
          - "Search alias and engine configuration"
          - "Showcase card and notification management"
        dependencies:
          - name: International
            type: api
            relationship: customer-supplier
            direction: downstream
            description: "Reads country and language data for multi-store locale assignment."
        services:
          - name: ShopService
            kind: api
            summary: "REST API for multi-store and shop configuration."
            contracts:
              openapi:
                output: dist/shop-api.openapi.yaml
                expose:
                  - shop:getStoreForEditing
                  - shop:editContact

      - name: ExternalApiConsumers
        kind: generic
        complexity: integration
        summary: "External systems consuming PrestaShop Admin API via OAuth2."
        services:
          - name: AdminApiClient
            kind: api
            summary: "External API consumer using PrestaShop Admin REST API with OAuth2 authentication."
            contracts:
              httpClient:
                output: dist/admin-api-client.http
                call:
                  - admin:addApiClient
                  - admin:getEmployeeForEditing
                  - catalog:searchProducts
                  - catalog:getProductDetail
                  - orders:getOrderForViewing
              security_schemes:
                admin_oauth2:
                  type: oauth2
                  scopes:
                    admin:read: "Read access to admin API"
                    admin:write: "Write access to admin API"
