version: 1.0.0
name: PrestaShop Platform
description: |
  Architecture of the PrestaShop v9 open-source e-commerce platform. 10 bounded contexts derived from 62 CQRS domain aggregates across the PrestaShop/PrestaShop develop branch.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
parties:
  - name: PrestaShop
    kind: system
    env: production
    description: PrestaShop v9 monolith with CQRS domain layer and Symfony framework.
    contexts:
      - id: prestashop.BC009
        name: ExternalApiConsumers
        kind: generic
        complexity: integration
        summary: External systems consuming PrestaShop Admin API via OAuth2.
        services:
          - id: prestashop.SVC009
            name: AdminApiClient
            kind: api
            summary: External API consumer using PrestaShop Admin REST API with OAuth2 authentication.
            contracts:
              httpClient:
                output: dist/admin-api-client.http
                call:
                  - admin:addApiClient
                  - admin:getEmployeeForEditing
                  - catalog:searchProducts
                  - catalog:getProductDetail
                  - orders:getOrderForViewing
              security_schemes:
                admin_oauth2:
                  type: oauth2
                  scopes:
                    admin:read: Read access to admin API
                    admin:write: Write access to admin API
