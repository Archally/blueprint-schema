---
version: "1.0.0"
scope: international

kpis:
  - id: international.KPI001
    name: "Exchange Rate Freshness"
    target: ">= 95% of active currencies have exchange rates updated within 24 hours"
    window: "daily"
    goal: international.G001
    thresholds:
      warning: "90%"
      critical: "80%"

  - id: international.KPI002
    name: "Tax Rule Coverage"
    target: "100% of active zone/country combinations covered by at least one tax rule"
    window: "weekly"
    goal: international.G002
    thresholds:
      warning: "95%"
      critical: "90%"

  - id: international.KPI003
    name: "Localization Completeness"
    target: ">= 90% of target market languages and currencies configured and active"
    window: "monthly"
    goal: international.G003

slos:
  - id: international.SLO001
    name: "Tax Calculation Accuracy"
    target: "100% of orders produce correct tax amounts matching configured rules"
    window: "weekly"
    operations: [international.QRY010]
    error_budget: "0% — tax errors have regulatory consequences"

  - id: international.SLO002
    name: "Exchange Rate Refresh Latency"
    target: "p99 < 10s for exchange rate refresh from external provider"
    window: "weekly"
    operations: [international.CMD005]
