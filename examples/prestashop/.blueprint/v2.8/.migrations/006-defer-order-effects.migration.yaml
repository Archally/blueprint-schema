      value: DC011
    - kind: set
      entity_type: use-case
      target: orders.UC001
      property: main_scenario
      value:
        - step: 1
          action: Shopper reviews cart contents and totals.
          emotion: neutral
        - step: 2
          action: Shopper enters shipping address.
          emotion: neutral
        - step: 3
          action: Synchronously validate cart, payment, stock and order invariants and run all veto hooks.
          operation: orders.CMD001
        - step: 4
          action: Shopper selects payment method and confirms.
          emotion: satisfied
        - step: 5
          action: Write order and its existing synchronous OrderPlaced hook; do not move veto or
            transaction-dependent hooks.
          operation: orders.EVT001
          emotion: delighted
        - step: 6
          action: Before commit, record deferred-effect intents in the order transaction; commit both or
            neither.
          operation: orders.CMD041
        - step: 7
          action: After commit return order success; confirmation and PDF remain pending.
        - step: 8
          action: After the request, deliver confirmation from the committed outbox.
          operation: orders.CMD042
        - step: 9
          action: Render the PDF for the already issued invoice out of the request.
          operation: orders.CMD043
        - step: 10
          action: Run explicitly eligible after-hooks out of the request.
          operation: orders.CMD044
      old_value:
        - step: 1
          action: Shopper reviews cart contents and totals.
          emotion: neutral
        - step: 2
          action: Shopper enters shipping address.
          emotion: neutral
        - step: 3
          action: System validates stock availability.
          operation: orders.CMD001
        - step: 4
          action: Shopper selects payment method and confirms.
          emotion: satisfied
        - step: 5
          action: System creates order and emits OrderPlaced.
          operation: orders.EVT001
          emotion: delighted
    - kind: set
      entity_type: use-case
      target: orders.UC001
      property: extensions
      value:
        - &a2
          step: 3
          condition: Insufficient stock for one or more items.
          action: System displays stock error and suggests alternatives.
        - &a3
          step: 4
          condition: Payment declined by gateway.
          action: System displays payment error and asks to retry or choose another method.
        - step: 8
          condition: Order confirmation arrives late
          action: Monitor oldest intent age and prioritize confirmation intents; alert Orders operations on
            latency breach.
          operation: orders.CMD045
        - step: 8
          condition: Committed order has no delivered confirmation
          action: Atomic outbox, bounded retries, dead-letter alerting and minute-by-minute order-to-receipt
            reconciliation retain unresolved work.
          operation: orders.CMD045
        - step: 8
          condition: Confirmation is sent twice
          action: Unique durable effect key, consumer deduplication and provider idempotency or acceptance
            lookup prevent blind resends after ambiguous outcomes.
          operation: orders.CMD045
      old_value:
        - *a2
        - *a3
    - kind: set
      entity_type: process
      target: orders.PRC001
      property: activities
      value:
        - id: orders.PA013
          name: Check cart for order creation
          description: Apply the entry path's cart checks; storefront checks include product availability and
            enabled countries.
          entry_operation: orders.QRY010
          gateway: xor
          next:
            - to: orders.PA014
              condition: The storefront checks pass and the shopper is placing the order.
            - to: orders.PA015
              condition: A back-office employee is preparing the order.
          _next:
            - to: orders.PA014
              condition: The storefront checks pass and the shopper is placing the order.
              origin: stated
            - to: orders.PA015
              condition: A back-office employee is preparing the order.
              origin: stated
        - id: orders.PA014
          name: Review and confirm checkout
          description: The shopper reviews the summary and confirms the storefront order.
          entry_operation: orders.QRY011
          next:
            - to: orders.PA001
          _next:
            - to: orders.PA001
              origin: stated
        - id: orders.PA015
          name: Review back-office cart
          description: The employee loads the cart's totals, addresses and carrier for order creation.
          entry_operation: checkout.QRY002
          next:
            - to: orders.PA001
          _next:
            - to: orders.PA001
              origin: stated
        - id: orders.PA001
          name: Create orders
          description: Validate the submitted cart and write one order per package, with stock and payment effects.
          entry_operation: orders.CMD001
          join:
            mode: xor
          steps:
            - operation_ref: orders.CMD001
              note: Synchronously validate veto hooks, payment, stock and order invariants; stage order writes.
            - operation_ref: orders.EVT001
              note: actionValidateOrder fires once the orders are written.
            - operation_ref: orders.CMD041
              note: Record intents in the same transaction as the order; rollback both on failure.
            - operation_ref: orders.EVT012
              note: Commit durable work, then return request success.
            - operation_ref: orders.CMD042
              note: Worker drains after the request; mail accepted asynchronously.
            - operation_ref: orders.CMD043
              note: Render the already issued invoice PDF after the request.
            - operation_ref: orders.CMD044
              note: Run only explicitly eligible notification hooks after the request.
            - operation_ref: orders.CMD045
              note: Retry, dead-letter and reconcile unresolved work with original keys.
          next:
            - to: orders.PA016
              condition: Order creation succeeded and the module named an initial state.
          _next:
            - to: orders.PA016
              condition: Order creation succeeded and the module named an initial state.
              origin: stated
        - id: orders.PA016
          name: Apply the initial order state
          description: Apply the module's state, replaced by Payment error when a validated payment amount
            differs from the cart total.
          entry_operation: orders.CMD004
          steps:
            - operation_ref: orders.CMD004
              note: Apply the initial state, including Payment error on the documented amount mismatch.
            - operation_ref: orders.EVT005
              note: Publish the state transition.
      old_value:
        - id: orders.PA013
          name: Check cart for order creation
          description: Apply the entry path's cart checks; storefront checks include product availability and
            enabled countries.
          entry_operation: orders.QRY010
          gateway: xor
          next:
            - to: orders.PA014
              condition: The storefront checks pass and the shopper is placing the order.
            - to: orders.PA015
              condition: A back-office employee is preparing the order.
          _next:
            - to: orders.PA014
              condition: The storefront checks pass and the shopper is placing the order.
              origin: stated
            - to: orders.PA015
              condition: A back-office employee is preparing the order.
              origin: stated
        - id: orders.PA014
          name: Review and confirm checkout
          description: The shopper reviews the summary and confirms the storefront order.
          entry_operation: orders.QRY011
          next:
            - to: orders.PA001
          _next:
            - to: orders.PA001
              origin: stated
        - id: orders.PA015
          name: Review back-office cart
          description: The employee loads the cart's totals, addresses and carrier for order creation.
          entry_operation: checkout.QRY002
          next:
            - to: orders.PA001
          _next:
            - to: orders.PA001
              origin: stated
        - id: orders.PA001
          name: Create orders
          description: Validate the submitted cart and write one order per package, with stock and payment effects.
          entry_operation: orders.CMD001
          join:
            mode: xor
          steps:
            - operation_ref: orders.CMD001
              note: Refuse an already ordered cart or inactive module; otherwise write orders, decrease stock and
                record payment for a validated status.
            - operation_ref: orders.EVT001
              note: actionValidateOrder fires once the orders are written.
          next:
            - to: orders.PA016
              condition: Order creation succeeded and the module named an initial state.
          _next:
            - to: orders.PA016
              condition: Order creation succeeded and the module named an initial state.
              origin: stated
        - id: orders.PA016
          name: Apply the initial order state
          description: Apply the module's state, replaced by Payment error when a validated payment amount
            differs from the cart total.
          entry_operation: orders.CMD004
          steps:
            - operation_ref: orders.CMD004
              note: Apply the initial state, including Payment error on the documented amount mismatch.
            - operation_ref: orders.EVT005
              note: Publish the state transition.
