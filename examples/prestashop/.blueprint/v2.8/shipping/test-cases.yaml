---
version: "1.1.0"
scope: shipping

happy_path:
  - id: shipping.TC001
    name: "Create carrier with zones and ranges - happy path"
    summary: "Create a new carrier with valid configuration including zones, ranges, and shipping method."
    validates:
      operations: [shipping.CMD001, shipping.EVT001]
      rules: [shipping.SR001, shipping.VR002]
    contract:
      kind: openapi
      file: shipping-api
    given:
      description: "Zone 1 (Europe) exists. Shipping method is by_weight. One range defined."
      state:
        name: "DHL Express"
        shippingMethod: 1
        zones: [1]
        ranges:
          - zoneId: 1
            from: 0
            to: 10
            price: 5.99
    expected_result:
      status: success
      code: 200
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Carrier/carrier_management.feature"
        role: test
        description: "Scenario 'Adding new Carrier' (line 25)."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Carrier/carrier_management.feature line 25"
          date: "2026-09-19"
          summary: >-
            The scenario creates a carrier with its zones, ranges and shipping method and
            asserts the stored configuration, which is this case's assertion.
          confidence_impact: supports

  - id: shipping.TC002
    name: "Toggle carrier free shipping - happy path"
    summary: "Enable free shipping on a carrier, bypassing range-based pricing."
    validates:
      operations: [shipping.CMD007, shipping.EVT005]
      rules: [shipping.VR003]
    given:
      description: "Carrier exists with isFree=false, hasAdditionalHandlingFee=false."
      state:
        carrierId: 3
        isFree: false
        hasAdditionalHandlingFee: false
    expected_result:
      status: success
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Carrier/carrier_management.feature"
        role: test
        description: "Scenario 'Partially editing carrier with free shipping' (line 477). It reaches the same field through EditCarrierCommand, not through the toggle."
      - path: "src/Adapter/Carrier/CommandHandler/ToggleCarrierIsFreeHandler.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Carrier/carrier_management.feature line 477"
          date: "2026-09-19"
          summary: >-
            The scenario's preconditions match this case exactly (isFree false, handling fee
            false) and it asserts free shipping is on afterwards. It exercises
            EditCarrierCommand, so it covers the outcome and not the operation.
          confidence_impact: supports
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            ToggleCarrierIsFreeCommand is real and used by the back-office controller, but no
            Behat scenario and no unit test dispatches it.
          confidence_impact: weakens

  - id: shipping.TC003
    name: "Create shipment for order - happy path"
    summary: "Create a new shipment for an existing order with a valid carrier and product."
    validates:
      operations: [shipping.CMD011, shipping.EVT009]
      rules: [shipping.VR006]
    given:
      description: "Order 1001 exists. Carrier 3 is active. Product 42 is in the order with quantity 2."
      state:
        orderId: 1001
        carrierId: 3
        productId: 42
        quantity: 2
    expected_result:
      status: success
      code: 200
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Shipment/shipment.feature"
        role: test
        description: "Scenario 'Create a new shipment for an order' (line 80)."
      - path: "src/Core/Domain/Shipment/Command/CreateShipment.php"
        role: implementation
        description: "The constructor takes exactly orderId, carrierId, productId and quantity, which is this case's given."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Shipment/shipment.feature line 80"
          date: "2026-09-19"
          summary: >-
            The scenario creates a shipment for an order with a carrier and a product quantity
            and asserts it exists, which is this case's assertion.
          confidence_impact: supports

  - id: shipping.TC004
    name: "Split shipment - happy path"
    summary: "Split a shipment, moving some products to a new shipment with a different carrier."
    validates:
      operations: [shipping.CMD015, shipping.EVT013]
      rules: [shipping.VR007]
    given:
      description: "Shipment 10 has product A (qty 5) and product B (qty 3). Split product A (qty 2) to new shipment with carrier 5."
      state:
        shipmentId: 10
        orderDetailQuantity:
          - orderDetailId: 100
            quantity: 2
        carrierId: 5
    expected_result:
      status: success
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Shipment/products_with_different_carriers.feature"
        role: test
        description: "Scenario 'Order products with different carriers and manage shipments (split, merge, delete)' (line 92)."
      - path: "src/Adapter/Shipment/CommandHandler/SplitShipmentHandler.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Shipment/products_with_different_carriers.feature line 92"
          date: "2026-09-19"
          summary: >-
            The scenario splits a shipment, then merges and deletes, asserting the shipment set
            after each step. The split half is this case's assertion.
          confidence_impact: supports

edge_cases:
  - id: shipping.EC001
    name: "Overlapping ranges rejected"
    summary: "Attempt to set carrier ranges with overlapping brackets within the same zone."
    validates:
      operations: [shipping.CMD008]
      rules: [shipping.VR004]
    given:
      description: "Carrier exists. Two ranges for zone 1: 0-10kg and 5-20kg (overlap at 5-10)."
      state:
        ranges:
          - zoneId: 1
            from: 0
            to: 10
            price: 5.99
          - zoneId: 1
            from: 5
            to: 20
            price: 8.99
    expected_result:
      status: failure
      code: 422
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Carrier/Ranges/carrier_ranges.feature"
        role: test
        description: "Scenario 'Adding overlapping ranges in carrier' (line 66)."
      - path: "src/Core/Domain/Carrier/Exception/CarrierConstraintException.php"
        role: implementation
        description: "INVALID_RANGES_OVERLAPPING."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Carrier/Ranges/carrier_ranges.feature line 66"
          date: "2026-09-19"
          summary: "The scenario submits overlapping ranges and asserts the same error code this case expects."
          confidence_impact: supports

  - id: shipping.EC002
    name: "Splitting a shipment that has already shipped is refused"
    summary: "A shipment with a tracking number cannot be split."
    validates:
      operations: [shipping.CMD015]
    given:
      description: >-
        A shipment that already carries a tracking number, asked to split. Corrected
        2026-09-19: this case asserted that EDITING the tracking number on a shipped shipment
        is refused. EditShipment carries only shipmentId and carrierId - there is no tracking
        number on it, so the edit the case described is not expressible - and
        EditShipmentHandler makes no shipped check at all. The shipped guard is real and lives
        elsewhere: SplitShipmentHandler and MergeProductsToShipmentHandler both raise
        CannotEditShipmentShippedException when the shipment has a tracking number.
      state:
        shipmentId: 15
        trackingNumber: "EXISTING-TRACKING-123"
    expected_result:
      status: failure
      code: 409
    code_refs:
      - path: "src/Adapter/Shipment/CommandHandler/SplitShipmentHandler.php"
        role: implementation
        description: "The tracking-number guard, raising 'Cannot split the shipment because it has already been shipped.'"
      - path: "src/Core/Domain/Shipment/Command/EditShipment.php"
        role: implementation
        description: "Read for the retired claim: shipmentId and carrierId only, no tracking number."
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "src/Adapter/Shipment/CommandHandler/SplitShipmentHandler.php"
          date: "2026-09-19"
          summary: >-
            The guard is there and names the reason: a non-empty tracking number means shipped,
            and a shipped shipment cannot be split.
          confidence_impact: supports
        - kind: codebase-analysis
          source: "src/Adapter/Shipment/CommandHandler/EditShipmentHandler.php"
          date: "2026-09-19"
          summary: >-
            Read in full for the retired claim. Its only refusals are shipment not found,
            carrier not found and a save failure. No shipped or packed check appears in it.
          confidence_impact: invalidates
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: "Modeler-derived from code. No scenario splits a shipped shipment."
          confidence_impact: weakens

error_cases:
  - id: shipping.ER001
    name: "Carrier without zone rejected"
    summary: "Attempt to create a carrier with an empty zone list."
    validates:
      operations: [shipping.CMD001]
      rules: [shipping.SR001]
    given:
      description: "Carrier creation with zones=[] (empty)."
      state:
        name: "Empty Carrier"
        zones: []
    expected_result:
      status: failure
      code: 422
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Carrier/carrier_management.feature"
        role: test
        description: "Scenario 'Add a new carrier without any zone' (line 759)."
      - path: "src/Core/Domain/Carrier/Command/AddCarrierCommand.php"
        role: validation
        description: "assertCarrierHasAtLeastOneZone, raising INVALID_ZONE_MISSING."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Carrier/carrier_management.feature line 759"
          date: "2026-09-19"
          summary: "The scenario creates a carrier with no zone and asserts the same refusal this case expects."
          confidence_impact: supports

  - id: shipping.ER002
    name: "Non-existent shipment"
    summary: "Attempt to edit a shipment that does not exist."
    validates:
      operations: [shipping.CMD012]
    given:
      description: "Shipment ID 99999 does not exist."
      state:
        shipmentId: 99999
    expected_result:
      status: failure
      code: 404
    code_refs:
      - path: "src/Adapter/Shipment/CommandHandler/EditShipmentHandler.php"
        role: implementation
        description: "Two ShipmentNotFoundException throws, one for the shipment and one for its order."
      - path: "tests/Integration/Behaviour/Features/Scenario/Shipment/shipment.feature"
        role: test
        description: "Scenario 'Try to fulfill a non-existing shipment' (line 154) asserts the same exception through Fulfill rather than Edit."
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Shipment/shipment.feature line 154"
          date: "2026-09-19"
          summary: >-
            The scenario asserts ShipmentNotFoundException for an unknown id, but on the
            Fulfill command. It covers the exception through a different door than this case's
            operation.
          confidence_impact: supports
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: "No scenario edits an unknown shipment; the refusal is read from EditShipmentHandler."
          confidence_impact: weakens

  - id: shipping.ER003
    name: "Negative range value rejected"
    summary: "Attempt to set a range with a negative from value."
    validates:
      operations: [shipping.CMD008]
      rules: [shipping.VR005]
    given:
      description: "Range with from=-5 for zone 1."
      state:
        ranges:
          - zoneId: 1
            from: -5
            to: 10
            price: 5.99
    expected_result:
      status: failure
      code: 422
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Carrier/Ranges/carrier_ranges.feature"
        role: test
        description: "Scenario 'Adding negative ranges in carrier' (line 158), which covers a negative from and a negative to."
      - path: "src/Core/Domain/Carrier/Exception/CarrierConstraintException.php"
        role: implementation
        description: "INVALID_RANGE_NEGATIVE."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Carrier/Ranges/carrier_ranges.feature line 158"
          date: "2026-09-19"
          summary: "The scenario submits a negative range bound and asserts the same refusal this case expects."
          confidence_impact: supports
