version: 1.0.0
name: Shipping (PrestaShop)
description: Architecture of the PrestaShop Shipping bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC010
    name: Shipping
    kind: support
    value_stream_ref: VS002
    complexity: integration
    business_model_role: revenue-generator
    evolution: product
    model_traits: [analyser, executor]
    summary: Carrier configuration, shipping cost calculation, shipment tracking.
    owned_by:
      team: TM005
    responsibilities:
      - Carrier CRUD and zone-based shipping rules
      - Shipping cost calculation by weight, price, and zone
      - Shipment creation and tracking number assignment
    dependencies:
      - name: International
        coupling: http
        relationship: customer-supplier
        direction: downstream
        description: Reads zone and country data for carrier shipping rules.
        bounded_context_ref: prestashop.BC006
    services:
      - id: prestashop.SVC010
        name: ShippingService
        kind: api
        summary: REST API for carrier management and shipping cost calculation.
        contracts:
          openapi:
            contract_name: shipping-api
            slice: shipping
            expose:
              - shipping.QRY003
