version: 1.0.0
name: Shipping (PrestaShop)
description: Architecture of the PrestaShop Shipping bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC010
    name: Shipping
    kind: support
    value_stream_ref: VS002
    complexity: integration
    business_model_role: revenue-generator
    evolution: product
    model_traits: [analyser, executor]
    summary: Carrier configuration, shipping cost calculation, shipment tracking.
    owned_by:
      team: TM005
    responsibilities:
      - Carrier CRUD and zone-based shipping rules
      - Shipping cost calculation by weight, price, and zone
      - Shipment creation and tracking number assignment
    dependencies:
      - name: International
        coupling: shareddata
        relationship: customer-supplier
        direction: downstream
        description: >-
          Selects carriers and their prices by International's zones in its own SQL:
          Carrier::getCarriers joins the zone table (classes/Carrier.php:567) and Carrier::getZones
          joins carrier_zone to zone (classes/Carrier.php:866). Customer-supplier because Shipping
          consumes the zone hierarchy and defines no zone.
        bounded_context_ref: prestashop.BC006
    services:
      - id: prestashop.SVC010
        name: ShippingService
        kind: api
        summary: REST API for carrier management and shipping cost calculation.
        contracts:
          openapi:
            contract_name: shipping-api
            slice: shipping
            expose:
              - shipping.QRY003
        implementation: "as-is"
        code_refs:
          - path: src/Core/Domain/Carrier/
            role: implementation
            description: Source for this logical module within the PrestaShop PHP monolith; verified in the cited develop checkout a27e912eef9.
