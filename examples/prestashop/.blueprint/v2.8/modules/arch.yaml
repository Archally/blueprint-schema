version: 1.0.0
name: Modules (PrestaShop)
description: Architecture of the PrestaShop Modules bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC007
    name: Modules
    kind: generic
    value_stream_ref: VS003
    complexity: integration
    business_model_role: engagement-creator
    evolution: custom
    model_traits: [interfacer, coordinator, executor]
    summary: Module lifecycle, hook system, module marketplace integration.
    owned_by:
      team: TM008
    responsibilities:
      - Module install, uninstall, enable, disable, upgrade
      - Hook registration and execution pipeline
      - Module configuration management
    dependencies:
      - name: Admin
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Asks Admin's access control whether an employee may manage a module, in the same process:
          Module::getPermissionStatic calls Access::isGranted with the employee's profile
          (classes/module/Module.php:2808). Module::install also writes the module's permission rows
          into Admin's authorization_role and module_access tables directly
          (classes/module/Module.php:474-482). Customer-supplier because Modules consumes Admin's
          profile model and adds rows to it in Admin's own shape.
        bounded_context_ref: prestashop.BC001
    services:
      - id: prestashop.SVC007
        name: ModuleManager
        kind: service
        summary: Module lifecycle orchestrator with hook execution pipeline.
        contracts:
          inprocess:
            provide:
              - modules.CMD010
              - modules.CMD011
          openapi:
            contract_name: modules-api
            slice: modules
            expose:
              - modules.CMD001
              - modules.CMD002
              - modules.QRY001
