---
version: "1.0.0"
scope: modules

goals:
  - id: modules.GL001
    statement: "Reliable module lifecycle management for store extensibility"
    description: >
      Provide a predictable, safe module lifecycle (install, enable, disable,
      upgrade, reset, uninstall) that allows store administrators to extend
      functionality without risking store stability.
    summary: "Module lifecycle reliability"
    priority: high
    measure: ">= 99% of module install/upgrade operations complete successfully"
    affects:
      operation_refs: [modules.CMD001, modules.CMD002, modules.CMD008]
      concept_refs: [modules.CN001]
      process_refs: [modules.PRC001]
    discovery_stage: validated
    certainty: confirmed

  - id: modules.GL002
    statement: "Safe module upgrade path with version compatibility"
    description: >
      Enable modules to be upgraded to newer versions without breaking existing
      configuration or causing incompatibilities with the PrestaShop core version.
    summary: "Safe module upgrades"
    priority: high
    measure: ">= 95% of module upgrades preserve configuration and functionality"
    affects:
      operation_refs: [modules.CMD006, modules.CMD007]
      concept_refs: [modules.CN001]
      process_refs: [modules.PRC001]
    discovery_stage: validated
    certainty: confirmed

  - id: modules.GL003
    statement: "Hook system provides controllable extension points"
    description: >
      Hooks serve as the primary extension mechanism. The ability to enable/disable
      individual hooks gives administrators granular control over which extension
      points are active.
    summary: "Controllable hooks"
    priority: medium
    measure: "100% of hooks can be independently enabled/disabled"
    affects:
      operation_refs: [modules.CMD009, modules.CMD012, modules.QRY003]
      concept_refs: [modules.CN002]
      process_refs: [modules.PRC002]
    discovery_stage: validated
    certainty: confirmed

risks:
  - id: modules.RSK001
    statement: "Incompatible module breaks storefront after installation or upgrade"
    description: >
      Third-party modules may be incompatible with the current PrestaShop version
      or conflict with other installed modules, causing errors, broken pages, or
      data corruption.
    summary: "Module incompatibility risk"
    likelihood: high
    impact: high
    affects:
      operation_refs: [modules.CMD001, modules.CMD003, modules.CMD007]
      concept_refs: [modules.CN001]
      process_refs: [modules.PRC001]
    mitigation: "Quick disable via UpdateModuleStatus. Reset to clean state. Uninstall with deleteFiles option."
    goal_refs:
      - modules.GL001
    discovery_stage: validated
    certainty: confirmed

  - id: modules.RSK002
    statement: "Security vulnerabilities in third-party modules"
    description: >
      Modules uploaded from external sources may contain security vulnerabilities
      (SQL injection, XSS, remote code execution) that compromise the store.
    summary: "Module security risk"
    likelihood: medium
    impact: high
    affects:
      operation_refs: [modules.CMD002, modules.CMD008]
      concept_refs: [modules.CN001]
      process_refs: [modules.PRC002]
    mitigation: "Upload validation, module marketplace review process, ability to quickly uninstall compromised modules."
    goal_refs:
      - modules.GL001
    discovery_stage: validated
    certainty: confirmed

non_goals:
  - id: modules.NG001
    statement: "No containerized or sandboxed module isolation"
    reason: >
      Modules run in the same PHP process as PrestaShop core. There is no
      sandbox, container, or permission system isolating module code from
      core internals. A rogue module can access any class or database table.
      Isolation would require a fundamentally different extension architecture.
    discovery_stage: committed
    certainty: confirmed

assumptions:
  - id: modules.ASM001
    domain_scope: modules
    statement: "Third-party modules may hook into any public class or method"
    consequence: >
      If the module API is locked down to a defined hook contract only, the
      whole hook-based extensibility model changes, and every existing module
      that reaches into an internal class breaks with it. The scale of that is
      the point: PrestaShop's own site describes the marketplace as offering
      thousands of modules and themes (prestashop.com/en, read 2026-09-19).
      That is a company figure about its own marketplace, not a count taken
      from this repository, and it is cited for the order of magnitude the
      assumption is about rather than as a measurement.
    discovery_stage: committed
    certainty: confirmed

trade_offs:
  - id: modules.TRO001
    choice: "Extension mechanism for module system"
    selected: "Global hook registry with string-based hook names"
    rejected: "Typed event dispatcher with interface contracts"
    rationale: >
      A typed event dispatcher would provide compile-time safety and IDE
      autocompletion, but would break every existing module that registers
      hooks by string name. The hook system is PrestaShop's most fundamental
      extension point - changing it means breaking the entire module ecosystem.
    accepted_risk: "String-based hooks are error-prone (typos, missing hooks). No compile-time verification."
    discovery_stage: committed
    certainty: confirmed

inquiries:
  - id: modules.INQ001
    statement: "Should module-hook position management be modeled as a CQRS operation?"
    summary: "Hook position management gap"
    description: >
      Measured 2026-09-19, after phase 1 modelled the hook domain in full:
      src/Core/Domain/Hook holds three commands and three queries and not one of
      them carries a position. EditHookedModule moves a module from one hook to
      another and sets its exceptions; it does not order it. The position lives
      in the hook_module row and is written by
      CommonController::updatePositionAction, a generic grid endpoint that
      serves every sortable list in the back office. So the gap is confirmed
      rather than closed, and the question is now sharper: is module order
      within a hook a domain decision, or is it presentation, as its shared
      endpoint currently implies.
    category: technical
    affects:
      operation_refs: [modules.CMD013]
      concept_refs: [modules.CN002]
      process_refs: [modules.PRC002]
    goal_refs:
      - modules.GL003
    blocking: false
    status: investigating
    discovery_stage: exploring
    certainty: speculative

  - id: modules.INQ002
    statement: "Should module dependency resolution be formalized in the domain layer?"
    summary: "Module dependency resolution"
    description: >
      Module dependencies (one module requiring another) are resolved during
      installation but the dependency graph is not exposed through CQRS commands
      or queries. Formalizing this could improve install failure diagnostics and
      enable dependency-aware bulk operations.
    category: technical
    affects:
      operation_refs: [modules.CMD001]
      concept_refs: [modules.CN001]
      process_refs: [modules.PRC001]
    goal_refs:
      - modules.GL001
    blocking: false
    status: investigating
    discovery_stage: exploring
    certainty: speculative
