---
version: "1.0.0"
scope: modules

design_references:
  design_system: "PrestaShop UIKit (Bootstrap 4)"
  storybook_url: "https://build.prestashop-project.org/prestashop-ui-kit/"
  accessibility_standard: WCAG-2.1-AA

screens:
  - id: modules.SCR001
    name: "Module Manager"
    summary: "Grid of modules with status indicators, bulk actions, and lifecycle controls (install, enable, disable, upgrade)."
    # The page (ModuleController::manageAction) shows all 10 of ModuleResource's properties.
    uses_models: ["ModuleResource"]
    motivated_by: [modules.GL001]

  - id: modules.SCR002
    name: "Module Upload"
    summary: "Module upload form for importing module packages from file archives."
    # The form posts an archive to ModuleController::importModuleAction, which installs through ModuleManager; UploadModulePayload is the Admin API's shape.
    uses_models: []
    processes: [modules.PRC001]

  - id: modules.SCR003
    name: "Hook Configuration"
    summary: "Hook list with active status toggles. Shows registered modules per hook."
    # The page (PositionsController::indexAction) shows all 5 of HookResource's properties.
    uses_models: ["HookResource"]
    motivated_by: [modules.GL003]

actions:
  - id: modules.UAC001
    screen: modules.SCR001
    name: "Install Module"
    description: "Install a module from the available modules list."
    triggers_operations: [modules.CMD001]

  - id: modules.UAC002
    screen: modules.SCR001
    name: "Toggle Module Status"
    description: "Enable or disable a module."
    triggers_operations: [modules.CMD003]

  - id: modules.UAC003
    screen: modules.SCR002
    name: "Upload Module"
    description: "Upload a module package from a file archive."
    triggers_operations: [modules.CMD008]

  - id: modules.UAC004
    screen: modules.SCR003
    name: "Toggle Hook Status"
    description: "Enable or disable a hook extension point."
    triggers_operations: [modules.CMD009]

  - id: modules.UAC005
    screen: modules.SCR001
    name: "Open the upload dialog"
    description: >
      The module pages' toolbar carries an 'Upload a module' button for an employee allowed to
      add or delete modules. It does not leave the page: the button opens the upload dialog, where
      the archive is chosen and sent.
    implementation: as-is
    code_refs:
      - path: "src/PrestaShopBundle/Controller/Admin/Improve/Modules/ModuleAbstractController.php"
        role: implementation
        description: "getToolbarButtons, lines 69 to 76: the add_module button with href '#', shown only with the create or delete permission."
      - path: "src/PrestaShopBundle/Resources/views/Admin/Module/Includes/modal_import.html.twig"
        role: implementation
        description: "The upload dialog the button opens, titled 'Upload a module' at line 10."
      - path: "admin-dev/themes/new-theme/js/pages/module/controller.js"
        role: implementation
        description: "initAddModuleAction, lines 512 to 520: the toolbar button is turned into the dialog's toggle."

navigation:
  - id: modules.UNV001
    from: modules.SCR001
    to: modules.SCR002
    via_action: modules.UAC005
    condition: "User clicks the 'Upload a module' toolbar button"
    description: "Navigate to module upload form."
