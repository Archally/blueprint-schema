---
version: "1.1.0"
scope: shop

happy_path:
  - id: shop.TC001
    name: "Upload store logos"
    summary: "Uploading valid logo images succeeds and updates store branding."
    given:
      description: "Shop exists with default logos."
      state:
        shopExists: true
    expected_result:
      status: success
    validates:
      rules: [shop.VR001]
      operations: [shop.CMD001, shop.EVT001]
      concepts: [shop.CN001]
    contract:
      kind: openapi
      file: shop-api
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Shop/shop.feature"
        role: test
        description: "Scenario 'Uploading a new Header logo should update the associated configuration keys' (line 10)."
      - path: "src/Core/Domain/Shop/Command/UploadLogosCommand.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Shop/shop.feature line 10"
          date: "2026-09-19"
          summary: >-
            The scenario uploads a logo and asserts the configuration keys move with it. It
            covers the header logo only, where this case speaks of logos in the plural; the
            other three take the same path.
          confidence_impact: supports

