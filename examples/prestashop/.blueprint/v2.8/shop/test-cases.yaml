  - id: shop.TC004
    name: "Rebuild search index"
    summary: "Triggering a full search index rebuild completes successfully."
    given:
      description: "Product catalog has been modified since last index build."
      state:
        catalogModified: true
    expected_result:
      status: success
    validates:
      operations: [shop.CMD014, shop.EVT010]
      concepts: [shop.CN005]
    code_refs:
      - path: "src/Adapter/Search/CommandHandler/SearchIndexationHandler.php"
        role: implementation
        description: "Delegates to Search::indexation and raises SearchIndexationException on a false return."
      - path: "tests/Unit/PrestaShopBundle/Command/SearchIndexationCommandTest.php"
        role: test
        description: "testExecuteWithFullOption (line 40) mocks the bus and asserts the CLI wraps --full into isFull; it never runs the handler."
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Unit/PrestaShopBundle/Command/SearchIndexationCommandTest.php"
          date: "2026-09-19"
          summary: >-
            The test proves the CLI builds the right command object and dispatches it. It
            mocks the bus, so nothing in it rebuilds an index or observes one afterwards.
          confidence_impact: weakens
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            Modeler-derived from code. No Behat scenario dispatches SearchIndexationCommand,
            so the rebuild itself is unexercised.
          confidence_impact: weakens

edge_cases:
  - id: shop.EC001
    name: "A full rebuild empties the search index before refilling it"
    summary: "Search returns nothing for the length of a full rebuild; nothing isolates readers from it."
    given:
      description: >-
        A live store on which a FULL search index rebuild is started. Corrected 2026-09-19:
        this case asserted that a rebuild should not disrupt active customer searches. It does
        disrupt them. Search::indexation with the full flag TRUNCATEs ps_search_index and
        ps_search_word and then repopulates, and SearchIndexationHandler holds no lock, no
        queue and no read isolation, so a shopper searching during the window gets an empty
        result. An incremental rebuild, the default, does not truncate.
      state:
        storeIsLive: true
        isFull: true
    expected_result:
      status: success
    note: >-
      The expected result is success because the rebuild succeeds. What the case records is
      its cost, which is the kind of fact an operator needs before scheduling one.
    validates:
      operations: [shop.CMD014]
      concepts: [shop.CN005]
    code_refs:
      - path: "classes/Search.php"
        role: implementation
        description: "indexation(), whose full branch truncates ps_search_index and ps_search_word before repopulating."
      - path: "src/Adapter/Search/CommandHandler/SearchIndexationHandler.php"
        role: implementation
        description: "Read for the retired claim: no lock, no queue, no read isolation of any kind."
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "classes/Search.php indexation()"
          date: "2026-09-19"
          summary: >-
            The truncate is explicit and unconditional inside the full branch. That is the
            mechanism, and it is the opposite of the property this case used to assert.
          confidence_impact: invalidates
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            Modeler-derived from code. Nothing measures the window or searches during it, so
            the duration of the disruption is unknown; only its existence is established.
          confidence_impact: weakens

error_cases:
  - id: shop.ER001
    name: "Upload logo with unsupported extension"
    summary: "Uploading a logo whose extension is outside the allowed list is rejected."
    given:
      description: >-
        A file whose extension is not one of the allowed logo image extensions. The allowed
        set is wider than shop.VR001 says: ShopLogoSettings lists gif, jpg, jpeg, jpe, png,
        webp and svg, so a bmp is refused but a webp and an svg are not.
      state:
        fileExtension: "bmp"
    expected_result:
      status: error
    validates:
      operations: [shop.CMD001]
    code_refs:
      - path: "tests/Unit/Core/Domain/Shop/Command/UploadLogosCommandTest.php"
        role: test
        description: "testSetUploadedHeaderLogoNotValidHeaderLogoImage (line 31), which uploads a file of a refused type and asserts NotSupportedLogoImageExtensionException."
      - path: "src/Core/Domain/Shop/Command/UploadLogosCommand.php"
        role: validation
        description: "assertIsValidLogoImageExtension."
      - path: "src/Core/Domain/Shop/DTO/ShopLogoSettings.php"
        role: implementation
        description: "AVAILABLE_LOGO_IMAGE_EXTENSIONS, the real allowed list."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Unit/Core/Domain/Shop/Command/UploadLogosCommandTest.php"
          date: "2026-09-19"
          summary: >-
            The test asserts the same exception this case expects. Its file is a .php rather
            than a .bmp; the refusal is by the same extension check.
          confidence_impact: supports
        - kind: codebase-analysis
          source: "src/Core/Domain/Shop/DTO/ShopLogoSettings.php"
          date: "2026-09-19"
          summary: >-
            Read to check shop.VR001, which names jpg, gif and png. The constant also carries
            jpeg, jpe, webp and svg. The rule's positive claim is narrower than the code, so
            this case no longer validates it.
          confidence_impact: weakens

  - id: shop.ER002
    name: "Add alias with empty search term"
    summary: "Creating an alias with an empty search term is rejected."
    given:
      description: "User submits an alias with blank search term."
      state:
        searchTerm: ""
    expected_result:
