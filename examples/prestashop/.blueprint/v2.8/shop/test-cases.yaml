    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Search/add_alias.feature line 10"
          date: "2026-09-19"
          summary: >-
            The scenario adds aliases for a search term and asserts they are stored against it,
