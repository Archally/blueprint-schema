      operations: [shop.CMD010]
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Search/add_alias.feature"
        role: test
        description: "Scenario 'I add alias with empty search field' (line 78)."
      - path: "src/Core/Domain/Alias/Command/AddSearchTermAliasesCommand.php"
        role: validation
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Search/add_alias.feature line 78"
          date: "2026-09-19"
          summary: >-
            The scenario submits an alias with an empty search field and asserts the refusal.
            Same assertion.
          confidence_impact: supports
