      endpoint:
        path: /contacts/{contactId}
        method: GET
        group: contact
    name: "GetContactForEditing"
    description: "Read one contact department in full, in the shape the edit form and the Admin API both use. Served at GET /contacts/{contactId}, scope contact_read."
    delivery_priority: should-have
    code_refs:
      - path: "src/Core/Domain/Contact/Query/GetContactForEditing.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Contact/Contact.php"
        role: api-spec
        description: "CQRSGet on /contacts/{contactId} names GetContactForEditing; scope contact_read."

