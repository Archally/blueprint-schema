  # ── Search Index (1 CMD) ──

  rebuildSearchIndex:
    id: shop.CMD014
    kind: command
    dispatch: inprocess
    name: "RebuildSearchIndex"
    description: "Rebuild the product search index, either in full or for one product. It is the operation that makes a catalog change searchable, and a shop that never runs it serves stale search results. No Admin API route serves it; the back-office search settings page and the cron task dispatch it."
    delivery_priority: must-have
    task_type: automated
    initiated_by: [shop.ACT001]
    materializes:
      - concept: shop.CN005
        action: update
    produces:
      operations: [shop.EVT010]
      mode: all
    reacts_to:
      - operation: catalog.EVT001
        policy: "A new product is made searchable as soon as it exists"
        condition: "PS_SEARCH_INDEXATION is on"
      - operation: catalog.EVT002
        policy: "A changed product is reindexed so search stops returning its old words"
        condition: "PS_SEARCH_INDEXATION is on, and on the CQRS route only when a field the index reads actually changed"
    code_refs:
      - path: "src/Core/Domain/Search/Command/SearchIndexationCommand.php"
        role: implementation
      - path: "classes/Product.php"
        role: implementation
        description: "addWs() calls Search::indexation for the product at line 7589 and updateWs() at line 7612, both after the ObjectModel hook has fired and both guarded by PS_SEARCH_INDEXATION. Neither dispatches SearchIndexationCommand; they call the same Search::indexation the command's handler calls."
      - path: "src/Adapter/Product/Update/ProductIndexationUpdater.php"
        role: implementation
        description: "The CQRS route reindexes at line 142, inside the product update rather than after it, and only when one of the fields the index reads has changed - the reason UpdateProductHandler gives at line 107 is that reindexing is costly."

  searchIndexRebuilt:
    id: shop.EVT010
    kind: event
    name: "SearchIndexRebuilt"
    description: >-
      The product search index has been rebuilt, so storefront search results reflect the current
      catalog. Restated 2026-09-14 rather than regrounded: no hook is fired for this transition,
      so modules cannot observe it. The index is a table the indexer writes directly, not an
      ObjectModel row, so the dynamic family does not reach it either. This one matters more than
      most silences - a full reindex is the slowest routine operation in the back office, and a
      module that maintains its own search data has no signal to rebuild alongside it.
    code_refs:
      - path: "src/Adapter/Search/CommandHandler/SearchIndexationHandler.php"
        role: implementation
        description: "Delegates to the legacy Search indexation routine. Searched for Hook::exec and dispatchWithParameters on 2026-09-19: none."
      - path: "classes/Search.php"
        role: implementation
        description: "Holds the indexation routine and contains no Hook::exec at all (measured 2026-09-19: zero occurrences)."

  # ── Contact (2 CMD + 1 QRY) ──

