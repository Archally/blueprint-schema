        schema: ContactResource
        contentType: application/json
    name: "EditContact"
    description: "Change a 'Contact Us' department: its localized names, its email address, its localized descriptions, whether messages to it are kept in customer service, and which shops it belongs to. Served as a PATCH, so a caller sends only what it changes. The path and method were /shop/contacts/{contactId} and PUT in this model; the route is PATCH /contacts/{contactId} and the resource declares CQRSPartialUpdate."
    delivery_priority: should-have
