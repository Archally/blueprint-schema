    description: "A search term or one of its aliases failed its constraint: an empty string, an alias list with no entries, or a term longer than the column holds."
    category: validation
    severity: error
    http_status: 422
    code_refs:
      - path: "src/Core/Domain/Alias/Exception/AliasConstraintException.php"
        role: implementation

questions:

  - id: shop.QN001
    name: "What A Search Returns"
    statement: "Which products does this search term return, and which term was it rewritten from?"
    category: behavioral
    priority: critical
    bounded_context_ref: prestashop.BC011
    answered_by: [shop.QRY007, shop.QRY006, shop.CMD014]
    concepts: [shop.CN004, shop.CN005]
    resolved: true
    resolution: >
      SearchForSearchTerm reads the search index, whose freshness depends on
      RebuildSearchIndex having run since the catalog last changed; GetAliasesBySearchTerm
      says which alias a misspelled term was resolved through.

  - id: shop.QN002
    name: "Which Shop Serves This Request"
    statement: "Which shop in this installation is serving this request, and what does it look like?"
    category: existence
    priority: high
    bounded_context_ref: prestashop.BC011
    answered_by: [shop.QRY002, shop.QRY001]
    concepts: [shop.CN001]
    resolved: true
    resolution: >
      One installation can carry several shops in a group; SearchShops resolves which one a
      URL belongs to, and GetLogosPaths returns the branding that shop is served with.

  - id: shop.QN003
    name: "Where A Shopper Can Walk In"
    statement: "Which physical stores can a shopper visit, and how do they reach us?"
    category: enumeration
    priority: medium
    bounded_context_ref: prestashop.BC011
    answered_by: [shop.QRY003, shop.QRY008]
    concepts: [shop.CN002, shop.CN006]
    resolved: true
    resolution: >
      A Store carries its address, opening hours and coordinates for the store locator; a
      Contact is the department a message form is routed to, which is the other half of how
      a shopper reaches the merchant.
