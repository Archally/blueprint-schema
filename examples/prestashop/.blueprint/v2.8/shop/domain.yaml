    name: "CannotToggleStoreStatus"
    description: "The store's visibility flag could not be written. Its error code says whether one store or a batch was being switched, which is how the back-office grid tells the operator which rows are still in their old state."
    category: internal
    severity: error
    http_status: 422
    code_refs:
      - path: "src/Core/Domain/Store/Exception/CannotToggleStoreStatusException.php"
        role: implementation

  contactNotFound:
    id: shop.ERR007
    name: "ContactNotFound"
    description: "No 'Contact Us' department exists with the given id. Mapped to 404 by the Contact routes in the Admin API."
    category: not-found
    severity: error
    http_status: 404
    code_refs:
      - path: "src/Core/Domain/Contact/Exception/ContactNotFoundException.php"
        role: implementation

  contactConstraintViolation:
    id: shop.ERR008
    name: "ContactConstraintViolation"
    description: "A contact department field failed its constraint: a name outside the catalog-name pattern, a missing name in the shop's default language, or an address the strict email check rejects."
    category: validation
    severity: error
    http_status: 422
    code_refs:
      - path: "src/Core/Domain/Contact/Exception/ContactConstraintException.php"
        role: implementation

  aliasConstraintViolation:
    id: shop.ERR009
