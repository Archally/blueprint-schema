    category: validation
    severity: error
    http_status: 422
    related_rules: [shop.VR001]

  searchEngineNotFound:
    id: shop.ERR002
    name: "SearchEngineNotFound"
    description: "The specified search engine ID does not exist."
    category: not-found
    severity: error
    http_status: 404

  aliasNotFound:
    id: shop.ERR003
    name: "AliasNotFound"
    description: "The specified alias ID does not exist."
    category: not-found
    severity: error
    http_status: 404

  storeNotFound:
    id: shop.ERR004
    name: "StoreNotFound"
    description: "No physical store location exists with the given id. Raised by the store repository's getObjectModel guard, and mapped to 404 by every Store route in the Admin API."
    category: not-found
