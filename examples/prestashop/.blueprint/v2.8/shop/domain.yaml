      - path: "src/Adapter/Contact/CommandHandler/EditContactHandler.php"
        role: implementation
        description: "Loads the Contact ObjectModel and calls update."
      - path: "ps_apiresources/src/ApiPlatform/Resources/Contact/Contact.php"
        role: api-spec
        description: "CQRSPartialUpdate on /contacts/{contactId} names EditContactCommand; scope contact_write."

  contactEdited:
    id: shop.EVT012
    kind: event
