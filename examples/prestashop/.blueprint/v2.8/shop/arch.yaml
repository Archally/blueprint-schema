version: 1.0.0
name: Shop (PrestaShop)
description: Architecture of the PrestaShop Shop bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC011
    name: Shop
    kind: generic
    value_stream_ref: VS003
    complexity: crud
    business_model_role: engagement-creator
    evolution: commodity
    model_traits: [information-holder, service-provider]
    summary: Multi-store configuration, physical stores, contacts, search, aliases.
    owned_by:
      team: TM010
    responsibilities:
      - Multi-store (shop group/shop) configuration
      - Physical store listing for store locator
      - Contact form and department management
      - Search alias and engine configuration
      - Showcase card and notification management
    dependencies:
      - name: International
        coupling: shareddata
        relationship: shared-kernel
        direction: peer
        description: >-
          Shop and International write and read the same store-association tables:
          Shop::copyShopData copies lang_shop, currency_shop and country_shop rows when a store is
          created (classes/shop/Shop.php:1259, tables listed at classes/shop/Shop.php:153-160), and
          International's own reads join them, as Language::loadLanguages does with lang_shop
          (classes/Language.php:1048). Shared-kernel because both contexts depend on those tables
          and neither owns them alone.
        bounded_context_ref: prestashop.BC006
    services:
      - id: prestashop.SVC011
        name: ShopService
        kind: api
        summary: REST API for multi-store and shop configuration.
        needs:
          - { type_ref: RT001, class: self-hosted, id: prestashop-db }
          - { type_ref: RT004, class: self-hosted, id: prestashop-cache }
        contracts:
          shareddata:
            contract_name: shop-context
            slice: shop
            write:
              - shop.DOC001
          openapi:
            contract_name: shop-api
            slice: shop
            expose:
              - shop.QRY003
              - shop.CMD016
        implementation: "as-is"
        code_refs:
          - path: src/Core/Domain/Shop/
            role: implementation
            description: Source for this logical module within the PrestaShop PHP monolith; verified in the cited develop checkout a27e912eef9.
