---
version: "1.0.0"
scope: shop

goals:
  - id: shop.GL001
    statement: "Consistent store branding across all customer touchpoints"
    description: >
      Logo and favicon management ensures the store has a unified visual
      identity across storefront header, email templates, invoices, and
      browser tabs.
    summary: "Store branding consistency"
    priority: medium
    measure: "Every surface that renders a logo resolves it from the shop's configured logo set"
    affects:
      operation_refs: [shop.CMD001, shop.QRY001]
      concept_refs: [shop.CN001]
      process_refs: [shop.PRC001]
    discovery_stage: validated
    certainty: confirmed

  - id: shop.GL002
    statement: "Improved product discoverability through search aliases"
    description: >
      Search term aliases bridge the gap between customer vocabulary and
      product catalog terminology, improving search hit rates.
    summary: "Search alias discoverability"
    priority: high
    measure: "At least 80% of the top 100 customer search terms resolve through a configured alias"
    affects:
      operation_refs: [shop.CMD010, shop.CMD011, shop.CMD014, shop.QRY007]
      concept_refs: [shop.CN004, shop.CN005]
      process_refs: [shop.PRC002]
    discovery_stage: validated
    certainty: confirmed

  - id: shop.GL003
    statement: "SEO referrer tracking for marketing analytics"
    description: >
      SearchEngine configuration enables tracking which external search
      engines drive traffic to the store, informing SEO strategy.
    summary: "SEO referrer analytics"
    priority: medium
    measure: "Every search engine the store wants to attribute has a SearchEngine row naming its host and query-string key"
    affects:
      operation_refs: [shop.CMD006, shop.CMD007]
      concept_refs: [shop.CN003]
    discovery_stage: validated
    certainty: confirmed

risks:
  - id: shop.RSK001
    statement: "Search index staleness after catalog changes"
    description: >
      If the search index is not rebuilt after significant catalog changes
      (new products, price updates), customers may see outdated or missing
      search results.
    summary: "Stale search index"
    likelihood: medium
    impact: high
    goal_refs:
      - shop.GL002
    affects:
      operation_refs: [shop.CMD014]
      concept_refs: [shop.CN005]
      process_refs: [shop.PRC002]
    mitigation: "SearchIndexation command can be triggered manually or scheduled. Monitor index age."
    discovery_stage: validated
    certainty: confirmed

  - id: shop.RSK002
    statement: "Multi-store configuration gaps outside CQRS layer"
    description: >
      Core multi-store operations (shop creation, domain/SSL config,
      maintenance mode) are not in the CQRS domain layer. Store aggregate
      lacks add/edit commands. This makes the domain model incomplete for
      multi-store governance.
    summary: "Multi-store CQRS gaps"
    likelihood: high
    impact: medium
    goal_refs:
      - shop.GL001
    affects:
      operation_refs: [shop.CMD001, shop.QRY002]
      concept_refs: [shop.CN001, shop.CN002]
      process_refs: [shop.PRC001]
    mitigation: "Document gaps as inquiries. Plan CQRS migration for critical multi-store operations."
    discovery_stage: validated
    certainty: confirmed

non_goals:
  - id: shop.NG001
    statement: "No marketplace/multi-vendor capabilities"
    reason: >
      PrestaShop is a single-merchant platform. Multi-store shares one merchant
      identity across storefronts. Marketplace features (vendor onboarding,
      per-vendor commission, vendor dashboards) require dedicated marketplace
      modules - there are no VendorCommand or SellerCommand classes in core.
    discovery_stage: committed
    certainty: confirmed

  - id: shop.NG002
    statement: "The software does not provision or operate the infrastructure it runs on"
    reason: >
      PrestaShop Classic is software a merchant installs on hosting they arrange
      themselves. Nothing in core provisions a server, registers a domain,
      issues a certificate, schedules a backup or runs the cron the exchange
      rate refresh and the search reindex both need - which is why several
      risks in this model end at "the merchant must schedule it". The vendor
      sells the managed alternative as a separate edition, PrestaShop Hosted
      (prestashop.com/en, read 2026-09-19; a company statement about its own
      product line, not a fact measured here), and that separation is the
      reason the software itself does not need to do any of it.
    discovery_stage: committed
    certainty: confirmed

assumptions:
  - id: shop.ASM001
    domain_scope: shop
    statement: "MySQL/MariaDB is the only supported RDBMS"
    consequence: >
      If PostgreSQL or SQLite support is required, every piece of ObjectModel
      raw SQL, the Doctrine DBAL queries and the database-specific constructs
      (IFNULL, GROUP_CONCAT, INSERT IGNORE) have to be abstracted or ported.
      What makes that expensive rather than merely large is the installed base
      it would have to migrate: PrestaShop says more than 250,000 merchants are
      on the platform (prestashop.com/en, read 2026-09-19), a company figure
      about its own adoption rather than anything measured here.
    discovery_stage: committed
    certainty: confirmed

trade_offs:
  - id: shop.TRO001
    choice: "Multi-store data isolation model"
    selected: "Shared database with shop_id column filtering"
    rejected: "Separate database per shop (simpler isolation but harder shared catalog)"
    rationale: >
      Shared catalog across shops is a core multi-store feature - merchants
      want one product in multiple shops. Separate databases would require
      cross-database joins or catalog sync, adding massive complexity.
      Shop_id filtering keeps data co-located and queryable.
    accepted_risk: "Poorly scoped queries can leak data across shops. Every query must include shop_id filter."
    discovery_stage: committed
    certainty: confirmed

inquiries:
  - id: shop.INQ001
    statement: "Should multi-store configuration (maintenance mode, domain, SSL) be migrated to the CQRS domain layer?"
    summary: "Multi-store CQRS gap"
    description: >
      Measured 2026-09-19: src/Core/Domain/Shop holds one command,
      UploadLogos, and two queries, GetLogosPaths and SearchShops. Maintenance
      mode, the domain and SSL settings, and shop creation and deletion are all
      legacy code with no command behind them, so a multi-store estate cannot
      be governed through the domain layer or reached over the Admin API at
      all. Phase 1 modelled what exists and did not answer this.
    category: technical
    affects:
      operation_refs: [shop.CMD001]
      concept_refs: [shop.CN001]
      process_refs: [shop.PRC001]
    goal_refs:
      - shop.GL001
    blocking: false
    status: investigating
    discovery_stage: exploring
    certainty: speculative

  - id: shop.INQ002
    statement: "Should Store creation and editing be added to the CQRS domain layer?"
    summary: "Store CRUD gap"
    description: >
      Measured 2026-09-19: src/Core/Domain/Store/Command holds exactly four
      classes - DeleteStore, ToggleStoreStatus, BulkDeleteStore and
      BulkUpdateStoreStatus - so a store can be removed or switched off but
      never created or edited through the domain layer. The same wall shows
      from the other side: the model's CreateStorePayload binds to no
      operation because there is no create-store command to bind it to.
    category: technical
    affects:
      operation_refs: [shop.CMD002, shop.QRY003]
      concept_refs: [shop.CN002]
    blocking: false
    status: investigating
    discovery_stage: exploring
    certainty: speculative
