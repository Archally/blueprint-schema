---
version: "1.0.0"
scope: shop
tags: [shop, models]

components:
  schemas:
    UploadLogosPayload:
      x-model-id: MDL900
      purpose: command-payload
      description: "Request body for uploading store branding images. Each file type has extension validation - logos accept jpg/gif/png, favicon accepts ico only."
      represents:
        - concept: shop.CN001
          kind: api
          mapping:
            strategy: property-map
            property_map:
              headerLogo: CAT901
              mailLogo: CAT903
              invoiceLogo: CAT902
              favicon: CAT904
      type: object
      properties:
        headerLogo:
          type: string
          format: binary
          description: "Header logo image file (jpg/gif/png)."
          example: "logo-header.png"
        mailLogo:
          type: string
          format: binary
          description: "Email template logo image file (jpg/gif/png)."
          example: "logo-mail.png"
        invoiceLogo:
          type: string
          format: binary
          description: "Invoice logo image file (jpg/gif/png)."
          example: "logo-invoice.jpg"
        favicon:
          type: string
          format: binary
          description: "Favicon file (ico only)."
          example: "favicon.ico"
      code_refs:
        - path: "src/Core/Domain/Shop/Command/UploadLogosCommand.php"
          role: schema

    ShopResource:
      x-model-id: MDL901
      purpose: read-model
      description: "Shop details for multi-store management. Represents a single storefront instance in PrestaShop's multi-store architecture."
      represents:
        - concept: shop.CN001
          kind: api
          mapping:
            strategy: property-map
            property_map:
              name: CAT900
      type: object
      properties:
        shopId:
          type: integer
          description: "Unique shop identifier."
          example: 1
        name:
          type: string
          description: "Shop display name."
          example: "My Store"
        domain:
          type: string
          description: "Shop domain for HTTP access."
          example: "www.mystore.com"
        sslDomain:
          type: string
          description: "Shop domain for HTTPS access."
          example: "www.mystore.com"
        physicalUri:
          type: string
          description: "Physical URI path on the server."
          example: "/"
        virtualUri:
          type: string
          description: "Optional path segment that distinguishes this shop from others on the same domain and physical path, used only when URL rewriting is on. Stored normalised with no leading slash and a trailing one. The empty string is the common case and the default shop's value; the example shows the populated shape, which is the one a reader cannot guess."
          example: "outlet/"
        active:
          type: boolean
          description: "Whether the shop is currently active."
          example: true
      code_refs:
        - path: "src/Core/Domain/Shop/Query/SearchShops.php"
          role: schema
          description: "SearchShops query result - shop data for multi-store selection"

    CreateStorePayload:
      x-model-id: MDL902
      purpose: command-payload
      description: >-
        The shape a physical store location is created in: localized names, address, coordinates,
        phone and weekly opening hours. NO OPERATION CARRIES IT, and that is the fact rather than a
        gap in the model. Core/Domain/Store declares four commands - delete, toggle status, bulk
        delete, bulk update status - and no create; the Admin API's Store resource declares get,
        delete, toggle and the two bulk routes, and no POST /stores. A store is created by the
        legacy AdminStoresController writing the Store ObjectModel directly, outside CQRS. The model
        is kept because it says what that legacy write carries, and because the day the create
        command arrives this is the payload it takes.
      represents:
        - concept: shop.CN002
          kind: api
          mapping:
            strategy: property-map
            property_map:
              localizedNames: CAT905
              active: CAT906
      type: object
      required: [localizedNames, countryId, active]
      properties:
        localizedNames:
          type: object
          description: "Store name per language ID."
          additionalProperties:
            type: string
          example:
            "1": "Downtown Store"
            "2": "Magasin Centre-Ville"
        address:
          type: string
          description: "Street address of the physical store."
          example: "15 Rue de la Paix"
        city:
          type: string
          description: "City where the store is located."
          example: "Paris"
        postCode:
          type: string
          description: "Postal/ZIP code."
          example: "75001"
        countryId:
          type: integer
          description: "Which country the store is in, as a ps_country row id. It is required and validated as an unsigned id, and it is what the storefront locator groups and filters stores by."
          example: 8
        latitude:
          type: string
          description: "Geographic latitude (decimal degrees)."
          example: "48.868610"
        longitude:
          type: string
          description: "Geographic longitude (decimal degrees)."
          example: "2.332030"
        phone:
          type: string
          description: "Store phone number."
          example: "+33 1 23 45 67 89"
        hours:
          type: array
          description: "Operating hours per day of the week (index 0 = Monday)."
          items:
            type: string
          example: ["09:00-19:00", "09:00-19:00", "09:00-19:00", "09:00-19:00", "09:00-20:00", "10:00-18:00", ""]
        active:
          type: boolean
          description: "Whether the store is visible on the storefront."
          example: true
      code_refs:
        - path: "src/Core/Domain/Store/Command/"
          role: schema
          description: "Holds four commands and no create, which is why no operation binds this model."
        - path: "controllers/admin/AdminStoresController.php"
          role: implementation
          description: "The legacy controller that creates and edits a store, writing the ObjectModel without a command."

    StoreResource:
      x-model-id: MDL903
      purpose: read-model
      description: "Physical store location details for the back-office edit form."
      represents:
        - concept: shop.CN002
          kind: api
          mapping:
            strategy: property-map
            property_map:
              localizedNames: CAT905
              active: CAT906
      type: object
      properties:
        storeId:
          type: integer
          description: "Unique store identifier."
          example: 1
        localizedNames:
          type: object
          description: "Store name per language ID."
          additionalProperties:
            type: string
          example:
            "1": "Downtown Store"
            "2": "Magasin Centre-Ville"
        address:
          type: string
          description: "Street address."
          example: "15 Rue de la Paix"
        city:
          type: string
          description: "Town the store stands in. It is a free-text field on the store row, not a reference to a geography table, so two stores in one town can spell it differently and the locator will list both spellings."
          example: "Paris"
        postCode:
          type: string
          description: "Postal/ZIP code."
          example: "75001"
        countryId:
          type: integer
          description: "Which country the store is in, as a ps_country row id. It is required and validated as an unsigned id, and it is what the storefront locator groups and filters stores by."
          example: 8
        countryName:
          type: string
          description: "Country display name."
          example: "France"
        latitude:
          type: string
          description: "Geographic latitude."
          example: "48.868610"
        longitude:
          type: string
          description: "Geographic longitude."
          example: "2.332030"
        phone:
          type: string
          description: "Store phone number."
          example: "+33 1 23 45 67 89"
        hours:
          type: array
          description: "Operating hours per day of the week."
          items:
            type: string
          example: ["09:00-19:00", "09:00-19:00", "09:00-19:00", "09:00-19:00", "09:00-20:00", "10:00-18:00", ""]
        active:
          type: boolean
          description: "Whether the store is currently active."
          example: true
      code_refs:
        - path: "src/Core/Domain/Store/Query/GetStoreForEditing.php"
          role: schema
          description: "GetStoreForEditing query result - populates the store edit form"

    CreateSearchEnginePayload:
      x-model-id: MDL904
      purpose: command-payload
      description: "Request body for registering a new SEO referrer search engine for analytics tracking."
      represents:
        - concept: shop.CN003
          kind: api
          mapping:
            strategy: property-map
            property_map:
              server: CAT907
              queryKey: CAT908
      type: object
      required: [server, queryKey]
      properties:
        server:
          type: string
          description: "Search engine server hostname."
          example: "google"
        queryKey:
          type: string
          description: "URL query parameter used for search terms."
          example: "q"
      code_refs:
        - path: "src/Core/Domain/SearchEngine/Command/AddSearchEngineCommand.php"
          role: schema

    SearchEngineResource:
      x-model-id: MDL905
      purpose: read-model
      description: "SEO referrer search engine details for the back-office edit form."
      represents:
        - concept: shop.CN003
          kind: api
          mapping:
            strategy: property-map
            property_map:
              server: CAT907
              queryKey: CAT908
      type: object
      properties:
        searchEngineId:
          type: integer
          description: "Unique search engine identifier."
          example: 1
        server:
          type: string
          description: "Search engine server hostname."
          example: "google"
        queryKey:
          type: string
          description: "URL query parameter for search terms."
          example: "q"
      code_refs:
        - path: "src/Core/Domain/SearchEngine/Query/GetSearchEngineForEditing.php"
          role: schema
          description: "GetSearchEngineForEditing query result - populates the search engine edit form"

    SearchAliasWritePayload:
      x-model-id: MDL906
      purpose: command-payload
      description: >-
        Request body for both alias writes: POST /search-aliases and PUT
        /search-aliases/{searchTerm}. The unit is a search term together with its whole alias
        list, never a single alias, because PrestaShop stores no alias identity a route could
        address. Renamed from CreateAliasPayload on 2026-09-19: it was never create-only, and its
        three scalar properties described a shape neither the command nor the route has.
      represents:
        - concept: shop.CN004
          kind: api
          mapping:
            strategy: property-map
            property_map:
              searchTerm: CAT909
              aliases: CAT910
      type: object
      required: [searchTerm, aliases]
      properties:
        searchTerm:
          type: string
          description: >-
            The word a shopper types. It is the resource identifier, so on the PUT it arrives in
            the URI and the resource maps it to the command's oldSearchTerm - which is why a
            rename needs newSearchTerm alongside it rather than simply sending a different value
            here.
          example: "tshirt"
        aliases:
          type: array
          description: >-
            The terms the catalog should also search for, at least one. Sending the list replaces
            the stored one entirely: the update handler deletes every alias of the term and adds
            what was sent, so an omitted alias is a deletion rather than an unchanged row.
          items:
            type: object
            required: [alias]
            properties:
              alias:
                type: string
                description: "A term the catalog actually indexes."
                example: "t-shirt"
              enabled:
                type: boolean
                description: >-
                  Whether this one alias is in use. The wire says enabled and the domain says
                  active; the resource's command mapping translates between them, so a reader
                  comparing the payload with AddSearchTermAliasesCommand will see two names for
                  one field.
                example: true
          example:
            - alias: "t-shirt"
              enabled: true
            - alias: "tee"
              enabled: true
        newSearchTerm:
          type: string
          description: >-
            Only meaningful on the PUT, where it renames the term itself while keeping the alias
            list sent with it. Omitted on a create, and omitted on an update that is not a rename.
          example: "t-shirt"
      code_refs:
        - path: "src/Core/Domain/Alias/Command/AddSearchTermAliasesCommand.php"
          role: schema
          description: "Takes (array aliases, string searchTerm); each alias entry is {alias: string, active: bool}."
        - path: "src/Core/Domain/Alias/Command/UpdateSearchTermAliasesCommand.php"
          role: schema
          description: "The PUT counterpart, which additionally carries the old and new search term."
        - path: "ps_apiresources/src/ApiPlatform/Resources/SearchAlias/SearchAlias.php"
          role: api-spec
          description: "Declares searchTerm, aliases (array of {alias, enabled}) and newSearchTerm, and maps aliases[].enabled to the command's aliases[].active at lines 114-123."

    ContactResource:
      x-model-id: MDL907
      purpose: read-model
      description: "Contact department details for the back-office edit form. Represents a 'Contact Us' form category."
      represents:
        - concept: shop.CN006
          kind: api
          mapping:
            strategy: property-map
            property_map:
              localizedNames: CAT912
              email: CAT913
              localizedDescriptions: CAT914
      type: object
      properties:
        contactId:
          type: integer
          description: "Unique contact department identifier."
          example: 1
        localizedNames:
          type: object
          description: "Contact department name per language ID."
          additionalProperties:
            type: string
          example:
            "1": "Customer Support"
            "2": "Support Client"
        localizedDescriptions:
          type: object
          description: "Contact department description per language ID."
          additionalProperties:
            type: string
          example:
            "1": "For any questions about your order"
            "2": "Pour toute question concernant votre commande"
        email:
          type: string
          format: email
          description: "Email address for this contact department."
          example: "support@store.com"
        isMessages:
          type: boolean
          description: "Whether messages sent to this contact are stored in the customer service system."
          example: true
      code_refs:
        - path: "src/Core/Domain/Contact/Query/GetContactForEditing.php"
          role: schema
          description: "GetContactForEditing query result - populates the contact edit form"

    BulkDeleteStoresPayload:
      x-model-id: MDL1805
      purpose: command-payload
      description: "The body DELETE /stores/bulk-delete carries. It is a resource class of its own because the by-id delete takes no body, and ApiPlatform cannot serve both shapes from one."
      represents:
        - concept: shop.CN002
          kind: api
      type: object
      required: [storeIds]
      properties:
        storeIds:
          type: array
          description: "The store locations to remove. The list may not be empty; an empty one is rejected before the handler runs."
          items:
            type: integer
          example: [1, 3]
      code_refs:
        - path: "ps_apiresources/src/ApiPlatform/Resources/Store/BulkDeleteStores.php"
          role: schema
          description: "Declares storeIds with NotBlank."

    BulkUpdateStoreStatusPayload:
      x-model-id: MDL1806
      purpose: command-payload
      description: "The body PUT /stores/bulk-update-status carries: which store locations to switch, and whether the storefront locator should show them."
      represents:
        - concept: shop.CN002
          kind: api
          mapping:
            strategy: property-map
            property_map:
              enabled: CAT906
      type: object
      required: [storeIds, enabled]
      properties:
        storeIds:
          type: array
          description: "The store locations to switch."
          items:
            type: integer
          example: [1, 3]
        enabled:
          type: boolean
          description: "True to show the listed stores on the storefront locator, false to hide them. The resource maps this to the domain's `active`."
          example: true
      code_refs:
        - path: "ps_apiresources/src/ApiPlatform/Resources/Store/BulkUpdateStatusStores.php"
          role: schema
          description: "Declares storeIds with NotBlank, and enabled."

    BulkDeleteSearchEnginesPayload:
      x-model-id: MDL1807
      purpose: command-payload
      description: "The body DELETE /search-engines/bulk-delete carries. Removing a referrer search engine stops PrestaShop attributing future visits to it; the visits already recorded keep their attribution."
      represents:
        - concept: shop.CN003
          kind: api
      type: object
      required: [searchEngineIds]
      properties:
        searchEngineIds:
          type: array
          description: "The referrer search engines to remove. At least one is required."
          items:
            type: integer
          example: [2, 5]
      code_refs:
        - path: "ps_apiresources/src/ApiPlatform/Resources/SearchEngine/BulkDeleteSearchEngines.php"
          role: schema
          description: "Declares searchEngineIds with NotBlank and Count(min: 1)."

    BulkDeleteSearchAliasesPayload:
      x-model-id: MDL1808
      purpose: command-payload
      description: "The body DELETE /search-aliases/bulk-delete carries. It is a list of search TERMS rather than of ids, because a search term is its own key: PrestaShop addresses an alias group by the word a shopper typed, not by a row number."
      represents:
        - concept: shop.CN004
          kind: api
      type: object
      required: [searchTerms]
      properties:
        searchTerms:
          type: array
          description: "The search terms whose aliases are removed, with every alias of each. At least one is required."
          items:
            type: string
          example: ["tshirt", "trainers"]
      code_refs:
        - path: "ps_apiresources/src/ApiPlatform/Resources/SearchAlias/BulkDeleteSearchAliases.php"
          role: schema
          description: "Declares searchTerms as an array of strings with NotBlank and Count(min: 1)."

    SearchAliasResource:
      x-model-id: MDL1809
      purpose: read-model
      description: "One search term with every alias mapped to it, which is the unit the Admin API works in: there is no route that addresses a single alias. `newSearchTerm` is present only on a write, and is how the term itself is renamed without losing its aliases."
      represents:
        - concept: shop.CN004
          kind: api
          mapping:
            strategy: property-map
            property_map:
              searchTerm: CAT909
              aliases: CAT910
      type: object
      properties:
        searchTerm:
          type: string
          description: "The word a shopper types. It is the resource's identifier, so the route is /search-aliases/{searchTerm} rather than an id."
          example: "tshirt"
        aliases:
          type: array
          description: "Every term the search should also look for. Sending this list replaces the stored one entirely: the handler deletes and re-adds, because PrestaShop keeps no alias identity to update in place."
          items:
            type: object
            properties:
              alias:
                type: string
                description: "A term the catalog actually indexes."
                example: "t-shirt"
              enabled:
                type: boolean
                description: "Whether this one alias is currently used. The domain calls the same field `active`."
                example: true
          example:
            - alias: "t-shirt"
              enabled: true
            - alias: "tee"
              enabled: false
        newSearchTerm:
          type: string
          description: "On a write, the term to rename to. Absent means keep the current one, which is why an update that only changes the alias list omits it."
          example: "t shirt"
      code_refs:
        - path: "ps_apiresources/src/ApiPlatform/Resources/SearchAlias/SearchAlias.php"
          role: schema
          description: "Declares searchTerm, aliases and newSearchTerm; QUERY_MAPPING renames the domain's active to enabled."

    CreateContactPayload:
      x-model-id: MDL1810
      purpose: command-payload
      description: "The body POST /contacts and PATCH /contacts/{contactId} carry. The same shape serves both because ApiPlatform validates it in a Create or an Update group rather than with two classes; on the PATCH a caller sends only the fields it changes."
      represents:
        - concept: shop.CN006
          kind: api
          mapping:
            strategy: property-map
            property_map:
              names: CAT912
              email: CAT913
              descriptions: CAT914
      type: object
      required: [names, email]
      properties:
        names:
          type: object
          description: "The department's name per language id, as the shopper sees it in the 'Contact Us' subject list. The shop's default language is required on a create."
          additionalProperties:
            type: string
          example:
            "1": "Customer Support"
            "2": "Support Client"
        email:
          type: string
          format: email
          description: "Where messages to this department are delivered. Checked in strict mode, so an address that merely looks plausible is rejected."
          example: "support@store.com"
        descriptions:
          type: object
          description: "A sentence per language id telling the shopper when to pick this department."
          additionalProperties:
            type: string
          example:
            "1": "For any question about an order you have already placed."
            "2": "Pour toute question sur une commande deja passee."
        messagesSavingEnabled:
          type: boolean
          description: "Whether messages to this department are also stored as customer service threads. False means the mail is sent and nothing is kept, which is the setting a shop picks for a department handled outside PrestaShop."
          example: true
        shopIds:
          type: array
          description: "Which shops of a multi-store installation offer this department."
          items:
            type: integer
          example: [1, 3]
      code_refs:
        - path: "ps_apiresources/src/ApiPlatform/Resources/Contact/Contact.php"
          role: schema
          description: "Declares names, email, descriptions, messagesSavingEnabled and shopIds; CREATE_COMMAND_MAPPING and UPDATE_COMMAND_MAPPING rename them to the command's localisedTitles, localisedDescription and isMessageSavingEnabled."

    ShowcaseCardResource:
      x-model-id: MDL1811
      purpose: read-model
      description: "Whether one employee has dismissed one of the informational cards the back office shows above a page. It is per employee, not per shop: a card one person closed stays open for everyone else. PrestaShop stores it as a Configuration key rather than as a row, which is why nothing observes a dismissal."
      represents:
        - concept: shop.CN008
          kind: api
          mapping:
            strategy: property-map
            property_map:
              showcaseCardName: CAT915
              closed: CAT916
      type: object
      properties:
        showcaseCardName:
          type: string
          description: "Which card, by the name the Configuration key is built from."
          example: "modules_list"
        employeeId:
          type: integer
          description: "The back-office user whose choice this is."
          example: 1
        closed:
          type: boolean
          description: "True once the employee has dismissed the card, which is what stops the page drawing it again."
          example: true
      code_refs:
        - path: "ps_apiresources/src/ApiPlatform/Resources/ShowcaseCard/ShowcaseCard.php"
          role: schema
          description: "Declares showcaseCardName, employeeId and closed."
