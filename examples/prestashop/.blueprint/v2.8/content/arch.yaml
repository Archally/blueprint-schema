version: 1.0.0
name: Content (PrestaShop)
description: Architecture of the PrestaShop Content bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC004
    name: Content
    kind: support
    value_stream_ref: VS003
    complexity: crud
    business_model_role: engagement-creator
    evolution: commodity
    model_traits: [information-holder, executor]
    summary: CMS pages, page categories, themes, email templates, SEO meta.
    owned_by:
      team: TM007
    responsibilities:
      - CMS page and page category management
      - Theme selection and configuration
      - Email template management (mail themes)
      - SEO meta (URL rewriting, page titles, descriptions)
    dependencies:
      - name: International
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Renders mail templates per installed language through International's language
          repository in the same process: GenerateThemeMailTemplatesHandler takes a
          LanguageRepositoryInterface (src/Core/Domain/MailTemplate/CommandHandler/GenerateThemeMailTemplatesHandler.php:48),
          and CMS pages store their text per language id in cms_lang (classes/CMS.php:124).
          Customer-supplier because Content consumes the language list and adds no language.
        bounded_context_ref: prestashop.BC006
    services:
      - id: prestashop.SVC004
        name: ContentService
        kind: api
        summary: REST API for CMS page and theme management.
        needs:
          - { type_ref: RT002, class: self-hosted, id: prestashop-assets }
        contracts:
          openapi:
            contract_name: content-api
            slice: content
            expose:
              - content.CMD001
              - content.CMD002
