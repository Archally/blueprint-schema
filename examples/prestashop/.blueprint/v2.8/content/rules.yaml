---
version: "1.0.0"
scope: content

structural:
  - id: content.SR001
    name: "A CMS category is not moved under itself or one of its descendants"
    description: "Keeps the CMS category tree free of cycles."
    modality: necessary
    concepts: [content.CN002]
    on_violation:
      action: reject
      code: 2
      message: "Unable to move cms category \"%s\" to parent category \"%s\""
    code_refs:
      - path: classes/CMSCategory.php
        role: validation
        description: "Lines 456-479: checkBeforeMove refuses the category itself, walks up from the new parent and refuses when it meets the category; the root (id 1) ends the walk as allowed."
      - path: src/Adapter/CMS/PageCategory/CommandHandler/EditCmsPageCategoryHandler.php
        role: implementation
        description: "Lines 51-54 and 100-105: a new parent is checked before it is set; a refusal raises CANNOT_MOVE_CATEGORY_TO_PARENT."
      - path: src/Core/Domain/CmsPageCategory/Exception/CmsPageCategoryConstraintException.php
        role: implementation
        description: "Line 23: CANNOT_MOVE_CATEGORY_TO_PARENT = 2."
    summary: "The CMS category tree has no cycle."
    logic:
      when: a CMS category's parent is changed
      then: newParent != category AND newParent NOT IN descendants(category)
    fact: "CmsCategory.parent NOT IN ({self} UNION descendants(self))"
    scope: "CMS page category edit, back office"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

validation:
  - id: content.VR001
    name: "A CMS page belongs to an existing CMS category"
    description: "Keeps every CMS page filed under a category that exists."
    modality: obligatory
    concepts: [content.CN001]
    on_violation:
      action: reject
      message: "Cms page category with id \"%s\" not found"
    code_refs:
      - path: src/Adapter/CMS/Page/CommandHandler/AddCmsPageHandler.php
        role: implementation
        description: "Lines 54-58: the category is checked before the page is built."
      - path: src/Adapter/CMS/Page/CommandHandler/AbstractCmsPageHandler.php
        role: validation
        description: "Lines 56-66: assertCmsCategoryExists raises CmsPageCategoryNotFoundException for an unknown id."
      - path: tests/Integration/Behaviour/Features/Scenario/CmsPage/cms_page_management.feature
        role: test
        description: Scenarios 'Adding new CMS page for non existing category should not be allowed' (line 26) and 'Editing CMS page with wrong CMS category id' (45).
    summary: "Every CMS page sits in a CMS category that exists."
    logic:
      when: a CMS page is created, or its category is changed
      then: exists(CmsCategory(page.category))
    fact: "CmsPage.category references an existing CmsCategory"
    scope: "CMS page creation and edit, back office"
    examples:
      - input: A CMS page is added in category 5000, which does not exist
        output: Refused with 'Cms page category with id "5000" not found'
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: content.VR002
    name: "Meta titles and descriptions contain no < > { }"
    description: "Keeps markup and template characters out of the page metadata browsers and search engines read."
    modality: obligatory
    concepts: [content.CN001, content.CN002, content.CN005]
    on_violation:
      action: reject
      message: "Value \"%s\" for language id %s did not passed the regex expression: %s"
    code_refs:
      - path: src/Core/Domain/CmsPageCategory/Command/AbstractCmsPageCategoryCommand.php
        role: validation
        description: "Line 17: GENERIC_NAME_REGEX_PATTERN; the meta title and meta description assertions raise INVALID_META_TITLE (7) and INVALID_META_DESCRIPTION (8)."
      - path: src/Core/Domain/Meta/Command/AbstractMetaCommand.php
        role: validation
        description: "Lines 23-30: a non-empty value must match /^[^<>{}]*$/u."
      - path: src/Core/Domain/Meta/Command/AddMetaCommand.php
        role: implementation
        description: "Lines 73 and 99: the page title raises INVALID_PAGE_TITLE (3) and the meta description INVALID_META_DESCRIPTION (4)."
      - path: classes/CMS.php
        role: model
        description: "Lines 40-42: meta_description, meta_title and head_seo_title validate with isGenericName."
      - path: classes/Validate.php
        role: validation
        description: "Lines 462-465: isGenericName accepts an empty value or one matching /^[^<>{}]*$/u."
      - path: tests/Unit/Core/Domain/CmsPageCategory/Command/AddCmsPageCategoryCommandTest.php
        role: test
        description: "Lines 51 and 63: an incorrect meta title and meta description are refused."
    summary: "No angle or curly brackets in a meta title or meta description."
    logic:
      when: a CMS page, a CMS page category or a meta entry is created or edited
      then: every localized meta title and meta description is empty OR matches /^[^<>{}]*$/u
    fact: "metaTitle, metaDescription matches /^[^<>{}]*$/u OR is empty"
    scope: "CMS page, CMS page category and SEO meta creation and edit"
    examples:
      - input: A CMS page category is added with a meta title containing < or >
        output: Refused with INVALID_META_TITLE
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: content.VR003
    name: "Only the Root CMS Category Cannot Be Deleted"
    description: >-
      The root anchors the CMS tree; any other category
      can go, with everything below it.
    modality: necessary
    concepts: [content.CN002]
    on_violation:
      action: reject
    code_refs:
      - path: "classes/CMSCategory.php"
        role: implementation
        description: "delete(), lines 247-265. Line 249 returns false for id 1; lines 256-262 cascade."
      - path: "src/Adapter/CMS/PageCategory/CommandHandler/DeleteCmsPageCategoryHandler.php"
        role: implementation
        description: Raises CannotDeleteCmsPageCategoryException when the delete returns false, which only the root does.
    summary: "The root CMS category stays; any other delete cascades to its subtree."
    logic:
      when: a CMS page category is deleted
      then: category.id != 1
      else: every descendant category and its CMS pages are deleted with it
    fact: "delete(CmsCategory) requires CmsCategory.id != 1; deletes descendants(CmsCategory) and their pages"
    scope: "CMS page category delete and bulk delete, back office"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: content.VR004
    name: "A shop has one active theme, and only a valid theme is enabled"
    description: "Keeps the storefront rendered by one complete theme."
    modality: obligatory
    concepts: [content.CN003]
    on_violation:
      action: reject
      code: 1
      message: "Themes can be changed only in single shop context"
    code_refs:
      - path: classes/shop/Shop.php
        role: model
        description: "Lines 20 and 63: theme_name, one value per shop."
      - path: src/Core/Domain/Theme/CommandHandler/EnableThemeHandler.php
        role: implementation
        description: "Lines 60-61: refused outside a single shop context; line 78: a failed enable raises CannotEnableThemeException with the validator error."
      - path: src/Core/Addon/Theme/ThemeManager.php
        role: implementation
        description: "Lines 158-160: an invalid theme is not enabled, before the current theme is disabled; line 176: the shop names the new theme."
      - path: src/Core/Addon/Theme/ThemeValidator.php
        role: validation
        description: "Lines 35-55: isValid requires the theme files and properties and records the missing information."
    summary: "One active theme per shop; an invalid theme is not enabled."
    logic:
      when: a theme is enabled
      then: singleShopContext AND hasRequiredFiles(theme) AND hasRequiredProperties(theme)
    fact: "Shop.theme_name is single-valued; enable(Theme) requires isValid(Theme) AND single shop context"
    scope: "theme enable, back office and Admin API"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: content.VR005
    name: "The active theme is not deleted"
    description: "The back office offers the delete only for themes not in use; the delete itself does not refuse the active theme today."
    modality: prohibited
    concepts: [content.CN003]
    on_violation:
      action: reject
      message: "Theme \"%s\" is used and thus cannot be deleted."
    code_refs:
      - path: src/Core/Addon/Theme/ThemeManager.php
        role: planned
        description: "Lines 104-118, uninstall checks the delete permission (line 107) and removes the theme directory with no comparison against the shop theme."
      - path: src/Core/Domain/Theme/CommandHandler/DeleteThemeHandler.php
        role: documentation
        description: "Line 41: the refusal message states the intent, 'Theme \"%s\" is used and thus cannot be deleted.'"
      - path: src/PrestaShopBundle/Resources/views/Admin/Improve/Design/Theme/index.html.twig
        role: documentation
        description: "Lines 81-82 and 105: the delete form is drawn only for the themes not in use."
    summary: "Enable another theme before deleting the active one."
    logic:
      when: a theme is deleted
      then: theme.name != shop.theme_name
    fact: "delete(Theme) requires Theme.name != Shop.theme_name"
    scope: "theme delete, back office and Admin API"
    implementation: to-be
    provenance:
      discovery_stage: exploring
      certainty: probable

  - id: content.VR006
    name: "A page has at most one meta entry"
    description: "A page already used is refused with the same error as an unknown page."
    modality: obligatory
    concepts: [content.CN005]
    on_violation:
      action: reject
      code: 1
      message: "Given page name %s is not available. Available values are %s"
    code_refs:
      - path: src/Adapter/Meta/CommandHandler/AddMetaHandler.php
        role: implementation
        description: "Lines 148-152: the page name must be among getAvailablePages(), else INVALID_PAGE_NAME."
      - path: src/Adapter/Meta/CommandHandler/EditMetaHandler.php
        role: implementation
        description: "Lines 134-145: an edit keeping its page passes; a changed page must be available."
      - path: src/Core/Domain/Meta/Exception/MetaConstraintException.php
        role: implementation
        description: "Line 17: INVALID_PAGE_NAME = 1."
      - path: tests/Integration/Behaviour/Features/Scenario/Meta/meta_management.feature
        role: test
        description: Scenarios 'Creating new metadata with unknown page name' (line 41) and 'Creating new metadata with already created page name' (47).
    summary: "One meta entry per page."
    logic:
      when: a meta entry is created, or its page is changed
      then: page IN availablePages()
    fact: "Meta.page is unique AND Meta.page IN pages known to the shop"
    scope: "SEO meta creation and edit, back office"
    examples:
      - input: A meta entry is created for page 'index', which already has one
        output: "Refused: page name value is incorrect"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

transition:
  - id: content.TR001
    name: "Enabling a theme deactivates the current one"
    description: "There is no check that the two themes differ: enabling the active theme again disables and re-activates it."
    concept: content.CN003
    guard:
      when: "a theme is enabled for the shop"
    from: "active"
    to: "inactive"
    on_violation:
      action: reject
      message: "An error occurred. The information \"%s\" is missing."
    code_refs:
      - path: src/Core/Addon/Theme/ThemeManager.php
        role: implementation
        description: "Line 162: enable disables the shop current theme; lines 176-177: the shop names the new theme; lines 195-206: disable turns off the modules the theme lists."
    summary: "The previous theme is disabled when another is enabled."
    fact: "enable(Theme T) => disable(Shop.theme_name) THEN Shop.theme_name := T"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
