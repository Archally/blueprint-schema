---
version: "1.0.0"
scope: content
tags: [theme]

concepts:
  - id: content.CN003
    name: "Theme"
    stereotype: aggregate-root
    description: "A front-office visual theme defining the storefront's appearance. Themes are imported from archives/URLs/FTP, enabled per shop (only one active at a time), and can be adapted for RTL languages. Theme has no CQRS queries - all operations are write-side (import, enable, delete, reset, adapt)."
    tags: [aggregate-root, presentation]
    attributes:
      name:
        id: CAT616
        description: "Theme identifier name (used in all commands as ThemeName value object)"
        example: "classic"
      active:
        id: CAT617
        description: "Whether this theme is currently enabled for the shop"
        example: "true"
      directory:
        id: CAT618
        description: "Filesystem directory containing theme files"
        example: "themes/classic"
      version:
        id: CAT619
        description: "Theme version string"
        example: "2.1.0"
      responsive:
        id: CAT620
        description: "Whether the theme supports responsive design"
        example: "true"
    code_refs:
      - path: "src/Core/Domain/Theme/Command/EnableThemeCommand.php"
        role: implementation
      - path: "src/Core/Domain/Theme/ValueObject/ThemeName.php"
        role: model

  - id: content.CN004
    name: "ThemeImportSource"
    stereotype: value-object
    description: "Polymorphic value object defining where to import a theme from - file archive upload, web URL download, or FTP path. Has three factory methods (fromArchive, fromWeb, fromFtp)."
    tags: [value-object, within:content.CN003]
    attributes:
      sourceType:
        id: CAT621
        description: "Import source type - archive (file upload), web (URL), or ftp (path)"
        example: "archive"
      sourcePath:
        id: CAT622
        description: "File path, URL, or FTP location of the theme package"
        example: "https://themes.example.com/classic-2.1.zip"
    code_refs:
      - path: "src/Core/Domain/Theme/ValueObject/ThemeImportSource.php"
        role: model
        description: "Polymorphic value object with fromArchive/fromWeb/fromFtp factory methods"

  - id: content.CN006
    name: "MailTemplate"
    stereotype: aggregate-root
    description: "The HTML and plain-text body of one transactional email template, for one locale and one source (core or a named module). GenerateThemeMailTemplates writes a whole theme's set from source; EditEmailBodyTemplate and GetEmailBodyTemplateForEditing are the per-template editor a merchant uses afterwards. The code names this domain: src/Core/Domain/MailTemplate/, with its own Command/Query/ValueObject/Exception folders."
    tags: [aggregate-root, presentation, email]
    attributes:
      templateName:
        id: CAT5000
        description: "The template's technical name (an EmailTemplateName value object), e.g. order_conf."
        example: "order_conf"
      locale:
        id: CAT5001
        description: "The language locale this body is written in."
        example: "en-US"
      source:
        id: CAT5002
        description: "Where the template belongs: core, or a named module (an EmailTemplateSource value object of source + moduleName)."
        example: "core"
      htmlContent:
        id: CAT5003
        description: "The template's HTML body."
        example: "<p>Thank you for your order.</p>"
      txtContent:
        id: CAT5004
        description: "The template's plain-text body, sent alongside the HTML part."
        example: "Thank you for your order."
    code_refs:
      - path: "src/Core/Domain/MailTemplate/Command/EditEmailBodyTemplateCommand.php"
        role: implementation
        description: "Constructor carries templateName, locale, source, moduleName, htmlContent, txtContent"
      - path: "src/Core/Domain/MailTemplate/ValueObject/EmailTemplateName.php"
        role: model
      - path: "src/Core/Domain/MailTemplate/ValueObject/EmailTemplateSource.php"
        role: model

actors:
  - id: content.ACT002
    name: "StoreDesigner"
    type: human
    description: "Back-office operator responsible for managing the storefront's visual appearance - importing themes, enabling them per shop, resetting layouts, and adapting themes for RTL languages."
    personas:
      - id: content.PER001
        name: Theme designer
        description: A graphic designer or HTML integrator who works inside the themes folder without reading PHP (presta-docs/basics/introduction.md).
        goals:
          - Change the shop's look within the /themes folder without understanding a line of PHP (presta-docs/basics/introduction.md).
          - Override only what changes in a child theme, keeping the parent theme updatable (presta-docs/themes/create-a-theme/child-theme.md).
          - Install a theme from a zip archive in Design > Theme & Logo (presta-specs/content/1.7/back-office/design/themes-and-logo/theme&logo-add-new-theme.md).
        pain_points:
          - PrestaShop 9.0 front controllers pass Presenter data to templates, a breaking change that forces custom theme templates to be updated (presta-docs/modules/core-updates/9.0.md, 'Some front controller now use Presenter classes').
          - Deep markup changes cannot be made in a child theme; they mean starting from Hummingbird instead (presta-docs/themes/create-a-theme/child-theme.md).

enumerations:
  - id: content.EN002
    name: "ThemeImportSourceType"
    description: "Source type for theme import operations."
    values:
      - name: archive
        description: "Import from uploaded file archive (zip)"
      - name: web
        description: "Import from web URL download"
      - name: ftp
        description: "Import from FTP server path"
    code_refs:
      - path: "src/Core/Domain/Theme/ValueObject/ThemeImportSource.php"
        role: model
