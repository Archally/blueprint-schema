---
version: "1.0.0"
schemaVersion: "2.8.0"
name: "PrestaShop E-Commerce Platform"
description: >
  Blueprint model of the PrestaShop v9 open-source e-commerce platform covering
  10 bounded contexts derived from 62 CQRS domain aggregates and 352+ commands.
  Based on the real PrestaShop codebase (https://github.com/PrestaShop/PrestaShop).
repository:
  url: "https://github.com/PrestaShop/PrestaShop"
  branch: "develop"
  provider: "github"

# Declares what was already true on disk: this model is organised as ten slice subfolders, one per
# bounded context. Without this block the layout was implicitly the legacy single-folder one, so
# `bp render --list-slices` had nothing to list and `--slice` could not be checked for typos - the
# folders existed but nothing said they were the slice vocabulary rather than incidental directories.
layout:
  mode: slices
  slices:
    - name: admin
      description: "Back-office: employees, permissions, API clients, and the administration shell."
    - name: catalog
      description: "Products, categories, attributes, combinations, stock and pricing rules."
    - name: checkout
      description: "Cart, address and carrier selection, payment initiation and order placement."
    - name: content
      description: "CMS pages, blocks and static content served alongside the storefront."
    - name: customers
      description: "Customer accounts, addresses, groups, and consent/PII handling."
    - name: international
      description: "Languages, currencies, countries, zones, taxes and translation."
    - name: modules
      description: "The module/hook extension system: install, configure, upgrade, and hook dispatch."
    - name: orders
      description: "Order lifecycle, statuses, invoices, credit slips, refunds and returns."
    - name: shipping
      description: "Carriers, zones, weight/price ranges and delivery-cost computation."
    - name: shop
      description: "Multistore: shop groups, shops, per-shop configuration and URL routing."

domains:
  - id: DMN001
    name: admin
    description: "Back-office: employees, permissions, API clients, and the administration shell."
    type: supporting-domain
    subdomains:
      - id: SDM001
        name: api
      - id: SDM002
        name: config
      - id: SDM003
        name: identity
  - id: DMN002
    name: catalog
    description: "Products, categories, attributes, combinations, stock and pricing rules."
    type: core-domain
    subdomains:
      - id: SDM004
        name: category
      - id: SDM005
        name: characteristics
      - id: SDM006
        name: combination
      - id: SDM007
        name: image-settings
      - id: SDM008
        name: media
      - id: SDM009
        name: pricing
      - id: SDM010
        name: product
      - id: SDM011
        name: supply-chain
  - id: DMN003
    name: checkout
    description: "Cart, address and carrier selection, payment initiation and order placement."
    type: core-domain
    subdomains:
      - id: SDM012
        name: cart
      - id: SDM013
        name: discount
      - id: SDM014
        name: pricing
  - id: DMN004
    name: content
    description: "CMS pages, blocks and static content served alongside the storefront."
    type: supporting-domain
    subdomains:
      - id: SDM015
        name: cms
      - id: SDM016
        name: seo
      - id: SDM017
        name: theme
  - id: DMN005
    name: customers
    description: "Customer accounts, addresses, groups, and consent/PII handling."
    type: core-domain
    subdomains:
      - id: SDM018
        name: address
      - id: SDM019
        name: customer
      - id: SDM020
        name: customer-service
      - id: SDM021
        name: title
  - id: DMN006
    name: international
    description: "Languages, currencies, countries, zones, taxes and translation."
    type: supporting-domain
    subdomains:
      - id: SDM022
        name: currency
      - id: SDM023
        name: geography
      - id: SDM024
        name: language
      - id: SDM025
        name: localization
      - id: SDM026
        name: taxation
  - id: DMN007
    name: modules
    description: "The module/hook extension system: install, configure, upgrade, and hook dispatch."
    type: technical-capability
  - id: DMN008
    name: orders
    description: "Order lifecycle, statuses, invoices, credit slips, refunds and returns."
    type: core-domain
    subdomains:
      - id: SDM027
        name: invoice-payment
      - id: SDM028
        name: order
      - id: SDM029
        name: order-admin
      - id: SDM030
        name: refunds
      - id: SDM031
        name: returns
  - id: DMN009
    name: shipping
    description: "Carriers, zones, weight/price ranges and delivery-cost computation."
    type: supporting-domain
    subdomains:
      - id: SDM032
        name: carrier
      - id: SDM033
        name: shipment
  - id: DMN010
    name: shop
    description: "Multistore: shop groups, shops, per-shop configuration and URL routing."
    type: supporting-domain
