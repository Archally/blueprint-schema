version: 1.0.0
name: Checkout (PrestaShop)
description: Architecture of the PrestaShop Checkout bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC003
    name: Checkout
    kind: core
    value_stream_ref: VS001
    complexity: concurrency
    business_model_role: revenue-generator
    evolution: product
    model_traits: [analyser, information-holder]
    summary: Cart management, checkout flow, cart rules, promotions, payment orchestration.
    owned_by:
      team: TM003
    responsibilities:
      - Cart session lifecycle (create, update, checkout, abandon)
      - Cart item management (add, remove, update quantity)
      - Cart rule and discount evaluation
      - Catalog price rule application
      - Payment initiation and gateway orchestration
      - Cart total calculation (products, discounts, tax, shipping)
    dependencies:
      - name: Catalog
        coupling: http
        relationship: customer-supplier
        direction: downstream
        description: Reads product prices, stock, and availability for cart items.
        bounded_context_ref: prestashop.BC002
      - name: Customers
        coupling: http
        relationship: customer-supplier
        direction: downstream
        description: Reads customer data for cart rules and guest checkout.
        bounded_context_ref: prestashop.BC005
      - name: International
        coupling: http
        relationship: customer-supplier
        direction: downstream
        description: Reads currency and tax data for cart totals.
        bounded_context_ref: prestashop.BC006
      - name: Orders
        relationship: shared-kernel
        direction: upstream
        description: Publishes cart-to-order transition event.
        language_boundary: false
        bounded_context_ref: prestashop.BC008
    services:
      - id: prestashop.SVC003
        name: CheckoutService
        kind: api
        summary: REST API for cart operations and payment initiation.
        needs:
          - { type_ref: RT001, class: self-hosted, id: prestashop-db }
        servers:
          - url: https://api.prestashop.example/v1
            environment: prestashop.ENV001
          - url: http://localhost:8080/api
            environment: development
        contracts:
          openapi:
            contract_name: checkout-api
            slice: checkout
            expose:
              - checkout.CMD009
              - checkout.CMD010
              - checkout.QRY001
          asyncapi:
            contract_name: checkout-events
            slice: checkout
            send:
              - checkout.EVT004
            receive:
              - orders.EVT001
            brokerId: prestashop-event-bus
