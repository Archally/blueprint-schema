version: 1.0.0
name: Checkout (PrestaShop)
description: Architecture of the PrestaShop Checkout bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC003
    name: Checkout
    kind: core
    value_stream_ref: VS001
    complexity: concurrency
    business_model_role: revenue-generator
    evolution: product
    model_traits: [analyser, information-holder]
    summary: Cart management, checkout flow, cart rules, promotions, payment orchestration.
    owned_by:
      team: TM003
    responsibilities:
      - Cart session lifecycle (create, update, checkout, abandon)
      - Cart item management (add, remove, update quantity)
      - Cart rule and discount evaluation
      - Catalog price rule application
      - Payment initiation and gateway orchestration
      - Cart total calculation (products, discounts, tax, shipping)
    dependencies:
      - name: Catalog
        coupling: shareddata
        relationship: customer-supplier
        direction: downstream
        description: >-
          Reads its cart lines straight out of Catalog's tables: Cart::getProducts joins product,
          product_shop and product_attribute in its own SQL (classes/Cart.php:735-794), and prices
          each line by calling Product::getPriceStatic in-process (Cart::getCartPriceFromCatalog,
          classes/Cart.php:1176). Customer-supplier because the cart consumes the catalog's data
          and pricing and writes nothing back.
        bounded_context_ref: prestashop.BC002
      - name: Customers
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Loads the cart's customer and their groups in the same process: Cart::__construct builds
          a Customer (classes/Cart.php:215) and CartRule::getCustomerCartRules calls
          Customer::getGroupsStatic (classes/CartRule.php:469). Customer-supplier because cart
          rules consume the customer's groups and never change them.
        bounded_context_ref: prestashop.BC005
      - name: International
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Computes cart totals with International's tax and currency classes in the same process:
          Cart::findTaxRulesGroupId calls TaxManagerFactory::getManager (classes/Cart.php:2546) and
          Cart::calculateWrappingFees calls Currency::getCurrencyInstance (classes/Cart.php:2619).
          Customer-supplier because the cart consumes the rates and converts nothing back.
        bounded_context_ref: prestashop.BC006
      - name: Orders
        relationship: shared-kernel
        direction: peer
        description: >-
          Cart and order share one calculation and one pair of tables, and each side calls the
          other. Placement reads the cart: PaymentModule::validateOrder takes its totals from
          Cart::getOrderTotal (classes/PaymentModule.php:289), and an edited order recomputes its
          totals through the same method (OrderAmountUpdater::updateOrderTotals,
          src/Adapter/Order/OrderAmountUpdater.php:259). The cart reads the orders table:
          Cart::orderExists counts orders by id_cart (classes/Cart.php:1924). Shared-kernel because
          both contexts depend on the cart total calculation and the cart-to-order key, stated
          once here for the pair rather than from both ends.
        language_boundary: false
        bounded_context_ref: prestashop.BC008
    services:
      - id: prestashop.SVC003
        name: CheckoutService
        kind: api
        summary: REST API for cart operations and payment initiation.
        needs:
          - { type_ref: RT001, class: self-hosted, id: prestashop-db }
        servers:
          - url: https://api.prestashop.example/v1
            environment: prestashop.ENV001
          - url: http://localhost:8080/api
            environment: development
        contracts:
          openapi:
            contract_name: checkout-api
            slice: checkout
            expose:
              - checkout.CMD009
              - checkout.CMD010
              - checkout.QRY001
          asyncapi:
            contract_name: checkout-events
            slice: checkout
            send:
              - checkout.EVT004
            receive:
              - orders.EVT001
            brokerId: prestashop-event-bus
