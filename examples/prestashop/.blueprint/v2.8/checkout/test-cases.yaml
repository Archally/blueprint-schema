---
version: "1.1.0"
scope: checkout

happy_path:
  - id: checkout.TC001
    name: "Add product to cart - happy path"
    summary: "Add an in-stock product to an empty cart."
    validates:
      operations: [checkout.CMD009, checkout.EVT004]
      rules: [checkout.SR001]
    given:
      description: "Product SKU-001 in stock (qty: 10). Cart is empty."
      state:
        cartStatus: "not-ordered"
        productStock: 10
        quantity: 2
    expected_result:
      status: success
      code: 200
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Cart/Product/add_standard_product.feature"
        role: test
        description: "Scenario 'Add product(s) in cart' (line 9)."
      - path: "src/Adapter/Cart/CommandHandler/AddProductToCartHandler.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Cart/Product/add_standard_product.feature line 9"
          date: "2026-09-19"
          summary: >-
            The scenario adds units of an in-stock product to an empty cart and asserts the cart
            line and the remaining stock. Same assertion, same shape as this case's given.
          confidence_impact: supports

  - id: checkout.TC002
    name: "Apply valid voucher code - happy path"
    summary: "Apply a valid voucher code to a cart meeting all conditions."
    validates:
      operations: [checkout.CMD014, checkout.EVT005]
      rules: [checkout.VR001, checkout.VR002, checkout.VR003]
    given:
      description: "Cart total EUR 80. Voucher SPRING20 gives 20% off, min EUR 50, valid until 2026-06-01, unused."
      state:
        cartTotal: 80.00
        voucherCode: "SPRING20"
        reductionType: "percentage"
        reductionValue: 20
        minimumAmount: 50.00
    expected_result:
      status: success
      code: 200
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_validity_date_range.feature"
        role: test
        description: "Scenario 'Discount with validTo in the future' (line 19) - the validity half."
      - path: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_with_condition_minimum_amount.feature"
        role: test
        description: "Scenario 'Create a complete discount with free shipping using new CQRS' (line 14) - the minimum-amount half."
      - path: "src/Adapter/Cart/CommandHandler/AddCartRuleToCartHandler.php"
        role: implementation
        description: "The handler that raises CartRuleValidityException when any condition fails."
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/"
          date: "2026-09-19"
          summary: >-
            Each of the three rules this case names is covered by its own scenario in the
            front-office discount suite: validity dates, minimum amount, usage limit. No single
            scenario combines all three the way this case's given does, so it is assembled from
            three tests rather than matched to one.
          confidence_impact: supports

  - id: checkout.TC003
    name: "Create discount campaign - happy path"
    summary: "Create a percentage discount with date range and usage limits."
    validates:
      operations: [checkout.CMD016, checkout.EVT007]
      rules: [checkout.SR002, checkout.VR001]
    given:
      description: "Marketing manager creates 15% off discount, valid March-April 2026, max 500 uses."
      state:
        reductionType: "percentage"
        reductionValue: 15
        dateFrom: "2026-03-01"
        dateTo: "2026-04-30"
        totalQuantity: 500
    expected_result:
      status: success
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Discount/BO/add_discount_with_code.feature"
        role: test
        description: "Scenario 'Create a discount with code that isn't used already' (line 18). One of 34 back-office discount scenarios that create through AddDiscountCommand."
      - path: "src/Adapter/Discount/CommandHandler/AddDiscountHandler.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Discount/BO/"
          date: "2026-09-19"
          summary: >-
            The back-office discount suite is 34 scenarios and creates a discount in nearly all
            of them, so the creation path is heavily exercised. The cited scenario creates with
            a code; none creates with exactly this case's combination of a percentage, a date
            range and a total quantity.
          confidence_impact: supports

  - id: checkout.TC004
    name: "Create catalog price rule - happy path"
    summary: "Create a B2B quantity discount for bulk purchases."
    validates:
      operations: [checkout.CMD021, checkout.EVT010]
      rules: [checkout.VR004]
    given:
      description: "10% off for orders of 100+ units, valid all year."
      state:
        reductionType: "percentage"
        reductionValue: 10
        fromQuantity: 100
    expected_result:
      status: success
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/CatalogPriceRule/catalog_price_rules_listing.feature"
        role: test
        description: "Scenario 'I can see a list of catalog price rules' (line 26). The only CatalogPriceRule feature file, and it lists rather than applies."
      - path: "classes/SpecificPrice.php"
        role: implementation
        description: "The from_quantity comparison in the price selector, which is what makes a quantity threshold take effect."
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/CatalogPriceRule/catalog_price_rules_listing.feature"
          date: "2026-09-19"
          summary: >-
            The scenario creates a rule with from quantity 1 and asserts it appears in the
            listing. It does not apply the rule to a cart and does not use a bulk threshold, so
            it covers creation only.
          confidence_impact: supports
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            Modeler-derived for the threshold half. Nothing asserts that a 100-unit threshold
            takes effect at 100 units and not below.
          confidence_impact: weakens

  - id: checkout.TC005
    name: Change cart quantity from the shopping cart
    summary: The shopper changes an existing cart line and sees the updated quantity and cart summary.
    validates:
      operations:
        - checkout.CMD011 # UpdateProductQuantityInCart
      ui:
        screens:
          - checkout.SCR005 # Shopping cart
        actions:
          - checkout.UAC006 # Change a line's quantity
    tags: [front-end]
    given:
      description: The Shopping cart page holds one ordinary product at quantity 1, with at least 3 units
        available and minimum quantity 1. The shop sells normally and the request has a valid token.
    when:
      operation: checkout.CMD011 # UpdateProductQuantityInCart
      description: On Shopping cart, change the line quantity from 1 to 2 using the quantity control.
    expected_result:
      status: success
      behavior: The cart line shows quantity 2 and the cart summary refreshes for that quantity without an
        availability error.
    code_refs:
      - path: controllers/front/CartController.php
        role: implementation
        description: Lines 114-147 return the updated quantity and presented cart; lines 497-506 call updateQty.
      - path: themes/_core/js/cart.js
        role: implementation
        description: Lines 10-68 replace cart totals and summary fragments after updateCart.
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: controllers/front/CartController.php; themes/_core/js/cart.js
          date: 2026-10-29
          summary: The controller updates the legacy cart and returns its quantity; the theme refreshes cart
            summary fragments. The action and operation link is the existing model mapping.
          confidence_impact: supports
    note: Source-derived UI specification, not an executed browser test. Core theme fragments support
      the summary refresh; the installed theme quantity-control markup is not present in this
      checkout.

  - id: checkout.TC006
    name: Apply a valid voucher from the shopping cart
    summary: Submitting an eligible voucher refreshes the cart summary without showing a voucher error.
    validates:
      operations:
        - checkout.CMD014 # ApplyCartRuleToCart
      ui:
        screens:
          - checkout.SCR005 # Shopping cart
        actions:
          - checkout.UAC008 # Enter a voucher code
    tags: [front-end]
    given:
      description: The Shopping cart page has products and an unapplied voucher that satisfies its dates,
        minimum amount and usage conditions. Cart rules are enabled and the request has a valid token.
    when:
      operation: checkout.CMD014 # ApplyCartRuleToCart
      description: On Shopping cart, enter the eligible voucher code and submit the voucher form.
    expected_result:
      status: success
      behavior: The cart summary refreshes with the applied voucher and its resulting totals. The
        submission does not take the voucher-error branch.
    code_refs:
      - path: controllers/front/CartController.php
        role: implementation
        description: Lines 235-265 check and attach the voucher; lines 125-139 return the presented cart on
          success.
      - path: themes/_core/js/cart.js
        role: implementation
        description: Lines 156-188 submit the voucher form, display a refusal or emit updateCart; lines
          27-56 refresh the summary.
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: controllers/front/CartController.php; themes/_core/js/cart.js
          date: 2026-10-29
          summary: The successful validity branch adds the cart rule and the theme emits updateCart rather
            than displaying the error branch.
          confidence_impact: supports
    note: Source-derived, not browser-executed. The storefront uses Cart::addCartRule directly; its
      operation reference follows the existing action mapping rather than claiming command-bus
      dispatch.

  - id: checkout.TC007
    name: Choose delivery and refresh the checkout summary
    summary: Choosing an offered carrier refreshes the checkout summary for the selected delivery option.
    validates:
      operations:
        - checkout.CMD004 # UpdateCartDeliverySettings
      ui:
        screens:
          - checkout.SCR006 # Checkout
        actions:
          - checkout.UAC010 # Choose a delivery option
    tags: [front-end]
    given:
      description: The Checkout page is on its shipping step for a nonvirtual cart, with a valid delivery
        address and two offered delivery options. The payment-step refresh flag is absent.
    when:
      operation: checkout.CMD004 # UpdateCartDeliverySettings
      description: On Checkout, select the other offered delivery option.
    expected_result:
      status: success
      behavior: The newly chosen option remains selected and the checkout summary is replaced by the
        returned preview. The normal update stays on the checkout page.
    code_refs:
      - path: themes/_core/js/checkout-delivery.js
        role: implementation
        description: Lines 16-46 serialize the delivery form on input change, post it and replace the
          summary with resp.preview.
      - path: controllers/front/OrderController.php
        role: implementation
        description: Lines 223-237 render the checkout cart-summary preview; lines 270-272 pass the request
          to the checkout process.
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: themes/_core/js/checkout-delivery.js; controllers/front/OrderController.php
          date: 2026-10-29
          summary: The theme posts the shipping form when an input changes, replaces the summary, and emits
            updatedDeliveryForm. The controller supplies the preview.
          confidence_impact: supports
    note: Source-derived UI expectation. The existing model maps delivery choice to
      UpdateCartDeliverySettings; the controller delegates persistence to the checkout process, whose
      internals are outside this source read. No gift or recyclable-option assertion is added.

edge_cases:
  - id: checkout.EC001
    name: "Apply expired voucher code"
    summary: "Attempt to apply a voucher whose validity period has passed."
    validates:
      operations: [checkout.CMD014]
      rules: [checkout.VR001]
    given:
      description: "Voucher WINTER25 expired on 2026-01-31. Current date is 2026-03-18."
      state:
        voucherCode: "WINTER25"
        dateTo: "2026-01-31"
    expected_result:
      status: failure
      code: 422
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_validity_date_range.feature"
        role: test
        description: "Scenario 'Discount with validTo in the past' (line 38)."
      - path: "src/Core/Domain/CartRule/Exception/CartRuleValidityException.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_validity_date_range.feature line 38"
          date: "2026-09-19"
          summary: >-
            The scenario applies a voucher whose validTo is in the past and asserts the cart
            rule validation error. Same assertion.
          confidence_impact: supports

  - id: checkout.EC002
    name: "Exceed discount per-customer usage limit"
    summary: "Customer attempts to use a voucher they have already exhausted."
    validates:
      operations: [checkout.CMD014]
      rules: [checkout.VR003]
    given:
      description: "Voucher LOYAL10 allows 1 use per customer. Customer has already used it once."
      state:
        quantityPerUser: 1
        customerUsageCount: 1
    expected_result:
      status: failure
      code: 422
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_with_usage_limits.feature"
        role: test
        description: "Scenario 'Discount that is available only one time per user' (line 133)."
      - path: "src/Core/Domain/CartRule/Exception/CartRuleConstraintException.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_with_usage_limits.feature line 133"
          date: "2026-09-19"
          summary: >-
            The scenario sets quantity_per_user to 1, uses the discount once, and asserts the
            second attempt is refused. Same assertion, same numbers.
          confidence_impact: supports

error_cases:
  - id: checkout.ER001
    name: "Delete cart linked to completed order"
    summary: "Attempt to delete a cart that was already converted to an order."
    validates:
      operations: [checkout.CMD007]
      rules: [checkout.VR005]
    given:
      description: "An order was placed from cart 42."
      state:
        cartStatus: "ordered"
    expected_result:
      status: failure
      code: 409
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Cart/CartRule/BackOffice/delete_cart_from_bo.feature"
        role: test
        description: "Scenario 'Block delete cart already ordered' (line 23)."
      - path: "src/Core/Domain/Cart/Exception/CannotDeleteOrderedCartException.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Cart/CartRule/BackOffice/delete_cart_from_bo.feature line 23"
          date: "2026-09-19"
          summary: >-
            The scenario places an order from a cart and asserts the cart can no longer be
            deleted. Same assertion, same exception.
          confidence_impact: supports

  - id: checkout.ER002
    name: "Create discount with invalid configuration"
    summary: "Attempt to create a discount with end date before start date."
    validates:
      operations: [checkout.CMD016]
      rules: [checkout.SR002, checkout.VR001]
    given:
      description: "Discount with dateFrom 2026-05-01 and dateTo 2026-04-01."
      state:
        dateFrom: "2026-05-01"
        dateTo: "2026-04-01"
    expected_result:
      status: failure
      code: 422
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Discount/BO/update_discount_validity_dates.feature"
        role: test
        description: "Scenario 'Create discount with invalid date range' (line 57)."
      - path: "src/Adapter/Discount/Validate/DiscountValidator.php"
        role: validation
        description: "DATE_FROM_GREATER_THAN_DATE_TO, raised here and again in the AddDiscountCommand constructor."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Discount/BO/update_discount_validity_dates.feature line 57"
          date: "2026-09-19"
          summary: >-
            The scenario creates a discount whose date range runs backwards and asserts the
            refusal. The refusal is doubly enforced, in the command constructor and in the
            validator, and both raise DATE_FROM_GREATER_THAN_DATE_TO.
          confidence_impact: supports

  - id: checkout.ER003
    name: "Apply voucher below minimum order amount"
    summary: "Voucher requires EUR 50 minimum but cart total is EUR 30."
    validates:
      operations: [checkout.CMD014]
      rules: [checkout.VR002]
    given:
      description: "Cart total EUR 30. Voucher requires minimum EUR 50."
      state:
        cartTotal: 30.00
        minimumAmount: 50.00
    expected_result:
      status: failure
      code: 422
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_with_condition_minimum_amount.feature"
        role: test
        description: "Scenario 'Create a complete discount with free shipping using new CQRS' (line 14), which applies the voucher below and then above the threshold."
      - path: "src/Core/Domain/Discount/ValueObject/MinimumAmount.php"
        role: implementation
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_with_condition_minimum_amount.feature line 14"
          date: "2026-09-19"
          summary: >-
            The scenario asserts the cart rule validation error below the minimum and the
            discount applying once the cart is raised above it. Same assertion in both
            directions. The scenario's discount is free-shipping rather than percentage; the
            minimum-amount condition it exercises is the same one.
          confidence_impact: supports

  - id: checkout.ER004
    name: Show an expired voucher refusal in the shopping cart
    summary: A voucher rejected for expired dates shows its validity error instead of refreshing the
      cart as a success.
    validates:
      operations:
        - checkout.CMD014 # ApplyCartRuleToCart
      rules:
        - checkout.VR001 # A voucher starts no later than it ends and applies only within its dates
      ui:
        screens:
          - checkout.SCR005 # Shopping cart
        actions:
          - checkout.UAC008 # Enter a voucher code
    tags: [front-end]
    given:
      description: On Shopping cart, an existing voucher has expired and otherwise qualifies. The cart
        controller validity check returns the expiry error described by the model. The request has a
        valid token.
    when:
      operation: checkout.CMD014 # ApplyCartRuleToCart
      description: Enter the expired voucher code in the Shopping cart voucher form and submit it.
    expected_result:
      status: failure
      behavior: The voucher error area becomes visible with the first validity error from the response.
        The voucher is not attached and the successful updateCart branch is not emitted for this
        submission.
    code_refs:
      - path: controllers/front/CartController.php
        role: implementation
        description: Lines 250-255 put a checkValidity refusal into errors instead of calling addCartRule;
          lines 144-147 return those errors.
      - path: themes/_core/js/cart.js
        role: implementation
        description: Lines 173-185 show .js-error, write resp.errors[0] to .js-error-text and return before
          updateCart.
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: controllers/front/CartController.php; themes/_core/js/cart.js
          date: 2026-10-29
          summary: The model states the expiry rule. The controller forwards any checkValidity error and the
            theme visibly renders that error. This read proves error propagation, not the date
            comparison inside checkValidity.
          confidence_impact: supports
    note: The expiry premise is supplied by the modeled rule; its date-comparison implementation was not
      read in this bounded task. No exact localized expiry wording or HTTP failure status is asserted.
