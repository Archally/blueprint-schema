---
version: "1.0.0"
scope: checkout
tags: [pricing, catalog-price-rule, b2b]

concepts:
  - id: checkout.CN006
    name: "CatalogPriceRule"
    description: "Bulk price reduction applied to product selections based on quantity thresholds, customer groups, or date ranges. Used for B2B/wholesale pricing and automated catalog-wide promotions."
    stereotype: aggregate-root
    attributes:
      catalogPriceRuleId:
        id: CAT227
        description: "Unique catalog price rule identifier"
        example: "3"
      name:
        id: CAT228
        description: "Rule display name"
        example: "Wholesale from 10 units"
      reductionType:
        id: CAT229
        description: "Which reduction shape applies, from Reduction::ALLOWED_TYPES: percentage or amount. The command pairs it with reductionValue into one Reduction value object."
        example: "percentage"
      reductionValue:
        id: CAT230
        description: "Numeric reduction value"
        example: "15.00"
      fromQuantity:
        id: CAT231
        description: "Quantity of the product at which the rule starts applying. This is what makes a catalog price rule a volume rule rather than a flat discount."
        example: "10"
      dateFrom:
        id: CAT232
        description: "Validity period start"
        example: "2026-01-01 00:00:00"
      dateTo:
        id: CAT233
        description: "Validity period end"
        example: "2026-12-31 23:59:59"
    code_refs:
      - path: "src/Core/Domain/CatalogPriceRule/Command/AddCatalogPriceRuleCommand.php"
        role: implementation
      - path: "src/Core/Domain/CatalogPriceRule/Command/EditCatalogPriceRuleCommand.php"
        role: implementation
