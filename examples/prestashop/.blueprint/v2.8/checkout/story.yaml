---
name: "Checkout Processes"
version: "1.0.0"
scope: checkout

processes:
  - id: checkout.PRC001
    tracker_ref: "42400"
    title: "Shopper cart journey"
    description: "Shopper adds products to cart, applies voucher, and prepares for checkout."
    initiated_by: [orders.ACT001]
    trigger:
      type: message
      operation: checkout.CMD009
      description: "Shopper adds first product to cart."
    end_states:
      - name: "Cart ready for checkout"
        type: complete
        description: "Cart populated with products, voucher applied, delivery configured."
      - name: "Product unavailable"
        type: error
        description: "Product out of stock or cart rule validation failed."
    lanes:
      - actor: orders.ACT001
        operations: [checkout.CMD009, checkout.CMD014, checkout.CMD002]
    activities:
      - id: checkout.PA001
        name: "Add products to cart"
        entry_operation: checkout.CMD009
        next: [{to: checkout.PA002}]
        path_type: happy
      - id: checkout.PA002
        name: "Apply voucher code"
        entry_operation: checkout.CMD014
        next: [{to: checkout.PA003}]
        path_type: happy
      - id: checkout.PA003
        name: "Configure cart for checkout"
        entry_operation: checkout.CMD002
        path_type: happy
    code_refs:
      - path: "controllers/front/CartController.php"
        role: implementation
        description: "Front-office cart operations controller."
      - path: "src/PrestaShopBundle/Controller/Admin/Sell/Order/CartController.php"
        role: implementation
        description: "Back-office cart management controller."

  - id: checkout.PRC002
    title: "Discount campaign setup"
    description: "Marketing manager creates and configures a promotional discount campaign."
    initiated_by: [checkout.ACT001]
    trigger:
      type: message
      operation: checkout.CMD016
      description: "Marketing manager creates a promotional discount."
    end_states:
      - name: "Campaign active"
        type: complete
        description: "Discount created with conditions and usage limits, optionally duplicated."
      - name: "Configuration invalid"
        type: error
        description: "Invalid discount rules, overlapping conditions, or missing required fields."
    lanes:
      - actor: checkout.ACT001
        operations: [checkout.CMD016, checkout.CMD019]
    activities:
      - id: checkout.PA004
        name: "Create discount"
        entry_operation: checkout.CMD016
        path_type: happy
      - id: checkout.PA005
        name: "Duplicate for seasonal reuse"
        entry_operation: checkout.CMD019
        path_type: happy

user_stories:
  - id: checkout.US001
    actor: orders.ACT001
    goal: "add a product to my cart"
    benefit: "I can collect items before purchasing them all at once"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Product added to cart with correct quantity and price"
      - "Cart total updates immediately"
      - "Cart badge in header reflects new item count"
    operations: [checkout.CMD009, checkout.EVT004]
    test_cases: [checkout.TC001]
    use_case: checkout.UC001

  - id: checkout.US002
    actor: orders.ACT001
    goal: "remove an item from my cart"
    benefit: "I can change my mind without starting over"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Item removed from cart"
      - "Cart total recalculated"
    operations: [checkout.CMD010, checkout.EVT004]

  - id: checkout.US003
    actor: orders.ACT001
    goal: "apply a voucher code to my cart"
    benefit: "I get the discount I was promised"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Valid voucher accepted and discount applied"
      - "Cart total reduced by discount amount"
      - "Invalid or expired voucher shows clear error message"
    operations: [checkout.CMD014, checkout.EVT005]
    test_cases: [checkout.TC002]
    use_case: checkout.UC003

  - id: checkout.US004
    actor: checkout.ACT001
    goal: "create a discount campaign with conditions and usage limits"
    benefit: "I can drive sales with targeted promotions"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Discount created with all condition types"
      - "Usage limits enforced per customer and globally"
      - "Validity period respected"
    operations: [checkout.CMD016, checkout.EVT007]
    test_cases: [checkout.TC003]
    use_case: checkout.UC004

  - id: checkout.US005
    actor: checkout.ACT001
    goal: "duplicate an existing discount as a campaign template"
    benefit: "I save time when running seasonal campaigns"
    delivery_priority: should-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "New discount created with same configuration"
      - "New discount has independent usage counters"
    operations: [checkout.CMD019, checkout.EVT007]

  - id: checkout.US006
    actor: checkout.ACT001
    goal: "configure catalog price rules for wholesale customers"
    benefit: "B2B customers automatically get volume discounts"
    delivery_priority: should-have
    status: draft
    release_target: "v1.1"
    acceptance_criteria:
      - "Price rule applies to matching product selections"
      - "Quantity threshold correctly triggers reduction"
    operations: [checkout.CMD021, checkout.EVT010]
    test_cases: [checkout.TC004]

  - id: checkout.US007
    actor: orders.ACT004
    goal: "create and send a pre-built cart to a customer"
    benefit: "I can assist customers who need help placing orders"
    delivery_priority: could-have
    status: draft
    release_target: "v1.1"
    acceptance_criteria:
      - "Cart created with specified products and quantities"
      - "Cart link emailed to customer"
    operations: [checkout.CMD001, checkout.CMD008]

  - id: checkout.US008
    actor: orders.ACT001
    goal: "put products in my cart and change what is in it before I commit to anything"
    benefit: "I can gather, reconsider and re-quantify without being asked to sign in or to pay."
    summary: "Shopper builds and edits the cart."
    description: >
      Every change on this page is a full page load rather than an in-page update: PrestaShop
      applies the change in postProcess and then draws the cart. The domain operations are the
      three cart-line commands, which the storefront reaches by calling Cart::updateQty and
      Cart::deleteProduct directly rather than over the command bus. A cart exists for a signed-
      out shopper too, which is why the shop can see abandoned carts.
    acceptance_criteria:
      - "Adding a product from the product page carries the chosen combination and lands on the cart."
      - "Changing a quantity or removing a line redraws the cart with the new totals."
      - "Removing one customized line leaves the other customizations of the same product in place."
      - "An empty cart renders the cart-empty page with a link to the shop's configured home category."
      - "A request that fails the token check, or comes from a recognised bot, is ignored rather than applied."
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    operations: [checkout.CMD009, checkout.CMD010, checkout.CMD011, checkout.EVT004]
    code_refs:
      - path: "controllers/front/CartController.php"
        role: implementation
        description: "updateCart at line 224 holds the bot and token guards; Cart::updateQty at line 497."

  - id: checkout.US009
    actor: orders.ACT001
    goal: "type a voucher code into my cart and see the discount before I pay"
    benefit: "I know what I will actually be charged while I can still change my mind."
    summary: "Shopper redeems a voucher in the cart."
    description: >
      Worth its own story because of the one behaviour that surprises people: a voucher the
      shop applies automatically comes straight back after the shopper removes it, because
      CartRule::autoAddToCart runs immediately after the removal. The three refusals are also
      distinct and each has its own message.
    acceptance_criteria:
      - "A valid code applies the discount and the totals change on the redrawn page."
      - "An empty code, an unknown code and a code that conflicts with one already applied each produce their own message."
      - "Removing a voucher the shop applies automatically results in that voucher being applied again."
    delivery_priority: should-have
    status: ready
    release_target: "v1.0"
    operations: [checkout.CMD014, checkout.CMD015, checkout.EVT005, checkout.EVT006]
    code_refs:
      - path: "controllers/front/CartController.php"
        role: implementation
        description: "updateCart lines 237 to 273: the three refusals, Cart::addCartRule, then removeCartRule followed by CartRule::autoAddToCart."

  - id: checkout.US010
    actor: orders.ACT001
    goal: "complete checkout without leaving the page or filling in more than my cart needs"
    benefit: "I reach payment in as few decisions as the order actually requires."
    summary: "Shopper works through the four-step checkout."
    description: >
      Four steps, one page, one URL. The shipping step is added only when the cart is not
      virtual, so a shopper buying a downloadable product genuinely sees three. The last step
      belongs to the payment module, which is why this story reaches the OrderPlaced event
      rather than a command: PrestaShop's only order-creation command is the back office's.
    acceptance_criteria:
      - "The checkout renders as an accordion of Personal Information, Addresses, Shipping Method and Payment, in that order."
      - "A virtual cart is offered three steps, with Shipping Method absent rather than skipped-and-shown."
      - "A step marks itself complete and the next one opens, without a page change."
      - "Choosing a delivery option writes the carrier, the gift-wrapping choice and the recyclable-packaging choice to the cart in one update."
      - "Confirming payment ends in an order whose creation fired actionValidateOrder."
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    operations: [checkout.CMD002, checkout.CMD004, checkout.EVT002, orders.EVT001]
    code_refs:
      - path: "controllers/front/OrderController.php"
        role: implementation
        description: "bindCheckoutProcess at line 407; the conditional shipping step at line 424."

use_cases:
  - id: checkout.UC001
    name: "Add to Cart"
    summary: "Shopper adds a product to the shopping cart."
    primary_actor: orders.ACT001
    goal: "Add a product to cart for later purchase."
    preconditions:
      - "Product is active and in stock"
    postconditions:
      - "Cart contains the item with correct quantity"
      - "CartProductsUpdated event emitted"
    main_scenario:
      - step: 1
        action: "Shopper views product detail page."
        emotion: neutral
      - step: 2
        action: "Shopper selects quantity and clicks 'Add to Cart'."
        emotion: neutral
      - step: 3
        action: "System validates stock availability and adds item."
        operation: checkout.CMD009
      - step: 4
        action: "System confirms item added with updated cart total."
        operation: checkout.EVT004
        emotion: satisfied
    extensions:
      - step: 3
        condition: "Product is out of stock."
        action: "System displays out-of-stock message."
    user_stories: [checkout.US001]
    delivery_priority: must-have

  - id: checkout.UC002
    name: "Prepare Cart for Order"
    summary: "Back-office operator creates and configures a cart for order creation."
    primary_actor: orders.ACT004
    goal: "Prepare a complete cart ready for order creation."
    preconditions:
      - "Customer exists in the system"
    postconditions:
      - "Cart has products, addresses, and carrier configured"
    main_scenario:
      - step: 1
        action: "Operator creates empty cart for customer."
        operation: checkout.CMD001
      - step: 2
        action: "Operator adds products to the cart."
        operation: checkout.CMD009
      - step: 3
        action: "Operator sets delivery and invoice addresses."
        operation: checkout.CMD002
      - step: 4
        action: "Operator selects shipping carrier."
        operation: checkout.CMD003
      - step: 5
        action: "Cart is ready for order creation."
        operation: checkout.QRY002
    user_stories: [checkout.US007]
    delivery_priority: should-have

  - id: checkout.UC003
    name: "Apply Promotion to Cart"
    summary: "Shopper applies a voucher code to receive a discount on their cart."
    primary_actor: orders.ACT001
    goal: "Apply a voucher code discount to reduce the cart total."
    preconditions:
      - "Cart has at least one item"
      - "Shopper has a voucher code"
    postconditions:
      - "Discount applied to cart"
      - "Cart total reduced"
    main_scenario:
      - step: 1
        action: "Shopper enters voucher code in cart page."
        emotion: neutral
      - step: 2
        action: "System validates code, date range, minimum amount, and usage limits."
        operation: checkout.CMD014
      - step: 3
        action: "System applies discount and recalculates cart total."
        operation: checkout.EVT005
        emotion: delighted
    extensions:
      - step: 2
        condition: "Voucher code is expired."
        action: "System displays expiration error."
      - step: 2
        condition: "Cart total below minimum amount."
        action: "System displays minimum amount requirement."
    user_stories: [checkout.US003]
    delivery_priority: must-have

  - id: checkout.UC004
    name: "Create Discount Campaign"
    summary: "Marketing manager creates a promotional discount with conditions and limits."
    primary_actor: checkout.ACT001
    goal: "Create a targeted promotional campaign."
    preconditions:
      - "Manager has discount management permissions"
    postconditions:
      - "Discount created and available for application"
    main_scenario:
      - step: 1
        action: "Manager navigates to discount creation form."
        emotion: neutral
      - step: 2
        action: "Manager configures discount type, reduction, and validity period."
        emotion: neutral
      - step: 3
        action: "Manager sets usage limits and conditions."
        emotion: neutral
        pain_point: "Condition combination preview is not available"
      - step: 4
        action: "System validates configuration and creates discount."
        operation: checkout.CMD016
      - step: 5
        action: "System confirms discount creation."
        operation: checkout.EVT007
        emotion: satisfied
    user_stories: [checkout.US004]
    delivery_priority: must-have

  - id: checkout.UC005
    name: "Check out in four steps"
    summary: "A shopper turns a cart into a placed order on one page, through the four steps PrestaShop composes."
    description: >
      The buying half of the storefront. Written against OrderController's own composition and
      not against what a checkout usually looks like: four steps, on one URL, the third of them
      added only when the cart is not virtual. Its last step performs no modelled operation,
      which is the honest shape - the control belongs to the chosen payment module and every
      route converges on PaymentModule::validateOrder, whose actionValidateOrder hook is what
      the OrderPlaced event is grounded on. The guest-to-account offer on the confirmation page
      is an alternative flow rather than a step, because a shopper who already has an account
      never sees it.
    primary_actor: orders.ACT001
    goal: "Turn a cart into an order the shop has accepted."
    preconditions:
      - "The cart holds at least one product; an empty cart renders the cart-empty page instead."
      - "The shop is not in catalog mode."
    postconditions:
      - "An order exists with its first state, its invoice if the state carries one, and its confirmation mail sent."
      - "actionValidateOrder has fired, so every payment and notification module has seen the order."
    main_scenario:
      - step: 1
        action: "The shopper reviews the cart, adjusts quantities and applies any voucher, then goes to checkout."
        operation: checkout.CMD011
        screen: checkout.SCR005
        emotion: neutral
      - step: 2
        action: "Personal Information: the shopper signs in, or fills the customer form, or continues as a guest where the shop allows it."
        screen: checkout.SCR006
        actor: orders.ACT001
        emotion: frustrated
        pain_point: "This is the step a shopper who only wanted to buy something meets first, and the one where carts are most often abandoned."
      - step: 3
        action: "Addresses: the shopper picks or enters a delivery address, and an invoice address if it differs."
        screen: checkout.SCR006
        actor: orders.ACT001
        emotion: neutral
        pain_point: "The required fields change with the country, so the form the shopper started filling is not always the form they finish."
      - step: 4
        action: "Shipping Method: the shopper chooses a carrier, and with it the gift-wrapping and recyclable-packaging options."
        operation: checkout.CMD004
        screen: checkout.SCR006
        emotion: neutral
      - step: 5
        action: "Payment: the shopper picks a payment option, approves the shop's conditions and confirms."
        screen: checkout.SCR006
        actor: orders.ACT001
        emotion: satisfied
      - step: 6
        action: "The order is written, its confirmation mail sent, and actionValidateOrder fired; the shopper lands on the confirmation page."
        operation: orders.EVT001
        screen: checkout.SCR007
        emotion: delighted
    alternative_flows:
      - step: 4
        condition: "Every product in the cart is virtual."
        action: "OrderController does not add the shipping step at all, so the shopper sees three steps rather than four."
      - step: 5
        condition: "The shop requires conditions to be approved and the shopper has not ticked them."
        action: "ConditionsToApproveFinder holds the step open; no payment option can be submitted until every condition is approved."
        actor: orders.ACT001
      - step: 6
        condition: "The shopper checked out as a guest."
        action: "The confirmation page offers a password; submitting it calls Customer::transformToCustomer and the guest keeps the account."
        operation: customers.CMD008
    user_stories: [checkout.US008, checkout.US009, checkout.US010, customers.US008]
    processes: [shop.PRC003]
    delivery_priority: must-have
    release_target: "v1.0"
