---
version: "1.0.0"
scope: checkout

execution:
  model: event-driven
  description: "Cart operations dispatch events for price recalculation and rule evaluation."
  rationale: "Each cart mutation triggers cascading recalculations (totals, discounts, shipping estimates) that benefit from event-driven decoupling to keep the write path responsive."

race_conditions:
  - id: checkout.RC001
    name: "Concurrent cart modification"
    description: "The invariant at risk is that a cart's totals match its lines. The two are written separately, so an overlapping change can leave a total that no set of lines produces, and the shopper is quoted a price the shop cannot justify."
    scenario: "Customer adds item while another tab removes an item from same cart."
    impact: "Cart state inconsistent, totals miscalculated."
    likelihood: medium
    mitigation: "Cart row-level locking during modification, recalculate totals atomically."
    affects: [checkout.CMD009, checkout.CMD010]

  - id: checkout.RC002
    name: "Voucher usage race"
    description: "The invariant at risk is the voucher's usage limit, which is the whole of what makes a single-use code single-use. Checking the counter and spending it are two steps, and the limit holds only if nothing runs between them."
    scenario: "Two customers apply the same single-use voucher code simultaneously."
    impact: "Voucher used twice, exceeding usage limit."
    likelihood: low
    mitigation: "Atomic decrement-and-check on voucher usage counter."
    affects: [checkout.CMD014]

ordering:
  - id: checkout.ORD001
    summary: "Cart must have items before voucher can be applied."
    operations: [checkout.CMD014]
    requires: [checkout.CMD009]
