---
version: "1.0.0"
scope: checkout

structural:
  - id: checkout.SR001
    name: "Cart item quantity must be positive"
    description: "Keeps a cart line at or above the smallest quantity the product is sold in."
    logic:
      then: "cartItem.quantity >= 1 AND cartItem.quantity >= product.minimalQuantity"
      when: a product is added to the cart or its quantity in the cart is changed
    modality: necessary
    concepts: [checkout.CN002]
    code_refs:
      - path: "src/Core/Domain/Cart/Exception/MinimalQuantityException.php"
        role: validation
        description: Raised when the quantity is below the minimal quantity of the product or combination.
      - path: src/Core/Domain/Cart/Command/AddProductToCartCommand.php
        role: validation
        description: "Lines 113-118: a quantity of zero or less is refused."
      - path: src/Core/Domain/Cart/Command/UpdateProductQuantityInCartCommand.php
        role: validation
        description: "Lines 142-147: the same check when the quantity changes."
      - path: src/Adapter/Cart/CommandHandler/UpdateProductQuantityInCartHandler.php
        role: validation
        description: "Lines 119-126: below the minimal quantity, MinimalQuantityException is raised."
      - path: tests/Integration/Behaviour/Features/Scenario/Cart/Product/add_standard_product.feature
        role: test
        description: Scenario 'Add product(s) in cart' at line 9.
    summary: A cart line holds at least one unit, and no fewer than the product's minimal quantity.
    fact: CartProduct.quantity >= max(1, Product.minimal_quantity or Combination.minimal_quantity)
    scope: back-office cart editing and the Admin API cart commands
    on_violation:
      action: reject
      message: Quantity must be positive integer. "%s" given.
    examples:
      - input: Two units of an in-stock product are added to an empty cart
        output: The cart holds one line of two units
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: checkout.SR002
    name: "A discount's reduction fits its type"
    description: "Keeps a discount from carrying a reduction its type cannot apply."
    logic:
      when: "a discount is added or updated"
      then: "the reduction satisfies the constraints of the discount's type"
    modality: necessary
    concepts: [checkout.CN004]
    code_refs:
      - path: "src/Core/Domain/Discount/Exception/DiscountConstraintException.php"
        role: implementation
        description: "Lines 11-50: the constraint codes the validator raises."
      - path: "src/Core/Domain/Discount/ValueObject/DiscountType.php"
        role: implementation
        description: "The five discount types: free shipping, cart level, order level, product level and free gift."
      - path: src/Adapter/Discount/Validate/DiscountValidator.php
        role: validation
        description: "Lines 180-262: the checks per discount type; line 187: none for free shipping; lines 205-243: exactly one product-level target and one reduction; lines 246-258: a gift product that requires no customization and has a minimal quantity of 1."
      - path: src/Core/Domain/Discount/Command/AddDiscountCommand.php
        role: validation
        description: "Lines 280-286: a reduction amount below zero is refused when the command is built."
    summary: Each discount type has its own reduction constraints.
    fact: (type = free_shipping => no reduction is checked) AND (type IN {cart_level, order_level} => NOT (amount AND percent) AND amount >= 0 AND 0 <= percent <= 100) AND (type = product_level => exactly one target IN {cheapest product, one product, product segment} AND exactly one of amount, percent) AND (type = free_gift => gift_product set AND gift_product does not require customization AND gift_product.minimal_quantity <= 1)
    scope: discount creation and update in the back office and the Admin API
    on_violation:
      action: reject
      message: Discount can not be amount and percent at the same time
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

validation:
  - id: checkout.VR001
    name: "A voucher starts no later than it ends and applies only within its dates"
    description: "Keeps a voucher usable only during the period the merchant set."
    logic:
      when: "a discount is created or updated, or a voucher is applied to a cart"
      then: "dateFrom <= dateTo when dateTo is set, AND dateFrom <= now AND (dateTo is empty OR now <= dateTo)"
    modality: obligatory
    concepts: [checkout.CN004]
    code_refs:
      - path: "src/Core/Domain/CartRule/Exception/CartRuleValidityException.php"
        role: implementation
        description: The exception a cart rule raises when a validity check fails.
      - path: "src/Core/Domain/Discount/Exception/DiscountConstraintException.php"
        role: implementation
        description: DATE_FROM_GREATER_THAN_DATE_TO, line 15.
      - path: src/Adapter/Discount/Validate/DiscountValidator.php
        role: validation
        description: "Lines 302-311: refuses a start after the end; an empty end is not compared."
      - path: src/Core/Domain/Discount/Command/AddDiscountCommand.php
        role: validation
        description: "Lines 521-528: the same check in the command."
      - path: classes/CartRule.php
        role: validation
        description: "Lines 799-804: a voucher not yet valid, or expired, is not applied."
      - path: tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_validity_date_range.feature
        role: test
        description: "Scenarios at lines 19 and 38: a voucher valid in the future applies; one expired in the past is refused."
      - path: tests/Integration/Behaviour/Features/Scenario/Discount/BO/update_discount_validity_dates.feature
        role: test
        description: Scenario 'Create discount with invalid date range' at line 57.
    summary: The start is not after the end, and a voucher applies only within its dates.
    fact: CartRule.date_from <= CartRule.date_to AND CartRule.date_from <= now AND (CartRule.date_to is null OR now <= CartRule.date_to)
    scope: discount creation and update; applying a voucher to a cart
    on_violation:
      action: reject
      message: Date from cannot be greater than date to.
    examples:
      - input: A discount is created with dateFrom 2026-05-01 and dateTo 2026-04-01
        output: "Refused: date from cannot be greater than date to"
      - input: A voucher whose end date has passed is applied to a cart
        output: "Refused: this voucher has expired"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: checkout.VR002
    name: "A voucher applies only when the cart's products reach its minimum amount"
    description: "Keeps a minimum-spend voucher from applying to a smaller cart."
    logic:
      when: "a voucher with a minimum amount is applied to a cart"
      then: "cart products total (gifts excluded, plus shipping when configured, in the cart currency) >= minimumAmount"
    modality: obligatory
    concepts: [checkout.CN001, checkout.CN004]
    code_refs:
      - path: "src/Core/Domain/Discount/ValueObject/MinimumAmount.php"
        role: implementation
        description: "The minimum amount value object: an amount with its currency and tax flag."
      - path: "src/Core/Domain/CartRule/Exception/CartRuleConstraintException.php"
        role: implementation
        description: The exception the cart rule commands raise on a failed constraint.
      - path: classes/CartRule.php
        role: validation
        description: "Lines 980-1009: the products total, gifts excluded, plus shipping when configured, against the converted minimum."
      - path: tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_with_condition_minimum_amount.feature
        role: test
        description: "Scenario at line 14: refused below the minimum, applied above it."
    summary: The cart's products total reaches the voucher's minimum amount.
    fact: Cart.getOrderTotal(minimum_amount_tax, ONLY_PRODUCTS_WITHOUT_GIFTS) [+ shipping when minimum_amount_shipping] >= convert(CartRule.minimum_amount, minimum_amount_currency)
    scope: applying a voucher to a cart, front office and back office
    on_violation:
      action: reject
      message: The minimum amount to benefit from this promo code is %s.
    examples:
      - input: A voucher with a minimum of EUR 50 is applied to a cart of EUR 30, then the cart is raised above EUR 50
        output: Refused below the minimum; applied once the minimum is reached
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: checkout.VR003
    name: "A voucher with no quantity left, or used up by the customer, is not applied"
    description: "Keeps a voucher within the number of uses the merchant allowed, overall and per customer."
    logic:
      when: "a voucher is applied to a cart"
      then: "(quantity is empty OR quantity > 0) AND (quantityPerUser is empty OR uses by this customer, this one included, <= quantityPerUser)"
    modality: obligatory
    concepts: [checkout.CN004]
    code_refs:
      - path: "src/Core/Domain/CartRule/Exception/CartRuleConstraintException.php"
        role: implementation
        description: The exception the cart rule commands raise on a failed constraint.
      - path: "src/Core/Domain/Discount/Exception/DiscountConstraintException.php"
        role: implementation
        description: INVALID_QUANTITY and INVALID_QUANTITY_PER_USER, lines 16-17, raised for a negative limit.
      - path: classes/CartRule.php
        role: validation
        description: Lines 793-796 refuse a voucher with no quantity left; lines 806-839 count the customer's uses and refuse beyond quantity_per_user.
      - path: tests/Integration/Behaviour/Features/Scenario/Discount/FO/discount_with_usage_limits.feature
        role: test
        description: Scenario 'Discount that is available only one time per user' at line 133.
      - path: tests/Integration/Behaviour/Features/Scenario/Discount/BO/add_and_update_discount_quantities.feature
        role: test
        description: "Scenario at line 30: both limits are null by default, so unlimited."
    summary: Remaining quantity above zero and per-customer uses within the limit.
    fact: CartRule.quantity IS NULL OR CartRule.quantity > 0; CartRule.quantity_per_user IS NULL OR usedByCustomer + 1 <= CartRule.quantity_per_user
    scope: applying a voucher to a cart; the per-customer limit is checked once the cart has a customer
    on_violation:
      action: reject
      message: You cannot use this voucher anymore (usage limit reached)
    examples:
      - input: A voucher allows one use per customer; the customer has used it once and applies it again
        output: "Refused: the usage limit is reached"
      - input: A discount is created without quantity limits
        output: Both limits are empty, so the discount is unlimited
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: checkout.VR004
    name: "A catalog price rule applies only from its from-quantity"
    description: "Keeps a quantity discount from applying below the quantity it was set for."
    logic:
      when: "the price of a product in a cart is calculated"
      then: "orderedQuantity >= catalogPriceRule.fromQuantity, or fromQuantity <= 1"
    modality: obligatory
    concepts: [checkout.CN006]
    summary: A catalog price rule takes effect from its from-quantity.
    fact: "IF(SpecificPrice.from_quantity > 1, SpecificPrice.from_quantity, 0) <= q, where q = the cart line's quantity when PS_QTY_DISCOUNT_ON_COMBINATION is set, else MAX(1, the product's quantity over all its combinations in the cart)"
    scope: price calculation of products covered by a catalog price rule
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
    code_refs:
      - path: classes/SpecificPriceRule.php
        role: implementation
        description: "Lines 290-300: applying a rule writes a specific price with its from_quantity; line 35 validates it as an unsigned integer."
      - path: classes/SpecificPrice.php
        role: implementation
        description: "Lines 557-559: a specific price is selected only when its from_quantity, if above 1, is not above the quantity; line 559: the quantity is the cart line's when PS_QTY_DISCOUNT_ON_COMBINATION is set, else the product's in the cart."
      - path: classes/Product.php
        role: implementation
        description: "Lines 3448-3460: getPriceStatic sums the quantity of the product over all its combinations in the cart."

  - id: checkout.VR005
    name: "Cannot delete ordered cart"
    description: "Keeps the cart an order was placed from, which the order references."
    logic:
      when: "a cart is deleted, alone or in bulk"
      then: "no order references the cart"
    modality: prohibited
    concepts: [checkout.CN001]
    code_refs:
      - path: "src/Core/Domain/Cart/Exception/CannotDeleteOrderedCartException.php"
        role: validation
        description: The exception both deletion handlers raise.
      - path: src/Adapter/Cart/CommandHandler/DeleteCartHandler.php
        role: validation
        description: "Lines 45-47: a cart an order references is not deleted."
      - path: src/Adapter/Cart/CommandHandler/BulkDeleteCartHandler.php
        role: validation
        description: "Lines 64-66: the same check per cart in a bulk deletion."
      - path: tests/Integration/Behaviour/Features/Scenario/Cart/CartRule/BackOffice/delete_cart_from_bo.feature
        role: test
        description: "Scenarios at lines 23 and 43: deleting an ordered cart, alone or in bulk, is refused."
    summary: An ordered cart is kept.
    fact: NOT EXISTS Order o WHERE o.id_cart = cart.id
    scope: back-office cart deletion and bulk deletion
    on_violation:
      action: reject
      message: Cart "%s" with order cannot be deleted.
    examples:
      - input: An order is placed from a cart, then the cart is deleted
        output: "Refused: the cart still exists because it is already ordered"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

classification:
  - id: checkout.CR001
    name: "A cart's status is ordered, not ordered or abandoned"
    description: "The status is not stored: it is read from the cart's orders and age, so an abandoned cart reads as ordered once an order is placed from it."
    logic:
      when: "a cart's status is read"
      then: "ordered if an order references the cart; otherwise abandoned if it was created more than 24 hours ago; otherwise not ordered"
    concepts: [checkout.CN001]
    summary: Ordered if an order references it; otherwise abandoned after 24 hours, else not ordered.
    fact: status = IF(order exists for cart, 'ordered', IF(now - Cart.date_add > 86400 s, 'abandoned', 'not-ordered'))
    scope: the back-office cart list and its status filter; the abandoned-cart notification
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
    code_refs:
      - path: src/Core/Grid/Query/CartQueryBuilder.php
        role: implementation
        description: "Lines 86-95: the status is computed from the order and the time since the cart was created."
      - path: src/Core/Domain/Cart/CartStatus.php
        role: model
        description: "Lines 19-35: the three statuses and the 86400-second expiration time."
      - path: src/Core/Grid/Data/Factory/CartGridDataFactory.php
        role: implementation
        description: "Line 83: an ordered cart is shown as not removable."

  - id: checkout.CR002
    name: "Vouchers apply by priority, and of two that cannot combine the lower priority number stays"
    description: "Settles which voucher stays when a cart is offered vouchers that cannot be combined."
    logic:
      when: "several vouchers are eligible for a cart"
      then: "they apply in ascending priority; of two non-combinable vouchers, the one with the lower priority number stays (a tie keeps the one already in the cart)"
    concepts: [checkout.CN004]
    summary: Lower priority number first; of two non-combinable vouchers, the better priority stays.
    fact: ORDER BY CartRule.priority ASC; NOT combinable(a, b) => keep(argmin(priority), the existing one on a tie)
    scope: applying vouchers to a cart and computing the cart total
    on_violation:
      action: reject
      message: "This voucher is not combinable with an other voucher already in your cart: %s"
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
    code_refs:
      - path: classes/Cart.php
        role: implementation
        description: "Lines 485-488: cart rules are read in ascending priority and, with the new discount system, sorted by type, priority and creation date; lines 1482-1525 apply the compatibility decision and remove the replaced rules."
      - path: classes/CartRule.php
        role: validation
        description: "Lines 1040-1053: of two non-combinable vouchers, the one in the cart with an equal or lower priority number refuses the new one; otherwise it is removed."

transition:
  - id: checkout.TR003
    name: "A cart becomes ordered when an order is placed from it"
    concept: checkout.CN001
    from: "not-ordered"
    to: "ordered"
    guard:
      when: "an order is created that references the cart"
    description: "The transition is read, not recorded: no field on the cart changes."
    summary: An order on the cart makes it ordered.
    fact: EXISTS Order o WHERE o.id_cart = cart.id
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
    code_refs:
      - path: classes/PaymentModule.php
        role: implementation
        description: "Line 1096: the order created from a cart records the cart id."
      - path: classes/Cart.php
        role: implementation
        description: "Lines 1921-1927: orderExists, the check that a cart has an order."
      - path: src/Core/Grid/Query/CartQueryBuilder.php
        role: implementation
        description: "Lines 86-95: a cart with an order reads as ordered."

  - id: checkout.TR004
    name: "A cart not ordered within 24 hours of its creation is abandoned"
    concept: checkout.CN001
    from: "not-ordered"
    to: "abandoned"
    guard:
      when: "more than 24 hours have passed since the cart was created and no order references it"
    description: "The age counts from the cart's creation, not from its last activity."
    summary: No order 24 hours after creation makes a cart abandoned.
    fact: now - Cart.date_add > 86400 s AND NOT EXISTS Order o WHERE o.id_cart = cart.id
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
    code_refs:
      - path: src/Core/Domain/Cart/CartStatus.php
        role: model
        description: "Lines 29-35: abandoned_cart and the 86400-second expiration time."
      - path: src/Core/Grid/Query/CartQueryBuilder.php
        role: implementation
        description: "Lines 86-95: a cart without an order created more than the expiration time ago reads as abandoned."

derivation:
  - id: checkout.DR001
    name: "A cart total is its products less discounts plus shipping and wrapping"
    description: "Fixes how a cart's payable total is built from its parts."
    logic:
      then: "cart.total = SUM(line totals) - discounts + shipping + wrapping"
      when: the cart total is computed
    concepts: [checkout.CN001, checkout.CN002]
    summary: Products less discounts plus shipping plus wrapping.
    fact: Cart.total = round(rowTotalWithoutDiscount) - round(discountTotal) + round(shippingFees) + round(wrappingFees)
    scope: cart and order total computation
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
    code_refs:
      - path: src/Core/Cart/Calculator.php
        role: implementation
        description: "Lines 153-188: products, less discounts, plus shipping, plus wrapping, each rounded."
