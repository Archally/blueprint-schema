# Blueprint quality-gate configuration - prestashop (the in-repo golden reference).
#
# This model is the calibration anchor for most dimensions, but it is NOT uniformly
# strong, and the spec deliberately does not lower its bars to pretend otherwise.
# Where the golden is genuinely weak, it says so here - visibly, with a reason and an
# expiry - rather than the corpus threshold being slackened to hide the gap.

# No deferrals.
#
# The one this file carried, on `domain.command.exchange`, was retired 2026-09-19.
# It described 251 commands with no exchange or dispatch binding at all, and it was retired
# because the gap closed, not because the bar moved: the metric now reads 100% against its
# 70% bar, 353 of 353 commands, and the shared quality spec
# is byte-identical to what it was before that work started. Of the model's 497 commands and
# queries, 202 carry a real Admin API route verified against the 152 uriTemplates the code
# declares, and 295 carry `dispatch: inprocess` because PrestaShop dispatches them through
# an in-process command bus and they have no wire transport of their own. None carries both,
# and none carries neither.

# Ratchet - regenerate with `--update-baseline` after an improvement run.
# Populated 2026-09-19, which is the moment the deferral's own note
# was waiting for: the score is no longer about to change.
