            evidence:
              - kind: codebase-analysis
                source: "src/Core/Domain/Supplier, src/Core/Domain/Manufacturer, src/Core/Domain/Product/Pack, catalog/supply-chain.domain.yaml"
                date: "2026-09-19"
                summary: >
                  Supplier, Manufacturer and Pack are separate code domains modelled in one catalog
                  shard. Core carries no purchase order and no warehouse receipt, which is why the
                  maturity is developing rather than established: sourcing is recorded, not managed.
                confidence_impact: supports
        realized_in: [DMN002]

      # Level 2: selling it for less, on purpose
      - id: CAP100
        name: "Promotion & Discount Management"
        level: 2
        description: >
          Ability to sell below list price deliberately and in a controlled way: cart rules a
          shopper applies with a voucher code, catalog price rules that cut a whole segment's price,
          and specific prices set on one product for one shop, currency, country or customer group.
          Three code domains serve this ability.
        operations:
          - checkout.CMD016
          - checkout.CMD017
          - checkout.CMD018
          - checkout.CMD019
          - checkout.CMD020
          - checkout.CMD021
          - checkout.CMD022
          - checkout.CMD014
