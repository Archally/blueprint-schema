---
version: "1.2.0"
tags: [sell-and-fulfill]

# The capabilities a merchant works through to have something to sell and to get it delivered.
# Shorter than shop-and-buy by design: a merchant-side ability tends to be one broad thing the
# back office does, where a shopper-side ability splits into the distinct moments of a purchase.
# Where a capability here does decompose it carries children; where it does not, the flat entry
# is the whole truth rather than an unfinished one.
#
# Every capability below is a level-2 member of CAP105 Merchandising & Fulfilment, the family
# this file holds; their own children are level 3.
#
# `realized_in` states each main capability's domain default. The original representative
# `operations` listings remain, with split-domain exceptions completed where the modeled scope
# supports them. An explicit listing displaces module attribution model-wide; realization does
# not pass between parent and child capabilities.

capabilities:
  # Level 1: the family - the merchant's side of commerce
  - id: CAP105
    name: "Merchandising & Fulfilment"
    level: 1
    description: >
      The merchant's side of commerce: the abilities a merchant works through to have something
      to sell, to sell it below list price on purpose, to charge for it in the right money and
      tax, and to get it delivered. The family is stable because its members all serve the
      merchant rather than the shopper or the platform. They serve the Sell & Fulfill value
      stream (VS002) and appear in Shop & Buy (VS001) as well, because a shopper buys what the
      merchant set up: a value stream crosses the families, a family does not follow one stream.
    owned_by:
      department: DPT001
    maturity: established
    strategic_importance: critical
    delivery_priority: must-have
    discovery_stage: validated
    certainty: confirmed
    evidence:
      - kind: stakeholder-signoff
        source: "Owner of this example model"
        date: "2026-10-01"
        summary: >
          The owner agreed that the merchant-side, shopper-side and platform capabilities form
          three stable families and that each family is stated as a parent capability, so a
          view of the map groups them because the model says so.
        confidence_impact: supports
    children:
      # Level 2: having something to sell
      - id: CAP005
        name: "Catalog Management"
        level: 2
        description: >
          Ability to define what the shop sells and how it is arranged: products and their type,
          the category tree they hang from, the images and attachments that describe them, and the
          duplication and bulk editing a merchant needs to keep a large catalogue current.
        goal_refs:
          - catalog.GL001
          - catalog.GL002
        operations:
          - catalog.CMD001
          - catalog.CMD002
          - catalog.CMD003
          - catalog.CMD005
          - catalog.CMD008
          - catalog.CMD025
          - catalog.CMD026
          - catalog.CMD101
          - catalog.CMD016
          - catalog.CMD420
          - catalog.CMD421
          - catalog.QRY001
          - catalog.QRY002
        owned_by:
          team: TM002
        maturity: optimized
        strategic_importance: critical
        delivery_priority: must-have
        discovery_stage: committed
        certainty: confirmed
        evidence:
          - kind: codebase-analysis
            source: "src/Core/Domain/Product, src/Core/Domain/Category, catalog/product-core.domain.yaml"
            date: "2026-09-19"
            summary: >
              The Product folder and its sub-folders hold 79 command and query classes and 83
              exception classes, the densest domain in the codebase. Every one is modelled in the
              catalog slice with a resolving code reference after phase 1.
            confidence_impact: supports
        children:
          - id: CAP102
            name: "Product Variants & Options"
            level: 3
            description: >
              Ability to sell one product in several forms: attribute groups and their attributes,
              the combinations generated from them, the features that describe a product without
              varying it, and the customization fields a shopper fills in at purchase time.
            operations:
              - catalog.CMD011
              - catalog.CMD012
              - catalog.CMD013
              - catalog.CMD032
