          - checkout.EVT008
          - checkout.EVT009
          - checkout.CMD023
          - checkout.QRY007
          - checkout.QRY008
          - checkout.EVT010
          - checkout.EVT011
          - checkout.EVT012
          - orders.CMD011
        owned_by:
          team: TM003
        maturity: established
        strategic_importance: high
        delivery_priority: must-have
        discovery_stage: validated
        certainty: probable
        evidence:
          - kind: codebase-analysis
            source: "src/Core/Domain/Discount, src/Core/Domain/CartRule, src/Core/Domain/Product/SpecificPrice, checkout/discount.domain.yaml"
            date: "2026-09-19"
            summary: >
              Discounts, catalog price rules and specific prices are authored in three slices
              (checkout, catalog, orders) and all three reduce what a shopper pays. Nothing in the
              capability map named the ability before, so the operations existed with no strategic
              statement above them.
            confidence_impact: supports

      # Level 2: getting it there
      - id: CAP010
        name: "Shipping & Delivery"
        level: 2
        description: >
          Ability to offer a delivery method and act on the one a shopper chooses: carriers with
          their weight or price ranges per zone and their tax treatment, and the shipments an order
          is split into, merged from, switched between carriers, and finally fulfilled.
        operations:
          - shipping.CMD001
          - shipping.CMD008
          - shipping.CMD009
          - shipping.CMD010
          - shipping.CMD011
          - shipping.CMD015
          - shipping.CMD017
          - shipping.CMD018
          - shipping.QRY003
          - shipping.QRY004
          - shipping.QRY005
        owned_by:
          team: TM005
        maturity: established
        strategic_importance: high
        delivery_priority: must-have
        discovery_stage: committed
        certainty: confirmed
        evidence:
          - kind: codebase-analysis
            source: "src/Core/Domain/Carrier, src/Core/Domain/Shipment, shipping/carrier.domain.yaml"
            date: "2026-09-19"
            summary: >
              Carrier configuration and the Shipment aggregate are separate code domains in one
              slice; Shipment's split, merge and switch-carrier commands are what make fulfilment a
              capability rather than a status field on the order.
            confidence_impact: supports
        realized_in: [DMN009]

      # Level 2: selling across borders
      - id: CAP011
        name: "Multi-Currency & Tax"
        level: 2
        description: >
          Ability to charge the right amount in the right money: currencies with their exchange
          rates and a shop default, taxes, and the tax rules grouped per country and state that
          decide which tax a delivery address attracts.
        goal_refs:
