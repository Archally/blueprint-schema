              - catalog.EVT200
              - catalog.QRY105
              - catalog.QRY106
            owned_by:
              team: TM002
            maturity: established
            strategic_importance: high
            delivery_priority: must-have
            discovery_stage: validated
            certainty: probable
            evidence:
              - kind: codebase-analysis
                source: "src/Core/Domain/Product/Combination, src/Core/Domain/AttributeGroup, src/Core/Domain/Feature"
                date: "2026-09-19"
                summary: >
                  Combinations, attribute groups and features are three separate code domains whose
                  commands only make sense together: a combination is the cross-product of attribute
                  values, and a feature is the descriptor that deliberately does not generate one.
                confidence_impact: supports

          - id: CAP101
            name: "Supply Chain & Sourcing"
            level: 3
