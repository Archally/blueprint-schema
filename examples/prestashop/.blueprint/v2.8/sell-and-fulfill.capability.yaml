          - international.CMD005
          - international.CMD006
          - international.CMD023
          - international.CMD027
          - international.CMD034
          - international.QRY002
          - international.QRY003
          - international.QRY010
          - international.QRY012
        owned_by:
          team: TM006
        maturity: established
        strategic_importance: critical
        delivery_priority: must-have
        discovery_stage: committed
        certainty: confirmed
        evidence:
          - kind: codebase-analysis
            source: "src/Core/Domain/Currency, src/Core/Domain/Tax, src/Core/Domain/TaxRulesGroup, international/taxation.domain.yaml"
            date: "2026-09-19"
            summary: >
              Currency, Tax and TaxRulesGroup are three code domains; the TaxRulesGroup folder alone
              holds 13 command and query classes because a tax rule is scoped by country, state and
              postcode range rather than by a single rate.
            confidence_impact: supports
        children:
          - id: CAP012
            name: "Localization"
            level: 3
            description: >
