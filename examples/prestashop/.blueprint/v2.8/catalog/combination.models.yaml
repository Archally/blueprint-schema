---
version: "1.0.0"
scope: catalog
tags: [combination, models]

components:
  schemas:
    GenerateCombinationsPayload:
      x-model-id: MDL007
      purpose: command-payload
      description: "Request body for generating product combinations from selected attribute groups and values."
      represents:
        - concept: catalog.CN003
          kind: api
      type: object
      required: [productId, attributes]
      properties:
        productId:
          type: integer
          description: "Product to generate combinations for."
          example: 42
        attributes:
          type: array
          description: "Attribute group/value pairs to combine."
          items:
            type: object
            properties:
              attributeGroupId:
                type: integer
                description: "One axis of the variant matrix, such as Size or Color. The generator makes the cartesian product of the groups listed here, so adding a third group multiplies the combinations rather than adding to them."
                example: 1
              attributeIds:
                type: array
                items:
                  type: integer
                description: "Selected attribute values from this group."
                example: [1, 2, 3]
          example:
            - attributeGroupId: 1
              attributeIds: [1, 2, 3]
            - attributeGroupId: 2
              attributeIds: [4, 5]
      code_refs:
        - path: "src/Core/Domain/Product/Combination/Command/GenerateProductCombinationsCommand.php"
          role: schema

    UpdateCombinationPayload:
      x-model-id: MDL008
      purpose: command-payload
      description: "Partial update payload for a combination's price impact, stock, reference, EAN, weight."
      represents:
        - concept: catalog.CN003
          kind: api
          mapping:
            strategy: property-map
            property_map:
              reference: CAT019
              priceImpact: CAT020
              quantity: CAT021
              ean13: CAT022
      type: object
      required: [combinationId]
      properties:
        combinationId:
          type: integer
          description: "Which variant the edit targets. Its attribute values are fixed at generation and are not editable here; this call changes the variant's own stock, prices and codes."
          example: 7
        reference:
          type: string
          description: "SKU reference for this variant."
          example: "LAPTOP-15-BLK-M"
        impactOnPrice:
          type: string
          description: "Price offset from base product price (decimal)."
          example: "50.000000"
        quantity:
          type: integer
          description: "Available stock for this variant."
          example: 25
        minimalQuantity:
          type: integer
          description: "Minimum order quantity."
          example: 1
        weight:
          type: string
          description: "Weight (decimal, kg)."
          example: "2.200000"
        ean13:
          type: string
          description: "EAN-13 barcode."
          example: "5901234123464"
        isbn:
          type: string
          description: "Book number for this variant, at most 32 characters and checked by isIsbn. Empty for anything that is not a book, which is most of a general catalog."
          example: "9783161484100"
        upc:
          type: string
          description: "Twelve-digit North American barcode, checked by isUpc. Empty on a shop that only uses EAN-13, and the two are stored separately rather than converted."
          example: "012345678905"
        mpn:
          type: string
          description: "Manufacturer Part Number."
          example: "MPN-LAP-2026-M"
        isDefault:
          type: boolean
          description: "Whether this is the default combination."
          example: false
        lowStockThreshold:
          type: integer
          description: "Low stock alert threshold."
          example: 5
        lowStockAlertEnabled:
          type: boolean
          description: "Whether low stock alert is active."
          example: true
        availableDate:
          type: string
          format: date
          description: "Expected availability date."
          example: "2026-04-01"
      code_refs:
        - path: "src/Core/Domain/Product/Combination/Command/UpdateCombinationCommand.php"
          role: schema

    CombinationResource:
      x-model-id: MDL009
      purpose: read-model
      description: "Full combination representation for editing form."
      represents:
        - concept: catalog.CN003
          kind: api
          mapping:
            strategy: property-map
            property_map:
              combinationId: CAT018
              reference: CAT019
              impactOnPrice: CAT020
              quantity: CAT021
              ean13: CAT022
      type: object
      properties:
        combinationId:
          type: integer
          description: "Unique combination identifier."
          example: 7
        productId:
          type: integer
          description: "Parent product identifier."
          example: 42
        reference:
          type: string
          description: "The variant's own SKU, up to 64 characters and free text rather than a checked code. It overrides the product's reference on picking lists and invoices, which is why a variant usually has one even when the product does too."
          example: "LAPTOP-15-BLK-M"
        impactOnPrice:
          type: string
          description: "What this variant adds to or takes off the product's base price, as a signed decimal. It is an offset, not a price: changing the product's price moves every variant with it."
          example: "50.000000"
        impactOnWeight:
          type: string
          description: "What this variant adds to the product's weight, in the shop's weight unit. The carrier's weight ranges are matched against the sum, so a heavy variant can land in a different shipping band from its siblings."
          example: "0.100000"
        quantity:
          type: integer
          description: "Available stock."
          example: 25
        minimalQuantity:
          type: integer
          description: "Minimum order quantity."
          example: 1
        ean13:
          type: string
          description: "Thirteen-digit European barcode for this variant, checked by isEan13. Distinct per variant because a size or colour is a different retail item to a scanner."
          example: "5901234123464"
        isbn:
          type: string
          description: "Book number for this variant, at most 32 characters. Empty for anything that is not a book."
          example: "9783161484100"
        upc:
          type: string
          description: "Twelve-digit North American barcode. Stored beside ean13 rather than derived from it, so a shop selling in both markets carries both."
          example: "012345678905"
        mpn:
          type: string
          description: "The manufacturer's own part number, up to 40 characters. It is what a supplier order or a marketplace feed is matched on, and unlike the reference it is not the shop's to choose."
          example: "MPN-LAP-2026-M"
        isDefault:
          type: boolean
          description: "Default combination flag."
          example: true
        lowStockThreshold:
          type: integer
          description: "Quantity at or below which this variant counts as running out. Nullable in the database: no value means the shop's global threshold applies instead of none."
          example: 5
        lowStockAlertEnabled:
          type: boolean
          description: "Whether crossing the threshold above sends the shop an email. Separate from the threshold so a value can be set and watched silently."
          example: true
        availableDate:
          type: string
          format: date
          description: "When an out-of-stock variant is expected back. It is shown to the shopper on a backorder-enabled product, so a wrong date here is a promise the shop has made."
          example: "2026-04-01"
        attributes:
          type: array
          description: "The one value per group that defines this variant, which is what distinguishes it from its siblings. Fixed when the combination is generated: a different pair of values is a different combination, not an edit to this one."
          example:
            - attributeGroupId: 1
              attributeGroupName: "Size"
              attributeId: 2
              attributeName: "M"
          items:
            type: object
            properties:
              attributeGroupId:
                type: integer
                description: "The axis this value belongs to, such as Size."
                example: 1
              attributeGroupName:
                type: string
                description: "The group's name in the employee's language, carried here so the back office can label the variant without a second lookup."
                example: "Size"
              attributeId:
                type: integer
                description: "The value chosen on that axis."
                example: 2
              attributeName:
                type: string
                description: "The value's name in the employee's language, which is what the attribute summary line is built from."
                example: "M"
        imageIds:
          type: array
          description: "Product images associated with this combination."
          items:
            type: integer
          example: [14, 15]
      code_refs:
        - path: "src/Core/Domain/Product/Combination/QueryResult/CombinationForEditing.php"
          role: schema

    CombinationListItem:
      x-model-id: MDL010
      purpose: read-model
      description: "Lightweight combination summary for paginated lists."
      represents:
        - concept: catalog.CN003
          kind: api
          mapping:
            strategy: property-map
            property_map:
              combinationId: CAT018
              reference: CAT019
      type: object
      properties:
        combinationId:
          type: integer
          description: "The variant this row stands for, used to link to its edit form. A product's list is keyed on this rather than on the attribute summary, which is not unique across languages."
          example: 7
        attributeSummary:
          type: string
          description: "Formatted attribute summary (e.g. 'Size: M, Color: Black')."
          example: "Size: M, Color: Black"
        reference:
          type: string
          description: "The variant's own SKU, shown in the list because it is what a warehouse search is run on."
          example: "LAPTOP-15-BLK-M"
        impactOnPrice:
          type: string
          description: "The signed offset this variant applies to the base price. Shown beside the computed final price below so an employee can see which of the two was edited."
          example: "50.000000"
        finalPrice:
          type: string
          description: "Computed final price."
          example: "1049.990000"
        quantity:
          type: integer
          description: "Available stock."
          example: 25
        isDefault:
          type: boolean
          description: "Default combination."
          example: true
        imageUrl:
          type: string
          description: "Combination-specific image URL."
          example: "/img/p/42/14-small_default.jpg"
