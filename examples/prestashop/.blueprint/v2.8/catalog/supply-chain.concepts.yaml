---
version: "1.0.0"
scope: catalog
tags: [supply-chain]

concepts:
  - id: catalog.CN008
    name: "Manufacturer"
    description: "The brand or manufacturer of a product. Products reference a single manufacturer."
    stereotype: entity
    attributes:
      manufacturerId:
        id: CAT023
        description: "Unique manufacturer identifier. Products carry it as id_manufacturer, and an image file named after it is the brand logo."
        example: "1"
      name:
        id: CAT024
        description: "Manufacturer or brand name, unique per shop and shown on the storefront brand page."
        example: "Lenovo"
    code_refs:
      - path: "src/Core/Domain/Manufacturer/"
        role: model
    tags: [entity]

  - id: catalog.CN009
    name: "Supplier"
    description: "External supplier who provides products. Products can have multiple suppliers with per-supplier pricing."
    stereotype: entity
    attributes:
      supplierId:
        id: CAT025
        description: "Unique supplier identifier. Deleting a supplier first removes the product_supplier rows that carry it."
        example: "2"
      name:
        id: CAT026
        description: "Supplier company name, unique per shop and shown on the storefront supplier page."
        example: "TechParts Distribution"
    code_refs:
      - path: "src/Core/Domain/Supplier/"
        role: model
    tags: [entity]
