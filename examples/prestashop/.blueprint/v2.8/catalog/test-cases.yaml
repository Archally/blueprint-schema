---
version: "1.1.0"
scope: catalog

happy_path:
  - id: catalog.TC001
    name: "Create product - happy path"
    summary: "Valid product data creates product with draft status successfully."
    validates:
      operations: [catalog.CMD001, catalog.EVT001]
      rules: [catalog.SR001]
    contract:
      kind: openapi
      file: catalog-api
    given:
      description: "Product with name, description, price=999.99, type=standard."
    expected_result:
      status: success
      code: 201
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/add_product.feature"
        role: test
        description: "Scenario 'I add a product with basic information' (line 15) and its multishop twin (line 28)."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Product/add_product.feature"
          date: "2026-09-19"
          summary: >-
            Scenario 'I add a product with basic information' adds a standard product with a name
            and asserts it exists with that name and type. It exercises AddProductCommand through
            the command bus, which is catalog.CMD001. The scenario asserts the creation; the
            status code 201 in this test case is the Admin API's, not the Behat suite's.
          confidence_impact: supports

  - id: catalog.TC002
    name: "Search products - keyword match"
    summary: "Search by product name returns the matching products."
    validates:
      operations: [catalog.QRY001]
    given:
      description: "Catalog with 100 products. Search for 'laptop'."
      state:
        catalogSize: 100
        query: "laptop"
    expected_result:
      status: success
    note: >-
      No test in the suite measures search latency and the model declares no SLO for this
      query, so this case asserts the result and not a timing.
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Context/Domain/ProductFeatureContext.php"
        role: test
        description: "getProductIdByName (line 107) dispatches SearchProducts; the product Behat suite resolves references through it."
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Context/Domain/ProductFeatureContext.php line 107"
          date: "2026-09-19"
          summary: >-
            SearchProducts is dispatched on every product scenario that names a product by name,
            so the happy path runs constantly. It is exercised rather than asserted: no scenario
            states what the search should return for a phrase.
          confidence_impact: supports
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            No test asserts search semantics for catalog.QRY001. The nearest named suite,
            Product/search_products_for_association.feature, exercises the DIFFERENT query
            SearchProductsForAssociation and is deliberately not cited here.
          confidence_impact: weakens

  - id: catalog.TC003
    name: "Generate combinations - happy path"
    summary: "Generating combinations for a valid product creates all permutations."
    validates:
      operations: [catalog.CMD011, catalog.EVT004]
      rules: [catalog.CR002]
    given:
      description: "Product with type=combinations, 2 attribute groups (Size:S,M,L; Color:Red,Blue)."
      state:
        productType: combinations
        groups: 2
        valuesPerGroup: [3, 2]
    expected_result:
      status: success
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/Combination/generate_combinations.feature"
        role: test
        description: "Scenario 'Generate product combinations' (line 26)."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Product/Combination/generate_combinations.feature"
          date: "2026-09-19"
          summary: >-
            Scenario 'Generate product combinations' generates the cartesian product of Size and
            Color and asserts every named combination exists with its attribute pair, which is
            the assertion this test case makes.
          confidence_impact: supports

  - id: catalog.TC004
    name: "Add category - happy path"
    summary: "Creating a category under a parent succeeds and its depth is computed from that parent."
    validates:
      operations: [catalog.CMD025, catalog.EVT009]
      rules: [catalog.SR002]
    given:
      description: "A parent category whose level_depth is 3."
    expected_result:
      status: success
      code: 201
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Category/category_management.feature"
        role: test
        description: "Scenario 'Add new category' (line 26) creates a category under a parent and asserts its stored details."
      - path: "classes/Category.php"
        role: implementation
        description: "calcLevelDepth and the recompute in add/update - the source of the depth half of this assertion."
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Category/category_management.feature line 26"
          date: "2026-09-19"
          summary: >-
            The scenario asserts the creation under a named parent and every stored field it was
            given. It does NOT assert level_depth, so the test covers the first half of this case.
          confidence_impact: supports
        - kind: codebase-analysis
          source: "classes/Category.php"
          date: "2026-09-19"
          summary: >-
            The depth half comes from the code, not from a test: Category::add calls
            calcLevelDepth when level_depth is unset, Category::update recomputes it when the
            stored value disagrees, and the field definition carries 'setter' => false.
          confidence_impact: supports

  - id: catalog.TC005
    name: "Add specific price - percentage discount"
    summary: "Creating a 20% discount specific price succeeds."
    validates:
      operations: [catalog.CMD021, catalog.EVT007]
      rules: [catalog.VR003]
    given:
      description: "Product exists, reduction=20, reductionType=percentage."
    expected_result:
      status: success
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/SpecificPrice/add_specific_price.feature"
        role: test
        description: "Scenario 'I add a specific price with percent reduction to product' (line 40)."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Product/SpecificPrice/add_specific_price.feature"
          date: "2026-09-19"
          summary: >-
            Scenario 'I add a specific price with percent reduction to product' adds a percentage
            specific price and asserts the stored reduction type and value - the same assertion
            this test case makes.
          confidence_impact: supports

edge_cases:
  - id: catalog.EC001
    name: "Regenerating combinations creates no duplicates"
    summary: "Generating combinations again over the same attribute values adds nothing and loses nothing."
    validates:
      operations: [catalog.CMD011]
      rules: [catalog.VR004]
    given:
      description: >-
        A product whose combinations were already generated for Size [S,M] and Color
        [White,Black,Blue]. A duplicate attribute set does not fail: CombinationCreator looks
        the pair up with findMatchingCombinationId and reuses the existing combination, so
        regeneration is idempotent and any reference already set on a combination survives it.
    expected_result:
      status: success
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/Combination/generate_combinations.feature"
        role: test
        description: "Scenario 'Generate product combinations does not create duplicates' (line 64)."
      - path: "src/Adapter/Product/Combination/Create/CombinationCreator.php"
        role: implementation
        description: "findMatchingCombinationId (line 245) is the duplicate avoidance; nothing raises a conflict."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Product/Combination/generate_combinations.feature line 64"
          date: "2026-09-19"
          summary: >-
            The scenario regenerates over the same attribute values, asserts the same six
            combinations and no more, then updates two references and asserts they persist. It
            asserts success, not a conflict.
          confidence_impact: supports
        - kind: codebase-analysis
          source: "src/Adapter/Product/Combination/Create/CombinationCreator.php"
          date: "2026-09-19"
          summary: >-
            The class raises InvalidProductTypeException and CannotGenerateCombinationException
            only. There is no duplicate-combination conflict to raise, which is why the 409 this
            case used to assert could not have been observed.
          confidence_impact: invalidates

  - id: catalog.EC002
    name: "Deep nesting is accepted and the depth follows the parent"
    summary: "Creating a category under an already deep parent succeeds and its depth follows that parent."
    validates:
      operations: [catalog.CMD025]
      rules: [catalog.SR002]
    given:
      description: >-
        A parent category whose level_depth is 10. PrestaShop enforces no maximum nesting
        depth, so what this boundary shows is the derivation - the new category's level_depth is
        its parent's plus one, whatever that number is.
    expected_result:
      status: success
      code: 201
    code_refs:
      - path: "classes/Category.php"
        role: implementation
        description: "calcLevelDepth, and the absence of any maximum-depth guard."
      - path: "src/Core/Domain/Category/CategorySettings.php"
        role: implementation
        description: "The constants a category is really constrained by: title, link-rewrite and description lengths. No depth constant."
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "classes/Category.php, src/Core/Domain/Category/CategorySettings.php"
          date: "2026-09-19"
          summary: >-
            Neither file declares a maximum depth; the only maxDepth in the category
            code is a rendering argument on a tree-building helper. The derivation is in
            calcLevelDepth.
          confidence_impact: supports
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            Modeler-derived from code. No test in tests/ creates a category at depth 10 or asserts
            level_depth at any depth, so nothing automated confirms the boundary behaviour.
          confidence_impact: weakens

  - id: catalog.EC003
    name: "Generating combinations on a non-combinations product is refused"
    summary: "A standard, pack or virtual product rejects combination generation and keeps its type."
    validates:
      operations: [catalog.CMD011]
    given:
      description: >-
        A product of type standard, asked to generate combinations for Size [S,M] and Color
        [White,Black,Blue]. No guard caps the number of combinations a generation produces -
        neither GenerateProductCombinationsHandler nor CombinationCreator counts the
        permutations. The boundary the code enforces on this command is the product type, so
        that is what this case asserts.
    expected_result:
      status: failure
    code_refs:
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/Combination/forbidden_actions.feature"
        role: test
        description: "Scenario 'Combination commands can only be done on product with type combinations' (line 22)."
      - path: "src/Adapter/Product/Combination/Create/CombinationCreator.php"
        role: implementation
        description: "createCombinations throws InvalidProductTypeException (line 124) before generating anything."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Product/Combination/forbidden_actions.feature line 22"
          date: "2026-09-19"
          summary: >-
            The scenario generates combinations on a standard product, asserts the
            combinations-only error, and asserts the product keeps its type and gains no
            attribute groups.
          confidence_impact: supports
        - kind: codebase-analysis
          source: "src/Adapter/Product/Combination/Create/CombinationCreator.php"
          date: "2026-09-19"
          summary: >-
            Read for the retired assertion: the class has no count, limit or maximum of any kind,
            so the combination explosion guard this case used to describe does not exist.
          confidence_impact: invalidates

error_cases:
  - id: catalog.ER001
    name: "Upload an image the validator refuses"
    summary: "An upload over the configured size limit or of an unsupported type is rejected."
    validates:
      operations: [catalog.CMD016]
    given:
      description: >-
        A file larger than the max_size_product_image configuration, or one whose detected mime
        type is outside the allowed list. PrestaShop enforces no minimum dimension on an
        upload - ImageValidator checks file size and mime type only. 800x800 is the
        large_default image TYPE, which PrestaShop GENERATES from whatever is uploaded, not a
        constraint on the file.
    expected_result:
      status: failure
      code: 400
    code_refs:
      - path: "src/Adapter/Image/ImageValidator.php"
        role: validation
        description: "assertFileUploadLimits (line 42) and assertIsValidImageType (line 62) - the two constraints that exist."
      - path: "src/Adapter/Image/ProductImageFileValidator.php"
        role: validation
        description: "The product-specific size limit, read from max_size_product_image."
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/Image/add_image.feature"
        role: test
        description: "Scenario 'Add new product image' (line 13) - the happy path, and the source of the 800x800 large_default image type."
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "src/Adapter/Image/ImageValidator.php, src/Adapter/Image/ProductImageFileValidator.php"
          date: "2026-09-19"
          summary: >-
            UploadedImageConstraintException is raised with EXCEEDED_SIZE or UNRECOGNIZED_FORMAT.
            ProductImageConstraintException declares INVALID_ID, INVALID_COVER, INVALID_LEGENDS
            and INVALID_POSITION - no dimension constant anywhere.
          confidence_impact: supports
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            Modeler-derived from code. add_image.feature covers only the happy path; no test
            uploads an oversized or wrong-typed file, so the refusal is read from the validator
            rather than observed.
          confidence_impact: weakens
        - kind: codebase-analysis
          source: "src/Core/Domain/Product/Image/Exception/ProductImageConstraintException.php"
          date: "2026-09-19"
          summary: >-
            Read for the retired assertion. There is no minimum-dimension constraint in the image
            domain, so the 400x300-against-800x800 rejection this case used to assert never happens.
          confidence_impact: invalidates

  - id: catalog.ER002
    name: "Delete a product that does not exist"
    summary: "Deleting an unknown product id is refused; deleting one that has orders is not."
    validates:
      operations: [catalog.CMD003]
    given:
      description: >-
        A product id that no product carries in the requested shop. A product with pending
        orders can still be deleted - ProductDeleter never looks at orders, and
        CannotDeleteProductException is raised only when the delete itself fails. An order keeps
        its own snapshot of the product in order_detail (product_name is a required column), so
        deleting a sold product loses no order history.
    expected_result:
      status: failure
      code: 404
    code_refs:
      - path: "src/Adapter/Product/ProductDeleter.php"
        role: implementation
        description: "The whole delete path. It contains no reference to an order."
      - path: "classes/order/OrderDetail.php"
        role: implementation
        description: "product_name, a required column - the order's own snapshot of what was sold."
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/delete_product.feature"
        role: test
        description: "Scenarios 'I delete product' (line 9) and 'I bulk delete products' (line 17) - the happy paths, with no order guard in sight."
    provenance:
      discovery_stage: exploring
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "src/Adapter/Product/ProductDeleter.php, src/Adapter/Product/Repository/ProductRepository.php"
          date: "2026-09-19"
          summary: >-
            ProductRepository::delete raises CannotDeleteProductException through
            deleteObjectModelFromShops, which fires when the row cannot be removed, and
            ProductNotFoundException when the id resolves to nothing. Neither path consults an order.
          confidence_impact: invalidates
        - kind: assumption
          source: "modeler"
          date: "2026-09-19"
          summary: >-
            Modeler-derived from code. No test deletes a product by an unknown id, so the 404 is
            read from the repository's not-found path rather than observed.
          confidence_impact: weakens

  - id: catalog.ER003
    name: "Invalid specific price percentage"
    summary: "A percentage reduction outside 0 to 100 is refused."
    validates:
      operations: [catalog.CMD021]
      rules: [catalog.VR003]
    given:
      description: "Reduction=150, reductionType=percentage."
    expected_result:
      status: failure
      code: 400
    code_refs:
      - path: "src/Core/Domain/ValueObject/Reduction.php"
        role: validation
        description: "MAX_ALLOWED_PERCENTAGE = 100 and assertIsValidValue, which rejects both ends of the range with INVALID_REDUCTION_PERCENTAGE."
      - path: "tests/Integration/Behaviour/Features/Scenario/Product/SpecificPrice/add_specific_price.feature"
        role: test
        description: "Scenario 'I add a specific price with invalid fields I get errors' (line 66)."
    provenance:
      discovery_stage: validated
      certainty: probable
      evidence:
        - kind: codebase-analysis
          source: "tests/Integration/Behaviour/Features/Scenario/Product/SpecificPrice/add_specific_price.feature line 66"
          date: "2026-09-19"
          summary: >-
            The scenario asserts 'specific price reduction_percentage is invalid' for -12.56. It
            tests the LOWER bound, not 150.
          confidence_impact: supports
        - kind: codebase-analysis
          source: "src/Core/Domain/ValueObject/Reduction.php"
          date: "2026-09-19"
          summary: >-
            Both bounds are one branch: assertIsValidValue raises the same
            INVALID_REDUCTION_PERCENTAGE when the value is below zero or above
            MAX_ALLOWED_PERCENTAGE. So 150 takes the path the test already covers, but no test
            passes 150.
          confidence_impact: supports

  - id: catalog.ER004
    name: "Search with an empty phrase is refused"
    summary: "SearchProducts refuses an empty phrase rather than scanning the catalog."
    validates:
      operations: [catalog.QRY001]
    given:
      description: "A product search submitted with an empty phrase."
    expected_result:
      status: failure
      code: 400
    code_refs:
      - path: "tests/Unit/Core/Domain/Product/Query/SearchProductsTest.php"
        role: test
        description: "testEmptyPhrase - the whole test class, one assertion."
      - path: "src/Core/Domain/Product/Query/SearchProducts.php"
        role: implementation
        description: "The query constructor raises ProductSearchEmptyPhraseException before any handler runs."
    provenance:
      discovery_stage: validated
      certainty: confirmed
      evidence:
        - kind: codebase-analysis
          source: "tests/Unit/Core/Domain/Product/Query/SearchProductsTest.php"
          date: "2026-09-19"
          summary: >-
            testEmptyPhrase constructs SearchProducts('', 1, 'fr') and expects
            ProductSearchEmptyPhraseException with the message 'Product search phrase must be a
            not empty string'. It is the only unit test PrestaShop has for this query, and it
            asserts exactly what catalog.ERR109 says.
          confidence_impact: supports
