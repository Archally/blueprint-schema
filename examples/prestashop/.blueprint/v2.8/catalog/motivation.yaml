---
version: "1.0.0"
scope: catalog

goals:
  - id: catalog.GL001
    statement: "Product search answers from the shop's own inverted index, not from a scan of the product tables"
    description: >
      PrestaShop builds its own inverted index: Search::indexation fills
      ps_search_word and ps_search_index with the words of a product's name,
      reference, descriptions, category, manufacturer, tags, attributes and
      features, each weighted by a PS_SEARCH_WEIGHT_* setting, with an optional
      fuzzy pass. Saving a product reindexes it through ProductIndexationUpdater
      before the request returns. Core ships no external search engine and
      composer.json declares no search-engine client, so an engine such as
      Elasticsearch is a module concern reached through the
      productSearchProvider hook. The goal is that the index is the answer:
      a search that falls back to scanning is a search that will not scale.
    summary: "Search answered from the inverted index"
    priority: high
    measure: "Every searchable product has rows in ps_search_index, and a product save reindexes it in the same request"
    affects:
      operation_refs: [catalog.QRY001, catalog.QRY009]
      concept_refs: [catalog.CN001]
    discovery_stage: committed
    certainty: confirmed

  - id: catalog.GL002
    statement: "Faceted navigation is an extension point the core defines and a module fills"
    description: >
      Core owns the vocabulary of faceted navigation - Facet, Filter and
      FacetCollection in src/Core/Product/Search - and every product listing
      controller dispatches the productSearchProvider hook so a module can
      return a result set with facets attached. No core class calls
      setFacetCollection, so a shop with no faceted-search module installed
      shows no facets at all. The goal is therefore about the contract, not
      about a facet count: core must keep the extension point wide enough that
      a module can facet on attributes, features, price and manufacturer
      without patching core.
    summary: "Facets are a core contract filled by a module"
    priority: high
    measure: "Every product listing route dispatches productSearchProvider, and a facet a module returns reaches the page unaltered"
    affects:
      operation_refs: [catalog.QRY006, catalog.QRY001]
      concept_refs: [catalog.CN005, catalog.CN006, catalog.CN300]
    discovery_stage: validated
    certainty: probable

  - id: catalog.GL003
    statement: "Product CRUD operations complete in under 500ms for back-office responsiveness"
    description: >
      CategoryManagers perform high-volume catalog operations. Every product
      save, image upload, and combination generation must feel instant.
    summary: "Responsive catalog back-office"
    priority: medium
    measure: "p95 product save < 500ms including image processing"
    affects:
      operation_refs: [catalog.CMD001, catalog.CMD002, catalog.QRY002]
      concept_refs: [catalog.CN001]
      process_refs: [catalog.PRC001]
    discovery_stage: validated
    certainty: confirmed

  - id: catalog.GL004
    statement: "Every catalog command and query the back office can run is reachable over the Admin API"
    description: >
      The Admin API is defined in the ps_apiresources module, not in core: each
      resource class declares a uriTemplate and names the CQRS class behind it
      in CQRSCommand or CQRSQuery. An integration can therefore do exactly what
      a route exists for and nothing else, and a command with no route can only
      be reached by a person in the back office. Coverage of the catalog is
      partial and this goal is a target, not a description of today: two of the
      nine catalog code domains, ImageSettings and Tag, have no route at all.
    summary: "Every catalog operation reachable over the Admin API"
    priority: high
    measure: "Every Command and Query class in the catalog code domains is named by an Admin API route"
    affects:
      operation_refs: [catalog.CMD001, catalog.CMD002, catalog.QRY001]
      concept_refs: [catalog.CN001]
    discovery_stage: committed
    certainty: confirmed

  - id: catalog.GL005
    statement: "A large product CSV imports in one run, without the operator restarting it"
    description: >
      Bulk import is controllers/admin/AdminImportController.php, a 4237-line
      legacy controller that sets max_execution_time to 0 and drives the import
      in browser-driven chunks. It has no class under src/Core/Domain, so no
      command, no handler and no error catalog: this model can name the goal
      but has no operation to hang it on, which is the gap INQ002 asks about.
      The goal is completion in one run, because the failure this import really
      has is an operator who cannot tell a finished import from a stalled one.
    summary: "A large catalog imports in one run"
    priority: medium
    measure: "A 10,000-row product CSV completes in one import run with a per-row outcome the operator can read"
    affects:
      concept_refs: [catalog.CN001]
    discovery_stage: validated
    certainty: probable

risks:
  - id: catalog.RSK001
    statement: "A change that does not go through a product save leaves the search index behind"
    description: >
      Saving a product reindexes it in the same request, through
      ProductIndexationUpdater. Nothing else does. A CSV import driven by
      AdminImportController, a bulk status switch, a tag edit or a direct
      database change all alter what a product should match without touching
      ps_search_index, so the storefront keeps answering from the old index and
      says nothing about it. The shopper sees a product that is no longer
      sellable, or misses one that now is.
    summary: "The index drifts behind any change that bypasses a product save"
    likelihood: high
    impact: high
    affects:
      operation_refs: [catalog.CMD002, catalog.CMD007, catalog.EVT002]
      concept_refs: [catalog.CN001]
      process_refs: [catalog.PRC001]
    mitigation: "The product save path reindexes synchronously through ProductIndexationUpdater, so a change made as a product save cannot drift."
    contingency: "RebuildSearchIndex (shop.CMD014) rebuilds the whole index. Core schedules nothing, so the merchant must run it on a cron after any bulk change."
    status: open
    owner: orders.ACT002
    goal_refs:
      - catalog.GL001
    discovery_stage: validated
    certainty: confirmed

  - id: catalog.RSK002
    statement: "Product image storage costs scale linearly with catalog growth"
    description: >
      Every image is resized once per ImageType at upload and kept on disk, so
      the file count is products times images per product times image types.
      Image types are merchant-defined rows, and each one added multiplies the
      whole catalog's footprint retroactively the next time thumbnails are
      regenerated.
    summary: "Every image type multiplies the whole catalog's footprint"
    likelihood: medium
    impact: medium
    goal_refs:
      - catalog.GL003
    affects:
      operation_refs: [catalog.CMD016, catalog.CMD018]
      concept_refs: [catalog.CN004, catalog.CN014, catalog.CN400]
    mitigation: "The levers core has are the ImageType rows themselves: delete a type with DeleteImagesFromType to reclaim its files, scope a type to the entities that need it, and choose a compact format - ImageManager writes webp and avif as well as jpeg and png. On-demand resizing behind a CDN is not something core does."
    status: open
    discovery_stage: exploring
    certainty: probable

  - id: catalog.RSK003
    statement: "Product data inconsistency across multi-store configurations"
    description: >
      In multi-store mode, products can have store-specific names, prices,
      and availability. Incorrect store-product association creates data
      inconsistency visible to customers.
    summary: "Multi-store product data drift"
    likelihood: medium
    impact: high
    goal_refs:
      - catalog.GL003
    affects:
      operation_refs: [catalog.CMD002, catalog.CMD006]
      concept_refs: [catalog.CN001]
      process_refs: [catalog.PRC001]
    mitigation: "Store-aware validation on all product write operations."
    status: identified
    discovery_stage: exploring
    certainty: speculative

  - id: catalog.RSK004
    statement: "Combination explosion for products with many attribute groups"
    description: >
      A product with 5 attribute groups of 10 values each generates 100,000
      combinations. This causes memory exhaustion during generation and
      unusable variant pickers in the storefront.
    summary: "Combinatorial explosion"
    likelihood: medium
    impact: high
    goal_refs:
      - catalog.GL003
    affects:
      operation_refs: [catalog.CMD011]
      concept_refs: [catalog.CN003]
      process_refs: [catalog.PRC002]
    mitigation: "Generation guard: warn when expected combination count exceeds 500; hard limit at 10,000."
    status: open
    discovery_stage: validated
    certainty: confirmed

assumptions:
  - id: catalog.ASM001
    domain_scope: catalog
    statement: "A shop can run on the built-in index until its merchant chooses to install a search module"
    consequence: >
      Core ships no search engine and composer.json declares no engine client,
      so the built-in inverted index is what every new shop gets. If merchants
      routinely have to install an engine module before the catalog is large,
      then search is not a core feature with an optional upgrade but an
      extension point with a mandatory filler, and the productSearchProvider
      contract - not the index - is the thing core has to keep good.
    risk_refs:
      - catalog.RSK001
    discovery_stage: exploring
    certainty: speculative

  - id: catalog.ASM002
    domain_scope: catalog
    statement: "The built-in inverted index keeps ranking usefully as the vocabulary grows"
    consequence: >
      Search::indexation scores a match by word length against the corpus, and
      the constant PS_SEARCH_MAX_WORDS_IN_TABLE caps that at 100,000 distinct
      words: above it every length coefficient is 1 and the length signal is
      gone. If a real catalog crosses that line routinely, ranking quality
      degrades silently with catalog growth, and nothing in the storefront or
      the back office says it has happened.
    risk_refs:
      - catalog.RSK001
    discovery_stage: validated
    certainty: probable

non_goals:
  - id: catalog.NG001
    statement: "No built-in B2B tiered/volume pricing engine"
    reason: >
      Pricing is per-customer-group with specific prices per product. B2B volume
      pricing requires contract-based pricing engines beyond this scope - handled
      by dedicated B2B modules (e.g., Agile B2B).
    discovery_stage: committed
    certainty: confirmed

  - id: catalog.NG002
    statement: "No AI-powered product recommendations in core"
    reason: >
      Product recommendations (collaborative filtering, content-based) are
      handled by third-party modules. Building ML infrastructure in core
      conflicts with the shared-hosting deployment model.
    discovery_stage: committed
    certainty: confirmed

trade_offs:
  - id: catalog.TRO001
    choice: "CQRS migration scope for product domain"
    selected: "Gradual migration with ObjectModel coexistence"
    rejected: "Big-bang rewrite of all legacy product models"
    rationale: >
      The Product aggregate has ~120 ObjectModel properties. A big-bang rewrite
      would freeze feature development for months. Gradual migration lets new
      features use CQRS while legacy code continues working through an adapter
      layer. ObjectModel coexistence is the pragmatic path.
    accepted_risk: "Dual read paths (ObjectModel + QueryBus) increase debugging complexity."
    discovery_stage: committed
    certainty: confirmed

inquiries:
  - id: catalog.INQ001
    statement: "Should PrestaShop support headless catalog access via GraphQL in addition to REST?"
    summary: "GraphQL for headless catalog"
    description: >
      The JavaScript frontend ecosystem increasingly expects GraphQL.
      Adding a GraphQL layer would enable headless storefronts but
      increases API surface and maintenance burden.
    category: strategic
    affects:
      operation_refs: [catalog.QRY001, catalog.QRY002]
      concept_refs: [catalog.CN001]
    goal_refs:
      - catalog.GL004
    stakeholders:
      - orders.ACT003
    blocking: false
    status: investigating
    discovery_stage: exploring
    certainty: speculative
    tags: [architecture, headless]

  - id: catalog.INQ002
    statement: "Should product import support asynchronous processing with progress tracking?"
    summary: "Async bulk import with progress"
    description: >
      Measured 2026-09-19: the import does not time out.
      controllers/admin/AdminImportController.php opens by setting
      max_execution_time to 0 and drives the work in browser-posted chunks, so
      a long import does not fail - it simply continues, with no state an
      operator or another system can query. That changes the question. It is
      not "how do we stop it timing out" but "what would let anyone tell a
      running import from a stalled one", which is a progress record the
      controller does not keep and a command it does not have.
    category: technical
    affects:
      concept_refs: [catalog.CN001]
    goal_refs:
      - catalog.GL005
    blocking: true
    status: investigating
    discovery_stage: validated
    certainty: probable
    tags: [bulk-import, async]
