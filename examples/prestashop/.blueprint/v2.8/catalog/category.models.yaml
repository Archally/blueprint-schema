---
version: "1.0.0"
scope: catalog
tags: [category, models]

components:
  schemas:
    CreateCategoryPayload:
      x-model-id: MDL011
      purpose: command-payload
      description: "Request body for creating a new category."
      represents:
        - concept: catalog.CN002
          kind: api
          mapping:
            strategy: property-map
            property_map:
              localizedNames: CAT009
              parentId: CAT010
              active: CAT012
      type: object
      required: [parentId, localizedNames]
      properties:
        parentId:
          type: integer
          description: "Parent category ID. Use root category ID for top-level."
          example: 2
        localizedNames:
          type: object
          description: "Category name per language ID."
          additionalProperties:
            type: string
          example:
            "1": "Laptops"
            "2": "Ordinateurs Portables"
        localizedDescriptions:
          type: object
          description: "Category description per language ID (HTML)."
          additionalProperties:
            type: string
          example:
            "1": "<p>Browse our selection of laptops.</p>"
        active:
          type: boolean
          description: "Whether category is visible to shoppers."
          example: true
        localizedMetaTitles:
          type: object
          description: "SEO meta title per language."
          additionalProperties:
            type: string
          example:
            "1": "Laptops - Best Prices"
        localizedMetaDescriptions:
          type: object
          description: "SEO meta description per language."
          additionalProperties:
            type: string
          example:
            "1": "Shop laptops from top brands at the best prices."
        localizedLinkRewrites:
          type: object
          description: "URL slug per language."
          additionalProperties:
            type: string
          example:
            "1": "laptops"
        associatedShopIds:
          type: array
          description: "Shops where this category is visible."
          items:
            type: integer
          example: [1]
      code_refs:
        - path: "src/Core/Domain/Category/Command/AddCategoryCommand.php"
          role: schema

    EditCategoryPayload:
      x-model-id: MDL012
      purpose: command-payload
      description: "Partial update payload for an existing category."
      represents:
        - concept: catalog.CN002
          kind: api
          mapping:
            strategy: property-map
            property_map:
              localizedNames: CAT009
              active: CAT012
      type: object
      required: [categoryId]
      properties:
        categoryId:
          type: integer
          description: "Category to update."
          example: 5
        localizedNames:
          type: object
          description: "Category name per language ID."
          additionalProperties:
            type: string
          example:
            "1": "Laptops & Notebooks"
        localizedDescriptions:
          type: object
          description: "Category description per language id, stored as HTML. It prints above the product grid on the category page, so it is copy rather than metadata."
          additionalProperties:
            type: string
          example:
            "1": "<p>Updated selection of laptops and notebooks.</p>"
        active:
          type: boolean
          description: "Visibility toggle."
          example: true
        parentId:
          type: integer
          description: "New parent category ID (for moves)."
          example: 2
        localizedMetaTitles:
          type: object
          description: "Page title per language id. Empty falls back to the category name, so leaving it out is a choice to accept the default."
          additionalProperties:
            type: string
          example:
            "1": "Laptops & Notebooks - Best Prices"
        localizedMetaDescriptions:
          type: object
          description: "The snippet offered to a search engine, per language id. Not printed anywhere on the storefront itself."
          additionalProperties:
            type: string
          example:
            "1": "Shop laptops and notebooks from top brands."
        localizedLinkRewrites:
          type: object
          description: "URL slug per language id. Changing it changes the category's public address and the address of every product page reached through it, so an edit here is an SEO event."
          additionalProperties:
            type: string
          example:
            "1": "laptops-notebooks"

    CategoryResource:
      x-model-id: MDL013
      purpose: read-model
      description: "Full category representation for editing. Includes tree position, names, SEO, and cover image."
      represents:
        - concept: catalog.CN002
          kind: api
          mapping:
            strategy: property-map
            property_map:
              categoryId: CAT008
              localizedNames: CAT009
              parentId: CAT010
              depth: CAT011
              active: CAT012
      type: object
      properties:
        categoryId:
          type: integer
          description: "Unique category identifier."
          example: 5
        parentId:
          type: integer
          description: "Parent category ID."
          example: 2
        depth:
          type: integer
          description: "Depth in category tree (0 = root)."
          example: 2
        active:
          type: boolean
          description: "Whether category is visible."
          example: true
        localizedNames:
          type: object
          description: "Category name per language id. It is what the breadcrumb and the menu read, and an untranslated language shows an empty label rather than falling back."
          additionalProperties:
            type: string
          example:
            "1": "Laptops"
            "2": "Ordinateurs Portables"
        localizedDescriptions:
          type: object
          description: "Category description per language id, stored as HTML and printed above the product grid."
          additionalProperties:
            type: string
          example:
            "1": "<p>Browse our selection of laptops.</p>"
        localizedMetaTitles:
          type: object
          description: "Page title per language id, falling back to the category name when empty."
          additionalProperties:
            type: string
          example:
            "1": "Laptops - Best Prices"
        localizedMetaDescriptions:
          type: object
          description: "The snippet offered to a search engine, per language id."
          additionalProperties:
            type: string
          example:
            "1": "Shop laptops from top brands."
        localizedLinkRewrites:
          type: object
          description: "URL slug per language id, which fixes the category's public address in that language."
          additionalProperties:
            type: string
          example:
            "1": "laptops"
        coverImageUrl:
          type: string
          description: "Category cover image URL."
          example: "/img/c/5-category_default.jpg"
        thumbnailUrl:
          type: string
          description: "Category thumbnail URL for menus."
          example: "/img/c/5-medium_default.jpg"
        isRootCategory:
          type: boolean
          description: "Whether this is the store root category."
          example: false
        childrenCount:
          type: integer
          description: "Number of direct child categories."
          example: 3
        productsCount:
          type: integer
          description: "Number of products assigned to this category."
          example: 47
        shopIds:
          type: array
          description: "Which shops of a multistore installation show this category. A category absent from a shop is unreachable there even though its products may not be."
          items:
            type: integer
          example: [1]
      code_refs:
        - path: "src/Core/Domain/Category/QueryResult/EditableCategory.php"
          role: schema

    CategoryTreeNode:
      x-model-id: MDL014
      purpose: dto
      description: "Recursive tree node for category hierarchy display."
      represents:
        - concept: catalog.CN002
          kind: ui
      type: object
      properties:
        categoryId:
          type: integer
          description: "The category this node stands for, which a picker returns as the selected value."
          example: 5
        name:
          type: string
          description: "Category name in current language."
          example: "Laptops"
        active:
          type: boolean
          description: "Whether the category is live on the storefront. A disabled branch is still shown in the back-office tree, greyed, because an employee has to be able to find it to re-enable it."
          example: true
        depth:
          type: integer
          description: "How far below the root this node sits, counted from 0. The tree widget uses it for indentation rather than recomputing it from the nesting."
          example: 2
        children:
          type: array
          description: "Child category nodes, nested to the full depth of the branch. The tree arrives whole in one response rather than being fetched level by level."
          example:
            - categoryId: 12
              name: "Gaming laptops"
              active: true
              depth: 3
              children: []
          items:
            $ref: "#/components/schemas/CategoryTreeNode"
