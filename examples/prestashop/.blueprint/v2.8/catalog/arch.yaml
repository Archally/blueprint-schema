version: 1.0.0
name: Catalog (PrestaShop)
description: Architecture of the PrestaShop Catalog bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC002
    name: Catalog
    kind: core
    value_stream_ref: VS001
    complexity: transformation
    business_model_role: revenue-generator
    evolution: product
    model_traits: [information-holder, structurer, executor]
    summary: Product catalog - CRUD, variants, media, categories, attributes, suppliers, search indexing.
    owned_by:
      team: TM002
    responsibilities:
      - Product lifecycle (create, update, activate, discontinue, archive)
      - Category hierarchy and product assignment
      - Combination/variant management with own identity
      - Product media (images, attachments, virtual files)
      - Specific pricing rules and customizations
      - Feature and attribute group management
      - Supplier and manufacturer associations
      - Search index synchronization
    dependencies:
      - name: International
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Prices every product through International's tax model in the same process:
          Product::priceCalculation asks TaxManagerFactory::getManager for the product's tax rules
          group (classes/Product.php:3727). Customer-supplier because Catalog consumes the tax and
          currency classes International publishes and changes nothing in them.
        bounded_context_ref: prestashop.BC006
      - name: Modules
        relationship: open-host-service
        direction: upstream
        description: >-
          Publishes its hook names for any module to subscribe to: Product::update fires
          actionProductSave and actionProductUpdate through Hook::exec (classes/Product.php:811-812).
          Open-host-service because the hook name is a published protocol that Catalog fires for
          every module alike and negotiates with none. The coupling is the in-process contract
          below, so none is declared here.
        bounded_context_ref: prestashop.BC007
      - name: Shop
        relationship: conformist
        direction: downstream
        description: >-
          Scopes its own queries by the store context Shop decides: Product::getProducts joins
          product_shop through Shop::addSqlAssociation('product', 'p') (classes/Product.php:1634).
          Conformist because Shop owns the multi-store association and is never asked, so Catalog
          takes it in whatever shape it is in. The coupling is the shared-data contract below.
        bounded_context_ref: prestashop.BC011
    services:
      - id: prestashop.SVC002
        name: CatalogService
        kind: api
        summary: REST API for product and category management.
        needs:
          - { type_ref: RT001, class: self-hosted, id: prestashop-db }
          - { type_ref: RT004, class: self-hosted, id: prestashop-cache }
          - { type_ref: RT002, class: self-hosted, id: prestashop-assets }
        servers:
          - url: https://api.prestashop.example/v1
            environment: prestashop.ENV001
          - url: http://localhost:8080/api
            environment: development
        contracts:
          inprocess:
            # Catalog code calls the dispatcher at each extension point, which is the same act as
            # the open-host-service the context declares above: exposing a hook IS calling
            # `Hook::exec` where the extension belongs.
            consume:
              - modules.CMD010
          shareddata:
            # The dataset belongs to Shop, so the contract document is placed there rather than in
            # the reading slice - both ends name one document.
            contract_name: shop-context
            slice: shop
            read:
              - shop.DOC001
          openapi:
            contract_name: catalog-api
            slice: catalog
            expose:
              - catalog.CMD001
              - catalog.CMD002
              - catalog.QRY001
              - catalog.QRY002
          asyncapi:
            contract_name: catalog-events
            slice: catalog
            send:
              - catalog.EVT001
              - catalog.EVT002
            brokerId: prestashop-event-bus
