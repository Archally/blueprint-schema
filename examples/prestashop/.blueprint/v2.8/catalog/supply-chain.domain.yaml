# Not mapped, by decision: SupplierException, ManufacturerException, TagException and
# AttachmentException are the abstract or catch-all parents the four domains throw when
# a PrestaShopException escapes. They carry no distinct business meaning and no distinct
# status, so modeling them would add four nodes that say only "something failed".

questions:

  - id: catalog.QN004
    name: "Who Can Restock This"
    statement: "Which suppliers can restock this product, and under which reference and price?"
    category: relationship
    priority: high
    bounded_context_ref: prestashop.BC002
    answered_by: [catalog.QRY108, catalog.QRY109, catalog.QRY110]
    concepts: [catalog.CN001, catalog.CN009]
    resolved: true
    resolution: >
      GetAssociatedSuppliers lists the suppliers attached to the product and
      GetProductSupplierOptions the per-supplier reference and price; GetProductStockMovements
      shows what those supplies have actually delivered.
