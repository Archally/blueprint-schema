version: 1.0.0
name: Admin (PrestaShop)
description: Architecture of the PrestaShop Admin bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC001
    name: Admin
    kind: generic
    value_stream_ref: VS003
    complexity: crud
    business_model_role: compliance-enforcer
    evolution: commodity
    model_traits: [information-holder, controller]
    summary: Employee accounts, profiles, security, API clients, configuration.
    owned_by:
      team: TM009
    responsibilities:
      - Employee registration and profile/role management
      - Access control and permission checking
      - API client (OAuth2) management
      - Webservice key management
      - Security audit logging
      - Shop configuration key-value store
    services:
      - id: prestashop.SVC001
        name: AdminService
        kind: api
        summary: REST API for employee, security, and configuration management.
        servers:
          - url: https://api.prestashop.example/v1
            environment: prestashop.ENV001
          - url: http://localhost:8080/api
            environment: development
        contracts:
          openapi:
            contract_name: admin-api
            slice: admin
            expose:
              - admin.CMD001
              - admin.CMD010
              - admin.QRY001
              - admin.CMD021
          security_schemes:
            bearer:
              type: http
              scheme: bearer
              bearer_format: JWT
            admin_oauth2:
              type: oauth2
              scopes:
                admin:read: Read admin data
                admin:write: Modify admin data
                employees:manage: Manage employee accounts
