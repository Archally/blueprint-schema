---
version: "1.0.0"
scope: admin
tags: [api-management]

concepts:
  - id: admin.CN005
    name: "ApiClient"
    stereotype: aggregate-root
    description: "An OAuth2 API client for the PrestaShop Admin API. ApiClients have a client ID, secret (rotatable), scopes, lifetime, and enabled/disabled status. Secret management via ForceApiClientSecret and GenerateApiClientSecret commands."
    tags: [aggregate-root, api]
    attributes:
      clientName:
        id: CAT813
        description: "Human-readable name for the API client"
        example: "ERP Integration"
      clientId:
        id: CAT814
        description: "OAuth2 client identifier"
        example: "erp-sync-client"
      enabled:
        id: CAT815
        description: "Whether the API client is currently active"
        example: "true"
      description:
        id: CAT816
        description: "Purpose description for the API client"
        example: "ERP system synchronization"
      lifetime:
        id: CAT817
        description: "Token lifetime in seconds"
        example: "3600"
      scopes:
        id: CAT818
        description: "Array of OAuth2 scopes granted to this client"
        example: "[\"product_read\", \"order_read\"]"
    code_refs:
      - path: "src/Core/Domain/ApiClient/Command/AddApiClientCommand.php"
        role: implementation
        description: "API client creation with clientName, clientId, enabled, description, lifetime, scopes"
      - path: "src/Core/Domain/ApiClient/Command/ForceApiClientSecretCommand.php"
        role: implementation
        description: "Force-set a specific secret value on an API client"
      - path: "src/Core/Domain/ApiClient/Command/GenerateApiClientSecretCommand.php"
        role: implementation
        description: "Auto-generate a new secret for an API client"

  - id: admin.CN006
    name: "WebserviceKey"
    stereotype: aggregate-root
    description: "A legacy XML-based webservice access key. Webservice keys predate the Admin API (ApiClient) and provide resource-level permissions for the legacy CRUD API. Supports add, edit, delete, and bulk delete operations."
    tags: [aggregate-root, api, legacy]
    attributes:
      key:
        id: CAT819
        description: "The webservice access key string"
        example: "ZR4H2FVVMTHGL8KJ3QW9XPCND6BYS5TA"
      description:
        id: CAT820
        description: "Purpose description for the webservice key"
        example: "Legacy ERP integration"
      permissions:
        id: CAT821
        description: "Resource-level permission matrix (read/write per resource)"
        example: "{resource: products, GET: true, POST: false, PUT: false, DELETE: false}"
    code_refs:
      - path: "src/Core/Domain/Webservice/Command/AddWebserviceKeyCommand.php"
        role: implementation
      - path: "src/Core/Domain/Webservice/Command/EditWebserviceKeyCommand.php"
        role: implementation

actors:
  - id: admin.ACT003
    name: "ApiIntegrator"
    type: human
    description: "Developer or technical partner who configures API clients and webservice keys for third-party system integrations (ERP, CRM, PIM, marketplaces)."
    personas:
      - id: admin.PER002
        name: Integration developer
        description: A developer who connects a third-party tool to the shop through the Admin API or the legacy webservice (presta-docs/admin-api/oauth.md; presta-docs/webservice/_index.md).
        goals:
          - "Connect a server-to-server integration with a client ID and secret through the client credentials grant (presta-docs/admin-api/oauth.md, 'Grant Type: Client Credentials')."
          - Request only the scopes the integration needs, so a stolen token grants little (presta-docs/admin-api/oauth.md).
        pain_points:
          - The first token request must already name every scope; calls that need other scopes need another token (presta-docs/admin-api/oauth.md).
          - A legacy webservice key authenticates with no password, so anyone holding it gets its rights (presta-docs/webservice/getting-started.md).
