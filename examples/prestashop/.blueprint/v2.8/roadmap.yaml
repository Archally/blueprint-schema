    kind: epic
    name: "PrestaShop 9.0 release"
    description: >
      The 9.0 line from its first published build to general availability. Its content is
      a foundation change rather than a feature set, which is why it carries no child
      bars: Symfony, PHP, the back-office authorization rewrite and the Admin API all
      landed across the same window and none of them is separable on a published date.
    milestone: MS100
    status: achieved
    confidence: committed
    progress: 100
    start_date: "2024-06-06"
    end_date: "2025-06-06"
    owned_by:
      team: TM010
    tracker_ref: "33993"
    note: >
      Window is 9.0.0 Alpha 1 (CHANGELOG, 2024-06-06) to 9.0.0 (CHANGELOG, 2025-06-06).
