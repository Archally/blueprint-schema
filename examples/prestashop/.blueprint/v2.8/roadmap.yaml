  # ── The proposal tier ──────────────────────────────────────────────────────
  # Every item below shares one window, the 9.3 line's development phase (2026-06-26 to
  # 2026-10-26), derived in the comment above MS002. That is deliberate: no source
  # sequences these against each other, so giving them staggered bars would be a schedule
  # nobody wrote. What order there is between them is stated by `depends_on`, which comes
  # from the leverage DAG in `leverage.yaml`, not from a calendar.
  - id: WI001
    kind: epic
    name: "Asynchronous order side effects"
    description: >
      Move fulfilment, mail and webhook work off the request thread that places an order,
      so that checkout latency stops tracking the latency of whichever provider is slowest
      and so that a failed side effect can be retried rather than losing the order.
    milestone: MS003
    status: planned
    confidence: tentative
    start_date: "2026-06-26"
    end_date: "2026-10-26"
    owned_by:
      team: TM001
    realizes_decisions: [DC001]
    value_streams: [VS001]
    advances_goals: [orders.GL001]
    note: >
      This is the work leverage point LP001 calls for. The linkage itself belongs in
      `leverage.yaml`, which is the only place the schema admits a leverage reference in
      either direction, and LP001's realized_by is empty there today. The window is the
      next minor line's development phase, derived and not scheduled; PrestaShop has
      announced no such work.
    tags: [proposal, not-announced]

