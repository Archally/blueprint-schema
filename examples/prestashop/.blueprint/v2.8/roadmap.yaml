version: "2.0.0"
owned_by:
  party: PRT001
tags: [roadmap, release-train]

# ─────────────────────────────────────────────────────────────────────────────
#  PRESTASHOP DELIVERY ROADMAP
#
#  Two tiers of truth, and every entry says which one it is.
#
#  1. THE RELEASE TRAIN (MS100, MS101, MS102 and the WI1xx work items). These are
#     PrestaShop's real minor releases. Every date is a published release date from
#     `presta-code/docs/CHANGELOG.txt`, cross-checked against the git tag of the same
#     name; every feature is one the project documents in
#     `presta-docs/modules/core-updates/9.{0,1,2}.md`; every work-item window starts at
#     a measured first commit or merge and ends at the release that carried it. The one
#     date that is not published is 9.2.0's, which has not shipped: it is derived, and
#     MS102 shows the arithmetic.
#
#  2. TWO PROPOSALS (MS002 and MS003, and the work items that carry them). These are
#     changes THIS MODEL proposes, not work PrestaShop has announced. Each one is staged
#     as a draft migration in `.blueprint/migrations.yaml` or named by a leverage point in
#     `leverage.yaml`. They are placed on the development phase of the next minor line,
#     which is a derivation and not a schedule, and each says so.
#
#  What is deliberately absent: this model's own construction. Phase 1 of the modeling
#  plan added roughly 190 classes' worth of operations and regrounded the event layer.
#  That is work on the blueprint, not work on PrestaShop, and a product roadmap that
#  listed it would be describing its own author.
#
#  Sources, once, so no entry has to repeat them:
#    CHANGELOG   presta-code/docs/CHANGELOG.txt          (dated release headers)
#    tags        git -C presta-code tag                   (one lightweight tag per release)
#    notable     presta-docs/modules/core-updates/9.N.md  ("Notable changes in 9.N.x")
#    lifecycle   presta-docs/project/release/minor-release-lifecycle.md
#  Clones measured 2026-09-19: presta-code a27e912eef9, presta-docs 1a93cfba.
# ─────────────────────────────────────────────────────────────────────────────

# The Gantt renderer needs an axis origin and a tick size, and this block is where the
# schema puts them; it is not a claim that PrestaShop plans in sprints. It does not:
# `minor-release-lifecycle.md` describes a phase-based cycle of about four months of
# development, one month of stabilization, one month of public beta and then a
# release-candidate timer. Sprint 1 therefore begins on the first published build of the
# 9 line (9.0.0 Alpha 1, 2024-06-06, CHANGELOG), which is the earliest date anything below
# carries, so no work item lands on a negative sprint. Every work item is placed by
# explicit date; not one of them asserts a sprint number.
cadence:
  anchor_sprint: 1
  anchor_start: "2024-06-06"
  sprint_length_days: 14

milestones:
  # ── Shipped ────────────────────────────────────────────────────────────────
  - id: MS100
    name: "PrestaShop 9.0.0"
    description: >
      The first release of the 9 line, and the one that moved the platform onto a
      current foundation: Symfony 6.4 in place of 4.4, PHP 8.1 as the minimum with 8.2,
      8.3 and 8.4 supported, back-office login and authorization rebuilt on Symfony, and
      a new Admin API built on API Platform behind its own AdminAPIKernel with OAuth2
      clients and scopes. That API is the surface every HTTP exchange in this model
      resolves against: the notable-changes page for 9.0 introduces it, and 8.1's names no
      Admin API at all, so before the 9 line the only programmatic surface was the legacy
      webservice.
    target_date: "2025-06-06"
    status: achieved
    deliverables:
      - kind: capability
        ref: CAP016
        description: "The Admin API moves onto API Platform with OAuth2 clients and scoped tokens."
      - kind: capability
        ref: CAP015
        description: "Back-office login and authorization are served by Symfony rather than legacy controllers."
      - kind: operation
        ref: admin.CMD021
        description: "AddApiClient: an OAuth2 client becomes a first-class back-office object."
      - kind: user-story
        ref: admin.US003
        description: "An administrator sets up an Admin API client for a third-party integration."
    success_criteria:
      - "PHP 8.1 is the minimum supported version, with 8.2, 8.3 and 8.4 supported (notable changes, 9.0.md)"
      - "Symfony 6.4 replaces Symfony 4.4 across the core, with per-component dependencies rather than symfony/symfony"
      - "The Admin API runs on a dedicated AdminAPIKernel with its own configuration, cache and front controller"
    realizes_decisions: [DC006, DC007]
    advances_goals: [admin.GL002]
    value_streams: [VS003]
    owned_by:
      team: TM010
    tags: [release, shipped]

  - id: MS101
    name: "PrestaShop 9.1.0"
    description: >
      The release that began splitting an order across carriers. Multi-shipment and the
      redesigned discount system both shipped behind feature flags and both are marked
      Work in Progress in the project's own notes, so the honest reading is that 9.1
      delivered their first usable form rather than their finished one. Hummingbird also
      became the default theme for new installations, and PHP 8.5 joined the supported
      set.
    target_date: "2026-03-13"
    status: achieved
    deliverables:
      - kind: capability
        ref: CAP010
        description: "Shipping and delivery gains shipments: an order can be split across carriers and parcels."
      - kind: capability
        ref: CAP100
        description: "Promotion and discount management is rebuilt on a new interface and architecture over cart rules."
      - kind: capability
        ref: CAP013
        description: "Hummingbird becomes the default theme a new installation renders with."
      - kind: operation
        ref: shipping.CMD011
        description: "CreateShipment: the command the multi-shipment system is built around."
      - kind: user-story
        ref: shipping.US005
        description: "A logistics operator splits a shipment into multiple parcels."
      - kind: user-story
        ref: checkout.US004
        description: "A merchant creates a discount campaign with conditions and usage limits."
    success_criteria:
      - "An order can carry more than one shipment, each with its own carrier and product set"
      - "The discount interface and its domain commands exist behind a feature flag, disabled by default"
      - "A new installation renders on Hummingbird; an installation upgraded from 9.0 keeps its theme"
    dependencies: [MS100]
    advances_goals: [shipping.GL003]
    value_streams: [VS002]
    owned_by:
      team: TM005
    tags: [release, shipped]

  # ── In flight ──────────────────────────────────────────────────────────────
  - id: MS102
    name: "PrestaShop 9.2.0"
    description: >
      In release-candidate stage, not shipped. Beta 1 was published 2026-07-09 and
      Release Candidate 1 on 2026-09-11 (CHANGELOG, and the 9.2.0-rc.1 tag). Its three
      headline features are Extra Properties, a native way for a module to attach a field
      to a core entity and have it appear in the back office, the front office and the
      Admin API without an override; a One Page Checkout module in the bundle; and the
      foundation of an improved B2B mode. The target date below is DERIVED, not announced:
      RC 1 shipped on 2026-09-11, and the last three minor releases took 14 days (9.0.0),
      22 days (9.1.0) and 29 days (8.1.0) from their first release candidate to general
      availability, whose median is 22. 2026-09-11 plus 22 days is 2026-10-03. PrestaShop
      publishes no date of its own, and the lifecycle document is explicit that a new
      regression resets the timer.
    target_date: "2026-10-03"
    status: in-progress
    deliverables:
      - kind: capability
        ref: CAP016
        description: "A module-registered extra field reaches the Admin API with no extra wiring."
      - kind: capability
        ref: CAP003
        description: "A native One Page Checkout joins the bundled multi-step flow."
      - kind: capability
        ref: CAP007
        description: "Business entities, B2B customer profiles and B2B addresses enter the customer model."
      - kind: operation
        ref: admin.CMD041
        description: "AddExtraPropertyDefinition: the command that registers a new field on a core entity."
      - kind: user-story
        ref: customers.US005
        description: "A merchant sets up a B2B customer group with wholesale pricing."
    success_criteria:
      - "A module registers an extra field on a supported entity and the field appears in back office, front office and Admin API with no override"
      - "The bundled One Page Checkout renders the whole checkout on one page, with its feature flag removed"
      - "The improved_b2b feature flag exists and is disabled by default"
    dependencies: [MS101]
    advances_goals: [admin.GL002]
    value_streams: [VS001]
    owned_by:
      team: TM010
    tags: [release, in-release-candidate]

  # ── Proposed by this model, not announced by PrestaShop ────────────────────
  # Both carry the same target date because both are placed on the same thing: the next
  # minor line. Development of a minor begins when the previous one enters feature freeze
  # (lifecycle), and 9.2's freeze is measured as the oldest commit on origin/9.2.x that is
  # not on develop, 2026-06-26. The lifecycle's own durations then give four months of
  # development to 2026-10-26, a month of stabilization to 2026-11-26, a month of public
  # beta to 2026-12-26 and a one-week release-candidate timer to 2027-01-02. Nothing about
  # that arithmetic is a commitment by anyone, and neither proposal is sequenced ahead of
  # the other by any source.
  - id: MS002
    name: "Proposed: faceted product search"
    description: >
      A proposal of this model, staged as the draft migration `facet-product-search`
      (MIG002) in `.blueprint/migrations.yaml`, which adds a SearchFacet value object and
      a SearchProductsByFacet query that returns products narrowed by facet selections
      together with the remaining facet counts. PrestaShop has announced no such work and
      the codebase contains no facet query today, so this is a statement of what the model
      proposes rather than of what the product will do. Note for a reader following the
      decision log: the model's own DC002 records a choice of Elasticsearch, which the
      codebase does not contain; this proposal is about facets over the search the product
      has, and says nothing about a search engine.
    target_date: "2027-01-02"
    status: planned
    deliverables:
      - kind: capability
        ref: CAP018
        description: "Search and discovery gains facet counts, so a shopper can see what each narrowing costs them."
      - kind: user-story
        ref: catalog.US003
        description: "A shopper searches for products by keyword and narrows the result with filters."
    success_criteria:
      - "A search result carries, for every remaining facet, the count of products a shopper would be left with"
      - "The facet query is served without a second search service to operate"
    dependencies: [MS102]
    advances_goals: [catalog.GL002]
    value_streams: [VS001]
    owned_by:
      team: TM002
    tags: [proposal, not-announced]

  - id: MS003
    name: "Proposed: stock reservation at checkout and asynchronous order side effects"
    description: >
      Two proposals of this model that share a cause. The first is staged as the draft
      migration `reserve-stock-at-checkout` (MIG001) in `.blueprint/migrations.yaml`: a
      cart asks the catalog to hold the quantities its lines depend on, the hold is
      consumed when the order is placed and released when the cart is abandoned, so two
      shoppers cannot both buy the last unit during a flash sale. The second is leverage
      point LP001, which moves fulfilment, mail and webhook work off the request thread.
      PrestaShop today decrements stock at order placement and runs those side effects
      inline, so neither is a description of the product as it stands.
    target_date: "2027-01-02"
    status: planned
    deliverables:
      - kind: capability
        ref: CAP004
        description: "Stock availability control gains a hold with a window, between availability and decrement."
      - kind: operation
        ref: orders.CMD001
        description: "PlaceOrder stops carrying fulfilment side effects on the request thread."
    success_criteria:
      - "Two concurrent checkouts for the last unit of a product cannot both succeed"
      - "An abandoned cart returns its held quantity to available stock without an operator acting"
      - "A slow mail or webhook provider does not extend the time an order placement takes"
    dependencies: [MS102]
    realizes_decisions: [DC001]
    mitigates_risks: [orders.RSK003]
    advances_goals: [orders.GL001, orders.GL003]
    value_streams: [VS001]
    owned_by:
      team: TM001
    tags: [proposal, not-announced]

# ─────────────────────────────────────────────────────────────────────────────
#  EXECUTION TIER
#
#  Every item is placed by explicit date. A shipped release's window runs from the
#  earliest measured commit or merge of the work it carried to the release date itself;
#  the measurement is named per item so a reader can re-run it. `progress` is asserted
#  only where a release shipped, because PrestaShop publishes no percentage and a number
#  invented to fill a bar is worse than an empty field.
# ─────────────────────────────────────────────────────────────────────────────
