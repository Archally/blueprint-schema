    kind: epic
    name: "PrestaShop 9.2 release"
    description: >
      The 9.2 line, in release-candidate stage. Its window overlaps 9.1's on purpose:
      the lifecycle document says development of a minor begins the moment the previous
      one enters feature freeze, and the merge dates below show exactly that happening.
