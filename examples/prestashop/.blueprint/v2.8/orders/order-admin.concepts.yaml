---
version: "1.0.0"
scope: orders
tags: [order-admin]

concepts:
  - id: orders.CN010
    name: "OrderState"
    description: "An order status the merchant defines, with the flags that say what entering it does. Thirteen ship with PrestaShop."
    stereotype: entity
    attributes:
      orderStateId:
        id: CAT133
        description: "Unique order state identifier."
        example: "2"
      name:
        id: CAT134
        description: "State label (multi-language)."
        example: "Payment accepted"
      color:
        id: CAT135
        description: "Hex color code for back-office display."
        example: "#32CD32"
      logable:
        id: CAT136
        description: "Whether orders in this state count in stats."
        example: "true"
      sendEmail:
        id: CAT137
        description: "Whether transitioning to this state triggers an email."
        example: "true"
    code_refs:
      - path: "src/Core/Domain/OrderState/"
        role: model
        description: "OrderState domain aggregate directory"
      - path: "classes/order/OrderState.php"
        role: implementation
        description: "Line 57: the ObjectModel definition with the invoice, delivery, paid, shipped, logable and send_email flags."
      - path: install-dev/data/xml/order_state.xml
        role: seed-data
        description: "Lines 18-55: the thirteen statuses PrestaShop ships and their flags."
    definition: "An order status with a name per language, a colour, an email template and the flags that say what entering it does: issue an invoice, issue a delivery slip, mark the order paid or shipped, count it in statistics, email the customer."
    identity: id_order_state
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: orders.CN011
    name: "OrderMessage"
    description: "A reusable message text the merchant writes once, per language, and picks when writing to a customer about an order."
    stereotype: entity
    attributes:
      orderMessageId:
        id: CAT138
        description: "Unique order message identifier."
        example: "4"
      messageName:
        id: CAT139
        description: "Template name for back-office selection."
        example: "Shipping delay notice"
      messageBody:
        id: CAT140
        description: "Message content (multi-language)."
        example: "Your order has shipped and should reach you within three working days."
    code_refs:
      - path: "src/Core/Domain/OrderMessage/"
        role: model
        description: "OrderMessage domain aggregate directory"
      - path: classes/order/OrderMessage.php
        role: implementation
        description: "Lines 23-32: the ObjectModel definition, multilingual, with name and message required."
    definition: A predefined message with a name and a text per language, chosen in the order page to answer a customer.
    identity: id_order_message
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
