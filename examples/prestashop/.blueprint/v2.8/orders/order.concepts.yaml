---
version: "1.0.0"
scope: orders
tags: [order-core]

concepts:
  - id: orders.CN002
    name: "Order"
    description: "A purchase a customer made from a validated cart; the aggregate root of the orders context."
    stereotype: aggregate-root
    states:
      - name: awaiting-check-payment
        description: "Order placed with offline payment; awaiting manual verification."
      - name: awaiting-wire-payment
        description: "Awaiting bank wire transfer confirmation."
      - name: payment-accepted
        description: "Payment confirmed by gateway or merchant."
      - name: processing
        description: "Order is being prepared for shipment."
      - name: shipped
        description: "Order shipped; tracking number assigned."
      - name: delivered
        description: "Delivery confirmed by carrier or customer."
      - name: cancelled
        description: "Order cancelled before or after shipment."
      - name: refunded
        description: "Full refund processed; order closed."
      - name: payment-error
        description: "Payment attempt failed; awaiting retry or cancellation."
      - name: on-backorder-paid
        description: "Paid but one or more items are on backorder."
      - name: on-backorder-unpaid
        description: "Ordered goods are not in stock and the money has not arrived either. The shop is committed to nothing yet, which is why this state and its paid twin are held apart."
      - name: awaiting-cod-validation
        description: "Cash on delivery order; awaiting validation."
      - name: payment-remotely-accepted
        description: Payment accepted by a remote payment service; paid and invoiced, like Payment accepted.
    transition_rules:
      - orders.TR001
    attributes:
      orderId:
        id: CAT100
        description: "Unique order identifier (auto-incremented integer)."
        example: "4217"
      reference:
        id: CAT101
        description: "Human-readable order reference (e.g. ABCDEFGHI)."
        example: "XKBKNABJK"
      totalPaid:
        id: CAT102
        description: "Total amount paid including tax and shipping."
        example: "129.99"
      totalProducts:
        id: CAT103
        description: "Total product amount excluding tax."
        example: "109.99"
      currentState:
        id: CAT104
        description: "Current order state ID referencing the OrderState entity."
        example: "2"
      customerRef:
        id: CAT105
        description: "Reference to the customer who placed the order."
        example: "customer.CN001:42"
      deliveryAddressRef:
        id: CAT106
        description: "Reference to the delivery address for this order."
        example: "12"
      invoiceAddressRef:
        id: CAT107
        description: "Reference to the invoice/billing address for this order."
        example: "12"
      currency:
        id: CAT108
        description: "Currency of the order, stored as a reference to a shop currency (id_currency); the example shows that currency ISO 4217 code."
        example: "EUR"
      paymentMethod:
        id: CAT109
        description: "Payment module name used for this order."
        example: "ps_wirepayment"
    code_refs:
      - path: "src/Core/Domain/Order/"
        role: model
        description: "The CQRS commands, queries and value objects of the order."
      - path: "classes/order/Order.php"
        role: implementation
        description: "Line 172: the ObjectModel definition (id_order primary, reference, current_state, module, id_currency, totals); lines 1752-1758: generateReference."
      - path: classes/PaymentModule.php
        role: implementation
        description: "Lines 278-284: one reference is generated per checkout and given to every order it creates."
      - path: install-dev/data/xml/order_state.xml
        role: seed-data
        description: "Lines 18-55: the thirteen order statuses PrestaShop ships, each with its paid, invoice, delivery and shipped flags."
    tags: [aggregate-root, core-domain]
    definition: "A customer purchase recorded from a validated cart: the products bought, the delivery and invoice addresses, the carrier, the payment module, the currency and the totals, and a current status taken from the shop order statuses."
    identity: id_order, auto-incremented. The reference (nine random capital letters unless a module supplies one) is shared by the orders one checkout splits into.
    summary: A customer purchase made from a validated cart, with its lines, addresses, carrier, payment, totals and current status.
    examples:
      - name: A back-office order awaiting bank wire payment
        description: Placed by an employee from a customer cart with a payment module and the status Awaiting bank wire payment; it holds no document until a status that issues invoices is applied (order_documents.feature, lines 22-31).
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: orders.CN003
    name: "OrderLine"
    description: "A single line item in an order - product reference, quantity, unit price, and line total. Managed through addProductToOrder, removeProductFromOrder, and updateOrderProduct commands."
    stereotype: entity
    attributes:
      orderDetailId:
        id: CAT110
        description: "Unique line item identifier."
        example: "89"
      productName:
        id: CAT111
        description: "Product name at time of order (snapshot)."
        example: "Classic Laptop 15-inch - Size: M, Color: Black"
      quantity:
        id: CAT112
        description: "Ordered quantity for this line."
        example: "2"
      unitPrice:
        id: CAT113
        description: "Unit price excluding tax at time of order."
        example: "1049.990000"
      lineTotal:
        id: CAT114
        description: "Line total excluding tax, stored on the line (total_price_tax_excl) when the order is created or edited."
        example: "2099.980000"
    relationships:
      - predicate: part-of
        object: orders.CN002
        cardinality: "1..*"
        description: "An order must have at least one line."
    code_refs:
      - path: "classes/order/OrderDetail.php"
        role: implementation
        description: "Line 176: the ObjectModel definition; product_name (line 187), unit_price_tax_excl (218) and total_price_tax_excl (220) are stored on the line."
    definition: One product or combination in an order, with the name, quantity and prices copied from the catalog when it was ordered.
    identity: id_order_detail
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: orders.CN006
    name: "Invoice"
    description: "The invoice of an order: line breakdown, taxes and a sequential number. Issued when the order enters a status that issues invoices, or when the merchant generates it."
    stereotype: entity
    attributes:
      invoiceNumber:
        id: CAT115
        description: "Sequential invoice number for fiscal compliance."
        example: "IN000042"
      invoiceDate:
        id: CAT116
        description: "Date the invoice was generated."
        example: "2026-03-19"
      totalPaidTaxIncl:
        id: CAT117
        description: "Total amount on invoice including tax."
        example: "2519.980000"
      note:
        id: CAT118
        description: "Free-text note attached to the invoice."
        example: "Deliver to the goods entrance, weekdays only."
    relationships:
      - predicate: part-of
        object: orders.CN002
        cardinality: "0..*"
        description: "An order may have zero or more invoices (partial invoicing)."
    code_refs:
      - path: "classes/order/OrderInvoice.php"
        role: implementation
        description: "Line 84: the ObjectModel definition; lines 832-848: getInvoiceNumberFormatted, prefix plus six digits unless a module formats it."
      - path: classes/order/Order.php
        role: implementation
        description: "Line 1308: setInvoice creates the invoice and its number."
    definition: The invoice of an order, numbered in sequence and shown with the shop invoice prefix, issued when the order enters an invoicing status or on the merchant request.
    identity: id_order_invoice; the printed number is the invoice prefix followed by the number on six digits
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: orders.CN005
    name: "PaymentRecord"
    description: "A payment received for an order, with its amount, currency, payment method and transaction id. One order may have several."
    stereotype: entity
    attributes:
      paymentId:
        id: CAT119
        description: "Unique payment record identifier."
        example: "1"
      transactionId:
        id: CAT120
        description: "Payment gateway transaction reference."
        example: "pi_3Mq2Dj2eZvKYlo2C0"
      amount:
        id: CAT121
        description: "Payment amount in order currency."
        example: "129.990000"
      paymentMethod:
        id: CAT122
        description: "Payment module that processed this transaction."
        example: "Bank Wire"
      dateAdd:
        id: CAT123
        description: "Timestamp when payment was recorded."
        example: "2026-03-19T14:25:00+01:00"
    relationships:
      - predicate: part-of
        object: orders.CN002
        cardinality: "0..*"
        description: "An order may have multiple payment records."
    code_refs:
      - path: "classes/order/OrderPayment.php"
        role: implementation
        description: "Lines 31-45: the ObjectModel definition; the payment names order_reference, not an order id."
    definition: "A payment received and recorded against an order reference: amount, currency and conversion rate, payment method, transaction id and card details."
    identity: id_order_payment. A payment belongs to an order reference, so it covers every order one checkout split into.
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: orders.CN004
    name: "ShippingAddress"
    description: "The delivery address an order names. An address an order uses is copied when the customer edits it, so the order keeps the address it was placed with."
    stereotype: value-object
    attributes:
      firstName:
        id: CAT124
        description: "Recipient first name."
        example: "Jean"
      lastName:
        id: CAT125
        description: "Recipient last name."
        example: "Dupont"
      address1:
        id: CAT126
        description: "Street address line 1."
        example: "15 Rue de la Paix"
      city:
        id: CAT127
        description: "City the order ships to, copied onto the order rather than read from the address record, so editing the address later does not rewrite a shipped order."
        example: "Paris"
      postcode:
        id: CAT128
        description: "Postal/ZIP code."
        example: "75001"
      countryCode:
        id: CAT129
        description: "ISO 3166-1 alpha-2 country code."
        example: "FR"
    definition: The address an order is delivered to, held as a reference to an address record that is never edited in place once an order uses it.
    identity: id_address, named by the order as id_address_delivery
    implementation: as-is
    code_refs:
      - path: classes/Address.php
        role: model
        description: "Line 104: the ObjectModel definition; lines 397-410: isUsed counts the orders naming the address for delivery or invoice."
      - path: classes/form/CustomerAddressPersister.php
        role: implementation
        description: "Lines 60-66: an address already used in an order is copied rather than updated."
    provenance:
      discovery_stage: validated
      certainty: confirmed

actors:
  - id: orders.ACT001
    name: "Shopper"
    type: human
    description: "End customer browsing the catalog and placing orders."
    summary: "Online consumer purchasing products."
    responsibilities:
      - "Browse product catalog"
      - "Add items to cart"
      - "Complete checkout and payment"
      - "Track order status"
    personas:
      - id: orders.PER001
        name: Guest shopper
        description: A visitor who buys without opening an account; the specifications name the group 'Guest - All persons who placed an order through Guest Checkout' (presta-specs/content/1.7/back-office/shop-parameters/customer-settings/groups.md).
        goals:
          - Place an order without creating an account, the password being optional (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Enable guest checkout').
          - Check the delivery address, invoice address, carrier, products and totals on one summary before paying (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Enable final summary').
        pain_points:
          - When the merchant disables guest checkout, the first checkout step demands an account with a required password (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Enable guest checkout').
          - "'Proceed to checkout' stays disabled until the cart reaches the merchant's minimum purchase total (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Minimum purchase total required in order to validate the order')."
      - id: orders.PER002
        name: Gift buyer
        description: A shopper who sends the order to someone else; the checkout's gift wrapping and gift message exist for this case (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Gift'; code classes/checkout/CheckoutDeliveryStep.php).
        goals:
          - Have the order gift wrapped by ticking 'I would like my order to be gift wrapped' at the shipping step (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Offer gift wrapping').
          - Send a gift message with the order (code classes/checkout/CheckoutDeliveryStep.php, the gift and gift_message request parameters).
          - Deliver to an address other than the invoice address (code classes/checkout/CheckoutAddressesStep.php, use_same_address).
        pain_points:
          - The gift option appears only when the merchant has enabled gift wrapping, and a gift message is kept only when the gift box is ticked (code classes/checkout/CheckoutDeliveryStep.php; presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Offer gift wrapping').
          - The wrapping price, taxed by the merchant's gift-wrapping tax rule, is shown only at the shipping step (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Gift-wrapping price', 'Gift-wrapping tax').

  - id: orders.ACT002
    name: "Order Domain Lead"
    type: role
    description: "Technical lead responsible for the orders bounded context architecture and reliability."
    summary: "Technical architect for order processing."

  - id: orders.ACT003
    name: "Merchant"
    type: human
    description: "Business owner managing daily PrestaShop store operations - products, orders, returns."
    summary: "Store owner and operator."
    responsibilities:
      - "Manage product listings and pricing"
      - "Process and fulfill customer orders"
      - "Handle returns and refunds"
      - "Monitor store performance metrics"
    personas:
      - id: orders.PER003
        name: Single-shop merchant
        description: The merchant who runs one shop alone with the SuperAdmin profile created at installation, the reader the specifications address as 'the merchant' (presta-specs/content/1.7/back-office/advanced-parameters/team/permissions-listing.md, 'Left panel').
        goals:
          - Read the day's activity and main statistics at a glance on the dashboard (presta-specs/content/1.7/back-office/dashboard/dashboard.md).
          - Decide per order status whether the customer gets an email and may download the invoice (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-statuses.md, '4) Send email to the customer', '6) Invoice').
          - Run promotions as cart rules that grant free shipping, a percentage or amount discount, or a free gift (presta-specs/content/1.7/back-office/catalog/discount/add-edit-cart-price-rule.md, 'Actions tab').
          - Load categories and products from CSV files (presta-specs/content/1.7/back-office/advanced-parameters/import/configure-import.md).
          - Get the list of every module that needs an update (presta-specs/content/1.7/back-office/modules/module-manager/updates.md).
        pain_points:
          - The 'Delayed shipping' order setting does not work (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Delayed shipping', PrestaShop issue 9781).
          - An import with 'Delete all ... before import' switched on erases the existing records first (presta-specs/content/1.7/back-office/advanced-parameters/import/configure-import.md).
          - Rounding the tax amount separately can leave an invoice one cent off its total (presta-specs/content/1.7/broader-topics/price-calculation-rules.md, 'Context - the problem').

  - id: orders.ACT004
    name: "Administrator"
    type: human
    description: "Tech support specialist resolving customer issues, managing refunds, and handling escalations."
    summary: "Customer support and tech ops."
    responsibilities:
      - "Resolve customer order complaints"
      - "Process refunds and cancellations"
      - "Investigate order processing errors"
      - "Escalate technical issues to engineering"

enumerations:
  - id: orders.EN001
    name: "OrderStatus"
    description: "Lifecycle states of an order in PrestaShop. Maps to the ps_order_state table with configurable labels and colors. transitions_to lists the moves the default flow makes; the product accepts a change to any other existing status."
    values:
      - name: awaiting-check-payment
        description: "Order placed with offline payment; awaiting manual verification."
        transitions_to: [payment-accepted, cancelled, payment-error]
      - name: awaiting-wire-payment
        description: "Awaiting bank wire transfer confirmation."
        transitions_to: [payment-accepted, cancelled]
      - name: payment-accepted
        description: "Payment confirmed by gateway or merchant."
        transitions_to: [processing, cancelled, refunded]
      - name: processing
        description: "Order is being prepared for shipment."
        transitions_to: [shipped, cancelled, refunded]
      - name: shipped
        description: "Shipped, tracking number assigned."
        transitions_to: [delivered]
      - name: delivered
        description: "Delivery confirmed."
        terminal: true
      - name: cancelled
        description: "Cancelled before or after shipment."
        terminal: true
      - name: refunded
        description: "Full refund processed."
        terminal: true
      - name: payment-error
        description: "Payment attempt failed."
        transitions_to: [awaiting-check-payment, awaiting-wire-payment, cancelled]
      - name: on-backorder-paid
        description: "Paid but items on backorder."
        transitions_to: [processing, cancelled, refunded]
      - name: on-backorder-unpaid
        description: "Not in stock and not yet paid, so neither the shopper nor the shop is committed. It moves to payment-accepted when the money lands, or to cancelled."
        transitions_to: [payment-accepted, cancelled]
      - name: awaiting-cod-validation
        description: "Cash on delivery; awaiting validation."
        transitions_to: [payment-accepted, cancelled]
      - name: payment-remotely-accepted
        description: Payment accepted by a remote payment service.

  - id: orders.EN002
    name: "PaymentMethod"
    description: "Supported payment methods in PrestaShop checkout."
    values: [credit-card, paypal, bank-transfer, cash-on-delivery, mollie, stripe]
    extensible: true

associations:
  - id: orders.ASC001
    predicate: depends-on
    subject: orders.CN002
    object: orders.CN004
    cardinality: "1:1"
    description: "Every order depends on a delivery address."

  - id: orders.ASC002
    predicate: triggers
    subject: orders.CN002
    object: orders.CN006
    description: "Entering an order status flagged to issue invoices, Payment accepted among them, triggers invoice generation."
