---
version: "1.0.0"
scope: orders

metrics:
  - id: orders.MT001
    name: "Order Processing Latency"
    type: latency
    unit: "ms"
    measures:
      operations: [orders.CMD001]
    collection:
      method: manual
      source: "PHP slow-request log and the back-office order list; core ships no metrics exporter"
      frequency: weekly

  - id: orders.MT002
    name: "Refund Processing Time"
    type: latency
    unit: "ms"
    measures:
      operations: [orders.CMD003, orders.CMD015, orders.CMD016]
    collection:
      method: manual
      source: "PHP slow-request log and the back-office order list; core ships no metrics exporter"
      frequency: weekly

  - id: orders.MT100
    name: "Order Conversion Rate Records"
    summary: "Share of orders that stored the currency conversion rate they were placed at"
    type: business
    unit: "%"
    description: >
      Order.conversion_rate is a required column filled when the order is
      placed, and OrderPayment stores the rate again at payment. Together they
      are what keeps a past order priced at the rate it was sold at when the
      currency moves afterwards. A zero or absent rate is an order whose total
      a later report will restate.
    measures:
      operations: [orders.CMD001, orders.CMD007]
      concepts: [orders.CN002]

kpis:
  - id: KPI001
    name: "Order Error Rate"
    domain_scope: orders
    metric: orders.MT001
    target: "< 0.1% of orders result in processing errors"
    description: >
      Counts orders whose placement or state change raised a domain exception,
      against orders attempted. Core keeps no error counter, so the source is the
      PHP error log joined to the order log.
    window: "monthly"
    goal: orders.GL003
    thresholds:
      warning: "0.5%"
      critical: "1.0%"

  - id: KPI002
    domain_scope: orders
    name: "Checkout-to-Confirmation Time"
    target: "p95 < 3 seconds from checkout click to order confirmation"
    description: >
      Wall-clock from the shopper confirming the cart to the order confirmation
      page. INQ003 asked whether the template engine is what makes this number
      large.
    window: "weekly"
    goal: orders.GL001
    thresholds:
      warning: "5s"
      critical: "10s"

  - id: KPI003
    domain_scope: orders
    name: "Invoice Generation Compliance Rate"
    target: "100% of paid orders have a compliant invoice within 24h"
    description: >
      GenerateInvoice assigns the invoice number and date, and an order that is
      paid without one cannot be reported for VAT. Countable from the order invoice
      table against paid orders.
    window: "monthly"
    goal: orders.GL004
    thresholds:
      warning: "99%"
      critical: "95%"

  - id: orders.KPI100
    domain_scope: orders
    name: "Order Currency Rate Integrity"
    metric: orders.MT100
    target: "100% of orders carry a non-zero conversion rate recorded at the moment they were placed"
    window: "monthly"
    goal: orders.GL002
    description: >
      GL002's measure. Multi-currency ordering is correct only if a past order
      keeps the rate it was sold at; re-deriving it from today's rate changes
      history, which is the dispute RSK002 describes.

slos:
  - id: SLO001
    name: "Order API Availability"
    target: "99.9% uptime"
    window: "monthly"
    operations: [orders.CMD001, orders.QRY001]
    error_budget: "43.8 minutes per month"
    breach:
      action: "Page on-call engineer and freeze non-critical deployments."
      notification: "#team-orders Slack channel"

  - id: SLO002
    name: "Order Query Response Time"
    target: "p99 < 500ms"
    window: "weekly"
    operations: [orders.QRY001]

  - id: SLO003
    name: "Refund Processing SLO"
    target: "p95 < 5 seconds end-to-end"
    window: "monthly"
    operations: [orders.CMD003, orders.CMD015]
    error_budget: "5% of refund operations may exceed target"

security:
  - id: orders.SEC001
    name: "Order Data Access Control"
    type: authorization
    requirement: "Customers can only view their own orders. Merchants see orders for their store. Admins see all."
    operations: [orders.QRY001, orders.QRY002, orders.QRY003]

  - id: orders.SEC002
    name: "Refund Authorization"
    type: authorization
    requirement: "Only employees whose profile grants the AdminOrders permission can issue a refund. Core offers no second authentication factor to require above a threshold: an employee signs in with an email address and a password and nothing else, so the permission row is the whole of the control."
    operations: [orders.CMD003, orders.CMD015, orders.CMD016]

compliance:
  - id: orders.CMP001
    name: "GDPR Order Data Retention"
    regulation: "GDPR Article 17 - Right to Erasure"
    requirement: "Customer order data must be anonymizable upon request. Retention period for completed orders is 7 years (tax compliance)."
    concepts: [orders.CN002, orders.CN004]
    retention:
      period: "7 years"
      action: anonymize

  - id: orders.CMP002
    name: "EU Consumer Rights - 14-day Return Window"
    regulation: "EU Consumer Rights Directive 2011/83/EU"
    requirement: "All EU orders must allow returns within a minimum of 14 days from delivery. Merchants may offer longer windows."
    concepts: [orders.CN002, orders.CN007]
