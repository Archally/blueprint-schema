---
version: "1.0.0"
scope: orders
tags: [returns]

concepts:
  - id: orders.CN007
    name: "OrderReturn"
    description: "A merchandise return a customer requests for a delivered order, with the products and quantities sent back and a return state. Managed as a standalone aggregate with its own lifecycle."
    stereotype: aggregate-root
    states: [waiting-for-confirmation, waiting-for-package, package-received, return-completed, return-denied]
    initial_state: waiting-for-confirmation
    code_refs:
      - path: "src/Core/Domain/OrderReturn/"
        role: model
        description: "The CQRS commands and queries of the merchandise return."
      - path: "classes/order/OrderReturn.php"
        role: implementation
        description: "Line 35: the ObjectModel definition, with id_order and the state id."
      - path: controllers/front/OrderFollowController.php
        role: implementation
        description: "Line 108: a return requested in the storefront starts in state 1, Waiting for confirmation."
      - path: src/Adapter/OrderReturn/CommandHandler/UpdateOrderReturnStateHandler.php
        role: implementation
        description: "Lines 65-77: the merchant may set any return state; the customer is emailed when it changes."
    definition: A customer request to send back products of an order, listing the products and quantities, with a state taken from the shop return states.
    identity: id_order_return
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: orders.CN008
    name: "OrderReturnState"
    description: "A state a merchandise return can be in. The merchant names and colours each state per language and may add states; five ship with PrestaShop."
    stereotype: value-object
    code_refs:
      - path: "src/Core/Domain/OrderReturnState/"
        role: model
      - path: "classes/order/OrderReturnState.php"
        role: implementation
        description: "Line 23: the ObjectModel definition."
      - path: install-dev/langs/en/data/order_return_state.xml
        role: seed-data
        description: "Lines 3-16: the five return states PrestaShop ships."
    definition: A merchandise return state with a name per language and a colour; PrestaShop ships Waiting for confirmation, Waiting for package, Package received, Return denied and Return completed.
    identity: id_order_return_state
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed

  - id: orders.CN009
    name: "CreditSlip"
    description: "A document recording money returned to a customer for an order. Created only by a partial or standard refund; it has no commands of its own."
    stereotype: read-model
    attributes:
      creditSlipId:
        id: CAT130
        description: "Unique credit slip identifier."
        example: "31"
      amount:
        id: CAT131
        description: "Total credited amount including tax."
        example: "129.990000"
      dateAdd:
        id: CAT132
        description: "Timestamp when the credit slip was generated."
        example: "2026-03-25T09:10:00+01:00"
    relationships:
      - predicate: derived-from
        object: orders.CN002
        description: "Credit slips are derived from refund operations on an order."
    code_refs:
      - path: "classes/order/OrderSlip.php"
        role: implementation
        description: "Line 56: the ObjectModel definition (id_order, totals with and without tax, shipping, partial); creating one fires actionObjectOrderSlipAddAfter."
      - path: "src/Core/Domain/CreditSlip/"
        role: model
        description: "The whole CQRS surface of the credit slip: one query class and no command, because a credit slip is only ever produced by a refund"
      - path: "src/Adapter/Order/Refund/OrderSlipCreator.php"
        role: implementation
        description: "Creates the slip during a refund and fires actionOrderSlipAdd"
    definition: "A credit slip for an order: the products and shipping refunded, their amounts with and without tax, and whether the refund was partial."
    identity: id_order_slip
    implementation: as-is
    provenance:
      discovery_stage: validated
      certainty: confirmed
