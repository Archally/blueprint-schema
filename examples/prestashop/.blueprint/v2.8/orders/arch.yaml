version: 1.0.0
name: Orders (PrestaShop)
description: Architecture of the PrestaShop Orders bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC008
    name: Orders
    kind: core
    value_stream_ref: VS001
    complexity: concurrency
    business_model_role: revenue-generator
    evolution: product
    model_traits: [controller, executor]
    summary: Order lifecycle - placement, state management, cancellation, refund, invoice, returns, credit slips.
    owned_by:
      team: TM001
    responsibilities:
      - Order creation from validated cart
      - Order state machine (created → paid → shipped → delivered)
      - Cancellation and refund processing
      - Invoice and delivery slip generation
      - Order return and credit slip management
      - Order messaging between merchant and customer
      - Payment record tracking
    dependencies:
      # The shared kernel with Checkout is declared once, from the Checkout side
      # (checkout/arch.yaml), with direction peer: a shared kernel is one fact about a pair.
      - name: Catalog
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Prices order lines and takes their stock inside the placing request:
          PaymentModule::validateOrder calls Product::getPriceStatic for each line
          (classes/PaymentModule.php:472), and OrderDetail::updateProductQuantityInStock calls
          StockAvailable::updateQuantity (classes/order/OrderDetail.php:532). Customer-supplier
          because the order consumes Catalog's prices and decrements its stock through Catalog's
          own class.
        bounded_context_ref: prestashop.BC002
      - name: Customers
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Loads the customer and addresses and writes the order's customer message inside the
          placing request: PaymentModule::validateOrder builds a Customer
          (classes/PaymentModule.php:221), an Address (classes/PaymentModule.php:654) and a
          CustomerThread (classes/PaymentModule.php:581). Customer-supplier because the order
          consumes the customer model and adds to the thread in Customers' shape.
        bounded_context_ref: prestashop.BC005
      - name: Shipping
        coupling: inprocess
        relationship: customer-supplier
        direction: downstream
        description: >-
          Takes the delivery option and carrier inside the placing request:
          PaymentModule::validateOrder reads Cart::getDeliveryOptionList
          (classes/PaymentModule.php:260) and builds the order's Carrier
          (classes/PaymentModule.php:658). Customer-supplier because the order consumes the
          carrier and its cost and changes neither.
        bounded_context_ref: prestashop.BC010
      - name: International
        relationship: customer-supplier
        direction: downstream
        description: >-
          Fixes the order's currency and conversion rate at placement:
          PaymentModule::validateOrder builds a Currency for the cart's currency
          (classes/PaymentModule.php:229). Customer-supplier because the order consumes the rate
          and stores a copy. The coupling is the exchange-rates contract below, so none is
          declared here.
        bounded_context_ref: prestashop.BC006
    services:
      - id: prestashop.SVC008
        name: OrderService
        kind: service
        summary: In-process order commands, queries and local hooks within the PrestaShop monolith.
        needs:
          - { type_ref: RT001, class: self-hosted, id: prestashop-db }
        contracts:
          scheduledtransfer:
            contract_name: exchange-rates
            slice: international
            read:
              - international.DOC001
          inprocess:
            provide:
              - orders.CMD001 # PlaceOrder
              - orders.CMD002 # CancelOrder
              - orders.CMD003 # IssueStandardRefund
              - orders.QRY001 # GetOrderForViewing
              - orders.EVT001 # OrderPlaced
              - orders.EVT002 # OrderCancelled
              - orders.EVT003 # OrderRefunded
              - orders.EVT004 # OrderShipped
          openapi:
            contract_name: orders-api
            slice: orders
            expose: [orders.CMD023]
        implementation: "as-is"
        code_refs:
          - path: src/Core/Domain/Order/
            role: implementation
            description: Source for this logical module within the PrestaShop PHP monolith; verified in the cited develop checkout a27e912eef9.
          - path: PrestaShop/ps_apiresources#src/ApiPlatform/Resources/OrderReturn/OrderReturn.php
            role: api-spec
            description: Lines 45-51 expose PATCH /order-returns/{orderReturnId} through UpdateOrderReturnStateCommand. This is an HTTP entry into the in-process Orders module, not a separate deployment.
