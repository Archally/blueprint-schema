---
version: "1.0.0"
scope: customers
tags: [customer, account-management]

concepts:
  - id: customers.CN001
    name: "Customer"
    description: "Registered customer account with profile, authentication, group membership, and newsletter preferences. Guests are customers with is_guest flag set."
    stereotype: aggregate-root
    states: [active, inactive, guest]
    initial_state: active
    attributes:
      customerId:
        id: CAT300
        description: "Unique customer identifier"
        example: "42"
      email:
        id: CAT301
        description: "Email address - unique per shop, used for authentication"
        example: "jean.dupont@example.com"
      firstName:
        id: CAT302
        description: "Customer first name"
        example: "Jean"
      lastName:
        id: CAT303
        description: "Customer last name"
        example: "Dupont"
      isGuest:
        id: CAT304
        description: "Whether this is a guest account (no password, checkout-only)"
        example: "false"
      active:
        id: CAT305
        description: "Whether the account is enabled"
        example: "true"
      newsletter:
        id: CAT306
        description: "Newsletter subscription opt-in status"
        example: "true"
      defaultGroupId:
        id: CAT307
        description: "Reference to the customer's default group (determines pricing and display)"
        example: "3"
    code_refs:
      - path: "src/Core/Domain/Customer/Command/AddCustomerCommand.php"
        role: implementation
      - path: "src/Core/Domain/Customer/Command/EditCustomerCommand.php"
        role: implementation

  - id: customers.CN002
    name: "CustomerGroup"
    description: "Customer classification group that defines discount percentage, price display method (tax inclusive/exclusive), and shop visibility. Groups are managed independently but assigned to customers."
    stereotype: entity
    attributes:
      groupId:
        id: CAT308
        description: "Unique group identifier"
        example: "3"
      name:
        id: CAT309
        description: "Localized group display name"
        example: "Customer"
      reductionPercent:
        id: CAT310
        description: "Default discount percentage for group members (0-100)"
        example: "5.00"
      displayPriceTaxExcluded:
        id: CAT311
        description: "Whether prices are shown tax-excluded for this group"
        example: "false"
      showPrice:
        id: CAT312
        description: "Whether prices are visible to this group"
        example: "true"
    code_refs:
      - path: "src/Core/Domain/Customer/Group/Command/AddCustomerGroupCommand.php"
        role: implementation

  - id: customers.CN003
    name: "Title"
    description: "Reference data for customer salutation (Mr, Mrs, Ms, etc.). Configurable with gender association and image."
    stereotype: value-object
    attributes:
      titleId:
        id: CAT313
        description: "Unique title identifier"
        example: "1"
      name:
        id: CAT314
        description: "Localized title label"
        example: "Mr"
      gender:
        id: CAT315
        description: "Associated gender type"
        example: "0"
    code_refs:
      - path: "src/Core/Domain/Title/Command/AddTitleCommand.php"
        role: implementation

actors:
  - id: customers.ACT001
    name: "Customer"
    type: human
    description: "Registered customer managing their account profile, addresses, and privacy settings. Distinct from the ordering perspective (orders.ACT001 Shopper) - same person, different bounded context."
    responsibilities:
      - "Register and manage account profile"
      - "Add and update delivery/invoice addresses"
      - "Manage newsletter subscription"
      - "Request personal data export or deletion (GDPR)"
      - "Submit customer service inquiries"
    personas:
      - id: customers.PER001
        name: Registered customer
        description: A customer with an account, who returns to it for documents, past orders and vouchers (presta-specs/content/1.7/front-office/customer-account.md).
        goals:
          - View and download invoices and delivery slips in my own language from the order history (presta-specs/content/1.7/front-office/customer-account.md, 'Order history and details').
          - Reorder a past order from the order history when the shop offers the reorder link (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-settings.md, 'Disable reordering option').
          - See the vouchers available to me, with the quantity left and the expiry date (presta-specs/content/1.7/front-office/Your-vouchers.md).
        pain_points:
          - An invoice can be downloaded only once the order reaches a status the merchant has set to allow it (presta-specs/content/1.7/back-office/shop-parameters/order-settings/order-statuses.md, '6) Invoice').
          - A voucher with a code that is not highlighted and not restricted to me personally is not listed on my vouchers page, even when it is restricted to my customer group (presta-specs/content/1.7/front-office/Your-vouchers.md, cases 3 and 6).

  - id: customers.ACT002
    name: "CustomerServiceAgent"
    type: human
    description: "Back-office employee handling customer support threads, replying to inquiries, and forwarding threads to specialists."
    responsibilities:
      - "View and reply to customer service threads"
      - "Forward threads to appropriate employees"
      - "Update thread status (open, closed, pending)"
      - "Use predefined message templates"
    personas:
      - id: customers.PER002
        name: Salesman
        description: The employee holding PrestaShop's default Salesman profile, whose menus are orders, shopping carts, customers, customer service and order messages (presta-specs/content/1.7/back-office/advanced-parameters/team/permissions-listing.md, 'Salesman profile Menu permissions').
        goals:
          - Answer customer threads and move each one through the Open, Closed, Pending 1 and Pending 2 statuses (presta-specs/content/1.7/back-office/customer-service/customer-service/dashboard.md, 'MEANING OF STATUS').
          - Bring customers' email replies into the threads through the IMAP settings (presta-specs/content/1.7/back-office/customer-service/customer-service/dashboard.md, 'CUSTOMER SERVICE OPTIONS').
          - Keep predefined order messages, such as the default Delay message, ready to send about an order (presta-specs/content/1.7/back-office/customer-service/order-messages/order-messages.md).
        pain_points:
          - A message sent through the front-office contact form reaches the thread list only if its contact has 'Save messages?' enabled (presta-specs/content/1.7/back-office/customer-service/customer-service/dashboard.md, 'Listing').
          - The default Salesman profile has Merchandise Returns and Delivery Slips disabled, so a return cannot be handled until someone widens the profile (presta-specs/content/1.7/back-office/advanced-parameters/team/permissions-listing.md, 'Salesman profile Menu permissions').

enumerations:
  - id: customers.EN001
    name: "Gender"
    description: "Gender types associated with titles."
    values:
      - name: male
        description: "Gender type 0 in the Title value object. A title such as Mr is bound to a gender type, and the binding is what picks the salutation in an order email."
      - name: female
        description: "Gender type 1. Titles such as Mrs and Ms both bind here, so the type is coarser than the title a shopper picked."
      - name: neutral
        description: "Gender-neutral or unspecified."

  - id: customers.EN002
    name: "PriceDisplayMethod"
    description: "How prices are shown to customers in a group."
    values:
      - name: tax-included
        description: "Prices shown with tax included."
      - name: tax-excluded
        description: "Prices shown without tax."

associations:
  - id: customers.ASC001
    subject: customers.CN001
    predicate: depends-on
    object: customers.CN002
    cardinality: "*..*"
    description: "Customers are assigned to groups that determine their pricing and discount level."
