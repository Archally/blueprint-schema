---
name: "Customer Processes"
version: "1.0.0"
scope: customers

processes:
  - id: customers.PRC001
    tracker_ref: "40873"
    title: "Customer account lifecycle"
    description: "Customer registers, manages profile, and eventually exercises GDPR rights."
    initiated_by: [customers.ACT001]
    trigger:
      type: message
      operation: customers.CMD001
      description: "Customer registers a new account."
    end_states:
      - name: "Account lifecycle complete"
        type: complete
        description: "Account created, addresses managed, GDPR data deletion exercised."
      - name: "Registration failed"
        type: error
        description: "Duplicate email or password policy violation."
    lanes:
      - actor: customers.ACT001
        operations: [customers.CMD001, customers.CMD012, customers.CMD003]
    activities:
      - id: customers.PA001
        name: "Register account"
        entry_operation: customers.CMD001
        path_type: happy
      - id: customers.PA002
        name: "Manage addresses"
        entry_operation: customers.CMD012
        path_type: happy
      - id: customers.PA003
        name: "Request data deletion"
        entry_operation: customers.CMD003
        path_type: happy
    code_refs:
      - path: "src/PrestaShopBundle/Controller/Admin/Sell/Customer/CustomerController.php"
        role: implementation
        description: "Customer account management controller."
      - path: "controllers/front/RegistrationController.php"
        role: implementation
        description: "Front-office customer registration."

  - id: customers.PRC002
    title: "Customer service interaction"
    description: "Customer submits inquiry, agent responds and resolves."
    initiated_by: [customers.ACT002]
    trigger:
      type: message
      operation: customers.CMD016
      description: "Support agent replies to a customer service thread."
    end_states:
      - name: "Inquiry resolved"
        type: complete
        description: "Reply sent, thread resolved or forwarded to specialist."
      - name: "Thread not found"
        type: error
        description: "Service thread does not exist or is already closed."
    lanes:
      - actor: customers.ACT002
        operations: [customers.CMD016, customers.CMD017]
    activities:
      - id: customers.PA004
        name: "Reply to thread"
        entry_operation: customers.CMD016
        path_type: happy
      - id: customers.PA005
        name: "Forward to specialist"
        entry_operation: customers.CMD017
        path_type: happy

user_stories:
  - id: customers.US001
    actor: customers.ACT001
    goal: "register a customer account"
    benefit: "I can track orders, save addresses, and receive personalized offers"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Account created with valid email and password"
      - "Welcome email sent"
      - "Customer assigned to default group"
    operations: [customers.CMD001, customers.EVT001]
    test_cases: [customers.TC001]
    use_case: customers.UC001

  - id: customers.US002
    tracker_ref: "41550"
    actor: customers.ACT001
    goal: "add and manage my delivery addresses"
    benefit: "I can ship to multiple locations without re-entering data"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Address saved with all required fields for my country"
      - "Can set a default address"
      - "Can edit or delete existing addresses"
    operations: [customers.CMD012, customers.CMD013, customers.CMD014]
    test_cases: [customers.TC002]
    use_case: customers.UC002

  - id: customers.US003
    actor: orders.ACT004
    goal: "convert a guest account to a registered customer"
    benefit: "the customer gains full account features after a guest checkout"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Guest account converted with existing email"
      - "Order history preserved"
      - "Customer can now log in"
    operations: [customers.CMD008, customers.EVT004]
    test_cases: [customers.TC003]

  - id: customers.US004
    actor: customers.ACT002
    goal: "reply to a customer service thread"
    benefit: "the customer gets a timely response to their inquiry"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Reply added to thread"
      - "Customer notified by email"
      - "Thread status updated"
    operations: [customers.CMD016, customers.EVT010]
    test_cases: [customers.TC004]
    use_case: customers.UC003

  - id: customers.US005
    actor: orders.ACT004
    goal: "set up a B2B customer group with wholesale pricing"
    benefit: "business customers automatically get volume discounts"
    delivery_priority: should-have
    status: draft
    release_target: "v1.1"
    acceptance_criteria:
      - "Group created with discount percentage"
      - "Price display set to tax-excluded"
      - "Customers assignable to the group"
    operations: [customers.CMD009, customers.EVT005]

  - id: customers.US006
    tracker_ref: "40873"
    actor: customers.ACT001
    goal: "request deletion of my personal data"
    benefit: "I exercise my GDPR right to be forgotten"
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    acceptance_criteria:
      - "Personal data anonymized within 30 days"
      - "Order records retained with anonymized reference"
      - "Confirmation email sent"
    operations: [customers.CMD003, customers.EVT003]

  - id: customers.US007
    actor: customers.ACT001
    goal: "create an account on the storefront so the shop remembers me"
    benefit: "My addresses and my order history are there the next time, and I do not retype them."
    summary: "Shopper registers on the storefront."
    description: >
      The same domain operation the Admin API's POST /customers performs, reached by a
      different route: the registration page writes through CustomerPersister and
      Customer::save, while the command's handler writes through Customer::add. One row, one
      set of actionObjectCustomerAdd hooks, two adapters. The page also carries a veto hook -
      actionSubmitAccountBefore - that lets a module refuse a registration outright, which is
      how anti-spam and B2B-approval modules work.
    acceptance_criteria:
      - "The registration page always produces a full account; guest accounts come only from checkout."
      - "A module subscribed to actionSubmitAccountBefore can refuse the submission and nothing is written."
      - "A shopper who is already signed in is redirected away rather than shown the form."
      - "After registering, the shopper returns to the page they came from where the shop recognises it, and otherwise to the home page."
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    operations: [customers.CMD001, customers.EVT001]
    code_refs:
      - path: "controllers/front/RegistrationController.php"
        role: implementation
        description: "initContent at line 38: guest disallowed, the veto hook, then the three-way redirect."

  - id: customers.US008
    actor: orders.ACT001
    goal: "keep the account the shop created for me when I checked out as a guest"
    benefit: "I get an order history and a saved address without filling the same form a second time."
    summary: "Guest converts to a registered customer from the order confirmation page."
    description: >
      PrestaShop's answer to the oldest tension in checkout. A guest is not asked to register
      before buying; the account already exists as a guest row, and the confirmation page asks
      only for a password. The conversion resets the customer's group to the shop's default,
      stamps a password-reset token and sends either a set-your-password link or a welcome
      mail. It is the same domain operation the back office can perform, reached through
      Customer::transformToCustomer rather than over the command bus.
    acceptance_criteria:
      - "The offer appears on the confirmation page only for a shopper who checked out as a guest."
      - "The password is checked against the shop's configured minimum length and minimum strength score before anything is written."
      - "A guest already converted in another window or by the back office is told so and asked to sign in, rather than converted twice."
      - "After conversion the customer's group is the shop's configured default, not the guest group."
    delivery_priority: should-have
    status: ready
    release_target: "v1.0"
    operations: [customers.CMD008, customers.EVT004]
    code_refs:
      - path: "controllers/front/OrderConfirmationController.php"
        role: implementation
        description: "postProcess from line 109: the password policy checks, the already-converted refusal, then Customer::transformToCustomer at line 186."

  - id: customers.US009
    actor: customers.ACT001
    goal: "keep my delivery and invoice addresses up to date from my account"
    benefit: "Checkout offers the address I actually want without my retyping it each order."
    summary: "Shopper manages their own address book."
    description: >
      Two pages and one form: the address book lists, and the form creates and edits with the
      same controls. The field set is not fixed, because the form asks the chosen country for
      its required fields. One guard exists here that the Admin API route has no reason to
      carry: an address currently used by the shopper's cart cannot be deleted.
    acceptance_criteria:
      - "The form creates when the link carries no address id and edits when it carries one, with the same submit control."
      - "Changing the country changes which fields the form requires."
      - "Deleting an address that is the current cart's delivery or invoice address is refused with a message saying why."
      - "A saved address is offered at the checkout's Addresses step."
    delivery_priority: must-have
    status: ready
    release_target: "v1.0"
    operations: [customers.CMD012, customers.CMD013, customers.CMD014, customers.EVT007, customers.EVT008, customers.EVT009]
    code_refs:
      - path: "controllers/front/AddressController.php"
        role: implementation
        description: "postProcess at line 39; the in-cart delete refusal at line 71."

use_cases:
  - id: customers.UC001
    name: "Register Customer Account"
    summary: "New customer creates an account with email, password, and basic profile."
    primary_actor: customers.ACT001
    goal: "Create a registered customer account."
    preconditions:
      - "Email not already used by another customer in this shop"
    postconditions:
      - "Customer account created and active"
      - "CustomerCreated event emitted"
    main_scenario:
      - step: 1
        action: "Customer navigates to registration page."
        emotion: neutral
      - step: 2
        action: "Customer fills in name, email, and password."
        emotion: neutral
        pain_point: "Too many required fields for a simple registration"
      - step: 3
        action: "System validates email uniqueness and password strength."
        operation: customers.CMD001
      - step: 4
        action: "System creates account and sends welcome email."
        operation: customers.EVT001
        emotion: satisfied
    extensions:
      - step: 3
        condition: "Email already exists."
        action: "System displays duplicate email error."
    user_stories: [customers.US001]
    delivery_priority: must-have

  - id: customers.UC002
    tracker_ref: "github:42043"
    name: "Manage Customer Addresses"
    summary: "Customer adds, edits, or deletes delivery and invoice addresses."
    primary_actor: customers.ACT001
    goal: "Maintain a set of addresses for ordering."
    preconditions:
      - "Customer is logged in"
    postconditions:
      - "Address book updated"
    main_scenario:
      - step: 1
        action: "Customer navigates to address management page."
        emotion: neutral
      - step: 2
        action: "Customer clicks 'Add new address'."
        emotion: neutral
      - step: 3
        action: "Customer fills in address fields (required fields vary by country)."
        emotion: neutral
        pain_point: "Country-specific required fields are not obvious before selecting country"
      - step: 4
        action: "System validates address and saves."
        operation: customers.CMD012
      - step: 5
        action: "System confirms address saved."
        operation: customers.EVT007
        emotion: satisfied
    extensions:
      - step: 4
        condition: "Missing required fields for selected country."
        action: "System highlights missing fields with country-specific error messages."
    user_stories: [customers.US002]
    delivery_priority: must-have

  - id: customers.UC003
    name: "Handle Customer Service Request"
    summary: "Agent views customer thread, replies, and resolves the issue."
    primary_actor: customers.ACT002
    goal: "Resolve a customer inquiry through the service thread."
    preconditions:
      - "Thread exists with status open or pending"
    postconditions:
      - "Reply sent to customer"
      - "Thread status updated"
    main_scenario:
      - step: 1
        action: "Agent opens the customer service thread."
        operation: customers.QRY011
        emotion: neutral
      - step: 2
        action: "Agent reviews customer history and thread context."
        emotion: neutral
      - step: 3
        action: "Agent composes and sends reply."
        operation: customers.CMD016
      - step: 4
        action: "Agent updates thread status to resolved."
        operation: customers.CMD018
        emotion: satisfied
    extensions:
      - step: 3
        condition: "Issue requires specialist knowledge."
        action: "Agent forwards thread to another employee."
    user_stories: [customers.US004]
    delivery_priority: must-have
