---
name: "Customer Group"
version: "1.0.0"
scope: customers
tags: [customer-group]

operations:
  addCustomerGroup:
    id: customers.CMD009
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/groups
        method: POST
        group: customers
    payload:
      schema: CustomerGroupResource
      contentType: application/json
    responses:
      - code: "201"
        type: success
        description: "The group was created and can now be assigned to customers."
        schema: CustomerGroupResource
        contentType: application/json
      - code: "422"
        type: failure
        description: "The reduction percentage is outside 0 to 100, or a localized name is missing."
        error: customers.ERR018
    name: "AddCustomerGroup"
    description: "Create a new customer group with localized names, a discount percentage, price-display settings and shop assignment."
    delivery_priority: should-have
    initiated_by: [orders.ACT004]
    governed_by:
      - rule: customers.VR004
    materializes:
      - concept: customers.CN002
        action: create
    produces:
      operations: [customers.EVT005]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Group/Command/AddCustomerGroupCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/Group/CommandHandler/AddCustomerGroupHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/CustomerGroup.php"
        role: api-spec

  editCustomerGroup:
    id: customers.CMD010
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/groups/{customerGroupId}
        method: PUT
        group: customers
    payload:
      schema: CustomerGroupResource
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The group as stored after the edit. Every customer in it sees the new discount immediately."
        schema: CustomerGroupResource
        contentType: application/json
      - code: "404"
        type: failure
        description: "No group with this identifier exists."
        error: customers.ERR004
      - code: "422"
        type: failure
        description: "The reduction percentage is outside 0 to 100."
        error: customers.ERR018
    name: "EditCustomerGroup"
    description: "Update a customer group's names, discount or display settings. Served as a full replace rather than a patch, so an omitted field is cleared."
    delivery_priority: should-have
    initiated_by: [orders.ACT004]
    governed_by:
      - rule: customers.VR004
    materializes:
      - concept: customers.CN002
        action: update
    produces:
      operations: [customers.EVT006]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Group/Command/EditCustomerGroupCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/Group/CommandHandler/EditCustomerGroupHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/CustomerGroup.php"
        role: api-spec

  deleteCustomerGroup:
    id: customers.CMD011
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/groups/{customerGroupId}
        method: DELETE
        group: customers
    responses:
      - code: "204"
        type: success
        description: "The group was removed. Customers that were in it fall back to the configured default group."
      - code: "404"
        type: failure
        description: "No group with this identifier exists."
        error: customers.ERR004
    name: "DeleteCustomerGroup"
    description: "Delete a customer group. Customers in the group revert to the default group, so prices they see can change as a side effect of this call."
    delivery_priority: should-have
    initiated_by: [orders.ACT004]
    materializes:
      - concept: customers.CN002
        action: delete
    produces:
      operations: [customers.EVT017]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Group/Command/DeleteCustomerGroupCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/Group/CommandHandler/DeleteCustomerGroupHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/CustomerGroup.php"
        role: api-spec

  getCustomerGroupForEditing:
    id: customers.QRY008
    kind: query
    exchange:
      protocol: http
      endpoint:
        path: /customers/groups/{customerGroupId}
        method: GET
        group: customers
    payload:
      schema: CustomerGroupResource
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The group configuration, in the shape the create and update routes also take."
        schema: CustomerGroupResource
        contentType: application/json
      - code: "404"
        type: failure
        description: "No group with this identifier exists."
        error: customers.ERR004
    name: "GetCustomerGroupForEditing"
    description: "Retrieve customer group configuration for the edit form."
    delivery_priority: should-have
    code_refs:
      - path: "src/Core/Domain/Customer/Group/Query/GetCustomerGroupForEditing.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/CustomerGroup.php"
        role: api-spec

  customerGroupCreated:
    id: customers.EVT005
    kind: event
    name: "CustomerGroupCreated"
    description: >-
      A customer group row was inserted. Fired as the hook actionObjectGroupAddAfter by
      ObjectModel::add, reached through GroupRepository. The class is Group, not CustomerGroup,
      which is why the hook name a module must listen on does not read like the command's.
    tags: ["hook:actionObjectGroupAddAfter"]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
      - path: "classes/Group.php"
        role: implementation

  customerGroupUpdated:
    id: customers.EVT006
    kind: event
    name: "CustomerGroupUpdated"
    description: "A customer group's names, discount or display settings changed. Fired as the hook actionObjectGroupUpdateAfter by ObjectModel::update, reached through GroupRepository."
    tags: ["hook:actionObjectGroupUpdateAfter"]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
      - path: "classes/Group.php"
        role: implementation

  customerGroupDeleted:
    id: customers.EVT017
    kind: event
    name: "CustomerGroupDeleted"
    description: >-
      A customer group was removed and its members fell back to the default group. Fired as the
      hook actionObjectGroupDeleteAfter by ObjectModel::delete. It is a distinct event from
      CustomerGroupCreated, because a listener that recalculates prices has to act on this one
      and not on that one.
    tags: ["hook:actionObjectGroupDeleteAfter"]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
      - path: "classes/Group.php"
        role: implementation

errors:
  customerGroupNotFound:
    id: customers.ERR004
    name: "CustomerGroupNotFound"
    description: "Requested customer group does not exist."
    category: not-found
    severity: error
    http_status: 404
    code_refs:
      - path: "src/Core/Domain/Customer/Group/Exception/GroupNotFoundException.php"
        role: implementation

  invalidCustomerGroupData:
    id: customers.ERR018
    name: "InvalidCustomerGroupData"
    description: "Group data fails validation, most often a reduction percentage outside 0 to 100 or a missing localized name."
    category: validation
    severity: error
    http_status: 422
    related_rules: [customers.VR004]
    code_refs:
      - path: "src/Core/Domain/Customer/Group/Exception/GroupConstraintException.php"
        role: implementation

questions:

  - id: customers.QN002
    name: "Which Group This Customer Is In"
    statement: "Which groups is this customer in, and what does that change about what they are shown?"
    category: relationship
    priority: high
    bounded_context_ref: prestashop.BC005
    answered_by: [customers.QRY008, customers.QRY001]
    concepts: [customers.CN001, customers.CN002]
    resolved: true
    resolution: >
      A CustomerGroup carries the price display method and the reduction it grants, so
      group membership is what decides whether a shopper sees prices with tax and whether
      a catalog discount reaches them.
