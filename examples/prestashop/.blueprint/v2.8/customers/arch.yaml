version: 1.0.0
name: Customers (PrestaShop)
description: Architecture of the PrestaShop Customers bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC005
    name: Customers
    kind: support
    value_stream_ref: VS001
    complexity: crud
    business_model_role: engagement-creator
    evolution: commodity
    model_traits: [information-holder, coordinator]
    summary: Customer accounts, addresses, customer service messaging, titles.
    owned_by:
      team: TM004
    responsibilities:
      - Customer registration and account management
      - Address CRUD (billing, shipping)
      - Customer service thread management
      - Customer group and title management
    dependencies:
      - name: International
        coupling: http
        relationship: customer-supplier
        direction: downstream
        description: Reads country and state data for address validation.
        bounded_context_ref: prestashop.BC006
    services:
      - id: prestashop.SVC005
        name: CustomerService
        kind: api
        summary: REST API for customer account and address management.
        needs:
          - { type_ref: RT001, class: self-hosted, id: prestashop-db }
        contracts:
          openapi:
            contract_name: customers-api
            slice: customers
            expose:
              - customers.CMD001
              - customers.CMD002
              - customers.CMD012
              - customers.QRY002
