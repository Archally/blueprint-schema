---
name: "Customer Core"
version: "1.0.0"
scope: customers
tags: [customer, account-management]

operations:
  addCustomer:
    id: customers.CMD001
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers
        method: POST
        group: customers
    payload:
      schema: CreateCustomerPayload
      contentType: application/json
    responses:
      - code: "201"
        type: success
        description: "The customer was created."
        schema: CustomerResource
        contentType: application/json
      - code: "409"
        type: failure
        description: "Another account in this shop already uses the email."
        error: customers.ERR002
      - code: "422"
        type: failure
        description: "The email, the password or a required profile field fails validation."
        error: customers.ERR003
    name: "AddCustomer"
    description: "Register a new customer account with profile data, group assignment, and shop association."
    delivery_priority: must-have
    initiated_by: [orders.ACT004]
    governed_by:
      - rule: customers.VR001
      - rule: customers.VR002
    materializes:
      - concept: customers.CN001
        action: create
    produces:
      operations: [customers.EVT001]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/AddCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/AddCustomerHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/Customer.php"
        role: api-spec

  editCustomer:
    id: customers.CMD002
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/{customerId}
        method: PATCH
        group: customers
    payload:
      schema: UpdateCustomerPayload
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The customer as stored after the edit."
        schema: CustomerResource
        contentType: application/json
      - code: "404"
        type: failure
        description: "No customer with this identifier exists."
        error: customers.ERR001
      - code: "409"
        type: failure
        description: "The new email is already used by another account in this shop."
        error: customers.ERR002
    name: "EditCustomer"
    description: "Update customer profile data (name, email, group, newsletter, active status). The Admin API serves it as a partial update, so an omitted field keeps its stored value."
    delivery_priority: must-have
    initiated_by: [customers.ACT001, orders.ACT004]
    governed_by:
      - rule: customers.VR001
    materializes:
      - concept: customers.CN001
        action: update
    produces:
      operations: [customers.EVT002]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/EditCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/EditCustomerHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/Customer.php"
        role: api-spec

  deleteCustomer:
    id: customers.CMD003
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/{customerId}
        method: DELETE
        group: customers
    responses:
      - code: "204"
        type: success
        description: "The account was removed under the requested delete method."
      - code: "404"
        type: failure
        description: "No customer with this identifier exists."
        error: customers.ERR001
    name: "DeleteCustomer"
    description: >-
      Delete one customer account. The command carries a delete method, which decides whether the
      email is freed for a fresh registration or kept blocked, so a deletion is a policy choice
      rather than a row removal.
    delivery_priority: must-have
    initiated_by: [orders.ACT004]
    governed_by:
      - rule: customers.VR006
    materializes:
      - concept: customers.CN001
        action: delete
    produces:
      operations: [customers.EVT003]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/DeleteCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/DeleteCustomerHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/Customer.php"
        role: api-spec

  bulkDeleteCustomer:
    id: customers.CMD028
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/bulk-delete
        method: DELETE
        group: customers
    payload:
      schema: BulkDeleteCustomersPayload
      contentType: application/json
    responses:
      - code: "204"
        type: success
        description: "Every listed account was removed under the requested delete method."
      - code: "404"
        type: failure
        description: "One of the listed identifiers names no customer, and the batch stops there."
        error: customers.ERR001
    name: "BulkDeleteCustomer"
    description: "Delete a list of customer accounts under one delete method. Split from DeleteCustomer because the Admin API serves it on its own route with a body the single delete does not take."
    delivery_priority: should-have
    initiated_by: [orders.ACT004]
    governed_by:
      - rule: customers.VR006
    materializes:
      - concept: customers.CN001
        action: delete
    produces:
      operations: [customers.EVT003]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/BulkDeleteCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/BulkDeleteCustomerHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/BulkDeleteCustomers.php"
        role: api-spec

  bulkEnableCustomer:
    id: customers.CMD004
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/bulk-enable
        method: PUT
        group: customers
    payload:
      schema: BulkCustomerIds
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "Every listed account is now active and can log in."
      - code: "404"
        type: failure
        description: "One of the listed identifiers names no customer."
        error: customers.ERR001
    name: "BulkEnableCustomer"
    description: "Enable multiple customer accounts in a single call. Each account is updated through the Customer ObjectModel, so the per-object update hook fires once per account."
    delivery_priority: should-have
    initiated_by: [orders.ACT004]
    materializes:
      - concept: customers.CN001
        action: update
    produces:
      operations: [customers.EVT002]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/BulkEnableCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/BulkEnableCustomerHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/BulkCustomers.php"
        role: api-spec

  bulkDisableCustomer:
    id: customers.CMD005
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/bulk-disable
        method: PUT
        group: customers
    payload:
      schema: BulkCustomerIds
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "Every listed account is now inactive and can no longer log in."
      - code: "404"
        type: failure
        description: "One of the listed identifiers names no customer."
        error: customers.ERR001
    name: "BulkDisableCustomer"
    description: "Disable multiple customer accounts in a single call. The accounts and their order history stay, only the ability to log in goes."
    delivery_priority: should-have
    initiated_by: [orders.ACT004]
    materializes:
      - concept: customers.CN001
        action: update
    produces:
      operations: [customers.EVT002]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/BulkDisableCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/BulkDisableCustomerHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/BulkCustomers.php"
        role: api-spec

  setPrivateNoteAboutCustomer:
    id: customers.CMD006
    kind: command
    dispatch: inprocess
    name: "SetPrivateNoteAboutCustomer"
    description: "Add or update an internal note about a customer visible only to back-office employees. No Admin API route serves it; the back-office customer view is the only caller."
    delivery_priority: could-have
    initiated_by: [orders.ACT004]
    materializes:
      - concept: customers.CN001
        action: update
    produces:
      operations: [customers.EVT002]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/SetPrivateNoteAboutCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/SetPrivateNoteAboutCustomerHandler.php"
        role: implementation

  setRequiredFieldsForCustomer:
    id: customers.CMD007
    kind: command
    exchange:
      protocol: http
      endpoint:
        path: /customers/required-fields
        method: PUT
        group: customers
    payload:
      schema: CustomerRequiredFields
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The new required-field set, which every later registration and edit is validated against."
        schema: CustomerRequiredFields
        contentType: application/json
    name: "SetRequiredFieldsForCustomer"
    description: >-
      Configure which customer profile fields are mandatory for registration and editing. The
      handler writes the required_field table directly rather than through the Customer
      ObjectModel, so no account is touched and no per-object hook fires.
    delivery_priority: should-have
    initiated_by: [orders.ACT004]
    produces:
      operations: [customers.EVT016]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/SetRequiredFieldsForCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/SetRequiredFieldsForCustomerHandler.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/CustomerRequiredFields.php"
        role: api-spec

  transformGuestToCustomer:
    id: customers.CMD008
    kind: command
    dispatch: inprocess
    name: "TransformGuestToCustomer"
    description: >-
      Convert a guest account to a registered customer. Customer::transformToCustomer refuses when
      the account is not a guest or when the email is already registered, resets the group to the
      configured default, stamps a password-reset token and updates the row, then sends either a
      set-your-password link or a welcome mail. No Admin API route serves it.
    delivery_priority: must-have
    initiated_by: [orders.ACT004]
    governed_by:
      - rule: customers.VR003
    materializes:
      - concept: customers.CN001
        action: update
    produces:
      operations: [customers.EVT004]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Customer/Command/TransformGuestToCustomerCommand.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/TransformGuestToCustomerHandler.php"
        role: implementation
      - path: "classes/Customer.php"
        role: implementation

  getCustomerForEditing:
    id: customers.QRY001
    kind: query
    exchange:
      protocol: http
      endpoint:
        path: /customers/{customerId}
        method: GET
        group: customers
    payload:
      schema: CustomerResource
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The customer's editable profile, in the shape the create and update routes also take."
        schema: CustomerResource
        contentType: application/json
      - code: "404"
        type: failure
        description: "No customer with this identifier exists."
        error: customers.ERR001
    name: "GetCustomerForEditing"
    description: "Retrieve customer profile data for the edit form. The Admin API serves it as the plain GET on a customer, because the editable profile is what the resource represents."
    delivery_priority: must-have
    code_refs:
      - path: "src/Core/Domain/Customer/Query/GetCustomerForEditing.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/Customer.php"
        role: api-spec

  getCustomerForViewing:
    id: customers.QRY002
    kind: query
    exchange:
      protocol: http
      endpoint:
        path: /customers/{customerId}/details
        method: GET
        group: customers
    payload:
      schema: CustomerResource
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The customer with everything the detail view shows around the profile."
        schema: CustomerResource
        contentType: application/json
      - code: "404"
        type: failure
        description: "No customer with this identifier exists."
        error: customers.ERR001
    name: "GetCustomerForViewing"
    description: "Retrieve full customer details for back-office viewing (profile, orders, carts, addresses, groups). Served on its own /details route because it is a far wider read than the editable profile."
    delivery_priority: must-have
    code_refs:
      - path: "src/Core/Domain/Customer/Query/GetCustomerForViewing.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/CustomerDetails.php"
        role: api-spec

  searchCustomers:
    id: customers.QRY003
    kind: query
    exchange:
      protocol: http
      endpoint:
        path: /customers/search
        method: GET
        group: customers
    payload:
      schema: FoundCustomer
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The matching customers, each in the compact shape a picker needs."
        schema: FoundCustomer
        contentType: application/json
    name: "SearchCustomers"
    description: "Search customers by name or email. Backs the customer picker on the order-creation screen, which is why its result is a short shape rather than the full profile."
    delivery_priority: must-have
    code_refs:
      - path: "src/Core/Domain/Customer/Query/SearchCustomers.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/FoundCustomer.php"
        role: api-spec

  getCustomerForAddressCreation:
    id: customers.QRY004
    kind: query
    dispatch: inprocess
    name: "GetCustomerForAddressCreation"
    description: "Retrieve the minimal customer data the address form needs to prefill a recipient. No Admin API route serves it; the back-office form reads it in the same process."
    delivery_priority: should-have
    code_refs:
      - path: "src/Core/Domain/Customer/Query/GetCustomerForAddressCreation.php"
        role: implementation

  getCustomerCarts:
    id: customers.QRY005
    kind: query
    dispatch: inprocess
    name: "GetCustomerCarts"
    description: "Retrieve all cart sessions for a customer, abandoned ones included. No Admin API route serves it; the customer detail view reads it in the same process."
    delivery_priority: should-have
    code_refs:
      - path: "src/Core/Domain/Customer/Query/GetCustomerCarts.php"
        role: implementation

  getCustomerOrders:
    id: customers.QRY006
    kind: query
    dispatch: inprocess
    name: "GetCustomerOrders"
    description: "Retrieve order history for a customer. No Admin API route serves it; the customer detail view reads it in the same process, and the orders slice serves order history on its own terms."
    delivery_priority: should-have
    code_refs:
      - path: "src/Core/Domain/Customer/Query/GetCustomerOrders.php"
        role: implementation

  getRequiredFieldsForCustomer:
    id: customers.QRY007
    kind: query
    exchange:
      protocol: http
      endpoint:
        path: /customers/required-fields
        method: GET
        group: customers
    payload:
      schema: CustomerRequiredFields
      contentType: application/json
    responses:
      - code: "200"
        type: success
        description: "The field names a registration or an edit must supply."
        schema: CustomerRequiredFields
        contentType: application/json
    name: "GetRequiredFieldsForCustomer"
    description: "Retrieve the list of mandatory fields for customer registration. Served on the same route as the setter, which is why one model carries both directions."
    delivery_priority: should-have
    code_refs:
      - path: "src/Core/Domain/Customer/Query/GetRequiredFieldsForCustomer.php"
        role: implementation
      - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/CustomerRequiredFields.php"
        role: api-spec

  customerCreated:
    id: customers.EVT001
    kind: event
    name: "CustomerCreated"
    description: >-
      A customer account row was inserted. The back-office command fires it as the hook
      actionObjectCustomerAddAfter through ObjectModel::add. The storefront registration path
      reaches the same fact by a second hook, actionCustomerAccountAdd, fired by
      CustomerPersister rather than by this command, so a module that only listens on one of the
      two sees half the registrations.
    tags: ["hook:actionObjectCustomerAddAfter"]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
      - path: "classes/Customer.php"
        role: implementation
      - path: "classes/form/CustomerPersister.php"
        role: implementation

  customerUpdated:
    id: customers.EVT002
    kind: event
    name: "CustomerUpdated"
    description: >-
      A customer account row was updated: profile, active flag, private note or bulk status change.
      Fired as the hook actionObjectCustomerUpdateAfter by ObjectModel::update, once per account,
      so a bulk call over fifty accounts fires it fifty times. The storefront profile form reaches
      the same fact through actionCustomerAccountUpdate in CustomerPersister.
    tags: ["hook:actionObjectCustomerUpdateAfter"]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
      - path: "classes/Customer.php"
        role: implementation
      - path: "classes/form/CustomerPersister.php"
        role: implementation

  customerDeleted:
    id: customers.EVT003
    kind: event
    name: "CustomerDeleted"
    description: >-
      A customer account was deleted, singly or as part of a batch. Fired as the hook
      actionObjectCustomerDeleteAfter by ObjectModel::delete. The delete method the command carried
      decides whether the email can register again; the hook does not carry that choice, so a
      listener that needs it must read the account before the delete.
    tags: ["hook:actionObjectCustomerDeleteAfter"]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
      - path: "classes/Customer.php"
        role: implementation

  guestConvertedToCustomer:
    id: customers.EVT004
    kind: event
    name: "GuestConvertedToCustomer"
    description: >-
      A guest account became a registered customer, keeping its identifier and its order history.
      No hook of its own is fired: Customer::transformToCustomer ends in ObjectModel::update, so a
      module sees only actionObjectCustomerUpdateAfter and cannot tell the conversion apart from an
      ordinary profile edit without comparing the is_guest flag itself.
    tags: ["hook:actionObjectCustomerUpdateAfter"]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Fires actionObject<Class>UpdateAfter for every persisted ObjectModel; this is where the hook this event asserts comes from"
      - path: "classes/Customer.php"
        role: implementation
      - path: "src/Adapter/Customer/CommandHandler/TransformGuestToCustomerHandler.php"
        role: implementation

  customerRequiredFieldsUpdated:
    id: customers.EVT016
    kind: event
    name: "CustomerRequiredFieldsUpdated"
    description: >-
      The shop-wide set of mandatory customer profile fields changed, so every later registration
      and edit is validated against a different rule. No hook is fired for this transition: the
      handler writes the required_field table with SQL rather than through an ObjectModel, so
      modules cannot observe it.
    code_refs:
      - path: "src/Adapter/Customer/CommandHandler/SetRequiredFieldsForCustomerHandler.php"
        role: implementation

errors:
  customerNotFound:
    id: customers.ERR001
    name: "CustomerNotFound"
    description: "Requested customer account does not exist."
    category: not-found
    severity: error
    http_status: 404
    code_refs:
      - path: "src/Core/Domain/Customer/Exception/CustomerNotFoundException.php"
        role: implementation

  duplicateCustomerEmail:
    id: customers.ERR002
    name: "DuplicateCustomerEmail"
    description: "A customer with this email already exists in the shop. Also raised when a guest conversion targets an email that a registered account already holds."
    category: conflict
    severity: error
    http_status: 409
    related_rules: [customers.VR001]
    code_refs:
      - path: "src/Core/Domain/Customer/Exception/DuplicateCustomerEmailException.php"
        role: implementation

  invalidCustomerData:
    id: customers.ERR003
    name: "InvalidCustomerData"
    description: "Customer data fails validation (invalid email format, weak password, missing required fields)."
    category: validation
    severity: error
    http_status: 422
    related_rules: [customers.VR001, customers.VR002]
    code_refs:
      - path: "src/Core/Domain/Customer/Exception/CustomerConstraintException.php"
        role: implementation

questions:

  - id: customers.QN001
    name: "What This Customer Has Done"
    statement: "What has this customer bought, and what is still sitting in their cart?"
    category: temporal
    priority: critical
    bounded_context_ref: prestashop.BC005
    answered_by: [customers.QRY002, customers.QRY006, customers.QRY005]
    concepts: [customers.CN001]
    resolved: true
    resolution: >
      GetCustomerForViewing assembles the customer record with the order and cart lists
      GetCustomerOrders and GetCustomerCarts return, which is the view an agent opens
      before answering a question about them.
