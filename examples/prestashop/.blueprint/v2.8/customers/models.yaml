    FoundCustomer:
      x-model-id: MDL1407
      purpose: read-model
      description: "A customer as the search route returns them: enough to recognise and pick the right person, and nothing more. Distinct from CustomerListItem, which is the back-office grid's own shape."
      represents:
        - concept: customers.CN001
          kind: api
          mapping:
            strategy: property-map
            property_map:
              idCustomer: CAT300
              firstname: CAT302
              lastname: CAT303
              email: CAT301
      type: object
      properties:
        idCustomer:
          type: integer
          description: "Unique customer identifier, which the caller passes on to whatever it opens next."
          example: 1
        firstname:
          type: string
          description: "Given name, spelled here in the database's own casing rather than the API's camelCase."
          example: "Jean"
        lastname:
          type: string
          description: "Family name, spelled in the database's own casing rather than the API's camelCase because this shape is read straight off the search query."
          example: "Dupont"
        email:
          type: string
          description: "Account email, which is what most searches actually match on."
          example: "jean.dupont@example.com"
        fullnameAndEmail:
          type: string
          description: "Name and email joined into the single line a picker displays, so the caller does not have to compose it."
          example: "Jean Dupont (jean.dupont@example.com)"
        active:
          type: integer
          description: "1 when the account can log in, 0 when it has been disabled. An inactive customer is still selectable for a back-office order."
          example: 1
        company:
          type: string
          description: "Company name, which is how a B2B shop tells two people of the same name apart."
          example: "Acme SAS"
        idDefaultGroup:
          type: integer
          description: "The group whose discount and price display apply to this customer."
          example: 3
        groups:
          type: array
          description: "Every group the customer belongs to, the default one included."
          example: [1, 3]
          items:
            type: integer
      code_refs:
        - path: "src/Core/Domain/Customer/Query/SearchCustomers.php"
          role: schema
        - path: "ps_apiresources/src/ApiPlatform/Resources/Customer/FoundCustomer.php"
          role: api-spec

