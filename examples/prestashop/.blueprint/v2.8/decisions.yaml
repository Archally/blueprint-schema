  - id: DC007
    title: "New Admin API with OAuth2"
    summary: "Introduce a modern REST API for back-office operations with OAuth2 authentication, replacing legacy webservice."
    date: "2024-01"
    status: landed
    owned_by:
      team: TM009
    rationale:
      problem: "Legacy webservice API uses custom authentication, lacks proper authorization scopes, and exposes internal data structures directly."
      options:
        - "Extend legacy webservice API"
        - "New Admin API with OAuth2 and resource-based design"
        - "GraphQL API"
      chosen: "New Admin API - resource-oriented REST with OAuth2 scopes and proper versioning"
    capability_refs: [CAP016]
    # Keeping the legacy webservice alive beside the Admin API is not a
    # design preference, it rests on admin.ASM100: integrators do not migrate on a date the
    # shop sets.
    motivation_refs:
      assumptions: [admin.ASM100]
      goals: [admin.GL002, catalog.GL004]
      trade_offs: [admin.TRO001]
    consequences:
      positive:
        - "Standard OAuth2 flow (RFC 6749) for third-party integrations"
        - "Scoped access control per API client"
        - "OpenAPI specification for client generation"
      negative:
        - "Two API systems coexist (legacy webservice + new Admin API)"
        - "Module developers must adapt to new authentication"
        - >-
          A module can no longer observe who holds credentials. WebserviceKey is an ObjectModel, so
          creating one fires actionObjectWebserviceKeyAddAfter; ApiClient is a Doctrine entity and
          fires only the seven back-office form hooks, none of which reach a client created through
          the API itself.
    links:
      supersedes: [DC009]
      docs:
        - "https://devdocs.prestashop-project.org/9/admin-api/"
        - "https://devdocs.prestashop-project.org/9/admin-api/contribute-to-core-api/"
    acceptance:
      must_pass_tests:
        - "The ApiPlatform integration suite under tests/Integration/ApiPlatform, run against the ps_apiresources module that declares the endpoints"
      new_tests_to_add:
        - "One parity case per legacy webservice resource the Admin API now serves, asserting the same data is reachable without a webservice key - the 64 legacy resources are the checklist"
      docs_to_update:
        - "The generated Swagger document under presta-docs/admin-api/swagger-doc, whenever a resource folder is added or a scope is renamed"
      reviews_required:
        - "A scope review before each new resource ships. Every route declares an OAuth scope, and a route that both reads and writes under one scope is the failure this review exists to catch"
    declared_impact:
      direct:
        concepts: [admin.CN005]
        operations: [admin.CMD021, admin.CMD022, admin.CMD023, admin.CMD024, admin.QRY005]
        models: [CreateApiClientPayload]
      transitive_hints:
        - "152 routes front 200 of the 519 CQRS Command and Query classes, so 61 percent of the domain is still reachable only in process. Every operation in this model carrying dispatch inprocess rather than an exchange is a consequence of that coverage, not of a design choice about that operation."
    code_refs:
      - path: "src/Core/Domain/ApiClient/"
        role: implementation
        description: "API client domain aggregate"
      - path: "PrestaShop/docs#admin-api/_index.md"
        role: documentation
        description: >-
          The Admin API chapter, which states the reason in its own words - CQRS-based
          endpoints are domain-oriented where the webservice was connected to ObjectModel. The
          legacy webservice surface this decision replaces is the one DC009 records.
      - path: install-dev/data/xml/feature_flag.xml
        role: configuration
        description: "Lines 14-15: the Admin API with multistore and its experimental endpoints are beta feature flags, off by default."
      - path: PrestaShop/ps_apiresources#src/ApiPlatform/Resources
        role: implementation
        description: The resource classes that declare every Admin API route and the CQRS class behind it.
    decision_scope: admin
    discovery_stage: validated
    certainty: confirmed
    evidence:
      - kind: documentation
        source: PrestaShop/docs#admin-api/_index.md
        date: 2026-10-14
        summary: "Lines 13-17: the Admin API ships in PrestaShop 9, built on API Platform 3, authorized by OAuth and backed by CQRS commands, which the page contrasts with the webservice connected to ObjectModel."
        confidence_impact: supports
      - kind: codebase-analysis
        source: presta-apiresources dcf05ff, src/ApiPlatform/Resources
        date: 2026-10-14
        summary: "Counted: 124 resource classes declare 150 distinct uriTemplate paths, each naming the CQRS command or query behind it."
        confidence_impact: supports

  - id: DC008
    title: "Headless architecture support"
    summary: "Support headless commerce by exposing all storefront operations through APIs, enabling decoupled frontends."
    date: "2025-06"
    status: proposed
    rationale:
      problem: "PrestaShop's tightly-coupled Smarty/Twig frontend limits integration with modern SPA frameworks, mobile apps, and composable commerce."
      options:
        - "Keep monolithic server-rendered frontend only"
        - "Add REST API layer for headless alongside existing frontend"
        - "Full headless-only (drop server-rendered frontend)"
      chosen: "Add REST API layer - support headless while maintaining traditional frontend for backwards compatibility"
    capability_refs: [CAP016, CAP005]
    consequences:
      positive:
        - "Frontend framework freedom (Next.js, Nuxt, mobile apps)"
        - "Better performance via CDN-cached API responses"
        - "Enables composable commerce architecture"
      negative:
        - "Two frontend paradigms to maintain (server-rendered + headless)"
        - "SEO requires server-side rendering or pre-rendering for headless"
    decision_scope: storefront
    motivation_refs:
      inquiries: [catalog.INQ001, checkout.INQ002, content.INQ001]
    declared_impact:
      direct:
        operations: [catalog.QRY001, catalog.QRY002, checkout.CMD009, checkout.QRY001, content.QRY001]
    discovery_stage: hypothesis
    certainty: speculative
    evidence:
      - kind: assumption
        source: presta-docs and presta-code, searched for a storefront API
        date: 2026-10-14
        summary: "No PrestaShop source states this decision: presta-docs contains no page on headless commerce (a search for headless returns nothing), and the routing under src/PrestaShopBundle/Resources/config/routing declares admin, admin-api and an internal back-office api, none of which serves the storefront."
        confidence_impact: weakens

  - id: DC009
    title: "Legacy webservice with per-key CRUD permissions"
    summary: "Expose shop data to third parties through one entry point, authenticated by a 32-character shop key carrying a per-resource CRUD matrix."
    description: >-
      Recorded at the date below, which is when this log adopted the decision and not when
      PrestaShop took it. The webservice is older than every other entry here and 9.3.0 still
      ships it, serving 64 resources. It is written down because DC007 replaces it, and a log
      that does not hold the thing being replaced cannot show the replacement.
    date: "2022-06"
    status: deprecated
    decision_scope: admin
    owned_by:
      team: TM009
    discovery_stage: obsolete
    certainty: confirmed
    rationale:
      problem: >-
        A merchant's ERP, marketplace connector or stock system has to read and write shop data
        without holding a back-office employee session. The shop had no notion of a machine
        identity and no authorization vocabulary below the employee profile, so granting one
        meant inventing both at the same time.
      options:
        - "No programmatic access - an integrator drives the back office through a browser"
        - "A shop-issued key sent as HTTP Basic credentials, checked against a CRUD matrix per resource"
        - "Reuse the employee login and its profile permissions for machine callers"
      chosen: >-
        A shop-issued 32-character key, sent as the HTTP Basic login with no password and checked
        against a per-resource CRUD matrix. A resource is an ObjectModel class serialized whole,
        so adding one costs an entry in a list rather than an endpoint design.
    capability_refs: [CAP016]
    consequences:
      positive:
        - "An integrator needs one credential and no session, and the same key reaches every resource it was granted"
        - "The resource list is the table list, so coverage grew with the data model at no API design cost - 64 resources in 9.3.0"
      negative:
        - "The key is a bearer password with no expiry, no rotation and no refresh; revoking it means deleting it"
        - "Permission is CRUD per resource, so there is no way to grant read of one field, or of one shop's rows"
        - "The wire shape is the table shape, so a column rename is a breaking API change the API layer cannot absorb"
    links:
      superseded_by: [DC007]
      docs:
        - "https://devdocs.prestashop-project.org/9/webservice/"
    declared_impact:
      direct:
        concepts: [admin.CN006]
        operations: [admin.CMD025, admin.CMD026, admin.CMD027, admin.CMD028, admin.QRY006, admin.EVT018]
        models: [CreateWebserviceKeyPayload, UpdateWebserviceKeyPayload, WebserviceKeyResource]
      transitive_hints:
        - "Each of the 64 webservice resources names an ObjectModel class, which is why the legacy wire format tracks the database schema rather than the domain model. Anything generated from the legacy surface inherits that shape."
    evidence:
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, classes/webservice/WebserviceRequest.php lines 785-820"
        date: "2026-09-19"
        summary: >-
          authenticate() rejects a key that is not exactly 32 characters, resolves it with
          WebserviceKey::isKeyActive and loads an array with getPermissionForAccount. On failure
          it answers 401 with a Basic realm challenge. There is no token, no expiry and no scope
          anywhere in the path.
        confidence_impact: supports
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, classes/webservice/WebserviceRequest.php getResources() line 254"
        date: "2026-09-19"
        summary: "64 resource entries, each mapping a URL segment to an ObjectModel class name and a description."
        confidence_impact: supports
    code_refs:
      - path: "classes/webservice/WebserviceRequest.php"
        role: implementation
        description: "The single entry point. getResources() at line 254 declares the 64 resources; authenticate() at line 785 is the whole authorization model."
      - path: "classes/webservice/WebserviceKey.php"
        role: model
        description: "WebserviceKeyCore extends ObjectModel, which is why a key's lifecycle is observable through the actionObject family while its successor's is not."
    tags: [legacy, api, superseded]
    motivation_refs:
      assumptions: [admin.ASM100]
      trade_offs: [admin.TRO001]

  - id: DC010
    title: "Hooks are the extension point, and they run in the caller's request"
    summary: "Let modules change behaviour and presentation at named dispatch points that execute synchronously inside the request that fired them."
    description: >-
      Recorded at the date below, which is when this log adopted the decision and not when
      PrestaShop took it. Hooks are older than every other entry here and are the mechanism the
      module ecosystem stands on. It is written down because the rest of this log, and the 201
      event operations in the domain layer, only mean what they say against it: an event in this
      model is a hook publication, not a message on a bus.
    date: "2022-01"
    status: landed
    decision_scope: modules
    owned_by:
      team: TM008
    discovery_stage: validated
    certainty: confirmed
    rationale:
      problem: >-
        Third-party code has to alter what the shop does and what it shows without forking core
        or patching files, and a merchant has to be able to add and remove that code while the
        shop is running. The platform therefore needs a published set of points where foreign
        code may execute, and a rule saying when it executes.
      options:
        - "Class overrides - a module replaces a core class at autoload time"
        - "Named dispatch points a module subscribes to, executed synchronously in the caller's request"
        - "Published domain events consumed out of process by subscribers"
      chosen: >-
        Named dispatch points. A hook has a name, a registry entry with a description, and one
        array of context; a module registers for it at install and implements a method named
        after it. Class overrides remain available beside hooks as the escape hatch, not as the
        interface.
    capability_refs: [CAP016]
    consequences:
      positive:
        - "A module is additive: install, register, remove, with no core file edited and no deployment of core"
        - "The registry is the contract - 1162 named hooks, each with PrestaShop's own description, is an extension surface a developer can read before writing anything"
        - "A subscriber runs inside the caller's transaction and context, so a before-hook can still amend or refuse what has not been written yet"
      negative:
        - "Every subscriber runs inside the request that fired the hook, so one slow module slows that operation for the shopper"
        - "There is no delivery guarantee and no retry: a subscriber that throws or times out takes the whole request with it"
        - "The commonest hook names are generated rather than declared. actionObjectProductAddAfter and its family come from ObjectModel at runtime, appear in no source file as text, and are absent from the registry, so reading either source alone understates the surface"
    links:
      docs:
        - "https://devdocs.prestashop-project.org/9/modules/concepts/hooks/"
        - "https://devdocs.prestashop-project.org/9/modules/concepts/hooks/list-of-hooks/"
      related: [DC001]
    declared_impact:
      direct:
        concepts: [modules.CN001, modules.CN002]
        operations: [modules.CMD009, modules.CMD010, modules.CMD011, modules.QRY002, modules.QRY004]
      transitive_hints:
        - "Every event operation in this model that carries a hook: tag is a consequence of this decision, and every event described as firing no hook is a place this decision does not reach. Both are facts about module reach, not about the domain."
        - "DC001 proposes moving order coordination off this mechanism. It is recorded as related rather than superseding, because hooks predate it by the whole life of the platform and a 2026 proposal cannot replace what the module ecosystem is built on."
    evidence:
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, install-dev/data/xml/hook.xml"
        date: "2026-09-19"
        summary: >-
          1162 distinct hook ids in the registry, each with a title and a description. 980 begin
          with action and 155 with display; the remaining 27 use neither prefix.
        confidence_impact: supports
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, src classes controllers"
        date: "2026-09-19"
        summary: >-
          231 distinct hook names appear at a literal call site, across the four shapes that take
          a name: Hook::exec, Hook::getHookModuleExecList, dispatchWithParameters and
          dispatchRenderingWithParameters. Twelve of the 231 are not in the registry, so neither
          source alone is the oracle for what is real.
        confidence_impact: supports
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, classes/ObjectModel.php lines 525-717"
        date: "2026-09-19"
        summary: >-
          add, update, delete and duplicate each fire actionObject<Class><Verb><Before|After>,
          with the class name interpolated at runtime, for the 97 files under classes and src
          that extend ObjectModel. This is the largest of the three sources and the only one that
          cannot be listed by reading text.
        confidence_impact: supports
      - kind: documentation
        source: "PrestaShop/docs#modules/concepts/hooks/_index.md"
        date: "2026-09-19"
        summary: >-
          PrestaShop documents hooks as the way to associate module code with shop events,
          registered during module install with Module::registerHook and received as one array of
          contextual information.
        confidence_impact: supports
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, classes/Hook.php exec() line 886"
        date: "2026-09-19"
        summary: >-
          exec resolves the registered module list and calls each subscriber in turn in the
          caller's request. There is no queue, no worker and no asynchronous path, which is the
          cost this decision accepts and the reason DC001 exists.
        confidence_impact: weakens
    code_refs:
      - path: "install-dev/data/xml/hook.xml"
        role: documentation
        description: "PrestaShop's own hook registry: 1162 ids, each with a title and a description."
      - path: "classes/Hook.php"
        role: implementation
        description: "exec() at line 886 resolves the subscriber list and calls each module method in the caller's request."
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 525 to 717 fire the actionObject<Class><Verb><Before|After> family for every persisted ObjectModel, which is where most real hook names come from."
      - path: "src/Adapter/Hook/HookDispatcher.php"
        role: implementation
        description: "The Symfony-side dispatcher the modern back-office pages use, alongside the legacy static entry point. dispatchWithParameters is the second of the four call shapes that take a literal hook name."
    tags: [extension-point, modules, architecture]
    motivation_refs:
      goals: [modules.GL003]
      trade_offs: [modules.TRO001]
      assumptions: [modules.ASM001]

# Bounded Context Canvas business decisions (BD###), for the context cards.
#
# A business decision is NOT an ADR. DC### above records WHY a choice was made and what was
# rejected; a BD### states the policy that choice left in force, in the words a reader of the
# context card needs. Each entry names the DC### or the rule it derives from, so nothing here is
# a claim you have to take on trust: the model already holds its evidence.
#
# `domain_scope` is a scope slug matched against the bounded context's name, and it is the one
# field that puts the decision on a card. `linked_contexts` names the other contexts the policy
# reaches, so a cross-context policy is stated once and read in both places.
business_decisions:
  - id: BD001
    name: "An order state change completes inside the request that made it"
    description: >-
      When an order moves to a new state, stock, invoicing, email and every subscribed module are
      reached synchronously in the request that changed it: OrderHistory::changeIdOrderState fires
      actionOrderStatusUpdate, applies the change, then fires actionOrderStatusPostUpdate. The
      published-event lifecycle recorded in DC001 is proposed and not built - there is no Event
      directory under src/Core and the messenger bus is configured with no transport - so the
      policy in force is the synchronous one. A subscriber that fails or is slow takes the state
      change down with it, and nothing retries.
    domain_scope: orders
    linked_contexts: [platformkernel]
    tags: [order-lifecycle, synchronous]
    code_refs:
      - path: classes/order/OrderHistory.php
        role: implementation
        description: changeIdOrderState (line 63) fires actionOrderStatusUpdate at line 90, before the change is written, and actionOrderStatusPostUpdate at line 319, after it, both in the request that made the change.
      - path: app/config/messenger.yml
        role: configuration
        description: The messenger bus is configured with no transport, so nothing is delivered outside the request.

  - id: BD002
    name: "Storefront search runs on the shop's own index until a merchant replaces it"
    description: >-
      Product search is served by the built-in inverted index: Search::indexation fills
      ps_search_word and ps_search_index, and Search::find reads them back with a weight-sum
      subquery. Core ships no search engine, no client and no configuration for one; the dedicated
      search service in DC002 is advice addressed to whoever operates a large catalog, not an
      implementation. A shop will therefore never be required to run external search
      infrastructure, and a catalog that outgrows the index is the merchant's decision to act on.
    domain_scope: catalog
    linked_contexts: [shop]
    tags: [search, no-external-dependency]

  - id: BD003
    name: "Card data never touches PrestaShop servers"
    description: >-
      Every payment is delegated to a certified gateway module (Stripe, PayPal, Mollie) that
      returns a token; no primary account number is stored, logged or forwarded by the platform.
      This is what keeps a shop out of PCI DSS Level 1 scope, and it is why the payment step is an
      extension point rather than a feature. Recorded as DC003, landed. checkout.ASM001 is the
      assumption it rests on: that module authors implement the PaymentModule interface contract.
    domain_scope: checkout
    tags: [payment, pci, delegation]

  - id: BD004
    name: "The cart lives on the server, and a price the browser sends is not a price"
    description: >-
      Cart state is persisted server-side and the browser holds only the cart's id, so a line's
      price is recomputed rather than accepted. A signed-in customer's open cart follows them to
      another device only when the merchant turns on PS_CART_FOLLOWING, which the install data
      leaves without a default. Recorded as DC004, landed: the rejected option was a client-side
      cart, which loses data and can be tampered with. The cost is that an anonymous visitor's cart
      is a row the shop has to create and eventually expire.
    domain_scope: checkout
    tags: [cart, tamper-resistance]

  - id: BD005
    name: "Hooks are the extension point, and they run in the caller's request"
    description: >-
      Foreign code changes what the shop does and shows at named dispatch points that execute
      synchronously inside the request that fired them. A hook has a name, a registry entry with a
      description and one array of context; a module registers for it at install and implements a
      method named after it. Class overrides remain available beside hooks as the escape hatch, not
      as the interface. Recorded as DC010, landed, and the reason DC001 exists: a module's failure
      or latency is the caller's.
    domain_scope: platformkernel
    linked_contexts: [modules]
    tags: [extension-point, hooks, synchronous]

  - id: BD006
    name: "Every domain write goes through a command handler"
    description: >-
      Domain aggregates are reached through CQRS command and query handlers rather than through
      ObjectModel directly, so validation has one place to live and a read can be optimized without
      touching the write. Event sourcing was deliberately not adopted along with it - the split is
      write-versus-read, not state-versus-log. Recorded as DC005, landed. The legacy ObjectModel
      path still exists beside it, which is why a write can reach the database by two routes.
    domain_scope: platformkernel
    tags: [cqrs, architecture]

  - id: BD007
    name: "New back-office integration happens over the Admin API with OAuth2 scopes"
    description: >-
      Back-office operations are exposed as a resource-oriented REST API authenticated by OAuth2
      with scopes and a version in the path, so an integrator gets an authorization vocabulary
      below the employee profile. The legacy webservice is not switched off when the Admin API
      arrives; both surfaces stay reachable, which is the trade-off admin.TRO001 selected. Recorded
      as DC007, landed.
    domain_scope: admin
    linked_contexts: [externalapiconsumers]
    tags: [api, oauth2, authorization]

  - id: BD008
    name: "New back-office pages are Symfony, and legacy pages migrate one at a time"
    description: >-
      The back office moves to Symfony with Twig incrementally: a new page is written in Symfony, a
      legacy Smarty controller is rewritten when it is touched, and there is no cutover date. Both
      stacks therefore run side by side for the life of the migration, and a reader of the admin
      code should expect to meet either. Recorded as DC006, landed.
    domain_scope: admin
    tags: [symfony, migration, incremental]

  - id: BD009
    name: "A third-party integration authenticates as the shop, never as an employee"
    description: >-
      An ERP, marketplace connector or stock system reaches shop data through a machine identity the
      shop issues, not by holding a back-office employee session. Two such identities exist and both
      stay reachable: the legacy webservice key, a 32-character shop key carrying a per-resource
      CRUD matrix (DC009, deprecated), and OAuth2 scoped tokens on the Admin API (DC007, landed).
      The integrator chooses; the shop does not migrate them.
    domain_scope: externalapiconsumers
    linked_contexts: [admin]
    tags: [api, machine-identity, backward-compatibility]

  - id: BD010
    name: "A module is installed, upgraded and reset while the shop is running"
    description: >-
      Module lifecycle is a state machine the merchant drives from the back office: installing makes
      a module installed and enabled (modules.TR001), and the other moves, enable, disable,
      uninstall and reset, are listed on the module lifecycle state enumeration. An upgrade needs an
      installed module and a newer version (modules.VR003); a reset, allowed only on an installed
      module, keeps its data by default or reinstalls the module (modules.VR002). There is no
      deployment step and no staging gate, which is exactly why an install that reports success can
      still break the storefront afterwards - the risk modules.KPI001 is written to watch.
    domain_scope: modules
    tags: [module-lifecycle, runtime-change]

  - id: BD011
    name: "The storefront is server-rendered, and API access is added beside it"
    description: >-
      The shop's front end is its active theme rendered by the server. Headless support is recorded
      as DC008, proposed: the intent is to add a REST layer while keeping the traditional
      storefront, not to replace it. Until that is built, the policy in force is that the theme is
      the storefront, and a decoupled front end is an integration rather than a supported mode.
    domain_scope: shop
    tags: [storefront, headless, proposed]

  - id: BD012
    name: "Storefront content is trusted at authorship, not sanitised at render"
    description: >-
      A CMS page's body is stored and rendered as HTML written by someone the shop trusts
      (content.ASM001); the control is who may edit, not what the editor may write. Meta fields are
      the exception and are constrained (content.VR002). One theme is active at a time: enabling
      another deactivates the current one (content.TR001, content.VR004). The active theme is meant
      not to be deleted (content.VR005): the back office offers the delete only for themes not in
      use, but the delete itself does not check it, so the storefront keeps its one renderer through
      the screen rather than through the command.
    domain_scope: content
    tags: [content, trust-boundary, theming]

  - id: BD013
    name: "Address shape is merchant data, not code"
    description: >-
      A country's required address fields and its display format are configuration the merchant
      edits (customers.VR005, customers.ASM001), so supporting a new country is a data change
      rather than a release. The consequence is the one customers.KPI002 measures: a format the
      merchant gets wrong is accepted by the platform, because the platform has no independent idea
      of what that country's addresses look like.
    domain_scope: customers
    tags: [address, configuration-over-code]

  - id: BD014
    name: "Tax comes from the rule bound to the product and the address, never from a shop-wide rate"
    description: >-
      A line's tax is resolved from the tax rules group attached to the product and the country,
      state and postcode of the customer's address; there is no single shop rate to fall back on.
      Within a group, a country or state that has a rule with the behavior 'this tax only' takes no
      other rule, while rules that combine or apply one after another may share it
      (international.VR008). A rate is meant to be zero or more (international.VR006), though
      nothing refuses a negative rate today. The cost is coverage: a country or state nobody bound
      in the product's group has no tax rule, which is what international.KPI002 counts.
    domain_scope: international
    tags: [tax, per-zone, coverage]
    code_refs:
      - path: classes/tax/TaxRulesTaxManager.php
        role: implementation
        description: "Lines 74-87: the tax rules of a group are selected by the address country, its state (or none) and a postcode range, most specific first; no zone is read."

  - id: BD015
    name: "A destination the merchant's range table does not cover is not shippable"
    description: >-
      Shipping cost is read from the carrier's own range table, by weight or by price, and the
      merchant maintains it: shipping.ASM001 assumes that table is what the carrier actually
      charges. Ranges must not overlap within a zone (shipping.VR004) and a carrier must serve at
      least one zone (shipping.SR001), so an address outside every range yields no carrier at
      checkout rather than a default rate. That is the gap shipping.GL002 exists to close.
    domain_scope: shipping
    tags: [shipping, ranges, no-default-rate]
