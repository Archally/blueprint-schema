---
version: "1.0.0"
# Ownership default for this log. Engineering owns a decision unless the decision itself names
# another owner; the three that do cross a department boundary, which is what makes the override
# say something.
owned_by:
  department: DPT001
decisions:
  - id: DC001
    title: "Event-driven order lifecycle"
    summary: "Coordinate order state changes through published domain events instead of the hook chain that runs in the request. Nothing of it is built."
    description: >-
      This entry was recorded as accepted with a code reference to
      src/Core/Domain/Order/Event/, and both claims are false. Restated 2026-09-19 rather than
      deleted: a decision whose premise the codebase does not support is the thing a decision log
      exists to hold, and deleting it would destroy the only record that the claim was ever made.
      What changed is the status and the epistemics, not the aspiration. What it wants is a real
      and defensible want; what it asserted about the system was not true on the day it was
      written and is not true now.
    date: "2026-01"
    status: proposed
    decision_scope: orders
    owned_by:
      team: TM001
    discovery_stage: hypothesis
    certainty: speculative
    rationale:
      problem: >-
        An order moving to a new state has to reach stock, invoicing, email and every module that
        subscribed. PrestaShop does all of it inside the request that changed the state:
        OrderHistory::changeIdOrderState fires actionOrderStatusUpdate, applies the change, then
        fires actionOrderStatusPostUpdate, and each subscriber runs in line. Three things follow.
        The merchant waits for the slowest subscriber. A subscriber that throws takes the state
        change with it. And a side effect that did not happen is simply lost, because nothing
        recorded that it was owed.
      options:
        - name: "Keep the synchronous hook chain"
          description: >-
            What runs today. The handler writes the state and Hook::exec calls each registered
            module in turn, before and after the write.
          pros:
            - "No infrastructure beyond PHP and MySQL, which is what most PrestaShop installations have"
            - "A before-hook still sees the order in its old state, so a module can amend or refuse the transition"
            - "Ordering is the call order, so nobody has to reason about delivery or replay"
          cons:
            - "Order status change latency is the sum of every subscriber, and a merchant cannot see which module is the slow one"
            - "A throwing subscriber fails the state change, so one bad module breaks order processing rather than its own feature"
            - "No retry and no dead-letter: a failed email or stock release is not recorded anywhere as owed"
        - name: "Published domain events on a message bus transport"
          description: >-
            The handler writes the state and publishes a fact. Subscribers consume out of the
            request. PrestaShop already depends on symfony/messenger and already routes its CQRS
            commands through it, so the bus exists; what is missing is a transport and a set of
            published facts.
          pros:
            - "The merchant's request ends when the order state is written, and the side effects follow on their own time"
            - "A failed side effect can be retried or dead-lettered instead of being lost"
            - "The bus is already a dependency and already wired, so this is a transport and a message set rather than a new framework"
          cons:
            - "A consumer must tolerate at-least-once delivery and out-of-order arrival, and none of the existing module subscribers were written for either"
            - "A published fact cannot be refused, so every before-hook that vetoes or amends a transition has to stay synchronous and the mechanism splits in two"
            - "The extension contract the ecosystem knows is the hook signature, so this adds a second extension surface rather than replacing the first"
            - "An operator now has a worker and a queue to run and monitor, on hosting that often offers neither"
          open_questions:
            - "What happens to actionOrderStatusUpdate, which fires before the write precisely so a module can still stop it?"
            - "Who owns the message schema when a module wants a field the core fact does not carry?"
        - name: "A transactional outbox drained into the existing hooks"
          description: >-
            Write the state change and an outbox row in one transaction; a worker reads the
            outbox and fires the same after-hooks the modules already implement.
          pros:
            - "Modules change nothing: the hook they registered for still fires, just not in the shopper's request"
            - "Retry comes for free, because the outbox row survives until a subscriber succeeds"
            - "The outbox is a table, so there is no broker for the merchant to operate"
          cons:
            - "Only the after-side moves; the before-hooks stay in the request and so does part of the latency"
            - "A worker is still a process someone has to run, and a shop without one silently stops firing after-hooks"
            - "Ordering across two orders is not guaranteed without sequencing work the outbox does not give you"
      chosen: >-
        Published domain events, for the retry and for the latency. Recorded as chosen and never
        built: there is no Event directory anywhere under src/Core, no handler publishes a fact,
        and the messenger bus PrestaShop does run is configured with no transport at all. The
        system still runs the first option.
    motivation_refs:
      goals: [orders.GL003]
      risks: [orders.RSK001]
    capability_refs: [CAP001]
    consequences:
      positive:
        - "Anticipated, not observed: the shopper's request ends at the state write rather than at the end of the subscriber chain"
        - "Anticipated, not observed: a stock release or a confirmation email that fails is retried instead of lost"
      negative:
        - "Anticipated: eventual consistency, so a module reading the order immediately after the fact may see work still in flight"
        - "Anticipated: a distributed flow is harder to follow than a stack trace through one request"
        - "Observed: the gap between this entry and the code is itself a cost. A reader who trusted the log would design against a publish-subscribe order lifecycle that does not exist, and eight months of this model described one"
    links:
      related: [DC010]
    declared_impact:
      direct:
        concepts: [orders.CN002, modules.CN002]
        operations: [orders.CMD004, orders.EVT005]
        processes: [orders.PRC001]
      transitive_hints:
        - "The 201 event operations in this model are hook publications, not messages. If this decision were carried out, every one of them would need a verdict on whether it becomes a published fact, stays a hook, or becomes both."
        - "LP001 is the leverage point that would carry this decision out and WI001 is the work item under it, which is why this entry stays proposed rather than being marked deprecated: it is unbuilt, not abandoned."
    evidence:
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, src/Core and the repository history"
        date: "2026-09-19"
        summary: >-
          find src/Core -type d -name Event returns nothing, so there is no domain-event
          directory anywhere in the core. The directory this entry originally cited,
          src/Core/Domain/Order/Event/, was never added in the 105197 commits of the full
          history, so the reference was wrong on the day it was written.
        confidence_impact: invalidates
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, app/config/messenger.yml and src/PrestaShopBundle/CommandBus/MessengerCommandBus.php"
        date: "2026-09-19"
        summary: >-
          symfony/messenger is a dependency and is the CQRS command bus, but the configuration
          declares one bus with one middleware and no transports, and MessengerCommandBus handles
          and returns in the caller's request. The bus this decision needs is present and carries
          nothing asynchronously.
        confidence_impact: weakens
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, classes/order/OrderHistory.php"
        date: "2026-09-19"
        summary: >-
          changeIdOrderState fires actionOrderStatusUpdate before the write and
          actionOrderStatusPostUpdate after it, both through Hook::exec in the caller's request.
          This is what coordinates an order state change today.
        confidence_impact: weakens
    code_refs:
      - path: "classes/order/OrderHistory.php"
        role: implementation
        description: >-
          What actually coordinates an order state change. changeIdOrderState fires
          actionOrderStatusUpdate before the write and actionOrderStatusPostUpdate after it, both
          synchronously and in the caller's request.
      - path: "app/config/messenger.yml"
        role: implementation
        description: >-
          The whole messenger configuration: one bus, one middleware, no transports. It is the
          measure of the distance between this decision and the code.

  - id: DC002
    title: "A dedicated search service for large catalogs"
    summary: "Serve product search from a search engine rather than the shop's own keyword index. Documented as advice to an operator; core has not adopted it."
    description: >-
      Restated 2026-09-19. This entry was recorded as landed, titled for Elasticsearch, and said
      the baseline it replaced was MySQL LIKE queries. Three things were wrong and the code says
      so: there is no engine in PrestaShop 9.3.0, the baseline is a purpose-built inverted index
      rather than LIKE, and the string FULLTEXT does not occur anywhere in the PHP or the SQL.
      What is true is smaller and more useful: PrestaShop documents a search engine under Scale
      as one of four systems a merchant may add to a shop that has outgrown the built-in index.
      Recorded here in that form.
    date: "2026-01"
    status: proposed
    decision_scope: catalog
    owned_by:
      team: TM002
    discovery_stage: exploring
    certainty: speculative
    rationale:
      problem: >-
        Storefront search is served by the shop's own inverted index: Search::indexation fills
        ps_search_word with every distinct word and ps_search_index with a weight per word and
        product, and Search::find reads them back with a weight-sum subquery. Two ceilings are
        written into that code. Relevance is scaled by a word-length coefficient that is forced
        to 1 once ps_search_word passes 100000 rows, so a large or multilingual catalog loses the
        ranking signal it depends on. And the index is rebuilt by walking products 50 at a time,
        so the cost of a rebuild tracks the catalog rather than the change that triggered it.
      options:
        - name: "Keep the built-in keyword index"
          description: >-
            Two tables, a weight per field configured in Shop Parameters, and a cron or a
            back-office button to reindex.
          pros:
            - "Search works on a shared host with no service to buy, run or secure, which is where most PrestaShop installations live"
            - "The index is in the same database as the catalog, so it can never be stale relative to a write the indexer saw"
            - "Field weights are merchant-editable in the back office, which is a tuning surface a search engine would move into a mapping file"
          cons:
            - "The relevance coefficient flattens above 100000 indexed words, so ranking quietly degrades rather than failing visibly"
            - "No fuzzy matching and no typo tolerance: a shopper who misspells a brand finds nothing"
            - "Faceting is a separate module rather than a property of the index"
            - "A full rebuild is the slowest routine operation in the back office, and nothing signals a module when it happens"
        - name: "A dedicated search service such as Elasticsearch"
          description: >-
            What PrestaShop's own Scale chapter recommends, beside Varnish, Redis and a CDN, for
            a shop that has outgrown the built-in index. It is advice to an operator and not a
            component of the product.
          pros:
            - "Relevance, typo tolerance and faceting become engine configuration instead of PHP the shop maintains"
            - "Search load leaves the database that is also serving carts and orders, so a heavy search hour stops competing with checkout"
          cons:
            - "A second datastore to run, secure, back up and keep in sync, which shared hosting does not offer"
            - "The index is eventually consistent with the catalog, so a price or a stock change reaches search on the next sync rather than on the write"
            - "Core cannot depend on it without splitting the product into a tier that has an engine and a tier that does not, which is a business decision before it is a technical one"
          open_questions:
            - "Who owns the mapping when a module adds a searchable field? The built-in index has a weight table a merchant edits; an engine has a schema someone has to migrate."
        - name: "A hosted search SaaS"
          description: "The same engine, operated by a vendor and reached over the network."
          pros:
            - "No infrastructure for the merchant, and typo tolerance and search analytics arrive already configured"
          cons:
            - "The catalog leaves the shop, which is a data-protection decision in the EU before it is an architecture one"
            - "Per-request pricing turns search into a variable cost that grows with traffic, including bot traffic"
            - "Search is down when the vendor is, and the built-in index is no longer there to fall back to"
      chosen: >-
        A dedicated search service, for catalogs that have outgrown the built-in index. Recorded
        as a recommendation and not as an implementation: PrestaShop 9.3.0 ships no engine, no
        client and no configuration for one, and the recommendation lives in the documentation
        chapter addressed to whoever operates the shop.
    capability_refs: [CAP005, CAP018]
    consequences:
      positive:
        - "Anticipated: relevance, typo tolerance and faceting become engine configuration instead of PHP the shop maintains"
        - "Anticipated: search load leaves the database that is also serving carts and orders"
      negative:
        - "Anticipated: a second datastore to run, secure and back up, which most shared hosting does not offer"
        - "Anticipated: the index is eventually consistent with the catalog, so a price or stock change reaches search later than the product page"
        - "Observed: neither the PrestaShop source tree nor its documentation publishes a search-latency benchmark, so the size of the speed gain is not quantified by any source this model cites"
    links:
      docs:
        - "https://devdocs.prestashop-project.org/9/scale/"
        - "https://devdocs.prestashop-project.org/9/development/products-lifecycle/search-index/"
    declared_impact:
      direct:
        concepts: [shop.CN005]
        operations: [catalog.QRY001, shop.CMD014, shop.EVT010]
      transitive_hints:
        - "If a shop adopts an engine, the operation that changes is the indexer and not the search query: SearchProducts is already behind a CQRS boundary and its callers would not notice. That is the cheapest thing this model can tell a reader considering the move."
    evidence:
      - kind: documentation
        source: "PrestaShop/docs#scale/_index.md"
        date: "2026-09-19"
        summary: >-
          PrestaShop lists Elasticsearch, or a solution built on it, as one of four systems a
          merchant may add beside the LAMP stack, with Varnish, Redis and a CDN. It is written to
          whoever runs the shop, and it is the only place the product mentions an engine.
        confidence_impact: supports
      - kind: codebase-analysis
        source: "presta-code a27e912eef9, classes/Search.php and install-dev/data/db_structure.sql"
        date: "2026-09-19"
        summary: >-
          Search is served by ps_search_index and ps_search_word, filled by Search::indexation
          and read by Search::find with a weight-sum subquery. PS_SEARCH_MAX_WORDS_IN_TABLE at
          line 105 is 100000, above which the length coefficient is forced to 1. There is no
          search-engine client anywhere, and a case-insensitive grep for fulltext across the PHP
          and the SQL returns nothing, so neither the recorded chosen option nor the recorded
          baseline was in the code.
        confidence_impact: weakens
    motivation_refs:
      risks: [catalog.RSK005]
      assumptions: [catalog.ASM001]

  - id: DC003
    title: "PCI-compliant payment via gateway modules"
    summary: "Delegate all payment card handling to certified gateway modules (Stripe, PayPal, Mollie)."
    date: "2025-11"
    status: landed
    decision_scope: checkout
    rationale:
      problem: "Handling card data directly requires PCI DSS Level 1 compliance - annual audits costing $50k+ and specialized infrastructure."
      options:
        - "Build in-house payment processing (PCI Level 1)"
        - "Use tokenized gateway modules (PCI SAQ-A)"
        - "Redirect to hosted payment pages only"
      chosen: "Tokenized gateway modules - card data never touches PrestaShop servers"
    capability_refs: [CAP003]
    consequences:
      positive:
        - "PCI scope reduced to SAQ-A (self-assessment questionnaire)"
        - "Multiple payment methods via module ecosystem"
      negative:
        - "Dependent on third-party module quality and update cadence"
    code_refs:
      - path: "src/Core/Domain/Order/Payment/"
        role: implementation
        description: "Payment domain classes"
      - path: classes/PaymentModule.php
        role: implementation
        description: "validateOrder at line 194: the payment module calls it once it has the payment result, and core creates the order from the cart."
      - path: src/Core/Payment/PaymentOption.php
        role: model
        description: "What a payment module offers at checkout: setAction (line 182) for a redirect or a post, setForm (line 230) for an embedded form, setBinary (line 279) for a form that brings its own submit button."
      - path: PrestaShop/docs#modules/payment/_index.md
        role: documentation
        description: Lines 21-27 state the module contract; lines 60-67 the four payment option types; lines 91-103 the embedded scenario, where the card form is submitted to the payment service provider.
    motivation_refs:
      assumptions: [checkout.ASM001]
    declared_impact:
      direct:
        operations: [orders.CMD001]
        ui:
          screens: [checkout.SCR006]
          actions: [checkout.UAC011]
    discovery_stage: validated
    certainty: probable
    evidence:
      - kind: documentation
        source: PrestaShop/docs#modules/payment/_index.md
        date: 2026-10-14
        summary: "Lines 21-27: a payment module extends PaymentModule and returns PaymentOption objects from hookPaymentOptions. Lines 60-67 and 91-103: in the external, embedded and iframe cases the shopper submits the card form to the payment service provider, and the shop creates the order afterwards. Core takes no card itself; what a module renders in $form is the module's choice."
        confidence_impact: supports
      - kind: codebase-analysis
        source: presta-code a27e912eef9, classes, src and controllers
        date: 2026-10-14
        summary: "The order_payment table declares card_number, card_brand, card_expiration and card_holder columns (classes/order/OrderPayment.php lines 17-20 and 41-44), and no core code writes them: the only other reader is the back-office order view. A module may therefore store card data in the shop's database, so \"never touches PrestaShop servers\" holds for the documented scenarios, not by construction."
        confidence_impact: weakens
      - kind: assumption
        source: presta-docs and presta-code, searched for PCI
        date: 2026-10-14
        summary: "The PCI DSS levels, the SAQ-A scope and the audit cost in the rationale have no PrestaShop source: a case-insensitive search for PCI over presta-docs, presta-code/classes and presta-code/src returns nothing, and the payment chapter does not discuss compliance scope."
        confidence_impact: weakens

  - id: DC004
    title: "Server-side cart with session persistence"
    summary: "Store cart state server-side (database) rather than client-side (cookies/localStorage)."
    date: "2025-12"
    status: landed
    rationale:
      problem: "Client-side carts lose data on device switch, can be tampered with (price manipulation), and cannot be recovered after browser clear."
      options:
        - "Client-side cart (localStorage + cookies)"
        - "Server-side cart (database, session-keyed)"
        - "Hybrid (local for speed, server for persistence)"
      chosen: "Server-side cart - single source of truth, tamper-proof"
    capability_refs: [CAP001, CAP003]
    consequences:
      positive:
        - "Cart survives device switches and browser clears"
        - "Server-side price validation prevents tampering"
      negative:
        - "Every cart operation requires a server round-trip"
        - "Database load increases with active cart count"
    code_refs:
      - path: "src/Core/Domain/Cart/"
        role: implementation
        description: "Cart domain aggregate"
      - path: classes/Cart.php
        role: model
        description: The cart is an ObjectModel on the cart table (line 118); line prices come from Product::getPriceStatic (line 1176) when totals are computed by getOrderTotal (line 2197).
      - path: classes/controller/FrontController.php
        role: implementation
        description: "Lines 364-366: each storefront request loads the cart from the id_cart the cookie carries."
      - path: controllers/front/CartController.php
        role: implementation
        description: "Lines 55-59: a cart update reads the product, combination, customization, quantity and delivery address ids, and no price."
      - path: classes/Context.php
        role: implementation
        description: "Lines 350-353: with PS_CART_FOLLOWING on, signing in restores the customer's last cart that has no order."
    decision_scope: checkout
    declared_impact:
      direct:
        concepts: [checkout.CN001]
        operations: [checkout.CMD001, checkout.CMD009, checkout.CMD010, checkout.CMD011]
    discovery_stage: validated
    certainty: confirmed
    evidence:
      - kind: documentation
        source: PrestaShop/docs#development/components/cookie.md
        date: 2026-10-14
        summary: "Line 109: the storefront cookie carries id_cart, the integer id of the cart, so the cart itself is a database row and the browser holds only its key."
        confidence_impact: supports
      - kind: codebase-analysis
        source: presta-code a27e912eef9, controllers/front and classes/checkout
        date: 2026-10-14
        summary: "No storefront request parameter named price is read when a cart line is written: a search for getValue of price or unit_price in controllers/front and classes/checkout returns nothing, so a line's price is always recomputed on the server."
        confidence_impact: supports
      - kind: codebase-analysis
        source: presta-code a27e912eef9, install-dev
        date: 2026-10-14
        summary: A cart follows a signed-in customer to another device only when PS_CART_FOLLOWING is on (classes/Context.php lines 350-353), and the install data declares no default for that key, so the consequence "survives device switches" depends on a setting a merchant turns on.
        confidence_impact: weakens
    motivation_refs:
      goals: [checkout.GL004]

  - id: DC005
    title: "CQRS pattern for domain commands"
    summary: "Adopt Command-Query Responsibility Segregation across all domain aggregates for clear write/read separation."
    date: "2024-06"
    status: landed
    rationale:
      problem: "Legacy PrestaShop ObjectModel mixes read/write concerns, making it hard to optimize queries independently and enforce command validation."
      options:
        - "Continue with ObjectModel for all operations"
        - "CQRS with separate command/query handlers"
        - "Event sourcing with command/event store"
      chosen: "CQRS with separate command/query handlers - pragmatic write/read split without event sourcing complexity"
    capability_refs: [CAP001, CAP005]
    consequences:
      positive:
        - "Commands have explicit validation and authorization"
        - "Queries can be optimized independently (read replicas, caching)"
        - "Handler classes are small, focused, testable"
      negative:
        - "More classes per operation (Command + Handler + DTO)"
        - "Migration from ObjectModel is gradual - dual-path during transition"
    code_refs:
      - path: "src/Core/Domain/"
        role: implementation
        description: "CQRS domain layer root - all aggregates follow Command/CommandHandler pattern"
      - path: "PrestaShop/docs#development/architecture/domain/_index.md"
        role: documentation
        description: "Lines 10-17: the architecture is evolving toward domain-driven design, with CQRS at the heart of it."
    decision_scope: prestashop
    motivation_refs:
      trade_offs: [catalog.TRO001]
      inquiries: [admin.INQ002, shop.INQ001]
    links:
      related: [DC006]
    declared_impact:
      transitive_hints:
        - "Every command and query this model declares sits behind this decision: a handler in the Adapter namespace still reaches ObjectModel, and replacing it changes the handler, not the command or query, so the operations keep their identity when the legacy model is retired."
    discovery_stage: validated
    certainty: confirmed
    evidence:
      - kind: documentation
        source: PrestaShop/docs#development/architecture/domain/cqrs.md
        date: 2026-10-14
        summary: "Lines 13-17: CQRS was adopted during the back-office migration to Symfony, to reach data from the new pages without multiplying sources of truth and without calling ObjectModel directly. Line 27: Adapter handlers keep using ObjectModel so it can be replaced later without breaking commands and queries."
        confidence_impact: supports
      - kind: documentation
        source: PrestaShop/docs#development/architecture/migration-guide/strategy.md
        date: 2026-10-14
        summary: "Lines 75-93: CQRS is phase 3 of the migration project, introduced to build a frontier between migrated and legacy code; handlers belong to the Adapter namespace because they use legacy logic. The page describes the vision at the end of 2020, so the adoption predates the 2024-06 date this log records."
        confidence_impact: supports
      - kind: codebase-analysis
        source: presta-code a27e912eef9, src/Core/Domain and src/Adapter
        date: 2026-10-14
        summary: "Counted: 380 Command classes and 139 files in Query folders across 65 domain folders under src/Core/Domain; 368 command handlers and 133 query handlers under src/Adapter, so most handlers are still the legacy-backed adapters the documentation describes."
        confidence_impact: supports

  - id: DC006
    title: "Symfony framework migration"
    summary: "Migrate back-office from legacy controllers to Symfony framework with Twig templates."
    date: "2023-01"
    status: landed
    rationale:
      problem: "Legacy PrestaShop controllers use custom MVC with Smarty templates. No dependency injection, no standard routing, no modern testing tools."
      options:
        - "Continue custom MVC framework"
        - "Migrate to Symfony (gradual)"
        - "Rewrite as headless SPA"
      chosen: "Gradual Symfony migration - new pages in Symfony, legacy pages migrated incrementally"
    capability_refs: [CAP015, CAP016]
    consequences:
      positive:
        - "Standard Symfony DI container, routing, security"
        - "Twig templating with proper escaping (XSS prevention)"
        - "PHPUnit integration testing with Symfony kernel"
      negative:
        - "Two controller systems coexist during migration (legacy + Symfony)"
        - "Template migration from Smarty to Twig is labor-intensive"
