---
name: "Currency Management"
version: "1.0.0"
scope: international
tags: [localization, currency]

operations:

  addCurrency:
    id: international.CMD001
    kind: command
    name: "AddCurrency"
    description: "Create a new currency with ISO code, exchange rate, precision, and localized names/symbols. Supports both official (CLDR-backed) and unofficial (custom) currencies via separate command variants sharing the same aggregate."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN001
        action: create
    produces:
      operations: [international.EVT001]
      mode: all
    governed_by:
      - rule: international.VR001
    code_refs:
      - path: "src/Core/Domain/Currency/Command/AddCurrencyCommand.php"
        role: implementation
        description: "Official currency - ISO code validated against CLDR"
      - path: "src/Core/Domain/Currency/Command/AddUnofficialCurrencyCommand.php"
        role: implementation
        description: "Unofficial currency - custom ISO code allowed"
      - path: "src/Core/Domain/Currency/Command/AbstractAddCurrencyCommand.php"
        role: implementation
        description: "Shared attribute definitions"

  editCurrency:
    id: international.CMD002
    kind: command
    name: "EditCurrency"
    description: "Update an existing currency's exchange rate, precision, names, symbols, or status."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN001
        action: update
    produces:
      operations: [international.EVT002]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Currency/Command/EditCurrencyCommand.php"
        role: implementation
      - path: "src/Core/Domain/Currency/Command/EditUnofficialCurrencyCommand.php"
        role: implementation
      - path: "src/Core/Domain/Currency/Command/AbstractEditCurrencyCommand.php"
        role: implementation

  deleteCurrency:
    id: international.CMD003
    kind: command
    name: "DeleteCurrency"
    description: "Delete a currency. The default (reference) currency cannot be deleted."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN001
        action: delete
    produces:
      operations: [international.EVT003]
      mode: all
    governed_by:
      - rule: international.VR002
    code_refs:
      - path: "src/Core/Domain/Currency/Command/DeleteCurrencyCommand.php"
        role: implementation
      - path: "src/Core/Domain/Currency/Command/BulkDeleteCurrenciesCommand.php"
        role: implementation

  toggleCurrencyStatus:
    id: international.CMD004
    kind: command
    name: "ToggleCurrencyStatus"
    description: "Enable or disable a currency. Disabled currencies are not available in storefront currency selectors."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN001
        action: update
    produces:
      operations: [international.EVT004]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Currency/Command/ToggleCurrencyStatusCommand.php"
        role: implementation
      - path: "src/Core/Domain/Currency/Command/BulkToggleCurrenciesStatusCommand.php"
        role: implementation

  refreshExchangeRates:
    id: international.CMD005
    kind: command
    name: "RefreshExchangeRates"
    description: "Fetch current exchange rates from an external provider and update all non-reference currencies. Depends on configured exchange rate service."
    delivery_priority: should-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN003
        action: update
    produces:
      operations: [international.EVT005, international.DOC001]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Currency/Command/RefreshExchangeRatesCommand.php"
        role: implementation

  setDefaultCurrency:
    id: international.CMD006
    kind: command
    name: "SetDefaultCurrency"
    description: "Designate a currency as the store's default (reference) currency. Every exchange rate in the store is expressed relative to it, so changing it re-bases the whole table. There is no CQRS command for this: it is the PS_CURRENCY_DEFAULT configuration value, written by the Localization preferences form, and the operation is modelled because the intent is real even though the implementation is a settings write."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN001
        action: update
    produces:
      operations: [international.EVT006]
      mode: all
    governed_by:
      - rule: international.VR002
    code_refs:
      - path: "src/Adapter/Localization/LocalizationConfiguration.php"
        role: implementation
        description: "updateConfiguration() writes PS_CURRENCY_DEFAULT; there is no Currency/Command class for it."

  # --- Events ---

  currencyCreated:
    id: international.EVT001
    kind: event
    name: "CurrencyCreated"
    description: "A new currency has been added (official or unofficial). Modules observe it as the hook actionObjectCurrencyAddAfter, composed at runtime by ObjectModel when the Currency row is inserted."
    tags: [hook:actionObjectCurrencyAddAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 614-615 fire actionObject<Class>AddAfter for every persisted class."
      - path: "classes/Currency.php"
        role: model

  currencyUpdated:
    id: international.EVT002
    kind: event
    name: "CurrencyUpdated"
    description: "A currency's configuration has been modified. Modules observe it as the hook actionObjectCurrencyUpdateAfter, composed at runtime by ObjectModel when the Currency row is updated."
    tags: [hook:actionObjectCurrencyUpdateAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 846-847 fire actionObject<Class>UpdateAfter for every persisted class."
      - path: "classes/Currency.php"
        role: model

  currencyDeleted:
    id: international.EVT003
    kind: event
    name: "CurrencyDeleted"
    description: "One or more currencies have been deleted. Modules observe it as the hook actionObjectCurrencyDeleteAfter, composed at runtime by ObjectModel when the Currency row is deleted."
    tags: [hook:actionObjectCurrencyDeleteAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 922-923 fire actionObject<Class>DeleteAfter for every persisted class."
      - path: "classes/Currency.php"
        role: model

  currencyStatusToggled:
    id: international.EVT004
    kind: event
    name: "CurrencyStatusToggled"
    description: "A currency's enabled/disabled status has changed. Modules observe it as the hook actionObjectCurrencyUpdateAfter, composed at runtime by ObjectModel when the Currency row is updated. A toggle is an update, so it is the same hook a field edit fires and a listener cannot tell them apart."
    tags: [hook:actionObjectCurrencyUpdateAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 846-847 fire actionObject<Class>UpdateAfter for every persisted class."
      - path: "classes/Currency.php"
        role: model

  exchangeRatesRefreshed:
    id: international.EVT005
    kind: event
    name: "ExchangeRatesRefreshed"
    description: "Exchange rates have been refreshed from an external provider. Modules observe it as the hook actionObjectCurrencyUpdateAfter, composed at runtime by ObjectModel when the Currency row is updated. One refresh run fires it once per non-reference currency, not once for the run."
    tags: [hook:actionObjectCurrencyUpdateAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 846-847 fire actionObject<Class>UpdateAfter for every persisted class."
      - path: "classes/Currency.php"
        role: model

  defaultCurrencyChanged:
    id: international.EVT006
    kind: event
    name: "DefaultCurrencyChanged"
    description: "The store's default (reference) currency has been changed. No hook is fired for this transition: the default currency is the PS_CURRENCY_DEFAULT configuration value, not an ObjectModel write, so modules cannot observe it."
    code_refs:
      - path: "src/Adapter/Localization/LocalizationConfiguration.php"
        role: implementation
        description: "updateConfiguration() writes PS_CURRENCY_DEFAULT with no Hook::exec around it."

  # --- Queries ---

  getCurrencyForEditing:
    id: international.QRY001
    kind: query
    dispatch: inprocess
    responses:
      - code: "200"
        type: success
        description: "The currency, in the shape the edit form needs."
        schema: CurrencyResource
        contentType: application/json
    name: "GetCurrencyForEditing"
    description: "Retrieve a currency's full configuration for the edit form."
    delivery_priority: must-have
    code_refs:
      - path: "src/Core/Domain/Currency/Query/GetCurrencyForEditing.php"
        role: implementation

  getCurrencyExchangeRate:
    id: international.QRY002
    kind: query
    name: "GetCurrencyExchangeRate"
    description: "Retrieve the current exchange rate for a specific currency."
    delivery_priority: must-have
    dispatch: inprocess
    code_refs:
      - path: "src/Core/Domain/Currency/Query/GetCurrencyExchangeRate.php"
        role: implementation

  getReferenceCurrency:
    id: international.QRY003
    kind: query
    name: "GetReferenceCurrency"
    description: "Retrieve the store's default (reference) currency."
    delivery_priority: must-have
    dispatch: inprocess
    code_refs:
      - path: "src/Core/Domain/Currency/Query/GetReferenceCurrency.php"
        role: implementation

  # ── The rate table the refresh leaves behind (1 DOC) ──
  #
  # Every context pricing in a non-default currency reads these rates, and reads them as of the last
  # run rather than as of now. The lag is the coupling: assumption orders.ASM001 says the cron refresh
  # exists because of shared hosting and would be a pub/sub topic without it, which is the same
  # coupling moved onto a wire.

  exchangeRateSnapshot:
    id: international.DOC001
    kind: document
    name: "ExchangeRateSnapshot"
    description: "The conversion rate for every non-reference currency, as left by the last refresh run. A reader sees the rates the run wrote, not the rates the provider holds now."
    code_refs:
      - path: "classes/Currency.php"
        role: model

errors:
  currencyNotFound:
    id: international.ERR001
    name: "CurrencyNotFound"
    description: "The specified currency does not exist."
    category: not-found
    severity: error
    http_status: 404

  currencyConstraintViolation:
    id: international.ERR002
    name: "CurrencyConstraintViolation"
    description: "Currency data violates constraints (empty name, empty symbol, invalid ISO code, invalid exchange rate, invalid precision)."
    category: validation
    severity: error
    http_status: 422

questions:

  - id: international.QN003
    name: "What A Price Converts To"
    statement: "What is this price in the shopper's currency, and how recent is the rate behind it?"
    category: measurement
    priority: high
    bounded_context_ref: prestashop.BC006
    answered_by: [international.QRY002, international.QRY003, international.CMD005, international.DOC001]
    concepts: [international.CN001, international.CN003]
    resolved: true
    resolution: >
      GetCurrencyExchangeRate returns the stored rate against the reference currency;
      RefreshExchangeRates is the only thing that moves it, and the ExchangeRateSnapshot it
      consumes carries the date the answer is as of.
