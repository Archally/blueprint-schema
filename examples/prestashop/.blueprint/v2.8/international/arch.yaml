version: 1.0.0
name: International (PrestaShop)
description: Architecture of the PrestaShop International bounded context.
tags:
  - prestashop
  - e-commerce
  - php
  - symfony
system_ref: PRT002
contexts:
  - id: prestashop.BC006
    name: International
    kind: support
    value_stream_ref: VS002
    complexity: transformation
    business_model_role: compliance-enforcer
    evolution: product
    model_traits: [information-holder, structurer]
    summary: Currencies, countries, zones, languages, tax rules - localization backbone.
    owned_by:
      team: TM006
    responsibilities:
      - Currency management and exchange rates
      - Country, state, and zone hierarchies
      - Language and translation management
      - Tax rule groups and tax rate configuration
      - Locale-specific formatting (date, number, address)
    services:
      - id: prestashop.SVC006
        name: InternationalService
        kind: api
        summary: REST API for currency, tax, country, and language management.
        contracts:
          scheduledtransfer:
            contract_name: exchange-rates
            slice: international
            write:
              - international.DOC001
          openapi:
            contract_name: international-api
            slice: international
            expose:
              - international.QRY001
              - international.QRY010
              - international.QRY005
              - international.QRY004
