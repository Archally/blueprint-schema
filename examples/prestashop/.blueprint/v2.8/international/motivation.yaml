---
version: "1.0.0"
scope: international

goals:
  - id: international.GL001
    statement: "Accurate multi-currency pricing with fresh exchange rates"
    description: >
      Ensure all currencies display correct prices by maintaining fresh
      exchange rates. Stale rates cause customers to overpay/underpay,
      eroding trust and profitability.
    summary: "Accurate multi-currency pricing"
    priority: high
    measure: ">= 95% of currencies updated within 24 hours via exchange rate refresh"
    affects:
      operation_refs: [international.CMD005, international.QRY002]
      concept_refs: [international.CN001, international.CN003]
      process_refs: [international.PRC001]
    discovery_stage: validated
    certainty: confirmed

  - id: international.GL002
    statement: "Correct tax calculation for every zone/country combination"
    description: >
      Tax rules must produce correct rates for every geographic location
      to ensure regulatory compliance and prevent customer over/undercharging.
    summary: "Tax calculation accuracy"
    priority: critical
    measure: "100% of configured zone/country combinations produce correct tax rate"
    affects:
      operation_refs: [international.CMD027, international.CMD034, international.QRY012]
      concept_refs: [international.CN007, international.CN008, international.CN009]
      process_refs: [international.PRC002]
    discovery_stage: committed
    certainty: confirmed

  - id: international.GL003
    statement: "Complete localization coverage for target markets"
    description: >
      Every target market has its language, currency, and geographic
      configuration complete - enabling the store to serve international
      customers without gaps.
    summary: "Localization completeness"
    priority: high
    measure: "100% of target market languages, currencies, and countries configured"
    affects:
      operation_refs: [international.CMD007, international.CMD011, international.CMD019]
      concept_refs: [international.CN002, international.CN004, international.CN006]
      process_refs: [international.PRC001]
    discovery_stage: validated
    certainty: probable

risks:
  - id: international.RSK001
    statement: "Stale exchange rates cause incorrect multi-currency pricing"
    description: >
      If exchange rate refresh fails or is not scheduled, customers see
      outdated prices. For volatile currencies, even 24-hour staleness
      can mean significant price discrepancy.
    summary: "Exchange rate staleness"
    likelihood: medium
    impact: high
    affects:
      operation_refs: [international.CMD005, international.QRY002]
      concept_refs: [international.CN001, international.CN003]
      process_refs: [international.PRC001]
    mitigation: "RefreshExchangeRates command with external provider integration. Monitor freshness via KPI (exchange_rate_freshness). Alert if any rate > 24h stale."
    goal_refs:
      - international.GL001
    discovery_stage: validated
    certainty: confirmed

  - id: international.RSK002
    statement: "Tax rule gaps lead to zero-tax or wrong-tax charges"
    description: >
      If a zone/country combination has no matching tax rule, the system
      may apply zero tax (revenue loss, compliance risk) or fall back
      incorrectly. Complex EU VAT scenarios are especially prone to gaps.
    summary: "Tax rule coverage gaps"
    likelihood: medium
    impact: high
    affects:
      operation_refs: [international.CMD027, international.CMD034]
      concept_refs: [international.CN008, international.CN009]
      process_refs: [international.PRC002]
    mitigation: "Validation rule VR008 prevents duplicate bindings. Tax rules group editing UI should show uncovered zones. Regular audit of tax rule coverage."
    goal_refs:
      - international.GL002
    discovery_stage: validated
    certainty: confirmed

  - id: international.RSK003
    statement: "Country/zone restructuring breaks shipping and tax configurations"
    description: >
      Deleting or reassigning zones can orphan carrier configurations
      and tax rules that reference those zones. Cascading effects across
      Shipping and Taxation contexts.
    summary: "Geographic restructuring cascade"
    likelihood: low
    impact: high
    affects:
      operation_refs: [international.CMD013, international.CMD021, international.CMD032]
      concept_refs: [international.CN004, international.CN006]
      process_refs: [international.PRC001]
    mitigation: "Zone deletion should check for dependent carriers and tax rules. Cross-context impact analysis before geographic changes."
    goal_refs:
      - international.GL003
    discovery_stage: exploring
    certainty: probable

non_goals:
  - id: international.NG001
    statement: "No automatic regulatory compliance monitoring"
    reason: >
      Tax rules, GDPR settings, and legal pages are manually configured by
      the merchant. There is no automated feed for tax rate changes,
      regulatory updates, or compliance requirement monitoring. Merchants
      must track regulatory changes themselves or use specialized modules.
    discovery_stage: committed
    certainty: confirmed

assumptions:
  - id: international.ASM001
    domain_scope: international
    statement: "PrestaShop keeps serving the currency feed the refresh command reads"
    consequence: >
      RefreshExchangeRates reads one hard-coded address:
      api.prestashop.com/xml/currencies.xml, set in config/defines_uri.inc.php
      and repeated in ExchangeRateProvider. It is not the ECB and not
      configurable, so every shop's automatic rates depend on one endpoint
      operated by the vendor, reached over plain HTTP. If it stops answering, or
      answers wrongly, every multi-currency shop is either frozen at its last
      rates or priced on bad ones, and the merchant's only recourse is to type
      rates in by hand.
    risk_refs:
      - international.RSK001
    discovery_stage: validated
    certainty: probable

trade_offs:
  - id: international.TRO001
    choice: "Keeping tax correct against the work of setting it up"
    selected: "96 localization packs the merchant imports once, and edits by hand thereafter"
    rejected: "A live regulatory feed that keeps rates current on its own"
    rationale: >
      LocalizationPack::_installTaxes reads a country's XML and creates its
      taxes, tax rules groups and tax rules in one act, and core ships 96 of
      those files. That gets a new shop to a correct starting point in a single
      import with no network dependency and nothing to pay for, which matters
      because most PrestaShop installs are small and self-hosted. Nothing in
      core updates a rate afterwards: there is no tax feed and no refresh
      command, which is what NG001 records.
    accepted_risk: "A shop's tax rates are correct as of the day its pack was imported and drift silently from that day on; a VAT change reaches the shop only when a person edits the rule."
    discovery_stage: validated
    certainty: confirmed

inquiries:
  - id: international.INQ001
    statement: "Should the system support real-time exchange rate feeds with automatic scheduling?"
    summary: "Automated exchange rate scheduling"
    description: >
      Measured 2026-09-19: there are two questions here, not one, and neither
      is configurable today. The provider is a hard-coded address,
      api.prestashop.com/xml/currencies.xml in config/defines_uri.inc.php and
      in ExchangeRateProvider, with no setting to point it elsewhere; and the
      schedule does not exist at all, because RefreshExchangeRates runs when
      something calls it and core registers no cron. A merchant who wants fresh
      rates has to arrange the second half themselves, which is what ASM001 and
      RSK001 are both about.
    category: technical
    affects:
      operation_refs: [international.CMD005]
      concept_refs: [international.CN003]
      process_refs: [international.PRC001]
    goal_refs:
      - international.GL001
    blocking: false
    status: investigating
    discovery_stage: exploring
    certainty: speculative

  - id: international.INQ002
    statement: "Should the system support EU VAT MOSS (Mini One Stop Shop) for digital goods?"
    summary: "EU VAT MOSS support"
    description: >
      EU VAT MOSS requires charging VAT based on the customer's country
      (not the seller's). This requires customer geolocation and dynamic
      tax rate selection at checkout - beyond the current zone-based model.
    category: business
    affects:
      operation_refs: [international.CMD034]
      concept_refs: [international.CN009]
      process_refs: [international.PRC002]
    goal_refs:
      - international.GL002
    blocking: false
    status: investigating
    discovery_stage: exploring
    certainty: speculative
