---
name: "Language Management"
version: "1.0.0"
scope: international
tags: [localization, language]

operations:

  addLanguage:
    id: international.CMD007
    kind: command
    name: "AddLanguage"
    description: "Create a new store language with ISO code, locale, name, RTL flag, and flag image."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN002
        action: create
    produces:
      operations: [international.EVT007]
      mode: all
    governed_by:
      - rule: international.VR003
    code_refs:
      - path: "src/Core/Domain/Language/Command/AddLanguageCommand.php"
        role: implementation

  editLanguage:
    id: international.CMD008
    kind: command
    name: "EditLanguage"
    description: "Update a language's name, locale, RTL flag, or status."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN002
        action: update
    produces:
      operations: [international.EVT008]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Language/Command/EditLanguageCommand.php"
        role: implementation

  deleteLanguage:
    id: international.CMD009
    kind: command
    name: "DeleteLanguage"
    description: "Delete a language. The default language cannot be deleted."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN002
        action: delete
    produces:
      operations: [international.EVT009]
      mode: all
    governed_by:
      - rule: international.VR004
    code_refs:
      - path: "src/Core/Domain/Language/Command/DeleteLanguageCommand.php"
        role: implementation
      - path: "src/Core/Domain/Language/Command/BulkDeleteLanguagesCommand.php"
        role: implementation

  toggleLanguageStatus:
    id: international.CMD010
    kind: command
    name: "ToggleLanguageStatus"
    description: "Enable or disable a language. Disabled languages are not available in the storefront language selector."
    delivery_priority: must-have
    initiated_by: [international.ACT001]
    dispatch: inprocess
    materializes:
      - concept: international.CN002
        action: update
    produces:
      operations: [international.EVT010]
      mode: all
    code_refs:
      - path: "src/Core/Domain/Language/Command/ToggleLanguageStatusCommand.php"
        role: implementation
      - path: "src/Core/Domain/Language/Command/BulkToggleLanguagesStatusCommand.php"
        role: implementation

  # --- Events ---

  languageCreated:
    id: international.EVT007
    kind: event
    name: "LanguageCreated"
    description: "A new language has been added. Modules observe it as the hook actionObjectLanguageAddAfter, composed at runtime by ObjectModel when the Language row is inserted."
    tags: [hook:actionObjectLanguageAddAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 614-615 fire actionObject<Class>AddAfter for every persisted class."
      - path: "classes/Language.php"
        role: model

  languageUpdated:
    id: international.EVT008
    kind: event
    name: "LanguageUpdated"
    description: "A language's configuration has been modified. Modules observe it as the hook actionObjectLanguageUpdateAfter, composed at runtime by ObjectModel when the Language row is updated."
    tags: [hook:actionObjectLanguageUpdateAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 846-847 fire actionObject<Class>UpdateAfter for every persisted class."
      - path: "classes/Language.php"
        role: model

  languageDeleted:
    id: international.EVT009
    kind: event
    name: "LanguageDeleted"
    description: "One or more languages have been deleted. Modules observe it as the hook actionObjectLanguageDeleteAfter, composed at runtime by ObjectModel when the Language row is deleted."
    tags: [hook:actionObjectLanguageDeleteAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 922-923 fire actionObject<Class>DeleteAfter for every persisted class."
      - path: "classes/Language.php"
        role: model

  languageStatusToggled:
    id: international.EVT010
    kind: event
    name: "LanguageStatusToggled"
    description: "A language's enabled/disabled status has changed. Modules observe it as the hook actionObjectLanguageUpdateAfter, composed at runtime by ObjectModel when the Language row is updated. A toggle is an update, so it is the same hook a field edit fires."
    tags: [hook:actionObjectLanguageUpdateAfter]
    code_refs:
      - path: "classes/ObjectModel.php"
        role: implementation
        description: "Lines 846-847 fire actionObject<Class>UpdateAfter for every persisted class."
      - path: "classes/Language.php"
        role: model

  # --- Queries ---

  getLanguageForEditing:
    id: international.QRY004
    kind: query
    dispatch: inprocess
    responses:
      - code: "200"
        type: success
        description: "The language, in the shape the edit form needs."
        schema: LanguageResource
        contentType: application/json
    name: "GetLanguageForEditing"
    description: "Retrieve a language's full configuration for the edit form."
    delivery_priority: must-have
    code_refs:
      - path: "src/Core/Domain/Language/Query/GetLanguageForEditing.php"
        role: implementation

errors:
  languageNotFound:
    id: international.ERR003
    name: "LanguageNotFound"
    description: "The specified language does not exist."
    category: not-found
    severity: error
    http_status: 404
